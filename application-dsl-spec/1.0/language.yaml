    target: runtime
    level: MUST
    statement: >-
      On a run that is not a resumption, a conforming runtime MUST start the
      machine-instance in its initial state with the `Seed` signal and, when a
      request file is supplied, MUST deliver the file's exact bytes as the seed
      result's output; an unreadable request file MUST refuse the start.
