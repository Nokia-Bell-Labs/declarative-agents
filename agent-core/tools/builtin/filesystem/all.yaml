# Filesystem builtin declarations.
includes:
  - ../read.yaml
  - ../write.yaml
  - ../edit.yaml
  - ../find.yaml
  - ../list-files.yaml

tools:
  - name: list_resource
    type: builtin
    category: boundary
    init: list_resource
    description: Shape externally discovered paths from a configured filesystem resource.
    problem: Machine and REST words need resource metadata without hiding recursive traversal inside Go.
    goals:
      - Validate candidate paths under a trusted resource root.
      - Return path, name, category, extension, size, and configured metadata.
      - Keep include, extension, and presentation category rules in trusted tool config.
    requirements:
      input:
        - A preceding declared filesystem CLI word supplies one resource-relative candidate path per line.
      output:
        - Output includes resource-relative document entries with path, name, category, extension, and size.
      errors:
        - Unknown resources, root failures, traversal denial, and metadata failures emit declared signals.
    non_goals:
      - Does not read document body content.
      - Does not recursively traverse directories.
      - Does not let runtime input choose roots, include patterns, extension allowlists, category rules, or parser modes.
    parameters:
      type: object
      properties: {}
      additionalProperties: false
    emits: [DocumentListReady, DocumentResourceDenied, CommandError]
    output:
      description: Structured document list entries from the configured resource.
      schema:
        type: array
        items:
          type: object
          properties:
            path: {type: string}
            name: {type: string}
            category: {type: string}
            extension: {type: string}
            size: {type: integer}
    side_effects:
      - kind: filesystem_read
        target: configured_document_resource
        state: read_only
    reversibility:
      classification: reversible
    undo:
      strategy: noop
      description: Resource listing is read-only.
    config:
      resources: {}

    errors:
    - signal: DocumentResourceDenied
      condition: a candidate path is absolute, contains traversal, or resolves outside the configured resource root
      message_shape: 'resource_denied: <reason>'
      state_after_failure: no resource content or runtime state is changed
    - signal: CommandError
      condition: the configured resource is unknown or filesystem metadata cannot be read or encoded
      message_shape: 'list_resource: <error>'
      state_after_failure: no successful document list is published
    relationships:
      before: [configured filesystem CLI word]
      after: [read_resource, machine-selected successor]
  - name: read_resource
    type: builtin
    category: boundary
    init: read_resource
    description: Read one document from a configured filesystem resource.
    problem: Machine and REST words need safe document reads whose corpus authority stays in trusted configuration.
    goals:
      - Read one resource-relative document path.
      - Enforce configured include rules, extension allowlists, size limits, and response modes.
      - Return raw content, parsed content, content type, extension, and size when configured.
    requirements:
      input:
        - Runtime input may choose only the configured resource name and resource-relative path.
      output:
        - Output includes path, content metadata, raw content when enabled, and parsed content when enabled.
      errors:
        - Missing files, denied paths, parse failures, and infrastructure failures emit distinct declared signals.
    non_goals:
      - Does not mutate documents or approve patch suggestions.
      - Does not let runtime input choose parser mode, maximum bytes, root, include patterns, or extension policy.
    parameters:
      type: object
      properties:
        resource:
          type: string
          description: Configured resource name.
        path:
          type: string
          description: Resource-relative document path.
      required: [resource, path]
    emits: [DocumentReady, DocumentMissing, DocumentResourceDenied, DocumentParseFailed, CommandError]
    output:
      description: Structured document detail from the configured resource.
      schema:
        type: object
        properties:
          path: {type: string}
          raw: {type: string}
          parsed: {type: object}
          content_type: {type: string}
          extension: {type: string}
          size: {type: integer}
    side_effects:
      - kind: filesystem_read
        target: configured_document_resource
        state: read_only
    reversibility:
      classification: reversible
    undo:
      strategy: noop
      description: Resource reading is read-only.
    config:
      resources: {}
    errors:
    - signal: DocumentMissing
      condition: the selected resource-relative file does not exist
      message_shape: resource not found
      state_after_failure: no document content or runtime state is changed
    - signal: DocumentResourceDenied
      condition: the path, extension, size, file kind, or include policy denies the read
      message_shape: 'resource_denied: <reason>'
      state_after_failure: no document content is returned
    - signal: DocumentParseFailed
      condition: configured parsed-YAML mode cannot decode the document
      message_shape: 'parse_failed: <yaml error>'
      state_after_failure: no successful document detail is published
    - signal: CommandError
      condition: the resource is unknown or an unclassified filesystem or encoding failure occurs
      message_shape: 'read_resource: <error>'
      state_after_failure: no runtime or filesystem state is changed
    relationships:
      before: [list_resource, machine-selected predecessor]
      after: [machine-selected successor]
