rest:
  version: v1
  auth:
    none: {type: none}
  limits:
    control:
      timeout: 5s
      read_timeout: 5s
      max_request_bytes: 16384
      max_response_bytes: 65536
      redirect: {mode: none}
      network:
        schemes: [http]
        hosts: [127.0.0.1, localhost]
        ports: [${COLLECTOR_CONTROL_PORT:-18191}]
        allow_public_listener: true
    monitor:
      timeout: 5s
      read_timeout: 5s
      max_request_bytes: 4096
      max_response_bytes: 1048576
      redirect: {mode: none}
      network:
        schemes: [http]
        hosts: [127.0.0.1, localhost]
        ports: [${COLLECTOR_MONITOR_PORT:-18192}]
        allow_public_listener: true
    query:
      timeout: 10s
      read_timeout: 5s
      max_request_bytes: 4096
      max_response_bytes: 1048576
      redirect: {mode: none}
      network:
        schemes: [http]
        hosts: [127.0.0.1, localhost]
        ports: [${COLLECTOR_QUERY_PORT:-18193}]
        allow_public_listener: true
  servers:
    collector_control:
      address: ${COLLECTOR_BIND_HOST:-127.0.0.1}:${COLLECTOR_CONTROL_PORT:-18191}
      limits_ref: control
      queue: {name: collector_control, capacity: 8, timeout: 100ms}
      shutdown: {timeout: 5s, drain_policy: drain_then_stop}
      endpoints:
        exit:
          method: POST
          path: /api/lifecycle/exit
          binding: emit_signal
          signal: ExitRequested
          request:
            body_schema:
              type: object
              properties:
                reason: {type: string}
          response:
            output: {accepted: "true"}
        health: {method: GET, path: /api/lifecycle/health, binding: health}
    collector_monitor:
      address: ${COLLECTOR_BIND_HOST:-127.0.0.1}:${COLLECTOR_MONITOR_PORT:-18192}
      limits_ref: monitor
      queue: {name: collector_monitor, capacity: 8, overflow: reject, timeout: 100ms}
      shutdown:
        timeout: 2s
        drain_policy: drain
        stop_listeners: true
        unblock_await_signal: ServerStopped
      endpoints:
        machine_spec:  {method: GET, path: /monitor/machine, binding: read_state, monitor_view: machine_spec}
        current_state: {method: GET, path: /monitor/state, binding: read_state, monitor_view: current_state}
        tools:         {method: GET, path: /monitor/tools, binding: read_state, monitor_view: tools}
        metrics:       {method: GET, path: /monitor/metrics, binding: read_state, monitor_view: metrics}
        recent_events: {method: GET, path: /monitor/events, binding: read_state, monitor_view: events}
        event_stream:  {method: GET, path: /monitor/events/stream, binding: stream_events, monitor_view: events}
        control_exit:
          method: POST
          path: /monitor/control/exit
          binding: emit_signal
          signal: ExitRequested
          request:
            body_schema:
              type: object
              properties:
                reason: {type: string}
          response:
            output: {accepted: "true"}
    collector_query:
      address: ${COLLECTOR_BIND_HOST:-127.0.0.1}:${COLLECTOR_QUERY_PORT:-18193}
      limits_ref: query
      shutdown: {timeout: 2s, drain_policy: drain}
      endpoints:
        list_traces:
          method: GET
          path: /query/traces
          request:
            query: {page_size: {type: integer}, offset: {type: integer}}
          binding: machine_request
          machine_request:
            profile: profile.yaml
            machine: query-machine.yaml
            timeout: 10s
            request:
              query: {page_size: $.page_size, offset: $.offset}
            response:
              terminal_states:
                TracesReady:
                  status: 200
                  content_type: application/json
                  body: {traces: $.traces, total: $.total, offset: $.offset, page_size: $.page_size}
                Failed: {status: 500, content_type: application/json, body: {error: spool_read_error}}
        get_trace:
          method: GET
          path: /query/traces/{trace_id}
          request:
            path: {trace_id: {type: string}}
          binding: machine_request
          machine_request:
            profile: profile.yaml
            machine: query-machine.yaml
            initial_signal: GetTraceRequested
            timeout: 10s
            request:
              path: {trace_id: $.trace_id}
            response:
              terminal_states:
                TraceReady:
                  status: 200
                  content_type: application/json
                  body: {trace_id: $.trace_id, spans: $.spans, span_count: $.span_count}
                Failed: {status: 500, content_type: application/json, body: {error: spool_read_error}}
