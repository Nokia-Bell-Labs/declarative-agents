  foundation:
    - {path: README.md, status: planned_documentation, role: Human entry point and status notice.}
    - {path: docs/VISION.yaml, status: planned_documentation, role: Problem, goals, boundaries, and exclusions.}
    - {path: docs/ARCHITECTURE.yaml, status: planned_documentation, role: Topology, flows, authority, and planned structure.}
    - {path: docs/SPECIFICATIONS.yaml, status: planned_documentation, role: Planned corpus and traceability index.}
    - {path: docs/road-map.yaml, status: planned_documentation, role: Release 00.0 plan and evidence status.}
  planned_configuration:
    - {path: agents/workflow-orchestrator/, status: planned, role: Saga coordination and publication profile.}
    - {path: agents/structure-editor/, status: planned, role: Structure editing profile.}
    - {path: agents/voice-editor/, status: planned, role: Voice editing profile.}
    - {path: agents/style-editor/, status: planned, role: Style tightening profile.}
    - {path: agents/voice-critic/, status: planned, role: Independent assurance profile.}
    - {path: agents/corpus-ingest/, status: planned, role: Thin canonical ingest wrapper.}
  planned_specifications:
    - {path: docs/specs/software-requirements/srd001-voice-forge-services.yaml, status: specified, role: Planned service topology, role bindings, lifecycle, failure, scaling, and authority contract.}
    - {path: docs/specs/software-requirements/srd002-writing-saga-workproducts.yaml, status: specified, role: Planned immutable workproduct, manifest, retry, recovery, idempotency, and publication contract.}
    - {path: docs/specs/software-requirements/srd003-writing-agent-tools.yaml, status: specified, role: Closed ToolDef vocabulary, factory reuse, signals, errors, effects, compensation, and exclusive authority.}
    - {path: docs/specs/software-requirements/srd004-workflow-orchestrator.yaml, status: specified, role: Flat orchestration states, signals, transitions, persistence, responsible-stage replay, recovery, publication, and terminal outcomes.}
    - {path: docs/specs/software-requirements/srd005-structure-editor.yaml, status: specified, role: Flat request, section-and-outline retrieval, one refinement, structure-only editing, semantic constraints, outcomes, and provenance.}
    - {path: docs/specs/software-requirements/, status: planned, role: Remaining SRDs srd006 through srd008.}
    - {path: docs/specs/use-cases/rel00.0-uc001-edit-document.yaml, status: planned, role: End-to-end release scenario.}
    - {path: docs/specs/test-suites/test-rel00.0-voice-forge.yaml, status: planned, role: Release tracer and evidence plan.}

implementation_status:
  current_focus: |
    SRDs srd001 through srd005 specify service boundaries, the writing saga and
    workproducts, the closed tool vocabulary, the workflow-orchestrator machine,
    and the structure-editor machine. SRDs srd006 through srd008, the release use case, test suite,
    profiles, machines, tools, services,
    integration evidence, and root registrations remain planned.
  overall: documentation_only_planned
  progress:
    - specified: srd001 service topology, role bindings, lifecycle, scaling, failure, interfaces, and authority.
    - specified: srd002 workspace schema, artifact lineage, manifest state, stage contracts, retries, recovery, and publication.
    - specified: srd003 tool words, factory reuse, ownership, signals, errors, effects, compensation, and authority closure.
    - specified: srd004 flat orchestration states, action mappings, persistence order, responsible-stage replay, recovery, publication, budgets, and terminal outcomes.
    - specified: srd005 flat structure request, retrieval, grounding, one refinement, structure-only edit, semantic constraints, response, and terminal outcomes.
    - planned: srd006 through srd008 and executable reciprocal release traces.
    - planned: Five application-local state machines and the corpus-ingest wrapper.
    - planned: RAG, Chroma, Ollama, GitHub CLI, and Pangram integrations.
    - planned: Persistent saga workspace, retries, recovery, and publication.
    - planned: Structural, boundary, failure, recovery, and end-to-end tests.
  executable_evidence: none
  registry_status: not_registered

