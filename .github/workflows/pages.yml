name: Publish the Libretto specification to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "application-dsl-spec/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/setup-go@v5
        with:
          go-version-file: application-dsl-spec/magefiles/go.mod
      - name: Install mage
        run: go install github.com/magefile/mage@v1.17.2
      - name: Build the site
        working-directory: application-dsl-spec
        run: mage site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: application-dsl-spec/generated-files/site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
