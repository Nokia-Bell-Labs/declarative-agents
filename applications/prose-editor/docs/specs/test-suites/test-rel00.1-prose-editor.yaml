id: test-rel00.1-prose-editor
title: Prose Editor Release 00.1 Tracer Test Suite
release: "00.1"
test_case_count: 12
status: implemented
runtime_status: interpreter_driven_deterministic_tracer

overview: |
  Twelve deterministic cases execute the shipped workflow-orchestrator,
  specialist-editor, and voice-critic machines through agent-core and prove the
  Release 00.1 source-capture, structure retrieval/edit, independent no-Pangram
  criticism, one bounded structure retry, immutable lineage, restart recovery,
  and local-finalization tracer. The prior
  thirteenth telemetry-service case was inconsistent with this release: 00.1
  ships local programs and a hermetic tracer, not served child processes.
  Telemetry remains outside this release's executable claim.

  All boundary responses and corpora are immutable fixtures. No test requires
  a live LLM, GitHub, Pangram, Helm, kind, Kubernetes, or network service.

traces:
  - rel00.1-uc001-tracer-saga
  - srd001-prose-editor-services
  - srd002-writing-saga-workproducts
  - srd003-writing-agent-tools
  - srd004-workflow-orchestrator
  - srd005-specialist-editor
  - srd008-voice-critic

preconditions:
  - The four shipped local profiles pass agent-core configuration validation.
  - The gate executes workflow-orchestrator with agent-core and records each self-invoked child profile and terminal.
  - prose-editor-tracer-boundary records every declared source, workproduct, RAG, embedding, and model operation.
  - The deterministic fixture corpus under testdata/integration/tracer is read-only input.
  - Every scenario runs in a fresh temporary persistent workspace.
  - Retry limit is exactly one and source/attempt paths are content-addressed.

