name: collector
purpose: |
  Persistently receive OTLP trace batches, reject empty batches through a
  declared predicate, spool accepted spans, optionally relay them, and service
  lifecycle control between bounded intake waits.
invariants:
  - Every accepted batch is spooled before relay.
  - Collector process telemetry is configured by deployment as file-only.
  - Metrics remain on the staged contrib path.
initial_state: Idle
budget: {max_iterations: 1000000}
states:
  - {name: Idle, meaning: Before listeners launch.}
  - {name: LaunchingControl, meaning: Launching lifecycle control.}
  - {name: LaunchingMonitor, meaning: Launching monitor reads.}
  - {name: AwaitingSpans, meaning: Waiting a bounded interval for one trace batch.}
  - {name: Filtering, meaning: Applying declared non-empty policy.}
  - {name: Spooling, meaning: Writing deterministic evidence.}
  - {name: DecidingRelay, meaning: Selecting test or relay mode.}
  - {name: Relaying, meaning: Exporting the spooled batch upstream.}
  - {name: AwaitingControl, meaning: Checking lifecycle control between intake waits.}
  - {name: Exiting, meaning: Routing lifecycle exit.}
  - {name: StoppingReceiver, meaning: Stopping OTLP intake.}
  - {name: StoppingMonitor, meaning: Stopping monitor REST.}
  - {name: StoppingControl, meaning: Stopping control REST.}
  - {name: Done, meaning: Clean terminal shutdown.}
  - {name: Failed, meaning: Boundary or lifecycle failure.}
terminal_states: [Done, Failed]
signals:
  - {name: Seed, trigger: Startup.}
  - {name: ReceiverLaunched, trigger: OTLP intake bound.}
  - {name: ServerLaunched, trigger: REST listener bound.}
  - {name: SpansReceived, trigger: One complete batch arrived.}
  - {name: Satisfied, trigger: Predicate held.}
  - {name: Unsatisfied, trigger: Predicate did not hold.}
  - {name: SpansSpooled, trigger: Deterministic append synced.}
  - {name: SpansRelayed, trigger: Upstream accepted the batch.}
  - {name: AwaitTimedOut, trigger: Bounded intake or control wait elapsed.}
  - {name: ExitRequested, trigger: Lifecycle control event.}
  - {name: AgentExited, trigger: exit_agent completed.}
  - {name: ReceiverStopped, trigger: OTLP listener stopped or await observed stop.}
  - {name: ServerStopped, trigger: REST listener stopped.}
  - {name: CommandError, trigger: Boundary failure.}
transitions:
  - {state: Idle, signal: Seed, next: LaunchingControl, action: otlp_receiver_launch}
  - {state: Idle, signal: CommandError, next: Failed}
  - {state: LaunchingControl, signal: ReceiverLaunched, next: LaunchingMonitor, action: launch_collector_control}
  - {state: LaunchingControl, signal: CommandError, next: Failed}
  - {state: LaunchingMonitor, signal: ServerLaunched, next: AwaitingSpans, action: launch_collector_monitor}
  - {state: LaunchingMonitor, signal: CommandError, next: Failed}
  - {state: AwaitingSpans, signal: ServerLaunched, next: AwaitingSpans, action: await_spans, label: received_batch}
  - {state: AwaitingSpans, signal: SpansReceived, next: Filtering, action: filter_collector_batch}
  - {state: AwaitingSpans, signal: AwaitTimedOut, next: AwaitingControl, action: await_collector_control}
  - {state: AwaitingSpans, signal: ReceiverStopped, next: Failed}
  - {state: AwaitingSpans, signal: CommandError, next: Failed}
  - {state: Filtering, signal: Satisfied, next: Spooling, action: spool_collector_spans, label: spooled_batch}
  - {state: Filtering, signal: Unsatisfied, next: AwaitingControl, action: await_collector_control}
  - {state: Filtering, signal: CommandError, next: Failed}
  - {state: Spooling, signal: SpansSpooled, next: DecidingRelay, action: decide_collector_relay}
  - {state: Spooling, signal: CommandError, next: Failed}
  - {state: DecidingRelay, signal: Satisfied, next: Relaying, action: relay_collector_spans}
  - {state: DecidingRelay, signal: Unsatisfied, next: AwaitingControl, action: await_collector_control}
  - {state: DecidingRelay, signal: CommandError, next: Failed}
  - {state: Relaying, signal: SpansRelayed, next: AwaitingControl, action: await_collector_control}
  - {state: Relaying, signal: CommandError, next: AwaitingControl, action: await_collector_control}
  - {state: AwaitingControl, signal: AwaitTimedOut, next: AwaitingSpans, action: await_spans, label: received_batch}
  - {state: AwaitingControl, signal: ExitRequested, next: Exiting, action: exit_agent}
  - {state: AwaitingControl, signal: ServerStopped, next: Failed}
  - {state: AwaitingControl, signal: CommandError, next: Failed}
  - {state: Exiting, signal: AgentExited, next: StoppingReceiver, action: otlp_receiver_stop}
  - {state: Exiting, signal: CommandError, next: Failed}
  - {state: StoppingReceiver, signal: ReceiverStopped, next: StoppingMonitor, action: stop_collector_monitor}
  - {state: StoppingReceiver, signal: CommandError, next: Failed}
  - {state: StoppingMonitor, signal: ServerStopped, next: StoppingControl, action: stop_collector_control}
  - {state: StoppingMonitor, signal: CommandError, next: Failed}
  - {state: StoppingControl, signal: ServerStopped, next: Done}
  - {state: StoppingControl, signal: CommandError, next: Failed}
