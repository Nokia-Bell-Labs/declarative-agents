unit: catalog-knowledge-manager-corpus-ingest-declarations
imports:
- ../../units/types-requests.yaml
tools:
  - name: chroma_ready
    type: builtin
    init: rest_client_invoke
    visibility: internal
    category: boundary
    description: Check the Chroma v2 heartbeat through the configured REST client.
    parameters:
      type: object
      properties: {}
      additional_properties: false
    signature:
      emits: [ChromaReady, CommandError]
    output:
      description: Mapped Chroma heartbeat result.
      schema:
        type: object
        properties:
          operation: {type: string}
          status: {type: integer}
    side_effects:
      - kind: external_api
        target: chroma.heartbeat
        state: read_only
    reversibility:
      classification: reversible
    undo:
      strategy: noop
      description: A heartbeat check does not mutate state.
    errors:
      - signal: CommandError
        condition: The chroma client definition is missing, or the heartbeat call fails on network, timeout, or mapping.
        state_after_failure: No Chroma state is read or changed.
    config:
      rest_ref: chroma
      operation: heartbeat

  - name: ollama_ready
    type: builtin
    init: rest_client_invoke
    visibility: internal
    category: boundary
    description: Check the Ollama version endpoint through the configured REST client.
    parameters:
      type: object
      properties: {}
      additional_properties: false
    signature:
      emits: [OllamaReady, CommandError]
    output:
      description: Mapped Ollama version result.
      schema:
        type: object
        properties:
          operation: {type: string}
          status: {type: integer}
    side_effects:
      - kind: external_api
        target: ollama.version
        state: read_only
    reversibility:
      classification: reversible
    undo:
      strategy: noop
      description: A version check does not mutate state.
    errors:
      - signal: CommandError
        condition: The ollama client definition is missing, or the version call fails on network, timeout, or mapping.
        state_after_failure: No Ollama state is read or changed.
    config:
      rest_ref: ollama
      operation: version

  - name: embed_document
    type: builtin
    init: rest_client_invoke
    visibility: internal
    category: boundary
    description: Embed a corpus document at the configured provider and carry its text and id forward.
    parameters:
      type: object
      properties:
        input: {type: string}
        id: {type: string}
    signature:
      emits: [DocumentEmbedded, CommandError]
    output:
      description: Mapped provider embedding with carried document text and id.
      schema:
        type: object
        properties:
          mapped: {type: object}
          carried: {type: object}
    side_effects:
      - kind: external_api
        target: embedding_provider.document
        state: read_only
    reversibility:
      classification: reversible
    undo:
      strategy: noop
      description: Computing an embedding does not mutate state.
    errors:
      - signal: CommandError
        condition: The configured document-embedding operation is absent or fails on network, timeout, schema, or mapping.
        state_after_failure: No embedding is produced and no state changes.
    config:
      rest_ref: "${CORPUS_INGEST_EMBEDDING_REST_REF:-ollama}"
      operation: "${CORPUS_INGEST_EMBEDDING_OPERATION:-embed}"

  - name: normalize_embedding
    type: builtin
    init: normalize_vector
    visibility: internal
    category: word
    description: Preserve a flat document vector or unwrap exactly one provider row.
    parameters:
      type: object
      properties: {}
      additional_properties: false
    signature:
      output: catalog-types-requests.ProviderEnvelope
      emits: [EmbeddingNormalized, CommandError]
    output:
      description: Provider Result envelope with one flat embedding vector.
    errors:
      - signal: CommandError
        condition: The embedding path or vector shape is invalid.
        state_after_failure: No normalized embedding is published and Chroma is not called.
    relationships:
      overlaps:
        - tool: normalize_vector
          difference: This profile-specific word binds the generic shape normalizer to the document embedding Result.
      after: [embed_document]
      before: [resolve_collection]
    config:
      path: mapped.embedding
      signal: EmbeddingNormalized

  - name: resolve_collection
    type: builtin
    init: rest_client_invoke
    visibility: internal
    category: boundary
    description: Create-or-get the collection and carry the embedding, document, and id forward.
    parameters:
      type: object
      properties:
        embeddings: {type: array}
        documents: {type: string}
        ids: {type: string}
    signature:
      emits: [CollectionReady, CommandError]
    output:
      description: Mapped Chroma collection id with carried record fields.
      schema:
        type: object
        properties:
          mapped: {type: object}
          carried: {type: object}
    side_effects:
      - kind: external_api
        target: chroma.collection
        state: read_only
        description: Create-or-get is idempotent for a stable collection name, so
          the call leaves no net change to reverse.
    reversibility:
      classification: reversible
    undo:
      strategy: noop
      description: Create-or-get is idempotent for a stable collection name.
    errors:
      - signal: CommandError
        condition: The Chroma create-or-get collection call fails on network, timeout, schema, or mapping.
        state_after_failure: The collection id is unresolved; create-or-get is idempotent so there is no net change.
    config:
      rest_ref: chroma
      operation: create_or_get_collection_carry

  - name: count_collection
    type: builtin
    init: rest_client_invoke
    visibility: internal
    category: boundary
    description: Re-resolve the collection id for the count verification.
    parameters:
      type: object
      properties: {}
    signature:
      emits: [CollectionReady, CommandError]
    output:
      description: Mapped Chroma collection id.
      schema:
        type: object
        properties:
          mapped: {type: object}
    side_effects:
      - kind: external_api
        target: chroma.collection
        state: read_only
        description: Create-or-get is idempotent for a stable collection name, so
          the call leaves no net change to reverse.
    reversibility:
      classification: reversible
    undo:
      strategy: noop
      description: Create-or-get is idempotent for a stable collection name.
    errors:
      - signal: CommandError
        condition: The Chroma create-or-get collection call fails on network, timeout, schema, or mapping.
        state_after_failure: The collection id is unresolved; create-or-get is idempotent so there is no net change.
    config:
      rest_ref: chroma
      operation: create_or_get_collection

  - name: chroma_add
    type: builtin
    init: rest_client_invoke
    visibility: internal
    category: boundary
    description: Add the agent-supplied embedding, document, and id to the collection.
    parameters:
      type: object
      properties:
        collection: {type: string}
        embeddings: {type: array}
        documents: {type: string}
        ids: {type: string}
    signature:
      emits: [DocumentAdded, CommandError]
    output:
      description: Mapped Chroma add result.
      schema:
        type: object
        properties:
          operation: {type: string}
          status: {type: integer}
    side_effects:
      - kind: external_api
        target: chroma.records
        state: records_added
    reversibility:
      classification: compensatable
    undo:
      strategy: compensating_action
      description: Delete the receipt-recorded IDs from the trusted Chroma collection.
      payload: boundary_compensation
      captures: [collection, ids, operation]
    errors:
      - signal: CommandError
        condition: The Chroma add call fails on network, timeout, schema, or mapping.
        state_after_failure: The record is not written to the collection.
    config:
      rest_ref: chroma
      operation: add_records

  - name: chroma_count
    type: builtin
    init: rest_client_invoke
    visibility: internal
    category: boundary
    description: Read the collection item count for post-ingest verification.
    parameters:
      type: object
      properties:
        collection: {type: string}
    signature:
      emits: [CountReady, CommandError]
    output:
      description: Mapped Chroma count result.
      schema:
        type: object
        properties:
          operation: {type: string}
          status: {type: integer}
    side_effects:
      - kind: external_api
        target: chroma.count
        state: read_only
    reversibility:
      classification: reversible
    undo:
      strategy: noop
      description: Reading a count does not mutate state.
    errors:
      - signal: CommandError
        condition: The Chroma count call fails on network, timeout, or mapping.
        state_after_failure: No count is read and no state changes.
    config:
      rest_ref: chroma
      operation: count_records

  - name: list_resource_paths
    type: exec
    binary: bash
    args:
      - -o
      - pipefail
      - -c
      - |
        find -P . \( -type f -o -type l \) -name '*.md' -print |
          LC_ALL=C sort |
          awk '{sub(/^\.\//, ""); print}'
      - corpus-resource-paths
    visibility: internal
    category: boundary
    signature:
      emits: [ToolDone, ToolFailed, CommandError]
    description: Discover corpus paths through the declared filesystem CLI.
    parameters: {type: object, properties: {}, additionalProperties: false}
    output_cap: 1048576
    side_effects:
      - {kind: child_process, target: find, state: read_only}
      - {kind: filesystem_read, target: configured_document_resource, state: read_only}
    reversibility: {classification: reversible}
    undo: {strategy: noop, description: Discovery changes nothing.}
    errors: [{signal: ToolFailed, condition: find traversal fails, state_after_failure: No state changes.}]

  - name: list_resource
    type: builtin
    init: list_resource
    visibility: internal
    category: boundary
    description: Shape discovered corpus paths so the model can choose which document to ingest.
    parameters: {type: object, properties: {}, additionalProperties: false}
    signature:
      emits: [DocumentListReady, DocumentResourceDenied, CommandError]
    output:
      description: Structured corpus document entries.
      schema:
        type: array
        items:
          type: object
          properties:
            path: {type: string}
    side_effects:
      - kind: filesystem_read
        target: configured_document_resource
        state: read_only
    reversibility:
      classification: reversible
    undo:
      strategy: noop
      description: Listing is read-only.
    errors:
      - signal: DocumentResourceDenied
        condition: The requested resource name is not a configured document resource.
        state_after_failure: No documents are listed and no state changes.
      - signal: CommandError
        condition: Scanning the configured resource root fails.
        state_after_failure: No documents are listed and no state changes.
    config:
      resource: corpus
      resources:
        corpus:
          root: "."
          include: ["**/*.md"]
          extensions: [".md"]
          modes: [raw]
          max_bytes: 1048576
          category_rules:
            - {pattern: "*.md", category: overview}

  - name: read_resource
    type: builtin
    init: read_resource
    category: boundary
    description: Read one corpus document the model selected.
    parameters:
      type: object
      properties:
        resource: {type: string, enum: [corpus]}
        path: {type: string}
      required: [resource, path]
    signature:
      emits: [DocumentReady, DocumentMissing, DocumentResourceDenied, DocumentParseFailed, CommandError]
    output:
      description: Structured document detail from the configured resource.
      schema:
        type: object
        properties:
          path: {type: string}
          raw: {type: string}
    side_effects:
      - kind: filesystem_read
        target: configured_document_resource
        state: read_only
    reversibility:
      classification: reversible
    undo:
      strategy: noop
      description: Reading is read-only.
    errors:
      - signal: DocumentMissing
        condition: The selected resource-relative path does not exist.
        state_after_failure: No document is read and no state changes.
      - signal: DocumentResourceDenied
        condition: The requested resource name or path is outside the configured resource.
        state_after_failure: No document is read and no state changes.
      - signal: DocumentParseFailed
        condition: The document cannot be read or decoded under the configured mode.
        state_after_failure: No document is read and no state changes.
      - signal: CommandError
        condition: The resource read fails for a reason other than the declared document signals.
        state_after_failure: No document is read and no state changes.
    config:
      resource: corpus
      resources:
        corpus:
          root: "."
          include: ["**/*.md"]
          extensions: [".md"]
          modes: [raw]
          max_bytes: 1048576

  - name: invoke_llm
    type: builtin
    init: invoke_llm
    visibility: internal
    category: boundary
    signature:
      emits: [LLMResponded, CommandError]
    description: Invoke the configured model to drive corpus file selection.
    output:
      description: Raw model response text.
      schema:
        type: string
    side_effects:
      - kind: external_api_call
        target: ollama.chat
        description: Sends the corpus listing and read results to the configured local model.
      - kind: state_mutation
        target: conversation_history
        state: appended
        description: Appends the model response after a successful provider call.
    reversibility:
      classification: reversible
      requires_confirmation: false
    undo:
      strategy: conversation_truncate
      description: Restore conversation history captured before the model call.
      requires: [conversation_checkpoint]
    errors:
      - signal: CommandError
        condition: provider configuration is invalid, the model is unavailable, or the model call fails
        message_shape: 'invoke_llm: <provider/model>: <error>'
        state_after_failure: conversation history is unchanged unless the provider response was already appended
    config:
      model: "${CORPUS_CHAT_MODEL:-ornith:9b}"
      provider: ollama
      provider_url: "${OLLAMA_URL:-http://localhost:11434}"
      manifest_state: Composing
      response_profile: qwen
      max_time: 300
      llm_timeout: 300
      system_prompt: |
        You load a document corpus into a vector database by choosing files to read.

        Rules:
        - The machine lists the corpus before calling you. The conversation contains
          a JSON array whose path fields are the only files you may choose.
        - Call read_resource once for each listed file, using resource "corpus"
          and the file's exact path. Read every file exactly once.
        - Emit exactly one [tool_call] block per turn. Do not batch reads, and do
          not call done in the same response as a read.
        - Never invent or rewrite a path. Copy the path field byte-for-byte from
          the list_resource result, with no extra whitespace or prefixes.
        - After every listed file has been read, call done.
        - Do not read a file twice. Do not invent paths that were not listed.
        - You never embed or store content yourself; the system does that after each read.

        Tool call format:
        [tool_call]
        {"tool":"read_resource","parameters":{"resource":"corpus","path":"<listed path>"}}
        [/tool_call]

        Finish format:
        [tool_call]
        {"tool":"done","parameters":{"summary":"Ingested <N> corpus documents."}}
        [/tool_call]
