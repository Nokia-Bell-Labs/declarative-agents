# Exec tool declarations for the applier agent (srd002-applier): the helm and
# kubectl CLIs its container carries, bound as agent-core exec tools (agent-core
# srd021). The applier's request machines bind these words to realize a decided
# values patch as a validate -> apply -> verify -> rollback rollout against the
# agent-architecture chart.
#
# The args are fully static: agent-core exec tools take no environment and map
# params only from the previous result by name (ExecBuilder.Build ->
# ExtractStringParam), so a per-field parameter would be order-nondeterministic
# (properties is a Go map) and unsourced. The only dynamic input is the values
# file content, which the write_overrides word writes from the request seed to
# the agent's workspace; helm reads the same ${APPLIER_WORK_DIR:-/work} path, so
# one mounted profile follows the workspace mount per pod. The agent-architecture
# release, default namespace, and agent-architecture-collector Deployment below are
# placeholder defaults kept as valid YAML for agent-core validation; when the chart
# packages this file, the applier template rewrites them to the installed release
# name, namespace, and <fullname>-collector Deployment so an applier installed under
# any release targets its own release (mounted-profile contract, srd001).
#
# The verify and rollout-read words target the collector, not the curator: the
# catalog documentation-curator is a bounded demo agent whose await word times out
# and exits after one short control window, so its Deployment never holds a durable
# ready rollout and `kubectl rollout status` on it would time out on every healthy
# apply. The collector is the application's one persistent, k8s-ready server, so it
# is the stable readiness target (srd002-applier R3.1).
#
# Each runs one child process and emits ToolDone on a zero exit and ToolFailed on
# a non-zero exit (agent-core exec emits exactly these two); the request machine
# distinguishes success from failure by the state it is in.
#
# The helm flags below are helm 3's spellings, which is what agent-core/applier.Dockerfile
# pins (ARG HELM_VERSION). helm 4 spells the validate-without-applying flag
# --dry-run=client rather than --dry-run and warns about the old name, so a
# developer whose local helm is 4.x will see deprecation warnings from tests that
# shell out to it. helm rejects an unknown flag outright, so migrating the
# spelling without bumping the pin would fail every apply on the cluster; the two
# move together.
#
# helm_upgrade deliberately carries neither --atomic nor --wait: the upgrade
# applies and returns immediately, and the machine's own
# the verify_rollout word observes a rollout stall
# and compensate it with helm_rollback (apply-machine.yaml). A waited --atomic
# upgrade would instead block on a never-ready Deployment until helm's own timeout,
# fail at the apply step, and self-roll-back into Failed, leaving the explicit
# verify -> RollingBack -> RolledBack path unreachable.
#
# The kubectl words pass --timeout, never --request-timeout: --request-timeout
# forces kubectl to skip in-cluster config resolution and dial localhost:8080,
# which never reaches the API server from inside the pod. --timeout bounds the
# rollout-status wait without disturbing in-cluster config.
unit: agent-architecture-applier-exec-declarations
imports:
  - /opt/agent-core/tools/units/types-core.yaml
tools:
  - name: helm_dry_run
    type: exec
    binary: helm
    args: [upgrade, agent-architecture, /chart, --namespace, default, --reuse-values, --atomic, --dry-run, -f, "${APPLIER_WORK_DIR:-/work}/overrides.yaml"]
    category: boundary
    visibility: internal
    description: Validate a values patch against the agent-architecture chart values.schema.json without applying it, by rendering the release with helm upgrade --dry-run.
    signature:
      output: builtin-types-core.ExecResult
      emits: [ToolDone, ToolFailed]
    output:
      description: helm upgrade --dry-run process result.
    side_effects:
      - kind: child_process
        state: read_only
        target: helm
        description: Runs `helm upgrade --dry-run` as a child process; renders only, mutates no cluster state.
    reversibility:
      classification: reversible
      requires_confirmation: false
    errors:
      - signal: ToolFailed
        condition: helm renders with a non-zero exit (schema or template rejection)
        message_shape: <captured helm output>
        state_after_failure: no cluster state changed
    undo:
      strategy: noop
      description: A dry-run mutates no cluster state.

  - name: helm_upgrade
    type: exec
    binary: helm
    args: [upgrade, agent-architecture, /chart, --namespace, default, --reuse-values, -f, "${APPLIER_WORK_DIR:-/work}/overrides.yaml"]
    category: boundary
    visibility: internal
    description: Apply a validated values patch by upgrading the release in place, re-rendering the prepared topology and rolling the affected Deployments.
    signature:
      output: builtin-types-core.ExecResult
      emits: [ToolDone, ToolFailed]
    output:
      description: helm upgrade process result.
    side_effects:
      - kind: child_process
        target: helm
        description: Runs `helm upgrade --reuse-values` as a child process; upgrades the release and re-renders the affected Deployments without waiting for readiness.
    reversibility:
      classification: compensatable
      requires_confirmation: false
    errors:
      - signal: ToolFailed
        condition: the upgrade command exits non-zero
        message_shape: <captured helm output>
        state_after_failure: the release may be left on the failed revision; the apply machine routes this to Failed for operator attention, while a post-apply rollout stall is compensated by helm_rollback
    undo:
      strategy: compensating_action
      description: helm_rollback returns the release to its prior revision when a verify stall follows a successful upgrade.

  - name: helm_rollback
    type: exec
    binary: helm
    args: [rollback, agent-architecture]
    category: boundary
    visibility: internal
    description: Roll the release back to its prior revision when a verify stall follows an apply that helm did not itself roll back.
    signature:
      output: builtin-types-core.ExecResult
      emits: [ToolDone, ToolFailed]
    output:
      description: helm rollback process result.
    side_effects:
      - kind: child_process
        target: helm
        description: Runs `helm rollback` as a child process; returns the release to its prior revision.
    reversibility:
      classification: irreversible
      requires_confirmation: true
    errors:
      - signal: ToolFailed
        condition: the rollback exits non-zero
        message_shape: <captured helm output>
        state_after_failure: the release may remain on the failed revision and needs operator attention
    undo:
      strategy: irreversible
      description: A rollback is itself a one-way compensating action; reversing it requires a new explicit rollout.

  - name: verify_rollout
    type: exec
    binary: kubectl
    args: [rollout, status, deployment/agent-architecture-collector, --namespace, default, --timeout, 120s]
    category: boundary
    visibility: internal
    description: Verify the collector Deployment's rollout, letting kubectl compute the phase; a non-zero exit is a stalled or timed-out rollout.
    signature:
      output: builtin-types-core.ExecResult
      emits: [ToolDone, ToolFailed]
    output:
      description: kubectl rollout status process result.
    side_effects:
      - kind: child_process
        state: read_only
        target: kubectl
        description: Runs `kubectl rollout status` on the collector Deployment; reads rollout progress and mutates nothing.
    reversibility:
      classification: reversible
      requires_confirmation: false
    errors:
      - signal: ToolFailed
        condition: the collector rollout stalls or the timeout elapses before completion
        message_shape: <captured kubectl status output>
        state_after_failure: the rollout is incomplete; the request machine rolls the release back
    undo:
      strategy: noop
      description: A status read mutates nothing.

  - name: kubectl_rollout_poll
    type: exec
    binary: kubectl
    args: [rollout, status, deployment/agent-architecture-collector, --namespace, default, --timeout, 3s]
    category: boundary
    visibility: internal
    description: Read the collector Deployment's rollout status for the rollout GET endpoint, with a short timeout so the read returns promptly; ToolDone means complete, ToolFailed means not complete. The collector is the read target because it is the application's persistent, k8s-ready server, whereas the bounded curator never holds a durable rollout.
    signature:
      output: builtin-types-core.ExecResult
      emits: [ToolDone, ToolFailed]
    output:
      description: kubectl rollout status process result.
    side_effects:
      - kind: child_process
        state: read_only
        target: kubectl
        description: Runs `kubectl rollout status` with a short timeout as a child process; reads status and mutates nothing.
    reversibility:
      classification: reversible
      requires_confirmation: false
    errors:
      - signal: ToolFailed
        condition: the rollout is not complete within the short timeout (still progressing), or kubectl could not read the Deployment at all
        message_shape: <captured kubectl status output>
        state_after_failure: no cluster state changed; the machine reads the counts next, which separates the two cases
    undo:
      strategy: noop
      description: A status read mutates nothing.

  # The go-template renders the Deployment as one compact JSON object, which is
  # what lets the rollout response map ready, desired, and revision as fields
  # rather than as one opaque string (agent-core srd030 R4.3). Every field is
  # guarded because a Deployment carries no readyReplicas until a replica is
  # ready and no revision annotation until the controller writes one, and an
  # ungated miss would render `<no value>` in the middle of the object and emit
  # invalid JSON. --allow-missing-template-keys is kubectl's default; it is
  # stated because the guards depend on a missing key evaluating false rather
  # than erroring.
  - name: kubectl_get_rollout_counts
    type: exec
    binary: kubectl
    args: [get, deployment/agent-architecture-collector, --namespace, default, -o, 'go-template={"ready":{{if .status}}{{if .status.readyReplicas}}{{.status.readyReplicas}}{{else}}0{{end}}{{else}}0{{end}},"desired":{{if .spec.replicas}}{{.spec.replicas}}{{else}}0{{end}},"revision":{{if .metadata.annotations}}{{if index .metadata.annotations "deployment.kubernetes.io/revision"}}{{index .metadata.annotations "deployment.kubernetes.io/revision"}}{{else}}0{{end}}{{else}}0{{end}}}', --allow-missing-template-keys=true]
    category: boundary
    visibility: internal
    description: Read the collector Deployment's replica counts and revision as one JSON object, so the rollout response carries ready, desired, and revision alongside the phase, and a read that cannot reach the Deployment fails rather than reporting progress.
    signature:
      emits: [ToolDone, ToolFailed]
    output:
      description: The Deployment's rollout counts, rendered by the go-template as a JSON object so the response body maps ready, desired, and revision by field.
      schema:
        type: object
        properties:
          ready: {type: integer}
          desired: {type: integer}
          revision: {type: integer}
        required: [ready, desired, revision]
    side_effects:
      - kind: child_process
        state: read_only
        target: kubectl
        description: Runs `kubectl get deployment -o go-template` as a child process; reads the Deployment and mutates nothing.
    reversibility:
      classification: reversible
      requires_confirmation: false
    errors:
      - signal: ToolFailed
        condition: the Deployment does not exist, or the kubeconfig, RBAC, or API server makes the read impossible
        message_shape: <captured kubectl error output>
        state_after_failure: no cluster state changed; the machine reaches Unavailable and the endpoint answers 502
    undo:
      strategy: noop
      description: An object read mutates nothing.
