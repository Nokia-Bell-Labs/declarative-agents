tools:
  - name: validate_critic_request
    type: builtin
    init: parse_structured
    visibility: internal
    category: word
    description: Validate exact immutable comparison inputs and reject authority-bearing fields.
    parameters: {type: object, properties: {}, additionalProperties: false}
    emits: [CriticRequestValid, CriticRequestRejected, CommandError]
    config:
      source: $.output
      schema:
        type: object
        required:
          - original_content
          - original_artifact_id
          - original_content_hash
          - candidate_content
          - candidate_artifact_id
          - candidate_content_hash
          - candidate_stage
          - saga_id
          - attempt
        properties:
          original_content: {type: string, minLength: 1, maxLength: 196608}
          original_artifact_id: {type: string, minLength: 1, maxLength: 512}
          original_content_hash: {type: string, pattern: "^[0-9a-f]{64}$"}
          candidate_content: {type: string, minLength: 1, maxLength: 196608}
          candidate_artifact_id: {type: string, minLength: 1, maxLength: 512}
          candidate_content_hash: {type: string, pattern: "^[0-9a-f]{64}$"}
          candidate_stage: {type: string, const: structure}
          saga_id: {type: string, minLength: 1, maxLength: 128}
          attempt: {type: integer, minimum: 1, maximum: 2}
          target_voice: {type: string, maxLength: 256}
        additionalProperties: false
      parsed: CriticRequestValid
      unparsed: CriticRequestRejected
    side_effects: []
    reversibility: {classification: reversible, undo: noop}
    undo: {strategy: noop, description: Request validation changes no state.}

  - name: compose_critic_evaluation_context
    type: builtin
    init: compose
    visibility: internal
    category: word
    description: Compose an independent context from immutable request fields only.
    parameters: {type: object, properties: {}, additionalProperties: false}
    emits: [CriticEvaluationContextReady, CommandError]
    config:
      signal: CriticEvaluationContextReady
      inputs:
        original_content: $from(validated_critic_request).original_content
        original_content_hash: $from(validated_critic_request).original_content_hash
        candidate_content: $from(validated_critic_request).candidate_content
        candidate_content_hash: $from(validated_critic_request).candidate_content_hash
      template: |-
        Independently assess this immutable original and structure candidate:
        {"original":{{ json original_content }},"original_sha256":{{ json original_content_hash }},"candidate":{{ json candidate_content }},"candidate_sha256":{{ json candidate_content_hash }}}
    side_effects: []
    reversibility: {classification: reversible, undo: noop}
    undo: {strategy: noop, description: Context composition changes no state.}

  - name: evaluate_structure_candidate
    type: builtin
    init: invoke_llm
    visibility: internal
    category: boundary
    description: Evaluate all six tracer finding categories without editing the candidate.
    parameters: {type: object, properties: {}, additionalProperties: false}
    emits: [LLMResponded, CommandError]
    config:
      model: "${PROSE_CRITIC_MODEL:-qwen2.5:3b}"
      provider: ollama
      provider_url: "${OLLAMA_URL:-http://127.0.0.1:11434}"
      manifest_state: EvaluatingCandidate
      response_profile: qwen
      user_prompt_from: $from(critic_evaluation_context)
      answer_only: true
      max_time: 120
      llm_timeout: 120
      system_prompt: |
        Return exactly one JSON object with verdict, responsible_stage,
        original_content_hash, candidate_content_hash, findings, and feedback.
        Verdict is "pass" or "reject". A pass uses responsible_stage "";
        a reject uses "structure". Findings must contain exactly these six
        categories once: semantic_preservation, structural_intent, voice_match,
        tightening_quality, unsupported_additions, anchor_copy_risk. Do not
        rewrite content, suggest replacement prose, or return paths, tools,
        endpoints, credentials, uploads, persistence, or publication data.
    side_effects:
      - {kind: external_api, target: configured_model, state: inference_observed}
      - {kind: state_mutation, target: conversation_history, state: appended}
    reversibility: {classification: reversible, undo: conversation_truncate}
    undo: {strategy: conversation_truncate, description: Restore pre-call conversation state.}

  - name: capture_critic_evaluation
    type: builtin
    init: compose
    visibility: internal
    category: word
    description: JSON-escape raw critic model output before schema validation.
    parameters: {type: object, properties: {}, additionalProperties: false}
    emits: [CriticEvaluationCaptured, CommandError]
    config:
      signal: CriticEvaluationCaptured
      inputs:
        response: $.
      template: '{"response": {{ json response }}}'
    side_effects: []
    reversibility: {classification: reversible, undo: noop}
    undo: {strategy: noop, description: Capturing output changes no state.}

  - name: parse_critic_evaluation
    type: builtin
    init: parse_structured
    visibility: internal
    category: word
    description: Require all six distinct findings and tracer-stage verdict closure.
    parameters: {type: object, properties: {}, additionalProperties: false}
    emits: [CriticEvaluationParsed, CriticEvaluationInvalid, CommandError]
    config:
      source: $from(critic_evaluation_transport).response
      schema:
        type: object
        required:
          - verdict
          - responsible_stage
          - original_content_hash
          - candidate_content_hash
          - findings
          - feedback
        properties:
          verdict: {type: string, enum: [pass, reject]}
          responsible_stage: {type: string, enum: ["", structure]}
          original_content_hash: {type: string, pattern: "^[0-9a-f]{64}$"}
          candidate_content_hash: {type: string, pattern: "^[0-9a-f]{64}$"}
          findings:
            type: array
            minItems: 6
            maxItems: 6
            items:
              type: object
              required: [category, status, summary]
              properties:
                category:
                  type: string
                  enum:
                    - semantic_preservation
                    - structural_intent
                    - voice_match
                    - tightening_quality
                    - unsupported_additions
                    - anchor_copy_risk
                status: {type: string, enum: [pass, warn, reject]}
                summary: {type: string, maxLength: 2048}
              additionalProperties: false
          feedback: {type: string, maxLength: 4096}
        additionalProperties: false
        allOf:
          - properties:
              findings:
                allOf:
                  - contains: {type: object, required: [category], properties: {category: {const: semantic_preservation}}}
                  - contains: {type: object, required: [category], properties: {category: {const: structural_intent}}}
                  - contains: {type: object, required: [category], properties: {category: {const: voice_match}}}
                  - contains: {type: object, required: [category], properties: {category: {const: tightening_quality}}}
                  - contains: {type: object, required: [category], properties: {category: {const: unsupported_additions}}}
                  - contains: {type: object, required: [category], properties: {category: {const: anchor_copy_risk}}}
          - if: {properties: {verdict: {const: pass}}, required: [verdict]}
            then:
              properties:
                responsible_stage: {const: ""}
                findings:
                  items:
                    properties: {status: {const: pass}}
          - if: {properties: {verdict: {const: reject}}, required: [verdict]}
            then:
              properties:
                responsible_stage: {const: structure}
                findings:
                  contains:
                    type: object
                    required: [status]
                    properties: {status: {const: reject}}
      parsed: CriticEvaluationParsed
      unparsed: CriticEvaluationInvalid
    side_effects: []
    reversibility: {classification: reversible, undo: noop}
    undo: {strategy: noop, description: Parsing changes no state.}

  - name: critic_original_hash_matches
    type: builtin
    init: value_predicate
    visibility: internal
    category: word
    description: Bind the critic response original hash to the validated request.
    parameters: {type: object, properties: {}, additionalProperties: false}
    emits: [CriticOriginalHashMatched, CriticOriginalHashMismatched, CommandError]
    config:
      left: $from(critic_evaluation).original_content_hash
      op: eq
      right: $from(validated_critic_request).original_content_hash
      operand_type: string
      satisfied: CriticOriginalHashMatched
      unsatisfied: CriticOriginalHashMismatched
    side_effects: []
    reversibility: {classification: reversible, undo: noop}
    undo: {strategy: noop, description: Comparing hashes changes no state.}

  - name: critic_candidate_hash_matches
    type: builtin
    init: value_predicate
    visibility: internal
    category: word
    description: Bind the critic response candidate hash to the validated request.
    parameters: {type: object, properties: {}, additionalProperties: false}
    emits: [CriticCandidateHashMatched, CriticCandidateHashMismatched, CommandError]
    config:
      left: $from(critic_evaluation).candidate_content_hash
      op: eq
      right: $from(validated_critic_request).candidate_content_hash
      operand_type: string
      satisfied: CriticCandidateHashMatched
      unsatisfied: CriticCandidateHashMismatched
    side_effects: []
    reversibility: {classification: reversible, undo: noop}
    undo: {strategy: noop, description: Comparing hashes changes no state.}

  - name: critic_verdict_is_pass
    type: builtin
    init: value_predicate
    visibility: internal
    category: word
    description: Route only the independently parsed verdict scalar.
    parameters: {type: object, properties: {}, additionalProperties: false}
    emits: [CriticPassed, CriticRejected, CommandError]
    config:
      left: $from(critic_evaluation).verdict
      op: eq
      right: pass
      operand_type: string
      satisfied: CriticPassed
      unsatisfied: CriticRejected
    side_effects: []
    reversibility: {classification: reversible, undo: noop}
    undo: {strategy: noop, description: Comparing a verdict changes no state.}

  - name: compose_critic_pass_response
    type: builtin
    init: compose
    visibility: internal
    category: response
    description: Return the validated pass verdict and findings as data.
    parameters: {type: object, properties: {}, additionalProperties: false}
    emits: [CriticResponsePassed, CommandError]
    config:
      signal: CriticResponsePassed
      inputs:
        verdict: $from(critic_evaluation).verdict
        responsible_stage: $from(critic_evaluation).responsible_stage
        original_content_hash: $from(critic_evaluation).original_content_hash
        candidate_content_hash: $from(critic_evaluation).candidate_content_hash
        findings: $from(critic_evaluation).findings
        feedback: $from(critic_evaluation).feedback
      template: '{"verdict":{{ json verdict }},"responsible_stage":{{ json responsible_stage }},"original_content_hash":{{ json original_content_hash }},"candidate_content_hash":{{ json candidate_content_hash }},"findings":{{ json findings }},"feedback":{{ json feedback }}}'
    side_effects: []
    reversibility: {classification: reversible, undo: noop}
    undo: {strategy: noop, description: Response composition changes no state.}

  - name: compose_critic_reject_response
    type: builtin
    init: compose
    visibility: internal
    category: response
    description: Return the validated structure rejection and bounded feedback as data.
    parameters: {type: object, properties: {}, additionalProperties: false}
    emits: [CriticResponseRejected, CommandError]
    config:
      signal: CriticResponseRejected
      inputs:
        verdict: $from(critic_evaluation).verdict
        responsible_stage: $from(critic_evaluation).responsible_stage
        original_content_hash: $from(critic_evaluation).original_content_hash
        candidate_content_hash: $from(critic_evaluation).candidate_content_hash
        findings: $from(critic_evaluation).findings
        feedback: $from(critic_evaluation).feedback
      template: '{"verdict":{{ json verdict }},"responsible_stage":{{ json responsible_stage }},"original_content_hash":{{ json original_content_hash }},"candidate_content_hash":{{ json candidate_content_hash }},"findings":{{ json findings }},"feedback":{{ json feedback }}}'
    side_effects: []
    reversibility: {classification: reversible, undo: noop}
    undo: {strategy: noop, description: Response composition changes no state.}
