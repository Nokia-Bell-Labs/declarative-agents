# An instance of agent-core's serve-machine template (srd054): the persistent
# service lifecycle with this agent's server words wired in. What a request
# does lives in request-machine.yaml.
unit: chatbot-machine
name: chatbot
purpose: |-
  The chatbot agent fronts the mesh. It launches a machine_request chat server, a
  control server, and a monitor server, then idles in AwaitingControl until a
  lifecycle exit event is enqueued, at which point it exits the agent and stops the
  servers. Each inbound chat request runs a request-scoped turn
  (request-machine.yaml): it embeds the message once, selects a chat-LLM tier,
  fans the one embedding out to the declared RAG servers, composes the answer
  prompt from the retrieved chunks, and answers.

  - RAG and LLM endpoints are declared rest.yaml clients; the turn selects among declared words and clients only.
  - The chat turn is stateless; the browser sends the conversation history with each request.
instantiate:
  - fragment: /opt/agent-core/tools/machines/serve-machine-template.yaml
    args:
      workflow: chatbot
      launch_requests: launch_chat_requests
      launch_control: launch_chatbot_control
      await_control: await_chatbot_control
      stop_requests: stop_chat_requests
