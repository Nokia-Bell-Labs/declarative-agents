# An instance of agent-core's serve-machine template (srd054): the persistent
# service lifecycle with this agent's server words wired in. What a request
# does lives in request-machine.yaml.
unit: provisioning-workflow-orchestrator-machine
name: provisioning-workflow-orchestrator
purpose: |-
  The provisioning-workflow-orchestrator profile hosts the mesh control plane's workflow orchestrator as a
  persistent service. It launches a machine_request intent server, a control server,
  and a monitor server, then idles in AwaitingControl until a lifecycle exit event is
  enqueued, at which point it exits the agent and stops the servers. Each inbound
  provisioning intent runs a request-scoped machine (request-machine.yaml): it
  delegates a corpus-ingest run per intent to the creator, forwards the caller's
  desired values document, and delegates the rollout to the creator, aggregating
  status for the provisioning panel. The provisioning-workflow-orchestrator orchestrates and sequences; every
  instance operation is a declared client request to the creator (srd004). It holds no deployment-API credentials and
  runs no instances directly.

  - The creator is a declared rest.yaml client; every instance operation is a request to it, never a direct deployment-API call.
  - The provisioning-workflow-orchestrator holds no deployment-API credentials; its intent endpoint is served on a separate service and port, reached apart from the chat path (the authentication boundary is deployment-realized).
expand:
  - fragment: /opt/agent-core/tools/machines/serve-machine-template.yaml
    args:
      workflow: provisioning_workflow_orchestrator
      launch_requests: launch_provisioning_workflow_orchestrator_requests
      launch_control: launch_provisioning_workflow_orchestrator_control
      await_control: await_provisioning_workflow_orchestrator_control
      stop_requests: stop_provisioning_workflow_orchestrator_requests
