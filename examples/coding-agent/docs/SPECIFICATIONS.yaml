id: coding-agent-example-specifications
title: Coding Agent Example Specification Index

overview: |
  This index governs the coding application's composition documents. Release
  01.0 has one use case and one three-stage test suite. The application owns no
  agent-family SRD: it references the canonical executor (srd002), critic
  (srd003), and planner (srd004) requirements in `agent-profiles/`.

  Library references are not forks. Packaging resolves a pinned
  `agent-profiles/v0.*` version and assembles the transitive profile closure
  before deployment. The shared agent-core runtime image remains profile-free.

