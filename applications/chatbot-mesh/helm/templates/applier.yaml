{{- if .Values.applier.enabled }}
{{/*
The applier (srd006): the mesh's deployment-plane actuation agent. Its
ServiceAccount, Role, RoleBinding, Deployment, Service, and NetworkPolicy come
from the shared agent-services library (GH-2045). The mesh mounts the same
chart-wide profiles ConfigMap every pod mounts, so it passes that volume in, and
its apply surface admits the creator, which drives the apply in-cluster.
*/}}
{{- $work := .Values.profiles.workMountPath -}}
{{- include "agent-services.applier" (dict
      "root" .
      "profilePath" (printf "%s/applications/chatbot-mesh/applier/profile.yaml" .Values.profiles.mountPath)
      "profilesVolume" (include "chatbot-mesh.profilesVolume" . | fromYamlArray)
      "workDir" $work
      "serviceName" "applier"
      "otlpEndpoint" (include "chatbot-mesh.otlpEndpoint" .)
      "otlpMetricEndpoint" (include "chatbot-mesh.otlpMetricEndpoint" .)
      "resourceAttributes" (include "chatbot-mesh.integrationResourceAttributes" .)
      "podLabels" (dict "monitorPort" (toString .Values.applier.ports.monitor))
      "chartWorkloadKinds" (list "deployments" "statefulsets")
      "chartCoreResources" (list "configmaps" "secrets" "services" "serviceaccounts")
      "chartBatchResources" (list "jobs")
      "allowedIngressComponents" (list "creator")) }}
{{- end }}
