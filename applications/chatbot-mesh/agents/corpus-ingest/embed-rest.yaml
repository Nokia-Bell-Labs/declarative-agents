unit: mesh-corpus-ingest-embed-rest
# The document-embedding operation comes from the provider library the profile
# binds to the providers root (srd058 R4.2). It reads the document text and its
# path from the read_resource Result and carries both forward. The model is the
# mesh's embedding identity, which the creator sets per ingest so the vectors
# match the RAG unit that serves them; the endpoint is the library's own
# (OLLAMA_URL for Ollama).
instantiate:
  - fragment: /opt/providers/embed-document-fragment.yaml
    args: {input_selector: $.raw, id_selector: $.path, model: "${CORPUS_EMBEDDING_MODEL:-qwen3-embedding:8b}"}
rest:
  version: v1
