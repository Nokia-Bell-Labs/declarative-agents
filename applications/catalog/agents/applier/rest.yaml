unit: catalog-applier-rest
# Standalone catalog conformance binding. Consumer endpoints, ports, limits,
# response mappings, and authority stay in each application wrapper.
rest:
  version: v1
  auth:
    none: {type: none}
  limits:
    standalone_apply:
      timeout: 30s
      read_timeout: 30s
      max_request_bytes: 1048576
      max_response_bytes: 1048576
      redirect: {mode: none}
      network:
        schemes: [http]
        hosts: [127.0.0.1, localhost]
        ports: [18330]
    standalone_control:
      timeout: 30s
      read_timeout: 5s
      max_request_bytes: 16384
      max_response_bytes: 65536
      redirect: {mode: none}
      network:
        schemes: [http]
        hosts: [127.0.0.1, localhost]
        ports: [18331]
  servers:
    applier_apply:
      address: 127.0.0.1:18330
      limits_ref: standalone_apply
      endpoints:
        apply:
          method: POST
          path: /conformance/apply
          binding: machine_request
          request:
            body_schema:
              type: object
              required: [content]
              properties:
                content: {type: string}
          machine_request:
            profile: apply-profile.yaml
            timeout: 30s
            request:
              body:
                content: $.content
                path: ${APPLIER_WORK_DIR:-/work}/overrides.yaml
            response:
              terminal_states:
                Done: {status: 200, content_type: application/json, body: {status: applied}}
                Rejected: {status: 400, content_type: application/json, body: {status: rejected}}
                RolledBack: {status: 500, content_type: application/json, body: {status: rolled_back}}
                Failed: {status: 500, content_type: application/json, body: {status: failed}}
        rollout:
          method: GET
          path: /conformance/rollout
          binding: machine_request
          machine_request:
            profile: rollout-profile.yaml
            timeout: 10s
            request: {body: {}}
            response:
              terminal_states:
                Complete:
                  status: 200
                  content_type: application/json
                  body: {phase: complete, ready: $.ready, desired: $.desired, revision: $.revision}
                Progressing:
                  status: 200
                  content_type: application/json
                  body: {phase: progressing, ready: $.ready, desired: $.desired, revision: $.revision}
                Unavailable: {status: 502, content_type: application/json, body: {status: unavailable}}
    applier_control:
      address: 127.0.0.1:18331
      limits_ref: standalone_control
      queue: {name: applier_control, capacity: 8, timeout: 30s}
      shutdown: {timeout: 5s, drain_policy: drain_then_stop}
      endpoints:
        health: {method: GET, path: /api/lifecycle/health, binding: health}
