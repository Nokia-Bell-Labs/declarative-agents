# Tool selection for the plan workflow. The words and file words are
# model-invoked in the Plan state via $tool dispatch (design.md D10, D14).
tools:
  # words -- model-invoked
  - plan_candidates
  - plan_write
  - plan_push
  - plan_backlog
  - issue_merge
  - release_gate
  - release_tag
  - clean_up

  # File words
  - read
  - write
  - edit
  - find
  - list_files

  # Commit words -- model-invoked where the skill commits
  - stage_all
  - commit

  # Model loop -- direct transition actions
  - invoke_llm
  - parse_response
  - report_parse_error
  - reset_history
  - nudge_reread

  # Completion -- emits TaskCompleted via parse_response
  - done
