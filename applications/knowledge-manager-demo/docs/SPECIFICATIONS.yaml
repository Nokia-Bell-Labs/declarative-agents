coverage_gaps:
  - id: release-00.0-implementation
    status: planned
    description: |
      The specification corpus exists. Sibling issues under GH-1055 relocate
      application assets, implement the pinned presentation and run targets,
      add deterministic tests, and register root orchestration.
  - id: shared-contract-executable-evidence
    status: planned
    description: |
      The documents classify shared requirement applicability, but the
      application-local Mage module and tests do not exist yet. Root mage audit
      does not dispatch this application. Direct structural validation is the
      only current document evidence and does not satisfy managed-service or
      root-orchestration acceptance criteria.
  - id: live-browser-observation
    status: dependency_gated
    description: |
      Deterministic tests validate commands and configuration without servers.
      Live launch and exit evidence requires available ports and an agent-core
      runtime; visual browser inspection remains an operator step.
