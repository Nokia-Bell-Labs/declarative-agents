# Every coding role runs the shared agent-core-toolchain image (GH-1368):
# agent-core layered with the Go 1.26 toolchain and pinned golangci-lint
# v2.12.2 required by the canonical executor. It replaces the retired per-app
# coding-agent-runtime; profiles remain generated by `mage helmPrepare` and
# mounted read-only at /profiles.
image:
  repository: ghcr.io/nokia-bell-labs/declarative-agents/agent-core-toolchain
  tag: "0.1.0"
  pullPolicy: IfNotPresent

profiles:
  mountPath: /profiles

workspace:
  mountPath: /work
  existingClaim: ""
  storageClass: ""
  accessModes: [ReadWriteMany]
  size: 5Gi

roles:
  planner:
    replicas: 1
    requestPort: 18200
    controlPort: 18201
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {cpu: "2", memory: 2Gi}
  executor:
    replicas: 1
    requestPort: 18210
    controlPort: 18211
    resources:
      requests: {cpu: 250m, memory: 512Mi}
      limits: {cpu: "4", memory: 4Gi}
  critic:
    replicas: 1
    requestPort: 18220
    controlPort: 18221
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {cpu: "2", memory: 2Gi}

# Planner and executor canonical declarations read OLLAMA_URL. The chart-owned
# tier is optional; disabling it uses the fixed external endpoint below.
llm:
  externalURL: http://ollama.default.svc.cluster.local:11434
  port: 11434

ollama:
  enabled: false
  image: {repository: ollama/ollama, tag: latest, pullPolicy: IfNotPresent}
  utilityImage: busybox:1.36
  models: ["qwen3.6:35b-mlx"]
  persistence:
    storageClass: ""
    size: 25Gi
  resources:
    requests: {cpu: "1", memory: 4Gi}
    limits: {cpu: "8", memory: 32Gi}
  gpu:
    count: 0
  nodeSelector: {}
  tolerations: []

collector:
  enabled: true
  image:
    repository: ghcr.io/nokia-bell-labs/declarative-agents/agent-core
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  otlpGRPCPort: 4317
  queryPort: 18193
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {cpu: 500m, memory: 512Mi}

# The applier (srd006): the deployment-plane actuator that realizes a decided
# values change against this chart on Kubernetes. Disabled by default -- it runs
# the shared applier image (agent-core plus helm and kubectl, a sanctioned
# divergence from the profile-free runtime image, srd003 R1.2; GH-1368), which is
# not the runtime image the serving and smoke tests kind-load, so the live tier
# enables it explicitly (ci/kind-applier-values.yaml) and supplies the chart it
# mounts at /chart via applier.chartArchive.
applier:
  enabled: false
  # The shared applier image carries the agent-core runtime plus helm and kubectl
  # (GH-1368); it bakes no chart. Built from agent-core/applier.Dockerfile.
  image:
    repository: ghcr.io/nokia-bell-labs/declarative-agents/applier
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  # The packaged chart the applier's `helm upgrade coding-agent /chart` word
  # installs, base64-encoded, delivered to the applier pod at /chart as a mounted
  # volume rather than baked into the image (GH-1368). Empty by default; whoever
  # enables the applier supplies it, e.g. the release tooling passes
  #   --set-file applier.chartArchive=<packaged-chart.tgz.b64>
  # so the chart bytes travel with the Helm release. With it empty the applier
  # renders without the chart mount (fine for render-only checks; a live applier
  # needs the chart).
  chartArchive: ""
  # apply/request server, control server, monitor server. Chosen apart from the
  # role ports (18200-18221) and the collector ports so no listener collides.
  ports: {apply: 18230, control: 18231, monitor: 18232}
  # allowApply grants the apply-path RBAC (helm upgrade manages the chart objects).
  allowApply: true
  # Gate the apply surface off the serving and collector pods at the network layer:
  # the declarative REST servers carry no inbound auth, so only an authorized
  # operator or CI caller reaches the apply port (srd006 R4.3).
  networkPolicy:
    enabled: true
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 500m, memory: 256Mi}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile: {type: RuntimeDefault}

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
