id: srd003-writing-agent-tools
title: Writing Agent Tool Contracts
status: specified

problem: |
  Prose Editor needs one named ToolDef word for every machine action that crosses
  a workproduct, child-agent, retrieval, model, GitHub, lifecycle, corpus, or
  Pangram boundary. Without a closed vocabulary, a model could invent a path,
  URL, ref, vector, credential, or shell command; an editor could acquire
  publication authority; or an infrastructure failure could be mistaken for a
  critic verdict.

  This SRD fixes the planned words and their ownership while reusing agent-core
  builtin, REST, exec, child-agent, and lifecycle factories. It defines no new
  Go tool factory and makes no runtime-conformance claim.

goals:
  - "G1: Name every boundary action required by the planned writing saga and corpus wrapper."
  - "G2: Keep workproduct and GitHub authority exclusive to workflow-orchestrator."
  - "G3: Keep retrieval and model authority corpus-scoped and keep model output data-only."
  - "G4: Keep Pangram authority exclusive to voice-critic and gated by affirmative consent."
  - "G5: Specify signals, errors, effects, and compensation without confusing domain outcomes with infrastructure failures."
  - "G6: Reuse existing factories and prohibit arbitrary shell or a new Go builtin."

applicability:
  release: "00.0"
  implementation_status: documentation_only_runtime_planned

factory_reuse:
  builtin:
    authorities:
      - agent-core internal tools registry
      - agent-core/tools/builtin/filesystem/all.yaml
    factories: [list_resource, read_resource, compose, parse_structured, value_predicate]
  rest:
    authorities:
      - agent-core/docs/specs/config-formats/rest-tool-format.yaml
      - applications/chatbot-mesh/agents/rag-server/request-declarations.yaml
    factories: [rest_client_invoke]
  llm:
    authority: agent-core per-profile invoke_llm declarations
    factories: [invoke_llm]
  child_agent:
    authorities:
      - agent-core/tools/builtin/execute-task.yaml
      - agent-core/docs/specs/config-formats/tool-declaration-format.yaml
    factories: [execute_task]
    rule: |
      New declarations use profile-only child_agent_config. execute_task is the
      planner pipeline factory: registration requires config.profile; dispatch
      requires a current task and current plan; success returns child stdout as
      ExecutionDone, non-success returns truncated exit/stdout/stderr as
      ExecutionFailed, and missing planner state or invocation errors return
      CommandError. Planned orchestrator wiring must prepare one bounded current
      task/plan envelope for each child call; execute_task itself does not parse
      or refine the child business outcome.
  lifecycle:
    authority: agent-core/tools/builtin/lifecycle/
    factories: [suspend, checkpoint_history, checkpoint_rollback, exit_agent]
  exec:
    authorities:
      - agent-core/tools/exec.yaml
      - agent-core internal exec builder
    rule: |
      Each exec word fixes one binary and operation in trusted declarations.
      It invokes no shell interpreter. Runtime values come only from validated
      request or command-state selectors and cannot replace the binary, base
      arguments, working root, endpoint, credential, or operation. The generic
      exec factory emits only ToolDone, ToolFailed, or CommandError. A launched
      zero-exit JSON-emitting helper operation returns bounded stdout through
      structured output;
      a following parse_structured word validates the nested output string, and
      value_predicate words refine valid business outcomes one scalar at a time.
      Every orchestrator exec declaration fixes output mode structured,
      output_cap 256 lines, a helper operation whose own stdout is at most
      262144 bytes, and a JSON Schema that bounds every parsed string, array,
      and object. Truncation cannot become a valid business result.
      No orchestrator parser consumes raw git, gh, digest-tool, or shell output.
      Hash, source, publication, pull-request, and workproduct operations are
      fixed operations of one planned constrained non-shell orchestrator helper
      executable (or a separately fixed workproduct helper with the same JSON
      contract). The helper safely invokes only its compiled/configured git or
      gh subcommand for the selected fixed operation and emits the bounded
      domain JSON itself. Each ToolDef fixes the helper binary and operation in
      declaration args. Runtime data cannot select or replace the binary,
      operation, git/gh subcommand, URL, refspec shape, credential source,
      working root, or output schema. This remains exec reuse and adds no Go
      builtin.
    planned_orchestrator_helper:
      status: not_implemented
      kind: constrained_non_shell_executable
      fixed_operations:
        - read-workproduct
        - hash-workproduct
        - write-original
        - write-attempt
        - append-manifest-revision
        - project-manifest
        - materialize-final-chain
        - resolve-source-revision
        - fetch-source
        - read-source-blob
        - check-publication
        - create-publication-branch
        - stage-final-chain
        - commit-final-chain
        - push-publication
        - find-pull-request
        - create-pull-request
        - verify-pull-request
      invocation_contract: |
        Each exec ToolDef fixes one operation token in declaration-owned base
        args. The helper has no generic command, shell, eval, arbitrary argv,
        arbitrary URL, arbitrary ref, or credential parameter. It receives only
        schema-validated operation data through bounded stdin or fixed
        declaration parameters. Repository, destination, base, branch, and
        credential authority remain configuration-owned; source revision and
        path are validated request data and cannot alter command shape.
      subprocess_contract: |
        Operations that need git or gh construct an operation-specific argv
        internally from fixed subcommands and flags. They do not invoke a shell.
        gh JSON fields are fixed; git text is parsed inside the helper. The
        helper validates identities and emits one bounded JSON object on stdout.
        A valid business status exits zero. Helper/process failure exits nonzero.
      parser_contract: |
        Exec structured mode wraps helper stdout as
        {"output":"<helper-json>","exit_code":0}. parse_structured selects only
        $from(<raw-label>).output. Therefore every parsed JSON string originates
        in the helper, not in exec output shaping or raw git/gh/digest stdout.
    planned_style_editor_helper:
      status: not_implemented
      kind: constrained_non_shell_executable
      fixed_operations:
        - identify-tightening-intents
        - assess-tightening-pairs
        - inspect-style-constraints
      invocation_contract: |
        Each specialist-editor:style exec ToolDef fixes the helper binary and exactly one
        operation token in declaration-owned arguments. It receives one bounded
        JSON document through a fixed stdin_source and has no runtime binary,
        operation, path, environment, endpoint, model, corpus, credential,
        command, or arbitrary argv parameter.
      output_contract: |
        Each operation emits one bounded JSON object on zero exit. Exec
        structured mode wraps that object as an output string plus exit_code.
        A distinct parse_structured word selects only the nested output string
        and validates a closed schema before any one-scalar predicate routes
        the report. Helper or process failure exits nonzero and never becomes a
        domain result.
    planned_critic_helper:
      status: not_implemented
      kind: constrained_non_shell_executable
      fixed_operations:
        - validate-request
        - validate-evaluation
        - interpret-pangram
        - compare-pangram
      invocation_contract: |
        Each critic exec ToolDef fixes the helper binary and exactly one
        operation token in declaration-owned arguments. It receives bounded
        JSON through fixed stdin or validated request input and has no runtime
        binary, operation, path, endpoint, model, corpus, credential, command,
        shell, or arbitrary argv parameter.
      output_contract: |
        Each operation emits one bounded JSON object on zero exit. Exec
        structured mode wraps that object under output with exit_code. A
        distinct parse_structured word selects only the nested output string,
        validates a closed schema, and feeds visible one-scalar predicates.
        The helper may validate hashes and compute advisory differences but
        cannot edit content, issue a verdict, or select authority.

authority_invariants:
  - Only workflow-orchestrator selects workproduct and git/gh words.
  - Only voice-critic selects Pangram words.
  - Editors and voice-critic receive document bytes and artifact identities, never saga paths.
  - Structure, voice, and style retrieval words bind only structure-rag, voice-rag, and tightening-rag respectively; voice-critic may bind voice-rag read-only.
  - Corpus wrapper words execute outside writing sagas and cannot select workproduct, GitHub, or Pangram words.
  - All URL, host, route, model, collection, filesystem root, destination repository, base, branch, and credential authority originates in validated profile or human-policy configuration.
  - Human request fields may express source and publication intent only after allowlist and containment validation; no LLM response supplies an authority-bearing value.
  - Embedding vectors originate only in configured embedding responses and thread through command state into vector-in RAG requests.
  - LLM outputs contain document content, bounded findings, provenance references, or declared enum choices only.
  - No profile exposes a generic shell, command string, arbitrary executable, arbitrary REST URL, generic filesystem write, or generic git/gh word.

signal_policy:
  infrastructure:
    signal: CommandError
    meaning: Configuration, selector, process-start, filesystem, network, timeout, authentication, response-schema, or provider failure.
  exec_domain:
    signal: ToolFailed
    meaning: A constrained executable launched and returned non-zero. The machine treats this as an infrastructure or uncertain-operation failure, never as a business branch.
  domain: |
    Named non-error signals report valid business outcomes such as a missing
    source, publication conflict, rejected retrieval request, child rejection,
    critic verdict, or withheld consent. A domain outcome never uses
    CommandError and an infrastructure failure never becomes pass, warn,
    reject, published, or consent granted.

word_vocabulary:
  orchestrator_workproducts:
    - name: validate_saga_request
      owner: workflow-orchestrator
      implementation:
        type: builtin
        factory: parse_structured
        reuse: Validate the configured request schema and bounded enums.
      inputs: [human request, configured repository and publication allowlists, saga identity policy]
      outputs: [validated source intent, validated publication intent, retry policy, Pangram consent state, policy digest]
      emits: [SagaRequestValid, SagaRequestRejected, CommandError]
      infrastructure_errors: [missing schema, selector failure, validator failure]
      domain_errors: [repository not allowlisted, path escapes repository, invalid revision syntax, destination or branch policy denied, invalid retry or consent value]
      side_effects: [none]
      reversibility: {classification: reversible, undo: noop}
      compensation: No state exists to compensate.
      authority: May validate human intent against trusted policy; cannot invent or widen policy.

    - name: read_workproduct
      owner: workflow-orchestrator
      implementation:
        type: exec
        factory: exec
        reuse: Fixed read-workproduct operation of the planned constrained non-shell orchestrator/workproduct helper, which emits bounded JSON.
      inputs: [machine-selected artifact_id, manifest-recorded relative path, expected sha256, configured saga root]
      outputs: [bounded structured exec object whose output string is a JSON result with status, exact bytes, byte length, verified sha256, and artifact_id]
      emits: [ToolDone, ToolFailed, CommandError]
      infrastructure_errors: [helper unavailable, filesystem read failure]
      domain_errors: [artifact absent, path containment denied, digest mismatch, manifest identity mismatch]
      side_effects: [filesystem_read]
      reversibility: {classification: reversible, undo: noop}
      compensation: Read-only.
      authority: Resolves only manifest-recorded paths beneath the configured saga root; neither model nor child supplies a path.

    - name: hash_workproduct
      owner: workflow-orchestrator
      implementation:
        type: exec
        factory: exec
        reuse: Fixed hash-workproduct operation of the planned constrained non-shell orchestrator helper, which emits bounded JSON.
      inputs: [document or critique bytes from validated command state]
      outputs: [bounded structured exec object whose output string is a JSON result with status, lowercase sha256, and byte length]
      emits: [ToolDone, ToolFailed, CommandError]
      infrastructure_errors: [helper unavailable, fixed digest implementation failure, stdin selector or size failure]
      domain_errors: [helper JSON reports an invalid or conflicting digest result]
      side_effects: [child_process]
      reversibility: {classification: reversible, undo: noop}
      compensation: Deterministic observation only.
      authority: Reads bytes; cannot read a path or accept an algorithm from model output.

    - name: write_original
      owner: workflow-orchestrator
      implementation:
        type: exec
        factory: exec
        reuse: Fixed write-original operation of the planned constrained non-shell orchestrator/workproduct helper, which emits bounded JSON.
      inputs: [validated source bytes, source identity, expected sha256, configured saga root]
      outputs: [bounded structured exec object whose output string is a JSON result with status, original artifact record, verified sha256, and byte length]
      emits: [ToolDone, ToolFailed, CommandError]
      infrastructure_errors: [helper unavailable, write or fsync failure]
      domain_errors: [existing bytes differ, path containment denied, source identity conflict, digest mismatch]
      side_effects: [filesystem_write]
      reversibility: {classification: irreversible, undo: preserve_original}
      compensation: Never delete or overwrite 00-original.md; record failure and retain evidence.
      authority: Creates only the fixed original path derived from configured saga root and saga_id.

    - name: write_attempt
      owner: workflow-orchestrator
      implementation:
        type: exec
        factory: exec
        reuse: Fixed write-attempt operation of the planned constrained non-shell orchestrator/workproduct helper, which emits bounded JSON.
      inputs: [validated stage, monotonic attempt, bytes, sha256, parent artifact IDs, producer and invocation provenance]
      outputs: [bounded structured exec object whose output string is a JSON result with status, immutable artifact record, verified relative path, and byte length]
      emits: [ToolDone, ToolFailed, CommandError]
      infrastructure_errors: [helper unavailable, write or fsync failure]
      domain_errors: [invalid stage, reused attempt number, parent mismatch, digest mismatch, conflicting existing bytes]
      side_effects: [filesystem_write]
      reversibility: {classification: irreversible, undo: append_supersession}
      compensation: Preserve attempt bytes and append a superseded or rejected manifest status.
      authority: Derives the attempt path from trusted stage, attempt, and computed hash; no model or child supplies a path.

    - name: append_manifest_revision
      owner: workflow-orchestrator
      implementation:
        type: exec
        factory: exec
        reuse: Fixed append-manifest-revision operation of the planned constrained non-shell orchestrator/workproduct helper, which emits bounded JSON.
      inputs: [prior manifest revision, validated transition, artifact and stage-run records, expected next revision]
      outputs: [bounded structured exec object whose output string is a JSON result with status, immutable manifest-history revision identity, revision, and sha256]
      emits: [ToolDone, ToolFailed, CommandError]
      infrastructure_errors: [helper unavailable, serialization, write, or fsync failure]
      domain_errors: [noncontiguous revision, invalid transition, hash or lineage conflict]
      side_effects: [filesystem_write]
      reversibility: {classification: irreversible, undo: append_corrective_revision}
      compensation: Append a later corrective state; never rewrite manifest history.
      authority: Writes only the next derived history path under the saga root.

    - name: project_manifest
      owner: workflow-orchestrator
      implementation:
        type: exec
        factory: exec
        reuse: Fixed project-manifest operation of the planned constrained non-shell orchestrator/workproduct helper, which emits bounded JSON.
      inputs: [highest valid contiguous manifest-history revision, expected sha256]
      outputs: [bounded structured exec object whose output string is a JSON result with projection_status, revision, sha256, request_mode, stage_result, verdict, warn_allowed, responsible_stage, retry_disposition, resume_step, and terminal_status]
      emits: [ToolDone, ToolFailed, CommandError]
      infrastructure_errors: [helper unavailable, temporary write, rename, or fsync failure]
      domain_errors: [history gap, invalid revision, projection conflict]
      side_effects: [filesystem_write]
      reversibility: {classification: compensatable, undo: reproject_from_history}
      compensation: Rebuild manifest.yaml from the highest valid contiguous immutable revision.
      authority: Writes only manifest.yaml from immutable history and reports bounded validated manifest scalars; it cannot emit a route, inspect prose, or accept model-authored bytes or paths.

    - name: materialize_final_chain
      owner: workflow-orchestrator
      implementation:
        type: exec
        factory: exec
        reuse: Fixed materialize-final-chain operation of the planned constrained non-shell orchestrator/workproduct helper, which emits bounded JSON.
      inputs: [critic-accepted lineage, verified selected attempt bytes and hashes, configured saga root]
      outputs: [bounded structured exec object whose output string is a JSON result with status, fixed finalized artifact records, and expected tree digest]
      emits: [ToolDone, ToolFailed, CommandError]
      infrastructure_errors: [helper unavailable, read, copy, write, or fsync failure]
      domain_errors: [critic not accepted, lineage incomplete, source hash mismatch, fixed path contains different bytes]
      side_effects: [filesystem_write, filesystem_read]
      reversibility: {classification: irreversible, undo: preserve_and_block}
      compensation: Reuse matching files; preserve and block on a mismatching fixed file.
      authority: Creates only the five fixed srd002 finalization paths from selected immutable artifacts.

  orchestrator_children:
    - name: invoke_structure_editor
      owner: workflow-orchestrator
      implementation: {type: builtin, factory: execute_task, reuse: Profile-only child-agent invocation for specialist-editor:structure.}
      inputs: [original bytes and artifact ID, saga/stage/attempt identity, bounded structure policy, invocation id and idempotency key]
      outputs: [candidate bytes, parent identity, content hash, structural evidence provenance, producer identity]
      emits: [ExecutionDone, ExecutionFailed, CommandError]
      infrastructure_errors: [profile missing, process start failure, timeout, malformed transport response]
      domain_errors: [child reports invalid input or cannot produce a bounded edit]
      side_effects: [child_agent_execution]
      reversibility: {classification: irreversible, undo: record_observation}
      compensation: Preserve the prior parent; retry with the recorded idempotency policy. No child filesystem exists to restore.
      authority: Starts only the configured specialist-editor:structure profile; request contains bytes, never workspace paths.

    - name: invoke_voice_editor
      owner: workflow-orchestrator
      implementation: {type: builtin, factory: execute_task, reuse: Profile-only child-agent invocation for specialist-editor:voice.}
      inputs: [selected accepted structure bytes, artifact ID, content hash and acceptance identity, saga/stage/attempt identity, target voice, ordered passage map and initial rhetorical-role/register query descriptors, protected-content inventory, adjacent-context windows, bounded retrieval and rewrite policy, zeroed retrieval refinement count, initial rewrite attempt count, invocation id and idempotency key]
      outputs: [candidate or unchanged parent bytes, parent identity, content hash, outcome, anchor provenance, copy-risk findings, constraint report, stage metadata, producer identity]
      emits: [ExecutionDone, ExecutionFailed, CommandError]
      infrastructure_errors: [profile missing, process start failure, timeout, malformed transport response]
      domain_errors: [child reports invalid input, unsupported target, insufficient anchors, exhausted preservation or copy-risk retry, or another failed outcome]
      side_effects: [child_agent_execution]
      reversibility: {classification: irreversible, undo: record_observation}
      compensation: Preserve the selected structure parent and retry under recorded policy.
      authority: Starts only the configured specialist-editor:voice profile; request contains bytes, never workspace paths.

    - name: invoke_style_editor
      owner: workflow-orchestrator
      implementation: {type: builtin, factory: execute_task, reuse: Profile-only child-agent invocation for specialist-editor:style.}
      inputs: [selected accepted voice bytes, artifact ID, content hash and acceptance identity, saga/stage/attempt identity, ordered passage map, protected-content inventory, bounded tightening and retrieval policy, zeroed retrieval refinement count, initial edit attempt count, invocation id and idempotency key]
      outputs: [candidate or unchanged parent bytes, parent identity, content hash, outcome, explicit tightening intents, attempted and selected transformation-pair provenance, changed-span ledger, constraint report, stage metadata, producer identity]
      emits: [ExecutionDone, ExecutionFailed, CommandError]
      infrastructure_errors: [profile missing, process start failure, timeout, malformed transport response]
      domain_errors: [child reports invalid input, no applicable intent, insufficient pairs, exhausted preservation retry, or another failed outcome]
      side_effects: [child_agent_execution]
      reversibility: {classification: irreversible, undo: record_observation}
      compensation: Preserve the selected voice parent and retry under recorded policy.
      authority: Starts only the configured specialist-editor:style profile; request contains bytes, never workspace paths.

    - name: invoke_voice_critic
      owner: workflow-orchestrator
      implementation: {type: builtin, factory: execute_task, reuse: Profile-only child-agent invocation for voice-critic.}
      inputs: [original and selected style bytes and artifact IDs, both hashes, acceptance policy, explicit Pangram consent state, invocation identity]
      outputs: [prose-editor.critic-response/v1 completed critique with evaluated hashes, six categorized findings, separate Pangram statuses and comparison, pass/warn/reject, nullable responsible stage, and bounded feedback; failed child outcome uses ExecutionFailed]
      emits: [ExecutionDone, ExecutionFailed, CommandError]
      infrastructure_errors: [profile missing, process start failure, timeout, malformed transport response]
      domain_errors: [valid pass, warn, or reject verdict; invalid critic request]
      side_effects: [child_agent_execution]
      reversibility: {classification: irreversible, undo: record_observation}
      compensation: Preserve candidate and prior verdict evidence; retry does not erase external observations.
      authority: Starts only voice-critic; the child alone may select Pangram words and cannot mutate workproducts.

  orchestrator_github:
    - name: git_resolve_source_revision
      owner: workflow-orchestrator
      implementation: {type: exec, factory: exec, reuse: "Fixed resolve-source-revision operation of the planned constrained non-shell orchestrator helper; it invokes fixed git ls-remote semantics and emits bounded JSON."}
      inputs: [validated human revision, configured allowlisted repository]
      outputs: [bounded structured exec object whose output string is a JSON result with status and resolved full commit ID]
      emits: [ToolDone, ToolFailed, CommandError]
      infrastructure_errors: [helper or git unavailable, network, authentication, or timeout failure]
      domain_errors: [revision absent, ambiguous, moving result changed during capture]
      side_effects: [child_process, external_api]
      reversibility: {classification: reversible, undo: noop}
      compensation: Read-only.
      authority: Repository comes from trusted configuration and revision from validated human intent, never model output.

    - name: git_fetch_source
      owner: workflow-orchestrator
      implementation: {type: exec, factory: exec, reuse: "Fixed fetch-source operation of the planned constrained non-shell orchestrator helper; it invokes one fixed git fetch shape and emits bounded JSON."}
      inputs: [configured repository, resolved full commit ID]
      outputs: [bounded structured exec object whose output string is a JSON result with status and local object identity]
      emits: [ToolDone, ToolFailed, CommandError]
      infrastructure_errors: [helper or git unavailable, network, authentication, disk, or timeout failure]
      domain_errors: [fetched identity differs, object unavailable]
      side_effects: [child_process, external_api, filesystem_write]
      reversibility: {classification: compensatable, undo: discard_isolated_fetch_cache}
      compensation: Drop only the isolated rebuildable fetch cache; never alter saga workproducts.
      authority: Fetches one configured remote and resolved commit; no arbitrary refspec, URL, or directory input.

    - name: git_read_source_blob
      owner: workflow-orchestrator
      implementation: {type: exec, factory: exec, reuse: "Fixed read-source-blob operation of the planned constrained non-shell orchestrator helper; it invokes fixed git object-read semantics and emits bounded JSON."}
      inputs: [resolved full commit ID, validated repository-relative human source path]
      outputs: [bounded structured exec object whose output string is a JSON result with status, exact blob bytes, and object identity]
      emits: [ToolDone, ToolFailed, CommandError]
      infrastructure_errors: [helper or git unavailable, repository corruption, read failure]
      domain_errors: [path absent, non-blob object, path containment denied]
      side_effects: [child_process, filesystem_read]
      reversibility: {classification: reversible, undo: noop}
      compensation: Read-only.
      authority: Reads one validated path at one resolved commit; model output supplies neither.

    - name: git_check_publication
      owner: workflow-orchestrator
      implementation: {type: exec, factory: exec, reuse: "Fixed check-publication operation of the planned constrained non-shell orchestrator helper; it invokes fixed local and remote git/gh identity reads and emits bounded JSON."}
      inputs: [publication key, expected tree sha, configured destination, base, and branch, recorded commit sha]
      outputs: [bounded structured exec object whose output string is a JSON result with status absent, matching, or conflict and bounded identities]
      emits: [ToolDone, ToolFailed, CommandError]
      infrastructure_errors: [helper, git, or gh unavailable, network, authentication, or internal parse failure]
      domain_errors: [tree, commit, branch, or destination conflicts with manifest]
      side_effects: [child_process, filesystem_read, external_api]
      reversibility: {classification: reversible, undo: noop}
      compensation: Read-only check precedes every publication mutation.
      authority: Inspects only manifest/configured publication identities.

    - name: git_create_publication_branch
      owner: workflow-orchestrator
      implementation: {type: exec, factory: exec, reuse: "Fixed create-publication-branch operation of the planned constrained non-shell orchestrator helper; it invokes one fixed git branch operation and emits bounded JSON."}
      inputs: [configured base commit, configured publication branch, publication key]
      outputs: [bounded structured exec object whose output string is a JSON result with status created, reused, or conflict and local branch identity and head]
      emits: [ToolDone, ToolFailed, CommandError]
      infrastructure_errors: [helper or git unavailable, local repository failure]
      domain_errors: [existing branch points to conflicting history, base mismatch]
      side_effects: [child_process, filesystem_write]
      reversibility: {classification: compensatable, undo: discard_unpublished_matching_branch}
      compensation: Remove only an unpushed branch created for this publication key; preserve conflicts for operators.
      authority: Branch and base come from validated configuration/human policy, never model output.

    - name: git_stage_final_chain
      owner: workflow-orchestrator
      implementation: {type: exec, factory: exec, reuse: "Fixed stage-final-chain operation of the planned constrained non-shell orchestrator helper; it invokes one fixed git add pathspec shape, verifies the index, and emits bounded JSON."}
      inputs: [configured saga root, finalized manifest, expected file inventory and hashes]
      outputs: [bounded structured exec object whose output string is a JSON result with status staged or conflict, staged path inventory, and index tree sha]
      emits: [ToolDone, ToolFailed, CommandError]
      infrastructure_errors: [helper or git unavailable, index lock or filesystem failure]
      domain_errors: [unexpected path, missing finalized file, staged tree mismatch]
      side_effects: [child_process, filesystem_write]
      reversibility: {classification: compensatable, undo: restore_index_checkpoint}
      compensation: Restore the local index checkpoint; immutable saga files remain.
      authority: Stages only the configured complete saga root; no model-authored pathspec.

    - name: git_commit_final_chain
      owner: workflow-orchestrator
      implementation: {type: exec, factory: exec, reuse: "Fixed commit-final-chain operation of the planned constrained non-shell orchestrator helper; it invokes one fixed git commit shape, verifies identities, and emits bounded JSON."}
      inputs: [configured commit message template, publication key, expected index tree sha]
      outputs: [bounded structured exec object whose output string is a JSON result with status committed, reused, or conflict and commit, tree, and parent shas]
      emits: [ToolDone, ToolFailed, CommandError]
      infrastructure_errors: [helper or git unavailable, signing or repository failure]
      domain_errors: [nothing staged before recorded commit, tree mismatch, conflicting commit for key]
      side_effects: [child_process, filesystem_write]
      reversibility: {classification: compensatable, undo: preserve_or_drop_unpushed_commit}
      compensation: Before push, restore the recorded local ref only when identity matches; after push, never rewrite history.
      authority: Creates exactly one commit from the verified staged tree; message is a configured template, not model text.

    - name: git_push_publication
      owner: workflow-orchestrator
      implementation: {type: exec, factory: exec, reuse: "Fixed push-publication operation of the planned constrained non-shell orchestrator helper; it invokes one fixed non-force git push shape, rechecks remote identity, and emits bounded JSON."}
      inputs: [configured destination, configured branch, recorded commit sha, expected remote prior state]
      outputs: [bounded structured exec object whose output string is a JSON result with status pushed, reused, or conflict and pushed ref and remote head]
      emits: [ToolDone, ToolFailed, CommandError]
      infrastructure_errors: [helper or git unavailable, network, authentication, timeout, uncertain completion]
      domain_errors: [non-fast-forward or remote head conflict]
      side_effects: [child_process, external_api]
      reversibility: {classification: irreversible, undo: forward_only_operator_resolution}
      compensation: Recheck remote identity and continue forward; never force-push or delete a remote ref automatically.
      authority: Pushes one recorded commit to one configured destination and branch; accepts no URL, refspec, force, or credential parameter.

    - name: gh_find_pull_request
      owner: workflow-orchestrator
