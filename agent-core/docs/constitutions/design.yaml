      frontmatter:
        required: [id, title]
        allowed: [id, title]
      nodes:
        document_field:
          tag: field
          level: 2
          parent: document
          heading: free
          content: any
          fields:
          - executive_summary
          - problem
          - vision_model_diagram
          - tool_language_diagram
          - what_this_does
          - why_we_build_this
          - multi_agent_system_thesis
          - operational_flows
