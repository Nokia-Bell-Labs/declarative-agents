        sub_roles: [output-evaluator, sandbox-validator]
      - path: applications/chatbot-mesh/agents/rag-server/tests/query/profile.yaml
        actor: rag-query-validator
        role: critic
        sub_roles: [output-evaluator, sandbox-validator]
