# Shapes the mesh's REST server words publish: what a launch, a stop, and an
# awaited control event report, and the empty parameter object of a word whose
# input arrives through config. Declared here rather than imported from
# agent-core because an application cannot reach another tree's units
# (srd051 R1.5); the unit segment of an address is a namespace (R1.4).
unit: mesh-types-server
types:
- name: NoParameters
  description: The empty parameter object of a word whose input arrives through config selectors.
  schema:
    type: object
    properties: {}
- name: ServerLaunch
  description: What a REST server launch reports.
  schema:
    type: object
    properties:
      server: {type: string}
      address: {type: string}
      route_count: {type: integer}
- name: ServerStop
  description: What a REST server stop reports.
  schema:
    type: object
    properties:
      server: {type: string}
      status: {type: string}
- name: ControlEvent
  description: The control event an await selected.
  schema:
    type: object
    properties:
      source: {type: string}
      route: {type: string}
      signal: {type: string}
      payload: {type: object}
      request_id: {type: string}
