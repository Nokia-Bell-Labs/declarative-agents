rest:
  version: v1
  auth:
    none: {type: none}
  limits:
    role_request:
      timeout: 5m
      read_timeout: 5m
      max_request_bytes: 65536
      max_response_bytes: 65536
      redirect: {mode: none}
      network:
        schemes: [http]
        hosts: [127.0.0.1, localhost]
        ports: [18220]
        allow_public_listener: true
    role_control:
      timeout: 30s
      read_timeout: 5s
      max_request_bytes: 16384
      max_response_bytes: 65536
      redirect: {mode: none}
      network:
        schemes: [http]
        hosts: [127.0.0.1, localhost]
        ports: [18221]
        allow_public_listener: true
  servers:
    role_requests:
      address: ${CRITIC_BIND_HOST:-127.0.0.1}:18220
      limits_ref: role_request
      shutdown: {timeout: 10s, drain_policy: drain_then_stop}
      endpoints:
        review:
          method: POST
          path: /api/v1/review
          binding: machine_request
          request:
            body_schema:
              type: object
              required: [workspace_id]
              properties:
                workspace_id: {type: string, min_length: 1}
          machine_request:
            profile: ../../../agents/critic/profile-workspace.yaml
            timeout: 5m
            request:
              body:
                workspace_id: $.workspace_id
            response:
              terminal_states:
                Succeeded:
                  status: 200
                  content_type: application/json
                  body:
                    verdict: accepted
                    accepted: "true"
                Rejected:
                  status: 422
                  content_type: application/json
                  body:
                    verdict: rejected
                    accepted: "false"
                Failed:
                  status: 500
                  content_type: application/json
                  body:
                    verdict: error
                    accepted: "false"
    role_control:
      address: ${CRITIC_BIND_HOST:-127.0.0.1}:18221
      limits_ref: role_control
      queue: {name: critic_control, capacity: 8, timeout: 30s}
      shutdown: {timeout: 5s, drain_policy: drain_then_stop}
      endpoints:
        exit:
          method: POST
          path: /api/lifecycle/exit
          binding: emit_signal
          signal: ExitRequested
          request:
            body_schema:
              type: object
              properties:
                reason: {type: string}
          response:
            output: {accepted: "true"}
        health:
          method: GET
          path: /api/lifecycle/health
          binding: health
