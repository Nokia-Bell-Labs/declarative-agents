name: lifecycle-exit
purpose: |-
  The catalog's reusable lifecycle-exit client. It posts one lifecycle-exit
  request to a running agent's control server through a declared REST client,
  then terminates. Expressing it as a four-state Idle -> Posting -> Done/Failed
  machine that binds the rest tool keeps runtime behavior in YAML, run by the
  interpreter, not in an ad-hoc HTTP client. A consumer points the REST client's
  base_url at the target control server; agent-architecture's presentation uses
  it to stop the documentation-curator.
invariants:
  - REST authority lives in rest.yaml; the control-server URL is a declared client base, not runtime input.
  - The exit request body is fixed in the REST operation, not supplied at run time.
  - The model plays no part; the single boundary word is machine-sequenced from Seed.
initial_state: Idle
budget:
  command_timeout: 1m
  max_iterations: 4
states:
  - name: Idle
    meaning: Initial state before the exit request is posted.
  - name: Posting
    meaning: The lifecycle-exit request is in flight to the control server.
  - name: Done
    run_status: succeeded
    meaning: Terminal. The control server accepted the exit request.
  - name: Failed
    run_status: failed
    meaning: Terminal. The control-server call failed.
terminal_states:
  - Done
  - Failed
signals:
  - name: Seed
    trigger: Agent startup.
  - name: ExitAccepted
    trigger: The control server accepted the lifecycle-exit request.
  - name: CommandError
    trigger: The control-server call failed on network, timeout, or mapping.
transitions:
  - state: Idle
    signal: Seed
    next: Posting
    action: post_exit
  - state: Idle
    signal: CommandError
    next: Failed
  - state: Posting
    signal: ExitAccepted
    next: Done
  - state: Posting
    signal: CommandError
    next: Failed
