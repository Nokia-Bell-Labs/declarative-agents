# Fixture for R-MODEL-004: an enter naming the state it leaves but not the
# signal that leaves it.
kind: machine
schema_version: 1
name: review-host
initial_state: Idle
budget: {command_timeout: 1m, max_iterations: 20}
terminal_states: [Done, Failed]
states:
  - {name: Idle, meaning: Waiting for work.}
  - {name: Working, meaning: Doing the work.}
  - {name: Done, meaning: Work finished., run_status: succeeded}
  - {name: Failed, meaning: Work rejected., run_status: failed}
signals:
  - {name: Seed, trigger: A caller hands work over.}
  - {name: Worked, trigger: The work is ready for review.}
  - {name: CommandError, trigger: A word failed.}
transitions:
  - {state: Idle, signal: Seed, next: Working}
  - {state: Working, signal: Worked, next: Done}
  - {state: Working, signal: CommandError, next: Failed}
compose:
  - template: ../../units/review.yaml
    args: {reviewer: critic}
    enter: {from: Done}
