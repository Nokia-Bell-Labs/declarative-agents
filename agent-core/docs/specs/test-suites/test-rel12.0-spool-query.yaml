id: test-rel12.0-spool-query
title: Test Suite for Release 12.0 Spool Query Tools
release: "12.0"

traces:
  - rel12.0-uc001-spool-query

preconditions:
  - srd044-spool-query-tools defines spool_list_traces and spool_get_trace behavior.
  - srd042-otlp-receiver-tools defines the NDJSON spool shape and rotation naming that the query tools read.
  - Tests create spool files in temporary directories and do not require a running OTLP receiver.

test_cases:
  - use_case: rel12.0-uc001-spool-query
    name: List traces aggregates across active and rotated spool files
    go_test: go test ./internal/tools/otlp -run TestListTracesAcrossActiveAndRotated
    status: implemented
    description: |
      One span in a rotated file and two spans (same trace) in the active file
      produce two trace summaries. The newer trace appears first. Root service
      and root span name match the root span of each trace. Skipped lines is
      zero.
    inputs:
      rotated_file_spans: 1
      active_file_spans: 2
      traces: 2
    expected:
      signal: TracesListed
      total: 2
      first_trace_span_count: 2
      skipped_lines: 0
    traces:
      - rel12.0-uc001-spool-query S1
      - srd044-spool-query-tools AC1

  - use_case: rel12.0-uc001-spool-query
    name: Pagination returns the correct page with offset and page size
    go_test: go test ./internal/tools/otlp -run TestListTracesPagination
    status: implemented
    description: |
      Five single-span traces with increasing start times. Page size 2 and
      offset 1 returns two traces starting from the second-newest. Total
      remains 5.
    inputs:
      total_traces: 5
      page_size: 2
      offset: 1
    expected:
      signal: TracesListed
      total: 5
      returned: 2
    traces:
      - rel12.0-uc001-spool-query S2
      - srd044-spool-query-tools AC2

  - use_case: rel12.0-uc001-spool-query
    name: Page size is capped at max_page_size
    go_test: go test ./internal/tools/otlp -run TestListTracesPageSizeCap
    status: implemented
    description: |
      A declared page_size of 50 with max_page_size 5 results in an effective
      page size of 5.
    inputs:
      page_size: 50
      max_page_size: 5
    expected:
      signal: TracesListed
      effective_page_size: 5
    traces:
      - srd044-spool-query-tools AC2

  - use_case: rel12.0-uc001-spool-query
    name: Empty or absent spool returns an empty result
    go_test: go test ./internal/tools/otlp -run TestListTracesEmptySpool
    status: implemented
    description: |
      A spool path that does not exist produces TracesListed with zero traces
      and zero total, not an error.
    inputs:
      spool_exists: false
    expected:
      signal: TracesListed
      total: 0
    traces:
      - rel12.0-uc001-spool-query S4
      - srd044-spool-query-tools AC4

  - use_case: rel12.0-uc001-spool-query
    name: Malformed NDJSON lines are skipped and counted
    go_test: go test ./internal/tools/otlp -run TestListTracesMalformedLineTolerance
    status: implemented
    description: |
      Two malformed lines followed by one valid span line produce one trace
      summary with skipped_lines equal to 2.
    inputs:
      malformed_lines: 2
      valid_spans: 1
    expected:
      signal: TracesListed
      total: 1
      skipped_lines: 2
    traces:
      - srd044-spool-query-tools AC4

  - use_case: rel12.0-uc001-spool-query
    name: Get trace returns span details with waterfall fields
    go_test: go test ./internal/tools/otlp -run TestGetTraceReturnsSpanDetails
    status: implemented
    description: |
      Three spans across two traces. Querying trace t1 returns two spans
      sorted by start time with correct span id, parent span id, service,
      name, and timing. The span from trace t2 is excluded.
    inputs:
      total_spans: 3
      traces: 2
      query_trace: t1
    expected:
      signal: TraceRetrieved
      span_count: 2
      first_span_name: root
      first_span_parent: ""
    traces:
      - rel12.0-uc001-spool-query S3
      - srd044-spool-query-tools AC3

  - use_case: rel12.0-uc001-spool-query
    name: Get trace reads across rotated files
    go_test: go test ./internal/tools/otlp -run TestGetTraceAcrossRotatedFiles
    status: implemented
    description: |
      One span in a rotated file and one span in the active file for the same
      trace. Both appear in the result sorted by start time.
    inputs:
      rotated_spans: 1
      active_spans: 1
      same_trace: true
    expected:
      signal: TraceRetrieved
      span_count: 2
    traces:
      - srd044-spool-query-tools AC1
      - srd044-spool-query-tools AC3

  - use_case: rel12.0-uc001-spool-query
    name: Unknown trace ID returns empty spans
    go_test: go test ./internal/tools/otlp -run TestGetTraceUnknownTraceID
    status: implemented
    description: |
      Querying a trace id that does not exist in the spool returns
      TraceRetrieved with zero spans.
    inputs:
      query_trace: nonexistent
    expected:
      signal: TraceRetrieved
      span_count: 0
    traces:
      - srd044-spool-query-tools AC3

  - use_case: rel12.0-uc001-spool-query
    name: Empty trace ID emits CommandError
    go_test: go test ./internal/tools/otlp -run TestGetTraceEmptyTraceIDError
    status: implemented
    description: |
      A spool_get_trace with an empty trace_id config emits CommandError
      before reading any file.
    inputs:
      trace_id: ""
    expected:
      signal: CommandError
    traces:
      - srd044-spool-query-tools AC5

  - use_case: rel12.0-uc001-spool-query
    name: Empty spool path emits CommandError
    go_test: go test ./internal/tools/otlp -run TestListTracesEmptyPathError
    status: implemented
    description: |
      A spool_list_traces with an empty path config emits CommandError.
    inputs:
      path: ""
    expected:
      signal: CommandError
    traces:
      - srd044-spool-query-tools AC5
