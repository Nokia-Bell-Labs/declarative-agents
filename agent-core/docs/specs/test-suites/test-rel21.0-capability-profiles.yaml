id: test-rel21.0-capability-profiles
title: Test Suite for Release 21.0 Capability Profiles
release: "21.0"

traces:
  - rel21.0-uc001-capability-profiles

preconditions:
  - srd057-capability-profiles defines the capability profile, the consumption forms it supports, and the binding discipline the consistency check reports against.
  - srd022 R6 self_invoke, srd027 machine_request bindings, and srd055 blueprints are available and unchanged by this release.
  - A capability fixture exists whose machine reaches a terminal state and which declares no serve lifecycle, control or monitor server, or static assets.

test_cases:
  - use_case: rel21.0-uc001-capability-profiles
    name: A capability fixture loads, terminates, and carries no hosting
    go_test: go test ./internal/load ./internal/tools/catalog -run 'TestCapabilityProfileLoadsAndTerminates|TestCapabilityProfileDeclaresNoServingAssets'
    status: planned
    description: Load the capability fixture and run it to a terminal state; then add a control server, a monitor server, and a static_assets binding to copies of it.
    expected:
      loads_and_terminates: true
      serving_assets_reported: true
      no_extra_profile_field_required: true
    traces: [rel21.0-uc001-capability-profiles S1, srd057-capability-profiles AC1, srd057-capability-profiles R1.1]

  - use_case: rel21.0-uc001-capability-profiles
    name: A capability is reached only by a declared path
    go_test: go test ./internal/load -run 'TestCapabilityProfileIsReachedOnlyByPath'
    status: planned
    description: Reference the fixture by a machine_request profile path, by a child-agent config.profile, and by a serving wrapper's fields; then by a bare name with no path.
    expected:
      path_references_resolve: true
      bare_name_rejected: true
    traces: [rel21.0-uc001-capability-profiles S1, srd057-capability-profiles AC1, srd057-capability-profiles R1.3]

  - use_case: rel21.0-uc001-capability-profiles
    name: One unchanged capability serves the route, the child, and the wrapper
    go_test: go test ./internal/tools/rest ./internal/tools/control ./internal/load -run 'TestMachineRequestBindsACapabilityProfile|TestSelfInvokeRunsACapabilityProfile|TestServingWrapperHostsACapabilityProfile'
    status: planned
    description: Bind the fixture by machine_request naming profile with its terminal states mapped to responses, invoke the same file through self_invoke with request and output selectors, and host it from a serving wrapper; compare the fixture's bytes across the three.
    expected:
      terminal_states_map_to_responses: true
      selectors_undo_and_trace_propagate: true
      hosted_without_edit: true
      capability_bytes_identical: true
    traces: [rel21.0-uc001-capability-profiles S2, srd057-capability-profiles AC2, srd057-capability-profiles R2.1, srd057-capability-profiles R2.2, srd057-capability-profiles R2.3]

  - use_case: rel21.0-uc001-capability-profiles
    name: The in-process boundary stays evaluation-scoped
    go_test: go test ./internal/tools/evaluation -run 'TestRunPointRequiresItsPointMachine'
    status: planned
    description: Point run_point at the capability fixture, which declares no point_machine, point_tools, or point_tool_declarations.
    expected:
      registration_fails_naming_missing_fields: true
    traces: [rel21.0-uc001-capability-profiles S2, srd057-capability-profiles AC2, srd057-capability-profiles R2.4]

  - use_case: rel21.0-uc001-capability-profiles
    name: Shared machines are reported and private ones are not
    go_test: go test ./pkg/profileaudit -run 'TestAuditReportsAMachineReachedByTwoProfiles|TestAuditReportsAnOverrideWhoseMachineIsShared|TestAuditIsSilentForAPrivateMachine'
    status: planned
    description: Point two profiles at one machine file; add a machine_request override whose machine another profile also reaches; then leave a machine reached by exactly one profile.
    expected:
      shared_machine_reported_with_every_reaching_profile: true
      shared_override_reported: true
      reported_as_finding_not_load_error: true
      private_machine_silent: true
    traces: [rel21.0-uc001-capability-profiles S3, srd057-capability-profiles AC3, srd057-capability-profiles R3.1, srd057-capability-profiles R3.2, srd057-capability-profiles R3.3]
