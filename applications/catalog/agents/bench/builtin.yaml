tools:
- name: launch_bench_http
  type: builtin
  init: rest_server_launch
  visibility: internal
  emits: [ServerLaunched, CommandError]
  description: Launch the profile-configured bench HTTP application.
  category: boundary
  problem: Bench needs a generic listener for profile-owned routes and assets.
  goals: [Launch only the REST server selected by rest_ref.]
  requirements: {input: [Trusted REST configuration.], output: [Server launch receipt.], errors: [Bind and configuration failures emit CommandError.]}
  non_goals: [Does not implement routes or evaluation behavior.]
  parameters: {type: object, properties: {}, additionalProperties: false}
  output: {description: REST server launch result, schema: {type: object}}
  side_effects: [{kind: network_listen, target: bench_http, state: listener_started}]
  reversibility: {classification: compensatable}
  undo: {strategy: compensating_action, description: Stop the configured listener.}
  errors: [{signal: CommandError, condition: Listener launch fails, state_after_failure: No route is exposed.}]
  relationships: {before: [await_bench_action], after: [stop_bench_http]}
  config: {rest_ref: bench}

- name: await_bench_action
  type: builtin
  init: rest_await_event
  visibility: internal
  emits: [ExperimentRequested, Shutdown, AwaitTimedOut, ServerStopped, CommandError]
  description: Await one declared operator action from the bench REST queue.
  category: boundary
  problem: The host machine needs profile-visible operator control while the UI remains available.
  goals: [Return only launch and shutdown signals with their validated payload.]
  requirements: {input: [The configured bench queue.], output: [One inbound event.], errors: [Timeout, stop, and infrastructure outcomes stay distinct.]}
  non_goals: [Does not launch a child or interpret evaluation artifacts.]
  parameters: {type: object, properties: {}, additionalProperties: false}
  output: {description: Bench operator event, schema: {type: object}}
  side_effects: [{kind: state_mutation, target: bench_action_queue, state: event_consumed}]
  reversibility: {classification: reversible}
  undo:
    strategy: queue_event_restore
    description: Restore the receipt-recorded event to the front of its source queue.
    payload: rest_await_event
    captures: [source, event]
  errors: [{signal: CommandError, condition: Queue is unavailable, state_after_failure: Listener is unchanged.}]
  relationships: {before: [launch_bench_http], after: [validate_eval_suite, stop_bench_http]}
  config:
    sources:
      - server: bench
        routes: [actions]
        signals: [ExperimentRequested, Shutdown]
    timeout: 24h
    stopped_behavior: emit_server_stopped

- name: validate_eval_suite
  type: builtin
  init: value_predicate
  visibility: internal
  emits: [SuiteSelected, SuiteMissing, CommandError]
  description: Require a non-empty suite path before child dispatch.
  category: response
  problem: Child launch input must be guarded by profile-visible policy.
  goals: [Reject empty suite paths without starting a child.]
  requirements: {input: [Operator action payload.], output: [Branch signal.], errors: [Missing selectors emit CommandError.]}
  non_goals: [Does not inspect or open the suite.]
  parameters: {type: object, properties: {}, additionalProperties: false}
  output: {description: Suite predicate result, schema: {type: object}}
  side_effects: [{kind: state_read, target: bench_operator_event, state: read_only}]
  reversibility: {classification: reversible}
  undo: {strategy: noop, description: Comparison changes nothing.}
  errors: [{signal: CommandError, condition: Suite selector cannot resolve, state_after_failure: No child started.}]
  relationships: {before: [await_bench_action], after: [launch_evaluator]}
  config:
    left: $.payload.body.config.suite
    op: non_empty
    operand_type: string
    satisfied: SuiteSelected
    unsatisfied: SuiteMissing

- name: launch_evaluator
  type: builtin
  init: self_invoke
  visibility: internal
  emits: [ToolDone, ToolFailed, CommandError]
  description: Invoke the critic through the reusable child-agent boundary.
  category: boundary
  problem: Bench launches need cancellation, trace propagation, and normal child dispatch.
  goals: [Resolve suite and output from the labelled operator event and invoke critic.]
  requirements: {input: [Validated action payload.], output: [Child stdout and completion signal.], errors: [Resolution or child failures remain visible.]}
  non_goals: [Does not parse HTTP or analyze evaluation results.]
  parameters: {type: object, properties: {}, additionalProperties: false}
  output: {description: Child evaluator output, schema: {type: string}}
  side_effects:
    - {kind: child_process, target: critic_agent, state: evaluation_running}
    - {kind: filesystem_write, target: eval_results, state: evaluator_owned}
  reversibility: {classification: compensatable}
  undo: {strategy: compensating_action, description: Compensate evaluator artifacts according to child boundary policy.}
  errors: [{signal: ToolFailed, condition: Critic exits unsuccessfully, state_after_failure: Partial evaluator artifacts may exist.}]
  relationships: {before: [validate_eval_suite], after: [await_bench_action]}
  config:
    profile: agents/critic/profile.yaml
    request_from: $from(operator_action).payload.body.config.suite
    output_from: $from(operator_action).payload.body.config.output_dir

- name: stop_bench_http
  type: builtin
  init: rest_server_stop
  visibility: internal
  emits: [ServerStopped, CommandError]
  description: Stop and drain the generic bench REST server.
  category: boundary
  problem: Clean shutdown must release the profile-owned listener.
  goals: [Apply the declared REST shutdown policy.]
  requirements: {input: [The configured server reference.], output: [Stop receipt.], errors: [Shutdown failures emit CommandError.]}
  non_goals: [Does not mutate evaluation artifacts.]
  parameters: {type: object, properties: {}, additionalProperties: false}
  output: {description: REST server stop result, schema: {type: object}}
  side_effects: [{kind: network_listener_shutdown, target: bench_http, state: listener_stopped}]
  reversibility: {classification: compensatable}
  undo:
    strategy: server_shutdown_or_user_action_compensation
    description: The receipt records shutdown loss; MachineSpec must relaunch the trusted bench definition.
    payload: boundary_compensation
    captures: [server, address, drained_events, dropped_events, relaunch_requirement]
  errors: [{signal: CommandError, condition: Listener cannot stop, state_after_failure: Listener may be partially drained.}]
  relationships: {before: [await_bench_action], after: []}
  config: {rest_ref: bench}
