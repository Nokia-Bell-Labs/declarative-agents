# An instance of agent-core's serve-machine template (srd054): the persistent
# service lifecycle with bench's server words wired in. Reads live in
# request-machine.yaml and critic launches in experiments-machine.yaml, so this
# machine holds no bench state of its own (GH-2168, GH-2188).
unit: bench-machine
name: bench
purpose: |-
  Host the human-operated bench as a persistent service. The host starts the
  UI and request listener, the control listener, and the monitor, waits for a
  lifecycle exit event, exits the agent, and stops the listeners. Critic runs
  start as detached children through the experiments capability behind
  POST /api/v1/experiments, so serving never pauses while they run, and the
  host's shutdown reaps any still running.

  - The bench never calls an LLM directly.
  - REST routes and UI assets are owned by the bench profile.
instantiate:
  - fragment: /opt/agent-core/tools/machines/serve-machine-template.yaml
    args:
      workflow: bench
      launch_requests: launch_bench_http
      launch_control: launch_bench_control
      await_control: await_bench_control
      stop_requests: stop_bench_http
