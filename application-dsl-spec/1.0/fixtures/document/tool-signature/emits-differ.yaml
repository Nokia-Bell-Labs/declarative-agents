# Fixture for R-TOOL-005: an entry whose signature.emits and legacy emits differ.
tools:
  - name: flatten_chunks
    type: builtin
    init: array_transform
    signature:
      emits: [ChunksFlattened, CommandError]
    emits: [ChunksFlattened]
