    - name: parse_cli_result
      kind: declaration_family
      owner: workflow-orchestrator
      implementation: {type: builtin, factory: parse_structured, reuse: Operation-specific declarations parse normalized JSON emitted by fixed orchestrator-helper operations.}
      inputs: [one fixed $from(label).output selector for bounded helper JSON stdout wrapped by exec structured mode]
      outputs: [validated operation-specific status and bounded identities]
      emits: [CliResultParsed, CliResultInvalid, CommandError]
      infrastructure_errors: [selector or schema configuration failure]
      domain_errors: [malformed or schema-invalid helper JSON stdout]
      side_effects: [none]
      reversibility: {classification: reversible, undo: noop}
      compensation: Parsing changes no external state.
      authority: |
        This is a specification family, not one polymorphic runtime word. Planned
        ToolDefs are parse_source_resolution, parse_source_fetch,
        parse_source_blob, parse_publication_check, parse_publication_branch,
        parse_publication_stage, parse_publication_commit,
        parse_publication_push, parse_pull_request_find,
        parse_pull_request_create, and parse_publication_verification. Each has
        one fixed source label, one closed schema, one parsed signal, one invalid
        signal, and CommandError.
        Despite the historical family name, these parsers never consume raw CLI
        text. Each source is the JSON string emitted by the corresponding fixed
        orchestrator-helper operation.
      planned_instances:
        - {name: parse_source_resolution, source: $from(source_resolution_raw).output, parsed: SourceResolutionParsed, invalid: SourceResolutionInvalid}
        - {name: parse_source_fetch, source: $from(source_fetch_raw).output, parsed: SourceFetchParsed, invalid: SourceFetchInvalid}
        - {name: parse_source_blob, source: $from(source_blob_raw).output, parsed: SourceBlobParsed, invalid: SourceBlobInvalid}
        - {name: parse_publication_check, source: $from(publication_check_raw).output, parsed: PublicationCheckParsed, invalid: PublicationCheckInvalid}
        - {name: parse_publication_branch, source: $from(publication_branch_raw).output, parsed: PublicationBranchParsed, invalid: PublicationBranchInvalid}
        - {name: parse_publication_stage, source: $from(publication_stage_raw).output, parsed: PublicationStageParsed, invalid: PublicationStageInvalid}
        - {name: parse_publication_commit, source: $from(publication_commit_raw).output, parsed: PublicationCommitParsed, invalid: PublicationCommitInvalid}
        - {name: parse_publication_push, source: $from(publication_push_raw).output, parsed: PublicationPushParsed, invalid: PublicationPushInvalid}
        - {name: parse_pull_request_find, source: $from(pull_request_find_raw).output, parsed: PullRequestFindParsed, invalid: PullRequestFindInvalid}
        - {name: parse_pull_request_create, source: $from(pull_request_create_raw).output, parsed: PullRequestCreateParsed, invalid: PullRequestCreateInvalid}
        - {name: parse_publication_verification, source: $from(publication_verification_raw).output, parsed: PublicationVerificationParsed, invalid: PublicationVerificationInvalid}
    - name: cli_status_predicate
      kind: declaration_family
      owner: workflow-orchestrator
      implementation: {type: builtin, factory: value_predicate, reuse: Operation-specific declarations compare one status scalar parsed from normalized helper JSON.}
      inputs: [one fixed parsed status selector, one configured status literal]
      outputs: [one comparison record]
      emits: [ConfiguredSatisfied, ConfiguredUnsatisfied, CommandError]
      infrastructure_errors: [selector or coercion failure]
      domain_errors: [comparison false]
      side_effects: [none]
      reversibility: {classification: reversible, undo: noop}
      compensation: Comparing changes no external state.
      authority: |
        This is a specification family, not one dynamic runtime word. Each
        planned predicate has fixed operands and exactly two named outcomes.
        Chains realize resolved/missing; fetched/conflict; read/missing;
        absent/matching/conflict; created/reused/conflict; staged/conflict;
        committed/reused/conflict; pushed/reused/conflict; pull-request
        absent/matching/conflict; pull-request created/reused/conflict; and
        verified/conflict.
      planned_instances:
        - {name: source_resolution_succeeded, left: $from(source_resolution).status, op: eq, right: resolved, operand_type: string, satisfied: SourceRevisionResolved, unsatisfied: SourceRevisionMissing}
        - {name: source_fetch_succeeded, left: $from(source_fetch).status, op: eq, right: fetched, operand_type: string, satisfied: SourceFetched, unsatisfied: SourceFetchConflict}
        - {name: source_blob_succeeded, left: $from(source_blob).status, op: eq, right: read, operand_type: string, satisfied: SourceBlobRead, unsatisfied: SourceBlobMissing}
        - {name: publication_is_absent, left: $from(publication_check).status, op: eq, right: absent, operand_type: string, satisfied: PublicationAbsent, unsatisfied: PublicationNotAbsent}
        - {name: publication_is_matching, left: $from(publication_check).status, op: eq, right: matching, operand_type: string, satisfied: PublicationMatching, unsatisfied: PublicationConflict}
        - {name: publication_branch_created, left: $from(publication_branch).status, op: eq, right: created, operand_type: string, satisfied: PublicationBranchCreated, unsatisfied: PublicationBranchNotCreated}
        - {name: publication_branch_reused, left: $from(publication_branch).status, op: eq, right: reused, operand_type: string, satisfied: PublicationBranchReused, unsatisfied: PublicationConflict}
