tools:
  - name: launch_subject_rest
    type: builtin
    init: rest_server_launch
    visibility: internal
    category: boundary
    description: Launch the subject REST endpoints that serve a scenario's fixture.
    parameters:
      type: object
      properties: {}
    signature:
      emits: [ServerLaunched, CommandError]
    output:
      description: Subject REST server launch result.
      schema:
        type: object
        properties:
          server: {type: string}
          address: {type: string}
          route_count: {type: integer}
          bindings: {type: array}
    side_effects:
      - kind: network_listen
        target: subject_rest_server
        state: listener_started
      - kind: state_mutation
        target: rest_server_state
        state: routes_registered
    reversibility:
      classification: compensatable
    undo:
      strategy: compensating_action
      description: Stop the REST server if the launch command owns the listener.
    errors:
      - signal: CommandError
        condition: Subject REST server config, bind, route, schema, or fixture validation failure.
        state_after_failure: No subject route is exposed and no request is served.
    config:
      rest_ref: subject

  - name: await_subject_control
    type: builtin
    init: rest_await_event
    visibility: internal
    category: boundary
    description: Await the subject REST control exit event.
    parameters:
      type: object
      properties: {}
    signature:
      emits: [ExitRequested, AwaitTimedOut, ServerStopped, CommandError]
    output:
      description: Selected subject control event.
      schema:
        type: object
        properties:
          source: {type: string}
          route: {type: string}
          signal: {type: string}
          payload: {type: object}
          request_id: {type: string}
    side_effects:
      - kind: state_mutation
        target: rest_server_queue
        state: selected_event_consumed
    reversibility:
      classification: irreversible
    undo:
      strategy: irreversible
      description: A consumed control event cannot be returned to the queue.
    errors:
      - signal: CommandError
        condition: Subject control source is missing or stopped with command_error policy.
        state_after_failure: Subject listener state is unchanged.
    config:
      sources:
        - server: subject
          routes: [control_exit]
          signals: [ExitRequested]
      # Tool declarations are not environment-expanded (only REST definitions
      # are), so this bound is literal. It must outlast a scenario: a rig
      # normally stops the subject explicitly, and an early timeout here would
      # take the dependency down mid-scenario.
      timeout: 10m
      stopped_behavior: emit_server_stopped

  - name: stop_subject_rest
    type: builtin
    init: rest_server_stop
    visibility: internal
    category: boundary
    description: Stop the owned subject REST listener.
    parameters:
      type: object
      properties: {}
    signature:
      emits: [ServerStopped, CommandError]
    output:
      description: Subject REST server stop result.
      schema:
        type: object
        properties:
          server: {type: string}
          address: {type: string}
          drained_events: {type: integer}
          dropped_events: {type: integer}
          status: {type: string}
    side_effects:
      - kind: network_listener_shutdown
        target: subject_rest_server
        state: listener_stopped
      - kind: state_mutation
        target: rest_server_state
        state: server_stopped
    reversibility:
      classification: irreversible
    undo:
      strategy: irreversible
      description: The listener and its per-instance request log are gone; relaunch is a separate action.
    errors:
      - signal: CommandError
        condition: Subject REST server is missing, shutdown times out, or cleanup fails.
        state_after_failure: Subject listener state may be partially stopped.
    config:
      rest_ref: subject

  - name: read_dependency
    type: builtin
    init: rest_client_get
    visibility: internal
    category: boundary
    description: Read the configured dependency once for this request.
    parameters:
      type: object
      properties: {}
    signature:
      emits: [RESTResourceRead, RESTDomainFailed, RESTMissing, CommandError]
    output:
      description: Dependency read result.
      schema:
        type: object
        properties:
          state: {type: string}
    side_effects:
      - kind: state_read
        target: dependency
        state: read_only
    reversibility:
      classification: reversible
    undo:
      strategy: noop
      description: A read changes nothing upstream.
    errors:
      - signal: CommandError
        condition: The dependency is unreachable or returns an unmapped status.
        state_after_failure: No upstream state changes.
    config:
      rest_ref: dependency
      resource: record
      operation: get
