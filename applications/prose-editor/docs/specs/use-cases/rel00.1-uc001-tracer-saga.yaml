id: rel00.1-uc001-tracer-saga
title: Tracer-Bullet Saga with Structure Stage and Local Finalization
release: "00.1"
status: implemented
runtime_status: deterministic_tracer

summary: |
  A human asks Prose Editor to edit one GitHub document at a selected revision,
  naming a target voice and bounded retry policy. The planned workflow
  orchestrator resolves and captures the source as an immutable original,
  invokes the specialist-editor structure stage, obtains an independent
  six-category critic verdict without Pangram, replays the structure stage when
  bounded policy permits, and finalizes one immutable accepted lineage locally
  without commit, push, or pull request.

  This tracer-bullet use case exercises the minimal end-to-end saga skeleton.
  Voice and style stages, Pangram upload, and GitHub publication are deferred
  to release 00.2. Every remote intent and accepted or rejected result is
  durable before the next action.

  Release 00.1 implements and validates the declarative profile, machine, tool,
  wrapper, role, and portable-manifest closure plus a deterministic end-to-end
  boundary fixture. It claims local tracer behavior only, not managed services
  or live external integrations.

actor: |
  A human document owner who supplies repository, source path and revision,
  target voice, bounded retry policy, saga identity, and withheld Pangram
  consent. Publication policy is not applicable in the tracer release.

trigger: |
  The human submits one validated Prose Editor request for a GitHub-hosted
  source document and a release 00.1 tracer saga.

preconditions:
  - The source repository, path, revision, models, structure corpus identity, service endpoints, credentials, output root, and hard limits are trusted configuration.
  - The requested repository, path, revision, policy, and saga identity pass the planned allowlist, containment, and conflict checks.
  - The persistent output workspace is available to exactly one orchestrator writer for the saga ID.
  - The structure corpus remains authoritative outside Chroma; the planned structure-rag instance is read-only and corpus-scoped.
  - Voice-rag, tightening-rag, and publication configuration are not required for the tracer.

flow:
  - id: F1
    text: |
      The orchestrator validates the human request, source authority, retry
      policy, saga identity, and withheld Pangram consent record. It appends
      and projects the request intent before remote work.
  - id: F2
    text: |
      The orchestrator resolves the requested revision to one full commit,
      fetches that commit through fixed constrained GitHub source operations,
      reads the validated blob, computes its SHA-256 and byte length, and writes
      or reuses 00-original.md exactly once.
  - id: F3
    text: |
      The orchestrator records the captured source repository, path, full
      commit, exact bytes, digest, and artifact identity in append-only manifest
      history, projects manifest.yaml, and never overwrites the original.
  - id: F4
    text: |
      The orchestrator appends and projects one structure intent, reads and
      verifies the immutable original, and invokes specialist-editor:structure
      with bytes and identities rather than a workspace path.
  - id: F5
    text: |
      Specialist-editor:structure deterministically retrieves section or outline
      evidence from structure-rag, permits at most one grounding refinement,
      performs only supported structural operations, validates semantic and
      required content preservation, and returns data without persistence
      authority.
  - id: F6
    text: |
      The orchestrator validates, hashes, and writes or reuses the structure
      response at its immutable attempt path, then appends and projects its
      accepted or rejected result before continuing.
  - id: F7
    text: |
      The orchestrator appends and projects critique intent, verifies and reads
      the immutable original and selected structure candidate, and invokes the
      isolated voice-critic with exact bytes, hashes, policy, and withheld
      Pangram consent but no editor reasoning, conversation, path, or verdict
      recommendation.
  - id: F8
    text: |
      The voice-critic independently compares the original and structure
      candidate. It validates all six finding categories (semantic preservation,
      structural intent, voice match, tightening quality, unsupported additions,
      and anchor copy risk). With Pangram consent withheld, no upload tasks are
      submitted. The critic returns a categorized verdict and responsible-stage
      assignment.
  - id: F9
    text: |
      On rejection, the orchestrator evaluates the responsible stage. If bounded
      retry policy permits, it supersedes the rejected structure attempt,
      replays the structure stage from the immutable original, and re-invokes
      the critic. On exhaustion, the orchestrator enters kept_original or
      failed terminal state.
  - id: F10
    text: |
      On acceptance, the orchestrator materializes 00-original.md,
      10-structure.md, 40-critique.yaml, and final.md at their fixed paths,
      appends and projects the finalized lineage, and enters the
      locally_finalized terminal state. No branch, commit, push, or pull
      request is performed.

