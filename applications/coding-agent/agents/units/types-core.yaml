# Shapes the coding-agent applier's exec words publish. ExecResult is the process
# result every agent-core exec tool returns; agent-core's library declares no
# type for it yet, so the application does (GH-2122 moves it into agent-core).
unit: coding-types-core
types:
- name: ExecResult
  description: The exit status and captured output of one child process an exec word ran.
  schema:
    type: object
    properties:
      exit_code: {type: integer}
      output: {type: string}
    required: [exit_code, output]
