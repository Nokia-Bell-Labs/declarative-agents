      inputs: [structured request containing supplied accepted structure bytes and artifact ID, parent content hash, saga/stage/attempt identity, target voice, ordered passage and query descriptors, protected-content inventory, adjacent-context windows, bounded retrieval and rewrite policy, zeroed retrieval refinement count, initial rewrite attempt count, and invocation identity]
