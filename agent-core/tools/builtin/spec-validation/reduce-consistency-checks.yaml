tools:
  - name: reduce_consistency_checks
    type: builtin
    init: reduce_consistency_checks
    category: boundary
    visibility: internal
    emits: [ValidationPassed, ValidationFailed, CommandError]
    description: Reduce externally loaded YAML and path inventory into consistency findings.
    parameters: {type: object, properties: {}}
    output:
      description: Aggregate validation counts after consistency checks.
      schema: {type: string}
    side_effects:
      - {kind: state_mutation, target: specification findings, state: consistency findings appended}
    reversibility: {classification: reversible, undo: restore_snapshot}
    undo: {strategy: restore_snapshot, description: Restore prior validation findings.}
    errors:
      - signal: CommandError
        condition: Joined scan evidence cannot be decoded or reduced.
        state_after_failure: The prior validation snapshot remains recoverable.
    config:
      results_from: $from(consistency_results).items
