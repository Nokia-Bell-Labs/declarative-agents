# Fixture for R-MODEL-005: a stage-fragment whose stage body carries initial_state.
unit: run-stage
params:
  - {name: prefix, type: string}
stage:
  initial_state: $param(prefix)Running
  states: [$param(prefix)Running]
  transitions:
    - {state: $param(prefix)Running, signal: Seed, next: Done}
