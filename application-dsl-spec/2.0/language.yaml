        check: tool_contract
        verdict: invalid
      - assertion: rig
        path: agent-core/internal/runtime/core/rollback_policy_test.go
        test: TestUndoStrategyVocabulary
      - assertion: rig
        path: agent-core/internal/runtime/core/rollback_policy_test.go
        test: TestExecUndoStrategySupportIsClosed

  - id: R-TOOL-008
    target: processor
    level: MUST
    statement: >-
      A tool declared `reversible` whose effects mutate state MUST declare
      an undo that consumes its receipt, and a conforming processor MUST
      refuse to start an agent whose closure holds one that does not. Each
      successful run of such a tool MUST return an opaque receipt, which
      the checkpoint persists with the step; a successful result without one
      becomes `CommandError` naming the tool and the signal. Undo is the same
      tool's: it
      receives its own prior result and decodes its receipt to reverse the
      effect, so a rollback after a restart walks the persisted receipts in
      reverse order, continuing past a step that fails to reverse and
      reporting it. The same walk reverses a failed run whose machine
      declares `on_failure.rollback` (R-RUN-006).
    acceptance:
      - assertion: fixture
        path: fixtures/specification/tool-contract/receipt-backed.yaml
        check: tool_contract
        verdict: valid
      - assertion: fixture
        path: fixtures/specification/tool-contract/reversible-without-receipt-undo.yaml
        check: tool_contract
        verdict: invalid
      - assertion: rig
        path: agent-core/internal/tools/catalog/receipt_contract_test.go
        test: TestValidateReceiptContractFailsMutatingReversibleWithNoopUndo
      - assertion: rig
        path: agent-core/internal/tools/catalog/receipt_contract_test.go
        test: TestValidateReceiptPresenceFailsReversibleToolWithoutReceipt
      - assertion: rig
        path: agent-core/internal/tools/lifecycle/checkpoint_compensation_test.go
        test: TestCheckpointRollbackRestoresFileViaPersistedReceipt
      - assertion: rig
        path: agent-core/internal/tools/lifecycle/receipt_rollback_test.go
        test: TestRollbackViaReceiptsContinuesPastFailure
      - assertion: pending
        note: >-
          No test in this repository anchors this statement; the engine in
          this repository implements the 1.0 language.

  - id: R-TOOL-009
    target: processor
    level: MUST
    statement: >-
      An `exec` tool names its `binary` and MAY carry `args` and an `argv`
      that maps input fields to its command line. Its exit code chooses its
      signal: `ToolDone` for 0 and `ToolFailed` otherwise, unless the tool
      declares `outcomes`, rows `{exit: N, signal: S}` or
      `{exit: [N, ...], signal: S}` with codes from 0 to 255 and exactly one
      `{default: S}` row answering every other code. Every signal a row
      names MUST be one the tool's `signature` emits, so a machine routes it
      like any other, and a row MAY set `parse: json` to decode the output as
      that signal's message. A transport error is `CommandError` and a
      failed precondition `ToolFailed`, whatever the table says; a tool
      that declares a `precondition` MUST therefore emit `ToolFailed` in
      its signature, so the gate's failure has a route a machine can
      declare. A
      conforming processor MUST refuse, naming the tool, `outcomes` on a
      tool with no `binary`, a row signal the signature does not emit, an
      exit code two rows name, a table without exactly one default, a
      row whose signal's message the output cannot meet: text for a row
      without `parse`, never text for one with it, and a `precondition`
      on a tool whose signature does not emit `ToolFailed`. The program an exec tool
      runs is outside every check a processor makes: the engine starts it
      as a child process in the tool's working directory with the agent's
      environment and files, or calls a runner the agent's build links in
      under the binary's name, and applies no sandbox, file-system, or
      network policy to it. What the program reaches, another agent
      service's routes, an outside system, or the application's channel key
      (R-RUN-007), no check sees, so an exec tool holds the whole authority
      of the agent that selects it.
    acceptance:
      - assertion: fixture
        path: fixtures/specification/exec-outcomes/valid.yaml
        check: exec_outcomes
        verdict: valid
      - assertion: fixture
        path: fixtures/specification/exec-outcomes/undeclared-signal.yaml
        check: exec_outcomes
        verdict: invalid
      - assertion: fixture
        path: fixtures/specification/exec-outcomes/overlapping-exit.yaml
        check: exec_outcomes
        verdict: invalid
      - assertion: fixture
        path: fixtures/specification/exec-outcomes/no-default.yaml
        check: exec_outcomes
        verdict: invalid
      - assertion: fixture
        path: fixtures/specification/exec-outcomes/builtin-outcomes.yaml
        check: exec_outcomes
        verdict: invalid
      - assertion: fixture
        path: fixtures/specification/exec-outcomes/parse-typed-as-text.yaml
        check: exec_outcomes
        verdict: invalid
      - assertion: fixture
        path: fixtures/specification/exec-outcomes/precondition-declares-toolfailed.yaml
        check: exec_outcomes
        verdict: valid
      - assertion: fixture
        path: fixtures/specification/exec-outcomes/precondition-without-toolfailed.yaml
        check: exec_outcomes
        verdict: invalid
      - assertion: pending
        note: >-
          No test in this repository anchors this statement; the engine in
          this repository implements the 1.0 language.

  - id: R-REST-001
    target: specification
    level: MUST
    statement: >-
      An agent-profile's `rest_definitions` files and `rest_config_dirs`
      directories supply the rest-definitions its closure loads. A
      rest-definition MUST carry `rest.version` and MAY declare `auth`,
      `limits`, and `retry` profiles and `clients`. A client names its
      `base_url` and the profiles it uses, each of which MUST be declared;
      it groups operations under `resources`, whose operations MUST be
      among `get`, `set`, `create`, and `delete`, or lists them directly
      under `operations`. An operation names its `method` and `path`,
      declares every path parameter the path uses under `params`, and maps
      responses to signals: `success` names the statuses and the signal of
      a success, and each `failures` entry maps statuses, or the
      `network_policy` stage, to a signal. An operation that changes state
      MUST declare its `side_effects` and `reversibility`, and one declared
      `irreversible` MUST require confirmation.
    acceptance:
      - assertion: fixture
        path: fixtures/specification/rest-client/valid.yaml
        check: rest_client
        verdict: valid
      - assertion: fixture
        path: fixtures/specification/rest-client/no-version.yaml
        check: rest_client
        verdict: invalid
      - assertion: fixture
        path: fixtures/specification/rest-client/undefined-limits.yaml
        check: rest_client
        verdict: invalid
      - assertion: fixture
        path: fixtures/specification/rest-client/undeclared-path-param.yaml
        check: rest_client
        verdict: invalid
      - assertion: fixture
        path: fixtures/specification/rest-client/unknown-resource-verb.yaml
        check: rest_client
        verdict: invalid
      - assertion: fixture
        path: fixtures/specification/rest-client/mutation-without-side-effects.yaml
        check: rest_client
        verdict: invalid
      - assertion: fixture
        path: fixtures/specification/rest-client/irreversible-without-confirmation.yaml
        check: rest_client
        verdict: invalid
      - assertion: rig
        path: agent-core/internal/tools/rest/emits_validation_test.go
        test: TestValidateClientEmitsRejectsSuccessAndFailureDrift
      - assertion: rig
        path: agent-core/internal/tools/rest/loading_imports_test.go
        test: TestLoadDefinitionsResolvesImportedRESTUnits

  - id: R-REST-002
    target: specification
    level: MUST
    statement: >-
      A rest-definition MAY declare `servers`. A server names its `address`,
      which MUST be a loopback address unless the server carries
      `allow_public_listener`, and its `endpoints`. Each endpoint names its
      `method` and `path` and MUST name a `binding`: among them
      `emit_signal`, which raises the named `signal` in the serving
      machine; `machine_request`, which runs a request profile's machine
      per request, seeded by the mapped request and answered by the status
      its terminal state maps; and `lifecycle_control` and `health`. Two
      endpoints of one server MUST NOT answer the same method and path.
    acceptance:
      - assertion: fixture
        path: fixtures/specification/rest-server/valid.yaml
        check: rest_server
        verdict: valid
      - assertion: fixture
        path: fixtures/specification/rest-server/no-binding.yaml
        check: rest_server
        verdict: invalid
      - assertion: fixture
        path: fixtures/specification/rest-server/public-address.yaml
        check: rest_server
        verdict: invalid
      - assertion: fixture
        path: fixtures/specification/rest-server/shadowed-endpoint.yaml
        check: rest_server
        verdict: invalid
      - assertion: rig
        path: agent-core/internal/tools/rest/server_machine_request_behavior_test.go
        test: TestRESTServerMachineRequestTerminalStatusMapping
      - assertion: rig
        path: agent-core/internal/tools/rest/server_machine_request_behavior_test.go
        test: TestRESTServerMachineRequestConfiguredInitialSignal
      - assertion: rig
        path: agent-core/internal/tools/rest/server_endpoints_test.go
        test: TestRESTServer_AwaitInboundSignals

  - id: R-MODEL-007
    target: specification
    level: MUST
    statement: >-
      A model is reached through an llm-configuration, a chat dialect that
      names its `unit`, a lowercase-kebab name, and its `provider_name`, and
      describes one POST request and its reply: the rooted `path`, the
      `auth` profile, and the `body` template filled from the call's
      parameters; under `response`, the paths to the reply `text`, whether
      a reply without text is a failure, and the paths to the input and
      output token counts; and under `failures`, the statuses it maps to
      signals. It MUST carry no other key. Provider differences live in the
      dialect, so one grammar reaches every provider.
    acceptance:
      - assertion: fixture
        path: fixtures/specification/model-dialect/valid.yaml
        check: model_dialect
        verdict: valid
      - assertion: fixture
        path: fixtures/specification/model-dialect/no-provider.yaml
        check: model_dialect
        verdict: invalid
      - assertion: fixture
        path: fixtures/specification/model-dialect/relative-path.yaml
        check: model_dialect
        verdict: invalid
      - assertion: fixture
        path: fixtures/specification/model-dialect/not-post.yaml
        check: model_dialect
        verdict: invalid
      - assertion: fixture
        path: fixtures/specification/model-dialect/bad-unit.yaml
        check: model_dialect
        verdict: invalid
      - assertion: fixture
        path: fixtures/specification/model-dialect/unknown-field.yaml
        check: model_dialect
        verdict: invalid

  - id: R-RUN-001
    target: runtime
    level: MUST
    statement: >-
      A conforming runtime MUST run a machine as a loop. In the current
      state it takes the signal that arrived, finds the one transition for
      that state and signal, runs its action if it has one, records the step
      (its label, command, signal, message, and receipt) in the step log and
      the checkpoint, and moves to `next`. The run ends when it enters a
      final state, whose `run_status` is the run's status; a signal with no
      transition in the current state ends the run failed, keeping the
      failure that raised it; a spent budget raises `BudgetExhausted`
      (R-MACH-013); and a cancelled run stops at the step it was on. A
      failed run's earlier effects stay in place unless the machine declares
      `on_failure.rollback` (R-RUN-006).
    acceptance:
      - assertion: rig
        path: agent-core/internal/runtime/core/loop_runtime_test.go
        test: TestLoop_RunsToCompletion
      - assertion: rig
        path: agent-core/internal/runtime/core/loop_runtime_test.go
        test: TestLoop_ActionlessTerminalTransitionStopsWithoutDispatch
      - assertion: rig
        path: agent-core/internal/runtime/core/loop_runtime_test.go
        test: TestLoop_UnhandledTransitionPreservesOriginalFailure
      - assertion: rig
        path: agent-core/internal/runtime/core/loop_runtime_test.go
        test: TestLoop_MachineFailureTerminalIsDomainOutcome
      - assertion: rig
        path: agent-core/internal/runtime/core/loop_runtime_test.go
        test: TestLoopUsesDeclaredStatusForArbitrarilyNamedTerminal
      - assertion: rig
        path: agent-core/internal/runtime/core/loop_runtime_test.go
        test: TestLoop_ContextCancellation
      - assertion: rig
        path: agent-core/internal/runtime/core/checkpoint_adapters_test.go
        test: TestInMemoryCheckpointRoundTripsConversationAndReceipts
      - assertion: pending
        note: >-
          No test in this repository anchors this statement; the engine in
          this repository implements the 1.0 language.

  - id: R-RUN-002
    target: runtime
    level: MUST
    statement: >-
      Before its first step a conforming runtime MUST load the whole closure
      and run every check the language states over it (kinds, declarations,
      types and handoffs, exhaustiveness, channel wiring, budgets and
      timeouts), and MUST refuse to start when any fails, exiting non-zero
      and naming the fault. Validating a configuration without running it
      applies the same checks and exits.
    acceptance:
      - assertion: pending
        note: >-
          No test in this repository anchors this statement; the engine in
          this repository implements the 1.0 language.

  - id: R-RUN-003
    target: runtime
    level: MUST
    statement: >-
      A conforming runtime MUST report a run's summary and final state when
      it ends and exit zero when the run succeeded or suspended, a
      suspended run being a deliberate pause its checkpoint resumes; any
      other end MUST exit with the machine-failure code. An exit an operator
      requested is orderly and exits zero.
    acceptance:
      - assertion: rig
        path: agent-core/cmd/agent/main_bootstrap_test.go
        test: TestRunPreparedPrintsSummaryFinalStateAndMappedExit
      - assertion: rig
        path: agent-core/cmd/agent/checkpoint_lifecycle_test.go
        test: TestRunPreparedMachineFailureUsesMachineExitCode
      - assertion: pending
        note: >-
          No test in this repository anchors this statement; the engine in
          this repository implements the 1.0 language.

  - id: R-RUN-004
    target: runtime
    level: MUST
    statement: >-
      A machine-hosting tool runs a child machine inside one step of its
      parent: on the `function` transport in the parent's process, on the
      `process` transport as a child agent, and on a network transport at a
      peer agent service (R-MODEL-006). Whatever the transport, the child
      runs under its own machine and budget, and its run's outcome returns
      to the parent as the step's result, `ToolDone` or `ToolFailed` with
      the child's summary, so the parent's machine is the same on every
      transport.
    acceptance:
      - assertion: pending
        note: >-
          No test in this repository anchors this statement; the engine in
          this repository implements the 1.0 language.

  - id: R-RUN-006
    target: runtime
    level: MUST
    statement: >-
      When a run of a machine that declares `on_failure.rollback` ends with
      status `failed` or `budget_exceeded`, whether in a final state with
      that status, on a signal with no transition, or on a spent budget with
      no route, a conforming runtime MUST walk the steps the run recorded in
      reverse dispatch order and hand each step's receipt to its tool's undo,
      the walk of R-TOOL-008, continuing past a step that fails to reverse.
      It MUST report each step's outcome in the run's result and trace:
      reversed, skipped because its tool is irreversible, pending
      compensation, undo failed, or not reversed because the step returned
      no receipt. The walk needs no revertible checkpoint, and the
      checkpoint keeps the failed run's steps. A cancelled run, and a failed
      run of a machine without the declaration, are not walked.
    acceptance:
      - assertion: pending
        note: >-
          No test in this repository anchors this statement; the engine in
          this repository implements the 1.0 language.

  - id: R-MODEL-003
    status: retired
