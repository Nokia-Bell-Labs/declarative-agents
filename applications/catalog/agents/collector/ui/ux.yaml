id: collector-trace-ui
title: Collector Trace Query UI
source_owner: agents/collector
routes:
  - id: traces_index
    path: /traces
    label: Traces
    action: list_traces
    resource: traces
  - id: trace_detail
    path: /traces/*
    label: Trace Detail
    action: get_trace
    resource: traces
  - id: explore
    path: /explore
    label: Explore
    action: span_stats
    resource: spans
actions:
  list_traces:
    ui_action: list_traces
    request_machine_action: query_list_traces
    route: traces_index
  get_trace:
    ui_action: get_trace
    request_machine_action: query_get_trace
    route: trace_detail
  span_stats:
    ui_action: span_stats
    request_machine_action: query_span_stats
    route: explore
  span_breakdown:
    ui_action: span_breakdown
    request_machine_action: query_span_breakdown
    route: explore
