# The RAG server serving lifecycle and its monitor pair, each one instantiation.
# The four lifecycle words arrive from the agent-core fragment under this
# agent's own names; nothing about them is written out here.
unit: mesh-rag-server-declarations
instantiate:
  - fragment: /opt/agent-core/tools/units/serve-lifecycle-declarations-fragment.yaml
    args:
      agent: "RAG server"
      launch_requests: launch_rag_requests
      launch_control: launch_rag_control
      await_control: await_rag_control
      stop_requests: stop_rag_requests
      requests_rest_ref: chroma_rag_requests
      control_rest_ref: chroma_rag_control
      requests_noun: query
      requests_purpose: for vector-in RAG queries
  - fragment: ../units/mesh-monitor-fragment.yaml
    args: {agent: "RAG server", control_await: await_rag_control, requests_stop: stop_rag_requests}
tools:
