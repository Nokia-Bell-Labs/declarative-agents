id: srd010-conversation
title: Conversation Management

problem: |
  invoke_llm owns inference, prompt assembly, tool manifests, and retry
  behavior. Conversation owns only the run-scoped append-only message history
  that dispatch and rollback share. Keeping a second, unused managed Chat path
  inside Conversation creates a concurrency contract production never uses.

goals:
  - G1: Single Conversation type supporting append-only history for invoke_llm.
  - G2: Thread-safe append-only message history with copy-on-read semantics.
  - G3: Snapshot, restore, truncate, and reset operations for rollback.
  - G4: Replace generator's ConversationHistory with agent-core Conversation.

requirements:
  R1:
    title: Message types
    items:
      - R1.1: Message is a struct with Role (MessageRole) and Content (string).
      - R1.2: MessageRole is a named string type with constants System, User, and Assistant.
      - R1.3: Message and MessageRole are JSON-serializable.
      - R1.4: Messages are immutable after append. Corrections arrive as new messages.

  R2:
    title: Conversation struct
    items:
      - R2.1: Conversation wraps a mutex-protected message slice and performs no inference.
      - R2.2: NewConversation(client, systemPrompt, opts) creates an empty Conversation.
      - R2.3: All methods are safe for concurrent use via sync.RWMutex.

  R3:
    title: Rollback lifecycle
    items:
      - R3.1: Snapshot returns a defensive copy of completed history.
      - R3.2: Restore replaces history from a snapshot.
      - R3.3: TruncateTo removes messages after a validated length and rejects an invalid length.

  R4:
    title: Manual mode (Append)
    items:
      - R4.1: Append(msg) adds a message to history without triggering a Chat call.
      - R4.2: Append supports any role (User, Assistant, System) for maximum flexibility.
      - R4.3: Messages added via Append are included in subsequent Messages, Snapshot, and invoke_llm assembly.
      - R4.4: Inference remains in invoke_llm rather than Conversation.

  R5:
    title: History access
    items:
      - R5.1: History() returns a copy of all messages in insertion order (oldest first).
      - R5.2: Messages() is an alias for History(), easing migration from generator's ConversationHistory.
      - R5.3: Len() returns the message count.

  R6:
    title: Prompt and inference boundary
    items:
      - R6.1: Conversation SHALL NOT call Client.Chat.
      - R6.2: DefaultAssembler SHALL combine structured prompt data with Conversation.Messages.
      - R6.3: invoke_llm SHALL own user and assistant appends around its Chat call.

  R7:
    title: Reset
    items:
      - R7.1: Reset() clears the message history.
      - R7.2: After Reset, Len() returns 0 and History() returns an empty slice.
      - R7.3: Append works normally after Reset.

  R8:
    title: No-compaction boundary
    items:
      - R8.1: Conversation does not compress, summarize, truncate, or slide-window the message slice.
      - R8.2: Context window management is the caller's responsibility, not the Conversation's.

non_goals:
  - Token counting or context window estimation.
  - Prompt assembly from structured parts (srd011 prompt schema responsibility).
  - Retry logic or error recovery.
  - Message persistence or serialization to disk.

acceptance_criteria:
  - id: AC1
    criterion: Append(msg) adds a message without calling Chat. Appended messages appear in History, Messages, and Snapshot.
    traces: [R1.1, R1.2, R1.3, R1.4, R4.1, R4.2, R4.3]

  - id: AC2
    criterion: Snapshot, Restore, and TruncateTo provide deterministic rollback over append-only history.
    traces: [R2.1, R2.2, R2.3, R3.1, R3.2, R3.3]

  - id: AC3
    criterion: History and Messages return defensive copies. Mutations do not affect internal state.
    traces: [R5.1, R5.2, R5.3, R8.1, R8.2]

  - id: AC4
    criterion: DefaultAssembler combines structured prompt data with Conversation history while inference remains in invoke_llm.
    traces: [R4.4, R5.2, R6.1, R6.2, R6.3]

  - id: AC5
    criterion: Generator can replace ConversationHistory with Conversation using Append + History without behavior change.
    traces: [R4.1, R5.2, R7.1]

  - id: AC6
    criterion: Reset clears history and Append works after Reset.
    traces: [R7.1, R7.2, R7.3]

depends_on: []

