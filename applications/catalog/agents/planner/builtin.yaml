# Planner-local builtin overrides.
# Adds mode-specific config to tools declared in tools/builtin.yaml.
# Loaded through agents/planner/profile.yaml tool_declarations.

tools:
  - name: report_parse_error
    type: builtin
    init: report_parse_error
    visibility: internal
    emits: [ToolDone, BudgetExhausted]
    description: "Report an invalid implementation plan back to the LLM for correction."
    category: word
    problem: "The planner retry loop must request the YAML document that parse_plan consumes."
    goals:
      - "Request one canonical ImplementationPlan YAML mapping after a parse failure."
      - "Keep response-shape policy declarative and separate from planner identity."
    requirements:
      input:
        - "must consume the parse_plan failure from the prior result"
      output:
        - "must emit ToolDone with exact ImplementationPlan YAML correction feedback"
      errors:
        - "must emit BudgetExhausted when the declared parse retry limit is reached"
    non_goals:
      - "Does not parse the corrected response or choose the next workflow state."
    output:
      description: "Plain-text feedback requesting corrected ImplementationPlan YAML."
      schema: {type: string}
    side_effects:
      - kind: command_state
        description: "Increments the parse retry counter and emits BudgetExhausted at the configured limit."
    reversibility:
      classification: reversible
      undo: parse_retry_counter_restore
    undo:
      strategy: parse_retry_counter_restore
      description: "Restores the parse retry counter snapshot captured before reporting the parse error."
    config:
      feedback_template: |-
        Your previous response was invalid. {{error}}

        Please respond with exactly one top-level YAML mapping and no other document content. The mapping must contain exactly these six keys: title, summary, files, requirements, design_decisions, and acceptance_criteria. Do not return a root sequence/list, multiple plans, a wrapper/envelope key, Markdown fences, prose, or any keys outside this mapping.

  - name: seed_passthrough_plan
    type: builtin
    init: seed_passthrough_plan
    description: "Seed the pass-through implementation plan from planner-profile policy."
    visibility: internal
    emits: [PassThroughPlanSeeded, CommandError]
    category: stateful_internal
    problem: "The planner pass-through variant owns its implementation-plan wording."
    goals:
      - "Keep pass-through plan title and summary in the planner profile."
      - "Seed plan state separately from task selection and graph lifecycle."
    requirements:
      input: ["must run after select_all_ready"]
      output: ["must emit PassThroughPlanSeeded after setting current plan"]
      errors: ["must emit CommandError when the selected task or configured text is missing"]
    non_goals:
      - "Does not select or mutate graph nodes."
    output:
      description: "Profile-configured pass-through plan seeding summary."
      schema:
        type: object
        properties:
          message: {type: string}
        required: [message]
    side_effects:
      - kind: state_mutation
        target: planner_pipeline_state
        state: current_plan_seeded
        description: "Sets only the current implementation plan."
    reversibility: {classification: reversible, undo: pipeline_state_restore}
    undo:
      strategy: pipeline_state_restore
      description: "Restore the receipt-recorded planner state."
    errors:
      - signal: CommandError
        condition: "current task or configured plan text is missing"
        message_shape: "seed_passthrough_plan: <error>"
        state_after_failure: "no graph lifecycle change occurs"
    relationships:
      before: [select_all_ready]
      after: [mark_nodes_planning]
    config:
      title: "Execute all ready requirements"
      summary: "Pass-through execution for the selected ready graph nodes."

  - name: invoke_executor
    type: builtin
    init: self_invoke
    description: "Invoke the configured executor through the shared child-agent boundary."
    visibility: internal
    emits: [ToolDone, ToolFailed, CommandError]
    category: boundary
    problem: |
      The planner needs a boundary word that hands the materialized task file
      to the executor program. This is not an ordinary deterministic word
      because it starts another agent process whose state machine and tools
      can mutate the workspace.
    goals:
      - "Run the configured executor profile in the planner workspace."
      - "Propagate profile and trace configuration into the child agent invocation."
      - "Return enough execution status for the planner to decide retry, advance, or fail."
    requirements:
      input:
        - "must require profile in config"
        - "must consume the workspace directory from runtime arguments"
      output:
        - "must emit ToolDone when the child agent exits successfully"
        - "must emit ToolFailed when the child agent exits without satisfying the task"
      side_effects:
        - "must spawn one child agent process"
        - "must allow the child agent to mutate the target workspace according to its own selected tools"
        - "must propagate trace context to the child process"
      undo:
        - "must rely on workspace checkpoints to restore child workspace mutations"
        - "must rely on pipeline history to restore planner command state"
      errors:
        - "must emit CommandError when required config is missing or the child process cannot be started"
    non_goals:
      - "Does not inspect or modify individual source files itself."
      - "Does not implement the executor workflow; the configured child machine does that."
      - "Does not guarantee rollback without an external workspace checkpoint."
    output:
      description: "Child executor execution status."
      schema:
        type: object
        properties:
          task_id:
            type: string
          exit_code:
            type: integer
          stdout:
            type: string
          stderr:
            type: string
          elapsed_ms:
            type: integer
          traceparent:
            type: string
        required: [exit_code]
    side_effects:
      - kind: child_agent_execution
        target: agent_cli
        description: "Starts the configured executor agent as a child process."
      - kind: filesystem_write
        target: workspace
        description: "The child agent may write files through its own selected tools."
    reversibility:
      classification: compensatable
      undo: workspace_restore
      requires_confirmation: false
    undo:
      strategy: workspace_restore
      description: "Restore the workspace checkpoint captured before executing the child agent and restore planner state from history."
      requires: [workspace_checkpoint, planner_state_checkpoint]
    errors:
      - signal: CommandError
        condition: "config is missing, task state is invalid, or child process cannot be started"
        message_shape: "invoke_executor: <error>"
        state_after_failure: "workspace unchanged unless the child process already started"
      - signal: ToolFailed
        condition: "child agent exits with failure status"
        message_shape: "invoke_executor failed: <status/output>"
        state_after_failure: "workspace may contain child edits and must be restored from checkpoint if rollback is requested"
    relationships:
      before: [record_tracker_issue, extract_task, mark_nodes_planning]
      after: [build, vet, test, increment_retry, mark_task_done]
      overlaps:
        - tool: run_point
          difference: "run_point invokes an in-process nested machine; invoke_executor uses the shared self_invoke child process."
    config:
      profile: agents/executor/profile.yaml

  - name: reset_retry_count
    type: builtin
    init: compose
    description: "Seed the visible retry count for a newly extracted task."
    problem: "Each extracted task needs a retry baseline that remains visible to the machine instead of hidden in planner session state."
    goals:
      - "Publish retry count zero under a stable command-state label."
      - "Let later increments replace the label by normal newest-entry semantics."
    requirements:
      input:
        - "must require no model or request input"
      output:
        - "must emit RetryCountInitialized with a JSON object whose output field is the string zero"
      errors:
        - "must report CommandError if the declared composition cannot be rendered"
    non_goals:
      - "Does not increment or compare the retry count."
      - "Does not mutate graph or planner session state."
    visibility: internal
    emits: [RetryCountInitialized, CommandError]
    category: word
    parameters: {type: object, properties: {}, additionalProperties: false}
    output:
      description: "Initial retry count addressable through the retry_count label."
      schema:
        type: object
        properties:
          output: {type: string}
        required: [output]
    side_effects:
      - kind: none
        description: "Produces command output without mutating domain state."
    reversibility: {classification: reversible, undo: noop}
    undo: {strategy: noop, description: "The retry count lives only in command history."}
    errors:
      - signal: CommandError
        condition: "the declared retry-count composition cannot be rendered"
        message_shape: "reset_retry_count: <error>"
        state_after_failure: "no retry-count entry is published"
    relationships:
      before: [extract_task, mark_nodes_planning]
      after: [reset_history, invoke_executor, increment_retry]
    config:
      signal: RetryCountInitialized
      inputs: {}
      template: '{"output":"0"}'

  - name: reset_failure_context
    type: builtin
    init: compose
    description: "Seed empty retry context for a newly extracted planner task."
    visibility: internal
    emits: [FailureContextInitialized, CommandError]
    category: word
    parameters: {type: object, properties: {}, additionalProperties: false}
    output: {description: "Empty failure context.", schema: {type: object}}
    side_effects: [{kind: none, description: "Publishes command-state output only."}]
    reversibility: {classification: reversible, undo: noop}
    undo: {strategy: noop, description: "History truncation removes the label."}
    problem: "Initial prompt construction needs the same stable failure-context selector as retries."
    goals: ["Publish one empty failure_context label per extracted task."]
    requirements: {input: ["No input required."], output: ["FailureContextInitialized wraps an empty output."], errors: ["Rendering failures emit CommandError."]}
    non_goals: ["Does not capture validator failures or format prompts."]
    errors: [{signal: CommandError, condition: "Composition cannot render.", state_after_failure: "No domain state changes."}]
    relationships: {before: [extract_task], after: [project_planner_context]}
    config:
      signal: FailureContextInitialized
      inputs: {}
      template: '{"output":""}'

  - name: compose_planner_prompt
    type: builtin
    init: compose
    description: "Render the planner user prompt from labelled structured context."
    visibility: internal
    emits: [PromptReady, CommandError]
    category: word
    parameters: {type: object, properties: {}, additionalProperties: false}
    output: {description: "Profile-owned planner user prompt.", schema: {type: string}}
    side_effects: [{kind: none, description: "Renders text without domain mutation."}]
    reversibility: {classification: reversible, undo: noop}
    undo: {strategy: noop, description: "Prompt rendering changes no domain state."}
    problem: "Planner sections and output instructions belong to the profile rather than embedded Go templates."
    goals: ["Render initial and retry prompts from the same declared template.", "Include the newest labelled validation failure."]
    requirements: {input: ["Planner context and failure context labels must resolve."], output: ["PromptReady carries the full user prompt."], errors: ["Missing selectors emit CommandError."]}
    non_goals: ["Does not call the model or parse its response."]
    errors: [{signal: CommandError, condition: "A labelled context selector is missing.", state_after_failure: "No domain state changes."}]
    relationships: {before: [project_planner_context, capture_planner_failure], after: [invoke_llm]}
    config:
      signal: PromptReady
      inputs:
        task_id: $from(planner_context).task_id
        srd_id: $from(planner_context).srd_id
        problem: $from(planner_context).problem
        goals: $from(planner_context).goals
        acceptance_criteria: $from(planner_context).acceptance_criteria
        items: $from(planner_context).items
        retry_context: $from(failure_context).output
      template: |-
        # Implementation Planning

        ## Problem Statement
        {{ problem }}

        ## Goals
        {{ goals }}

        ## Acceptance Criteria
        {{ acceptance_criteria }}

        ## Requirement Items to Implement
        Task: {{ task_id }} (from {{ srd_id }})
        {{ items }}

        ## Retry Context
        {{ retry_context }}

        ## Output Format
        Return exactly one top-level YAML mapping and no other document content.
        The mapping must contain exactly these six keys: title, summary, files, requirements, design_decisions, and acceptance_criteria.
        - title: concise task title
        - summary: one-line summary
        - files: list of {path, action (create|modify|delete), note}
        - requirements: list of {id, text}
        - design_decisions: list of {id, text}
        - acceptance_criteria: list of {id, text}
        Do not return a root sequence/list, multiple plans, a wrapper/envelope
        key, Markdown fences, prose, or any keys outside this mapping.

  - name: increment_retry
    type: exec
    binary: jq
    args: ["-c", ". + 1"]
    stdin_source: $from(retry_count).output
    stdin_max_bytes: 32
    description: "Increment the latest command-state retry count."
    problem: "A retry attempt must advance a visible count without moving policy into planner Go state."
    goals:
      - "Read the newest retry_count output and add exactly one."
      - "Republish structured output that the next loop iteration and predicate can address."
    requirements:
      input:
        - "must read a numeric string from $from(retry_count).output through bounded stdin"
      output:
        - "must emit ToolDone with the incremented count in structured output"
      errors:
        - "must emit CommandError when command-state input cannot resolve"
        - "must emit ToolFailed when jq cannot increment the supplied value"
    non_goals:
      - "Does not compare the count with a retry limit."
      - "Does not choose retry or exhaustion routing."
    visibility: internal
    emits: [ToolDone, ToolFailed, CommandError]
    category: word
    parameters: {type: object, properties: {}, additionalProperties: false}
    output:
      description: "Incremented retry count wrapped for the next loop iteration."
      mode: structured
      schema:
        type: object
        properties:
          output: {type: string}
          exit_code: {type: integer}
        required: [output, exit_code]
    side_effects:
      - kind: none
        description: "Runs a deterministic transform and changes no domain state."
    reversibility: {classification: reversible, undo: noop}
    undo: {strategy: noop, description: "Rollback removes the command-history entry."}
    errors:
      - signal: CommandError
        condition: "retry_count input is absent, malformed, empty, or exceeds the declared stdin bound"
        message_shape: "increment_retry: resolve exec input: <error>"
        state_after_failure: "no incremented retry-count entry is published"
      - signal: ToolFailed
        condition: "jq cannot parse or increment the retry count"
        message_shape: "<captured jq output>"
        state_after_failure: "no domain state is changed"
    relationships:
      before: [reset_retry_count, vet, build, test]
      after: [check_retry_limit]

  - name: check_retry_limit
    type: builtin
    init: value_predicate
    description: "Compare the visible retry count with the declared two-attempt limit."
    problem: "Retry availability must be a machine-visible comparison rather than a branch hidden inside a state-mutating tool."
    goals:
      - "Compare the newest retry count numerically with the declared limit."
      - "Emit distinct signals for retry availability and exhaustion."
    requirements:
      input:
        - "must resolve the latest retry_count output from command state"
      output:
        - "must emit RetryAvailable when the count is below two and RetriesExhausted otherwise"
      errors:
        - "must emit CommandError when the count cannot resolve or coerce to a number"
    non_goals:
      - "Does not increment retries."
      - "Does not mutate graph state or select the next machine state."
    visibility: internal
    emits: [RetryAvailable, RetriesExhausted, CommandError]
    category: word
    parameters: {type: object, properties: {}, additionalProperties: false}
    output:
      description: "Resolved retry comparison and whether the declared limit predicate held."
      schema:
        type: object
        properties:
          left: {}
          right: {}
          op: {type: string}
          operand_type: {type: string}
          held: {type: boolean}
        required: [left, right, op, operand_type, held]
    side_effects:
      - kind: none
        description: "Compares command-state values without mutation."
    reversibility: {classification: reversible, undo: noop}
    undo: {strategy: noop, description: "Comparison changes nothing."}
    errors:
      - signal: CommandError
        condition: "retry_count output cannot resolve or cannot coerce to a number"
        message_shape: "check_retry_limit: <error>"
        state_after_failure: "no comparison outcome is reported and no state is changed"
    relationships:
      before: [increment_retry]
      after: [reset_history, invoke_executor, remaining_work]
    config:
      left: $from(retry_count).output
      op: lt
      right: "2"
      operand_type: number
      satisfied: RetryAvailable
      unsatisfied: RetriesExhausted
