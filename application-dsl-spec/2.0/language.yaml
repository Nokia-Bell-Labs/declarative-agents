        check: expansion_names_fragment
        verdict: invalid

  - id: R-MODEL-004
    target: specification
    level: MUST
    statement: >-
      Every `compose` entry in a machine specification MUST carry the
      `template` keyname, the path of the machine specification it
      includes. It MAY carry `as`, a prefix for the included states; `args`,
      a mapping from the template's parameter names to values; `enter`, a
      mapping that MUST carry `from` (a state of the result) and `on` (a
      signal) and MAY carry `action` and `label`; and `exit`, a mapping from
      the template's final states to states of the result.
    acceptance:
      - assertion: fixture
        path: fixtures/specification/compose-entry/valid.yaml
        check: compose_entry_shape
        verdict: valid
      - assertion: fixture
        path: fixtures/specification/compose-entry/missing-template.yaml
        check: compose_entry_shape
        verdict: invalid
      - assertion: fixture
        path: fixtures/specification/compose-entry/enter-without-on.yaml
        check: compose_entry_shape
        verdict: invalid

  - id: R-MODEL-005
    target: processor
    level: MUST
    statement: >-
      A conforming processor MUST compose a machine as follows. For each
      `compose` entry it declares every state of the included template
      under the entry's `as` prefix; with `enter`, it adds the transition
      from `enter.from` on `enter.on` to the template's start state, and a
      host final state named by `enter.from` stops being final; it redirects
      each transition into a final state that `exit` maps to the mapped
      state; and it joins the template's signals to the host's. A
      template's parameter is bound only by the entry's `args`, a value or
      `$param` of the including template's own parameter passed through, or
      by the parameter's default; a value bound higher up the including
      chain never reaches it by name, and a parameter nothing binds leaves
      the result open, which no machine may be. The processor then validates
      the composed machine as one written by hand. It MUST reject an unknown argument, an `exit`
      or `enter.from` naming a state the result lacks, a state name two
      sources declare, and an inclusion chain deeper than four.
    acceptance:
      - assertion: pending
        note: >-
          No test in this repository anchors this statement; the engine in
          this repository implements the 1.0 language.
      - assertion: fixture
        path: fixtures/specification/compose-binding/valid.yaml
        check: compose_param_binding
        verdict: valid
      - assertion: fixture
        path: fixtures/specification/compose-binding/unbound.yaml
        check: compose_param_binding
        verdict: invalid
      - assertion: fixture
        path: fixtures/specification/compose-binding/captured.yaml
        check: compose_param_binding
        verdict: invalid
      - assertion: pending
        note: >-
          No test in this repository anchors this statement; the engine in
          this repository implements the 1.0 language.

  - id: R-MODEL-006
    target: processor
    level: MUST
    statement: >-
      A conforming processor MUST run every transition's action as one
      exchange on a channel: it sends the action's message and delivers the
      reply to the machine as a signal and a message. An action that names
      a tool implies a request-reply channel no specification declares, on
      the `function` transport for a builtin tool and the `process`
      transport for an exec tool or a child agent; an `action_channels`
      entry (R-PROF-005) moves it to another transport with no edit to the
      calling machine. On a network `request-reply` channel the action runs
      at the listener and lands on the signal the listener's reply carries,
      the listener run's outcome and the signal of its summary step;
      on a `push-pull` or `publish-subscribe` channel it answers `Sent` or
      `Dropped`; on a `survey` channel it answers `Answers` or `Deadline`;
      a transport failure lands on `CommandError`. The command timeout,
      cancellation, undo, and receipts are the same on every transport, a
      rate limit on a local entry holds each exchange until the limit
      admits it, and each exchange opens one span naming its channel and
      transport.
    acceptance:
      - assertion: pending
        note: >-
          No test in this repository anchors this statement; the engine in
          this repository implements the 1.0 language.
