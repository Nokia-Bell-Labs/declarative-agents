apiVersion: v1
kind: Namespace
metadata:
  labels: {app.kubernetes.io/name: fake-gcs, app.kubernetes.io/managed-by: kindrig}
  name: fake-gcs
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels: {app.kubernetes.io/name: fake-gcs, app.kubernetes.io/managed-by: kindrig}
  name: fake-gcs
  namespace: fake-gcs
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: fake-gcs}
  template:
    metadata:
      labels: {app.kubernetes.io/name: fake-gcs, app.kubernetes.io/managed-by: kindrig}
    spec:
      # Kubernetes injects Docker-link service variables, and this service's
      # name renders as FAKE_GCS_PORT=tcp://<ip>:4443 -- which fake-gcs-server
      # reads as its own FAKE_GCS_* configuration and refuses as a port
      # number. The container is configured by its declared args alone.
      enableServiceLinks: false
      containers:
        - name: fake-gcs
          image: KINDRIG_FAKEGCS_IMAGE
          imagePullPolicy: Never
          args:
            # Plain HTTP for the in-cluster endpoint; the objectstore words
            # read through the JSON API on the same base (storage.WithJSONReads
            # in agent-core), so no XML public-host tuning is required. The
            # public-host still names the service DNS so any self-referential
            # URL the server returns resolves in-cluster.
            - -scheme
            - http
            - -port
            - "4443"
            - -public-host
            - fake-gcs.fake-gcs.svc
            # The filesystem backend on a node hostPath that is itself a kind
            # extraMount from a stable host directory: objects survive a
            # fake-gcs pod restart and da-platform deletion/recreation, and are
            # removed only by the explicit platform:reset (srd008 R5; #2477 R3).
            - -backend
            - filesystem
            - -filesystem-root
            - /data
          ports:
            - name: http
              containerPort: 4443
          readinessProbe:
            httpGet:
              path: /storage/v1/b
              port: http
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
          volumeMounts:
            - {name: objects, mountPath: /data}
      volumes:
        # The node path is a kind extraMount from the stable host object
        # directory (platform-kind-config.yaml), so retained objects outlive
        # the pod and the cluster (#2477 R3).
        - name: objects
          hostPath:
            path: /var/lib/da-platform-objects
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  labels: {app.kubernetes.io/name: fake-gcs, app.kubernetes.io/managed-by: kindrig}
  name: fake-gcs
  namespace: fake-gcs
spec:
  selector: {app.kubernetes.io/name: fake-gcs}
  ports:
    - name: http
      port: 4443
      targetPort: http
