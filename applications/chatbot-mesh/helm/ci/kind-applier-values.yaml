# Layers on ci/kind-values.yaml to stand the applier up on kind, for the live
# tier (mage integration:applierLive, GH-735).
#
# kind-values.yaml disables the applier: it needs the chart ConfigMap and
# the kind-loaded CLI donor (GH-2222), which only the live tier provisions. The live
# tier loads the donor and re-enables the applier here rather than editing the values
# every other cluster test depends on.
applier:
  enabled: true
  # Loaded into the kind node by the target; never pulled.
  image:
    pullPolicy: Never
  # The rig pulls the pinned donor once, retags it under this rig-local name,
  # and kind-loads it (kindrig.EnsureCLIDonorImage), because a kind-loaded image
  # does not keep its registry digest.
  cliDonor:
    image: {repository: kindrig/cli-donor, tag: "1.31.4", digest: "", pullPolicy: Never}
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {cpu: 500m, memory: 512Mi}
