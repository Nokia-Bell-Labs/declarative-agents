id: sm-multi-agent-profile-system
title: Multi-Agent Profile System
purpose: |
  Define how migrated profile families relate to each other as configured
  functional blocks. The model describes roles, boundaries, and dependency
  directions without treating profiles as Go packages.

overview: |
  Think of the profile system as a directed graph of configured behaviors.
  Work-producing agents sit beside critics and operational boundary agents,
  but their edges carry different meaning. Migration has to preserve those
  edges after the files leave agent-core; otherwise profile ownership becomes
  visible while behavior quietly changes.

  When planner delegates task execution, the edge points to executor. A
  benchmark point uses a similar edge when critic runs a subject profile.
  From the human side, bench starts critic through an operator action in the
  web UI. Boundary-oriented profiles face outward toward REST callers,
  supervisors, checkpoint stores, document corpora, and browser users.

  These links do not turn applications/catalog into a runtime implementation
  repository. They name configuration, actor contracts, and dependency
  direction. MachineSpec interpretation, tool dispatch, nested loop execution,
  and reusable runtime ports remain in agent-core.

system_boundary:
  profile_repository: applications/catalog
  runtime_repository: agent-core
  rule: |
    applications/catalog owns configured agent programs and profile-local assets.
    agent-core owns runtime execution, builtin implementations, shared runtime
    assets, and container build mechanics.

role_groups:
  - id: production_work
    profiles:
      - executor
      - planner
      - deployment-applier
    summary: |
      Production work covers task planning, coding, and deployment actuation.
      Planner decomposes requirements and invokes executor. Executor edits a
      target workspace, while applier realizes a caller-decided deployment
      change through application-owned rollout boundaries.
  - id: evaluation_work
    profiles:
      - critic
      - bench
    summary: |
      Evaluation work measures agent behavior. Bench accepts human launch
      requests, while critic expands suites and runs point pipelines.
      Configured child profile execution stays inside the critic point flow.
  - id: validation_work
    profiles:
      - specification-critic
    summary: |
      Validation work reads documentation and specification corpora through a
      deterministic tool pipeline. No model boundary participates in this role.
  - id: knowledge_work
    profiles:
      - documentation-curator
      - corpus-ingest
      - corpus-reader
    summary: |
      Knowledge work curates documentation and maintains a reusable retrieval
      corpus. Corpus profiles compute provider embeddings and sequence explicit
      Chroma boundaries; documentation-curator serves human-facing workflows.
  - id: test_infrastructure
    profiles:
      - scenario-critic
      - mock
    summary: |
      Supported test-time members compose profile-owned scenarios and replace
      external REST dependencies with deterministic fixtures.
  - id: boundary_runtime_work
    profiles:
      - rest
      - runtime-state-reader
      - collector
      - control
      - lifecycle
      - lifecycle-exit
    summary: |
      Boundary runtime work exercises REST, monitor, control, and lifecycle
      vocabulary. Each boundary appears as explicit MachineSpec steps rather
      than hidden runtime branching.

dependency_directions:
  - from: planner
    to: executor
    kind: child_profile_execution
    meaning: Planner materializes and executes tasks through the executor
      profile. Executor does not depend on planner.
    evidence: rel07.0-uc003-planner-generator-profile-boundary
  - from: critic
    to: executor
    kind: benchmark_subject_execution
    meaning: Critic point runs can invoke executor or another configured
      profile as the benchmark subject.
    evidence: rel07.0-uc002-evaluator-generator-profile-boundary
  - from: bench
    to: critic
    kind: human_launched_evaluation
    meaning: Bench serves the human UI and launches critic runs.
    evidence: rel07.0-uc004-bench-evaluator-profile-boundary
  - from: runtime-state-reader
    to: agent-core monitor store
    kind: runtime_state_read
    meaning: Runtime-state-reader exposes cached monitor state supplied by agent-core.
    evidence: rel07.0-uc005-monitor-control-profile-boundary
  - from: control
    to: lifecycle vocabulary
    kind: signal_to_lifecycle_action
    meaning: Control routes REST events to visible lifecycle words such as
      exit_agent.
    evidence: rel07.0-uc005-monitor-control-profile-boundary
  - from: documentation-curator
    to: control
    kind: embedded_control_flow
    meaning: The Knowledge Manager documentation profile launches control routes
      and waits for explicit exit events.
    evidence: rel07.0-uc001-documentation-curator-profile-ux
  - from: corpus-ingest
    to: provider embedding and Chroma
    kind: configured_corpus_write
    meaning: Corpus ingest discovers trusted files, computes provider vectors,
      and writes documents and ids through profile-owned REST operations.
    evidence: rel08.0-uc001-corpus-ingest
  - from: corpus-reader
    to: provider embedding, Chroma, and model
    kind: grounded_retrieval
    meaning: Corpus reader threads a provider vector into Chroma query and gives
      the retrieved identities and chunks to the answer model.
    evidence: rel08.0-uc002-corpus-query
  - from: scenario-critic
    to: mock, subject, and validator profiles
    kind: scenario_composition
    meaning: Scenario-critic discovers scenario data, starts deterministic mocks and
      a fresh subject, runs validators, reduces a verdict, and stops all children.
    evidence: rel11.0-uc001-scenario-critic-scenario-run
  - from: mock
    to: subject REST dependency
    kind: deterministic_test_boundary
    meaning: Mock serves scenario-owned responses and records subject requests.
    evidence: rel11.0-uc002-mock-serves-fixtures
  - from: lifecycle profiles
    to: agent-core lifecycle ports
    kind: checkpoint_operation
    meaning: Lifecycle profiles select checkpoint, rollback, suspend, and resume
      vocabulary implemented by agent-core.
  - from: rest
    to: external HTTP systems
    kind: configured_boundary
    meaning: REST profile definitions describe trusted outbound and inbound HTTP
      boundaries.
  - from: deployment-applier
    to: application-owned rollout boundaries
    kind: configured_deployment_actuation
    meaning: Applier supplies lifecycle and compensation sequencing while each
      application supplies chart, release, namespace, Deployment, endpoint, and
      authority configuration.

actor_boundaries:
  - profile: executor
    actors:
      - model
      - workspace
      - validation commands
    boundary: LLM responses choose selected tools; filesystem and validation
      commands mutate or inspect the workspace.
  - profile: deployment-applier
    actors:
      - authorized apply caller
      - application rollout boundary
      - lifecycle caller
    boundary: The catalog machine sequences request hosting, validation, apply,
      verification, and compensation. Applications retain every deployment
      coordinate, endpoint, and authorization decision.
  - profile: critic
    actors:
      - suite author
      - child agent process
      - oracle command
    boundary: Suites define points; nested point runs execute child profiles and
      collect result artifacts.
  - profile: planner
    actors:
      - requirement graph
      - model
      - issue queue
      - child executor process
    boundary: Planner turns requirements into issues and invokes executor for
      execution.
  - profile: specification-critic
    actors:
      - specification corpus
    boundary: Specification-critic reads local docs and emits validation reports.
  - profile: bench
    actors:
      - human operator
      - critic process
    boundary: Human HTTP actions launch critic runs.
  - profile: rest
    actors:
      - configured upstream HTTP service
      - inbound webhook sender
    boundary: REST definitions constrain client calls and server events.
  - profile: runtime-state-reader
    actors:
      - supervisor
      - runtime monitor store
    boundary: The infrastructure adapter lets a supervisor read cached monitor
      state and request controlled exit; it does not implement canonical Monitor.
  - profile: collector
    actors:
      - OTLP trace sources
      - spool filesystem
      - query HTTP clients
    boundary: The collector receives OTLP trace batches, spools them to NDJSON,
      and serves bounded reads through query endpoints.
  - profile: control
    actors:
      - lifecycle supervisor
    boundary: REST events become MachineSpec signals.
  - profile: lifecycle
    actors:
      - operator
      - checkpoint store
      - workspace
    boundary: Lifecycle tools read or rewrite checkpoints and route approval
      decisions.
  - profile: lifecycle-exit
    actors:
      - supervisor
    boundary: A fixed exit request becomes one control-server POST that emits ExitRequested.
  - profile: documentation-curator
    actors:
      - human browser
      - documentation corpus
      - local REST API
    boundary: Browser requests read or manage documentation through configured
      document resource and control routes.
  - profile: corpus-ingest
    actors:
      - trusted corpus
      - embedding provider
      - Chroma
    boundary: The profile lists trusted paths before model selection, computes
      embeddings at the provider, and writes identified documents to Chroma.
  - profile: corpus-reader
    actors:
      - questioner
      - embedding provider
      - Chroma
      - answer model
    boundary: The profile computes a query embedding, retrieves identified
      chunks, and constrains the model answer to those chunks.
  - profile: scenario-critic
    actors:
      - scenario author
      - child subject
      - validator profiles
      - mock profiles
    boundary: Scenario data controls a fresh test topology whose terminal
      results are reduced to one verdict.
  - profile: mock
    actors:
      - subject agent under test
      - scenario fixture
    boundary: Fixture routes provide deterministic REST responses and a
      per-instance request log.

profile_asset_rules:
  - Profiles may depend on agent-core builtin declarations through documented
    core tool roots.
  - Profile-local declarations stay beside the profile that owns their behavior.
  - REST definitions stay profile-owned when they define trusted external API
    authority.
  - UI placement and human actor config stay profile-owned.
  - MachineSpec owns sequencing between tools, child profiles, REST events,
    monitor events, and lifecycle actions.

validation_views:
  - Profile validation checks profile.yaml references, machine paths, tool
    selections, declarations, and REST definitions.
  - Mounted container execution checks that /profiles paths can run selected
    profiles without bundled agent directories in the runtime image.
  - Integration tests check profile relationships such as bench to critic,
    critic to executor, planner to executor, and Knowledge Manager control
    exit.
  - Corpus conformance checks provider-vector threading, retrieved identities,
    grounded answers, and readiness failures.
  - Rig conformance checks scenario-critic-to-mock/subject/validator composition and
    deterministic verdict reduction.
  - Release 07.0 records implemented documentation-curator, bench-to-critic,
    and monitor/control relationship checks in
    test-rel07.0-profile-integrations; its critic-to-executor and
    planner-to-executor entries are retired library tracers that point to
    application-owned replacements.
  - Documentation review checks that requirements describe profiles as
    configured blocks rather than Go packages.
