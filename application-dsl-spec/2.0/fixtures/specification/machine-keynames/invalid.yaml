# Fixture for R-MACH-001: transitions is a mapping, not a sequence.
kind: machine
schema_version: 1
name: worker
initial_state: Idle
terminal_states: [Done]
states:
  - {name: Idle, meaning: Waiting for work.}
  - {name: Done, meaning: Work finished., run_status: succeeded}
signals:
  - {name: Seed, trigger: A caller hands work over.}
transitions:
  Idle: {signal: Seed, next: Done}
