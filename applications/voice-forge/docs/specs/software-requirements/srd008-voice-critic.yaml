        - {from: parsing_validation_report, on: CriticValidationReportInvalid/CommandError/BudgetExhausted, to: composing_failed_response, action: compose_failed_response, label: critic_response}
        - {from: checking_evaluation, on: CriticEvaluationRejected/CommandError/BudgetExhausted, to: composing_failed_response, action: compose_failed_response, label: critic_response}
        - {from: checking_consent, on: CommandError/BudgetExhausted, to: composing_failed_response, action: compose_failed_response, label: critic_response}
        - {from: checking_verdict_pass, on: CommandError/BudgetExhausted, to: composing_failed_response, action: compose_failed_response, label: critic_response}
        - {from: checking_verdict_warn, on: CommandError/BudgetExhausted, to: composing_failed_response, action: compose_failed_response, label: critic_response}
      observation_to_explicit_unavailable:
