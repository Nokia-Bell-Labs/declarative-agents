# Overrides a name no import brought in.
kind: tool-declaration
schema_version: 1
unit: closure-override-unimported
tools:
  - name: pass_through
    type: builtin
    override: true
    init: normalize_vector
    category: word
    visibility: internal
    description: Nothing to override.
    config: {path: vector, signal: Passed}
    signature:
      input: builtin.Message<$T>
      emits:
        - {signal: Passed, message: builtin.Message<$T>}
        - {signal: CommandError, message: builtin.Message<builtin.Text>}
