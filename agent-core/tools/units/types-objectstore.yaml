# Request shapes the objectstore words expose to a model (srd059 R1.1).
unit: builtin-types-objectstore
types:
- name: ReadRequest
  description: The object key read publishes the content of.
  schema:
    type: object
    properties:
      key:
        type: string
        description: Object key within the configured bucket.
    required:
    - key
- name: WriteRequest
  description: The object key and full content write replaces it with.
  schema:
    type: object
    properties:
      key:
        type: string
        description: Object key within the configured bucket.
      content:
        type: string
        description: Full object content to write.
    required:
    - key
    - content
- name: ListRequest
  description: The prefix list enumerates keys under.
  schema:
    type: object
    properties:
      prefix:
        type: string
        description: Key prefix to list; empty lists the whole bucket.
- name: DeletePrefixOutcome
  description: Bounded destructive result and external audit identity for one declaration-authorized prefix.
  schema:
    type: object
    properties:
      status: {type: string, enum: [purged, partial, refused]}
      application: {type: string}
      bucket_url: {type: string}
      prefix: {type: string}
      matched: {type: integer}
      deleted: {type: integer}
      remaining: {type: integer}
      keys_sha256: {type: string}
      at: {type: string}
    required: [status, application, bucket_url, prefix, matched, deleted, remaining, keys_sha256, at]
