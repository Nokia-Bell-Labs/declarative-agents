id: srd047-dolt-boundary-word
title: Configured Dolt Boundary Words

problem: |
  Declarative agents need versioned relational storage for domain data without
  receiving authority to invent SQL, database names, or connection targets.
  The existing DoltCheckpoint adapter is a lifecycle backend with a fixed
  runtime-state schema. It is not a general vocabulary word and must not become
  one.

  We need a general-purpose Dolt boundary family that follows the configured
  REST tool safety model. Trusted ToolDef configuration owns the connection,
  database, statements, parameter schemas, schema provisioning, and commit
  messages. A caller selects no transport authority and supplies only declared
  parameter values. Separate provision, query, and write words keep database
  lifecycle, reads, and commit-producing mutations explicit in MachineSpec.

goals:
  - G1: Define general-purpose Dolt provision, query, and write boundary words.
  - G2: Keep connection, database, SQL statements, schemas, and commit messages under trusted configuration.
  - G3: Let callers fill typed declared parameters without supplying SQL or connection authority.
  - G4: Provision a database and schema idempotently from a declared word.
  - G5: Commit every successful write exactly once with a configured message template and return structured results.
  - G6: Keep domain-word databases separate from the Dolt checkpoint backend and prove behavior against a real Dolt server.

requirements:
  R1:
    title: Word family and ownership
    items:
      - R1.1: Agent Core SHALL implement the family under internal/tools/dolt and SHALL register it through the standard catalog and registry path.
      - R1.2: Shared declarations SHALL live under tools/builtin/dolt and SHALL expose distinct dolt_provision, dolt_query, and dolt_write init entries.
      - R1.3: Each configured ToolDef SHALL bind exactly one provision, query, or write operation; MachineSpec SHALL own sequencing among operations.
      - R1.4: Every entry SHALL be a boundary word with typed input and output, emitted signals, database side effects, reversibility, undo or compensation, errors, and relationships.
      - R1.5: The family SHALL be general-purpose and SHALL NOT name or encode any task, blackboard, application, or other consumer domain.

  R2:
    title: Trusted configuration and parameter authority
    items:
      - R2.1: Trusted ToolDef configuration SHALL own a connection reference, literal database name, operation id, operation kind, SQL statement or schema statement list, parameter schema, result limits, timeout, and applicable commit-message template.
      - R2.2: Connection credentials SHALL resolve from a named trusted runtime reference that cmd/agent supplies through FactoryDeps from --dolt-connection NAME=DSN. Process environment is not a resolution channel. Callers and model output SHALL NOT supply or override DSNs, hosts, ports, users, passwords, TLS policy, database names, SQL text, schema text, operation kinds, or commit templates.
      - R2.3: Runtime input SHALL contain only params whose keys and scalar or structured types are declared by the operation's parameter schema; unknown, missing, or invalid params SHALL fail before database execution.
      - R2.4: SQL SHALL use driver parameter binding for caller values. Runtime SHALL NOT construct SQL by concatenating, formatting, or template-evaluating caller strings.
      - R2.5: A runtime input containing statement, sql, query, dsn, connection, database, schema, commit_message, or another authority field SHALL be refused as schema-invalid rather than ignored.
      - R2.6: Startup validation SHALL reject empty statements, unknown config fields, undeclared placeholders, unused required parameters, multi-statement query or write entries, and operation-kind mismatches.

  R3:
    title: Database provisioning
    items:
      - R3.1: dolt_provision SHALL connect to the configured Dolt server without accepting a caller-selected database and SHALL create the configured database when it does not exist.
      - R3.2: dolt_provision SHALL apply only the ordered DDL statements listed in trusted schema configuration and SHALL accept no runtime params.
      - "R3.3": "Provisioning SHALL be idempotent: a second invocation against the same compatible database and schema SHALL succeed without destructive recreation or an empty duplicate commit."
      - R3.4: After creating or changing schema, dolt_provision SHALL stage the database changes and create exactly one Dolt commit using its configured schema commit-message template.
      - R3.5: A schema conflict, incompatible existing object, permission failure, or failed statement SHALL roll back the current SQL transaction when supported, create no Dolt commit, and return a structured DoltCommandError.
      - R3.6: Provision output SHALL include operation, database, created, schema_changed, commit_hash when changed, and bounded diagnostics without connection or credential material.

  R4:
    title: Read-only query word
    items:
      - R4.1: dolt_query SHALL accept only a single configured read statement whose validated statement kind is SELECT, SHOW, DESCRIBE, EXPLAIN, or a read-only common-table expression.
      - R4.2: dolt_query SHALL execute with bound declared params and SHALL never stage changes or call DOLT_COMMIT.
      - R4.3: Query output SHALL include operation, database, ordered column metadata, rows as structured values, row_count, truncated, and elapsed duration.
      - R4.4: Configuration SHALL set maximum rows and maximum encoded bytes; reaching either limit SHALL return a deterministic bounded result with truncated true.
      - R4.5: A statement that mutates data, schema, branches, commits, or server configuration SHALL fail startup validation for dolt_query.

  R5:
    title: Write and commit word
    items:
      - R5.1: dolt_write SHALL accept one configured INSERT, UPDATE, DELETE, or other explicitly allowed data-mutation statement and execute it with bound declared params inside one SQL transaction.
      - R5.2: On a successful mutation, dolt_write SHALL stage the resulting Dolt changes and call DOLT_COMMIT exactly once before reporting success.
      - R5.3: The commit message SHALL be rendered from a trusted template using only configured literal text and declared, schema-valid parameter values. Unknown placeholders or caller-supplied message text SHALL be rejected.
      - R5.4: Write output SHALL include operation, database, rows_affected, commit_hash, committed true, and elapsed duration; it SHALL NOT expose the DSN, credentials, raw statement, or secret params.
      - R5.5: A zero-row successful write SHALL follow explicit trusted config, commit_on_no_change. The default SHALL be false and SHALL return committed false with no empty commit.
      - R5.6: A statement failure, staging failure, commit failure, timeout, or cancellation SHALL return DoltCommandError, report its stage, and SHALL NOT report committed true. SQL failure before DOLT_COMMIT SHALL roll back and create no commit.

  R6:
    title: Signals, lifecycle, and observability
    items:
      - R6.1: Successful provision, query, and write words SHALL emit DoltProvisioned, DoltRowsRead, and DoltCommitted respectively; expected configured no-change writes MAY emit DoltNoChange; all infrastructure and validation failures SHALL emit CommandError.
      - R6.2: dolt_query SHALL declare no side effects and use noop Undo. dolt_provision and dolt_write SHALL declare external database mutation and classify it as compensatable or irreversible according to configured compensation policy.
      - R6.3: A mutating word marked compensatable SHALL encode an opaque receipt with operation identity, database identity, and commit hash for a separately declared compensation action. The checkpoint adapter and engine SHALL not parse it.
      - R6.4: Dispatch traces SHALL record operation id, word kind, configured server identity, database, rows read or affected, commit presence and hash, elapsed time, and resulting signal; they SHALL redact credentials, SQL text, commit-message values marked sensitive, and secret params.
      - R6.5: Errors SHALL distinguish config_validation, connection_resolution, database_create, schema_apply, parameter_validation, statement_execute, result_scan, stage, commit, timeout, cancellation, and compensation stages.

  R7:
    title: Checkpoint separation and real integration proof
    items:
      - R7.1: The Dolt word connection and database SHALL be configured independently from --dolt-dsn and the srd036 DoltCheckpoint backend.
      - R7.2: When both are enabled, startup validation SHALL reject an exact normalized server-and-database identity shared by a Dolt word and DoltCheckpoint. Separate databases on the same configured server MAY be used.
      - R7.3: Dolt words SHALL NOT read or write the checkpoint tables, branches, run commits, Position, Execution, tool_outputs, or receipts owned by srd036.
      - R7.4: GH-1732 SHALL add mage integration:doltWord, or an equivalently named standard integration target, that launches or connects to a real Dolt instance rather than a mock SQL driver.
      - R7.5: The real-Dolt gate SHALL prove configured database creation, ordered schema application, idempotent reprovisioning, bound parameter query and write, one visible declared-message commit per successful write, structured results, and separate checkpoint and word databases.
      - R7.6: The real-Dolt gate SHALL prove that caller-supplied SQL, connection, database, and commit-message fields are refused before execution and that a failed write creates no commit.

non_goals:
  - Replacing or extending DoltCheckpoint, its five-table schema, branch-per-run history, or Revert behavior.
  - Letting a model or runtime caller submit arbitrary SQL, connection targets, database names, schema, or commit messages.
  - Providing a general migration engine, ORM, query builder, branch manager, or Dolt administration shell.
  - Encoding a particular downstream consumer's schema or lifecycle.
  - Hiding provision, query, write, or compensation order inside one sentence-shaped tool.

acceptance_criteria:
  - id: AC1
    criterion: The general-purpose internal/tools/dolt family exposes separate provision, query, and write boundary entries through normal declarations and registration, with MachineSpec owning composition.
    traces: [R1.1, R1.2, R1.3, R1.4, R1.5]
  - id: AC2
    criterion: Trusted config owns every connection and SQL authority field, callers provide only schema-valid bound params, authority-shaped runtime fields are refused, and startup rejects unsafe statement definitions.
    traces: [R2.1, R2.2, R2.3, R2.4, R2.5, R2.6]
  - id: AC3
    criterion: Provisioning creates the configured database, applies ordered schema idempotently, commits changed schema once, creates no empty duplicate commit, and returns structured redacted output or a staged error.
    traces: [R3.1, R3.2, R3.3, R3.4, R3.5, R3.6]
  - id: AC4
    criterion: Query accepts only validated read statements, binds params, returns bounded ordered structured rows, and never stages or commits.
    traces: [R4.1, R4.2, R4.3, R4.4, R4.5]
  - id: AC5
    criterion: Write executes one configured mutation transaction, creates exactly one declared-template Dolt commit on change, handles configured no-change behavior, returns structured commit data, and reports failures without false commit success.
    traces: [R5.1, R5.2, R5.3, R5.4, R5.5, R5.6]
  - id: AC6
    criterion: Signals, side effects, receipts, compensation, traces, redaction, and staged error taxonomy follow the boundary-word and lifecycle contracts.
    traces: [R6.1, R6.2, R6.3, R6.4, R6.5]
  - id: AC7
    criterion: Word and checkpoint databases are independently configured and cannot share one normalized database, and a real-Dolt integration gate proves provisioning, schema, parameterized reads and writes, commit history, isolation, refusal of caller authority, and no commit after failure.
    traces: [R7.1, R7.2, R7.3, R7.4, R7.5, R7.6]

test_trace_plan:
  - test_suite: test-rel14.0-agent-input-and-dolt
    covers: [AC1, AC2, AC3, AC4, AC5, AC6, AC7]

