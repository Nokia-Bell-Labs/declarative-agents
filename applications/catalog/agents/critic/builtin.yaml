unit: catalog-critic-builtin
tools:
- name: parse_suite_config
  type: builtin
  init: parse_suite_config
  visibility: internal
  signature:
    emits:
    - SuiteConfigParsed
    - CommandError
  description: Read and validate critic suite YAML metadata without discovering samples or creating session artifacts.
  config:
    input: $request.suite
    output_dir: eval-results
    reps: 1
  category: stateful_internal
  output:
    description: Parsed critic suite metadata summary.
    schema:
      type: object
      properties:
        suite:
          type: string
        profiles:
          type: integer
        samples_dir:
          type: string
        repetitions:
          type: integer
        output_dir:
          type: string
      required:
      - suite
  side_effects:
  - kind: state_mutation
    target: critic_session
    state: suite_config_parsed
    description: Stores parsed suite config and defaults in critic session state.
  errors:
  - signal: CommandError
    condition: suite file is missing, invalid, or mixes incompatible suite formats
    message_shape: 'parse_suite_config: <error>'
    state_after_failure: previous critic session state is preserved
  undo:
    strategy: evaluator_session_restore
    description: Restore the critic session from the persisted pre-command receipt.
    payload: evaluator_session_snapshot
    captures: [suite, session_dir, result, point_context, iterator_state]
- name: run_point
  type: builtin
  init: run_point
  visibility: internal
  signature:
    emits:
    - PointDone
    - CommandError
  description: Run the per-point evaluation pipeline via a nested core.Loop with the point machine.
  category: boundary
  output:
    description: Nested point-machine execution result.
    schema:
      type: object
      properties:
        point_id:
          type: string
        machine:
          type: string
        status:
          type: string
        terminal_state:
          type: string
        elapsed_ms:
          type: integer
        artifact_dir:
          type: string
      required:
      - status
      - terminal_state
  side_effects:
  - kind: state_mutation
    target: critic_session
    state: point_result_recorded
    description: Records the nested point outcome in session state.
  - kind: filesystem_write
    target: point_artifacts
    description: Nested point tools may create workspaces and write evaluation artifacts.
  - kind: nested_machine_execution
    target: core.Loop
    description: Runs the configured point machine with its selected tools.
  - kind: stderr_write
    target: critic_progress
    description: Reports point start, failure, and terminal progress.
  reversibility:
    classification: compensatable
    requires_confirmation: false
  undo:
    strategy: compensating_action
    description: Restore critic session state and surface required nested-machine and workspace compensation.
    payload: boundary_compensation
    captures: [evaluator_session_snapshot, nested_machine_history, point_workspace]
  errors:
  - signal: CommandError
    condition: required config is missing, iterator point binding fails, or nested machine construction fails
    message_shape: 'run_point: <error>'
    state_after_failure: session state unchanged unless nested execution already recorded a result
  config:
    point_machine: agents/critic/point.yaml
    point_tools: agents/critic/tools-point.yaml
    point_tool_declarations:
    - /opt/agent-core/tools/builtin/critic-point/all.yaml
    - /opt/agent-core/tools/exec/all.yaml
    - agents/critic/point-exec.yaml
    agent_name: critic-point
    max_iterations: 20
    success_state: Done
