{{- if .Values.applier.enabled }}
{{- include "coding-agent.validateValues" . -}}
{{- $fullname := include "coding-agent.fullname" . -}}
{{/*
The applier (srd006): the coding application's deployment-plane actuation agent.
It runs the runtime with a mounted profile whose request machines bind the helm and
kubectl CLIs its image carries as exec words. It edits deployment values and triggers
rollouts only; it submits no endpoint or credential to a running agent.

Sanctioned image divergence (srd003 R1.2, srd006 R5.3): the shared applier image
carries helm and kubectl alongside the agent-core runtime binary. Recorded here so
the declarative-decomposition audit does not re-flag it. The chart is not baked
into the image (GH-1368): it is delivered to the applier pod at /chart as a
mounted volume (the packaged chart, unpacked by the stage-chart init container),
so the bytes travel with the Helm release and one shared image serves every app.

The applier profile is mounted from its manifest-derived deployment shard. It
keeps a dedicated ConfigMap because its privileged workload has a different
template and image from the three serving roles.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fullname }}-applier-profiles
  labels:
    {{- include "coding-agent.labels" . | nindent 4 }}
    app.kubernetes.io/component: applier
data:
  {{- range $path, $_ := .Files.Glob "profiles/applier/**" }}
  {{- $key := $path | trimPrefix "profiles/applier/" | replace "/" "__" }}
  {{ $key }}: |-
  {{- if eq $key "applications__coding-agent__applier__exec-declarations.yaml" }}
    {{- /* Rewrite the applier exec args' placeholder coordinates to the installed
          release so an applier installed under any release name targets its own
          release, namespace, and role Deployments rather than a baked
          coding-agent/default. The deployment tokens are replaced before the bare
          release tokens because they contain the release-chart name. */}}
    {{- $exec := $.Files.Get $path }}
    {{- $exec = $exec | replace "deployment/coding-agent-planner" (printf "deployment/%s-planner" $fullname) }}
    {{- $exec = $exec | replace "deployment/coding-agent-executor" (printf "deployment/%s-executor" $fullname) }}
    {{- $exec = $exec | replace "deployment/coding-agent-critic" (printf "deployment/%s-critic" $fullname) }}
    {{- $exec = $exec | replace "upgrade, coding-agent," (printf "upgrade, %s," $.Release.Name) }}
    {{- $exec = $exec | replace "rollback, coding-agent]" (printf "rollback, %s]" $.Release.Name) }}
    {{- $exec = $exec | replace "--namespace, default," (printf "--namespace, %s," $.Release.Namespace) }}
    {{- $exec | nindent 4 }}
  {{- else }}
    {{- $.Files.Get $path | nindent 4 }}
  {{- end }}
  {{- end }}
---
{{/*
The applier's ServiceAccount, Role, RoleBinding, Deployment, Service, and
NetworkPolicy come from the shared agent-services library (GH-2045). This chart
supplies the staged profile closure above and the profile path the runtime reads.

The chart the applier upgrades arrives as a ConfigMap provisioned outside the
release (applier.chartArchiveConfigMap), as the other applications already
delivered it: the packaged archive carried inside the release Secret overflowed
the API server's object limit (GH-1407).
*/}}
{{- $items := list -}}
{{- range $path, $_ := .Files.Glob "profiles/applier/**" }}
{{- $items = append $items (dict "key" ($path | trimPrefix "profiles/applier/" | replace "/" "__") "path" ($path | trimPrefix "profiles/applier/")) -}}
{{- end }}
{{- $profilesVolume := list (dict "name" "profiles" "projected" (dict "defaultMode" 0444 "sources" (list (dict "configMap" (dict "name" (printf "%s-applier-profiles" $fullname) "items" $items))))) -}}
{{- include "agent-services.applier" (dict
      "root" .
      "profilePath" "/profiles/applications/coding-agent/applier/profile.yaml"
      "profilesVolume" $profilesVolume
      "workDir" .Values.workspace.mountPath
      "serviceName" "coding-applier"
      "otlpEndpoint" (include "coding-agent.otlpEndpoint" .)
      "chartCoreResources" (list "configmaps" "secrets" "services" "serviceaccounts" "persistentvolumeclaims")
      "podAnnotations" (dict "checksum/profiles" (.Files.Glob "profiles/applier/**" | toString | sha256sum))) }}
{{- end }}
