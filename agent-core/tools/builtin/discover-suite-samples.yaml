unit: builtin-discover-suite-samples
imports:
- ../units/types-core.yaml
tools:
- name: discover_suite_samples
  type: builtin
  init: discover_suite_samples
  visibility: internal
  description: Discover evaluator samples from the parsed suite samples directory.
  signature:
    output: builtin-types-core.CommandSummary
    emits: [SuiteSamplesDiscovered, CommandError]
  category: word
  side_effects:
  - kind: state_mutation
    target: eval_session_state
    state: suite_samples_discovered
    description: Sets EvalSessionState.Suite.Samples from the resolved samples directory.
  undo:
    strategy: evaluator_session_restore
    description: Restore evaluator session state from the persisted pre-command receipt.
    payload: evaluator_session_snapshot
    captures: [suite, session_dir, result, point_context, iterator_state]
  errors:
  - signal: CommandError
    condition: required input, configuration, or runtime state is invalid
    message_shape: 'discover_suite_samples: <error>'
    state_after_failure: no additional workflow step is executed by this tool
  output:
    description: discover_suite_samples command result summary.
  config:
    workspace_dir: workspace
    doc_dir: doc
    prompt_file: prompt.yaml
    allow_shared_prompt: true
    require_samples: true
