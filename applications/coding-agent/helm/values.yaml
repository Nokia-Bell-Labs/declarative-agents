# Every coding agent role runs one profile-free image, the composition model's
# one-image invariant (srd005 R9, GH-2494): planner, executor, critic,
# collector, and applier all resolve to this reference. Profiles are generated
# by `mage helmPrepare` and mounted read-only at /profiles.
image:
  repository: ghcr.io/nokia-bell-labs/declarative-agents/agent-core
  tag: "0.1.0"
  pullPolicy: IfNotPresent

profiles:
  mountPath: /profiles

# The canonical executor declares Go and golangci-lint exec words. They arrive
# on the executor alone from this digest-pinned, read-only tool donor, an init
# container that copies the Go SDK and linter into a shared volume (GH-2494,
# following the applier CLI-donor pattern). The donor is a repository-built
# image, so R2.2 exempts it from the third-party digest rule; no other role
# mounts it, and the executor main container still runs the one agent image.
executorTools:
  mountPath: /opt/go-tools
  image:
    repository: ghcr.io/nokia-bell-labs/declarative-agents/agent-core-toolchain
    tag: "0.1.0"
    pullPolicy: IfNotPresent

workspace:
  mountPath: /work
  existingClaim: ""
  storageClass: ""
  accessModes: [ReadWriteMany]
  size: 5Gi

roles:
  planner:
    replicas: 1
    requestPort: 18200
    controlPort: 18201
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {cpu: "2", memory: 2Gi}
  executor:
    replicas: 1
    requestPort: 18210
    controlPort: 18211
    resources:
      requests: {cpu: 250m, memory: 512Mi}
      limits: {cpu: "4", memory: 4Gi}
  critic:
    replicas: 1
    requestPort: 18220
    controlPort: 18221
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {cpu: "2", memory: 2Gi}

# Planner and executor canonical declarations read OLLAMA_URL. The chart-owned
# tier is optional; disabling it uses the fixed external endpoint below.
llm:
  externalURL: http://ollama.default.svc.cluster.local:11434
  port: 11434

ollama:
  enabled: false
  image: {repository: ollama/ollama, tag: "0.34.2", digest: "sha256:da6e0dc5651df159e45686fd663c4dbe1624a52c44d7280eeac1551d8f865532", pullPolicy: IfNotPresent}
  utilityImage: busybox:1.36@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
  models: ["qwen3.6:35b-mlx"]
  persistence:
    storageClass: ""
    size: 25Gi
  resources:
    requests: {cpu: "1", memory: 4Gi}
    limits: {cpu: "8", memory: 32Gi}
  gpu:
    count: 0
  nodeSelector: {}
  tolerations: []
  # The preload Job's controls. An integration run points
  # integrationCacheHostPath at a warmed model cache on the host; empty keeps the
  # tier self-contained (GH-2045 aligns the key with the mesh).
  preload:
    suspend: false
    integrationCacheHostPath: ""
collector:
  enabled: true
  # The collector is an agent workload; it inherits the one application image
  # (srd005 R9). No collector.image here.
  otlpGRPCPort: 4317
  # The control, monitor, and query surfaces the collector serves. They were
  # hardcoded in the template until the shared agent-services library took the
  # workload over (GH-2045).
  controlPort: 18191
  monitorPort: 18192
  queryPort: 18193
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {cpu: 500m, memory: 512Mi}

# The applier (srd006): the deployment-plane actuator that realizes a decided
# values change against this chart on Kubernetes. Disabled by default -- it needs
# the chart archive and the kind-loaded CLI donor (GH-2222), which only the live
# tier provisions, so the live tier enables it explicitly (ci/kind-applier-values.yaml) and supplies the chart it
# mounts at /chart via applier.chartArchiveConfigMap.
applier:
  enabled: false
  # The applier is an agent workload; it inherits the one application image
  # (srd005 R9). helm and kubectl come from cliDonor below (GH-2222), and the
  # chart from chartArchiveConfigMap (GH-1368). No applier.image here.
  # CLI donor (GH-2222): a cli-donor init container copies this image's helm and
  # kubectl into a tools volume mounted read-only at /opt/tools and first on PATH,
  # so the applier runs the plain agent-core image. The pin is the CLI version
  # contract: helm 3.16.3 (the exec words use helm 3 flag spellings) and kubectl
  # 1.31. Mirror the image into the cluster's registry where Docker Hub is
  # unreachable; an empty repository means applier.image carries the CLIs.
  cliDonor:
    image:
      repository: docker.io/alpine/k8s
      tag: "1.31.4"
      digest: sha256:9c4976d47656d78cf53a92b0203fc54ac45eae18a2b45001ac221c27da4c8036
      pullPolicy: IfNotPresent
  # The ConfigMap carrying the packaged chart the applier's
  # `helm upgrade coding-agent /chart` word installs, delivered to the pod at
  # /chart as a mounted volume rather than baked into the image (GH-1368).
  # Provisioned outside the Helm release: an archive carried inside the release
  # Secret overflows the API server's object limit (GH-1407, and GH-2045 aligned
  # this application with the other two). Empty by default; whoever enables the
  # applier provisions the ConfigMap and names it here. With it empty the applier
  # renders without the chart mount (fine for render-only checks; a live applier
  # needs the chart).
  chartArchiveConfigMap: ""
  # apply/request server, control server, monitor server. Chosen apart from the
  # role ports (18200-18221) and the collector ports so no listener collides.
  ports: {apply: 18230, control: 18231, monitor: 18232}
  # allowApply grants the apply-path RBAC (helm upgrade manages the chart objects).
  allowApply: true
  # Gate the apply surface off the serving and collector pods at the network layer:
  # the declarative REST servers carry no inbound auth, so only an authorized
  # operator or CI caller reaches the apply port (srd006 R4.3).
  networkPolicy:
    enabled: true
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 500m, memory: 256Mi}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile: {type: RuntimeDefault}

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
