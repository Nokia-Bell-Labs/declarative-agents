schema_version: 1
application: coding-agent
agent_profiles:
  compatible_release: agent-profiles/v0.20260724.0
  references:
    - role: planner
      source: agents/planner/profile.yaml
      runtime_path: agents/planner/profile.yaml
    - role: executor
      source: agents/executor/profile.yaml
      runtime_path: agents/executor/profile.yaml
    - role: critic
      source: agents/critic/profile.yaml
      runtime_path: agents/critic/profile.yaml
    - role: critic-workspace
      source: agents/critic/profile-workspace.yaml
      runtime_path: agents/critic/profile-workspace.yaml
runtime:
  mount_path: /profiles
  image_contains_profiles: false
deployment:
  serving_profiles:
    - role: planner
      source: agents/serving/planner/profile.yaml
      runtime_path: applications/coding-agent/planner/profile.yaml
    - role: executor
      source: agents/serving/executor/profile.yaml
      runtime_path: applications/coding-agent/executor/profile.yaml
    - role: critic
      source: agents/serving/critic/profile.yaml
      runtime_path: applications/coding-agent/critic/profile.yaml
configuration:
  planner:
    llm: agents/planner/llm/default.yaml
    child_profile: agents/executor/profile.yaml
    budget: agents/planner/machine.yaml
  executor:
    llm: agents/executor/llm/default.yaml
    budget: agents/executor/machine.yaml
  critic:
    rest_targets: none
    model: none
    child_profile: none
    budget: agents/critic/machine.yaml
  critic-workspace:
    rest_targets: none
    model: none
    child_profile: none
    budget: agents/critic/machine-workspace.yaml
