unit: builtin-materialize-eval-points
imports:
- ../units/types-eval.yaml
tools:
- name: materialize_eval_points
  type: builtin
  init: materialize_eval_points
  visibility: internal
  description: Materialize deterministic profile, grid, sample, and repetition combinations for declared iteration.
  signature:
    output: builtin-types-eval.EvalPoints
    emits: [EvalPointsMaterialized, CommandError]
  category: word
  side_effects:
  - kind: state_read
    target: eval_session_state
    description: Reads resolved suite dimensions without mutating them.
  output:
    description: Ordered evaluation point inputs.
  errors:
  - signal: CommandError
    condition: evaluation session state is unavailable or the points result cannot be encoded
    message_shape: 'materialize_eval_points: <error>'
    state_after_failure: evaluation session state remains unchanged and no points result is published
  relationships:
    before: [report_suite_summary, init_eval_session]
    after: [run_point]
