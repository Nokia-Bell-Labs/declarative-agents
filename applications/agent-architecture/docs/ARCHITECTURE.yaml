id: architecture-agent-architecture
title: Agent Architecture Application Architecture

overview:
  summary: |
    The Agent Architecture is a composition around catalog-owned
    documentation-curator, collector, and lifecycle-exit roots plus one local
    deployment applier. The application serves a slide deck, starts the curator
    and collector through agent-core, directs the operator to their
    catalog-owned browser interfaces, and uses the lifecycle-exit contract for
    shutdown compatibility evidence. The current Mage run and kind paths send
    the bounded lifecycle HTTP request directly; they do not execute or copy the
    catalog lifecycle-exit profile.

    The dependency direction is applications/agent-architecture ->
    applications/catalog -> agent-core. The demo.yaml catalog_root locates the
    canonical profile and its user interface. The demo.yaml core_root locates the
    development runtime checkout. An installed agent runtime does not require
    --core-root. Neither the catalog nor agent-core imports this application.
    This module extends applications/docs srd001 and the applicable managed
    service groups in srd002 by reference.

    The implemented Kubernetes deployment runs the same composition on a cluster: a
    chart runs the documentation-curator and the collector as workloads from
    mounted catalog-owned closures (srd001-helm-deployment), and a standalone
    declarative applier actuates that chart for an authorized operator or CI
    caller (srd002-applier). The packaged, helm_managed, and kind_demo
    capabilities are backed by checked-in package, render, and integration
    targets. The local applier remains application-owned pending GH-1420.
  demo_flow_diagram: |
    ```mermaid
    flowchart LR
      OP[Operator] --> PRESENT[Go present slide server]
      PRESENT --> DECK[agent-architecture.slide]
      OP --> RUN[mage run]
      RUN --> CURATOR[Catalog documentation-curator]
      CURATOR --> CORE[agent-core runtime]
      OP --> BROWSER[Catalog-owned Knowledge Manager UI]
      BROWSER --> CURATOR
      OP --> EXIT[Catalog lifecycle-exit client]
      EXIT --> CONTROL[Curator control route]
      CONTROL --> DONE[Curator Done and listeners released]
    ```

capability_classification:
  ownership: composition-only
  declared:
    - capability: runnable_module
      applies: true
      shared_requirements:
        - srd001-application-module-contract R1
        - srd001-application-module-contract R2
        - srd001-application-module-contract R3
        - srd001-application-module-contract R4
        - srd001-application-module-contract R5
        - srd001-application-module-contract R6
      status: implemented
    - capability: managed_service
      applies: true
      scope:
        - canonical documentation-curator server launched by this application
        - application-owned Go present server
      shared_requirements:
        - srd002-managed-application-services R1
        - srd002-managed-application-services R2
        - srd002-managed-application-services R3
      status: partial
      live_observation_status: dependency_gated
    - capability: packaged
      applies: true
      scope:
        - deterministic archive staging the catalog-owned curator and collector profile closures
      shared_requirements:
        - srd002-managed-application-services R4
      local_requirements:
        - srd001-helm-deployment R2
      status: implemented
      realized_in: "02.0"
    - capability: helm_managed
      applies: true
      scope:
        - chart running the documentation-curator and collector as workloads from mounted closures
        - values.schema.json and template guards over the deployment values
      shared_requirements:
        - srd002-managed-application-services R5
      local_requirements:
        - srd001-helm-deployment R1
        - srd001-helm-deployment R2
      status: implemented
      realized_in: "02.0"
    - capability: kind_demo
      applies: true
      scope:
        - bounded kind install of the validated archive with curator and collector readiness, a served curator surface, and an exported trace
      shared_requirements:
        - srd002-managed-application-services R6
      local_requirements:
        - srd001-helm-deployment R3
      status: implemented
      realized_in: "03.0"
  managed_services:
    - name: documentation-curator
      ownership: applications/catalog canonical profile and lifecycle-exit client; application-owned launch composition
      shared_requirement_groups: [R1, R2, R3]
      planned_local_evidence:
        - go test ./magefiles -run '^Test(Run|ResolveRoots)' proves command construction and root resolution
        - go test ./magefiles -run '^TestLifecycleExit' proves the declarative exit contract
        - dependency_gated live startup, role-readiness, shutdown, and listener-release observation
      deterministic_evidence_status: implemented
      live_observation_status: dependency_gated
      canonical_evidence:
        - srd011-knowledge-manager AC1
        - srd011-knowledge-manager AC2
        - srd011-knowledge-manager AC3
        - rel07.0-uc001-documentation-curator-profile-ux S1
        - rel07.0-uc001-documentation-curator-profile-ux S3
        - rel07.0-uc001-documentation-curator-profile-ux S4
    - name: Go present
      ownership: application-managed development tool process
      shared_requirement_groups: [R1, R2, R3]
      planned_local_evidence:
        - go test ./magefiles -run '^TestPresentation' proves the pinned exact command and working directory
        - dependency_gated bounded HTTP role-readiness observation
        - dependency_gated interrupt-driven process and listener-release observation
      deterministic_evidence_status: implemented
      live_observation_status: dependency_gated
      limitation: |
        Release 00.0 specifies no dedicated present health or telemetry API.
        Tests must use bounded process and HTTP observations and record this
        signal limitation; process existence alone is not readiness evidence.

interfaces:
  - name: shared application contract
    summary: |
      applications/docs/specs/software-requirements/srd001-application-module-contract.yaml
      governs the runnable composition. srd002-managed-application-services R1
      through R3 govern both long-running local servers. Local documents name
      application behavior and evidence without restating shared obligations.
  - name: demo.yaml
    summary: |
      Optional declarative configuration read from the application root. Every
      field is optional and defaults to the monorepo layout: catalog_root
      (../catalog) locates the canonical documentation-curator profile,
      core_root (../../agent-core) locates the development checkout, tracing
      toggles the collector, helm_dist sets the chart output directory, and
      image sets the runtime image reference. Overriding a value means editing
      this declaration; the demo reads no environment variables.
  - name: mage run
    summary: |
      Build or locate agent-core and launch the canonical documentation-curator
      with explicit --profile, --directory, and development --core-root
      arguments. The working directory is the catalog_root so the curator
      documents the catalog checkout used by the demo.
  - name: mage presentation
    summary: |
      Serve agent-architecture.slide from the application root with the
      version-pinned Go present tool recorded by this application's Go module.
  - name: lifecycle-exit client
    summary: |
      ../catalog/agents/lifecycle-exit/profile.yaml is the catalog-owned
      compatibility root for the lifecycle client contract. Its fixed REST
      declaration documents the curator control route. Current Mage integration
      code sends the equivalent bounded HTTP request directly and does not
      package or launch this finite profile.
  - name: browser endpoints
    summary: |
      The catalog profile serves its documentation interface on localhost:18081,
      lifecycle control on 127.0.0.1:18082, and monitor interface on
      localhost:18084 by default.

components:
  - name: presentation deck
    path: agent-architecture.slide
    ownership: application
    responsibility: |
      Guide presentation startup, canonical curator launch, browser access, and
      lifecycle exit. Code inclusions resolve from the application root.
  - name: lifecycle-exit client
    path: ../catalog/agents/lifecycle-exit/
    ownership: applications/catalog
    responsibility: |
      Declare the fixed control-client authority and shutdown contract. The
      application references this catalog-owned profile for compatibility and
      contract evidence, does not copy it, and currently performs the matching
      bounded HTTP request in Mage integration code.
  - name: Mage tooling
    path: magefiles/
    ownership: application
    responsibility: |
      Resolve portable roots, consume agents/application.yaml through the shared
      appmanifest closure, prepare and validate Helm role packages and
      provenance, construct run and presentation commands, audit documentation,
      and emit composition-only statistics.
  - name: documentation-curator
    path: ../catalog/agents/knowledge-manager/documentation-curator/
    ownership: applications/catalog
    responsibility: |
      Provide the only canonical Knowledge Manager profile, UI assets, UX
      configuration, request machine, REST definitions, and profile-local
      resources. The application references this path and does not copy it.
  - name: agent runtime
    path: ../../agent-core
    ownership: agent-core
    responsibility: |
      Provide cmd/agent, the state-machine interpreter, documentation host,
      REST runtime, builtin tools, and shared declarations.
  - name: application documentation
    path: docs/
    ownership: application
    responsibility: |
      Define the presentation composition, Release 00.0 use case, executable
      evidence contract, dependencies, and known coverage gaps.

design_decisions:
  - id: 1
    title: Reference one canonical curator
    decision: |
      The application resolves
      agents/knowledge-manager/documentation-curator/profile.yaml beneath the
      catalog_root declared in demo.yaml. It does not copy or modify the profile
      or UI.
    benefits:
      - Catalog fixes have one canonical home.
      - Application changes remain presentation and composition changes.
      - Repository statistics count the curator once.
  - id: 2
    title: Preserve canonical lifecycle-exit ownership
    decision: |
      The application preserves the catalog-owned lifecycle-exit profile as a
      direct compatibility root and ownership authority. The current local and
      kind orchestration sends the equivalent fixed, bounded HTTP request in Go;
      it does not own, copy, package, or launch another lifecycle profile.
    benefits:
      - Catalog ownership and compatibility remain explicit.
      - The request body and accepted response are testable without a live server.
      - No duplicate lifecycle profile is introduced.
  - id: 3
    title: Pin the standard presentation tool
    decision: |
      The application records the Go present command as a Go tool dependency
      and invokes it through Mage. Operators do not depend on an undocumented
      globally installed present binary.
    benefits:
      - Presentation startup is reproducible.
      - The application uses the standard slide format and server.
      - Command construction can be tested without binding a port.
  - id: 4
    title: Separate development roots
    decision: |
      The demo.yaml catalog_root selects the canonical profile checkout.
      The demo.yaml core_root selects the runtime development checkout. Monorepo
      defaults are portable relative paths, and declared values support
      independent checkouts.
    benefits:
      - Catalog and runtime revisions remain visible.
      - Installed-runtime and source-checkout operation are distinct.
      - No developer-specific path becomes part of the contract.
  - id: 5
    title: Report composition without agent ownership
    decision: |
      mage stats emits application ownership, three canonical references
      (documentation-curator, collector, and lifecycle-exit),
      agents_contributed: 0, and the canonical curator profile path without an
      agents section. It does not emit documentation counts.
    benefits:
      - Root aggregation does not double-count canonical agents.
      - The application's contribution remains measurable.
      - Ownership is machine-readable.
  - id: 6
    title: Extend capability contracts by reference
    decision: |
      The application declares runnable_module and managed_service. Both the
      documentation-curator and Go present processes are managed services for
      this composition, so srd002 R1 through R3 apply to each. The application
      also declares implemented package, Helm, and kind capabilities backed by
      the checked-in package, render, and bounded integration targets. Local
      documents record service-specific evidence and gaps instead of copying
      shared requirement text.
    benefits:
      - Shared lifecycle and operator obligations have one canonical source.
      - Applicability is explicit for each long-running process.
      - Release status cannot imply unimplemented package or cluster surfaces.
  - id: 7
    title: Collect traces with the canonical collector agent
    decision: |
      The demo starts the canonical collector agent (mode spool, receiver on
      127.0.0.1:4317, query on port 18193) before the curator and passes
      --otel-otlp-endpoint and --otel-service-name to the curator run. After
      the curator exits, the run target posts to the collector control exit
      route and waits for the process to terminate. Tracing is on by default
      and disabled by setting tracing:false in demo.yaml.
    benefits:
      - A guided run produces browsable traces without external infrastructure.
      - The collector reuses the same agent binary and canonical profile.
      - The presenter shows the trace waterfall from the collector query surface.
  - id: 8
    title: Deploy the canonical profile closures through a chart
    decision: |
      A chart runs the documentation-curator and the collector as persistent
      Kubernetes workloads. A mage preparation target stages the catalog-owned
      curator and collector profile closures as checksum-validated ConfigMaps
      that the workloads mount into one runtime image; a values.schema.json owns
      the deployment values, and a package target emits a self-contained archive a
      bounded kind target installs. The chart deploys canonical profiles by
      reference, copying the profile config for neither workload. The curator's
      browser UI is the one exception: its dist trees exceed the ConfigMap payload
      limit, so deploy/test tooling provisions deterministic shards outside the
      Helm release and an init container stages them into the curator workspace
      at startup. The runtime image remains profile-free; only the applier image
      carries its sanctioned CLIs (decision 9). srd001-helm-deployment
      defines the topology, package, schema, and smoke; srd002-managed-application-services
      R4 through R6 apply by reference. The package, chart, and bounded kind
      integration targets are checked in.
    benefits:
      - The same composition the local demo runs installs and upgrades on a cluster.
      - Mounted closures keep the catalog as the one owner of the curator and collector profiles.
      - A validated archive and bounded kind smoke prove the topology independently of the source tree.
  - id: 9
    title: Separate the deciding caller from the actuating applier
    decision: |
      The applier decides no deployment values. An authorized operator or CI
      caller decides a values-plane patch and submits it to the applier's apply
      endpoint; the applier validates it against the chart's values.schema.json,
      applies it as a values-file rollout, verifies the curator and collector
      Deployments, and rolls back on failure. Deployment authority is held by the
      applier alone: it binds helm and kubectl as exec tools, and the curator and
      collector profiles carry no deployment CLI. Authority is set by declared,
      validated config, never by the actuation surface, which is network-gated off
      the serving pods. The applier image carries helm and kubectl, a recorded
      divergence from the profile-free image invariant. The Agent Architecture has
      no control plane, so the caller is external, not an in-cluster creator,
      orchestrator, or panel. srd002-applier defines the actuation surface,
      machine, and authority boundary.
    benefits:
      - The deciding operator and the actuating agent stay separable and auditable.
      - Deployment CLIs never reach a serving role, so a running agent cannot actuate the cluster.
      - The values-plane boundary keeps host, URL, method, and credential input off the apply path.

technology_choices:
  - component: Presentation server
    technology: Version-pinned Go present tool
    purpose: Serve the .slide deck with a reproducible standard command.
  - component: Application orchestration
    technology: Mage
    purpose: Expose run, presentation, audit, and stats entry points.
  - component: Agent program
    technology: YAML profiles interpreted by agent-core
    purpose: Run catalog curator and collector profiles plus the local deployment applier.
  - component: Reusable profile
    technology: applications/catalog
    purpose: Supply the canonical documentation-curator profile and UI.
  - component: Runtime
    technology: agent-core
    purpose: Supply the interpreter, documentation host, REST runtime, and tools.

project_structure:
  application:
    - path: README.md
      role: Operator prerequisites, ports, commands, and lifecycle.
    - path: agent-architecture.slide
      role: Guided presentation.
    - path: magefiles/
      role: Run, presentation, audit, stats, and deterministic tests.
    - path: go.mod
      role: Standalone module and pinned Go presentation tool dependency.
  documentation:
    - path: docs/VISION.yaml
      role: Goals, boundaries, and ownership.
    - path: docs/ARCHITECTURE.yaml
      role: Components, interfaces, dependency direction, and decisions.
    - path: docs/road-map.yaml
      role: Release 00.0 contract and Mage evidence.
    - path: docs/SPECIFICATIONS.yaml
      role: Reciprocal use-case and test-suite index.
    - path: docs/specs/use-cases/
      role: Guided operator flow.
    - path: docs/specs/test-suites/
      role: Executable evidence contract.

implementation_status:
  current_focus: |
    The runnable module, trace collection, manifest-derived package, Helm chart,
    bounded kind target, and local declarative applier are implemented. The
    application remains composition-only: curator, collector, lifecycle-exit,
    and their UIs stay catalog-owned, while the application-specific applier and
    deployment stay local pending GH-1420. Live local managed-service browser
    observations remain dependency-gated and are not inferred from command
    construction tests.
  progress:
    - implemented: Application ownership and dependency direction.
    - implemented: Reciprocal deterministic test suite for run, presentation, audit, and stats.
    - implemented: runnable_module applicability and managed_service classification.
    - implemented: Relocated deck, README, and lifecycle-exit profile.
    - implemented: Version-pinned present dependency and tested Mage entry points.
    - implemented: Root audit, test, stats, and release participation.
    - implemented: Collector agent trace collection wired into the demo run path.
    - implemented: agents/application.yaml is the direct-root, deployment, UI, capability, and compatibility authority.
    - implemented: Helm preparation and packaging derive curator, collector, and applier packages and provenance from the shared appmanifest closure.
    - implemented: Packaged chart render, schema guards, bounded kind smoke target, and declarative applier evidence.
    - partial: Guided presentation, launch, browser, and exit use case.
    - partial: srd002 R1 through R3 conformance for the curator and Go present
        servers; AC1 through AC3 are not yet satisfied.
    - dependency_gated: Live server startup, browser inspection, role readiness,
        liveness, representative failure, diagnostics, telemetry, shutdown,
        in-flight handling, and listener-release observations.

