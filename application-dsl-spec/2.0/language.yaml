  - id: R-TOOL-003
    target: processor
    level: MUST
    statement: >-
      A conforming processor MUST check every handoff before a run: the
      message of each signal that fires a transition, as emitted by the
      actions whose transitions enter its state (or the seed, for the
      initial state), MUST conform to the input type of the transition's
      action, binding a generic action's parameters from it; a transition
      with no action passes its message on. Across a channel the check
      before a run is made in the load of each agent on either side, given
      its application and agent service, and not in the whole-application
      check (R-APP-011). On the consuming side an arriving item is a
      producer whose message is `builtin.Message<T>`, T the channel
      schema's type, on the arrival signal the initial state takes or the
      receive tool's `Received`, and the action that signal fires MUST
      accept it; a refusal names the agent service, the channel, the
      signal, the state, the action, and the path. On the emitting side
      the message an action sends onto a channel MUST conform to the
      channel schema's type, and also to the input of the local tool whose
      contract an action moved by `action_channels` keeps. A message whose
      type names no field conforms to every input, so a producer that
      sends one onto a channel whose schema names fields passes this check,
      and the processor SHOULD warn naming it. An agent loaded without its
      application consumes and emits no channel, so neither side is checked
      before a run; every item is held to the schema at delivery
      (R-TOOL-004). At run time the processor MUST hold each result's
      message to the type its signal declares, and a mismatch becomes
      `CommandError` naming the tool, the signal, and the path.
    acceptance:
      - assertion: pending
        note: >-
          No test in this repository anchors this statement; the engine in
          this repository implements the 1.0 language.

  - id: R-TOOL-004
    target: specification
    level: MUST
    statement: >-
      A channel-schema's body is the type of the message bodies its channel
      carries: an object schema, `type` absent or `object`, with
      `properties` and `required` written in the subset of R-TOOL-002. A
      conforming processor MUST refuse a channel schema of another type,
      and a listener MUST refuse an item that is not an object, lacks a
      required property, or mistypes a named one. The listener's check is
      the one each item meets at delivery. Before a run the schema's type
      is the message of the channel's arrival and the input of its words in
      the handoff check of each agent that emits or consumes the channel
      (R-TOOL-003).
    acceptance:
      - assertion: fixture
        path: fixtures/specification/channel-schema-body/valid.yaml
        check: channel_schema_body
        verdict: valid
      - assertion: fixture
        path: fixtures/specification/channel-schema-body/array-type.yaml
        check: channel_schema_body
        verdict: invalid
      - assertion: pending
        note: >-
          No test in this repository anchors this statement; the engine in
          this repository implements the 1.0 language.
      - assertion: fixture
        path: fixtures/specification/channel-schema-body/outside-subset.yaml
        check: channel_schema_body
        verdict: invalid
      - assertion: pending
        note: >-
          No test in this repository anchors this statement; the engine in
          this repository implements the 1.0 language.

  - id: R-TOOL-005
    target: specification
    level: MUST
    statement: >-
      A declaration unit names itself with `unit` and MAY list `imports`,
      the units whose tools and types it reaches. An import path MUST be
      relative to the importing file or absolute under a library root,
      `/opt/<root>/...` (R-PROF-008); any other absolute path is refused. A
      tool name MUST be unique in the closure a profile loads, except that
      a tool carrying `override: true` replaces the tool of its name an
      import brought in; an override with no imported tool of its name is
      refused. A REST unit's `imports` and fragment expansions resolve by
      the same two path forms.
    acceptance:
      - assertion: fixture
        path: fixtures/specification/profile-closure/override.yaml
        check: profile_closure
        verdict: valid
      - assertion: fixture
        path: fixtures/specification/profile-closure/override-unimported.yaml
        check: profile_closure
        verdict: invalid
      - assertion: fixture
        path: fixtures/specification/profile-closure/duplicate-tool.yaml
        check: profile_closure
        verdict: invalid
      - assertion: fixture
        path: fixtures/specification/profile-closure/bad-import.yaml
        check: profile_closure
        verdict: invalid
      - assertion: rig
        path: agent-core/internal/tools/rest/loading_imports_test.go
        test: TestLoadDefinitionsResolvesImportedRESTUnits
      - assertion: rig
        path: agent-core/internal/tools/rest/definition/library_imports_test.go
        test: TestRESTImportsAndFragmentsResolveUnderTheAgentCoreLibrary

  - id: R-TOOL-006
    target: specification
    level: MUST
    statement: >-
      A tool MUST carry a `name` and MAY carry `type`, `builtin` or `exec`,
      absent meaning `exec`. `visibility` is `external`, the default, which
      a model may choose under `$tool`, or `internal`, which only a
      transition runs; a conforming processor MUST refuse any other value,
      so a typo cannot expose an internal word. `category` MAY classify the
      tool as `word`, `sentence`, `boundary`, or `stateful_internal` for
      contract validation. A `builtin` MUST name its `init`, the engine
      factory that builds it, and MAY carry `config`, which that factory
      decodes; a processor MUST refuse a builtin with no `init` when it
      loads and one whose `init` it does not provide before the run.
    acceptance:
      - assertion: fixture
        path: fixtures/specification/tool-fields/valid.yaml
        check: tool_fields
        verdict: valid
      - assertion: fixture
        path: fixtures/specification/tool-fields/unknown-type.yaml
        check: tool_fields
        verdict: invalid
      - assertion: fixture
        path: fixtures/specification/tool-fields/unknown-visibility.yaml
        check: tool_fields
        verdict: invalid
      - assertion: fixture
        path: fixtures/specification/tool-fields/builtin-without-init.yaml
        check: tool_fields
        verdict: invalid
      - assertion: rig
        path: agent-core/internal/tools/registry/builtin_test.go
        test: TestRegisterUnifiedToolsUnknownInit

  - id: R-PROF-007
    target: specification
    level: MUST
    statement: >-
      An agent-profile's `tools` lists at least one tool-selection, whose
