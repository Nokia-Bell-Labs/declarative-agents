  - id: R-TOOL-002
    target: specification
    level: MUST
    statement: >-
      A declaration unit MAY carry `types`, a list of named types, and a
      unit carries `types` or `tools`, never both. A type's `schema` MUST
      use only `type`, `properties`, `required`, `items`, `description`, and
      `enum`, at any depth, and `type` MUST be one of `object`, `array`,
      `string`, `number`, `integer`, or `boolean`: the subset is closed so a
      selector path can be decided against a shape. A type MAY declare
      `params` and reference them as `{$type: $T}`; a reference
      `{$type: <unit>.<Name>}` stands anywhere a schema does and MUST carry
      no other keyword, and a type MUST NOT reference a parameter it does not
      declare. The one widening is a discriminated union,
      `{oneOf: [variant, ...], discriminator: <field>}`, which MAY stand as an
      array's `items` or a property's value and MUST NOT stand as a schema's
      root. It lists at least two variants, each an object type that requires
      the discriminator as a string with exactly one `enum` value, the values
      distinct; a value is checked against the variant its discriminator
      selects. A channel schema and a model-facing tool's types carry no
      union.
