name: people-list
purpose: |-
  List who control/people.md names on which scrums and epics (srd045). Use
  when a person asks who is on a scrum or epic.

  This machine has no model state: scrum-master people list (design.md D10,
  D14; GH-2871). The run starts in the system repository's checkout, or one
  beside it.
configuration:
  machine: plugin/agents/people-list/machine.yaml
  tools: plugin/agents/people-list/tools.yaml
invariants:
- Every step is a word; no model acts anywhere in this machine
- A refusal ends the run in the state that names it, with the word's reason
lifecycle: |-
  1. Idle → List (Seed): scrum-master people list
  2. List → Done (ToolDone)
initial_state: Idle
budget:
  command_timeout: 16m
  max_iterations: 10
states:
- name: Idle
  meaning: Initial state before the first word.
- name: List
  meaning: |
    The list word: scrum-master people list prints who the document names;
    a program that keeps no document has no people recorded.
- name: Done
  run_status: succeeded
  meaning: |
    Terminal. Every word ran, and the last one reported what it did.
- name: Refused
  run_status: failed
  meaning: |
    Terminal. The word refused — no system repository's checkout is at or
    beside the directory, or the document does not parse — and its reason
    is the run's last output.
- name: Failed
  run_status: failed
  meaning: Terminal. An infrastructure error outside the words' refusals.
terminal_states:
- Done
- Refused
- Failed
signals:
- name: Seed
  trigger: Loop initialization.
- name: ToolDone
  trigger: A word executed successfully.
- name: ToolFailed
  trigger: A word reported failure — a refusal with its reason.
- name: CommandError
  trigger: Infrastructure-level error (not a tool failure).
transitions:
- state: Idle
  signal: Seed
  next: List
  action: people_list
  summary: true
- state: List
  signal: ToolFailed
  next: Refused
- state: List
  signal: ToolDone
  next: Done
- state: Idle
  signal: CommandError
  next: Failed
- state: List
  signal: CommandError
  next: Failed
