name: issue-link
purpose: |-
  Name the story or epic a filed issue implements, and lint it again
  (srd007). Use when a person asks to link an issue to a story or an epic.

  This machine has no model state: scrum-master issue link (design.md D10,
  D14; GH-2871). SCRUM_MASTER_PROJECT and SCRUM_MASTER_ISSUE name the issue,
  and the run's request names the story or epic.
configuration:
  machine: plugin/agents/issue-link/machine.yaml
  tools: plugin/agents/issue-link/tools.yaml
invariants:
- Every step is a word; no model acts anywhere in this machine
- A refusal ends the run in the state that names it, with the word's reason
lifecycle: |-
  1. Idle → Link (Seed): scrum-master issue link
  2. Link → Done (ToolDone)
initial_state: Idle
budget:
  command_timeout: 16m
  max_iterations: 10
states:
- name: Idle
  meaning: Initial state before the first word.
- name: Link
  meaning: |
    The link word: scrum-master issue link writes the Implements line and
    lints the issue; a second identical run changes nothing.
- name: Done
  run_status: succeeded
  meaning: |
    Terminal. Every word ran, and the last one reported what it did.
- name: Refused
  run_status: failed
  meaning: |
    Terminal. The link was refused — the target is of another kind, its
    repository does not hold it, or the issue already names something else
    without force — and the word's reason is the run's last output.
- name: Failed
  run_status: failed
  meaning: Terminal. An infrastructure error outside the words' refusals.
terminal_states:
- Done
- Refused
- Failed
signals:
- name: Seed
  trigger: Loop initialization.
- name: ToolDone
  trigger: A word executed successfully.
- name: ToolFailed
  trigger: A word reported failure — a refusal with its reason.
- name: CommandError
  trigger: Infrastructure-level error (not a tool failure).
transitions:
- state: Idle
  signal: Seed
  next: Link
  action: issue_link
  summary: true
- state: Link
  signal: ToolFailed
  next: Refused
- state: Link
  signal: ToolDone
  next: Done
- state: Idle
  signal: CommandError
  next: Failed
- state: Link
  signal: CommandError
  next: Failed
