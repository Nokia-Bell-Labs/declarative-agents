unit: monitor-rest
rest:
  version: v1
  limits:
    local_monitor:
      timeout: 2s
      read_timeout: 2s
      max_request_bytes: 4096
      max_response_bytes: 1048576
      network:
        hosts: [127.0.0.1, localhost]
  servers:
    monitor:
      address: 127.0.0.1:0
      limits_ref: local_monitor
      queue:
        name: monitor
        capacity: 8
        overflow: reject
        timeout: 100ms
      shutdown:
        # The proof drives this server from the same process that runs the
        # loop, so the drain competes with the test's own goroutines for a
        # loaded scheduler. Two seconds was enough on an idle machine and
        # failed stop_monitor_rest with "context deadline exceeded" under
        # load, which the machine reads as CommandError and reports as a
        # failed run (GH-2442). Scheduler-safe, like the waits in the proof.
        timeout: 30s
        drain_policy: drain_then_stop
        stop_listeners: true
        unblock_await_signal: ServerStopped
      endpoints:
        machine_spec:
          method: GET
          path: /monitor/machine
          binding: read_state
          monitor_view: machine_spec
        declared_machines:
          method: GET
          path: /monitor/machines
          binding: read_state
          monitor_view: declared_machines
        declared_tools:
          method: GET
          path: /monitor/tools/declared
          binding: read_state
          monitor_view: declared_tools
        current_state:
          method: GET
          path: /monitor/state
          binding: read_state
          monitor_view: current_state
        tools:
          method: GET
          path: /monitor/tools
          binding: read_state
          monitor_view: tools
        metrics:
          method: GET
          path: /monitor/metrics
          binding: read_state
          monitor_view: metrics
        recent_events:
          method: GET
          path: /monitor/events
          binding: read_state
          monitor_view: events
        event_stream:
          method: GET
          path: /monitor/events/stream
          binding: stream_events
          monitor_view: events
        openapi:
          method: GET
          path: /monitor/openapi
          binding: static_metadata
          monitor_view: openapi
        control_exit:
          method: POST
          path: /monitor/control/exit
          binding: emit_signal
          signal: ExitRequested
          request:
            body_schema:
              type: object
              properties:
                reason: {type: string}
          response:
            output:
              accepted: "true"
