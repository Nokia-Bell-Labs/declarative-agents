name: planner-passthrough
purpose: |-
  The planner pass-through variant loads a requirement graph, extracts
  executable tasks without LLM planning or issue materialization, invokes the
  executor profile, and validates the resulting workspace.

  Variant: pass-through execution skips LLM plan generation and executes extracted tasks directly.
configuration:
  machine: agents/planner/machine.yaml
  tools: agents/planner/tools.yaml
  llm_configs: agents/planner/llm/*.yaml
  tool_declarations:
  - tools/builtin.yaml
  - tools/exec.yaml
  variants:
  - agents/planner/machine-passthrough.yaml
  - agents/planner/machine-plan-only.yaml
invariants:
- The requirement graph is collapsed into one aggregate executable task
- No LLM planning or issue tracker command runs
- Failed execution can be retried directly
- Graph nodes are marked done/failed to track progress
- The planner terminates as completed, stalled, or failed
lifecycle: |-
  1. Idle → Loading: load_graph reads the requirement corpus
  2. Loading → Extracting: extract_all creates one executable aggregate task
  3. Extracting → Executing: execute_task invokes the executor profile
  4. Executing → Vetting → Building → Testing: validation pipeline
  5. Testing → CheckingResult: evaluate pass/fail
  6. CheckingResult → Completed: validation succeeded
  6a. CheckingResult → Executing: retry available

  The variant executes one aggregate task; retries return directly to Executing.
pipeline_diagram: |-
  ```mermaid
  flowchart TD
    A[Idle] -->|Seed| L[Loading]
    L -->|GraphLoaded| B[Extracting]
    B -->|TaskExtracted| H[Executing]
    H --> I[Vet / Build / Test]
    I --> J[CheckingResult]
    J -->|Success| K[Completed]
    J -->|Retry| H
    J -->|Retries exhausted| S[Stalled]
  ```
initial_state: Idle
states:
- name: Idle
  meaning: Initial state before planning begins.
- name: Loading
  meaning: Loading the specification corpus and building the requirement graph.
- name: Extracting
  meaning: Creating one aggregate executable task from all ready requirements.
- name: Executing
  meaning: Running the generator agent to implement the task.
- name: Vetting
  meaning: Running go vet on the workspace.
- name: Building
  meaning: Running go build on the workspace.
- name: Testing
  meaning: Running go test on the workspace.
- name: CheckingResult
  meaning: |
    Evaluating execution outcome. On success, completes the aggregate graph.
    On failure, retries execution if available.
- name: Completed
  meaning: Terminal. All tasks in the graph are done.
- name: Stalled
  meaning: Terminal. Remaining tasks are blocked by failed dependencies.
- name: Failed
  meaning: Terminal. An unrecoverable error occurred.
terminal_states:
- Completed
- Stalled
- Failed
signals:
- name: Seed
  trigger: Loop initialization.
- name: GraphLoaded
  trigger: The requirement graph was loaded and seeded into pipeline state.
- name: TaskExtracted
  trigger: A task was extracted from the requirement graph.
- name: AllDone
  trigger: All tasks in the graph are done.
- name: Blocked
  trigger: Remaining tasks are blocked by failed dependencies.
- name: ToolDone
  trigger: A tool executed successfully.
- name: ToolFailed
  trigger: A tool executed but reported failure.
- name: ExecutionDone
  trigger: The generator agent completed successfully.
- name: ExecutionFailed
  trigger: The generator agent failed.
- name: ValidationPassed
  trigger: Build/vet/test validation passed.
- name: RetryAvailable
  trigger: Retries remain for the current task.
- name: RetriesExhausted
  trigger: All retries consumed for the current task.
- name: CommandError
  trigger: Infrastructure-level error.
transitions:
- state: Idle
  signal: Seed
  next: Loading
  action: load_graph
- state: Loading
  signal: GraphLoaded
  next: Extracting
  action: extract_all
- state: Loading
  signal: CommandError
  next: Failed
- state: Extracting
  signal: TaskExtracted
  next: Executing
  action: execute_task
- state: Extracting
  signal: AllDone
  next: Completed
- state: Extracting
  signal: Blocked
  next: Stalled
- state: Extracting
  signal: CommandError
  next: Failed
- state: Executing
  signal: ExecutionDone
  next: Vetting
  action: vet
- state: Executing
  signal: ExecutionFailed
  next: Vetting
  action: vet
- state: Executing
  signal: CommandError
  next: Failed
- state: Vetting
  signal: ToolDone
  next: Building
  action: build
- state: Vetting
  signal: ToolFailed
  next: CheckingResult
  action: check_result
- state: Vetting
  signal: CommandError
  next: Failed
- state: Building
  signal: ToolDone
  next: Testing
  action: test
- state: Building
  signal: ToolFailed
  next: CheckingResult
  action: check_result
- state: Building
  signal: CommandError
  next: Failed
- state: Testing
  signal: ToolDone
  next: CheckingResult
  action: check_result
- state: Testing
  signal: ToolFailed
  next: CheckingResult
  action: check_result
- state: Testing
  signal: CommandError
  next: Failed
- state: CheckingResult
  signal: ValidationPassed
  next: Completed
- state: CheckingResult
  signal: RetryAvailable
  next: Executing
  action: execute_task
- state: CheckingResult
  signal: RetriesExhausted
  next: Stalled
- state: CheckingResult
  signal: CommandError
  next: Failed
