      fields:
        executive_summary: {in: [document_field], shape: prose}
        problem: {in: [document_field], shape: prose}
        what_this_does: {in: [document_field], shape: prose}
        why_we_build_this: {in: [document_field], shape: prose}
        success_criteria: {in: [document_field], shape: list, item_pattern: '^[a-z][a-z0-9_]*: ', value: keyed}
        not: {in: [document_field], shape: list}
        canonical_documents: {in: [document_field], shape: list}
      required_fields: [executive_summary, problem, what_this_does, why_we_build_this, success_criteria, not]
