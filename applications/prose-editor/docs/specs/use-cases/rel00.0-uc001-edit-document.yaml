id: rel00.0-uc001-edit-document
title: Edit and Publish a Corpus-Conditioned Document
release: "00.0"
status: planned
runtime_status: unimplemented

summary: |
  A human asks Prose Editor to edit one GitHub document at a selected revision,
  names the target voice and bounded retry and publication policy, and either
  grants or withholds exact-hash Pangram upload consent. The planned
  workflow-orchestrator resolves and captures the source as an immutable
  original, invokes structure, voice, and style editors serially, obtains an
  independent six-category critic verdict, replays the responsible stage and
  all downstream stages when bounded policy permits, finalizes one immutable
  accepted lineage, and performs one create-or-reuse commit, non-force push,
  and pull request.

  Every remote intent and accepted or rejected result is durable before the
  next action. Re-entry reuses recorded identities. Recovery reconciles the
  append-only application manifest with agent-core checkpoint state. Pangram
  denial, absence, invalid consent, pending, failure, or unavailability remains
  explicit advisory evidence and never changes the independently validated
  verdict. This document specifies planned behavior only; no runtime or
  executable evidence exists.

actor: |
  A human document owner who supplies repository, source path and revision,
  target voice, bounded retry and warn policy, publication destination, saga
  identity, and an explicit Pangram consent decision. The human retains intent,
  policy, privacy, exception, and accountability authority.

trigger: |
  The human submits one validated Prose Editor request for a GitHub-hosted source
  document and a release 00.0 serial edit-and-publication saga.

preconditions:
  - The source and publication repositories, base, branch shape, models, corpus identities, service endpoints, credentials, output root, and hard limits are trusted configuration.
  - The requested repository, path, revision, destination, policy, and saga identity pass the planned allowlist, containment, and conflict checks.
  - The persistent output workspace is available to exactly one orchestrator writer for the saga ID.
  - Structure, voice, and tightening corpora remain authoritative outside Chroma; their three planned RAG instances are read-only and corpus-scoped.
  - Runtime profiles, machines, ToolDefs, helpers, services, tests, and external integrations remain unimplemented in release 00.0.

flow:
  - id: F1
    text: |
      The orchestrator validates the human request, source and publication
      authority, retry and warn policy, saga identity, and Pangram consent
      record. It appends and projects the request intent before remote work.
  - id: F2
    text: |
      The orchestrator resolves the requested revision to one full commit,
      fetches that commit through fixed constrained GitHub source operations,
      reads the validated blob, computes its SHA-256 and byte length, and writes
      or reuses 00-original.md exactly once.
  - id: F3
    text: |
      The orchestrator records the captured source repository, path, full
      commit, exact bytes, digest, and artifact identity in append-only manifest
      history, projects manifest.json, and never overwrites the original.
  - id: F4
    text: |
      The orchestrator appends and projects one structure intent, reads and
      verifies the immutable original, and invokes specialist-editor:structure
      with bytes and identities rather than a workspace path.
  - id: F5
    text: |
      Specialist-editor:structure deterministically retrieves section or outline evidence
      from structure-rag, permits at most one grounding refinement, performs
      only supported structural operations, validates semantic and required
      content preservation, and returns data without persistence authority.
  - id: F6
    text: |
      The orchestrator validates, hashes, and writes or reuses the structure
      response at its immutable attempt path, then appends and projects its
      accepted or rejected result before continuing.
  - id: F7
    text: |
      From the selected accepted structure parent, specialist-editor:voice retrieves
      independently mapped rhetorical-role and register anchors from voice-rag,
      rewrites eligible passages in their original slots, validates meaning and
      protected content, checks provenance-bound copy risk, and bounds internal
      candidate generation to three attempts.
  - id: F8
    text: |
      The orchestrator validates, hashes, and persists the voice attempt and its
      provenance before selecting it and durably advancing.
  - id: F9
    text: |
      From the selected accepted voice parent, specialist-editor:style identifies explicit
      tightening targets, retrieves applicable before/after pairs only from
      tightening-rag, edits only target spans, preserves voice and protected
      content, and bounds pair refinement and candidate retries.
  - id: F10
    text: |
      The orchestrator validates, hashes, and persists the style attempt and its
      complete pair lineage before selecting it and durably advancing.
  - id: F11
    text: |
      The orchestrator appends and projects critique intent, verifies and reads
      the immutable original and selected style candidate, and invokes the
      isolated voice-critic with exact bytes, hashes, policy, and consent but no
      editor reasoning, conversation, path, or verdict recommendation.
  - id: F12
    text: |
      The critic retrieves its own voice evidence and completes semantic
      preservation, structural intent, voice match, tightening quality,
      unsupported additions, and anchor-copy-risk findings. Raw model output is
      parsed and deterministically validated before consent or Pangram routing.
  - id: F13
    text: |
      Only exact-hash, affirmative, unexpired consent reaches separate original
      and candidate Pangram submit and bounded poll operations. Denied, absent,
      expired, malformed, or hash-mismatched consent performs no upload.
      Pending, STAGE_FAILED, timeout, provider failure, and unavailability
      remain explicit advisory statuses and cannot alter verdict or responsible
      stage.
  - id: F14
    text: |
      The orchestrator stores the hash-bound critique attempt and manifest
      result before routing. Pass or policy-permitted warn may proceed. Reject
      contains exactly one responsible stage: structure, voice, or style.
  - id: F15
    text: |
      Structure rejection restarts from the original and replays structure,
      voice, style, and critique. Voice rejection preserves selected structure
      and replays voice onward. Style rejection preserves structure and voice
      and replays style and critique. Semantic and unsupported-addition findings
      use the critic-selected responsible editor; no semantic editor exists.
  - id: F16
    text: |
      Every domain retry allocates a new monotonic responsible-stage attempt
      only after replay intent is durable. Infrastructure retry reuses the
      current attempt and idempotency key. Exhaustion reaches kept_original or
      failed under recorded policy and cannot finalize or publish.
  - id: F17
    text: |
      After critic acceptance, finalization creates or reuses 10-structure.md,
      20-voice.md, 30-style.md, 40-critique.json, and final.md exactly once from
      the selected immutable attempts. final.md is byte-identical to
      30-style.md; any mismatching existing fixed file blocks progress.
  - id: F18
    text: |
      The orchestrator records one publication key and expected tree, checks
      identities, creates or reuses one branch, stages the complete finalized
      saga root, creates or reuses exactly one commit, persists the commit,
      performs one non-force create-or-reuse push, persists the ref, finds or
      creates one pull request, persists its identity, and verifies commit,
      tree, branch head, base, and pull request before published.
  - id: F19
    text: |
      On duplicate delivery or restart, the orchestrator locks and validates the
      saga, repairs manifest.json from contiguous immutable history, verifies
      every referenced hash, compares checkpoint metadata, and resumes the next
      incomplete action with recorded identities. Matching effects are reused;
      conflicts and unverifiable partial publication become
      publication_blocked and suspend for bounded operator action without force
      push, deletion, replacement, history rewrite, or false compensation.
  - id: F20
    text: |
      The orchestrator exits only after the matching terminal manifest revision
      is durable. Release, use case, test suite, runtime, and evidence statuses
      remain planned or unimplemented until future executable evidence exists.

