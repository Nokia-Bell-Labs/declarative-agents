id: test-rel04.0-declarative-applier
title: Test Suite for Release 04.0 Declarative Applier Agent
release: "04.0"
status: planned

overview: |
  This suite validates the applier agent (srd002): the standalone declarative
  actuator for the Agent Architecture chart. It drives a decided values patch
  through validate, apply, and verify, asserting that a non-conforming patch is
  rejected by the chart-schema dry-run, that a valid patch is applied as a
  values-file rollout and verified via kubectl rollout status of the curator and
  collector Deployments, that an apply or verify failure rolls back, and that the
  authority boundary holds. A recording-fake tracer covers every declared
  terminal, real helm validates the chart's values.schema.json, and a live kind
  target proves apply and rollback on cluster. The Agent Architecture has no
  control plane, so no creator, orchestrator, or panel hop appears in this suite.
  The applier profile, chart resources, and integration targets land in later
  sub-issues, so each case names a planned integration target rather than an
  existing Go test.

traces:
  - rel04.0-uc001-declarative-applier

preconditions:
  - agent-core is available for the request runtime, REST server, monitor, and exec tools.
  - The applier profile is deployed with its apply, control, and monitor servers; its image carries helm and kubectl.
  - The chart carries a values.schema.json, and the apply surface is network-gated off the curator and collector pods.

test_cases:
  - use_case: rel04.0-uc001-declarative-applier
    id: validate_apply_verify
    name: Applier validates, applies, and verifies a values change
    integration_target: mage integration:applier
    status: planned
    description: |
      Drives a decided values patch against the applier profile: the apply
      endpoint receives the patch, the applier validates it against the chart's
      values.schema.json by a helm dry-run, rejecting a non-conforming patch with
      a client error and no rollout; for a valid patch it materializes the values
      as an overrides file and applies helm upgrade --reuse-values, returning
      without waiting; it verifies the curator and collector Deployments via
      kubectl rollout status and reports the phase, rolling the release back on a
      verify stall. Asserts the authority boundary: no invocation carries an
      endpoint, a credential, or per-field --set construction.

      helm and kubectl are recording fakes on the applier's PATH, taking their
      exit codes from the scenario, so one run walks every terminal of the apply
      and rollout machines. It is evidence about the machine, the arguments it
      constructs, and the responses it maps, not that real helm and kubectl
      behave as the declarations assume; the chart schema is covered by its own
      case below against real helm, and the live kind target supplies the
      on-cluster evidence.
    inputs:
      valid_patch: adjust an Agent Architecture parameter through a values-plane patch
      invalid_patch: a patch violating the chart values schema
      agents: [applier]
    expected:
      invalid_patch_rejected_by_schema_dry_run_no_rollout: true
      valid_patch_applied_as_values_file_reuse_values_no_wait: true
      no_per_field_set_construction: true
      rollout_verified_via_kubectl_rollout_status: true
      verify_stall_rolls_back_apply_failure_reports_failed: true
      patch_carries_no_endpoint_or_credential: true
    traces:
      - rel04.0-uc001-declarative-applier S1
      - rel04.0-uc001-declarative-applier S2
      - rel04.0-uc001-declarative-applier S3
      - rel04.0-uc001-declarative-applier S4
      - rel04.0-uc001-declarative-applier S5
      - srd002-applier AC1
      - srd002-applier AC2
      - srd002-applier AC3

  - use_case: rel04.0-uc001-declarative-applier
    id: chart_schema_rejects
    name: The chart schema rejects a non-conforming values patch
    integration_target: mage test (chart values.schema.json against real helm)
    status: planned
    description: |
      The applier's validate step is a helm dry-run against the chart's
      values.schema.json, so the rejection is only as real as the schema. The
      case above cannot prove it: its fake helm returns whatever exit code the
      scenario sets, and a schema that accepted every document would pass it
      unchanged.

      Real helm renders the real chart with two fixtures. The rejection must name
      the offending path and the constraint it violated, not merely exit non-zero
      -- a chart failing to render for an unrelated reason exits non-zero too. A
      third assertion pins the constraint the fixture rests on, so loosening the
      schema reads as the guard being removed rather than as a broken fixture.
    inputs:
      conforming: a values patch within the chart schema
      non_conforming: a values patch violating the chart schema
    expected:
      conforming_patch_renders: true
      non_conforming_patch_rejected_by_path_and_constraint: true
      constrained_value_pinned_by_a_third_assertion: true
    traces:
      - rel04.0-uc001-declarative-applier S2
      - srd001-helm-deployment R2.3
      - srd002-applier AC2

  - use_case: rel04.0-uc001-declarative-applier
    id: applier_holds_clis
    name: The applier holds the deployment CLIs and the serving roles do not
    integration_target: mage test (rendered chart and role profiles)
    status: planned
    description: |
      Asserts over the rendered chart and the packaged profiles that only the
      applier carries helm and kubectl bound as exec tools and that the curator
      and collector profiles carry no deployment CLI. Asserts the applier Service
      targets the pods the applier Deployment creates and that its apply surface
      is admitted only from the authorized caller, not from the curator or
      collector pods, so route and NetworkPolicy agree on one authority path, and
      that the applier image carrying the CLIs is a recorded divergence.
    inputs:
      rendered_chart: staged chart with the applier enabled and networkPolicy enabled
    expected:
      applier_alone_binds_helm_and_kubectl: true
      serving_roles_carry_no_deployment_cli: true
      apply_surface_admits_only_the_authorized_caller: true
      apply_surface_not_reachable_from_serving_pods: true
      applier_image_cli_divergence_recorded: true
    traces:
      - rel04.0-uc001-declarative-applier S6
      - srd002-applier AC4
      - srd002-applier AC5

  - use_case: rel04.0-uc001-declarative-applier
    id: broken_read_classified
    name: A broken rollout read is distinguishable from a progressing one
    integration_target: mage test (applier rollout machine)
    status: planned
    description: |
      Asserts over the declared profile that the rollout read reaches a
      broken-read terminal rather than folding it into progressing. kubectl
      rollout status exits non-zero for a rollout that is still progressing and
      for one it could not read at all, so a phase taken from that exit code
      alone would report an absent Deployment, a wrong kubeconfig, a denied RBAC
      read, or an unreachable API server as ongoing progress. A read the cluster
      cannot serve returns a gateway error rather than a phase.
    inputs:
      deployment_shapes: [rolled_out, no_replica_ready_yet, unreadable]
    expected:
      unreadable_rollout_returns_gateway_error_not_a_phase: true
      complete_and_progressing_remain_distinguishable: true
    traces:
      - rel04.0-uc001-declarative-applier S7
      - srd002-applier AC3

  - use_case: rel04.0-uc001-declarative-applier
    id: live_rollout_rollback
    name: A live on-cluster rollout and rollback through the applier
    integration_target: mage integration:applierLive
    status: planned
    description: |
      What the fake CLIs cannot stand in for. The applier image is built on the
      runtime under test, loaded into kind, and the chart installed with the
      applier enabled; a values patch then goes through the apply endpoint and
      the release moves to a new revision, which is the evidence a 200 is not --
      the fake tier returns one of those without helm existing.

      The compensating leg is live too. A reserved patch forces a deterministic
      post-upgrade verification failure; the applier's declared kubectl rollout
      status times out, reaches the rollback terminal, and invokes real helm
      rollback, which restores the prior computed release values and ready curator
      and collector Deployments. The same non-conforming document the schema case
      validates locally is rejected here against the real chart schema, leaving
      the release untouched. Bounded host and in-pod probes classify a Kubernetes
      API or pod-network loss apart from the semantic proof.
    inputs:
      cluster: kind with the applier image built and loaded
      patch: a conforming Agent Architecture values patch
      rollback_trigger: a patch that forces a post-upgrade verification failure
      rejected: a non-conforming Agent Architecture values patch
    expected:
      real_helm_upgrade_changes_the_release: true
      post_upgrade_verify_failure_reaches_rolled_back: true
      real_helm_rollback_restores_prior_computed_values: true
      workload_deployments_recover_after_rollback: true
      non_conforming_patch_rejected_on_the_cluster: true
    traces:
      - rel04.0-uc001-declarative-applier S3
      - rel04.0-uc001-declarative-applier S4
      - srd001-helm-deployment R3
      - srd002-applier AC3
