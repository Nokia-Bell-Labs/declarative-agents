# Fixture for R-REST-008: a machine_request endpoint naming its agent-profile, timeout, and terminal response map.
rest:
  version: v1
  servers:
    docs:
      address: 127.0.0.1:0
      endpoints:
        answer:
          method: POST
          path: /answer
          binding: machine_request
          machine_request:
            profile: ../answerer/profile.yaml
            timeout: 30s
            response:
              terminal_signals:
                Answered: {status: 200}
