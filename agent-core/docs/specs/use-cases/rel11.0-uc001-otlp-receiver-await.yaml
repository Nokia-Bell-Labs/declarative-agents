id: rel11.0-uc001-otlp-receiver-await
title: A persistent machine receives, records, and relays OTLP trace and metric batches

summary: |
  An operator starts a profile whose machine binds an OTLP/gRPC receiver and
  waits for trace batches. A client agent exports one batch. The receiver queues
  it, the await word returns it to the machine, and visible transitions decide
  whether to spool and relay it. The spool uses the same NDJSON shape as
  deterministic agent trace files. Relay preserves the request's resource and
  span identity for a persistent upstream backend.

  The same listener also accepts OTLP metric exports on a separate bounded
  queue: `await_metrics` hands a metric batch to the machine, `spool_metrics`
  records one NDJSON line per metric, and `spool_list_metrics` and
  `spool_get_metric` read that evidence back by name and run identity. The
  receiver process exports its own runtime telemetry to a file, not to the
  endpoint it owns.

actor: Operator running a declarative agent as an OTLP trace and metric ingress

trigger: |
  The operator starts the ingress profile and a client agent exports an
  `ExportTraceServiceRequest` to its configured OTLP/gRPC endpoint.

flow:
  - F1: The profile machine dispatches `otlp_receiver_launch` with a receiver name, isolated bind address, queue capacity, and overflow policy (srd042 R1).
  - F2: Launch returns `ReceiverLaunched`; the machine enters its persistent await loop.
  - F3: A client exports one OTLP trace request. The gRPC handler decodes and enqueues the complete request under bounded backpressure rules (srd042 R2).
  - F4: "`await_spans` consumes the oldest batch and returns its protobuf payload plus bounded metadata as `SpansReceived` (srd042 R3)."
  - F5: The machine evaluates declared policy with ordinary vocabulary and routes the accepted batch to `spool_spans`; rejected policy remains a visible transition.
  - F6: "`spool_spans` resolves the batch from declared command state and appends complete stdouttrace-compatible NDJSON lines (srd042 R4)."
  - F7: In relay mode, the machine dispatches `relay_spans`; the upstream receives the unchanged trace request and returns success (srd042 R5).
  - F8: The machine returns to `await_spans` for the next batch.
  - F9: A lifecycle control event routes to `otlp_receiver_stop`, which stops intake, unblocks awaiters, and reaches a success terminal (srd042 R6).
  - F10: A client exports one OTLP metric request to the same listener; the MetricsService handler decodes and enqueues the complete request on a separate bounded metric queue under the same backpressure rules (srd042 R9.1, R9.2).
  - F11: "`await_metrics` consumes the oldest metric batch and returns its payload plus data-point, service, and metric-name metadata as `MetricsReceived` (srd042 R9.2)."
  - F12: "`spool_metrics` appends one NDJSON record per metric carrying resource, scope, and data-point identity under the same bounded rotation as the trace spool (srd042 R9.3)."
  - F13: "`spool_list_metrics` and `spool_get_metric` read the metric spool back by name and run identity without mutation (srd042 R9.4)."

touchpoints:
  - T1: "srd042-otlp-receiver-tools R0 -- transport words stay separate and MachineSpec owns their sentence"
  - T2: "srd042-otlp-receiver-tools R1 -- declared launch binds OTLP/gRPC and returns without waiting"
  - T3: "srd042-otlp-receiver-tools R2 -- complete requests enter a bounded concurrent FIFO queue"
  - T4: "srd042-otlp-receiver-tools R3 -- await returns one batch or a distinct timeout, stop, or fault signal"
  - T5: "srd042-otlp-receiver-tools R4 -- deterministic spool matches existing stdouttrace NDJSON readers"
  - T6: "srd042-otlp-receiver-tools R5 -- declared relay preserves protobuf identity"
  - T7: "srd042-otlp-receiver-tools R6 -- stop owns listener and waiter cleanup"
  - T8: "srd042-otlp-receiver-tools R7 -- file-only process telemetry prevents ingress self-export"
  - T9: "srd042-otlp-receiver-tools R8 -- the receiver accepts trace and metric exports on one gRPC listener"
  - T10: "srd008-telemetry R9 -- integration evidence keeps stable service and run identity"
  - T11: "srd042-otlp-receiver-tools R9 -- metric intake, spool, and query mirror the trace words without a separate backend"

success_criteria:
  - id: S1
    criterion: A real OTLP/gRPC client exports a complete trace batch that the declared await word returns to the machine.
    traces:
      - srd042-otlp-receiver-tools AC1
  - id: S2
    criterion: The batch is appended in the existing stdouttrace-compatible NDJSON shape with trace, parent, service, and run identity intact.
    traces:
      - srd042-otlp-receiver-tools AC2
  - id: S3
    criterion: Relay delivers the unchanged batch to an upstream OTLP server, and an upstream rejection reaches the machine as CommandError.
    traces:
      - srd042-otlp-receiver-tools AC3
  - id: S4
    criterion: Lifecycle stop releases the listener, unblocks waits, and leaves no background goroutine.
    traces:
      - srd042-otlp-receiver-tools AC4
  - id: S5
    criterion: Client spans arrive while the receiver process's own spans remain only in its deterministic file.
    traces:
      - srd042-otlp-receiver-tools AC5
  - id: S6
    criterion: The receiver accepts trace and metric exports on one gRPC listener and makes no OTLP logs claim; no separate metrics backend is required.
    traces:
      - srd042-otlp-receiver-tools AC6
  - id: S7
    criterion: A real OTLP/gRPC client exports a metric batch that await returns, spool records as NDJSON with resource and metric identity, and the query words read back by name, all while trace intake stays unchanged.
    traces:
      - srd042-otlp-receiver-tools AC8

failure_scenarios:
  - id: E1
    scenario: A full queue silently drops a batch.
    expected: Rejected; configured overflow behavior reports rejected or dropped span counts and never blocks indefinitely.
  - id: E2
    scenario: A spool write fails and the tool relays the batch anyway.
    expected: Rejected; spool emits CommandError and relay can occur only through a later explicit machine transition.
  - id: E3
    scenario: Relay rewrites service.name or a trace identifier.
    expected: Rejected; protobuf span and resource fields arrive unchanged at the upstream.
  - id: E4
    scenario: The receiver exports its own lifecycle spans to its listening endpoint.
    expected: Rejected; the profile uses file-only telemetry and the self-loop proof observes no collector-process batch.
  - id: E5
    scenario: A metric export reaches the trace queue, or a metric word alters a spooled span.
    expected: Rejected; the metric signal uses a separate queue and spool, and trace intake, spool, relay, and query behavior stay unchanged.

out_of_scope:
  - OTLP logs.
  - General-purpose collector throughput or multi-tenant isolation.
  - Jaeger query and trace search behavior.
  - TLS and authenticated transport.

test_suite_trace: test-rel11.0-otlp-receiver
status: implemented
