name: planner-passthrough
purpose: |-
  The planner pass-through variant loads a requirement graph, extracts
  executable tasks without LLM planning or issue materialization, invokes the
  executor profile, and validates the resulting workspace.

  Variant: pass-through execution skips LLM plan generation and executes extracted tasks directly.
configuration:
  machine: agents/planner/machine.yaml
  tools: agents/planner/tools.yaml
  llm_configs: agents/planner/llm/*.yaml
  variants:
  - agents/planner/machine-passthrough.yaml
  - agents/planner/machine-plan-only.yaml
invariants:
- The requirement graph is collapsed into one aggregate executable task
- No LLM planning or issue tracker command runs
- Failed execution can be retried directly
- Graph nodes are marked done/failed to track progress
- The planner terminates as completed, stalled, or failed
lifecycle: |-
  1. Idle → Loading: load_graph reads the requirement corpus
  2. Loading → SelectingReady: select_all_ready creates one aggregate task without changing graph lifecycle
  3. SelectingReady → SeedingPassThroughPlan → MarkingPlanning: profile text seeds the plan, then graph nodes advance
  4. MarkingPlanning → InitializingRetry → Executing: seed visible retry count, then invoke the executor
  5. Executing → Vetting → Building → Testing: validation pipeline
  6. Validation failure → IncrementingRetry → CheckingRetryLimit
  7. RetryAvailable → Executing; RetriesExhausted → Exhausted → Stalled
  8. Testing success → MarkingTaskDone → QueryingRemainingWork → Completed

  The variant executes one aggregate task; retries return directly to Executing.
pipeline_diagram: |-
  ```mermaid
  flowchart TD
    A[Idle] -->|Seed| L[Loading]
    L -->|GraphLoaded| B[SelectingReady]
    B -->|ReadySelected| P[SeedingPassThroughPlan]
    P -->|PassThroughPlanSeeded| M[MarkingPlanning]
    M -->|NodesMarkedPlanning| Z[InitializingRetry]
    Z --> H[Executing]
    H --> I[Vet / Build / Test]
    I -->|Success| J[MarkingTaskDone]
    J --> Q[QueryingRemainingWork]
    Q --> K[Completed]
    I -->|Failure| R[IncrementingRetry]
    R --> P[CheckingRetryLimit]
    P -->|RetryAvailable| H
    P -->|RetriesExhausted| X[Exhausted]
    X --> S[Stalled]
  ```
initial_state: Idle
budget:
  max_iterations: 100
  command_timeout: 16m
expand:
  - fragment: ../units/planner-execution-stage-fragment.yaml
    args: {}
states:
- name: Idle
  meaning: Initial state before planning begins.
- name: Loading
  meaning: Loading the specification corpus and building the requirement graph.
- name: SelectingReady
  meaning: Selecting all ready requirements into one aggregate task without changing graph lifecycle.
- name: SeedingPassThroughPlan
  meaning: Seeding profile-owned title and summary into the current implementation plan.
- name: MarkingPlanning
  meaning: Advancing selected aggregate-task nodes to Planning as a separate graph mutation.
- name: InitializingRetry
  meaning: Seeding retry count zero in labelled command state for the aggregate task.
- name: Completed
  run_status: succeeded
  meaning: Terminal. All tasks in the graph are done.
- name: Stalled
  run_status: failed
  meaning: Terminal. Remaining tasks are blocked by failed dependencies.
- name: Failed
  run_status: failed
  meaning: Terminal. An unrecoverable error occurred.
terminal_states:
- Completed
- Stalled
- Failed
signals:
- name: Seed
  trigger: Loop initialization.
- name: GraphLoaded
  trigger: The requirement graph was loaded and seeded into pipeline state.
- name: ReadySelected
  trigger: All ready nodes were selected into one aggregate task.
- name: PassThroughPlanSeeded
  trigger: Profile-configured pass-through plan text was seeded.
- name: NodesMarkedPlanning
  trigger: Selected aggregate-task nodes advanced to Planning.
- name: NoTask
  trigger: Extraction found no ready task; remaining_work must classify the graph.
- name: RetryCountInitialized
  trigger: Retry count zero was recorded in labelled command state.
- name: AllDone
  trigger: All tasks in the graph are done.
- name: Blocked
  trigger: Remaining tasks are blocked by failed dependencies.
- name: ToolDone
  trigger: A tool executed successfully.
- name: ToolFailed
  trigger: A tool executed but reported failure.
- name: NodesMarkedExecuting
  trigger: Current task nodes advanced to Executing.
- name: TaskFileFormatted
  trigger: The current plan was projected into task-file write parameters.
- name: RetryAvailable
  trigger: Retries remain for the current task.
- name: RetriesExhausted
  trigger: All retries consumed for the current task.
- name: TaskCompleted
  trigger: The current task's graph nodes were marked Done.
- name: TaskFailed
  trigger: The exhausted current task's graph nodes were marked Failed.
- name: WorkRemaining
  trigger: At least one graph task remains ready after the aggregate task.
- name: CommandError
  trigger: Infrastructure-level error.
transitions:
- state: Idle
  signal: Seed
  next: Loading
  action: load_graph
- state: Loading
  signal: GraphLoaded
  next: SelectingReady
  action: select_all_ready
- state: Loading
  signal: CommandError
  next: Failed
- state: SelectingReady
  signal: ReadySelected
  next: SeedingPassThroughPlan
  action: seed_passthrough_plan
- state: SeedingPassThroughPlan
  signal: PassThroughPlanSeeded
  next: MarkingPlanning
  action: mark_nodes_planning
- state: MarkingPlanning
  signal: NodesMarkedPlanning
  next: InitializingRetry
  action: reset_retry_count
  label: retry_count
- state: InitializingRetry
  signal: RetryCountInitialized
  next: MarkingExecuting
  action: mark_nodes_executing
- state: InitializingRetry
  signal: CommandError
  next: Failed
- state: SelectingReady
  signal: NoTask
  next: QueryingRemainingWork
  action: remaining_work
- state: SelectingReady
  signal: CommandError
  next: Failed
- state: SeedingPassThroughPlan
  signal: CommandError
  next: Failed
- state: MarkingPlanning
  signal: CommandError
  next: Failed
- state: Vetting
  signal: ToolFailed
  next: IncrementingRetry
  action: increment_retry
  label: retry_count
- state: Building
  signal: ToolFailed
  next: IncrementingRetry
  action: increment_retry
  label: retry_count
- state: Testing
  signal: ToolFailed
  next: IncrementingRetry
  action: increment_retry
  label: retry_count
- state: CheckingRetryLimit
  signal: RetryAvailable
  next: InvokingExecutor
  action: invoke_executor
- state: Exhausted
  signal: WorkRemaining
  next: Stalled
- state: QueryingRemainingWork
  signal: WorkRemaining
  next: Completed