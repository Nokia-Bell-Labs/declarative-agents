  - id: R-MACH-018
    target: specification
    level: MUST
    statement: >-
      A `for_each` MAY carry `dispatch`, which routes each element to the
      tool its `field` value selects from `actions`, in place of the
      transition's `action`; exactly one of the two MUST route the fan-out.
      The element type MUST be decided, and its `field` MUST be an enum whose
      values equal the `actions` keys in both directions, with no default
      row, so runtime data selects among declared tools and never names
      one. Every `actions` value MUST be a tool the profile selects whose
      input accepts the element, and MUST NOT be `$tool`; when the element
      type is a discriminated union (R-TOOL-002) and `field` is its
      discriminator, the keys are the variants' values and each row's
      input MUST accept the variant its key selects. Every signal a
      dispatched tool emits MUST be named in `continue_on`, `abort_on`, or
      `fail_on`, checked per tool. Each element runs as an ordinary step
      under R-MACH-017, and the join records the tool each element ran.
