  - {id: relationship-manager, parent: connector}
  - {id: protocol-adapter, parent: connector}
  - {id: workflow-orchestrator, parent: executor}
  - {id: change-manager, parent: executor}
  - {id: actuation-agent, parent: executor}
  - {id: ontology-manager, parent: knowledge-manager}
  - {id: policy-architect, parent: knowledge-manager}
  - {id: recommendation-generator, parent: knowledge-manager}
  - {id: workflow-synchronizer, parent: coordinator}
  - {id: conflict-resolver, parent: coordinator}
  - {id: consensus-facilitator, parent: coordinator}
  - {id: telemetry-collector, parent: monitor}
  - {id: anomaly-detector, parent: monitor}
  - {id: assurance-reporter, parent: monitor}
  - {id: predictive-modeler, parent: analyst}
  - {id: root-cause-analyst, parent: analyst}
  - {id: policy-enforcer, parent: guardian}
  - {id: threat-analyst, parent: guardian}
  - {id: incident-responder, parent: guardian}
