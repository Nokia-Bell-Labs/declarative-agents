# The chatbot serving lifecycle and its monitor pair. The four lifecycle words
# arrive from the agent-core fragment under this agent's own names, and the
# monitor pair is the agent-core unit every such agent imports; nothing about
# either is written out here.
unit: mesh-chatbot-declarations
imports:
  - /opt/agent-core/tools/units/monitor-rest-declarations.yaml
expand:
  - fragment: /opt/agent-core/tools/units/serve-lifecycle-declarations-fragment.yaml
    args:
      agent: "chatbot"
      launch_requests: launch_chat_requests
      launch_control: launch_chatbot_control
      await_control: await_chatbot_control
      stop_requests: stop_chat_requests
      requests_rest_ref: chatbot_chat
      control_rest_ref: chatbot_control
      requests_noun: chat
      requests_purpose: that serves a turn
tools:
