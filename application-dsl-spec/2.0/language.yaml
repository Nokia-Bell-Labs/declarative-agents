  - id: R-APP-017
    target: specification
    level: MUST
    statement: >-
      An agent service that listens on a `request-reply`,
      `publish-subscribe`, or `survey` channel MUST NOT declare an
      `instances.max` above one: the reply store that answers a resend once,
      the feed read by cursor, and the open surveys live in one listener
      process, and every instance of an agent service shares its address. A
      `push-pull` listener is not restricted.
    acceptance:
      - assertion: fixture
        path: fixtures/specification/application-scaled-listeners/valid.yaml
        check: application_scaled_listeners
        verdict: valid
      - assertion: fixture
        path: fixtures/specification/application-scaled-listeners/scaled-listener.yaml
        check: application_scaled_listeners
        verdict: invalid
      - assertion: pending
        note: >-
          No test in this repository anchors this statement; the engine in
          this repository implements the 1.0 language.

  - id: R-APP-018
    target: processor
    level: MUST
    statement: >-
      Nothing is networked unless the application declares it: an
      `action_channels` entry on a network transport (R-PROF-005) MUST name
      a channel the application-profile declares and the entry's agent
      service emits. A conforming processor MUST
      refuse any other network action, naming the agent service, the
      action, and the channel, both when it checks the application and when
      it loads the agent. An application whose agent services declare no
      network action is a monolith, and every action in it stays local.
    acceptance:
      - assertion: pending
        note: >-
          No test in this repository anchors this statement; the engine in
          this repository implements the 1.0 language.

  - id: R-APP-019
    target: processor
    level: MUST
    statement: >-
      An agent service MAY declare the fields of the Agent resource an
      operator runs it as, under the Agent's own names: a `mode` of service
      or task, `scaling` for a service agent, a `profile` and an
      `application` manifest as `<package>:<path>`, the `packages` it
      mounts, its `instances`, and its `bindings`, listeners, telemetry,
      workspace, environment, volumes, resources, service account, flags,
      and termination grace period, and the `runtime` it runs on, by the
      name of one of the manifest's `runtimes`, each an image named by tag.
      A service that declares a mode MUST list its packages, profile, and
      instances, and a conforming processor MUST refuse one whose profile,
      application manifest, or workspace asset names a package it does not
      list, one with bindings and no application manifest, one naming a
      runtime the manifest does not declare, a runtime declared twice or
      by digest, and a service that declares any of these fields without a
      mode. Package and runtime images' digests never appear in the
      manifest; the lock supplies them.
    acceptance:
      - assertion: pending
        note: >-
          No test in this repository anchors this statement; the engine in
          this repository implements the 1.0 language.

  - id: R-PROF-001
    target: specification
    level: MUST
    statement: >-
      An agent-profile specification MUST carry the `name` and `machine` keynames,
      each a non-empty string; `machine` references the machine specification
      the agent-instance executes.
    acceptance:
