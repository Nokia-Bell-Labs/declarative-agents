# The status-report workflow's status words, which the model calls (GH-2725):
# each runs in the agent's own process with --json, and a non-zero exit is
# the word's refusal, fed back to the model. Optional flags are parameters,
# never ${VAR} args (GH-135).
unit: scrum-master-status-report-status-declarations
tools:
- name: reports_week
  type: exec
  binary: scrum-master
  args:
  - reports
  - week
  - --json
  - --project
  - ${SCRUM_MASTER_PROJECT}
  visibility: external
  description: 'Gather the open Sprint Goals and the person''s merges and closes this week (srd018 R8.1).'
  category: boundary
  parameters:
    type: object
    properties:
      user:
        type: string
        description: 'The tracker user; empty is the caller.'
        flag: --user
      date:
        type: string
        description: 'A day of the week, YYYY-MM-DD; empty is today.'
        flag: --date
      control:
        type: string
        description: 'Program repository holding control/ files, when not the project.'
        flag: --control
  signature:
    emits: [ToolDone, ToolFailed, CommandError]
  output:
    description: 'The week''s JSON report.'
    schema:
      type: string
  side_effects: []
  reversibility:
    classification: reversible
    requires_confirmation: false
  undo:
    strategy: noop
    description: The word reads and writes nothing.
  errors:
  - signal: CommandError
    condition: the word cannot start — this agent does not serve the scrum-master words — or an environment variable is unset
    message_shape: 'reports_week: <error>'
    state_after_failure: nothing ran in a word that did not start
  - signal: ToolFailed
    condition: the word refuses and exits non-zero
    message_shape: <the word's reason, as printed>
    state_after_failure: the tracker is as the word's refusal left it

- name: reports_previous
  type: exec
  binary: scrum-master
  args:
  - reports
  - previous
  - --json
  visibility: external
  description: 'A person''s last report before this week: its blockers, impact, and next (GH-2725).'
  category: boundary
  parameters:
    type: object
    properties:
      project:
        type: string
        description: 'The repository the person reports in.'
        flag: --project
      user:
        type: string
        description: 'The tracker user; empty is the caller.'
        flag: --user
      date:
        type: string
        description: 'A day of this week, YYYY-MM-DD; empty is today.'
        flag: --date
      control:
        type: string
        description: 'The system repository, whose roster may name a central reports repository still read.'
        flag: --control
      ref:
        type: string
        description: 'The ref of the control files; empty is main.'
        flag: --ref
    required: [project]
  signature:
    emits: [ToolDone, ToolFailed, CommandError]
  output:
    description: 'The word''s JSON report.'
    schema:
      type: string
  side_effects: []
  reversibility:
    classification: reversible
    requires_confirmation: false
  undo:
    strategy: noop
    description: The word reads and writes nothing.
  errors:
  - signal: CommandError
    condition: the word cannot start — this agent does not serve the scrum-master words
    message_shape: 'reports_previous: <error>'
    state_after_failure: nothing ran in a word that did not start
  - signal: ToolFailed
    condition: the word refuses and exits non-zero
    message_shape: <the word's reason, as printed>
    state_after_failure: nothing was written

- name: reports_path
  type: exec
  binary: scrum-master
  args:
  - reports
  - path
  - --json
  visibility: external
  description: 'Where this week''s report or rollup goes, as its status issue names it; a central reports checkout''s also names the branch, and in place pop makes it (GH-2725, GH-2777).'
  category: boundary
  parameters:
    type: object
    properties:
      user:
        type: string
        description: 'The person whose report it is.'
        flag: --user
      level:
        type: string
        description: 'A rollup''s level instead: program, or the team''s subsystem SRD id.'
        flag: --level
      date:
        type: string
        description: 'A day of the week, YYYY-MM-DD; empty is today.'
        flag: --date
  signature:
    emits: [ToolDone, ToolFailed, CommandError]
  output:
    description: 'The word''s JSON report.'
    schema:
      type: string
  side_effects: []
  reversibility:
    classification: reversible
    requires_confirmation: false
  undo:
    strategy: noop
    description: The word reads and writes nothing.
  errors:
  - signal: CommandError
    condition: the word cannot start — this agent does not serve the scrum-master words
    message_shape: 'reports_path: <error>'
    state_after_failure: nothing ran in a word that did not start
  - signal: ToolFailed
    condition: the word refuses and exits non-zero
    message_shape: <the word's reason, as printed>
    state_after_failure: nothing was written

- name: reports_validate
  type: exec
  binary: scrum-master
  args:
  - reports
  - validate
  - --json
  description: Check the reports repository's reports against the report format (srd018 R2).
  category: boundary
  parameters:
    type: object
    properties:
      dir:
        type: string
        description: The reports repository's checkout; empty is the run's directory.
        flag: --dir
      report:
        type: array
        items:
          type: string
        description: Reports to check; none checks them all.
        positional: true
  signature:
    emits:
    - ToolDone
    - ToolFailed
    - CommandError
  output:
    description: 'The validation''s JSON report: each report and its findings.'
    schema:
      type: string
  side_effects: []
  reversibility:
    classification: reversible
    requires_confirmation: false
  undo:
    strategy: noop
    description: The word reads the reports and writes nothing.
  visibility: external
