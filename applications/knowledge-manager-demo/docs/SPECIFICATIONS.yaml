id: knowledge-manager-demo-specifications
title: Knowledge Manager Demo Application Specification Index

overview: |
  This index governs the standalone Knowledge Manager demo composition.
  Release 00.0 has one application use case and one reciprocal test suite. The
  application references the canonical documentation-curator requirements and
  profile UX evidence in applications/catalog; it does not fork or re-index
  them as application-owned requirements.

  The dependency direction is application -> applications/catalog ->
  agent-core. The Go present tool, catalog checkout, and agent-core checkout are
  explicit development or runtime inputs. Checked-in Mage tests validate
  command construction, portable root resolution, lifecycle configuration,
  documentation traceability, and composition-only statistics. Live launch,
  browser, readiness, shutdown, and listener-release observations remain
  dependency-gated.

  The application extends shared srd001 and srd002 by reference. runnable_module
  and managed_service apply; srd002 R1 through R3 apply to both the canonical
  documentation-curator server launched by the application and the Go present
  server. packaged, helm_managed, and kind_demo do not apply to Release 00.0.

