    compose_pass_response: {word: compose_critic_pass_response, authority: srd003 word_vocabulary.critic_pangram}
    compose_warn_response: {word: compose_critic_warn_response, authority: srd003 word_vocabulary.critic_pangram}
    compose_reject_response: {word: compose_critic_reject_response, authority: srd003 word_vocabulary.critic_pangram}
    compose_failed_response: {word: compose_critic_failed_response, authority: srd003 word_vocabulary.critic_pangram}

  states:
    - {name: awaiting_request, meaning: Initial state; accepts one orchestrator-supplied immutable comparison request.}
    - {name: validating_request, meaning: Run the fixed request and exact-hash consent validator.}
    - {name: parsing_request_report, meaning: Parse request-helper JSON.}
    - {name: checking_request, meaning: Compare one request_status scalar.}
    - {name: composing_voice_query, meaning: Render the critic-owned voice comparison query.}
    - {name: embedding_voice_query, meaning: Obtain a configured embedding.}
    - {name: querying_voice_evidence, meaning: Query only voice-rag.}
    - {name: composing_evaluation_context, meaning: Render independent evaluation context without Pangram or editor reasoning.}
    - {name: evaluating_candidate, meaning: Ask the configured model for six findings and a provisional verdict.}
    - {name: parsing_evaluation, meaning: Parse the raw model JSON.}
    - {name: composing_validation_input, meaning: Render the fixed evaluation-validator input.}
    - {name: validating_evaluation, meaning: Check hashes, categories, verdict-stage relation, and feedback bounds.}
    - {name: parsing_validation_report, meaning: Parse validator JSON.}
    - {name: checking_evaluation, meaning: Compare one evaluation_status scalar.}
    - {name: checking_consent, meaning: Compare one validated consent_gate_status scalar.}
    - {name: composing_original_request, meaning: Render the private original submission.}
    - {name: submitting_original, meaning: POST only the original to Pangram.}
    - {name: polling_original, meaning: GET only the original task.}
    - {name: composing_original_observation_input, meaning: Render original poll-helper input.}
    - {name: interpreting_original_observation, meaning: Classify original task stage and evidence.}
    - {name: parsing_original_observation, meaning: Parse original advisory record.}
    - {name: checking_original_completed, meaning: Compare original status with completed.}
    - {name: composing_original_completed_evidence, meaning: Preserve completed original advisory output under its stable label.}
    - {name: checking_original_pending, meaning: Compare original status with pending.}
    - {name: checking_original_poll_budget, meaning: Compare original poll count with the hard limit.}
    - {name: waiting_original_poll, meaning: Wait one fixed bounded interval before the next original poll.}
    - {name: composing_original_unavailable, meaning: Record explicit original advisory unavailability.}
    - {name: composing_candidate_request, meaning: Render the private candidate submission.}
    - {name: submitting_candidate, meaning: POST only the candidate to Pangram.}
    - {name: polling_candidate, meaning: GET only the candidate task.}
    - {name: composing_candidate_observation_input, meaning: Render candidate poll-helper input.}
    - {name: interpreting_candidate_observation, meaning: Classify candidate task stage and evidence.}
    - {name: parsing_candidate_observation, meaning: Parse candidate advisory record.}
    - {name: checking_candidate_completed, meaning: Compare candidate status with completed.}
    - {name: composing_candidate_completed_evidence, meaning: Preserve completed candidate advisory output under its stable label.}
    - {name: checking_candidate_pending, meaning: Compare candidate status with pending.}
    - {name: checking_candidate_poll_budget, meaning: Compare candidate poll count with the hard limit.}
    - {name: waiting_candidate_poll, meaning: Wait one fixed bounded interval before the next candidate poll.}
    - {name: composing_candidate_unavailable, meaning: Record explicit candidate advisory unavailability.}
    - {name: composing_all_pangram_unavailable, meaning: Record denied or invalid consent for both scans.}
    - {name: composing_comparison_input, meaning: Render separate original and candidate advisory records for comparison.}
    - {name: comparing_advisory, meaning: Compute bounded advisory movement without reading the verdict.}
    - {name: parsing_comparison, meaning: Parse advisory comparison JSON.}
    - {name: composing_comparison_unavailable, meaning: Record explicit comparison failure.}
    - {name: checking_verdict_pass, meaning: Compare only the independently validated verdict with pass.}
    - {name: checking_verdict_warn, meaning: Compare only the independently validated verdict with warn.}
    - {name: composing_pass_response, meaning: Add advisory evidence to the fixed pass response.}
    - {name: composing_warn_response, meaning: Add advisory evidence to the fixed warn response.}
    - {name: composing_reject_response, meaning: Add advisory evidence to the fixed reject response.}
    - {name: composing_failed_response, meaning: Render a failure without a verdict.}
    - {name: passed, meaning: Terminal; completed response has verdict pass and no responsible stage.}
    - {name: warned, meaning: Terminal; completed response has verdict warn and no responsible stage.}
    - {name: rejected, meaning: Terminal; completed response has verdict reject and exactly one responsible stage.}
    - {name: failed, meaning: Terminal; no valid critic verdict is returned.}

  signal_classes:
    seed: [SeedRequest]
    generic_factory:
      - ToolDone
      - ToolFailed
      - LLMResponded
