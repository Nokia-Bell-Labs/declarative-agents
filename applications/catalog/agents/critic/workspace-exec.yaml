tools:
  - name: evaluate_candidate
    type: exec
    binary: go
    args: [test, ./...]
    visibility: internal
    emits: [ToolDone, ToolFailed, CommandError]
    description: Run the canonical changed-workspace Go oracle.
    category: boundary
    problem: The critic needs an application-neutral pass/fail boundary over an existing changed Go workspace.
    goals:
      - Evaluate the supplied workspace without copying it or launching a coding agent.
      - Preserve the oracle process result as ToolDone or ToolFailed.
    requirements:
      input:
        - must execute in the workspace supplied by the runtime directory binding
      output:
        - must emit ToolDone when all workspace tests pass
        - must emit ToolFailed when the tests reject the candidate
      side_effects:
        - must only perform the build artifacts ordinarily produced by go test
      undo:
        - must require no critic-owned compensation
      errors:
        - must emit CommandError when the Go tool cannot start
    non_goals:
      - Does not edit the candidate.
      - Does not launch another agent.
      - Does not infer the final verdict outside the critic machine.
    output:
      description: Raw output from the changed-workspace oracle.
      schema:
        type: string
    side_effects:
      - kind: child_process
        target: go_test
        state: read_only
        description: Runs the declared Go oracle in the supplied workspace.
    reversibility:
      classification: reversible
      undo: noop
      requires_confirmation: false
    undo:
      strategy: noop
      description: Oracle evaluation does not modify source files.
    errors:
      - signal: ToolFailed
        condition: the workspace oracle exits non-zero
        message_shape: <captured go test output>
        state_after_failure: candidate source remains unchanged
      - signal: CommandError
        condition: the Go tool cannot start
        message_shape: 'evaluate_candidate: <error>'
        state_after_failure: no verdict is written

  - name: emit_accepted_verdict
    type: exec
    binary: sh
    args:
      - -c
      - >-
        printf '%s\n'
        '{"schema_version":"1","mode":"changed-workspace","verdict":"accepted","accepted":true,"oracle":{"command":"go test ./...","status":"passed"}}'
        > critic-verdict.json
    visibility: internal
    emits: [ToolDone, ToolFailed, CommandError]
    description: Write the canonical accepting changed-workspace verdict.
    category: boundary
    problem: A successful critic terminal must expose a machine-readable verdict rather than requiring terminal-state inference.
    goals:
      - Record an explicit accepted verdict selected only by the oracle ToolDone signal.
      - Keep the verdict schema independent of any consuming application.
    requirements:
      input:
        - must run only on the Evaluating ToolDone branch
      output:
        - must write critic-verdict.json with verdict accepted and accepted true
      side_effects:
        - must overwrite only critic-verdict.json
      undo:
        - must restore or remove the prior verdict file with workspace restoration
      errors:
        - must emit ToolFailed or CommandError when the verdict cannot be written
    non_goals:
      - Does not choose the application terminal outcome.
      - Does not rerun the oracle.
    output:
      description: Empty output after the accepting verdict is written.
      schema:
        type: string
    side_effects:
      - kind: filesystem_write
        target: critic-verdict.json
        state: accepted
        description: Writes the canonical accepting verdict artifact.
    reversibility:
      classification: compensatable
      undo: verdict_file_compensation
      requires_confirmation: false
    undo:
      strategy: compensating_action
      description: Remove or restore the prior critic-verdict.json artifact.
      payload: boundary_compensation
      captures: [critic-verdict.json]
    errors:
      - signal: ToolFailed
        condition: the shell reports a verdict write failure
        message_shape: <captured shell output>
        state_after_failure: accepting terminal is not reached
      - signal: CommandError
        condition: the shell cannot start
        message_shape: 'emit_accepted_verdict: <error>'
        state_after_failure: accepting terminal is not reached

  - name: emit_rejected_verdict
    type: exec
    binary: sh
    args:
      - -c
      - >-
        printf '%s\n'
        '{"schema_version":"1","mode":"changed-workspace","verdict":"rejected","accepted":false,"oracle":{"command":"go test ./...","status":"failed"}}'
        > critic-verdict.json
    visibility: internal
    emits: [ToolDone, ToolFailed, CommandError]
    description: Write the canonical rejecting changed-workspace verdict.
    category: boundary
    problem: A completed critic run must distinguish oracle rejection from infrastructure failure and from acceptance.
    goals:
      - Record an explicit rejected verdict selected only by the oracle ToolFailed signal.
      - Keep the verdict schema independent of any consuming application.
    requirements:
      input:
        - must run only on the Evaluating ToolFailed branch
      output:
        - must write critic-verdict.json with verdict rejected and accepted false
      side_effects:
        - must overwrite only critic-verdict.json
      undo:
        - must restore or remove the prior verdict file with workspace restoration
      errors:
        - must emit ToolFailed or CommandError when the verdict cannot be written
    non_goals:
      - Does not choose the application terminal outcome.
      - Does not convert rejection into infrastructure failure.
    output:
      description: Empty output after the rejecting verdict is written.
      schema:
        type: string
    side_effects:
      - kind: filesystem_write
        target: critic-verdict.json
        state: rejected
        description: Writes the canonical rejecting verdict artifact.
    reversibility:
      classification: compensatable
      undo: verdict_file_compensation
      requires_confirmation: false
    undo:
      strategy: compensating_action
      description: Remove or restore the prior critic-verdict.json artifact.
      payload: boundary_compensation
      captures: [critic-verdict.json]
    errors:
      - signal: ToolFailed
        condition: the shell reports a verdict write failure
        message_shape: <captured shell output>
        state_after_failure: rejecting terminal is not reached
      - signal: CommandError
        condition: the shell cannot start
        message_shape: 'emit_rejected_verdict: <error>'
        state_after_failure: rejecting terminal is not reached
