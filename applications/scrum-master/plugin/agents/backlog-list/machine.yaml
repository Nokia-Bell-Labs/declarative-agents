name: backlog-list
purpose: |-
  List the planning hierarchy's documents (srd045): themes, initiatives,
  epics, features, and stories. Use when a model skill's steps list the
  backlog without a model.

  This machine has no model state: scrum-master backlog list (design.md
  D10, D14; GH-48). The run starts in a checkout of the program.
configuration:
  machine: plugin/agents/backlog-list/machine.yaml
  tools: plugin/agents/backlog-list/tools.yaml
invariants:
- Every step is a word; no model acts anywhere in this machine
- A refusal ends the run in the state that names it, with the word's reason
lifecycle: |-
  1. Idle → Word (Seed): scrum-master backlog list
  2. Word → Done (ToolDone)
initial_state: Idle
budget:
  command_timeout: 16m
  max_iterations: 10
states:
- name: Idle
  meaning: Initial state before the first word.
- name: Word
  meaning: |
    The backlog list word: scrum-master backlog list reads the hierarchy's
    documents.
- name: Done
  run_status: succeeded
  meaning: |
    Terminal. The word ran and reported what it did.
- name: Refused
  run_status: failed
  meaning: |
    Terminal. The word refused, and its reason is the run's last output.
- name: Failed
  run_status: failed
  meaning: Terminal. An infrastructure error outside the word's refusals.
terminal_states:
- Done
- Refused
- Failed
signals:
- name: Seed
  trigger: Loop initialization.
- name: ToolDone
  trigger: The word executed successfully.
- name: ToolFailed
  trigger: The word reported failure — a refusal with its reason.
- name: CommandError
  trigger: Infrastructure-level error (not a tool failure).
transitions:
- state: Idle
  signal: Seed
  next: Word
  action: backlog_list
  summary: true
- state: Word
  signal: ToolFailed
  next: Refused
- state: Word
  signal: ToolDone
  next: Done
- state: Idle
  signal: CommandError
  next: Failed
- state: Word
  signal: CommandError
  next: Failed
