# The rig-doctor's model binding. It declares invoke_llm directly rather than
# instantiating catalog-invoke-llm-model-fragment, because the diagnosis
# system prompt differs from the fragment's coding prompt.
unit: catalog-rig-doctor-llm-default
tools:
  - name: invoke_llm
    type: builtin
    init: invoke_llm
    visibility: internal
    signature:
      emits: [LLMResponded, ProviderUnavailable, ProviderThrottled, ProviderUnauthorized, CommandError]
    description: "Invoke the LLM with the current conversation history."
    category: boundary
    output:
      description: "Raw model response text."
      schema:
        type: string
    side_effects:
      - kind: external_api_call
        target: llm_provider
        description: "Sends the current prompt and tool manifest to the configured model provider."
      - kind: state_mutation
        target: conversation_history
        state: appended
        description: "Appends the model response to the in-memory conversation history."
    reversibility:
      classification: reversible
      requires_confirmation: false
    undo:
      strategy: conversation_truncate
      description: "Restore the conversation history checkpoint captured before invoking the model."
      requires: [conversation_checkpoint]
    errors:
      - signal: ProviderUnavailable
        condition: "the provider answered 5xx, refused the connection, or never answered"
        message_shape: "<provider> chat request failed: <error>"
        state_after_failure: "conversation history unchanged; the call may be worth repeating"
      - signal: ProviderThrottled
        condition: "the provider answered 429"
        message_shape: "<provider> <path> returned status 429 (ProviderThrottled): <body>"
        state_after_failure: "conversation history unchanged; the call may be worth repeating"
      - signal: ProviderUnauthorized
        condition: "the provider rejected the credential with 401 or 403"
        message_shape: "<provider> <path> returned status <status> (ProviderUnauthorized): <body>"
        state_after_failure: "conversation history unchanged; repeating the call cannot help"
      - signal: CommandError
        condition: "provider configuration is invalid, an error status is unmapped, or a response cannot be decoded"
        message_shape: "invoke_llm: <provider/model>: <error>"
        state_after_failure: "conversation history unchanged unless the provider response was already appended"
    config:
      # The dialect's failure taxonomy reaches the machine, so a provider that
      # is loading a model or rate limiting is retried while a rejected
      # credential is not (srd058 R2.4, srd023 R4.5).
      provider_failure_signals: true
      model: "qwen3.6:35b-mlx"
      dialect: /opt/providers/chat-dialect.yaml
      provider_url: "${OLLAMA_URL:-http://localhost:11434}"
      manifest_state: Composing
      response_profile: qwen
      system_prompt: |
        You diagnose one failed kind cluster scenario from a snapshot. The
        working directory is an evidence directory captured after the failure.
        You cannot reach the cluster: everything you know comes from these
        files and the captured trace spool tail.

        Read manifest.yaml first. It names every captured file, its kind
        (events, cluster-events, describe, pods, rollout, logs, traces,
        kind-logs), and every error the capture itself hit. Then read what the
        failure calls for: rollout counts to see which workload never became
        available, events for the reason it did not, and pod logs for what the
        container said. When a request path is in question, query_list_traces
        summarizes the captured spans and query_get_trace opens one trace by
        id; cite the trace id rather than a line for what they tell you.

        Write your diagnosis to diagnosis.yaml in the working directory, then
        call done. The file has this shape:

        probable_cause: one sentence naming what failed and why
        confidence: high, medium, or low
        findings:
          - claim: one statement the evidence supports
            evidence:
              - path: file this claim comes from
                line: line number in that file
        next_command: one read-only command that confirms or refutes the cause
        unresolved:
          - a question this evidence cannot answer

        Write a first diagnosis as soon as you can name a cause, then refine
        it as you read further. A run that dies against a busy model provider
        leaves whatever you have already written beside the evidence, which
        is worth more to the reader than nothing.

        When you call done, the diagnosis is read back and decoded. A file
        that is missing, that is not valid YAML, or that lacks a probable
        cause or findings comes back to you with the reason, and you fix it
        and call done again. Watch the indentation of the evidence entries:
        `line` aligns with the `path` above it, under one `-`.

        Cite a file and a line for every claim. A reader checks your citation
        before trusting the claim, so a cite that does not resolve is worse
        than no claim at all. Say low confidence and list what is missing
        rather than inventing a cause the evidence does not carry.

        Change nothing but diagnosis.yaml.
      max_time: 120
