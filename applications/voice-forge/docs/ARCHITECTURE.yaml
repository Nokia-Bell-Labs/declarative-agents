id: architecture-voice-forge
title: Voice Forge Architecture

overview:
  summary: |
    Voice Forge is a planned serial composition of six agent services on
    agent-core. The application-local programs are the workflow-orchestrator,
    structure-editor, voice-editor, style-editor, and voice-critic. A thin
    corpus-ingest wrapper references the canonical catalog program. Three
    planned RAG server instances provide read-only access to the structure,
    voice, and tightening corpora.

    The workflow orchestrator owns the saga workspace and the only GitHub
    mutation credentials. Editors return content and provenance without
    filesystem access. The critic independently evaluates the original and
    candidate and alone owns the consent-gated Pangram tool. Workproducts remain
    local and uncommitted until critic acceptance.
  status: documentation_only_planned
  scenario_flow: |
    ```mermaid
    flowchart LR
      H[Human intent and consent] --> O[Workflow orchestrator]
      GH[(GitHub source)] --> O
      O -->|00-original.md content| SE[Structure editor]
      SE -->|structure candidate bytes| O
      O --> VE[Voice editor]
      VE -->|voice candidate bytes| O
      O --> STE[Style editor]
      STE -->|style candidate bytes| O
      O --> VC[Voice critic]
      VC -->|hash-bound critique and verdict| O
      VC -. consent-gated .-> P[Pangram]
      SE --> SR[Structure RAG]
      VE --> VR[Voice RAG]
      STE --> TR[Tightening RAG]
      VC --> VR
      SR --> C[(Chroma)]
      VR --> C
      TR --> C
      CI[Corpus-ingest wrapper] --> C
      SE --> M[Ollama]
      VE --> M
      STE --> M
      VC --> M
      O --> W[(Persistent output workspace<br/>immutable attempts and manifest history)]
      O --> CP[(Agent-core checkpoint<br/>position and execution metadata)]
      O -->|after acceptance: fixed chain| W
      O -->|one forward publication| PUB[Git commit, push, and PR]
      PUB --> GH
    ```
  saga_flow: |
    The orchestrator captures the source and writes 00-original.md once. Each
    child receives exact parent bytes and returns bytes or a verdict plus
    provenance. The orchestrator writes every response to an immutable,
    content-addressed attempt path and persists append-only manifest history
    before invoking the next stage. A reject verdict names structure, voice, or
    style. Retry starts from that stage's last accepted parent, supersedes
    selections without deleting bytes, and replays every downstream stage.

    After pass or policy-permitted warn, finalization creates
    10-structure.md, 20-voice.md, 30-style.md, 40-critique.yaml, and final.md
    exactly once from the selected immutable lineage. Publication then advances
    one recorded key through create-or-reuse commit, push, and pull-request
    states. A partial publication resumes forward and never creates a
    replacement commit or destructively compensates a remote effect.

    srd004 specifies this as one flat planned machine. Every remote invocation
    has a durable intent, every accepted or rejected result has an immutable
    attempt or stage-run record plus an appended and projected manifest
    revision, and every publication identity is persisted before the next
    remote mutation. Structure rejection replays structure, voice, style, and
    critique from the original; voice rejection preserves structure and replays
    voice onward; style rejection preserves structure and voice and replays
    style and critique. Semantic findings follow the structure, voice, or style
    responsible stage selected by the critic; there is no semantic editor.

    The only path into finalization is a durable critic pass or
    policy-permitted warn. Recovery may resume there only after verifying the
    same accepted critic artifact and lineage. The orchestrator selects only
    srd003 orchestrator words and has no editing, retrieval, model, verdict, or
    Pangram word.

    Every orchestrator workproduct, hash, source, publication, and pull-request
    exec fixes one operation of a planned constrained non-shell orchestrator
    helper executable and emits only ToolDone, ToolFailed, or CommandError. The
    helper safely invokes operation-specific fixed git/gh argv where needed and
    emits one bounded JSON object on zero exit. Exec structured mode only wraps
    that raw helper JSON string with exit_code; it does not transform git, gh,
    or digest output into domain fields. A distinct parse_structured word
    selects the wrapper's nested output string and schema-validates the
    helper-produced JSON, then fixed value_predicate chains compare one scalar
    at a time and emit exactly two configured outcomes per comparison. Child
    invocations similarly retain
    execute_task's ExecutionDone, ExecutionFailed, and CommandError signals;
    a fixed compose word JSON-encodes each immediately previous child stdout
    under one field so parse_structured can select it by stable label, then the
    bounded response is parsed and routed. project_manifest only repairs or
    writes manifest.yaml and reports bounded manifest scalars.
    It does not emit saga routes. Explicit predicates over its parsed output
    route request mode, stage result, critic verdict and responsible stage,
    retries, recovery, publication progress, and terminal status.

    Every $from selector addresses an authored transition label through the
    receipt-blind command-state view. Producer output must carry recognized
    applied redaction metadata. Missing, unavailable, malformed, or wrong-type
    selector input emits CommandError; it never becomes a negative business
    comparison. The newest matching label wins before and after checkpoint
    rehydration.
  structure_editor_flow: |
    ```mermaid
    flowchart LR
      R[Original or retry-parent bytes] --> V[Validate request]
      V --> F[Formulate section or outline query]
      F --> E[Embed query]
      E --> Q[Query structure-rag]
      Q --> G{Grounded?}
      G -->|yes| X[Structure-only edit]
      G -->|no, refinement unused| F
      G -->|no, refinement used| I[Insufficient grounding]
      X --> C{Semantic constraints valid?}
      C -->|yes| S[Succeeded response]
      C -->|unchanged| N[No-op response]
      C -->|no| D[Failed response]
      I --> O[Return unchanged parent and provenance]
      S --> O
      N --> O
      D --> O
    ```

    srd005 specifies this as one flat request machine. The only cycle is one
    query refinement selected by a deterministic grounding signal at refinement
    count zero. The edit state has one incoming signal:
    StructureGroundingSufficient. Every successful response therefore follows
    request validation, deterministic query formulation, embedding, and a
    structure-rag result. Candidate validation preserves claims, citations,
    numbers, qualifications, required content, and non-connector diction.
  structure_retrieval_view: |
    structure-editor sends only a provider-produced embedding vector, configured
    result limit, query identity, trace identity, content hash, and refinement
    count to structure-rag. structure-rag reads one structure corpus and returns
    ranked section or outline records. Every record used by an edit carries
    source repository, path, commit, chunk ID, record type, distance, embedding
    model, query identity, and retrieval-attempt provenance.

    Complex grounding and preservation observations run through two fixed
    operations of one planned non-shell structure-editor helper. A fixed compose
    word renders a JSON envelope whose stdin field contains the bounded helper
    document from labeled validated state. Each exec selects that string through
    fixed $from(structure_grounding_input).stdin or
    $from(structure_constraint_input).stdin, applies a fixed byte limit, and uses
    output mode structured. After ToolDone, parse_structured selects the nested
    output string from the corresponding structured exec result. Flat chains of
    value_predicate words then compare one parsed scalar at a time; each emits
    exactly two configured outcomes or CommandError on a selector or coercion
    fault. One fixed compose word renders the edit context. Four separate compose
    words render succeeded, no-op, insufficient, and failed envelopes. Every
    compose word emits only its configured signal.

    The first deficient grounding report may carry one helper-computed, parsed
    refined query descriptor; the second deficient report returns unchanged
    parent content. Retrieval is read-only. Neither query text nor model output
    can select a corpus, endpoint, collection, model, path, ref, credential, or
    tool.
  voice_editor_flow: |
    ```mermaid
    flowchart LR
      R[Accepted structure bytes] --> V[Validate parent and passage map]
      V --> F[Formulate role and register query set]
      F --> E[Embed passage queries]
      E --> Q[Query voice-rag]
      Q --> A{Anchors sufficient?}
      A -->|yes| X[Voice-only passage rewrites]
      A -->|no, refinement unused| F
      A -->|no, refinement used| I[Insufficient anchors]
      X --> C{Preservation constraints valid?}
      C -->|retry available| X
      C -->|yes| P{Shared-phrasing risk clear?}
      C -->|no or exhausted| D[Failed response]
      P -->|retry available| X
      P -->|clear| S[Succeeded response]
      P -->|blocked or exhausted| D
      I --> O[Return accepted structure parent]
      S --> O
      D --> O
    ```

    srd006 specifies this as one flat request machine. The retrieval cycle has
    at most one deterministic refinement. Constraint or copy-risk failure may
    return to generation only while fewer than three total candidates have been
    generated. The initial rewrite state is reachable only after every eligible
    passage has sufficient rhetorical-role and register anchors. A successful
    response additionally requires deterministic organization, meaning,
    claim-strength, citation, number, terminology, adjacent-coherence, and
    voice-scope checks plus a clear suspicious-shared-phrasing report.
    Insufficient, blocked, exhausted, provider-failed, and budget-failed paths
    return the accepted structure parent unchanged.

    Complex anchor, preservation, and copy-risk observations run through three
    fixed operations of one planned non-shell helper over bounded JSON stdin.
    Each ToolDone stdout passes through its own parse_structured schema word.
    Flat chains of value_predicate words then compare one parsed scalar at a
    time; each emits exactly two configured outcomes plus CommandError. Three
    branch-specific compose words render initial, constraint-retry, and
    copy-risk-retry model contexts from fixed labels. Four separate compose
    words render succeeded, no-op, insufficient, and failed envelopes. Every
    compose word emits only its one configured signal.
  voice_passage_retrieval_view: |
    voice-editor deterministically forms one query for each voice-eligible
    passage from target voice, rhetorical role, target register, bounded passage
    features, and configured exemplar-role, tag, or stratum policy. It embeds
    the ordered query set and sends only provider-produced vectors, configured
    result limits, query identities, trace identity, and content hash to
    voice-rag. voice-rag reads one voice corpus and returns ranked passage groups
    without composing an answer.

    Every selected anchor carries source repository, path, commit, chunk and
    passage IDs, exemplar role, rhetorical role, register, voice tags, stratum,
    distance, embedding model, query identity, and retrieval attempt. Assessment
    reports selected anchors separately from the eligible pool and uses
    configured role, register, provenance, diversity, distance, count, and
    embedding predicates. Topic alone is not sufficient. One refined query may
    target deficient passages while retaining already accepted anchors.
    Retrieval is read-only, and neither request nor model output can select a
    corpus, endpoint, collection, model, path, ref, credential, or tool.
  style_editor_flow: |
    ```mermaid
    flowchart LR
      R[Accepted voice bytes] --> V[Validate parent and passage map]
      V --> I[Identify explicit target intents]
      I -->|none| N[No-op response]
      I --> F[Form target and intent queries]
      F --> E[Embed query set]
      E --> Q[Query tightening-rag]
      Q --> P{Applicable pairs complete?}
      P -->|no, refinement unused| F
      P -->|no, refinement used| U[Insufficient-pairs response]
      P -->|yes| X[Targeted style edit]
      X --> C{Preservation constraints valid?}
      C -->|yes| S[Succeeded response]
      C -->|unchanged| N
      C -->|retry available| X
      C -->|failed or exhausted| D[Failed response]
      N --> O[Return accepted voice parent]
      U --> O
      S --> O
      D --> O
    ```

    srd007 specifies this as one flat request machine. Intent, pair, and
    preservation observations use three fixed operations of one planned
    non-shell JSON-emitting style-editor helper. Each helper exec emits only
    ToolDone, ToolFailed, or CommandError. A distinct parse_structured word
    selects the nested structured-exec output string, and explicit
    value_predicate chains compare one scalar and emit two configured outcomes.
    Fixed compose words render helper input, initial and retry edit contexts,
    and separate terminal responses; each compose emits one configured signal.

    The initial edit context is reachable only after a parsed intent report
    identifies exact target spans and a parsed pair report establishes complete
    applicable pair coverage. Preservation retries retain the accepted voice
    parent, targets, intents, selected pairs, provenance, and thresholds and are
    bounded to three total candidates. All no-intent, insufficient, invalid,
    provider-failed, helper-failed, parse-failed, preservation-failed,
    infrastructure, and budget paths return the accepted voice parent unchanged
    after valid request admission.
  tightening_pair_retrieval_view: |
    style-editor deterministically forms one query for each explicit target and
    tightening intent, embeds the ordered query set, and sends only
    provider-produced vectors and configured bounded identities to
    tightening-rag. tightening-rag reads one tightening corpus and returns
    ranked before/after transformation pairs. The editor receives retrieved
    applicable pairs, not the full rule catalog.

    Every selected pair retains pair and rule IDs, source, repository, path,
    commit, chunk, instead and do hashes, distance, embedding model, query,
    target, and retrieval-attempt provenance. One refined query may address only
    deficient target-intent groups while retaining accepted pairs. Retrieval is
    read-only. Pair text supplies transformation shape, not facts, claims,
    citations, numbers, terminology, quotations, normative language, voice, or
    acceptance authority.

    The preservation helper verifies that every changed span maps to one stated
    target, explicit intent, and selected pair and that untargeted spans remain
    byte-identical. It also checks accepted voice, meaning, claim strength,
    qualifications, citations, numbers, terminology, quotations, normative
    language, protected spans, and unsupported additions before success.
  critic_assurance_flow: |
    ```mermaid
    flowchart LR
      R[Immutable original and style candidate<br/>bytes, identities, hashes] --> V[Validate request and consent scope]
      V --> Q[Compose critic-owned voice query]
      Q --> E[Embed query]
      E --> VR[Query voice-rag independently]
      VR --> C[Compose evaluation context<br/>no editor reasoning, no Pangram]
      C --> M[Evaluate six finding categories]
      M --> P[Parse structured model JSON]
      P --> H[Validate hashes, categories,<br/>verdict and responsible stage]
      H --> G{Exact-hash consent granted?}
      G -->|no| U[Explicit advisory unavailable status]
      G -->|yes| O[Submit and poll original task]
      O --> A[Submit and poll candidate task]
      A --> D[Compare advisory results]
      U --> D
      D --> B{Route independently validated verdict}
      B -->|pass| PS[Fixed pass response]
      B -->|warn| WS[Fixed warn response]
      B -->|reject| RS[Fixed reject response<br/>one structure, voice, or style stage]
    ```

    srd008 specifies one flat critic request machine. The critic receives exact
    original and selected style-candidate bytes and hashes, target voice,
    bounded policy, and an exact-hash consent record. It receives no editor
    prompt, reasoning, conversation, confidence, rejected alternative, or
    verdict recommendation. It formulates its own query and reads only
    voice-rag. Its model context contains neither editor reasoning nor Pangram
    output.

    The raw model response emits only LLMResponded or CommandError. A distinct
    parse_structured word validates its JSON. A fixed operation of a planned
    non-shell critic helper then checks both hashes, all six findings, verdict
    cardinality, responsible-stage cardinality, and feedback bounds. Another
    parser admits the helper JSON, and explicit one-scalar predicates route the
    validated result. Pass and warn carry no responsible stage. Reject carries
    exactly one of structure, voice, or style.
  pangram_advisory_view: |
    Pangram submission is dominated by a helper-derived consent status that
    binds affirmative, unexpired consent to both exact supplied hashes and the
    configured disclosure identity. API-key presence is not consent. Denied,
    absent, expired, malformed, or hash-mismatched consent reaches no upload
    word and produces explicit advisory status.

    The critic uses four configured rest_client_invoke words: POST /task and
    GET /task/{task_id} for the original, then separate POST and GET operations
    for the candidate. REST emits only configured HTTP status-mapping signals
    or CommandError. Because Pangram returns pending, STAGE_FAILED, and
    STAGE_SUCCESS bodies under HTTP 200, REST does not invent task-stage
    outcomes. A fixed helper interprets each mapped poll body, parse_structured
    validates its bounded JSON, and one-scalar predicates route completed,
    pending, or failed. Each poll loop is bounded.

    Comparison retains separate scan statuses, document fractions
    fraction_ai, fraction_ai_assisted, and fraction_human, segment counts, and
    available paragraph-window evidence. It does not create one AI score.
    Independent evaluation and validation finish before consent is checked.
    Final verdict predicates select only the independent validation report;
    Pangram evidence is attached after the verdict branch. Denial,
    unavailability, insufficient credits, rate limit, malformed output,
    STAGE_FAILED, or timeout remains explicit and never silently accepts.
    Uploads are irreversible observations and are never falsely compensated.
  persistence_flow: |
    Voice Forge has two durable state planes with different authority. The
    application-owned persistent --output workspace stores document bytes,
    immutable attempt artifacts, finalized files, manifest history, and the
    current manifest projection. Agent-core checkpoint storage holds machine
    Position, Execution metadata, conversation, artifact references and hashes,
    and opaque tool receipts. It does not own document bytes.

    On restart the orchestrator validates and repairs the manifest projection
    from immutable history, verifies referenced file hashes, and then compares
    the checkpoint. If the manifest is newer, its durable accepted transition
    wins. If the checkpoint is newer, unmanifested work is unaccepted and the
    orchestrator resumes from the last manifest-selected parent with the
    recorded idempotency key. Dolt Revert changes DB-persisted runtime state
    only; it never deletes or restores saga files.

interfaces:
  - name: human request and policy boundary
    status: planned
    summary: |
      A human supplies the allowlisted repository, source path and revision,
      target voice, retry policy, publication destination, and explicit Pangram
      upload consent. Humans retain intent, policy, privacy, exception, and
      accountability authority.
  - name: child-agent request boundaries
    status: planned
    summary: |
      The orchestrator invokes each editor and critic through declared
      agent-core service/child tools. Requests carry content, saga identity,
      stage, attempt, and bounded policy. Responses carry content or verdict
      plus provenance. They do not grant a shared filesystem.
  - name: workproduct boundary tools
    status: planned
    summary: |
      Orchestrator-only words validate requests, read and hash workproducts,
      write the immutable original and attempts, append and project the
      manifest, and materialize the final chain. Constrained exec declarations
      use fixed operations of a profile-owned non-shell orchestrator helper (or
      a separately fixed workproduct helper) to satisfy srd002 atomic write and
      fsync behavior without a new Go builtin. The helper itself emits bounded
      JSON stdout; exec structured mode merely wraps it. Every result then uses
      an explicit schema parser and one-scalar predicates where more than one
      business outcome exists. Paths derive from trusted saga state; model and
      child output never supplies them.
  - name: retrieval REST boundary
    status: planned
    summary: |
      Each editor owns one configured embedding word and one read-only query
      word for its corpus-scoped RAG instance. The critic owns a separate
      embedding word and read-only voice-rag query. Embedding responses, not
      model text, supply vectors through validated command-state selectors.
  - name: model boundary
    status: planned
    summary: |
      Editor and critic model words call allowlisted Ollama endpoints. Models
      receive bounded content and evidence; they do not author URLs, paths,
      refs, vectors, credentials, or tool authority.
  - name: GitHub source and publication boundary
    status: planned
    summary: |
      Constrained source and publication exec words are available only to the
      orchestrator. Each fixes one operation of the planned non-shell
      orchestrator helper. The helper constructs only that operation's fixed
      git/gh subcommand and flags, parses raw CLI output internally, validates
      identities, and emits bounded JSON.
      Distinct source resolve, fetch, blob read, publication check, branch,
      stage, commit, push, pull-request find/create, and verification words
      consume only validated human intent, configuration, and manifest state.
      Exec emits only generic outcomes; operation-specific parsers and
      scalar predicates distinguish absent, matching, created, reused,
      verified, and conflicting identities. No parser consumes raw git/gh
      output. Force push, arbitrary shell, runtime binaries or helper
      operations, URLs, refspec shapes, credentials, and command strings are
      outside the interface.
  - name: Pangram privacy boundary
    status: planned
    summary: |
      Pangram is an external, non-compensatable upload available only to the
      voice critic. Separate original and candidate scans require affirmative
      consent, bounded credentials and timeouts, and recorded request status.
      Results are advisory evidence.
  - name: canonical corpus-ingest boundary
    status: planned
    summary: |
      The local wrapper lists and reads only configured filesystem resources,
      then invokes the canonical applications/catalog corpus-ingest profile
      through the existing profile-only child factory. Corpus roots, endpoint,
      model, and collection remain trusted configuration. The catalog retains
      behavior ownership.

tool_authority_allocation:
  status: specified_contract_runtime_planned
  authority: docs/specs/software-requirements/srd003-writing-agent-tools.yaml
  allocations:
    - owner: workflow-orchestrator
      exclusive_words:
        - validate_saga_request
        - read_workproduct
        - hash_workproduct
        - write_original
        - write_attempt
        - append_manifest_revision
        - project_manifest
        - materialize_final_chain
        - invoke_structure_editor
        - invoke_voice_editor
        - invoke_style_editor
        - invoke_voice_critic
        - git_resolve_source_revision
        - git_fetch_source
        - git_read_source_blob
        - git_check_publication
        - git_create_publication_branch
        - git_stage_final_chain
        - git_commit_final_chain
        - git_push_publication
        - gh_find_pull_request
        - gh_create_pull_request
        - gh_verify_pull_request
        - suspend_saga_for_operator
        - inspect_saga_checkpoint
        - rollback_saga_checkpoint
        - exit_voice_forge_run
        - orchestrator parse_structured result words
        - orchestrator one-scalar value_predicate route words
      denied: [editor RAG, editor LLM, critic verdict, Pangram, corpus writes]
    - owner: structure-editor
      exclusive_words:
        - validate_structure_request
        - formulate_structure_query
        - embed_structure_query
        - query_structure_rag
        - compose_structure_grounding_input
        - inspect_structure_grounding
        - parse_structure_grounding_report
        - structure_grounding_sufficient
        - structure_grounding_refinement_available
        - compose_structure_edit_context
        - generate_structure_edit
        - compose_structure_constraint_input
        - inspect_structure_constraints
        - parse_structure_constraint_report
        - structure_candidate_is_no_op
        - structure_constraints_hold
        - compose_structure_success_response
        - compose_structure_no_op_response
        - compose_structure_insufficient_response
        - compose_structure_failed_response
      denied: [saga filesystem, other corpora, voice or style editing, critic or acceptance verdict, Pangram, GitHub]
    - owner: voice-editor
      exclusive_words:
        - validate_voice_request
        - formulate_voice_query
        - embed_voice_query
        - query_voice_rag
        - inspect_voice_anchors
        - parse_voice_anchor_report
        - voice_anchors_complete
        - voice_anchor_refinement_available
        - compose_voice_initial_rewrite_context
        - compose_voice_constraint_retry_context
        - compose_voice_copy_retry_context
        - generate_voice_edit
        - inspect_voice_constraints
        - parse_voice_constraint_report
        - voice_candidate_is_no_op
        - voice_constraints_hold
        - voice_constraint_retry_available
        - inspect_voice_copy_risk
        - parse_voice_copy_risk_report
        - voice_copy_risk_clear
        - voice_copy_retry_available
        - compose_voice_success_response
        - compose_voice_no_op_response
        - compose_voice_insufficient_response
        - compose_voice_failed_response
      denied: [saga filesystem, other corpora, structure changes, tightening beyond voice need, verdict, Pangram, GitHub]
    - owner: style-editor
      exclusive_words:
        - validate_style_request
        - compose_style_intent_input
        - identify_style_intents
        - parse_style_intent_report
        - style_intents_present
        - formulate_tightening_query
        - embed_tightening_query
        - query_tightening_rag
        - compose_style_pair_input
        - assess_style_pairs
        - parse_style_pair_report
        - style_pairs_complete
        - style_pair_refinement_available
        - compose_style_initial_edit_context
        - compose_style_retry_context
        - generate_style_edit
        - compose_style_constraint_input
        - inspect_style_constraints
        - parse_style_constraint_report
        - style_candidate_is_no_op
        - style_constraints_hold
        - style_retry_available
        - compose_style_success_response
        - compose_style_no_intent_response
        - compose_style_no_op_response
        - compose_style_insufficient_response
        - compose_style_failed_response
      denied: [saga filesystem, other corpora, structure, voice, critic or acceptance verdict, Pangram, GitHub]
    - owner: voice-critic
      exclusive_words:
        - validate_critic_request
        - parse_critic_request_report
        - critic_request_is_valid
        - compose_critic_voice_query
        - embed_critic_voice_query
        - query_critic_voice_rag
        - compose_critic_evaluation_context
        - evaluate_voice_candidate
        - parse_critic_evaluation
        - compose_critic_validation_input
        - validate_critic_evaluation
        - parse_critic_validation_report
        - critic_evaluation_is_valid
        - check_pangram_consent
        - Pangram request, submit, poll, observation, comparison, and scalar-route words
        - fixed critic response composers
      denied: [content edit or replacement prose, editor reasoning, saga filesystem, workproducts, corpus writes, GitHub]
    - owner: corpus-ingest
      exclusive_words: [list_declared_corpus, read_declared_corpus_document, invoke_canonical_corpus_ingest]
      denied: [writing saga, editing, verdict, Pangram, GitHub]
  closure_rules:
    - Profiles select only their allocated words and shared deterministic parse/compose words.
    - No profile exposes generic shell, executable, REST URL, filesystem mutation, git, or gh words.
    - Child requests carry bytes and identities, not workspace paths.
    - LLM schemas exclude URLs, paths, refs, vectors, credentials, model and collection identities, and tool names.

components:
  - name: workflow-orchestrator agent service
    path: agents/workflow-orchestrator/
    status: planned
    role_realization: Executor / Workflow Orchestrator
    lifecycle: Long-running request service with persistent per-saga state.
    scaling_boundary: A saga has one writer; distinct saga IDs may be scheduled independently.
    failure_boundary: Child, local persistence, and publication failures terminate or retry without changing accepted parents.
    authority: |
      Own the saga directory, manifest, workproduct writes, stage sequencing,
      retry budgets, finalization, and constrained git/gh mutation.
    prohibited_authority: Editing, retrieval, critic verdicts, corpus writes, and Pangram invocation.
  - name: workflow-orchestrator constrained helper
    path: agents/workflow-orchestrator/ planned executable
    status: planned
    role_realization: Fixed non-shell JSON-emitting boundary adapter.
    lifecycle: Spawned only through operation-specific exec ToolDefs.
    scaling_boundary: One invocation performs one fixed workproduct, hash, source, publication, or pull-request operation.
    failure_boundary: Nonzero exit becomes ToolFailed or CommandError; malformed or truncated zero-exit JSON fails the following parser closed.
    authority: May execute only declaration-selected fixed operations and their compiled/configured git/gh argv shapes.
    prohibited_authority: Shell evaluation, arbitrary command or argv, runtime binary/subcommand/URL/refspec/credential selection, editing, retrieval, model invocation, verdicts, and Pangram.
  - name: structure-editor agent service
    path: agents/structure-editor/
    status: planned
    role_realization: Executor / Change Manager for the document-structure domain.
    lifecycle: Request/on-demand application-local machine.
    scaling_boundary: Stateless requests may scale independently after serial saga ordering is preserved.
    failure_boundary: A failed response leaves the original or last accepted parent unchanged.
    authority: Read section and outline evidence through structure RAG, invoke two fixed operations of a planned non-shell helper over bounded JSON, restructure supplied content with bounded model calls, and return provenance and preservation evidence.
    prohibited_authority: Voice or style editing, Chroma writes, workproduct mutation, critic or acceptance verdicts, Pangram, and GitHub mutation.
  - name: voice-editor agent service
    path: agents/voice-editor/
    status: planned
    role_realization: Executor / Change Manager for the document-voice domain.
    lifecycle: Request/on-demand application-local machine.
    scaling_boundary: Stateless requests and retrieval load may scale independently.
    failure_boundary: Retrieval, model, preservation, copy-risk, or budget failure returns the accepted structure parent unchanged and no accepted artifact.
    authority: Read rhetorical-role and register passages through voice RAG, rewrite supplied passages for voice only, invoke three fixed operations of a planned non-shell helper over bounded JSON, and return content, anchor provenance, copy-risk findings, constraint evidence, and stage metadata.
    prohibited_authority: Chroma writes, workproduct mutation, style tightening beyond voice need, verdicts, Pangram, and GitHub.
  - name: style-editor agent service
    path: agents/style-editor/
    status: planned
    role_realization: Executor / Change Manager for the document-tightening domain.
    lifecycle: Request/on-demand application-local machine.
    scaling_boundary: Stateless requests and retrieval load may scale independently.
    failure_boundary: Intent, retrieval, model, preservation, or budget failure returns the accepted voice parent unchanged and no accepted artifact.
    authority: Identify exact tightening targets through a fixed helper, read applicable before/after pairs through tightening RAG, edit only stated spans with bounded model calls, validate with a fixed helper, and return content with complete pair provenance.
    prohibited_authority: Structure or voice change, Chroma writes, workproduct mutation, critic or acceptance verdicts, Pangram, and GitHub.
  - name: voice-critic agent service
    path: agents/voice-critic/
    status: planned
    role_realization: Critic / Output Evaluator
    lifecycle: Request/on-demand application-local machine, isolated from editor reasoning.
    scaling_boundary: Evaluations may scale independently while one verdict is bound to one saga attempt.
    failure_boundary: Evaluation or Pangram failure cannot publish or silently become acceptance.
    authority: |
      Read supplied immutable original and candidate bytes and hashes, query
      voice evidence independently, validate all six finding categories,
      invoke exact-hash consent-gated separate Pangram tasks, compare advisory
      evidence, and return pass, warn, or reject. Every reject names exactly
      one structure, voice, or style stage.
    prohibited_authority: Editor reasoning, content edits or replacement prose, saga/workproduct mutation, corpus writes, and GitHub mutation.
  - name: corpus-ingest agent service
    path: agents/corpus-ingest/
    status: planned
    role_realization: Inherited Knowledge Manager / Ontology Manager from the canonical catalog profile.
    lifecycle: On-demand administrative run, separate from editing sagas.
    scaling_boundary: Collection-scoped runs serialize writes to one declared collection.
    failure_boundary: Ingest failure affects a rebuildable index, not source corpora or saga workproducts.
    authority: Read trusted corpus paths and write only declared Chroma collections.
    prohibited_authority: Saga coordination, workproduct access, editing, criticism, Pangram, and GitHub publication.
  - name: RAG server instances
    path: planned structure, voice, and tightening supporting services
    status: planned
    role_realization: Knowledge Manager / Recommendation Generator
    lifecycle: Long-running read-only supporting agent services, each bound to one declared corpus.
    scaling_boundary: Query serving may scale separately from ingestion and editors.
    failure_boundary: Unavailability fails or degrades a bounded stage according to its SRD; it cannot alter accepted artifacts.
    authority: Query each instance's declared Chroma corpus and return sections, passages, pairs, and source metadata.
    prohibited_authority: Cross-corpus routing, collection writes, editing, saga state, Pangram, and publication.
  - name: Chroma
    path: external supporting datastore
    status: planned
    lifecycle: Long-running external dependency.
    authority: Store rebuildable embeddings and retrieval metadata for declared collections.
    prohibited_authority: Source-of-truth content, saga persistence, verdicts, and publication.
  - name: Ollama
    path: external model service
    status: planned
    lifecycle: Long-running external dependency.
    authority: Run allowlisted embedding and generation models for bounded requests.
    prohibited_authority: Tool selection, path/ref/credential creation, workproduct mutation, and publication.
  - name: GitHub
    path: external source and publication platform
    status: planned
    lifecycle: External dependency reached through fixed orchestrator-helper operations behind constrained exec words.
    authority: Host source revisions, accepted commits, branches, and pull requests.
    prohibited_authority: Intermediate saga storage and critic acceptance.
  - name: Pangram
    path: external advisory analysis service
    status: planned
    lifecycle: Optional external dependency reached only by the critic.
    authority: Analyze consented original and candidate uploads and return advisory results.
    prohibited_authority: Acceptance, content edits, saga mutation, and GitHub mutation.

design_decisions:
  - id: 1
    title: Serial specialists have separate authority
    decision: |
      Structure, voice, style, and critique remain separate request services.
      Their distinct evidence, retry, privacy, and acceptance boundaries justify
      the additional actors. Release 00.0 processes one document serially.
    benefits:
      - Rejections identify a responsible stage.
      - Editors cannot approve their own work.
      - Pangram and publication credentials remain narrowly allocated.
  - id: 2
    title: The orchestrator owns immutable saga state
    decision: |
      Child services exchange content, not filesystem paths. The orchestrator
      is the single writer for workproducts/<saga-id>/. It stores each child
      output at an immutable content-addressed attempt path and persists an
      append-only manifest revision after every result and state transition.
      Fixed stage filenames are materialized exactly once only after critic
      acceptance. Compensation supersedes selections and never deletes or
      rewrites prior bytes.
    benefits:
      - Restarts can resume from durable accepted state.
      - Failed attempts cannot overwrite the original or accepted parent.
      - Publication idempotency has one owner.
  - id: 3
    title: Retrieval indexes are rebuildable
    decision: |
      Trusted corpora remain authoritative. Canonical corpus-ingest populates
      application-declared Chroma collections, and one corpus-scoped RAG
      instance reads each structure, voice, or tightening collection.
    benefits:
      - Ingest and query authority remain separate.
      - Index loss does not destroy source material.
      - Existing catalog behavior is reused by reference.
  - id: 4
    title: Acceptance precedes publication
    decision: |
      All stage artifacts stay local and uncommitted until the independent
      critic returns an accepted verdict under human policy. The orchestrator
      then publishes the complete workproduct chain in one commit.
    benefits:
      - Remote history contains only a complete accepted saga.
      - Intermediate attempts remain auditable without remote publication.
      - Partial publication has an explicit escalation boundary.
  - id: 5
    title: Shared contracts remain external authorities
    decision: |
      Local SRDs define business behavior and stricter authority. They cite
      shared application and agent-core requirement IDs for module governance,
      services, profiles, machines, tools, lifecycle, persistence, and REST.
    benefits:
      - Platform requirements retain one owner.
      - The local corpus stays focused on Voice Forge behavior.
  - id: 6
    title: Runtime checkpoints and artifact bytes are separate state planes
    decision: |
      Agent-core checkpoint Position and Execution persist orchestration state,
      execution metadata, references, and opaque receipts. The persistent
      --output workspace persists document and manifest bytes. Recovery
      reconciles their ordering window against append-only manifest history;
      checkpoint or Dolt rollback never acts as filesystem compensation.
    benefits:
      - Document recovery does not depend on checkpoint branch retention.
      - A crash between manifest and checkpoint writes has a deterministic rule.
      - Application lineage does not leak into command-state output or receipts.

technology_choices:
  - component: Structured documentation
    technology: YAML under docs/
    purpose: Keep the planned corpus parseable and traceable under design D1-D5.
  - component: Agent programs
    technology: Planned YAML profiles and machines on agent-core
    purpose: Express the five application-local workflows without new binaries.
  - component: Retrieval
    technology: Planned corpus-scoped RAG server instances over Chroma
    purpose: Serve read-only structure, voice, and tightening evidence from separate rebuildable indexes.
  - component: Corpus loading
    technology: Planned wrapper around applications/catalog corpus-ingest
    purpose: Reuse canonical ingestion while retaining local parameters.
  - component: Models
    technology: Planned Ollama endpoints
    purpose: Supply allowlisted embedding and generation models.
  - component: Source and publication
    technology: Planned constrained non-shell orchestrator helper behind fixed exec ToolDefs, internally using fixed git and GitHub CLI argv
    purpose: Emit bounded JSON while capturing an immutable source and publishing once after acceptance.
  - component: Advisory voice analysis
    technology: Planned consent-gated Pangram calls
    purpose: Add external before/after evidence without transferring verdict authority.
  - component: Saga persistence
    technology: Planned persistent local --output workspace plus referenced agent-core checkpoint state
    purpose: Preserve application bytes in append-only manifest lineage while checkpointing only runtime position and execution metadata.

