# The creator serving lifecycle and its monitor pair. The four lifecycle words
# arrive from the agent-core fragment under this agent's own names, and the
# monitor pair is the agent-core unit every such agent imports; nothing about
# either is written out here.
unit: mesh-creator-declarations
imports:
  - /opt/agent-core/tools/units/monitor-rest-declarations.yaml
instantiate:
  - fragment: /opt/agent-core/tools/units/serve-lifecycle-declarations-fragment.yaml
    args:
      agent: "creator"
      launch_requests: launch_creator_requests
      launch_control: launch_creator_control
      await_control: await_creator_control
      stop_requests: stop_creator_requests
      requests_rest_ref: creator_instance
      control_rest_ref: creator_control
      requests_noun: instance
      requests_purpose: for instance operations
tools:
