# =============================================================================
# language.yaml
# Application DSL Specification — normative statements
# =============================================================================
#
# WHAT THIS FILE IS
# -----------------
# This is the machine-readable companion to the prose chapters in this
# directory. Every requirement the specification makes is a statement here,
# and nothing normative exists only in prose. The chapters cite statements
# with `{{statement <id>}}` placeholders; the render target expands each
# citation in place with a stable anchor, and the audit target fails when a
# citation does not resolve, when a statement is never cited, or when a
# statement's acceptance evidence is missing or failing.
#
# HOW TO READ EACH STATEMENT
# --------------------------
#   id          stable identifier, R-<CHAPTER TAG>-<NNN>. Identifiers are
#               never renumbered or reused; constitutions, tests, and commits
#               cite them.
#   target      which conformance target the statement binds — one of the
#               names under language.conformance_targets (chapter 01).
#   level       RFC 2119 requirement level: MUST, MUST NOT, SHOULD,
#               SHOULD NOT, or MAY.
#   statement   the normative text itself.
#   acceptance  at least one evidence entry proving the statement is checked:
#                 assertion: fixture   a specification under fixtures/ with the
#                                      named check applied and an expected
#                                      verdict (valid or invalid)
#                 assertion: go_test   a named Go test that must exist and
#                                      pass, path relative to this directory
#                 assertion: rig       a named Go test in the wider repository
#                                      (path relative to the repository root)
#                                      anchoring a runtime or population
#                                      statement; the audit verifies the
#                                      reference resolves to a declared test,
#                                      and the repository's test and
#                                      integration gates execute it
#                 assertion: pending   evidence the statement lacks; `note`
#                                      names what is missing. A pending entry
#                                      is a known gap, not a check
#   status      absent for a statement in force; `retired` for one the
#               language no longer makes. A retired statement keeps its id and
#               text, and `retired` names the release and the statements that
#               replace it, if any. Its acceptance stays as the record of what
#               was checked.
#
# Test paths (rig and go_test assertions) are relative to the repository
# root.
#
language:
  id: application-dsl
  title: "A Domain-Specific Language for Agents"
  version: 2.0.0
  conformance_targets:
    - specification
    - processor
    - runtime
    - population

statements:
  - id: R-INTRO-001
    target: specification
    level: MUST
    statement: >-
      A conforming specification MUST be a single YAML document whose root node is
      a mapping.
    acceptance:
      - assertion: fixture
        path: fixtures/specification/root-mapping/valid.yaml
        check: yaml_mapping
        verdict: valid
      - assertion: fixture
        path: fixtures/specification/root-mapping/invalid.yaml
        check: yaml_mapping
        verdict: invalid

  - id: R-INTRO-002
    target: processor
    level: MUST
    statement: >-
      A conforming processor MUST reject a specification whose root node is not a
      mapping.
    acceptance:
      - assertion: pending
        note: >-
          No test in this repository anchors this statement; the engine in
          this repository implements the 1.0 language.

  - id: R-INTRO-003
    target: specification
    level: MUST
    statement: >-
      A conforming specification MUST declare the `kind` keyname, naming
      which document of the language it is, and the `schema_version`
      keyname, whose value is 1 for every kind. The kinds are
      `application-profile`, `agent-profile`, `machine`, `tool-selection`,
      `tool-declaration`, `rest-definition`, `llm-configuration`, and
      `channel-schema`. `machine-profile`, `stage-fragment`, and
      `machine-template` are the deprecated predecessors of `machine`.
    acceptance:
      - assertion: fixture
        path: fixtures/specification/document-kind/valid.yaml
        check: document_kind_header
        verdict: valid
      - assertion: fixture
        path: fixtures/specification/document-kind/missing-kind.yaml
        check: document_kind_header
        verdict: invalid
      - assertion: fixture
        path: fixtures/specification/document-kind/unknown-kind.yaml
        check: document_kind_header
        verdict: invalid
      - assertion: fixture
        path: fixtures/specification/document-kind/wrong-version.yaml
        check: document_kind_header
        verdict: invalid

  - id: R-INTRO-004
    target: processor
    level: MUST
    statement: >-
      A conforming processor MUST hold each specification to the kinds its
      position accepts, reading `kind` and `schema_version` before the body:
      an application-profile found by discovery declares
      `application-profile`; an agent-profile, `agent-profile`; the machine
      an agent-profile names and each `compose` template, `machine`; a tool
      selection, `tool-selection`; a declaration unit, import, or fragment,
      `tool-declaration`; a REST definition, `rest-definition`; a model
      dialect, `llm-configuration`; and a channel's schema,
      `channel-schema`. It MUST refuse a declared kind outside what the
      position accepts, naming the file, the declared kind, and the
      expected kinds; a kind outside the language; and a `schema_version`
      other than 1. It MAY load a specification that declares no `kind`,
      writing one warning that names the file and the kind it should
      declare, and MAY load a deprecated machine kind the same way.
    acceptance:
      - assertion: pending
        note: >-
          No test in this repository anchors this statement; the engine in
          this repository implements the 1.0 language.

  - id: R-INTRO-005
    target: specification
    level: MUST NOT
    statement: >-
      A conforming specification MUST NOT contain a YAML anchor, alias, or
      merge key. A specification reuses structure only through the
      language's declared forms, composition, fragments, and imports, which
      provenance, the expansion record, and the reuse statistics see. A
      conforming processor MUST refuse such a specification, naming the
      file and each construct by line.
    acceptance:
      - assertion: fixture
        path: fixtures/specification/yaml-purity/valid.yaml
        check: yaml_purity
        verdict: valid
      - assertion: fixture
        path: fixtures/specification/yaml-purity/anchors.yaml
        check: yaml_purity
        verdict: invalid
      - assertion: pending
        note: >-
          No test in this repository anchors this statement; the engine in
          this repository implements the 1.0 language.

  - id: R-MODEL-001
    target: specification
    level: MUST
    statement: >-
      A machine specification MUST either declare both `states` and
      `transitions`, or declare neither and carry exactly one `compose`
      entry, without `enter`, whose template it adopts whole.
    acceptance:
      - assertion: fixture
        path: fixtures/specification/machine-composition/body.yaml
        check: machine_body_or_adoption
        verdict: valid
      - assertion: fixture
        path: fixtures/specification/machine-composition/adoption.yaml
        check: machine_body_or_adoption
        verdict: valid
      - assertion: fixture
        path: fixtures/specification/machine-composition/no-body-no-compose.yaml
        check: machine_body_or_adoption
        verdict: invalid
      - assertion: fixture
        path: fixtures/specification/machine-composition/adoption-beside-another.yaml
        check: machine_body_or_adoption
        verdict: invalid
      - assertion: pending
        note: >-
          No test in this repository anchors this statement; the engine in
          this repository implements the 1.0 language.

  - id: R-LCM-001
    target: runtime
    level: MUST
    statement: >-
      A conforming runtime MUST bind an agent-instance to exactly one
      workspace at instantiation and MUST release the binding when the
      agent-instance terminates.
    acceptance:
      - assertion: rig
        path: applications/coding-agent/magefiles/integration_coding_loop_test.go
        test: TestFreshWorkspaceIsPortableAndIsolated

  - id: R-LCM-002
    target: runtime
    level: MUST
    statement: >-
      Terminating an agent-instance MUST NOT decommission its workspace; a
      later agent-instance MAY bind the same workspace and resume its
      identity.
    acceptance:
      - assertion: pending
        note: >-
          No test in this repository anchors this statement; the engine in
          this repository implements the 1.0 language.
      - assertion: rig
        path: agent-core/cmd/agent/run_identity_test.go
        test: TestResolveRunIDFreshRunsDifferAndResumeRetainsID

  - id: R-POP-001
    target: population
    level: MUST
    statement: >-
      Every agent-instance in a conforming population MUST realize an
      agent-profile that a governing application-profile names among its
      agent services.
    acceptance:
      - assertion: rig
        path: applications/chatbot-mesh/magefiles/application_manifest_test.go
        test: TestApplicationManifestDeclaresExactProductionRoots

  - id: R-POP-002
    target: population
    level: MUST
    statement: >-
      In a conforming population, a deployment authority MUST rest with
      exactly one agent-profile's instances, and an agent-instance that
      decides operations MUST NOT hold the deployment authority those
      operations act through. No processor checks this statement: the
      language declares no authority a processor could compare across an
      application, so it binds the population as deployed. Its evidence is
      one test over one application, the chatbot mesh, which finds that no
      agent service selects an exec tool whose binary is `helm` or
      `kubectl`, or a shell whose arguments name either. That shows no
      agent of that mesh holds the deployment authority by those binaries;
      it does not show that exactly one profile's instances hold it.
    acceptance:
      - assertion: pending
        note: >-
          No test in this repository anchors this statement; the engine in
          this repository implements the 1.0 language.
      - assertion: pending
        note: >-
          No processor check, and no declared authority field on a tool or
          profile for one to read; nothing shows that exactly one profile's
          instances hold a deployment authority, in this mesh or any other
          application.

  - id: R-POP-003
    target: population
    level: MUST
    statement: >-
      A workspace MUST be bound by at most one agent-instance at any time.
    acceptance:
      - assertion: rig
        path: applications/coding-agent/magefiles/integration_coding_loop_test.go
        test: TestFreshWorkspaceIsPortableAndIsolated

  - id: R-POP-004
    target: population
    level: MAY
    statement: >-
      A conforming population MAY contain orphan workspaces; a workspace with
      no bound agent-instance is a legal state that only an explicit
      decommission removes.
    acceptance:
      - assertion: rig
        path: applications/coding-agent/magefiles/integration_coding_loop_test.go
        test: TestFreshWorkspaceIsPortableAndIsolated

  - id: R-APP-001
    target: specification
    level: MUST
    statement: >-
      An application-profile specification MUST carry the `schema_version`,
      `application`, and `services` keynames, and every `services` entry,
      one agent service, MUST carry `id`, `ownership`, and `source`. The
      application-level `ownership`, `module_status`, `capabilities`, and
      `runtime`, and a service's `runtime_path`, are governance and
      deployment binding a repository MAY keep and the language does not
      require. `roots` is the older spelling of
      `services`: a conforming processor MAY accept it with a warning, and
      a specification MUST NOT declare both.
    acceptance:
      - assertion: fixture
        path: fixtures/specification/application-keynames/valid.yaml
        check: application_required_keynames
        verdict: valid
      - assertion: fixture
        path: fixtures/specification/application-keynames/governance.yaml
        check: application_required_keynames
        verdict: valid
      - assertion: pending
        note: >-
          No test in this repository anchors this statement; the engine in
          this repository implements the 1.0 language.
      - assertion: fixture
        path: fixtures/specification/application-keynames/invalid.yaml
        check: application_required_keynames
        verdict: invalid
      - assertion: fixture
        path: fixtures/specification/application-keynames/services-and-roots.yaml
        check: application_required_keynames
        verdict: invalid
      - assertion: pending
        note: >-
          No test in this repository anchors this statement; the engine in
          this repository implements the 1.0 language.

  - id: R-APP-002
    target: specification
    level: MUST
    statement: >-
      An application-profile specification that declares `channels` MUST make it a
      sequence of mappings, each carrying a lower-kebab `id` unique among the
      channels and a non-empty `schema`; a `services` entry's `consumes` and
      `emits`, when present, MUST be sequences that name no channel twice,
      and its `budget`, when present, MUST be a positive integer.
    acceptance:
      - assertion: fixture
        path: fixtures/specification/application-channels/valid.yaml
        check: application_channel_shape
        verdict: valid
      - assertion: fixture
        path: fixtures/specification/application-channels/duplicate-channel.yaml
        check: application_channel_shape
        verdict: invalid
      - assertion: fixture
        path: fixtures/specification/application-channels/negative-budget.yaml
        check: application_channel_shape
        verdict: invalid

  - id: R-APP-003
    target: specification
    level: MUST
    statement: >-
      Every channel that a `services` entry names under `consumes` or `emits`
      MUST be declared under the application-profile's `channels`.
    acceptance:
      - assertion: fixture
        path: fixtures/specification/application-channel-names/valid.yaml
        check: application_channel_names
        verdict: valid
      - assertion: fixture
        path: fixtures/specification/application-channel-names/undeclared-channel.yaml
        check: application_channel_names
        verdict: invalid

  - id: R-APP-004
    target: specification
    level: MUST
    statement: >-
      Every channel an application-profile declares MUST be emitted by at
      least one `services` entry and consumed by at least one `services` entry.
    acceptance:
      - assertion: fixture
        path: fixtures/specification/application-closure/valid.yaml
        check: application_channel_closure
        verdict: valid
      - assertion: fixture
        path: fixtures/specification/application-closure/orphan-emit.yaml
        check: application_channel_closure
        verdict: invalid
      - assertion: fixture
        path: fixtures/specification/application-closure/unfed-consumer.yaml
        check: application_channel_closure
        verdict: invalid

  - id: R-APP-005
    target: specification
    level: MUST
    statement: >-
      Every cycle in an application-profile's emit/consume graph, whose edges
      run from a `services` entry that emits a channel to each `services`
      entry that consumes it, MUST pass through a `services` entry that
      declares a `budget`. A channel whose `pattern` is `request-reply` or
      `survey` is such an edge, from its requester or surveyor to its
      replier or respondents, because the run that takes the request or the
      question can emit onward; it adds no reverse edge, because its answer
      returns within the exchange that asked for it. A cycle whose every
      edge is a `request-reply` channel MUST NOT appear, whatever its
      budgets: each requester on it waits on its reply while the cycle's
      request comes back to it, and its one listener (R-APP-017) admits that
      request only after the wait ends, so the cycle deadlocks. A declared
      `budget` bounds each item chain independently of the instance count of
      the agent services the chain passes through. The engine enforces the
      budget (R-RUN-005).
    acceptance:
      - assertion: fixture
        path: fixtures/specification/application-budgets/valid.yaml
        check: application_budgeted_cycles
        verdict: valid
      - assertion: fixture
        path: fixtures/specification/application-budgets/unbudgeted-cycle.yaml
        check: application_budgeted_cycles
        verdict: invalid
      - assertion: fixture
        path: fixtures/specification/application-budgets/cycle-avoiding-budget.yaml
        check: application_budgeted_cycles
        verdict: invalid
      - assertion: fixture
        path: fixtures/specification/application-budgets/request-reply-budgeted.yaml
        check: application_budgeted_cycles
        verdict: valid
      - assertion: fixture
        path: fixtures/specification/application-budgets/request-reply-side-effect.yaml
        check: application_budgeted_cycles
        verdict: invalid
      - assertion: fixture
        path: fixtures/specification/application-budgets/request-reply-only-cycle.yaml
        check: application_budgeted_cycles
        verdict: invalid
      - assertion: pending
        note: >-
          No test in this repository anchors this statement; the engine in
          this repository implements the 1.0 language.

  - id: R-APP-006
    status: retired
    retired: >-
      The 2.0 revision retired `delivery` in favour of `pattern`
      (R-APP-015): queue reads as `push-pull` and topic as
      `publish-subscribe` for one release with a deprecation line, and is
      refused after.
    target: specification
    level: MUST
    statement: >-
      A channel declared under an application-profile's `channels` MAY carry
      the `delivery` keyname; when present its value MUST be `queue` or
      `topic`, and an absent `delivery` means `queue`. Each item on a queue
      channel is consumed once across the consuming agent services'
      agent-instances; every consuming agent-instance receives each item on a topic channel.
      `delivery` is the older spelling of two patterns (R-APP-015): `queue`
      reads as `push-pull` and `topic` as `publish-subscribe`, so a channel
      that declares only `delivery` keeps its meaning.
    acceptance:
      - assertion: fixture
        path: fixtures/retired/application-delivery/valid.yaml
        check: application_channel_delivery
        verdict: valid
      - assertion: fixture
        path: fixtures/retired/application-delivery/unknown-delivery.yaml
        check: application_channel_delivery
        verdict: invalid

  - id: R-APP-007
    target: specification
    level: MUST
    statement: >-
      A `services` entry MAY carry the `instances` keyname, a mapping whose
      integer `min` and `max` bound how many agent-instances of that agent
      service run at once; when present, `min` MUST be at least 0, `max` MUST be at
      least 1, and `max` MUST NOT be below `min`.
    acceptance:
      - assertion: fixture
        path: fixtures/specification/application-instance-ranges/valid.yaml
        check: application_instance_ranges
        verdict: valid
      - assertion: fixture
        path: fixtures/specification/application-instance-ranges/max-below-min.yaml
        check: application_instance_ranges
        verdict: invalid

  - id: R-APP-008
    target: specification
    level: MUST
    statement: >-
      A `services` entry whose `instances.max` exceeds one MUST NOT consume a
      `publish-subscribe` channel: every one of its agent-instances would
      receive each item, so a publish-subscribe channel is consumed only by
      agent services that run a single agent-instance.
    acceptance:
      - assertion: fixture
        path: fixtures/specification/application-topic-scaling/valid.yaml
        check: application_topic_scaling
        verdict: valid
      - assertion: fixture
        path: fixtures/specification/application-topic-scaling/scaled-topic-consumer.yaml
        check: application_topic_scaling
        verdict: invalid

  - id: R-APP-009
    status: retired
    retired: >-
      The 2.0 revision retired launched agent services and the
      lifecycle launcher: the agent operator instantiates every agent service
      from its Agent resource, so no agent service holds instantiation
      authority over another and `launches` is refused.
    target: specification
    level: MUST
    statement: >-
      Every entry under a `services` entry's `launches` MUST name a declared
      agent service other than the launcher itself, each target at most once
      per launcher, and each launched agent service MUST have exactly one
      launcher across the application-profile, so instantiation authority
      for a launched agent service rests with one agent service.
    acceptance:
      - assertion: fixture
        path: fixtures/retired/application-launch-edges/valid.yaml
        check: application_launch_edges
        verdict: valid
      - assertion: fixture
        path: fixtures/retired/application-launch-edges/undeclared-target.yaml
        check: application_launch_edges
        verdict: invalid
      - assertion: fixture
        path: fixtures/retired/application-launch-edges/two-launchers.yaml
        check: application_launch_edges
        verdict: invalid

  - id: R-APP-010
    target: specification
    level: MUST
    statement: >-
      A channel declared under an application-profile's `channels` MAY
      carry `transport`, one of `rest`, `ws`, or `udp`, absent meaning
      `rest`; `reliability`, `at-most-once` or `at-least-once`, absent meaning
      `at-most-once`; and `policy`, whose `rate_limit`, when present, MUST
      be a positive integer followed by `/s`, items per second. A
      conforming processor MUST refuse a channel whose transport it does
      not run; the reference implementation runs `rest` alone.
    acceptance:
      - assertion: fixture
        path: fixtures/specification/application-channel-attributes/valid.yaml
        check: application_channel_attributes
        verdict: valid
      - assertion: fixture
        path: fixtures/specification/application-channel-attributes/unknown-transport.yaml
        check: application_channel_attributes
        verdict: invalid
      - assertion: fixture
        path: fixtures/specification/application-channel-attributes/unknown-reliability.yaml
        check: application_channel_attributes
        verdict: invalid
      - assertion: fixture
        path: fixtures/specification/application-channel-attributes/bad-rate-limit.yaml
        check: application_channel_attributes
        verdict: invalid
      - assertion: fixture
        path: fixtures/specification/application-channel-attributes/unimplemented-transport.yaml
        check: application_channel_attributes
        verdict: invalid
      - assertion: pending
        note: >-
          No test in this repository anchors this statement; the engine in
          this repository implements the 1.0 language.

  - id: R-APP-011
    target: specification
    level: MUST
    statement: >-
      The specification a channel's `schema` names MUST declare kind
      `channel-schema`; it describes the item the channel carries, and a
      listener refuses an item that does not satisfy it. The
      whole-application check holds the schema to its kind and compares no
      message types: each agent's load holds the actions on its side of
      the channel to the schema (R-TOOL-003), and the listener holds each
      item to it at delivery (R-TOOL-004).
    acceptance:
      - assertion: fixture
        path: fixtures/specification/channel-schema-kind/valid.yaml
        check: channel_schema_kind
        verdict: valid
      - assertion: fixture
        path: fixtures/specification/channel-schema-kind/wrong-kind.yaml
        check: channel_schema_kind
        verdict: invalid
      - assertion: pending
        note: >-
          No test in this repository anchors this statement; the engine in
          this repository implements the 1.0 language.

  - id: R-APP-012
    target: processor
    level: MUST
    statement: >-
      While a declared channel joins an emitting agent service to a
      consuming one, a conforming processor that checks the application
      with its files MUST refuse a REST client operation the emitter
      declares whose method and path equal an endpoint the consumer's REST
      servers declare, naming both agent services, the tool, the route, and
      the channel: the item belongs on the channel, and a hand-written edge
      beside it is how declared and actual traffic diverge. The check reads
      declarations only: the client operations and server endpoints in the
      `rest_definitions` each agent service's profile references by a path
      relative to it, and in those of the request profiles its servers
      bind, with the method and the path compared as written. It does not
      see a definition referenced by an absolute path or one resolved at run
      time (`${...}`), a client's base URL or host, a call from the consumer
      back to the emitter, a pair of agent services no channel joins, the
      engine's own `/channels/<id>` routes, an exec tool's program
      (R-TOOL-009), or a builtin tool that is not a REST client.
    acceptance:
      - assertion: pending
        note: >-
          No test in this repository anchors this statement; the engine in
          this repository implements the 1.0 language.

  - id: R-APP-013
    status: retired
    retired: >-
      The 2.0 revision retired the budget guard
      convention: the engine enforces a declared `budget` on the item chains
      that cross it, and the manifest check no longer reads machines for it.
      Replaced by R-RUN-005.
    target: processor
    level: MUST
    statement: >-
      An agent service that declares a `budget` and emits a channel on a
      cycle back to itself (R-APP-005) MUST enforce the budget with a guard
      its machine cannot bypass: a counter with a start, whose branch under
      the limit leads to the send on that channel, whose branch at the limit
      leads to no send on any cycle channel, which every path to such a
      send passes, and whose limit is the declared budget written in the
      specification rather than supplied at dispatch. A conforming
      processor MUST refuse an agent service whose closure breaks any of
      these, naming the agent service, the guard, and the channel.
    acceptance:
      - assertion: pending
        note: >-
          No test in this repository anchors this statement; the engine in
          this repository implements the 1.0 language.

  - id: R-APP-014
    status: retired
    retired: >-
      The 2.0 revision retired the launch guard with the launched
      agent services it guarded (R-APP-009).
    target: processor
    level: MUST
    statement: >-
      Only the launcher of a launched agent service (R-APP-009) MAY start
      it: a conforming processor MUST refuse a start tool (`start_service`) for a launched
      agent service in the closure of any other agent service, naming both
      and the tool. The launcher of a launched agent service that declares
      `instances` MUST declare a start tool for it, and a bound the launcher
      gives, the start tool's maximum or the lifecycle-launcher fragment's
      minimum and maximum, MUST equal the declared range; a bound left out
      takes the range.
    acceptance:
      - assertion: pending
        note: >-
          No test in this repository anchors this statement; the engine in
          this repository implements the 1.0 language.

  - id: R-APP-015
    target: specification
    level: MUST
    statement: >-
      A channel declared under an application-profile's `channels` MAY carry
      the `pattern` keyname; when present its value MUST be one of
      `request-reply` (many requesters, one replier, each request
      answered), `publish-subscribe` (one publisher, many subscribers),
      `push-pull` (a load-balanced pipeline), or `survey` (one surveyor,
      answers collected until a deadline). A channel that declares no
      `pattern` is a direct channel: each emitter posts to its consumers, and
      each item is consumed once. An agent service's side of a pattern
      follows from its `emits` and `consumes`: the requester, publisher,
      pusher, and surveyor emit; the replier, subscriber, puller, and
      respondent consume.
    acceptance:
      - assertion: fixture
        path: fixtures/specification/application-patterns/valid.yaml
        check: application_channel_patterns
        verdict: valid
      - assertion: fixture
        path: fixtures/specification/application-patterns/unknown-pattern.yaml
        check: application_channel_patterns
        verdict: invalid
      - assertion: pending
        note: >-
          No test in this repository anchors this statement; the engine in
          this repository implements the 1.0 language.

  - id: R-APP-016
    target: specification
    level: MUST
    statement: >-
      A `services` entry MAY carry the `listens` keyname, naming the pattern
      channels it listens on; a listening agent service serves the channel
      at a stable address and every other agent service on the channel
      dials it. Each channel that declares a `pattern` MUST have exactly one
      listening agent service among the agent services that emit or consume
      it; `listens` MUST name only channels that declare a `pattern` and
      that the agent service emits or consumes; and the listener of a
      `request-reply` channel MUST be its replier, the agent service that
      consumes it.
    acceptance:
      - assertion: fixture
