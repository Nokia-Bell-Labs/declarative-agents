      inputs: [parent, structure intent, required-content inventory, bounded policy, accepted evidence, provenance, query identity, and refinement count selected from $from(validated_structure_request) and $from(structure_grounding_report)]
      outputs: [bounded structure-edit context with fixed source labels]
      emits: [StructureEditContextReady]
      infrastructure_errors: [none emitted by compose; trusted selector defects are recorded on the Result while the configured signal remains StructureEditContextReady]
