        - {from: parsing_original_observation, on: PangramObservationInvalid/CommandError/BudgetExhausted, to: composing_original_unavailable, action: compose_original_unavailable, label: pangram_original_evidence}
        - {from: checking_original_completed, on: CommandError/BudgetExhausted, to: composing_original_unavailable, action: compose_original_unavailable, label: pangram_original_evidence}
        - {from: checking_original_pending, on: CommandError/BudgetExhausted, to: composing_original_unavailable, action: compose_original_unavailable, label: pangram_original_evidence}
        - {from: checking_original_poll_budget, on: CommandError/BudgetExhausted, to: composing_original_unavailable, action: compose_original_unavailable, label: pangram_original_evidence}
