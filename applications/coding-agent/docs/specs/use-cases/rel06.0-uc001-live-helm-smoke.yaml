id: rel06.0-uc001-live-helm-smoke
title: Prove the Packaged Coding Topology on Kind
status: implemented

summary: |
  A developer runs one bounded target. It verifies host prerequisites, acquires
  a disposable kind cluster, builds the published profile-free coding-runtime
  recipe and a deterministic model image, installs the packaged chart, drives
  one coding request through all roles and the required build, v2 lint, and test
  sequence, verifies the shared result and trace, and cleans up.

actor: A developer or CI worker validating the deployable coding application.
trigger: Run mage integration:helmSmoke.

preconditions:
  - Docker, kind, Helm, kubectl, and the required local images are available.
  - The agent-core and agent-profiles checkouts are present.

flow:
  - id: F1
    text: Check prerequisites without mutating a cluster; skip with one explicit reason when absent.
  - id: F2
    text: Acquire a pinned kind cluster and verify Docker and Kubernetes readiness.
  - id: F3
    text: Build and load the production profile-free coding image with Go 1.26 and golangci-lint v2.12.2 plus the deterministic model image, create the RWX fixture, and package the chart.
  - id: F4
    text: Install the .tgz and wait for model, collector, Jaeger, planner, executor, and critic readiness.
  - id: F5
    text: Seed the shared workspace and verify every role lifecycle endpoint.
  - id: F6
    text: Submit one traced planner request and verify executor mutation, build, v2 lint, Go tests, critic acceptance, and the connected Jaeger trace.
  - id: F7
    text: On failure classify infrastructure versus semantics, emit bounded diagnostics, and clean up; on success clean up.

success_criteria:
  - id: S1
    criterion: All three deployed role health endpoints are truthful and reachable.
    traces: [srd005-live-helm-smoke R3.1]
  - id: S2
    criterion: The shared workspace and critic verdict prove remote role composition.
    traces: [srd005-live-helm-smoke R3.2]
  - id: S3
    criterion: Jaeger contains all three role service names under the submitted trace ID.
    traces: [srd005-live-helm-smoke R3.3]
  - id: S4
    criterion: Skip, classification, diagnostics, and cleanup behavior are bounded and explicit.
    traces: [srd005-live-helm-smoke R1, srd005-live-helm-smoke R4]

out_of_scope:
  - Production model performance and GPU sizing.
  - Multi-node RWX and high availability.
  - Public ingress and authentication.

test_suite: test-rel06.0-live-helm-smoke
