id: srd004-workflow-orchestrator
title: Workflow Orchestrator State Machine
status: specified

problem: |
  Prose Editor needs one flat declarative coordinator for source capture,
  structure, voice, style, independent criticism, responsible-stage replay,
  finalization, and forward-only GitHub publication. The coordinator must make
  every boundary action and persistence point visible. It must not hide
  editing, retrieval, criticism, Pangram, retry selection, or remote mutation
  in imperative service code.

  Agent-core MachineSpec has no guards or payload-based branching. Generic exec
  also has a fixed ToolDone, ToolFailed, and CommandError contract, and
  execute_task has a fixed ExecutionDone, ExecutionFailed, and CommandError
  contract. Exec structured mode only wraps raw stdout and exit code; it does
  not transform git, gh, or digest output into domain JSON. Therefore no helper
  operation or child invocation can directly emit the saga's multi-way business
  outcomes, and no parser can assume raw CLI text contains domain fields. This
  specification requires every orchestrator exec to run a fixed operation of a
  planned constrained non-shell JSON-emitting helper, then makes every boundary
  result a bounded structured document,
  parses it explicitly, and routes it through visible chains of
  value_predicate words that compare one scalar and emit two outcomes each.
  Semantic findings still route to the structure, voice, or style stage named
  by the critic; there is no semantic editor.

goals:
  - "G1: Specify the exact flat orchestration states, signals, transitions, terminal outcomes, and budgets."
  - "G2: Map every orchestrator exec, parse, predicate, child, and lifecycle action to the closed srd003 vocabulary."
  - "G3: Persist intent before remote work and persist immutable artifacts plus manifest history before advancing."
  - "G4: Route domain rejection and infrastructure failure distinctly with bounded responsible-stage replay."
  - "G5: Make finalization and publication structurally unreachable before critic acceptance."
  - "G6: Recover idempotently and escalate partial publication without destructive remote compensation."

applicability:
  release: "00.0"
  implementation_status: documentation_only_runtime_planned
  owner: workflow-orchestrator
  machine_form: planned_flat_machine_spec
  runtime_machine_path: agents/workflow-orchestrator/machine.yaml
  runtime_machine_status: not_implemented
  orchestrator_json_helper_status: not_implemented

flat_machine_contract:
  initial_state: awaiting_request
  terminal_states:
    - published
    - kept_original
    - failed
    - publication_blocked
    - operator_aborted

  budgets:
    machine:
      max_iterations: 8192
      max_tokens: 1000000
      max_duration: 30m0s
      max_consecutive_parse_errors: omitted
    policy:
      rule: Effective limits are the lesser of validated human policy and these hard caps.
      retry_limit_by_stage:
        capture: 3
        structure: 3
        voice: 3
        style: 3
        critique: 3
        finalization: 2
      infrastructure_retry_limit_by_action: 3
      publication_retry_limit_by_action: 3
      operator_escalation_limit: 1
    counting:
      - A stage attempt is allocated once, after its intent revision is durable.
      - Re-entry reuses the same stage, attempt, invocation_id, and idempotency_key.
      - Domain rejection consumes the responsible stage's attempt budget.
      - CommandError, ToolFailed, ExecutionFailed, and uncertain completion consume the current action's infrastructure budget, not a critic-rejection budget.
      - Publication retries reuse one publication_key, commit, branch, and pull request identity.
      - BudgetExhausted never advances to critic acceptance, finalization, or publication.
      - The 8192 hard cap includes every expanded exec, compose, parse, predicate, persistence, retry, recovery, and lifecycle transition; it remains finite after factory-semantic expansion.

