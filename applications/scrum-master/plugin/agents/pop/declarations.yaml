# The pop machine's words (GH-204, srd013 R7.5): the claim, the branch, the
# worktree, and the skills install. The branch name, the checkout, and the
# worktree flow from each word's JSON output into the next word's
# parameters through $from selectors — the runtime extracts a declared
# parameter from a labeled step's output — so nothing is retyped between
# steps. SCRUM_MASTER_PROJECT and SCRUM_MASTER_ISSUE come from the environment; an optional
# value is a parameter, never a ${VAR} arg (the GH-135 finding). The
# request's issue_project and branch reach the claim, whose output carries
# them on (GH-47).
unit: scrum-master-pop-declarations
tools:
- name: claim
  type: exec
  binary: scrum-master
  args:
  - issue
  - claim
  - --json
  - --project
  - ${SCRUM_MASTER_PROJECT}
  - --issue
  - ${SCRUM_MASTER_ISSUE}
  visibility: internal
  description: Assign the issue to the caller with pop's refusals — closed, someone else's, a data issue not admitted — and name the branch to open (srd013 R7.1, srd041 R9.1).
  category: boundary
  parameters:
    type: object
    properties:
      issue_project:
        type: string
        description: The project holding the issue, when not SCRUM_MASTER_PROJECT, such as a status issue taken in the reports repository (srd018 R6.1).
        flag: --issue-project
      branch:
        type: string
        description: The branch to open in place of the one named for the issue.
        flag: --branch
  signature:
    emits: [ToolDone, ToolFailed, CommandError]
  output:
    description: The claim word's JSON report — the issue's title and body, the assignment, and the branch the next word opens.
    schema:
      type: string
  side_effects:
  - kind: external_api_call
    target: tracker
    description: Assigns the issue to the caller; the one write this word makes.
  reversibility:
    classification: irreversible
    requires_confirmation: false
  undo:
    strategy: noop
    description: A claim is released by the person with scrum-master, not reversed by the run.
  errors:
  - signal: CommandError
    condition: the word cannot start — this agent does not serve the scrum-master words — or an environment variable is unset
    message_shape: 'claim: <error>'
    state_after_failure: nothing was assigned by a process that did not start
  - signal: ToolFailed
    condition: the word refuses the claim and exits non-zero
    message_shape: <the word's refusal reason, as printed>
    state_after_failure: the tracker is as the word's refusal left it

- name: open_branch
  type: exec
  binary: scrum-master
  args:
  - issue
  - open-branch
  - --json
  - --project
  - ${SCRUM_MASTER_PROJECT}
  - --issue
  - ${SCRUM_MASTER_ISSUE}
  visibility: internal
  description: Create or reuse the issue's branch from the default branch and, on a hosted tracker, open or find its review (srd013 R7.5).
  category: boundary
  parameters:
    type: object
    properties:
      branch:
        type: string
        description: The branch to open, from the claim word's output.
        flag: --branch
        source: $from(claim).branch
      issue_project:
        type: string
        description: The issue's project, from the claim word's output.
        flag: --issue-project
        source: $from(claim).issue_project
    required: [branch]
  signature:
    emits: [ToolDone, ToolFailed, CommandError]
  output:
    description: The branch word's JSON report — the branch, whether it was created, and the review where a host opens one.
    schema:
      type: string
  side_effects:
  - kind: external_api_call
    target: git_remote
    description: Creates the branch at the origin when it is not there, and a review on a hosted tracker.
  reversibility:
    classification: irreversible
    requires_confirmation: false
  undo:
    strategy: noop
    description: A branch stays; a re-run reuses it.
  errors:
  - signal: CommandError
    condition: the word cannot start — this agent does not serve the scrum-master words — or an environment variable is unset
    message_shape: 'open_branch: <error>'
    state_after_failure: nothing opened by a process that did not start
  - signal: ToolFailed
    condition: the word refuses the branch and exits non-zero
    message_shape: <the word's refusal reason, as printed>
    state_after_failure: the claim stands; a re-run of the pop finishes it

- name: add_worktree
  type: exec
  binary: scrum-master
  args:
  - issue
  - add-worktree
  - --json
  visibility: internal
  description: Open or reuse the sibling worktree for the issue's branch beside the checkout, with the branch checked out (srd013 R7.5).
  category: boundary
  parameters:
    type: object
    properties:
      branch:
        type: string
        description: The branch the worktree checks out, from the claim word's output.
        flag: --branch
        source: $from(claim).branch
    required: [branch]
  signature:
    emits: [ToolDone, ToolFailed, CommandError]
  output:
    description: The worktree word's JSON report — the checkout, the worktree, and whether it was added.
    schema:
      type: string
  side_effects:
  - kind: filesystem_write
    target: git_repository
    description: Adds the worktree beside the checkout and checks the branch out.
  reversibility:
    classification: irreversible
    requires_confirmation: false
  undo:
    strategy: noop
    description: A worktree stays; a re-run reuses it, and a person removes one with git.
  errors:
  - signal: CommandError
    condition: the word cannot start — this agent does not serve the scrum-master words
    message_shape: 'add_worktree: <error>'
    state_after_failure: nothing added by a process that did not start
  - signal: ToolFailed
    condition: the worktree cannot be added and the word exits non-zero
    message_shape: <the word's refusal reason, as printed>
    state_after_failure: the claim and the branch stand; a re-run of the pop finishes it

- name: install_skills
  type: exec
  binary: scrum-master
  args:
  - issue
  - install-skills
  - --json
  visibility: internal
  description: Write the checkout's agents' skills into the worktree, so an agent started there can finish the issue (srd036 R2.3).
  category: boundary
  parameters:
    type: object
    properties:
      checkout:
        type: string
        description: The checkout whose installed agents decide what installs, from the worktree word's output.
        flag: --checkout
        source: $from(worktree).checkout
      worktree:
        type: string
        description: The worktree the skills install into, from the worktree word's output.
        flag: --worktree
        source: $from(worktree).worktree
    required: [checkout, worktree]
  signature:
    emits: [ToolDone, ToolFailed, CommandError]
  output:
    description: The install word's JSON report — the agents whose skills were written.
    schema:
      type: string
  side_effects:
  - kind: filesystem_write
    target: worktree
    description: Writes the stamped skill files into the worktree; git ignores them.
  reversibility:
    classification: irreversible
    requires_confirmation: false
  undo:
    strategy: noop
    description: Installed skill files are untracked; a re-install rewrites them.
  errors:
  - signal: CommandError
    condition: the word cannot start — this agent does not serve the scrum-master words
    message_shape: 'install_skills: <error>'
    state_after_failure: nothing written by a process that did not start
  - signal: ToolFailed
    condition: the install fails and the word exits non-zero
    message_shape: <the install error, as printed>
    state_after_failure: the pop stands; the reason is reported, as scrum-master issue pop behaves
