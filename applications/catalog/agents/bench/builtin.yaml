# The bench serving lifecycle and its monitor pair. The four lifecycle words
# arrive from the agent-core fragment under bench's own names, and the monitor
# pair is the agent-core unit every such agent imports.
unit: catalog-bench-builtin
imports:
  - /opt/agent-core/tools/units/monitor-rest-declarations.yaml
instantiate:
  - fragment: /opt/agent-core/tools/units/serve-lifecycle-declarations-fragment.yaml
    args:
      agent: "bench"
      launch_requests: launch_bench_http
      launch_control: launch_bench_control
      await_control: await_bench_control
      stop_requests: stop_bench_http
      requests_rest_ref: bench
      control_rest_ref: bench_control
      requests_noun: bench
      requests_purpose: that serves the UI, evaluation reads, and experiment launches
tools: []
