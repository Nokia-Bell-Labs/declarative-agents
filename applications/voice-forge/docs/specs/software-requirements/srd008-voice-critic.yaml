      - PangramCandidateObserved
      - PangramCandidatePollDenied

  transition_contract:
    notation: |
      Each row is one required MachineSpec transition. Every exec helper emits
      only ToolDone, ToolFailed, or CommandError and is followed by
      parse_structured. Every parsed multi-way report uses explicit
      value_predicate states, each comparing one scalar and emitting exactly
      two configured outcomes plus CommandError. Every compose action emits one
      fixed configured signal. REST signals are only operation success or
      failure signals configured by HTTP status mapping, plus CommandError.
    independent_evaluation:
      - {from: awaiting_request, on: SeedRequest, to: validating_request, action: validate_request, label: critic_request_report_raw}
      - {from: validating_request, on: ToolDone, to: parsing_request_report, action: parse_request, label: critic_request_report}
