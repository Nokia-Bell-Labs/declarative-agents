# The release words of the plan workflow: the merge that delivers its issue, the
# release gate, and the tag. Kept apart from declarations.yaml, which holds
# the workflow's own words, so neither file outgrows the declaration-style
# limit. Optional flags are parameters, never ${VAR} args (GH-135).
unit: scrum-master-plan-release-declarations
tools:
- name: issue_merge
  type: exec
  binary: scrum-master
  args:
  - issue
  - merge
  - --json
  # The words after the merge run in the issue's worktree, so the merge
  # keeps it; clean_up removes it last (GH-2796).
  - --clean-up=false
  visibility: external
  description: Deliver the planning issue by the local merge that closes it (srd013 R5.5).
  category: boundary
  parameters:
    type: object
    properties:
      project:
        type: string
        description: Project path.
        flag: --project
      issue:
        type: integer
        description: Issue IID.
        flag: --issue
      control:
        type: string
        description: Program repository holding control/ files.
        flag: --control
      dir:
        type: string
        description: The worktree holding the branch, where the audit runs.
        flag: --dir
    required: [project, issue]
  signature:
    emits: [ToolDone, ToolFailed, CommandError]
  output:
    description: scrum-master issue merge's JSON report.
    schema:
      type: string
  side_effects:
  - kind: external_api_call
    target: tracker
    description: Merges the branch, pushes the result, and closes the issue in the tracker.
  reversibility:
    classification: irreversible
    requires_confirmation: false
  undo:
    strategy: noop
    description: the words' own policy governs what follows; the run reverses nothing.
  errors:
  - signal: CommandError
    condition: the word cannot start — this agent does not serve the scrum-master words
    message_shape: 'issue_merge: <error>'
    state_after_failure: nothing ran in a process that did not start
  - signal: ToolFailed
    condition: the word refuses the merge — a failed audit or a missing approval — and exits non-zero
    message_shape: <the word's refusal reason, as printed>
    state_after_failure: the tracker and the checkout are as the word's refusal left them

- name: release_gate
  type: exec
  binary: scrum-master
  args:
  - release
  - gate
  - --json
  visibility: external
  description: Run the release gate for the plan's tag (srd015).
  category: boundary
  parameters:
    type: object
    properties:
      artifact:
        type: string
        description: Artifact a subsystem SRD declares.
        flag: --artifact
      version:
        type: string
        description: Candidate version.
        flag: --version
      issue:
        type: string
        description: Release issue as project#iid.
        flag: --issue
      control:
        type: string
        description: Program repository holding control/policy.md.
        flag: --control
      dir:
        type: string
        description: The artifact repository's local checkout.
        flag: --dir
    required: [artifact, version, issue]
  signature:
    emits: [ToolDone, ToolFailed, CommandError]
  output:
    description: scrum-master release gate's JSON report.
    schema:
      type: string
  side_effects:
  - kind: external_api_call
    target: tracker
    description: Runs the gates and records evidence events on the release issue.
  reversibility:
    classification: irreversible
    requires_confirmation: false
  undo:
    strategy: noop
    description: the words' own policy governs what follows; the run reverses nothing.
  errors:
  - signal: CommandError
    condition: the word cannot start — this agent does not serve the scrum-master words
    message_shape: 'release_gate: <error>'
    state_after_failure: nothing ran in a process that did not start
  - signal: ToolFailed
    condition: a gate fails or the word refuses, exiting non-zero
    message_shape: <the word's refusal reason, as printed>
    state_after_failure: the tracker and the checkout are as the word's refusal left them

- name: release_tag
  type: exec
  binary: scrum-master
  args:
  - release
  - tag
  - --json
  visibility: external
  description: Tag the release once its gate passed; the tag publishes the plan (srd015).
  category: boundary
  parameters:
    type: object
    properties:
      artifact:
        type: string
        description: Artifact a subsystem SRD declares.
        flag: --artifact
      version:
        type: string
        description: Candidate version.
        flag: --version
      issue:
        type: string
        description: Release issue as project#iid.
        flag: --issue
      control:
        type: string
        description: Program repository holding control/policy.md.
        flag: --control
      dir:
        type: string
        description: The artifact repository's local checkout.
        flag: --dir
    required: [artifact, version, issue]
  signature:
    emits: [ToolDone, ToolFailed, CommandError]
  output:
    description: scrum-master release tag's JSON report.
    schema:
      type: string
  side_effects:
  - kind: external_api_call
    target: tracker
    description: Pushes the release tag.
  reversibility:
    classification: irreversible
    requires_confirmation: false
  undo:
    strategy: noop
    description: the words' own policy governs what follows; the run reverses nothing.
  errors:
  - signal: CommandError
    condition: the word cannot start — this agent does not serve the scrum-master words
    message_shape: 'release_tag: <error>'
    state_after_failure: nothing ran in a process that did not start
  - signal: ToolFailed
    condition: the word refuses the tag — no passing gate, or the version exists — and exits non-zero
    message_shape: <the word's refusal reason, as printed>
    state_after_failure: the tracker and the checkout are as the word's refusal left them
- name: clean_up
  type: exec
  binary: scrum-master
  args:
  - issue
  - clean-up
  - --json
  visibility: external
  description: Last, once nothing more runs in the issue's worktree, remove it and its merged branch, here and on origin; a worktree with changes or an unmerged branch is kept with its reason (GH-2796).
  category: boundary
  parameters:
    type: object
    properties:
      branch:
        type: string
        description: The merged branch; empty is the worktree's own.
        flag: --branch
  signature:
    emits: [ToolDone, ToolFailed, CommandError]
  output:
    description: The clean-up word's JSON report — the worktree, the branch, and origin's branch, each removed, kept with its reason, or none.
    schema:
      type: string
  side_effects:
  - kind: filesystem_write
    target: the issue's worktree
    description: Removes the worktree pop opened for the issue, from the main checkout.
  - kind: external_api_call
    target: origin
    description: Deletes the merged branch on origin.
  reversibility:
    classification: irreversible
    requires_confirmation: false
  undo:
    strategy: noop
    description: The branch is merged into the default branch; pop opens a new worktree when one is needed.
  errors:
  - signal: CommandError
    condition: the word cannot start — this agent does not serve the scrum-master words
    message_shape: 'clean_up: <error>'
    state_after_failure: nothing removed by a process that did not start
  - signal: ToolFailed
    condition: the word cannot read the repository the worktree belongs to
    message_shape: 'clean-up needs a local checkout: <reason>'
    state_after_failure: the worktree and branches are as they were
