# Persistent integration telemetry ingress and signal-specific backends.
# Lifecycle: mage observability:up|status|down|reset
name: declarative-agents-observability

services:
  collector:
    image: otel/opentelemetry-collector-contrib:0.157.0
    container_name: declarative-agents-otel-collector
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    configs:
      - source: collector
        target: /etc/otelcol-contrib/config.yaml
    ports:
      - "127.0.0.1:${DA_OTEL_GRPC_PORT:-4317}:4317"
      - "127.0.0.1:${DA_OTEL_HTTP_PORT:-4318}:4318"
      - "127.0.0.1:${DA_OTEL_HEALTH_PORT:-13133}:13133"
    depends_on:
      collector-agent:
        condition: service_healthy
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/otelcol-contrib", "validate", "--config=/etc/otelcol-contrib/config.yaml"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  collector-agent:
    # Built locally by `mage observability:up` (kindrig.BuildAgentCoreImage);
    # the published registry image is not pullable from every environment.
    image: ${DA_COLLECTOR_AGENT_IMAGE:-declarative-agents/agent-core:local}
    pull_policy: never
    container_name: declarative-agents-collector-agent
    entrypoint: ["agent"]
    command:
      - "--profile"
      - "/profiles/agents/collector/profile.yaml"
      - "--directory"
      - "/data"
    volumes:
      - ../../applications/catalog/agents/collector:/profiles/agents/collector:ro
      - collector-spool:/data
    environment:
      COLLECTOR_BIND_HOST: "0.0.0.0"
      COLLECTOR_RECEIVER_ADDRESS: "0.0.0.0:4317"
      COLLECTOR_CONTROL_PORT: "18191"
      COLLECTOR_MONITOR_PORT: "18192"
      COLLECTOR_QUERY_PORT: "18193"
      COLLECTOR_SPOOL_PATH: "/data/collector.ndjson"
      COLLECTOR_MODE: "spool"
    ports:
      - "127.0.0.1:${DA_COLLECTOR_QUERY_PORT:-18193}:18193"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:18191/api/lifecycle/health >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.13.1
    container_name: declarative-agents-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-remote-write-receiver"
    ports:
      - "127.0.0.1:${DA_PROMETHEUS_QUERY_PORT:-9090}:9090"
    volumes:
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:9090/-/healthy >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  collector-spool:
  prometheus-data:

configs:
  collector:
    content: |
      extensions:
        health_check:
          endpoint: 0.0.0.0:13133

      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317
            http:
              endpoint: 0.0.0.0:4318

      processors:
        batch: {}

      exporters:
        otlp_grpc/collector_agent:
          endpoint: collector-agent:4317
          tls:
            insecure: true
        prometheus_remote_write:
          endpoint: http://prometheus:9090/api/v1/write

      service:
        extensions: [health_check]
        pipelines:
          traces:
            receivers: [otlp]
            processors: [batch]
            exporters: [otlp_grpc/collector_agent]
          metrics:
            receivers: [otlp]
            processors: [batch]
            exporters: [prometheus_remote_write]
