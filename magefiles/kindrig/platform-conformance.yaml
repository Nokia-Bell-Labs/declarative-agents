# Platform conformance workload (GH-2215): a claim the local-path provisioner
# must bind, and an echo backend Traefik must route. The backend reuses the
# kind-loaded Traefik image (docker.io/library/traefik:<version>) serving /ping,
# so the check pulls nothing.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: conformance-claim
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 16Mi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: conformance-echo
  labels:
    app.kubernetes.io/name: conformance-echo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: conformance-echo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: conformance-echo
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: echo
          image: KINDRIG_TRAEFIK_IMAGE
          imagePullPolicy: Never
          args:
            - --global.checknewversion=false
            - --global.sendanonymoususage=false
            - --entrypoints.web.address=:8080/tcp
            - --ping=true
            - --ping.entrypoint=web
          ports:
            - {name: web, containerPort: 8080, protocol: TCP}
          readinessProbe:
            httpGet: {path: /ping, port: web}
            periodSeconds: 2
          volumeMounts:
            - {name: data, mountPath: /data}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: conformance-claim
---
apiVersion: v1
kind: Service
metadata:
  name: conformance-echo
spec:
  selector:
    app.kubernetes.io/name: conformance-echo
  ports:
    - {name: web, port: 80, targetPort: web, protocol: TCP}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: conformance-echo
spec:
  ingressClassName: traefik
  rules:
    - host: KINDRIG_CONFORMANCE_HOST
      http:
        paths:
          - path: /ping
            pathType: Prefix
            backend:
              service:
                name: conformance-echo
                port: {name: web}
