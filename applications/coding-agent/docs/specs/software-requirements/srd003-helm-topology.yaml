id: srd003-helm-topology
title: Core Coding-Agent Helm Topology
status: implemented

problem: |
  The packaged serving roles need a Kubernetes topology that preserves their
  mounted-profile, shared-workspace, fixed-service, lifecycle, and tracing
  contracts without baking application programs into the agent-core image or
  duplicating #875 closure membership in Helm values.

requirements:
  R1:
    title: Real role workloads
    items:
      - R1.1: The chart shall render one Deployment and ClusterIP Service for planner, executor, and critic.
      - R1.2: Every role shall use the same canonical, profile-free agent-core image and select the serving profile named by its prepared role manifest.
      - R1.3: Role ConfigMaps and projected volumes shall derive file and partition membership only from prepared
      - R1.4: A checksum of only the role's reachable profile files shall annotate its pod template.
      - R1.5: The executor shall receive Go 1.26 and golangci-lint v2.12.2 from separate digest-pinned upstream init containers through one read-only tools volume so it can complete its mandatory build, lint, and test sequence without extending the agent image; the changed-workspace critic shall receive only Go through a separate read-only donor volume for its independent test oracle.

  R2:
    title: Serving contract wiring
    items:
      - R2.1: All roles shall mount one trusted shared PVC at the configured runtime directory.
      - R2.2: Planner shall receive fixed executor and critic Service hosts and URLs matching ports 18210 and 18220.
      - R2.3: Readiness and liveness shall call each existing /api/lifecycle/health control endpoint.
      - R2.4: Role pods shall use non-root, no-privilege-escalation, dropped-capability, read-only-root, and disabled service-account-token defaults.

  R3:
    title: Model and observability tiers
    items:
      - R3.1: Planner and executor shall receive one values-selected OLLAMA_URL, from either an external endpoint or the optional chart-owned Ollama Service.
      - R3.2: The optional Ollama tier shall provide persistent model storage, configured preload, and model-presence startup gating.
      - R3.3: Every role shall use a distinct OTel service name and export OTLP to the optional collector.
      - R3.4: The collector agent shall receive OTLP, spool traces, and serve a query surface.

  R4:
    title: Reproducible preparation
    items:
      - R4.1: mage helmPrepare shall regenerate
      - R4.2: Default and small-footprint CI values shall lint and render without requiring Helm schema work from the next issue.

acceptance_criteria:
  - id: AC1
    criterion: Helm renders exactly three role Deployments with real profiles, the canonical agent-core image, role-minimal read-only tool donors (executor Go plus linter; critic Go only), shared workspace, fixed role Services, and truthful probes.
    traces: [R1.1, R1.2, R1.3, R1.4, R1.5, R2.1, R2.2, R2.3, R2.4]
  - id: AC2
    criterion: Editing one prepared role profile changes only that role's rollout checksum.
    traces: [R1.3, R1.4]
  - id: AC3
    criterion: External and in-cluster model modes plus collector agent tracing render coherently.
    traces: [R3.1, R3.2, R3.3, R3.4]
  - id: AC4
    criterion: helm lint and default and CI helm template commands pass after mage helmPrepare.
    traces: [R4.1, R4.2]

goals:
  - id: G1
    text: Real role workloads.
  - id: G2
    text: Serving contract wiring.
  - id: G3
    text: Model and observability tiers.
  - id: G4
    text: Reproducible preparation.
non_goals:
  - values.schema.json and negative schema fixtures.
  - Packaged-chart archive testing.
  - Live kind installation and deployment documentation.
