id: rel06.0-uc001-live-helm-smoke
title: Prove the Packaged Coding Topology on Kind
status: implemented

summary: |
  A developer runs one bounded target. It verifies host prerequisites, acquires
  a disposable kind cluster, builds and loads one commit-addressed canonical
  profile-free agent image, installs the packaged chart, runs every agent and
  the deterministic model boundary from that one image, drives one coding
  request through all roles and the required build, v2 lint, and test sequence,
  verifies the shared result and trace, and cleans up.

actor: A developer or CI worker validating the deployable coding application.
trigger: Run mage integration:helmSmoke.

preconditions:
  - Docker, kind, Helm, kubectl, and the required local images are available.
  - The agent-core and applications/catalog checkouts are present.

flow:
  - id: F1
    text: Check prerequisites without mutating a cluster; skip with one explicit reason when absent.
  - id: F2
    text: Acquire a pinned kind cluster and verify Docker and Kubernetes readiness.
  - id: F3
    text: Build and load one commit-addressed canonical profile-free agent image, stage the executor's Go 1.26 and golangci-lint v2.12.2 tool donors and the canonical model-mock profile and fixture, create the RWX fixture, and package the chart.
  - id: F4
    text: Install the .tgz and wait for model, collector agent, planner, executor, and critic readiness.
  - id: F5
    text: Seed the shared workspace and verify every role lifecycle endpoint.
  - id: F6
    text: Submit one traced planner request and verify executor mutation, build, v2 lint, Go tests, critic acceptance, and the connected collector agent trace.
  - id: F7
    text: On failure classify infrastructure versus semantics, emit bounded diagnostics, and clean up; on success clean up.

success_criteria:
  - id: S1
    criterion: All three deployed role health endpoints are truthful and reachable.
    traces: [srd005-live-helm-smoke R3.1, srd005-live-helm-smoke AC1]
  - id: S2
    criterion: The shared workspace and critic verdict prove remote role composition.
    traces: [srd005-live-helm-smoke R3.2, srd005-live-helm-smoke AC1]
  - id: S3
    criterion: The collector agent contains all three role service names under the submitted trace ID.
    traces: [srd005-live-helm-smoke R3.3, srd005-live-helm-smoke AC1]
  - id: S4
    criterion: Skip, classification, diagnostics, and cleanup behavior are bounded and explicit.
    traces: [srd005-live-helm-smoke R1.1, srd005-live-helm-smoke R1.2, srd005-live-helm-smoke R1.3, srd005-live-helm-smoke R4.1, srd005-live-helm-smoke R4.2, srd005-live-helm-smoke R4.3, srd005-live-helm-smoke AC2, srd005-live-helm-smoke AC3]

out_of_scope:
  - Production model performance and GPU sizing.
  - Multi-node RWX and high availability.
  - Public ingress and authentication.

test_suite: test-rel06.0-live-helm-smoke

touchpoints:
  - id: T1
    target: srd005-live-helm-smoke R3.1
    reason: S1 traces this requirement in the existing success criteria.
  - id: T2
    target: srd005-live-helm-smoke R3.2
    reason: S2 traces this requirement in the existing success criteria.
  - id: T3
    target: srd005-live-helm-smoke R3.3
    reason: S3 traces this requirement in the existing success criteria.
  - id: T4
    target: srd005-live-helm-smoke R1.1, R1.2, R1.3
    reason: S4 traces this requirement in the existing success criteria.
  - id: T5
    target: srd005-live-helm-smoke R4.1, R4.2, R4.3
    reason: S4 traces this requirement in the existing success criteria.
