        test: TestExpandTargetBodyKindSelectsReplaceOrSplice
      - assertion: rig
        path: agent-core/internal/runtime/core/machine_template_test.go
        test: TestMachineTemplateCannotNestOrBeLoadedAsAMachine

  - id: R-CONF-001
    target: processor
    level: MUST
    statement: >-
      A conforming processor MUST accept every fixture file whose
      declared verdict is valid and MUST reject every fixture file whose
