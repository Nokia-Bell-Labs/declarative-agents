unit: catalog-applier-apply-declarations
imports:
- /opt/agent-core/tools/units/types-core.yaml
tools:
  - name: write_overrides
    type: builtin
    init: file_write
    category: word
    visibility: internal
    description: Write the caller-decided values document to the fixed workspace path used by application rollout words.
    parameters:
      type: object
      properties:
        path: {type: string, description: Workspace-local values path selected by the trusted request binding.}
        content: {type: string, description: Decided values content supplied by the caller.}
      required: [path, content]
    signature:
      output: builtin-types-core.Text
      emits: [ToolDone, ToolFailed]
    output:
      description: Plain-text values-file write confirmation.
    side_effects:
      - {kind: filesystem_write, target: workspace_file, description: Creates or replaces the values file read by the local rollout commands.}
    undo:
      strategy: workspace_restore
      description: Restore the workspace ref captured before the write.
    errors:
      - {signal: ToolFailed, condition: The values file cannot be written, message_shape: "write_overrides: <error>", state_after_failure: No rollout command runs.}
    relationships:
      before: [helm_dry_run]
