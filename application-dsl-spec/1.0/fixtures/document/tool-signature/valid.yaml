# Fixture for R-TOOL-005: a signature that alone states input and output and repeats the legacy emits exactly.
tools:
  - name: flatten_chunks
    type: builtin
    init: array_transform
    signature:
      input: chat-types.Sources
      output: chat-types.Rows
      emits: [ChunksFlattened, CommandError]
    emits: [ChunksFlattened, CommandError]
