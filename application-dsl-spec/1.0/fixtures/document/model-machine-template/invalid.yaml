# Fixture for R-MODEL-006: a machine-template whose body carries `unit`.
unit: check-template
params:
  - {name: word, type: string}
machine:
  unit: inner
  name: check
  initial_state: Ready
  states: [Ready, {name: Done, run_status: succeeded}]
  terminal_states: [Done]
  signals: [Seed]
  transitions:
    - {state: Ready, signal: Seed, next: Done, action: $param(word)}
