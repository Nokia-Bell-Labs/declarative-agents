    - {name: compose_pangram_candidate_request, owner: voice-critic, implementation: {type: builtin, factory: compose, reuse: Render the fixed private candidate submission body only after the consent predicate and original scan terminal status.}, inputs: [exact candidate bytes and hash], outputs: [declared Pangram text parameter and private-link setting], emits: [PangramCandidateRequestReady], infrastructure_errors: [none], domain_errors: [none], side_effects: [none], reversibility: {classification: reversible, undo: noop}, compensation: No candidate upload has occurred., authority: Emits one fixed signal and cannot select transport or credentials.}
    - name: pangram_submit_candidate
      owner: voice-critic
      implementation: {type: builtin, factory: rest_client_invoke, reuse: Configured authenticated POST /task operation.}
      inputs: [exact supplied candidate bytes and hash, affirmative consent bound to both hashes, configured timeout and request limit]
      outputs: [mapped task_id and candidate hash with secrets redacted]
      emits: [PangramCandidateSubmitted, PangramCandidateDenied, CommandError]
      infrastructure_errors: [REST config, credential resolution, network, authentication, timeout, response schema, or mapping failure]
      domain_errors: [configured 400, 401, 402, 413, 415, 422, or 429 status mapping]
      side_effects: [external_api]
      reversibility: {classification: irreversible, undo: none_for_upload}
      compensation: Upload cannot be recalled; retain bounded request identity and status.
      authority: Uploads only supplied candidate bytes after the exact-hash gate; no model-authored transport or credential value is accepted.
    - name: pangram_poll_candidate
      owner: voice-critic
      implementation: {type: builtin, factory: rest_client_invoke, reuse: "Configured authenticated GET /task/{task_id} operation."}
      inputs: [task_id from pangram_submit_candidate]
      outputs: [one mapped poll body and redacted request metadata]
      emits: [PangramCandidateObserved, PangramCandidatePollDenied, CommandError]
      infrastructure_errors: [REST config, credential resolution, network, timeout, response schema, or mapping failure]
      domain_errors: [configured 403 or 404 status mapping]
      side_effects: [external_api]
      reversibility: {classification: reversible, undo: noop}
      compensation: Read-only poll; the prior upload remains irreversible.
      authority: Polls only the task created for the exact candidate hash.
    - {name: compose_pangram_observation_input, owner: voice-critic, implementation: {type: builtin, factory: compose, reuse: Render one fixed helper envelope for an original or candidate poll body.}, inputs: [document kind and hash, mapped poll body, bounded poll count], outputs: [JSON object with one bounded stdin string], emits: [PangramObservationInputReady], infrastructure_errors: [none], domain_errors: [none], side_effects: [none], reversibility: {classification: reversible, undo: noop}, compensation: No state exists to compensate., authority: Emits one fixed signal.}
    - {name: interpret_pangram_observation, owner: voice-critic, implementation: {type: exec, factory: exec, reuse: Fixed interpret-pangram operation of the planned non-shell critic helper.}, inputs: [$from(pangram_observation_input).stdin], outputs: [bounded JSON status pending, completed, or failed plus documented fractions and paragraph-window evidence], emits: [ToolDone, ToolFailed, CommandError], infrastructure_errors: [selector, start, timeout, or helper failure], domain_errors: [unknown stage, malformed mapped body, or hash mismatch], side_effects: [child_process], reversibility: {classification: reversible, undo: noop}, compensation: No external state exists to compensate., authority: Interprets documented Pangram fields and cannot issue a critic verdict.}
    - {name: parse_pangram_observation, owner: voice-critic, implementation: {type: builtin, factory: parse_structured, reuse: Parse bounded observation-helper stdout.}, inputs: [$from(pangram_observation_raw).output], outputs: [validated advisory status and evidence], emits: [PangramObservationParsed, PangramObservationInvalid, CommandError], infrastructure_errors: [selector or normalized-output encoding failure], domain_errors: [malformed or schema-invalid helper stdout], side_effects: [none], reversibility: {classification: reversible, undo: noop}, compensation: Record explicit advisory failure., authority: Parses only the fixed observation schema.}
    - {name: pangram_observation_is_completed, owner: voice-critic, implementation: {type: builtin, factory: value_predicate, reuse: Compare status with completed.}, inputs: [$from(pangram_observation).status, configured literal completed], outputs: [one comparison record], emits: [PangramObservationCompleted, PangramObservationNotCompleted, CommandError], infrastructure_errors: [selector or coercion failure], domain_errors: [comparison false], side_effects: [none], reversibility: {classification: reversible, undo: noop}, compensation: No state exists to compensate., authority: Compares one validated scalar.}
    - {name: pangram_observation_is_pending, owner: voice-critic, implementation: {type: builtin, factory: value_predicate, reuse: Compare status with pending.}, inputs: [$from(pangram_observation).status, configured literal pending], outputs: [one comparison record], emits: [PangramObservationPending, PangramObservationFailed, CommandError], infrastructure_errors: [selector or coercion failure], domain_errors: [comparison false means schema-closed failed], side_effects: [none], reversibility: {classification: reversible, undo: noop}, compensation: No state exists to compensate., authority: Compares one validated scalar.}
    - {name: pangram_poll_budget_available, owner: voice-critic, implementation: {type: builtin, factory: value_predicate, reuse: Compare bounded poll count with configured hard limit.}, inputs: [$from(pangram_observation).poll_count, configured poll limit], outputs: [one comparison record], emits: [PangramPollRetryAllowed, PangramPollTimedOut, CommandError], infrastructure_errors: [selector or coercion failure], domain_errors: [comparison false], side_effects: [none], reversibility: {classification: reversible, undo: noop}, compensation: Timeout remains explicit advisory status., authority: Compares one validated scalar.}
    - {name: wait_pangram_poll, owner: voice-critic, implementation: {type: builtin, factory: delay, reuse: Fixed bounded cancellation-aware delay between Pangram polls.}, inputs: [configured duration only], outputs: [waited duration and deadline flag], emits: [PangramPollDelayElapsed, CommandError], infrastructure_errors: [cancellation or timer failure], domain_errors: [none], side_effects: [time_wait], reversibility: {classification: reversible, undo: noop}, compensation: Waiting changes no external state., authority: Duration and signal are fixed by ToolDef configuration; runtime and model output cannot alter them.}
    - {name: compose_pangram_scan_evidence, owner: voice-critic, implementation: {type: builtin, factory: compose, reuse: Copy one completed parsed observation into a document-kind-specific stable evidence step.}, inputs: [$from(pangram_observation) completed advisory record including document kind and hash], outputs: [fixed completed scan evidence envelope], emits: [PangramScanEvidenceReady], infrastructure_errors: [none], domain_errors: [none], side_effects: [none], reversibility: {classification: reversible, undo: noop}, compensation: No state exists to compensate., authority: Emits one fixed signal and cannot alter advisory values or verdict.}
    - {name: compose_pangram_consent_unavailable, owner: voice-critic, implementation: {type: builtin, factory: compose, reuse: Render one fixed no-upload envelope for both documents from validated non-granted consent.}, inputs: [$from(critic_request_report) consent_gate_status and both hashes], outputs: [both document statuses plus consent status], emits: [PangramUnavailableEvidenceReady], infrastructure_errors: [none], domain_errors: [none], side_effects: [none], reversibility: {classification: reversible, undo: noop}, compensation: No upload occurred., authority: Emits one fixed signal and cannot turn non-granted consent into acceptance.}
    - {name: compose_pangram_original_unavailable, owner: voice-critic, implementation: {type: builtin, factory: compose, reuse: Render one fixed original unavailable envelope from the immediately previous bounded failure result.}, inputs: [immediately previous bounded failure result, original hash], outputs: [original status unavailable and bounded reason], emits: [PangramUnavailableEvidenceReady], infrastructure_errors: [none], domain_errors: [none], side_effects: [none], reversibility: {classification: reversible, undo: noop}, compensation: Prior upload, if any, remains irreversible., authority: Emits one fixed signal and cannot fabricate favorable evidence.}
    - {name: compose_pangram_candidate_unavailable, owner: voice-critic, implementation: {type: builtin, factory: compose, reuse: Render one fixed candidate unavailable envelope from the immediately previous bounded failure result.}, inputs: [immediately previous bounded failure result, candidate hash], outputs: [candidate status unavailable and bounded reason], emits: [PangramUnavailableEvidenceReady], infrastructure_errors: [none], domain_errors: [none], side_effects: [none], reversibility: {classification: reversible, undo: noop}, compensation: Prior upload, if any, remains irreversible., authority: Emits one fixed signal and cannot fabricate favorable evidence.}
    - {name: compose_pangram_comparison_unavailable, owner: voice-critic, implementation: {type: builtin, factory: compose, reuse: Render one fixed comparison_failed envelope while retaining both scan records.}, inputs: [original and candidate evidence labels, immediately previous bounded comparison failure], outputs: [comparison_failed status and both retained scan statuses], emits: [PangramUnavailableEvidenceReady], infrastructure_errors: [none], domain_errors: [none], side_effects: [none], reversibility: {classification: reversible, undo: noop}, compensation: No state exists to compensate., authority: Emits one fixed signal and cannot read or alter the verdict.}
    - {name: compose_pangram_denied_comparison_input, owner: voice-critic, implementation: {type: builtin, factory: compose, reuse: Render one fixed comparison-helper envelope from the single consent-denied record that contains both document statuses.}, inputs: [$from(pangram_all_evidence) consent status and both hashes], outputs: [JSON object with one bounded stdin string], emits: [PangramComparisonInputReady], infrastructure_errors: [none], domain_errors: [none], side_effects: [none], reversibility: {classification: reversible, undo: noop}, compensation: No state exists to compensate., authority: Handles only the no-upload branch and emits one fixed signal.}
    - {name: compose_pangram_comparison_input, owner: voice-critic, implementation: {type: builtin, factory: compose, reuse: Render one fixed helper envelope from separate original and candidate advisory records.}, inputs: [original advisory status/evidence, candidate advisory status/evidence, both hashes], outputs: [JSON object with one bounded stdin string], emits: [PangramComparisonInputReady], infrastructure_errors: [none], domain_errors: [none], side_effects: [none], reversibility: {classification: reversible, undo: noop}, compensation: No state exists to compensate., authority: Emits one fixed signal.}
    - {name: compare_pangram_results, owner: voice-critic, implementation: {type: exec, factory: exec, reuse: Fixed compare-pangram operation of the planned non-shell critic helper.}, inputs: [$from(pangram_comparison_input).stdin], outputs: [bounded JSON comparison_status, separate statuses, fraction deltas, segment deltas, and mapping note], emits: [ToolDone, ToolFailed, CommandError], infrastructure_errors: [selector, start, timeout, or helper failure], domain_errors: [hash mismatch or malformed advisory record], side_effects: [child_process], reversibility: {classification: reversible, undo: noop}, compensation: Record explicit comparison unavailable status., authority: Computes advisory differences only; it cannot read or change the independent verdict.}
    - {name: parse_pangram_comparison, owner: voice-critic, implementation: {type: builtin, factory: parse_structured, reuse: Parse bounded comparison-helper stdout.}, inputs: [$from(pangram_comparison_raw).output], outputs: [validated advisory comparison], emits: [PangramComparisonParsed, PangramComparisonInvalid, CommandError], infrastructure_errors: [selector or normalized-output encoding failure], domain_errors: [malformed or schema-invalid helper stdout], side_effects: [none], reversibility: {classification: reversible, undo: noop}, compensation: Preserve explicit comparison unavailable status., authority: Parses advisory evidence and cannot route the verdict.}
    - {name: critic_verdict_is_pass, owner: voice-critic, implementation: {type: builtin, factory: value_predicate, reuse: Compare independently validated verdict with pass.}, inputs: [$from(critic_validation_report).verdict, configured literal pass], outputs: [one comparison record], emits: [CriticPassed, CriticNotPassed, CommandError], infrastructure_errors: [selector or coercion failure], domain_errors: [comparison false], side_effects: [none], reversibility: {classification: reversible, undo: noop}, compensation: No state exists to compensate., authority: Compares one validated scalar and does not read Pangram.}
    - {name: critic_verdict_is_warn, owner: voice-critic, implementation: {type: builtin, factory: value_predicate, reuse: Compare independently validated verdict with warn.}, inputs: [$from(critic_validation_report).verdict, configured literal warn], outputs: [one comparison record], emits: [CriticWarned, CriticRejected, CommandError], infrastructure_errors: [selector or coercion failure], domain_errors: [comparison false means schema-closed reject], side_effects: [none], reversibility: {classification: reversible, undo: noop}, compensation: No state exists to compensate., authority: Compares one validated scalar and does not read Pangram.}
    - {name: compose_critic_pass_response, owner: voice-critic, implementation: {type: builtin, factory: compose, reuse: Render one fixed pass response from independently validated findings plus advisory comparison.}, inputs: [critic validation report, Pangram comparison], outputs: [critic response schema], emits: [CriticResponsePassed], infrastructure_errors: [none], domain_errors: [none], side_effects: [none], reversibility: {classification: reversible, undo: noop}, compensation: No state exists to compensate., authority: Preserves the validated verdict and emits one fixed signal.}
    - {name: compose_critic_warn_response, owner: voice-critic, implementation: {type: builtin, factory: compose, reuse: Render one fixed warn response from independently validated findings plus advisory comparison.}, inputs: [critic validation report, Pangram comparison], outputs: [critic response schema], emits: [CriticResponseWarned], infrastructure_errors: [none], domain_errors: [none], side_effects: [none], reversibility: {classification: reversible, undo: noop}, compensation: No state exists to compensate., authority: Preserves the validated verdict and emits one fixed signal.}
    - {name: compose_critic_reject_response, owner: voice-critic, implementation: {type: builtin, factory: compose, reuse: Render one fixed reject response from independently validated findings plus advisory comparison.}, inputs: [critic validation report with exactly one responsible stage, Pangram comparison], outputs: [critic response schema], emits: [CriticResponseRejected], infrastructure_errors: [none], domain_errors: [none], side_effects: [none], reversibility: {classification: reversible, undo: noop}, compensation: No state exists to compensate., authority: Preserves the validated verdict and responsible stage and emits one fixed signal.}
    - {name: compose_critic_failed_response, owner: voice-critic, implementation: {type: builtin, factory: compose, reuse: Render one fixed failed response without a pass, warn, or reject verdict.}, inputs: [bounded failure category and evaluated identities when available], outputs: [failed critic response schema], emits: [CriticResponseFailed], infrastructure_errors: [none], domain_errors: [none], side_effects: [none], reversibility: {classification: reversible, undo: noop}, compensation: No state exists to compensate., authority: Cannot fabricate a verdict or responsible stage.}

  corpus_wrapper:
    - name: list_declared_corpus
      owner: corpus-ingest
      implementation: {type: builtin, factory: list_resource, reuse: Configured filesystem document-resource declaration.}
      inputs: [configured corpus resource name and optional configured prefix]
      outputs: [contained resource-relative entries and metadata]
      emits: [CorpusListed, CorpusResourceDenied, CommandError]
      infrastructure_errors: [root unavailable, scan failure]
      domain_errors: [unknown resource, traversal or extension denied]
      side_effects: [filesystem_read]
      reversibility: {classification: reversible, undo: noop}
      compensation: Read-only.
      authority: Root, include rules, extensions, symlink policy, and byte limits are profile configuration; runtime cannot replace them.

    - name: read_declared_corpus_document
      owner: corpus-ingest
      implementation: {type: builtin, factory: read_resource, reuse: Configured filesystem document-resource declaration.}
      inputs: [configured resource identity and resource-relative path from list_declared_corpus]
      outputs: [document bytes, content metadata, size, resource-relative path]
      emits: [CorpusDocumentRead, CorpusDocumentMissing, CorpusResourceDenied, CorpusDocumentInvalid, CommandError]
      infrastructure_errors: [filesystem or parser failure]
      domain_errors: [missing document, path/extension/size denied, invalid configured format]
      side_effects: [filesystem_read]
      reversibility: {classification: reversible, undo: noop}
      compensation: Read-only.
      authority: Reads only listed contained resources; no writing-saga path is configured.

    - name: invoke_canonical_corpus_ingest
      owner: corpus-ingest
      implementation: {type: builtin, factory: execute_task, reuse: Profile-only child invocation of the canonical catalog corpus-ingest profile.}
      inputs: [configured corpus resource, embedding endpoint/model, Chroma endpoint and one declared collection identity, administrative run identity]
      outputs: [ingest status, bounded counts, model and collection provenance]
      emits: [ExecutionDone, ExecutionFailed, CommandError]
      infrastructure_errors: [profile missing, process start, embedding, Chroma, timeout, or transport failure]
      domain_errors: [no eligible documents, invalid configured corpus record]
      side_effects: [child_agent_execution, external_api]
      reversibility: {classification: compensatable, undo: rebuild_declared_collection}
      compensation: Rebuild the one declared collection from the trusted corpus; never modify source files or saga workproducts.
      authority: Invokes only the canonical profile with configured resources and one collection; cannot access GitHub, Pangram, or writing sagas.

  lifecycle:
    - name: suspend_saga_for_operator
      owner: workflow-orchestrator
      implementation: {type: builtin, factory: suspend, reuse: Agent-core lifecycle approval gate.}
      inputs: [bounded reason enum, saga ID, manifest revision, conflict identities]
      outputs: [configured bounded suspension reason]
      emits: [AwaitApproval, CommandError]
      infrastructure_errors: [required checkpoint save or resume failure]
      domain_errors: [operator aborts or supplies a decision inconsistent with current revision]
      side_effects: [human_boundary, state_mutation]
      reversibility: {classification: compensatable, undo: resume_or_abort}
      compensation: Resume from persisted state or terminate without rewriting workproducts.
      authority: Pauses only the current saga; operator input is validated and cannot inject tools or authority.

    - name: inspect_saga_checkpoint
      owner: workflow-orchestrator
      implementation: {type: builtin, factory: checkpoint_history, reuse: Agent-core checkpoint history reader.}
      inputs: [current run ID or configured latest selector]
      outputs: [runtime execution history digest and artifact references]
      emits: [ToolDone, CommandError]
      infrastructure_errors: [checkpoint backend unavailable or run unresolved]
      domain_errors: [none]
      side_effects: [state_read]
      reversibility: {classification: reversible, undo: noop}
      compensation: Read-only.
      authority: Reads runtime metadata and references only; does not read or embed artifact bodies.

    - name: rollback_saga_checkpoint
      owner: workflow-orchestrator
      implementation: {type: builtin, factory: checkpoint_rollback, reuse: Agent-core DB-only rollback and receipt replay.}
      inputs: [operator-approved run ID and target step]
      outputs: [target step, reverted entry count, skipped irreversible effects]
      emits: [ToolDone, CommandError]
      infrastructure_errors: [target resolution, Dolt Revert, or receipt replay failure]
      domain_errors: [target invalid or conflicts with authoritative manifest revision]
      side_effects: [state_mutation, child_tool_execution]
      reversibility: {classification: compensatable, undo: operator_selects_new_state}
      compensation: Reconcile against append-only manifest; never claim to delete or restore saga files, GitHub effects, model calls, retrieval, or Pangram uploads.
      authority: Changes agent-core runtime state only after operator approval.

    - name: exit_prose_editor_run
      owner: workflow-orchestrator
      implementation: {type: builtin, factory: exit_agent, reuse: Agent-core finite lifecycle exit.}
      inputs: [terminal status, manifest revision, redacted reason]
      outputs: [drain and exit status]
      emits: [AgentExited, CommandError]
      infrastructure_errors: [server drain or checkpoint failure]
      domain_errors: [terminal status not allowed by manifest state]
      side_effects: [state_mutation]
      reversibility: {classification: irreversible, undo: restart_and_reconcile}
      compensation: Restart loads and reconciles the durable saga; exit does not mutate artifacts.
      authority: Terminates only the current run after a valid terminal manifest state.

requirements:
  R1:
    title: Closed vocabulary and factory reuse
    items:
      - id: R1.1
        text: |
          Every planned machine action that crosses a workproduct, child-agent,
          retrieval, model, GitHub, Pangram, corpus, or lifecycle boundary SHALL
          select exactly one named word from word_vocabulary.
        evidence: Planned machine-action closure tests reject an unnamed action or a selected word absent from the owning profile.
      - id: R1.2
        text: |
          Every word SHALL declare owner, factory reuse, inputs, outputs,
          emitted signals, infrastructure errors, domain errors, side effects,
          reversibility, compensation, and authority.
        evidence: Structural validation checks every word_vocabulary entry for all contract fields.
      - id: R1.3
        text: |
          Prose Editor SHALL reuse the existing builtin, REST, invoke_llm,
          execute_task, lifecycle, and exec factories. It SHALL NOT require a
          new Go builtin, REST adapter, child-agent factory, or lifecycle
          factory. Orchestrator exec words SHALL fix operations of a planned
          constrained non-shell helper executable; the helper is an application
          executable, not an agent-core factory.
        evidence: Planned declarations resolve only factory_reuse.factories and generic exec declarations whose binaries and operation args are fixed to the planned helper.
      - id: R1.4
        text: |
          No Prose Editor profile SHALL expose arbitrary shell, generic
          executable selection, generic REST URL selection, generic filesystem
          mutation, unconstrained git or gh authority, or runtime helper
          operation selection.
        evidence: Planned profile-closure tests reject shell interpreters, command-string parameters, runtime binaries, helper operation parameters, runtime URLs/refspecs/credentials, and generic write/git/gh words.

  R2:
    title: Orchestrator workproduct and child words
    items:
      - id: R2.1
        text: |
          Only workflow-orchestrator SHALL select validate_saga_request,
          read_workproduct, hash_workproduct, write_original, write_attempt,
          append_manifest_revision, project_manifest, and
          materialize_final_chain.
        evidence: Planned authority tests deny these words to every child and corpus profile.
      - id: R2.2
        text: |
          Workproduct mutation words SHALL derive contained paths from the
          configured saga root, saga identity, stage, attempt, and computed
          digest and SHALL implement the atomic write, fsync, immutability, and
          recovery contract in srd002. Workproduct read, hash, mutation,
          manifest, and finalization exec words SHALL invoke explicitly
          JSON-emitting fixed helper operations; exec structured mode SHALL only
          wrap that JSON string and exit code.
        evidence: Planned path, fault-injection, torn-write, hash, and immutable-conflict tests cover every mutation word.
      - id: R2.3
        text: |
          The orchestrator SHALL invoke specialist-editor:structure,
          specialist-editor:voice, specialist-editor:style, and voice-critic
          only through their four named
          profile-only child words. Requests SHALL carry bytes and identities
          and SHALL NOT carry workspace paths. Each child word SHALL retain only
          execute_task's ExecutionDone, ExecutionFailed, and CommandError
          signals. ExecutionDone output SHALL pass through the child-specific
          parse_structured word and explicit verdict or outcome predicates.
        evidence: Planned request schemas and profile tests reject path fields and any child filesystem ToolDef.
      - id: R2.4
        text: |
          A child success signal SHALL NOT accept an artifact. The orchestrator
          SHALL validate returned bytes or critique data, parent identities,
          hashes, schema, and provenance before write_attempt and manifest
          selection.
        evidence: Planned malformed, missing-output, wrong-parent, wrong-hash, and equivocation tests preserve the prior parent.
      - id: R2.5
        text: |
          project_manifest SHALL emit only ToolDone, ToolFailed, or CommandError
          and bounded structured stdout containing validated manifest scalars.
          parse_manifest_projection SHALL validate that result. Distinct fixed
          value_predicate words SHALL compare one scalar at a time to produce
          every srd004 request, stage, critic, retry, recovery, publication, and
          terminal route. No word SHALL inspect prose, invoke a model, alter a
          verdict, or select a stage absent from the manifest.
        evidence: Planned declaration and transition-closure tests reject custom project_manifest signals, omitted parses, multi-comparison predicates, undeclared routes, and prose-derived routes.

  R3:
    title: Constrained GitHub publication
    items:
      - id: R3.1
        text: |
          Only workflow-orchestrator SHALL select the source and publication
          git/gh words. Source resolution, fetch, and blob read SHALL use one
          allowlisted configured repository and validated human revision/path.
        evidence: Planned authority and negative-input tests deny GitHub words elsewhere and reject runtime URL, refspec, directory, and credential overrides.
      - id: R3.2
        text: |
          Branch, stage, commit, push, and pull-request creation SHALL each have
          a distinct word and SHALL be preceded or followed as applicable by
          git_check_publication, gh_find_pull_request, gh_verify_pull_request,
          or equivalent named identity checks in this vocabulary. Every git and
          gh exec SHALL emit only ToolDone, ToolFailed, or CommandError; a
          distinct operation-specific parse_structured word and visible
          one-scalar predicate chain SHALL route valid multi-way stdout. Every
          such exec SHALL run a fixed JSON-emitting helper operation that safely
          invokes one fixed git/gh argv shape; no parser SHALL consume raw
          git/gh output.
        evidence: Planned helper argv, JSON stdout, exec-wrapper, parser-source, crash, and uncertain-completion tests converge on one branch, commit, pushed ref, and pull request.
      - id: R3.3
        text: |
          Publication words SHALL consume only configured or manifest-recorded
          destination, base, branch, tree, commit, and pull-request identities.
          Force push, remote ref deletion, automatic PR closure, and destructive
          remote compensation SHALL be absent. Runtime values SHALL NOT select
          the helper binary or operation, a git/gh subcommand, URL, refspec
          shape, or credential source.
        evidence: Planned declaration inspection and remote-conflict tests block instead of rewriting remote state.

  R4:
    title: Corpus-scoped retrieval and model words
    items:
      - id: R4.1
        text: |
          Each specialist-editor stage SHALL own one embedding word, one
          corpus-specific RAG query word, and one generation word. The structure
          stage SHALL also own the deterministic validation and
          query-formulation words, constrained grounding and preservation
          helper words, structured-report parsers, single-comparison routing
          words, a fixed edit-context composer, and fixed-outcome response
          composers required by its flat MachineSpec. The voice stage SHALL
          also own the deterministic request-validation,
          rhetorical-role/register query-formulation, constrained helper
          observation, structured-report parsing, single-comparison routing,
          and fixed-outcome response-composition words required by its flat
          MachineSpec. The style stage SHALL also own deterministic request
          validation, intent and query composition, three constrained helper
          observations, structured-report parsing, single-comparison routing,
          branch-specific edit-context composition, and fixed-outcome response
          composition required by its flat MachineSpec.
          voice-critic SHALL own its request validation, independent query and
          voice-rag retrieval, fixed evaluation context, raw model evaluation,
          structured parsing, fixed cross-field validation, one-scalar routing,
          Pangram advisory handling, and fixed response words.
        evidence: Planned profile manifests collectively match word_vocabulary.editor_and_critic_retrieval, and each profile selects only words it owns.
      - id: R4.2
        text: |
          Embedding words SHALL obtain vectors from configured provider
          responses. RAG words SHALL consume those vectors through validated
          previous-result or command-state selectors. No human or model output
          SHALL author a vector.
        evidence: Planned wiring and adversarial-output tests prove vector provenance and reject literal or model-returned vectors.
      - id: R4.3
        text: |
          specialist-editor:structure, specialist-editor:voice,
          specialist-editor:style, and voice-critic SHALL query only
          structure-rag, voice-rag, tightening-rag, and voice-rag
          respectively, and all editing-run RAG operations SHALL be read-only.
        evidence: Planned REST config and profile-closure tests enforce endpoint and operation bindings and expose no collection mutation.
      - id: R4.4
        text: |
          invoke_llm words SHALL return only content, declared enum values,
          bounded findings, feedback, and evidence references. Model output
          SHALL NOT supply URLs, paths, refs, vectors, credentials, model names,
          collection identities, tool names, or publication authority.
        evidence: Planned schemas, prompts, parse tests, and adversarial model fixtures reject authority-bearing fields.
      - id: R4.5
        text: |
          compose_structure_grounding_input and
          compose_structure_constraint_input SHALL each render one fixed bounded
          JSON envelope whose stdin field contains the helper document and emit
          one configured signal.
          inspect_structure_grounding and inspect_structure_constraints SHALL
          be constrained non-shell exec words with fixed binary and operation,
          fixed stdin_source selecting the compose envelope's stdin string,
          fixed stdin_max_bytes, structured output mode, and only ToolDone,
          ToolFailed, or CommandError emissions. Their
          parse_structured successors SHALL emit one configured parsed or
          invalid outcome plus CommandError. Every value_predicate successor
          SHALL compare exactly one parsed scalar with one configured scalar and
          emit exactly two configured outcomes plus CommandError.
          compose_structure_edit_context SHALL render one fixed model context
          from labeled validated state and emit only StructureEditContextReady.
          Separate compose_structure_success_response,
          compose_structure_no_op_response,
          compose_structure_insufficient_response, and
          compose_structure_failed_response words SHALL each render one fixed
          outcome and emit only its one configured response signal. These words
          and signals SHALL supply every srd005 branch without a payload guard,
          dynamic dispatch, new Go builtin, or shell.
        evidence: Planned factory-semantic, action, word, signal, label, transition, and terminal closure expands the srd005 machine and matches every action to the exact emissions of exec, parse_structured, value_predicate, invoke_llm, REST, or compose.
      - id: R4.6
        text: |
          inspect_voice_anchors, inspect_voice_constraints, and
          inspect_voice_copy_risk SHALL be constrained non-shell exec words over
          bounded JSON stdin and SHALL emit only ToolDone, ToolFailed, or
          CommandError. Their three parse_structured successors SHALL emit one
          configured parsed or invalid outcome plus CommandError. Every
          value_predicate successor SHALL perform exactly one scalar comparison
          and emit exactly two configured outcomes plus CommandError. Separate
          initial, constraint-retry, and copy-risk-retry compose words SHALL
          each render one branch-specific model context and emit one configured
          context signal so generate_voice_edit always consumes the immediately
          previous Result. Separate
          compose_voice_success_response, compose_voice_no_op_response,
          compose_voice_insufficient_response, and compose_voice_failed_response
          words SHALL each emit only its one configured response signal. These
          words and signals SHALL supply every branch needed by the srd005
          voice stage without a payload guard, dynamic dispatch, new Go
          builtin, or shell.
        evidence: Planned factory-semantic, signal, and transition closure expands the srd005 voice-stage machine and matches every action to the exact emissions of exec, parse_structured, value_predicate, invoke_llm, REST, or compose.
      - id: R4.7
        text: |
          identify_style_intents, assess_style_pairs, and
          inspect_style_constraints SHALL be constrained non-shell exec words
          over bounded JSON stdin and SHALL emit only ToolDone, ToolFailed, or
          CommandError. Their parse_structured successors SHALL emit one
          configured parsed or invalid outcome plus CommandError. Every
          value_predicate successor SHALL compare exactly one scalar and emit
          exactly two configured outcomes plus CommandError. Initial and retry
          edit-context compose words SHALL each render one fixed context and one
          configured signal. Separate success, no-intent, candidate-no-op,
          insufficient-pairs, and failed response compose words SHALL each
          render one fixed outcome and emit only one configured response signal.
          These words SHALL supply every srd005 style-stage branch without
          payload guards, dynamic dispatch, a shell, or a new Go builtin.
        evidence: Planned factory-semantic, action, word, signal, transition, terminal, label, and authority closure expands the srd005 style-stage machine and matches exact exec, parse_structured, value_predicate, compose, REST, and invoke_llm emissions.
      - id: R4.8
        text: |
          voice-critic complex request, evaluation, Pangram-stage, and advisory
          comparison observations SHALL use fixed operations of a planned
          non-shell JSON helper. Each exec SHALL emit only ToolDone, ToolFailed,
          or CommandError and SHALL be followed by parse_structured. Every
          critic value_predicate SHALL compare one scalar and emit exactly two
          configured outcomes plus CommandError. evaluate_voice_candidate SHALL
          emit only LLMResponded or CommandError; its raw JSON SHALL pass through
          parsing and deterministic cross-field validation before verdict
          routing. Every compose word SHALL render one fixed context, request,
          helper input, advisory status, or response and emit one fixed signal.
          wait_pangram_poll SHALL use the existing delay factory with one fixed
          positive duration and emit only PangramPollDelayElapsed or
          CommandError.
        evidence: Planned factory-semantic, action, word, signal, transition, terminal, label, consent-dominance, independence, advisory-only, responsible-stage, bounded-cycle, and authority closure expands srd008.

  R5:
    title: Pangram privacy and consent
    items:
      - id: R5.1
        text: |
          Only voice-critic SHALL select check_pangram_consent, the fixed
          Pangram request composers, pangram_submit_original,
          pangram_poll_original, pangram_submit_candidate,
          pangram_poll_candidate, and their advisory interpretation and
          comparison words. Each submit SHALL require affirmative consent bound
          to the exact original and candidate hashes.
        evidence: Planned owner and consent tests cover granted, denied, absent, expired, and hash-mismatched consent.
      - id: R5.2
        text: |
          Pangram URL, route, credentials, timeout, size limits, redirect
          policy, and network allowlist SHALL be trusted configuration. Scan
          requests and diagnostics SHALL redact credentials and SHALL NOT persist
          unbounded response or request bodies.
        evidence: Planned REST validation, timeout, size, redirect, redaction, and credential-leak tests enforce the boundary.
      - id: R5.3
        text: |
          Original and candidate submissions SHALL be separate irreversible
          upload words and task polls SHALL be separate read-only words. Their
          privacy effect, task identity, per-document status, and comparison
          status SHALL be recorded. REST words SHALL emit only configured HTTP
          status-mapping signals or CommandError; helper, parser, and scalar
          predicate chains SHALL interpret asynchronous task stages. No result,
          movement, absence, or failure SHALL determine or alter the critic
          verdict.
        evidence: Planned retry and verdict tests preserve upload evidence, avoid false undo, and require independent finding categories.

  R6:
    title: Corpus wrapper and lifecycle
    items:
      - id: R6.1
        text: |
          corpus-ingest SHALL use list_declared_corpus and
          read_declared_corpus_document for configured source access and
          invoke_canonical_corpus_ingest for profile-only canonical behavior
          reuse outside writing sagas.
        evidence: Planned wrapper profile names only these words and resolves the canonical catalog profile without a fork.
      - id: R6.2
        text: |
          Corpus roots, include rules, extensions, models, endpoints, and
          collections SHALL be configuration-owned. The wrapper SHALL NOT
          select workproduct, GitHub, editing, criticism, or Pangram words.
        evidence: Planned resource and profile-closure tests deny traversal, cross-collection writes, and cross-domain tools.
      - id: R6.3
        text: |
          Lifecycle words SHALL reuse suspend, checkpoint_history,
          checkpoint_rollback, and exit_agent. Checkpoint rollback SHALL remain
          DB-only plus receipt replay and SHALL reconcile against the
          append-only manifest without claiming filesystem or remote reversal.
          suspend_saga_for_operator SHALL emit only AwaitApproval or
          CommandError; inspect_saga_checkpoint and rollback_saga_checkpoint
          SHALL emit only ToolDone or CommandError; exit_prose_editor_run SHALL
          emit only AgentExited or CommandError. Operator resolution and abort
          are validated resume/event signals, not suspend emissions.
        evidence: Planned suspend, restart, rollback, and manifest-reconciliation tests preserve all saga bytes and report irreversible effects.

  R7:
    title: Signals, errors, and planned status
    items:
      - id: R7.1
        text: |
          Every word SHALL distinguish CommandError infrastructure failure from
          named domain outcomes. Infrastructure failure SHALL NOT become editor
          success, critic pass/warn/reject, consent, finalization, or publication.
        evidence: Planned failure injection checks each declared infrastructure_errors and domain_errors path.
      - id: R7.4
        text: |
          Every orchestrator parser and predicate $from selector SHALL address
          an explicit stable MachineSpec transition label. Producer output SHALL
          cross command state's recognized applied redaction boundary and SHALL
          remain receipt-blind. Unresolved, unavailable, non-object, missing-path,
          or wrong-type selection SHALL emit CommandError and SHALL NOT take a
          domain-negative branch.
        evidence: Planned label, redaction, selector, restart-rehydration, and malformed-output traces exercise every orchestrator command-state edge.
      - id: R7.2
        text: |
          Remote model, embedding, retrieval, Pangram, push, and PR effects
          SHALL be recorded as observations or forward-only effects and SHALL
          NOT claim false undo. Local immutable workproduct compensation SHALL
          append status or repair projections rather than delete evidence.
        evidence: Planned receipt and compensation tests match every word's reversibility and compensation fields.
      - id: R7.3
        text: |
          This SRD SHALL remain specified while profiles, machines, ToolDefs,
          orchestrator/workproduct helper executable, REST definitions,
          services, tests, and executable evidence remain planned.
        evidence: Architecture, specification index, roadmap, and implementation_status agree.

non_goals:
  - Implement ToolDefs, profiles, machines, REST definitions, helper executables, services, or tests.
  - Add a Go builtin, application-local REST adapter, shell interpreter, or generic command tool.
  - Define transition order, retry routing, or full state tables owned by srd004 through srd008.
  - Change the canonical corpus-ingest or RAG server implementation.
  - Give editors or the critic a saga filesystem, GitHub, or collection-write capability.
  - Make Pangram mandatory or authoritative for acceptance.
  - Claim remote inference, uploads, pushes, or pull requests can be erased by rollback.

acceptance_criteria:
  - id: AC1
    criterion: |
      The closed vocabulary names every planned boundary action, every word has
      the complete contract fields, existing factories are reused, and no new
      Go builtin or arbitrary shell authority is required; every orchestrator
      helper operation and its JSON stdout contract remain explicitly planned.
    traces: [R1.1, R1.2, R1.3, R1.4]
  - id: AC2
    criterion: |
      Only the orchestrator owns contained workproduct words and four
      path-free child invocations; immutable writes and parsed child responses
      obey srd002 acceptance and recovery rules, and parsed manifest projection
      scalars feed explicit deterministic predicate chains for the flat
      orchestrator.
    traces: [R2.1, R2.2, R2.3, R2.4, R2.5]
  - id: AC3
    criterion: |
      Source capture and create-or-reuse publication use distinct constrained
      git/gh words backed by fixed JSON-emitting non-shell helper operations,
      fixed exec signals, explicit result parsing and scalar routing,
      configuration-owned authority, identity checks, and forward-only remote
      conflict handling.
    traces: [R3.1, R3.2, R3.3]
  - id: AC4
    criterion: |
      Editor and critic embedding, RAG, and LLM words are corpus-scoped,
      read-only where required, vector provenance is machine-threaded, and
      model output cannot author authority-bearing values. Specialist-editor
      structure, voice, and style stage deterministic words provide bounded
      retrieval refinement, candidate retry, validation, copy-risk or
      pair-provenance routing, and fixed responses without payload guards.
      Specialist report helpers, parsers, scalar predicates, context composers,
      and fixed response composers match their actual factory signal semantics.
    traces: [R4.1, R4.2, R4.3, R4.4, R4.5, R4.6, R4.7, R4.8]
  - id: AC5
    criterion: |
      Only the critic owns separate before/after Pangram scans; exact-hash
      consent, configured privacy controls, redaction, irreversible upload
      semantics, and advisory-only results are explicit.
    traces: [R5.1, R5.2, R5.3]
  - id: AC6
    criterion: |
      The corpus wrapper reuses configured resource words and canonical child
      behavior, lifecycle words retain their existing boundaries, and neither
      wrapper nor rollback escapes its authority.
    traces: [R6.1, R6.2, R6.3]
  - id: AC7
    criterion: |
      Infrastructure errors and domain outcomes remain distinct, command-state
      routing is labeled, redacted, receipt-blind, and fail-closed, all effects
      have honest compensation, and documentation reports runtime as planned.
    traces: [R7.1, R7.2, R7.3, R7.4]

