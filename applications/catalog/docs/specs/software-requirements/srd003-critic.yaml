id: srd003-critic
title: Critic Functional Block

context: |
  The critic family provides two canonical modes. Its benchmark profile is an
  evaluation session and point runner: it parses a suite, expands points, runs
  a nested point machine, and reports session outcomes. Its changed-workspace
  profile evaluates an existing candidate in place and writes an explicit gate
  verdict without launching a coding agent. This SRD owns the critic family
  requirements that srd001-agent-functional-blocks previously held as block R3.

  The block names the contract the critic presents to the rest of the profile
  system. Nested loop execution stays in agent-core; the suites and samples stay
  profile-owned.

problem: |
  The critic family needs its own requirements document so that changes to
  critic behavior do not churn a shared cross-family file. The requirements
  must name profile-owned suites and samples separately from the agent-core
  nested loop runtime.

goals:
  - G1: Model the critic profile as a configured session and point runner functional block.
  - G2: Record the critic actor boundary, inputs, tool selections, runtime dependencies, outputs, and terminal outcomes.
  - G3: Keep suites and samples profile-owned while agent-core supplies nested loop execution.
  - G4: Evaluate an existing changed workspace and expose an application-neutral accepted or rejected verdict.

requirements:
  R1:
    title: Behavior model
    items:
      - R1.1: The critic profile must model a deterministic session pipeline that parses a suite, expands evaluation points, runs a nested point machine, and reports session outcomes.
      - R1.2: The critic point machine must prepare an isolated point workspace, invoke a configured agent profile, run oracle checks, and collect trace, version, summary, and metric outputs.
      - R1.3: The changed-workspace critic mode must evaluate the supplied workspace in place, branch on the declared oracle result, and must not copy a baseline sample or launch a child coding agent.
  R2:
    title: Inputs, tools, and runtime dependencies
    items:
      - R2.1: Benchmark-mode critic inputs must include a suite YAML, samples, a model or profile grid, and an oracle command.
      - R2.2: The benchmark profile must select the critic session, critic point, and child profile execution tool families.
      - R2.3: Critic dependencies must name profile-owned suites and samples as inputs while agent-core supplies nested loop execution.
      - R2.4: Changed-workspace inputs must include the candidate through the runtime directory binding and a profile-declared oracle whose ToolDone and ToolFailed signals select acceptance and rejection respectively.
  R3:
    title: Outputs and outcomes
    items:
      - R3.1: Critic outputs must include point directories, oracle results, trace token counts, metrics, and a session report.
      - R3.2: Critic terminal outcomes must be Done or Failed.
      - R3.3: Changed-workspace output must include critic-verdict.json with a versioned, machine-readable accepted or rejected verdict and the oracle command and status that selected it; session completion alone must never imply acceptance.

non_goals:
  - Define Go package APIs for the agent-core nested loop runtime.
  - Reimplement the point loop or oracle execution in agent-profiles.
  - Own cross-profile dependency-direction invariants; those stay in srd001.
  - Select an application-specific Succeeded or Failed outcome; consuming applications map the canonical critic verdict.

acceptance_criteria:
  - id: AC1
    criterion: The critic profile is described as a configured session and point pipeline rather than a Go package.
    traces: [R1.1, R1.2]
  - id: AC2
    criterion: Critic inputs, selected tool families, and runtime dependencies are named and separated from agent-core runtime capability.
    traces: [R2.1, R2.2, R2.3]
  - id: AC3
    criterion: Critic outputs and terminal outcomes are checkable by mounted execution or integration targets.
    traces: [R3.1, R3.2]
  - id: AC4
    criterion: The canonical changed-workspace profile accepts a conforming candidate, rejects a non-conforming candidate, and records each decision in critic-verdict.json without a child agent.
    traces: [R1.3, R2.4, R3.3]

depends_on:
  - srd_id: srd001-agent-functional-blocks
    symbols_used: [R1]

diagrams:
  requirements_trace: |
    ```mermaid
    flowchart LR
      Problem["Problem: Critic family needs its own requirements..."] --> Goals["Goals: Critic Functional Block"]
      Goals --> R1["R1: Behavior model"]
      Goals --> R2["R2: Inputs, tools, and runtime dependencies"]
      Goals --> R3["R3: Outputs and outcomes"]
      R1 --> AC1["AC1: Configured session and point pipeline"]
      R2 --> AC2["AC2: Inputs, tools, dependencies named"]
      R3 --> AC3["AC3: Outputs and outcomes checkable"]
      R1 --> AC4["AC4: Existing candidate evaluated in place"]
      R2 --> AC4
      R3 --> AC4
    ```
