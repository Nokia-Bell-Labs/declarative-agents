        - {from: checking_candidate_completed, on: CommandError/BudgetExhausted, to: composing_candidate_unavailable, action: compose_candidate_unavailable, label: pangram_candidate_evidence}
        - {from: checking_candidate_pending, on: CommandError/BudgetExhausted, to: composing_candidate_unavailable, action: compose_candidate_unavailable, label: pangram_candidate_evidence}
        - {from: checking_candidate_poll_budget, on: CommandError/BudgetExhausted, to: composing_candidate_unavailable, action: compose_candidate_unavailable, label: pangram_candidate_evidence}
        - {from: waiting_candidate_poll, on: CommandError/BudgetExhausted, to: composing_candidate_unavailable, action: compose_candidate_unavailable, label: pangram_candidate_evidence}
      compose_budget_to_failed:
        - All compose states route independently injected BudgetExhausted to failed without invoking another boundary action.
      terminal_response:
        - {from: composing_failed_response, on: CriticResponseFailed, to: failed, action: none}

  factory_constraints:
    exec: |
      validate_critic_request, validate_critic_evaluation,
      interpret_pangram_observation, and compare_pangram_results each fix one
      operation of a planned non-shell JSON helper, fixed stdin limits, fixed
      structured output, no runtime args, and emit only ToolDone, ToolFailed,
      or CommandError. Structured mode wraps stdout under output with exit_code.
    invoke_llm: |
      evaluate_voice_candidate emits only LLMResponded or CommandError. Its raw
      output is not a verdict until parse_critic_evaluation and the fixed
      validator helper succeed.
    rest: |
      Each REST word uses rest_client_invoke. Its non-error signals come only
      from configured HTTP success or failure status mappings. Submit operations
      map POST /task responses; poll operations map GET /task/{task_id}
      responses. REST does not inspect Pangram stage values or invent completed,
      failed, pending, score, or verdict signals. The helper, parser, and scalar
      predicate chain performs stage interpretation.
    parse_structured: |
      Each parser selects one string from an explicit stable label, emits its
      configured parsed or invalid signal, and emits CommandError only when
      selection or normalized output encoding fails.
    value_predicate: |
      Each predicate selects one validated scalar, performs one configured
      comparison, and emits exactly two configured outcomes plus CommandError.
    delay: |
      wait_pangram_poll fixes a positive duration and configured
      PangramPollDelayElapsed signal. It emits only that signal or CommandError
      on cancellation; runtime input cannot select the duration.
    compose: |
      Each compose word has one fixed template and one fixed configured signal.
      Compose does not emit CommandError; planned label validation must prove
      every selector resolves. An unresolved selector is recorded on Result and
      cannot be treated as valid runtime behavior.

structural_proofs:
  critic_independence:
    cut_state: composing_evaluation_context
    argument: |
      The only incoming path follows request validation and a critic-owned
      voice-rag query. The request schema rejects editor reasoning and the
      selected profile exposes no editor conversation, checkpoint, filesystem,
      workproduct, or child-invocation word. The fixed context composer selects
      only validated request and critic retrieval labels. Pangram has not run.
  consent_dominance:
    upload_states: [submitting_original, submitting_candidate]
    dominator: checking_consent
    required_signal: PangramConsentGranted
    argument: |
      Every graph path to either submit state passes through checking_consent.
      The granted signal comes from one scalar comparison over helper-validated
      consent_gate_status. The helper first proves exact bytes and both consent
      hashes match. Non-granted and fault paths have no upload edge.
  advisory_only:
    verdict_source: $from(critic_validation_report).verdict
    prohibited_sources:
      - $from(pangram_original_evidence)
      - $from(pangram_candidate_evidence)
      - $from(pangram_comparison)
    argument: |
      Independent model evaluation, schema parsing, and deterministic validation
      complete before consent routing. Pangram comparison runs afterward. Both
      verdict predicates select only critic_validation_report.verdict. Response
      composers add Pangram evidence after the pass, warn, or reject branch is
      fixed and cannot alter the validated fields.
  responsible_stage_closure:
    allowed_stages: [structure, voice, style]
    argument: |
      The validation helper rejects a reject with zero, null, multiple, or
      unknown responsible stages and rejects pass or warn with a non-null stage.
      critic_verdict_is_warn reaches the reject composer only through the
      schema-closed reject alternative. That composer copies the one validated
      stage. No semantic stage, Pangram stage, critic stage, or free-form stage
      exists.
  bounded_cycles:
    cycles:
      - polling_original -> composing_original_observation_input -> interpreting_original_observation -> parsing_original_observation -> checking_original_completed -> checking_original_pending -> checking_original_poll_budget -> waiting_original_poll -> polling_original
      - polling_candidate -> composing_candidate_observation_input -> interpreting_candidate_observation -> parsing_candidate_observation -> checking_candidate_completed -> checking_candidate_pending -> checking_candidate_poll_budget -> waiting_candidate_poll -> polling_candidate
    argument: |
      The helper validates and increments one poll count. The budget predicate
      permits re-entry only below sixty. At the limit it emits timed_out and
      leaves the cycle through explicit unavailable evidence. Machine iteration,
      duration, and token limits remain independent finite bounds.
  authority_closure:
    argument: |
      Every action maps to one voice-critic-owned srd003 word. The profile has
      one read-only voice-rag path, bounded model inference, four fixed helper
      operations, deterministic parse/predicate/compose words, and configured
      Pangram REST operations. It has no editing, filesystem, workproduct,
      GitHub, child, lifecycle, corpus-write, generic shell, or arbitrary REST
      word. The helper has no shell or runtime operation selector.

requirements:
  R1:
    title: Flat machine and exact factory semantics
    items:
      - id: R1.1
        text: |
          The planned voice-critic MachineSpec SHALL use exactly the states,
          signals, labels, transitions, actions, budgets, and four terminals in
          flat_machine_contract. It SHALL contain no nested machine, payload
          guard, dynamic dispatch, script, shell, or hidden router.
        evidence: Planned graph expansion reports no duplicate, missing, unreachable, unused, or terminal-origin transition.
      - id: R1.2
        text: |
          Every action SHALL map to one critic-owned srd003 word. Exec,
          invoke_llm, REST, parse_structured, value_predicate, delay, and compose
          words SHALL retain the exact factory behavior in factory_constraints.
        evidence: Planned factory, action, word, signal, transition, terminal, label, and authority closure compares declarations with agent-core code and builtin declarations.

  R2:
    title: Immutable request and critic independence
    items:
      - id: R2.1
        text: |
          validate_critic_request SHALL accept only the immutable original and
          selected style candidate bytes, artifact identities, exact hashes,
          target voice, bounded policy, invocation identity, and consent record.
          It SHALL reject path-bearing, authority-bearing, or editor-reasoning
          fields and every byte/hash or stage mismatch.
        evidence: Planned request fixtures cover valid identities, changed bytes, wrong hashes, wrong stage, path, endpoint, credential, tool, editor prompt, reasoning, conversation, confidence, and verdict recommendation fields.
      - id: R2.2
        text: |
          The critic SHALL formulate and embed its own bounded voice comparison
          query and query only voice-rag read-only. It SHALL not reuse the voice
          editor's selected anchors, hidden reasoning, conversation, or
          self-assessment.
        evidence: Planned provenance and negative-selector tests prove structural_proofs.critic_independence.

  R3:
    title: Complete independent assessment
    items:
      - id: R3.1
        text: |
          evaluate_voice_candidate SHALL receive a fixed context containing the
          exact original and candidate, both hashes, bounded policy, target
          voice, and independently retrieved voice passages. It SHALL receive no
          Pangram result or editor reasoning.
        evidence: Planned context snapshots compare allowed and prohibited fields and prove Pangram states are unreachable before evaluation validation.
      - id: R3.2
        text: |
          Every completed assessment SHALL contain semantic_preservation,
          structural_intent, voice_match, tightening_quality,
          unsupported_additions, and anchor_copy_risk findings with bounded
          evidence and feedback.
        evidence: Planned schema and adversarial fixtures reject every omitted, duplicated, unknown, unbounded, or hash-mismatched category.
      - id: R3.3
        text: |
          Raw model output SHALL emit only LLMResponded or CommandError and
          SHALL pass through parse_critic_evaluation, a fixed non-shell
          cross-field validation helper, parse_critic_validation_report, and one
          evaluation_status predicate before any verdict or Pangram route.
        evidence: Planned traces reject direct model verdict signals, malformed JSON, hash mismatch, category gaps, bad verdict-stage relations, and helper failure.

  R4:
    title: Verdict and responsible stage
    items:
      - id: R4.1
        text: |
          A completed response SHALL contain exactly one verdict in pass, warn,
          or reject. Pass and warn SHALL contain no responsible stage. Every
          reject SHALL contain exactly one responsible_stage in structure,
          voice, or style and bounded actionable feedback for that stage.
        evidence: Planned schema and route fixtures cover each verdict and zero, null, multiple, unknown, semantic, critic, and Pangram stage values.
      - id: R4.2
        text: |
          Semantic or unsupported-addition findings SHALL not create a semantic
          editor. A reject SHALL assign the defect to the responsible structure,
          voice, or style operation under assessment_contract.
        evidence: Planned fixtures assign semantic failures to each allowed editor stage and prove no fourth retry route.
      - id: R4.3
        text: |
          Separate fixed pass, warn, reject, and failed response composers SHALL
          each emit one configured response signal. Failed SHALL carry no
          verdict and SHALL never be parsed by the orchestrator as reject.
        evidence: Planned response and orchestrator compatibility tests validate exact response schema, signals, hashes, stage cardinality, and failed transport behavior.

  R5:
    title: Exact-hash Pangram consent
    items:
      - id: R5.1
        text: |
          No Pangram submit action SHALL be reachable unless the request helper
          validates decision granted against the exact original and candidate
          hashes, disclosure identity, and expiry, and check_pangram_consent
          emits PangramConsentGranted.
        evidence: Planned graph dominance and negative tests cover granted, denied, absent, expired, malformed, and either-hash-mismatched consent.
      - id: R5.2
        text: |
          API key presence, endpoint reachability, prior consent, model text,
          retry state, or environment configuration SHALL NOT count as consent.
          A non-granted status SHALL create explicit advisory evidence without
          invoking either submit or poll word.
        evidence: Planned call-count and trace tests report zero Pangram network operations for every non-granted case.

  R6:
    title: Separate Pangram scans and comparison
    items:
      - id: R6.1
        text: |
          The critic SHALL submit and poll one task for the original and a
          separate task for the candidate. It SHALL bind each task, response,
          advisory record, and error to that document kind and exact hash and
          SHALL never reuse one task identity for the other.
        evidence: Planned fixtures compare task IDs, request bodies, hashes, statuses, and response labels across both scans.
      - id: R6.2
        text: |
          REST submit and poll words SHALL emit only configured HTTP
          status-mapping signals or CommandError. They SHALL NOT emit task-stage,
          score, completed, failed, pending, verdict, or responsible-stage
          signals. A fixed helper, parse_structured, and one-scalar predicate
          chain SHALL interpret each HTTP 200 poll body.
        evidence: Planned factory-semantic tests compare REST declarations with rest-tool-format and internal/tools/rest response mapping code, including STAGE_FAILED HTTP 200 and pending HTTP 200 fixtures.
      - id: R6.3
        text: |
          compare_pangram_results SHALL compare separate document fractions,
          segment counts, and available paragraph-window evidence and SHALL
          preserve explicit unavailable statuses. It SHALL not reduce the
          provider response to one AI score.
        evidence: Planned completed/completed, completed/failed, failed/completed, both-unavailable, changed-paragraph-count, and malformed-comparison fixtures validate the advisory schema.

  R7:
    title: Advisory-only and failure behavior
    items:
      - id: R7.1
        text: |
          Pangram score, prediction, fraction, segment count, window, movement,
          failure, or absence SHALL NOT alone produce or change pass, warn,
          reject, or responsible_stage. Verdict predicates SHALL read only the
          independently validated evaluation report.
        evidence: Planned data-flow and mutation tests prove structural_proofs.advisory_only and hold verdict output constant while varying every Pangram field.
      - id: R7.2
        text: |
          Denied, absent, invalid, unavailable, rejected, failed, timed-out, or
          malformed Pangram evidence SHALL remain explicit in the response and
          SHALL never be converted to a favorable default or silent acceptance.
        evidence: Planned failure fixtures assert exact advisory status and no fabricated zero score, Human Written label, or completed status.
      - id: R7.3
        text: |
          Original and candidate uploads SHALL be irreversible observations.
          Retry and rollback SHALL not claim to erase submitted text or provider
          tasks. Request identity and bounded redacted status SHALL be retained.
        evidence: Planned receipt and rollback tests report none_for_upload and never issue remote compensation.

  R8:
    title: Bounded execution and authority exclusion
    items:
      - id: R8.1
        text: |
          Each Pangram poll cycle SHALL be bounded by a helper-validated count,
          one scalar budget predicate, machine iterations, and machine duration.
          Exhaustion SHALL produce explicit timed_out advisory evidence and
          continue to the independent verdict route.
        evidence: Planned boundary traces prove both cycles terminate at the hard limit and preserve the validated verdict.
      - id: R8.2
        text: |
          voice-critic SHALL expose no editing, replacement-content,
          filesystem, workproduct, manifest, GitHub, child-agent, lifecycle,
          corpus-write, generic shell, or arbitrary REST authority.
        evidence: Planned profile, action, word, field, and side-effect closure proves structural_proofs.authority_closure.
      - id: R8.3
        text: |
          This SRD SHALL remain specified while the profile, MachineSpec,
          ToolDefs, non-shell helper, REST definitions, service, tests, and
          executable evidence remain planned.
        evidence: Architecture, specification index, roadmap, and implementation_status agree.

  R9:
    title: Validation gates
    items:
      - id: R9.1
        text: |
          Planned validation SHALL parse YAML; prove complete requirement-to-AC
          traces; prove exact factory semantics; prove action, word, signal,
          transition, terminal, label, and authority closure; prove consent
          dominance, critic independence, advisory-only data flow,
          responsible-stage closure, and bounded cycles; inspect the diff; and
          run mage audit.
        evidence: The future test suite names every check and reports no new warning.

non_goals:
  - Implement agents/voice-critic/machine.yaml, a profile, ToolDefs, helper executable, REST definitions, service, or tests.
  - Edit, rewrite, repair, or return replacement document prose.
  - Read or write the saga filesystem, manifest, workproducts, GitHub repository, or publication.
  - Receive editor reasoning, conversation, prompts, rejected alternatives, or verdict recommendations.
  - Query structure-rag or tightening-rag, write Chroma, ingest a corpus, or alter canonical RAG behavior.
  - Add a shell, new Go builtin, application-local REST adapter, generic URL, runtime executable, helper operation, credential, model, corpus, path, ref, or tool selection.
  - Treat Pangram, a detector score, a lexical denylist, model confidence, or voice-rag distance as a verdict.
  - Claim an unavailable Pangram result is favorable or that an upload can be undone.
  - Add a semantic editor, critic retry stage, Pangram retry stage, or free-form responsible stage.

acceptance_criteria:
  - id: AC1
    criterion: |
      One flat signal-complete machine maps every action to a critic-owned
      srd003 word, matches actual exec, invoke_llm, REST, parse_structured,
      value_predicate, delay, and compose emissions, and closes four terminal
      outcomes.
    traces: [R1.1, R1.2]
  - id: AC2
    criterion: |
      Only exact immutable original and style-candidate bytes, hashes,
      identities, bounded policy, and consent enter; editor reasoning and
      authority-bearing fields are rejected; the critic retrieves its own
      read-only voice evidence.
    traces: [R2.1, R2.2]
  - id: AC3
    criterion: |
      Independent evaluation precedes Pangram and contains all six finding
      categories; raw LLM output is parsed and deterministically validated
      before any verdict or consent route.
    traces: [R3.1, R3.2, R3.3]
  - id: AC4
    criterion: |
      Completed responses contain pass, warn, or reject; every reject has
      exactly one structure, voice, or style responsible stage and bounded
      feedback; failed responses have no verdict.
    traces: [R4.1, R4.2, R4.3]
  - id: AC5
    criterion: |
      Graph dominance proves neither Pangram upload is reachable without
      affirmative unexpired consent bound to both exact hashes, and every
      non-granted case performs zero Pangram calls.
    traces: [R5.1, R5.2]
  - id: AC6
    criterion: |
      Original and candidate use separate submit and poll tasks; REST emits only
      configured HTTP outcomes; helper, parser, and scalar chains interpret task
      stages; comparison preserves fractions, segments, windows, and explicit
      advisory status without inventing one AI score.
    traces: [R6.1, R6.2, R6.3]
  - id: AC7
    criterion: |
      Data-flow proof shows Pangram cannot decide or alter verdict or responsible
      stage; unavailable or denied service remains explicit and never silently
      accepts; irreversible upload effects are reported honestly.
    traces: [R7.1, R7.2, R7.3]
  - id: AC8
    criterion: |
      Poll and machine cycles are finite, and profile closure denies editing,
      replacement content, filesystem, workproduct, GitHub, lifecycle,
      corpus-write, shell, and arbitrary REST authority.
    traces: [R8.1, R8.2]
  - id: AC9
    criterion: |
      Documentation reports runtime as planned, and YAML, complete AC traces,
      exact factory semantics, all closure checks, consent dominance, critic
      independence, advisory-only flow, responsible-stage closure, bounded
      cycles, diff inspection, and mage audit remain validation gates.
    traces: [R8.3, R9.1]

