      - critic_verdict_is_warn
      - parse_cli_result planned_instances
      - cli_status_predicate planned_instances
      - manifest_scalar_predicate planned_instances
    prohibited_word_groups:
      - editor_and_critic_retrieval
      - critic_pangram
      - corpus_wrapper
    prohibited_capabilities:
      - edit document content
      - embed or author retrieval queries
      - query any RAG service
      - invoke an LLM
      - issue or revise a critic verdict
      - invoke Pangram
      - select a semantic editor
      - execute arbitrary shell, git, gh, REST, filesystem, or child words

