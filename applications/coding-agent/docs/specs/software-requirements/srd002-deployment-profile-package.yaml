id: srd002-deployment-profile-package
title: Role-Specific Deployment Profile Package
status: implemented

problem: |
  Separate planner, executor, and critic containers must not receive the full
  application profile tree. Deployment packaging needs one deterministic
  resolver-backed closure per role, with provenance and bounded ConfigMap
  partitions, without creating a second reference walker or baking profiles
  into the shared runtime image.

requirements:
  R1:
    title: Role-specific closures
    items:
      - R1.1: The application manifest shall name exactly planner, executor, and critic serving entry profiles and their /profiles runtime paths.
      - R1.2: Packaging shall use the existing profileClosure resolver to follow application and canonical library references.
      - R1.3: Each role shard shall contain its application entry profile and exactly the reachable application and canonical assets required by that profile.

  R2:
    title: Safe reproducible package
    items:
      - R2.1: Role paths, file lists, shard order, ConfigMap partitions, and YAML manifests shall be deterministic.
      - R2.2: Traversal, absolute non-core references, globs, dangling references, symlinks, non-regular files, and conflicting destinations shall fail before publication.
      - R2.3: Publication shall atomically replace the prior output only after every role succeeds.
      - R2.4: Deployment and role manifests shall retain compatible library release, library and application checkout revisions and dirty state, mount path, and profile-free image metadata.

  R3:
    title: ConfigMap partitions
    items:
      - R3.1: Packaging shall partition each sorted role closure into deterministic chunks no larger than 900 KiB of encoded key and value payload.
      - R3.2: One asset that exceeds the payload limit shall fail as unshardable rather than producing an invalid install artifact.
      - R3.3: Role manifests shall list every partition, its encoded size, and its ordered file membership exactly once.

  R4:
    title: Runtime proof
    items:
      - R4.1: Every packaged serving entry profile shall pass agent-core --validate-config from its own role root.
      - R4.2: Local combined-tree serving integrations shall remain unchanged.

acceptance_criteria:
  - id: AC1
    criterion: mage package emits deterministic planner, executor, and critic role roots plus deployment and role manifests.
    traces: [R1.1, R1.2, R1.3, R2.1, R2.2, R2.3, R2.4]
  - id: AC2
    criterion: Boundary tests prove deterministic partitioning and reject dangling, symlinked, conflicting, and oversized inputs.
    traces: [R2.2, R3.1, R3.2, R3.3]
  - id: AC3
    criterion: mage audit boot-validates every produced role profile with the real agent binary.
    traces: [R4.1, R4.2]

goals:
  - id: G1
    text: Role-specific closures.
  - id: G2
    text: Safe reproducible package.
  - id: G3
    text: ConfigMap partitions.
  - id: G4
    text: Runtime proof.
non_goals:
  - Helm templates and values schema.
  - Live Kubernetes installation or smoke testing.
