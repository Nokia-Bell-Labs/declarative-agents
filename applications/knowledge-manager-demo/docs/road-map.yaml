id: knowledge-manager-demo-roadmap
title: Knowledge Manager Demo Application Road Map

overview: |
  Release 00.0 establishes the standalone guided demo. The release relocates
  presentation-only assets, references the canonical catalog curator, pins the
  Go present tool, and adds deterministic Mage evidence. The documentation
  contract lands before implementation. The release extends shared srd001 and
  srd002 R1 through R3 by reference; it does not define package, Helm, or kind
  scope.

releases:
  - version: "00.0"
    name: Guided Knowledge Manager presentation
    description: |
      An operator serves the slide deck, launches the canonical
      documentation-curator from an explicit catalog root, opens its
      catalog-owned browser interface, and requests clean shutdown through the
      application-owned declarative lifecycle-exit profile. The application
      reports composition only and contributes no canonical agents.
    status: specified
    capabilities:
      - id: runnable_module
        status: specified
      - id: managed_service
        status: specified
        services: [documentation-curator, Go present]
      - id: packaged
        status: not_applicable
      - id: helm_managed
        status: not_applicable
      - id: kind_demo
        status: not_applicable
    shared_requirements:
      - owner: applications
        id: srd001-application-module-contract
        requirements: [R1, R2, R3, R4, R5, R6]
      - owner: applications
        id: srd002-managed-application-services
        requirements: [R1, R2, R3]
    external_requirements:
      - owner: applications/catalog
        id: srd011-knowledge-manager
      - owner: applications/catalog
        id: rel07.0-uc001-documentation-curator-profile-ux
    use_cases:
      - id: rel00.0-uc001-guided-knowledge-manager-demo
        summary: An operator serves the deck, starts the canonical curator, opens its UI, and exits it declaratively.
        status: specified
    test_suites:
      - id: test-rel00.0-guided-knowledge-manager-demo
        summary: Deterministic command and contract tests plus dependency-gated launch and exit evidence.
        status: specified
    planned_evidence:
      - command: go test ./magefiles
        proves: Exact run and presentation commands, working directories, root resolution, trace reciprocity, and failure messages.
      - command: mage run
        proves: The canonical catalog profile starts through agent-core with explicit profile, directory, and development core-root arguments.
      - command: mage presentation
        proves: The pinned Go present tool serves knowledge-manager.slide from the application root.
      - command: mage audit
        proves: Required documents, reciprocal traces, portable paths, canonical references, and stale-path exclusions satisfy the application contract.
      - command: mage stats
        proves: Valid composition-only JSON reports agents_contributed as zero and omits an agents section.
    completion_gate: |
      Release 00.0 becomes implemented only when the relocated assets and Mage
      module exist, both managed servers have evidence for applicable srd002 R1
      through R3 obligations, and every planned evidence command passes or
      reports its documented external dependency gate. Root mage audit does not
      dispatch this application at specification time, so it is not current
      Release 00.0 evidence.
