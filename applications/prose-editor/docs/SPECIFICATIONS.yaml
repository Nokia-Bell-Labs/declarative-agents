  - id: srd002-writing-saga-workproducts
    title: Writing Saga and Workproduct Lifecycle
    status: specified
    summary: Exact immutable artifacts, manifest state, stage lineage, idempotency, retry, compensation, recovery, and one final publication.
    path: docs/specs/software-requirements/srd002-writing-saga-workproducts.yaml
    use_cases: [rel00.0-uc001-edit-document, rel00.1-uc001-tracer-saga]
    test_suites: [test-rel00.0-prose-editor, test-rel00.1-prose-editor]
  - id: srd003-writing-agent-tools
    title: Writing Agent Tool Contracts
    status: specified
    summary: Closed tool vocabulary, existing-factory reuse, exclusive ownership, inputs, outputs, signals, errors, effects, compensation, and authority.
    path: docs/specs/software-requirements/srd003-writing-agent-tools.yaml
    use_cases: [rel00.0-uc001-edit-document, rel00.1-uc001-tracer-saga]
    test_suites: [test-rel00.0-prose-editor, test-rel00.1-prose-editor]
  - id: srd004-workflow-orchestrator
    title: Workflow Orchestrator State Machine
    status: specified
    summary: Exact flat saga states, srd003 action mappings, durable sequencing, responsible-stage replay, recovery, budgets, publication, escalation, and terminal outcomes.
    path: docs/specs/software-requirements/srd004-workflow-orchestrator.yaml
    use_cases: [rel00.0-uc001-edit-document, rel00.1-uc001-tracer-saga]
    test_suites: [test-rel00.0-prose-editor, test-rel00.1-prose-editor]
  - id: srd005-specialist-editor
    title: Specialist Editor State Machine
    status: specified
    summary: Parameterized specialist-editor with structure, voice, and style stages sharing a common pipeline shape but differing in accepted parent type, RAG instance, edit operations, preservation invariants, and response contracts.
    path: docs/specs/software-requirements/srd005-specialist-editor.yaml
    use_cases: [rel00.0-uc001-edit-document, rel00.1-uc001-tracer-saga]
    test_suites: [test-rel00.0-prose-editor, test-rel00.1-prose-editor]
  - id: srd006-helm-topology
    title: Prose Editor Deployment Package and Helm Topology
    status: planned
    summary: Planned role-closure package, per-role chart topology on the profile-free image, values schema, kind-demo smoke, and the canonical collector workload with its served trace UI and per-role OTLP flags.
    path: docs/specs/software-requirements/srd006-helm-topology.yaml
    use_cases: [rel00.3-uc001-declarative-applier]
    test_suites: [test-rel00.3-applier]
  - id: srd007-applier
    title: Declarative Applier Agent
    status: planned
    summary: Planned standalone declarative actuator — validate against the chart values schema, apply as a values-file rollout, verify role Deployments, roll back on failure — with helm and kubectl authority held in the applier alone.
    path: docs/specs/software-requirements/srd007-applier.yaml
    use_cases: [rel00.3-uc001-declarative-applier]
    test_suites: [test-rel00.3-applier]
  - id: srd008-voice-critic
    title: Voice Critic State Machine and Pangram Boundary
    status: specified
    summary: Flat independent assurance, six finding categories, exact-hash consent, separate Pangram tasks, advisory comparison, pass/warn/reject, responsible-stage closure, and bounded authority.
    path: docs/specs/software-requirements/srd008-voice-critic.yaml
