{{- include "coding-agent.validateValues" . -}}
{{- range $role := list "planner" "executor" "critic" }}
{{- $roleValues := index $.Values.roles $role -}}
{{- $context := dict "root" $ "role" $role -}}
{{- $manifest := include "coding-agent.roleManifest" $context | fromYaml -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "coding-agent.fullname" $ }}-{{ $role }}
  labels:
    {{- include "coding-agent.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $role }}
spec:
  replicas: {{ $roleValues.replicas }}
  selector:
    matchLabels:
      {{- include "coding-agent.selectorLabels" $ | nindent 6 }}
      app.kubernetes.io/component: {{ $role }}
  template:
    metadata:
      labels:
        {{- include "coding-agent.selectorLabels" $ | nindent 8 }}
        app.kubernetes.io/component: {{ $role }}
      annotations:
        checksum/profiles: {{ include "coding-agent.profileChecksum" $context }}
        {{- with $.Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        {{- toYaml $.Values.podSecurityContext | nindent 8 }}
      {{- with $.Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- $waitForModels := and $.Values.ollama.enabled (or (eq $role "planner") (eq $role "executor")) }}
      {{- if or $waitForModels (eq $role "executor") }}
      initContainers:
        {{- if $waitForModels }}
        - name: wait-for-models
          image: {{ $.Values.ollama.utilityImage | quote }}
          imagePullPolicy: {{ $.Values.ollama.image.pullPolicy }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              url="{{ include "coding-agent.llmURL" $ }}/api/tags"
              for model in {{ include "coding-agent.ollamaModels" $ }}; do
                base="${model%%:*}"
                until wget -qO- "$url" | grep -q "$base"; do
                  echo "waiting for model $model"; sleep 5
                done
              done
          securityContext:
            {{- toYaml $.Values.containerSecurityContext | nindent 12 }}
        {{- end }}
        {{- if eq $role "executor" }}
        {{/*
        Tool donors (srd005 R9, GH-2494): separate digest-pinned upstream
        images copy the Go SDK and golangci-lint into one shared volume that
        only the executor mounts, read-only. The executor main container still
        runs the canonical agent-core image. These init containers carry no
        --profile argument and are not agent workloads.
        */}}
        - name: go-tool-donor
          image: {{ include "coding-agent.executorGoImage" $ | quote }}
          imagePullPolicy: {{ $.Values.executorTools.go.image.pullPolicy }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              cp -R /usr/local/go {{ $.Values.executorTools.mountPath }}/go
          securityContext:
            {{- toYaml $.Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - {name: executor-tools, mountPath: {{ $.Values.executorTools.mountPath }}}
        - name: golangci-lint-tool-donor
          image: {{ include "coding-agent.executorGolangciLintImage" $ | quote }}
          imagePullPolicy: {{ $.Values.executorTools.golangciLint.image.pullPolicy }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              mkdir -p {{ $.Values.executorTools.mountPath }}/bin
              cp /usr/bin/golangci-lint {{ $.Values.executorTools.mountPath }}/bin/golangci-lint
          securityContext:
            {{- toYaml $.Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - {name: executor-tools, mountPath: {{ $.Values.executorTools.mountPath }}}
        {{- end }}
      {{- end }}
      containers:
        - name: {{ $role }}
          image: {{ include "coding-agent.image" $ | quote }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          securityContext:
            {{- toYaml $.Values.containerSecurityContext | nindent 12 }}
          args:
            - "--profile"
            - "{{ $.Values.profiles.mountPath }}/{{ $manifest.profile }}"
            - "--directory"
            - "{{ $.Values.workspace.mountPath }}"
            - "--otel-service-name"
            - "coding-{{ $role }}"
            {{- with include "coding-agent.otlpEndpoint" $ }}
            - "--otel-otlp-endpoint"
            - {{ . | quote }}
            {{- end }}
          env:
            - name: {{ upper $role }}_BIND_HOST
              value: "0.0.0.0"
            - name: POD_NAME
              valueFrom:
                fieldRef: {fieldPath: metadata.name}
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "service.namespace=coding-agent,service.instance.id=$(POD_NAME)"
            {{- if or (eq $role "planner") (eq $role "executor") }}
            - name: OLLAMA_URL
              value: {{ include "coding-agent.llmURL" $ | quote }}
            {{- end }}
            {{- if eq $role "executor" }}
            {{/* Reach the donated Go SDK and linter, and keep their caches on
                 the writable /tmp emptyDir so the read-only root filesystem
                 holds (GH-2494). */}}
            - name: PATH
              value: "{{ $.Values.executorTools.mountPath }}/go/bin:{{ $.Values.executorTools.mountPath }}/bin:/usr/local/bin:/usr/bin:/bin"
            - name: GOCACHE
              value: /tmp/go-build
            - name: GOMODCACHE
              value: /tmp/go-mod
            - name: GOLANGCI_LINT_CACHE
              value: /tmp/golangci-lint
            {{- end }}
            {{- if eq $role "planner" }}
            - name: EXECUTOR_HOST
              value: {{ printf "%s-executor" (include "coding-agent.fullname" $) | quote }}
            - name: EXECUTOR_URL
              value: {{ printf "http://%s-executor:%v" (include "coding-agent.fullname" $) $.Values.roles.executor.requestPort | quote }}
            - name: CRITIC_HOST
              value: {{ printf "%s-critic" (include "coding-agent.fullname" $) | quote }}
            - name: CRITIC_URL
              value: {{ printf "http://%s-critic:%v" (include "coding-agent.fullname" $) $.Values.roles.critic.requestPort | quote }}
            {{- end }}
          ports:
            - {name: request, containerPort: {{ $roleValues.requestPort }}, protocol: TCP}
            - {name: control, containerPort: {{ $roleValues.controlPort }}, protocol: TCP}
          readinessProbe:
            httpGet: {path: /api/lifecycle/health, port: control}
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 6
          livenessProbe:
            httpGet: {path: /api/lifecycle/health, port: control}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            {{- toYaml $roleValues.resources | nindent 12 }}
          volumeMounts:
            - {name: profiles, mountPath: {{ $.Values.profiles.mountPath }}, readOnly: true}
            - {name: workspace, mountPath: {{ $.Values.workspace.mountPath }}}
            - {name: tmp, mountPath: /tmp}
            {{- if eq $role "executor" }}
            - {name: executor-tools, mountPath: {{ $.Values.executorTools.mountPath }}, readOnly: true}
            {{- end }}
      volumes:
        {{- include "coding-agent.profilesVolume" $context | nindent 8 }}
        - name: workspace
          persistentVolumeClaim:
            claimName: {{ include "coding-agent.workspaceClaim" $ }}
        - name: tmp
          emptyDir: {}
        {{- if eq $role "executor" }}
        - name: executor-tools
          emptyDir: {}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "coding-agent.fullname" $ }}-{{ $role }}
  labels:
    {{- include "coding-agent.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $role }}
spec:
  type: ClusterIP
  selector:
    {{- include "coding-agent.selectorLabels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $role }}
  ports:
    - {name: request, port: {{ $roleValues.requestPort }}, targetPort: request}
    - {name: control, port: {{ $roleValues.controlPort }}, targetPort: control}
---
{{ end }}
