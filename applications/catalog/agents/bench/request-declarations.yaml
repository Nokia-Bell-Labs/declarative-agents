unit: catalog-bench-request-declarations
imports:
- ../units/types-requests.yaml
tools:
  - &evaluation_query
    name: list_evaluation_sessions
    type: builtin
    init: list_evaluation_sessions
    visibility: internal
    category: boundary
    signature: {emits: [EvaluationDataReady, EvaluationMissing, EvaluationDenied, CommandError]}
    description: List evaluator sessions from persisted point artifacts.
    parameters: {type: object, properties: {}, additionalProperties: false}
    output: {description: Evaluation session summaries, schema: {type: array}}
    side_effects: [{kind: filesystem_read, target: evaluation_artifacts, state: read_only}]
    reversibility: {classification: reversible}
    undo: {strategy: noop, description: Artifact queries change nothing.}
    errors: [{signal: CommandError, condition: Artifact reads fail, state_after_failure: No state changes.}]
    config: &evaluation_root {data_dir: eval-results}

  - name: analyze_evaluation_session
    <<: *evaluation_query
    init: analyze_evaluation_session
    description: Compute model and sample statistics for one evaluation session.
    parameters:
      type: object
      properties: {suite: {type: string}, timestamp: {type: string}}
      required: [suite, timestamp]
    output: {description: Evaluation session statistics, schema: {type: object}}

  - name: list_evaluation_points
    <<: *evaluation_query
    init: list_evaluation_points
    description: List point outcomes and trace-derived metrics for one session.
    parameters:
      type: object
      properties: {suite: {type: string}, timestamp: {type: string}}
      required: [suite, timestamp]
    output: {description: Evaluation point summaries, schema: {type: array}}

  - name: read_evaluation_trace
    <<: *evaluation_query
    init: read_evaluation_trace
    description: Read and normalize one evaluator trace.
    parameters:
      type: object
      properties: {suite: {type: string}, timestamp: {type: string}, point_id: {type: string}}
      required: [suite, timestamp, point_id]
    output: {description: Normalized evaluation trace, schema: {type: object}}

  - name: list_bench_config_paths
    type: exec
    binary: bash
    args:
      - -o
      - pipefail
      - -c
      - |
        prefix=${1#/}
        [ "$prefix" = "." ] && prefix=
        cd agents
        find -P . \( -type f -o -type l \) \( -name '*.yaml' -o -name '*.yml' \) -print |
          LC_ALL=C sort |
          awk -v prefix="$prefix" '{sub(/^\.\//, ""); if (prefix == "" || index($0, prefix) == 1) print}'
      - bench-config-paths
    visibility: internal
    category: boundary
    signature:
      emits: [ToolDone, ToolFailed, CommandError]
    description: Discover bench configuration paths through declared find.
    parameters:
      type: object
      properties:
        prefix: {type: string, positional: true, position: 1, default: ""}
    output_cap: 1048576
    side_effects:
      - {kind: child_process, target: find, state: read_only}
      - {kind: filesystem_read, target: bench_configs, state: read_only}
    reversibility: {classification: reversible}
    undo: {strategy: noop, description: Discovery changes nothing.}
    errors: [{signal: ToolFailed, condition: The agents root or find traversal fails, state_after_failure: No state changes.}]

  - &resource_base
    name: list_bench_configs
    type: builtin
    init: list_resource
    visibility: internal
    category: boundary
    signature: {emits: [DocumentListReady, DocumentResourceDenied, CommandError]}
    description: Shape discovered bench paths as allowlisted configuration metadata.
    parameters: {type: object, properties: {}, additionalProperties: false}
    output: {description: Configuration resource entries, schema: {type: array}}
    side_effects: [{kind: filesystem_read, target: bench_configs, state: read_only}]
    reversibility: {classification: reversible}
    undo: {strategy: noop, description: Resource reads change nothing.}
    errors: [{signal: CommandError, condition: Filesystem access fails, state_after_failure: No state changes.}]
    config: &config_resource
      resource: configs
      resources:
        configs:
          root: agents
          include: ["**/*.yaml", "**/*.yml"]
          extensions: [yaml, yml]
          modes: [raw_yaml, parsed_yaml]
          max_bytes: 1048576
          category_rules:
            - {pattern: "*.yaml", category: overview}
            - {pattern: "*.yml", category: overview}

  - name: read_bench_config
    <<: *resource_base
    init: read_resource
    signature: {emits: [DocumentReady, DocumentMissing, DocumentResourceDenied, DocumentParseFailed, CommandError]}
    description: Read one allowlisted bench configuration YAML.
    parameters: {type: object, properties: {path: {type: string}}, required: [path]}
    output: {description: Configuration resource detail, schema: {type: object}}
    config: *config_resource

  - name: read_bench_source
    <<: *resource_base
    init: read_resource
    signature: {emits: [DocumentReady, DocumentMissing, DocumentResourceDenied, DocumentParseFailed, CommandError]}
    description: Read one allowlisted text source file.
    parameters: {type: object, properties: {path: {type: string}}, required: [path]}
    output: {description: Source resource detail, schema: {type: object}}
    config:
      resource: source
      resources:
        source:
          root: .
          include: []
          extensions: [go, yaml, yml, ts, tsx, js, jsx, css, json, md, txt, toml, mod, sum, html, sh]
          modes: [raw]
          max_bytes: 1048576

  - name: read_bench_experiment
    <<: *resource_base
    init: read_resource
    signature: {emits: [DocumentReady, DocumentMissing, DocumentResourceDenied, DocumentParseFailed, CommandError]}
    description: Read one persisted evaluator experiment YAML.
    parameters: {type: object, properties: {path: {type: string}}, required: [path]}
    output: {description: Parsed evaluator experiment, schema: {type: object}}
    config:
      resource: experiments
      resources:
        experiments:
          root: eval-results
          include: ["**/experiment.yaml"]
          extensions: [yaml]
          modes: [raw_yaml, parsed_yaml]
          max_bytes: 1048576

  - &compose_base
    name: wrap_bench_input
    type: builtin
    init: compose
    visibility: internal
    category: response
    signature:
      output: catalog-types-requests.WrappedPayload
      emits: [InputReady]
    description: Wrap previous JSON as bounded jq input.
    parameters: {type: object, properties: {}, additionalProperties: false}
    output: {description: Wrapped transform input}
    errors: [{signal: CommandError, condition: Input composition fails, state_after_failure: No state changes.}]
    config:
      signal: InputReady
      inputs: {payload: "$."}
      template: '{"payload": {{ json payload }}}'

  - name: capture_experiment_path
    <<: *compose_base
    description: Build the allowlisted experiment artifact path.
    signature:
      output: catalog-types-requests.ResourcePath
      emits: [InputReady]
    output: {description: Allowlisted experiment artifact path}
    config:
      signal: InputReady
      inputs:
        suite: $.parameters.suite
        timestamp: $.parameters.timestamp
        point_id: $.parameters.point_id
      template: '{"path":"{{ suite }}/{{ timestamp }}/{{ point_id }}/experiment.yaml"}'

  - name: shape_bench_configs
    type: exec
    binary: jq
    args:
      - -c
      - >-
        {data:(group_by(.path|split("/")[0]) |
        map({category:(.[0].path|split("/")[0]),
        files:map({path:.path,name:(.path|split("/")[1:]|join("/"))})}))}
    stdin_source: $from(config_entries).payload
    stdin_max_bytes: 2097152
    visibility: internal
    category: response
    signature:
      output: catalog-types-requests.DataEnvelope
      emits: [ToolDone, ToolFailed, CommandError]
    description: Group configuration resources into the existing bench UI contract.
    parameters: {type: object, properties: {}, additionalProperties: false}
    output: {description: Bench configuration categories, mode: raw}
    errors: [{signal: ToolFailed, condition: jq cannot shape input, state_after_failure: No state changes.}]

  - name: shape_bench_config
    type: exec
    binary: jq
    args:
      - -c
      - >-
        . as $d | $d.parsed as $c | {data:(
        {path:$d.path,content:$c,raw:$d.raw} +
        (if (($c.states|type)=="array" and ($c.transitions|type)=="array") then
          {graph:{states:[$c.states[]|select(type=="string")],
          terminalStates:[($c.terminal_states//[])[]|select(type=="string")],
          transitions:[$c.transitions[]|{from:(.state//""),signal:(.signal//""),
          to:(.next//""),action:(.action//"")} ]}}
        else {} end))}
    stdin_source: $from(config_detail).payload
    stdin_max_bytes: 2097152
    visibility: internal
    category: response
    signature:
      output: catalog-types-requests.DataEnvelope
      emits: [ToolDone, ToolFailed, CommandError]
    description: Shape parsed YAML and optional machine graph for the bench UI.
    parameters: {type: object, properties: {}, additionalProperties: false}
    output: {description: Bench configuration detail, mode: raw}
    errors: [{signal: ToolFailed, condition: jq cannot shape input, state_after_failure: No state changes.}]

  - name: shape_bench_source
    <<: *compose_base
    signature:
      output: catalog-types-requests.DataEnvelope
      emits: [ResponseReady]
    description: Shape source resource output for the existing bench UI.
    config:
      signal: ResponseReady
      inputs: {path: $.path, content: $.raw, language: $.extension, mime: $.content_type, size: $.size}
      template: '{"data":{"path":{{ json path }},"content":{{ json content }},"language":{{ json language }},"mimeType":{{ json mime }},"size":{{ size }}}}'

  - name: shape_bench_experiment
    <<: *compose_base
    signature:
      output: catalog-types-requests.DataEnvelope
      emits: [ResponseReady]
    description: Return parsed evaluator experiment configuration.
    config:
      signal: ResponseReady
      inputs: {content: $.parsed}
      template: '{"data":{{ content }}}'

  - name: list_bench_profiles
    type: exec
    binary: jq
    args:
      - -cn
      - >-
        {data:[
          {name:"deepseek",matchPrefixes:[],strictFormat:true,pipeline:[]},
          {name:"default",matchPrefixes:[],strictFormat:false,pipeline:[]},
          {name:"gemma",matchPrefixes:[],strictFormat:true,pipeline:[]},
          {name:"glm",matchPrefixes:[],strictFormat:false,pipeline:[]},
          {name:"granite",matchPrefixes:[],strictFormat:false,pipeline:[]},
          {name:"laguna",matchPrefixes:[],strictFormat:false,pipeline:[]},
          {name:"mistral",matchPrefixes:[],strictFormat:true,pipeline:[]},
          {name:"nemotron",matchPrefixes:[],strictFormat:false,pipeline:[]},
          {name:"qwen",matchPrefixes:[],strictFormat:true,pipeline:[]}
        ]}
    visibility: internal
    category: response
    signature:
      output: catalog-types-requests.DataEnvelope
      emits: [ToolDone, ToolFailed, CommandError]
    description: Return the bench-owned model profile summary catalog.
    parameters: {type: object, properties: {}, additionalProperties: false}
    output: {description: Model profile summaries, mode: raw}
    errors: [{signal: ToolFailed, condition: Profile shaping fails, state_after_failure: No state changes.}]
