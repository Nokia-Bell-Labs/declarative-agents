  authority_boundary: |
    The pinned reference architecture supplies conceptual vocabulary for roles,
    activities, flows, governance, and architecture views. It does not impose
    implementation requirements on this repository. This VISION and its linked
    architecture, semantic model, pattern language, SRDs, application profiles,
    packaging rules, and executable evidence remain authoritative here.
  portability: |
    Provenance uses repository-relative source paths. Validation and builds must
    not depend on a developer-local checkout or absolute filesystem path.

success_criteria:
  baseline_is_uniform: |
    Every runnable application has application-owned composition, the required
    documentation corpus, root Mage participation, and ownership-aware stats.
  applicability_is_explicit: |
    Every requirement names its capability class and observable evidence.
    Packaging, Helm, and kind-demo obligations do not apply when the application
    does not claim those capabilities.
  catalog_boundary_is_preserved: |
    applications/catalog remains a reusable catalog module. Applications
    reference canonical blocks and do not duplicate their behavior or agent
    accounting.
  boundaries_are_justified: |
    Every multi-actor design states the authority, failure, scaling, or
    lifecycle boundary that justifies separation. A scenario may use one actor.
  flows_are_closed: |
    Application evidence traces intent through actuation and observations
    through assurance and feedback, including policy and human decision points.
  realizations_are_traceable: |
    Canonical roles remain semantic interfaces. Shipped actors and profiles
    identify their role bindings while the application owns their relationships.
  packages_are_closed: |
    A packaged application resolves and validates its complete transitive
    profile closure before deployment and supplies it to a profile-free runtime.
  local_extensions_are_traceable: |
    Application-local architecture and SRDs cite this contract, then define
    application-specific behavior and evidence without copying shared text.
  structural_evidence_is_executable: |
    Root Go tests, root Mage gates, YAML parsing, and application-local targets
    provide commands that verify every implemented conformance claim.

not:
  - We do not require every application to use several agents or prescribe one
    role set, workflow, control plane, or deployment topology.
  - We do not transfer human intent, policy, exception, or accountability
    authority to an autonomous composition.
  - We do not treat the upstream reference architecture as an implementation
    specification for this repository.
  - We do not classify applications/catalog as a runnable application.
  - We do not define application business behavior or catalog member behavior.
  - We do not require every runnable application to package artifacts, ship a
    Helm chart, run on Kubernetes, or provide a kind demo.
  - We do not restate ENG01; kind-demo applications cite and implement it.
  - We do not replace agent-core runtime contracts.
  - We do not make prose or directory presence sufficient evidence of runtime
    behavior.

