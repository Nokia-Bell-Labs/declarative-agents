name: status
purpose: |-
  Gather a person's week for their status report (srd018 R8): the open
  Sprint Goals and what they merged and closed. Use when a person asks for
  their week or the facts of their status report.

  This machine has no model state: scrum-master reports week (design.md
  D10, D14; GH-37). SCRUM_MASTER_PROJECT names the person's project.
configuration:
  machine: plugin/agents/status/machine.yaml
  tools: plugin/agents/status/tools.yaml
invariants:
- Every step is a word; no model acts anywhere in this machine
- A refusal ends the run in the state that names it, with the word's reason
lifecycle: |-
  1. Idle → Week (Seed): scrum-master reports week
  2. Week → Done (ToolDone)
initial_state: Idle
budget:
  command_timeout: 16m
  max_iterations: 10
states:
- name: Idle
  meaning: Initial state before the first word.
- name: Week
  meaning: |
    The week word: scrum-master reports week gathers the open Sprint Goals
    and what the person merged and closed this week.
- name: Done
  run_status: succeeded
  meaning: |
    Terminal. Every word ran, and the last one reported what it did.
- name: Refused
  run_status: failed
  meaning: |
    Terminal. The week could not be gathered, and the word's reason is the
    run's last output.
- name: Failed
  run_status: failed
  meaning: Terminal. An infrastructure error outside the words' refusals.
terminal_states:
- Done
- Refused
- Failed
signals:
- name: Seed
  trigger: Loop initialization.
- name: ToolDone
  trigger: A word executed successfully.
- name: ToolFailed
  trigger: A word reported failure — a refusal with its reason.
- name: CommandError
  trigger: Infrastructure-level error (not a tool failure).
transitions:
- state: Idle
  signal: Seed
  next: Week
  action: reports_week
  summary: true
- state: Week
  signal: ToolFailed
  next: Refused
- state: Week
  signal: ToolDone
  next: Done
- state: Idle
  signal: CommandError
  next: Failed
- state: Week
  signal: CommandError
  next: Failed
