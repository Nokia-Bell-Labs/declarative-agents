# Fixture for R-REST-003: a resource carrying the reserved id_field keyname.
rest:
  version: v1
  clients:
    github:
      resources:
        issue:
          path: /repos/nokia/agents/issues
          id_field: id
          operations:
            get:
              method: GET
              success: {status: [200], signal: RESTResourceRead}
