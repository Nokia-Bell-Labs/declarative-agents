id: test-rel00.3-applier
title: Prose Editor Release 00.3 Declarative Applier Test Suite
release: "00.3"
test_case_count: 7
status: planned
runtime_status: unimplemented

overview: |
  This suite plans seven cases for rel00.3-uc001-declarative-applier: the standalone
  declarative actuator (srd007) for the Prose Editor chart (srd006). It drives a
  decided values patch through validate, apply, and verify, asserting that a
  non-conforming patch is rejected by the chart-schema dry-run, that a valid patch
  is applied as a values-file rollout and verified via kubectl rollout status of
  the workflow-orchestrator, specialist-editor, voice-critic, and RAG Deployments,
  that an apply or verify failure rolls back, that the authority boundary holds,
  and that the chart is a deterministic role-closure package. A recording-fake
  tracer plans coverage of every declared terminal, real helm validates the
  chart's values schema, and a live kind target plans apply and rollback on
  cluster.

  Prose Editor runs no control plane, so no creator, deployment orchestrator, or
  panel hop appears in this suite. None of the fixtures, targets, traces, or
  reports below exists in release 00.3, and this suite claims no execution or
  conformance evidence until those fixtures are built.

traces:
  - rel00.3-uc001-declarative-applier
  - srd006-helm-topology
  - srd007-applier

preconditions:
  - srd006-helm-topology and srd007-applier parse and retain status planned.
  - Future runtime work supplies hermetic fixtures for helm, kubectl, the chart values schema, rendered chart output, and a kind cluster.
  - Future tests use recording-fake CLIs on the applier PATH for the terminal walk, real helm for the schema case, and a kind rig for the on-cluster case.
  - agent-core supplies the request runtime, REST server, monitor, and exec tools by reference; no agent-core change is required.
  - Current executable evidence is none; every test case below remains planned.

test_cases:
  - id: TC001
    use_case: rel00.3-uc001-declarative-applier
    name: Documentation trace closure for the applier release
    status: planned
    runtime_status: unimplemented
    description: |
      Parse the release 00.3 Prose Editor YAML; verify that srd006-helm-topology,
      srd007-applier, the applier use case, this test suite, and road-map release
      00.3 exist with correct IDs and paths; close reciprocal references between
      the use case touchpoints, success criteria, and this test suite; verify that
      every acceptance criterion in srd006 and srd007 is covered by a use-case
      success criterion and at least one test case; and reject any runtime or
      evidence claim for release 00.3.
    future_evidence:
      type: go_test
      path: applications/prose-editor/magefiles/applier_trace_closure_test.go
    current_evidence: none
    expected:
      yaml_documents_parse: true
      applier_srds_exist: true
      applier_use_case_exists: true
      applier_test_suite_exists: true
      roadmap_00_3_exists: true
      orphan_touchpoints_or_criteria: 0
      runtime_evidence_claims: 0
    traces:
      - rel00.3-uc001-declarative-applier S1
      - srd007-applier AC1

  - id: TC002
    use_case: rel00.3-uc001-declarative-applier
    name: Applier validates, applies, and verifies a Prose Editor chart values change
    status: planned
    runtime_status: unimplemented
    description: |
      Drive a decided values patch against the applier profile: the apply endpoint
      receives the patch, the applier rejects an unknown schema version, validates
      the patch against the chart values schema by a helm dry-run and rejects a
      non-conforming patch with a client error and no rollout; for a valid patch it
      materializes the values as an overrides file and applies helm upgrade with
      reuse-values, returning without waiting; it verifies the role Deployments via
      kubectl rollout status and reports the phase, rolling the release back on a
      verify stall. Assert the authority boundary: no invocation carries an
      endpoint, a credential, or per-field construction.

      helm and kubectl are recording fakes on the applier PATH, taking their exit
      codes from the scenario, so one run walks every terminal of the apply and
      rollout machines. It is evidence about the machine, the arguments it
      constructs, and the responses it maps, not that real helm and kubectl behave
      as the declarations assume; the chart schema is covered by its own case
      against real helm, and the live kind target supplies the on-cluster evidence.
    future_evidence:
      type: integration_target
      path: applications/prose-editor/magefiles/applier_machine_test.go
    current_evidence: none
    expected:
      unknown_schema_version_rejected: true
      invalid_patch_rejected_by_schema_dry_run_no_rollout: true
      valid_patch_applied_as_values_file_reuse_values_no_wait: true
      no_per_field_construction: true
      rollout_verified_via_kubectl_rollout_status: true
      verify_stall_rolls_back_apply_failure_reports_failed: true
      patch_carries_no_endpoint_or_credential: true
    traces:
      - rel00.3-uc001-declarative-applier S1
      - rel00.3-uc001-declarative-applier S3
      - rel00.3-uc001-declarative-applier S4
      - rel00.3-uc001-declarative-applier S5
      - srd007-applier AC1
      - srd007-applier AC2
      - srd007-applier AC3
      - srd007-applier AC4

  - id: TC003
    use_case: rel00.3-uc001-declarative-applier
    name: The Prose Editor chart schema rejects a non-conforming values patch
    status: planned
    runtime_status: unimplemented
    description: |
      The applier's validate step is a helm dry-run against the chart's values
      schema, so the rejection is only as real as the schema. TC002 cannot prove
      it: its fake helm returns whatever exit code the scenario sets, and a schema
      that accepted every document would pass it unchanged.

      Real helm renders the real Prose Editor chart with two fixtures. The
      rejection must name the offending path and the constraint it violated, not
      merely exit non-zero — a chart failing to render for an unrelated reason exits
      non-zero too. A third assertion pins the constraint the fixture rests on, so
      loosening the schema reads as the guard being removed rather than as a broken
      fixture.
    future_evidence:
      type: integration_target
      path: applications/prose-editor/magefiles/applier_chart_schema_test.go
    current_evidence: none
    expected:
      conforming_patch_renders: true
      non_conforming_patch_rejected_by_path_and_constraint: true
      constrained_value_pinned_by_a_third_assertion: true
    traces:
      - rel00.3-uc001-declarative-applier S2
      - srd006-helm-topology AC4
      - srd007-applier AC2

  - id: TC004
    use_case: rel00.3-uc001-declarative-applier
    name: The applier holds the deployment CLIs and the serving roles do not
    status: planned
    runtime_status: unimplemented
    description: |
      Assert over the rendered chart and the packaged role profiles that only the
      applier carries helm and kubectl bound as exec tools and that the
      workflow-orchestrator, specialist-editor, voice-critic, and RAG profiles
      carry no deployment CLI. Assert the applier Service targets the pods the
      applier Deployment creates and that its apply surface is admitted only from
      the authorized caller, not from the serving or retrieval pods, so route and
      NetworkPolicy agree on one authority path.
    future_evidence:
      type: graph_and_fixture_test
      path: applications/prose-editor/magefiles/applier_authority_boundary_test.go
    current_evidence: none
    expected:
      applier_alone_binds_helm_and_kubectl: true
      serving_roles_carry_no_deployment_cli: true
      apply_surface_admits_only_the_authorized_caller: true
      apply_surface_not_reachable_from_serving_or_retrieval_pods: true
    traces:
      - rel00.3-uc001-declarative-applier S6
      - srd006-helm-topology AC3
      - srd007-applier AC4
      - srd007-applier AC5

  - id: TC005
    use_case: rel00.3-uc001-declarative-applier
    name: A broken rollout read is distinguishable from a progressing one
    status: planned
    runtime_status: unimplemented
    description: |
      Assert over the declared profile that the rollout read reaches a broken-read
      terminal rather than folding it into progressing. kubectl rollout status
      exits non-zero for a rollout that is still progressing and for one it could
      not read at all, so a phase taken from that exit code alone would report an
      absent Deployment, a wrong kubeconfig, a denied RBAC read, or an unreachable
      API server as ongoing progress. A read the cluster cannot serve returns a
      gateway error rather than a phase.
    future_evidence:
      type: graph_and_fixture_test
      path: applications/prose-editor/magefiles/applier_rollout_read_test.go
    current_evidence: none
    expected:
      unreadable_rollout_returns_gateway_error_not_a_phase: true
      complete_and_progressing_remain_distinguishable: true
    traces:
      - rel00.3-uc001-declarative-applier S7
      - srd007-applier AC3

  - id: TC006
    use_case: rel00.3-uc001-declarative-applier
    name: A live on-cluster rollout and rollback through the applier
    status: planned
    runtime_status: unimplemented
    description: |
      What the fake CLIs cannot stand in for. The applier image is built on the
      Prose Editor runtime under test, loaded into kind, and the chart installed
      with the applier enabled; a values patch then goes through the apply endpoint
      and the release moves to a new revision, which is the evidence a success
      status is not — the fake tier returns one without helm existing.

      The compensating leg is live too. A reserved patch forces a deterministic
      post-upgrade verification failure; the applier's declared kubectl rollout
      status times out, reaches the rollback terminal, and invokes real helm
      rollback, which restores the prior computed release values and ready
      workflow-orchestrator, specialist-editor, voice-critic, and RAG Deployments.
      The same non-conforming document TC003 validates locally is rejected here
      against the real chart schema, leaving the release untouched. Bounded host
      and in-pod probes classify a Kubernetes API or pod-network loss apart from the
      semantic proof.
    future_evidence:
      type: integration_target
      path: applications/prose-editor/tests/e2e/applier-live/trace.yaml
    current_evidence: none
    expected:
      real_helm_upgrade_changes_the_release: true
      post_upgrade_verify_failure_reaches_rolled_back: true
      real_helm_rollback_restores_prior_computed_values: true
      role_deployments_recover_after_rollback: true
      non_conforming_patch_rejected_on_the_cluster: true
    traces:
      - rel00.3-uc001-declarative-applier S3
      - rel00.3-uc001-declarative-applier S4
      - srd006-helm-topology AC5
      - srd007-applier AC3

  - id: TC007
    use_case: rel00.3-uc001-declarative-applier
    name: The Prose Editor chart is a deterministic role-closure package
    status: planned
    runtime_status: unimplemented
    description: |
      Assert over the package build that the deployment manifest names exactly the
      served roles and no other, that packaging uses the existing profile-closure
      resolver rather than a second walker, and that each role shard contains its
      serving entry profile and exactly the reachable application and canonical
      assets that profile requires. Build the package twice and assert a stable
      byte-identical output. Reject traversal, dangling references, symlinks,
      non-regular files, and conflicting destinations before publication.
    future_evidence:
      type: go_test
      path: applications/prose-editor/magefiles/deployment_package_closure_test.go
    current_evidence: none
    expected:
      manifest_names_exactly_the_served_roles: true
      packaging_uses_existing_resolver: true
      per_role_membership_equals_reachable_set: true
      package_is_deterministic_across_builds: true
      unsafe_inputs_rejected_before_publication: true
    traces:
      - rel00.3-uc001-declarative-applier S8
      - srd006-helm-topology AC1
