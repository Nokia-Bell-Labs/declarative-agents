unit: coding-role-server-declarations
tools:
  - name: launch_role_requests
    type: builtin
    init: rest_server_launch
    visibility: internal
    signature:
      emits: [ServerLaunched, CommandError]
    description: Launch the role's declared machine-request listener.
    output:
      description: Structured server launch result.
      schema:
        type: object
        properties:
          server: {type: string}
          address: {type: string}
          route_count: {type: integer}
          bindings: {type: array, items: {type: string}}
    category: boundary
    side_effects: [{kind: network_listen, target: role_requests, state: listener_started}]
    reversibility: {classification: compensatable}
    undo: {strategy: compensating_action, description: Stop the request listener.}
    config: {rest_ref: role_requests}

  - name: launch_role_control
    type: builtin
    init: rest_server_launch
    visibility: internal
    signature:
      emits: [ServerLaunched, CommandError]
    description: Launch the role's real lifecycle health and exit listener.
    output:
      description: Structured server launch result.
      schema:
        type: object
        properties:
          server: {type: string}
          address: {type: string}
          route_count: {type: integer}
          bindings: {type: array, items: {type: string}}
    category: boundary
    side_effects: [{kind: network_listen, target: role_control, state: listener_started}]
    reversibility: {classification: compensatable}
    undo: {strategy: compensating_action, description: Stop the control listener.}
    config: {rest_ref: role_control}

  - name: await_role_control
    type: builtin
    init: rest_await_event
    visibility: internal
    signature:
      emits: [ExitRequested, AwaitTimedOut, ServerStopped, CommandError]
    description: Keep the profile alive while selecting declared lifecycle events.
    output:
      description: Structured selected lifecycle event.
      schema:
        type: object
        properties:
          source: {type: string}
          route: {type: string}
          method: {type: string}
          signal: {type: string}
          request_id: {type: string}
          payload: {type: object}
    category: boundary
    side_effects: [{kind: state_mutation, target: role_control_queue, state: selected_event_consumed}]
    reversibility: {classification: reversible}
    undo:
      strategy: queue_event_restore
      description: Restore the receipt-recorded event to the front of its source server queue.
      payload: rest_await_event
      captures: [source, event]
    config:
      sources:
        - {server: role_control, routes: [exit], signals: [ExitRequested]}
      timeout: 600s
      stopped_behavior: emit_server_stopped

  - name: stop_role_requests
    type: builtin
    init: rest_server_stop
    visibility: internal
    signature:
      emits: [ServerStopped, CommandError]
    description: Drain and stop the role's request listener during lifecycle exit.
    output:
      description: Structured server stop result.
      schema:
        type: object
        properties:
          server: {type: string}
          address: {type: string}
          drained_events: {type: integer}
          dropped_events: {type: integer}
          status: {type: string}
    category: boundary
    side_effects: [{kind: network_listener_shutdown, target: role_requests, state: listener_stopped}]
    reversibility: {classification: reversible}
    undo: {strategy: noop, description: Relaunch is a separate machine action.}
    config: {rest_ref: role_requests}
