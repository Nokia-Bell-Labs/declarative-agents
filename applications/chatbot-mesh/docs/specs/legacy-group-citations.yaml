id: chatbot-mesh-legacy-group-citations
title: "Chatbot Mesh Legacy Group Citations"
purpose: |
  Citations that name a requirement group rather than an item, predating the
  group-level-citation check (GH-2339). A group survives a rewrite unchanged,
  so a citation naming one can go on resolving while the requirement it names
  has come to mean something else; an item is renumbered or removed instead,
  which checkBrokenCitations already reports.

  Retargeting one of these is a judgement about which item its prose meant,
  not a rewrite, so they are grandfathered rather than migrated in bulk. This
  baseline only stops the count growing. Delete an entry when its use case
  moves to an item; never add one. GH-2365 tracks the migration.
