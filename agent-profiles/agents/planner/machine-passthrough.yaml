name: planner-passthrough
purpose: |-
  The planner pass-through variant loads a requirement graph, extracts
  executable tasks without LLM planning or issue materialization, invokes the
  executor profile, and validates the resulting workspace.

  Variant: pass-through execution skips LLM plan generation and executes extracted tasks directly.
configuration:
  machine: agents/planner/machine.yaml
  tools: agents/planner/tools.yaml
  llm_configs: agents/planner/llm/*.yaml
  tool_declarations:
  - tools/builtin.yaml
  - tools/exec.yaml
  variants:
  - agents/planner/machine-passthrough.yaml
  - agents/planner/machine-plan-only.yaml
invariants:
- The requirement graph is collapsed into one aggregate executable task
- No LLM planning or issue tracker command runs
- Failed execution can be retried directly
- Graph nodes are marked done/failed to track progress
- The planner terminates as completed, stalled, or failed
lifecycle: |-
  1. Idle → Loading: load_graph reads the requirement corpus
  2. Loading → Extracting: extract_all creates one executable aggregate task
  3. Extracting → InitializingRetry → Executing: seed visible retry count, then invoke the executor
  4. Executing → Vetting → Building → Testing: validation pipeline
  5. Validation failure → IncrementingRetry → CheckingRetryLimit
  6. RetryAvailable → Executing; RetriesExhausted → Exhausted → Stalled
  7. Testing success → MarkingTaskDone → QueryingRemainingWork → Completed

  The variant executes one aggregate task; retries return directly to Executing.
pipeline_diagram: |-
  ```mermaid
  flowchart TD
    A[Idle] -->|Seed| L[Loading]
    L -->|GraphLoaded| B[Extracting]
    B -->|TaskExtracted| Z[InitializingRetry]
    Z --> H[Executing]
    H --> I[Vet / Build / Test]
    I -->|Success| J[MarkingTaskDone]
    J --> Q[QueryingRemainingWork]
    Q --> K[Completed]
    I -->|Failure| R[IncrementingRetry]
    R --> P[CheckingRetryLimit]
    P -->|RetryAvailable| H
    P -->|RetriesExhausted| X[Exhausted]
    X --> S[Stalled]
  ```
initial_state: Idle
states:
- name: Idle
  meaning: Initial state before planning begins.
- name: Loading
  meaning: Loading the specification corpus and building the requirement graph.
- name: Extracting
  meaning: Creating one aggregate executable task from all ready requirements.
- name: InitializingRetry
  meaning: Seeding retry count zero in labelled command state for the aggregate task.
- name: Executing
  meaning: Running the generator agent to implement the task.
- name: Vetting
  meaning: Running go vet on the workspace.
- name: Building
  meaning: Running go build on the workspace.
- name: Testing
  meaning: Running go test on the workspace.
- name: IncrementingRetry
  meaning: Incrementing the latest labelled retry count with jq.
- name: CheckingRetryLimit
  meaning: Comparing the visible retry count with the declared limit.
- name: Exhausted
  meaning: Retry limit reached; query graph state before stalling.
- name: MarkingTaskDone
  meaning: Mutating only the aggregate task's graph nodes to Done.
- name: QueryingRemainingWork
  meaning: Reading graph state before preserving pass-through completion routing.
- name: Completed
  meaning: Terminal. All tasks in the graph are done.
- name: Stalled
  meaning: Terminal. Remaining tasks are blocked by failed dependencies.
- name: Failed
  meaning: Terminal. An unrecoverable error occurred.
terminal_states:
- Completed
- Stalled
- Failed
signals:
- name: Seed
  trigger: Loop initialization.
- name: GraphLoaded
  trigger: The requirement graph was loaded and seeded into pipeline state.
- name: TaskExtracted
  trigger: A task was extracted from the requirement graph.
- name: RetryCountInitialized
  trigger: Retry count zero was recorded in labelled command state.
- name: AllDone
  trigger: All tasks in the graph are done.
- name: Blocked
  trigger: Remaining tasks are blocked by failed dependencies.
- name: ToolDone
  trigger: A tool executed successfully.
- name: ToolFailed
  trigger: A tool executed but reported failure.
- name: ExecutionDone
  trigger: The generator agent completed successfully.
- name: ExecutionFailed
  trigger: The generator agent failed.
- name: RetryAvailable
  trigger: Retries remain for the current task.
- name: RetriesExhausted
  trigger: All retries consumed for the current task.
- name: TaskCompleted
  trigger: The current task's graph nodes were marked Done.
- name: WorkRemaining
  trigger: At least one graph task remains ready after the aggregate task.
- name: CommandError
  trigger: Infrastructure-level error.
transitions:
- state: Idle
  signal: Seed
  next: Loading
  action: load_graph
- state: Loading
  signal: GraphLoaded
  next: Extracting
  action: extract_all
- state: Loading
  signal: CommandError
  next: Failed
- state: Extracting
  signal: TaskExtracted
  next: InitializingRetry
  action: reset_retry_count
  label: retry_count
- state: InitializingRetry
  signal: RetryCountInitialized
  next: Executing
  action: execute_task
- state: InitializingRetry
  signal: CommandError
  next: Failed
- state: Extracting
  signal: AllDone
  next: Completed
- state: Extracting
  signal: Blocked
  next: Stalled
- state: Extracting
  signal: CommandError
  next: Failed
- state: Executing
  signal: ExecutionDone
  next: Vetting
  action: vet
- state: Executing
  signal: ExecutionFailed
  next: Vetting
  action: vet
- state: Executing
  signal: CommandError
  next: Failed
- state: Vetting
  signal: ToolDone
  next: Building
  action: build
- state: Vetting
  signal: ToolFailed
  next: IncrementingRetry
  action: increment_retry
  label: retry_count
- state: Vetting
  signal: CommandError
  next: Failed
- state: Building
  signal: ToolDone
  next: Testing
  action: test
- state: Building
  signal: ToolFailed
  next: IncrementingRetry
  action: increment_retry
  label: retry_count
- state: Building
  signal: CommandError
  next: Failed
- state: Testing
  signal: ToolDone
  next: MarkingTaskDone
  action: mark_task_done
- state: Testing
  signal: ToolFailed
  next: IncrementingRetry
  action: increment_retry
  label: retry_count
- state: Testing
  signal: CommandError
  next: Failed
- state: IncrementingRetry
  signal: ToolDone
  next: CheckingRetryLimit
  action: check_retry_limit
- state: IncrementingRetry
  signal: ToolFailed
  next: Failed
- state: IncrementingRetry
  signal: CommandError
  next: Failed
- state: CheckingRetryLimit
  signal: RetryAvailable
  next: Executing
  action: execute_task
- state: CheckingRetryLimit
  signal: RetriesExhausted
  next: Exhausted
  action: remaining_work
- state: CheckingRetryLimit
  signal: CommandError
  next: Failed
- state: Exhausted
  signal: WorkRemaining
  next: Stalled
- state: Exhausted
  signal: AllDone
  next: Completed
- state: Exhausted
  signal: Blocked
  next: Stalled
- state: Exhausted
  signal: CommandError
  next: Failed
- state: MarkingTaskDone
  signal: TaskCompleted
  next: QueryingRemainingWork
  action: remaining_work
- state: MarkingTaskDone
  signal: CommandError
  next: Failed
- state: QueryingRemainingWork
  signal: WorkRemaining
  next: Completed
- state: QueryingRemainingWork
  signal: AllDone
  next: Completed
- state: QueryingRemainingWork
  signal: Blocked
  next: Stalled
- state: QueryingRemainingWork
  signal: CommandError
  next: Failed
