name: scenario-critic-rig
purpose: |-
  Discovers scenarios beside the agents they test and composes each one: the
  scenario's mocks, the subject agent under test with its dependencies
  redirected at those mocks, and the scenario's validator entries. Those entries
  run concrete Critic realizations such as chatbot-turn-critic and
  rag-query-critic, whose declared identities are retained in verdicts. Reduces
  their terminal states to a per-scenario verdict, tears every child down, and
  reports the aggregate.

  Each scenario gets a fresh subject, and teardown runs on the success path and
  on every failure edge, so no child outlives the scenario that started it.
configuration:
  machine: agents/scenario-critic/machine.yaml
  tools: agents/scenario-critic/tools.yaml
metric_labels:
  profile: scenario-critic
initial_state: Idle
budget:
  command_timeout: 6m
  # One dispatch and join per fixture, validator, and child stop keeps every
  # collection traversal under the global iteration budget.
  max_iterations: 5000
  max_duration: 15m
states:
  - name: Idle
    meaning: Initial state before scenario discovery.
  - name: Discovering
    meaning: Enumerating scenarios under the configured roots.
  - name: AdvancingScenario
    meaning: Taking the next scenario from the work list, or finding the list exhausted.
  - name: StartingMocks
    meaning: Starting each fixture mock sequentially through MachineSpec iteration.
  - name: StartingSubject
    meaning: Starting the agent under test with each mock's runtime address injected.
  - name: ProbingHealth
    meaning: Performing one REST health request against the started subject.
  - name: WaitingToRetry
    meaning: Waiting one declared interval before the next health probe.
  - name: RunningValidators
    meaning: Running each validator sequentially through MachineSpec iteration.
  - name: RecordingValidators
    meaning: Recording the validator iterator's ordered joined outcomes.
  - name: CollectingVerdict
    meaning: Deriving this scenario's verdict from its validator outcomes.
  - name: MarkingFailure
    meaning: Recording a verdict for a scenario that failed before its validators ran.
  - name: ListingChildren
    meaning: Exposing subject-first teardown items from the scenario session.
  - name: TearingDown
    meaning: Stopping each child sequentially through MachineSpec iteration.
  - name: EmergencyTeardown
    meaning: Reaping every still-tracked child after ordinary teardown infrastructure failed.
  - name: Reporting
    meaning: Reducing every scenario verdict into the run result.
  - name: Passed
    run_status: succeeded
    meaning: Terminal. Every scenario passed.
  - name: Failed
    run_status: failed
    meaning: Terminal. A scenario failed, discovery found nothing, or a word errored.
terminal_states:
  - Passed
  - Failed
signals:
  - name: Seed
    trigger: Loop initialization.
  - name: SessionSeeded
    trigger: Discovery found at least one scenario.
  - name: NoScenarios
    trigger: Discovery found no scenario under the configured roots.
  - name: ScenarioReady
    trigger: The work list yielded another scenario.
  - name: AllScenariosDone
    trigger: The work list is exhausted.
  - name: MocksStarted
    trigger: The fixture iterator joined after every mock started.
  - name: MockStarted
    trigger: One fixture mock started successfully.
  - name: SubjectStarted
    trigger: The agent under test is running with its dependencies redirected.
  - name: Healthy
    trigger: The subject answered its health route.
  - name: HealthUnavailable
    trigger: One subject health probe returned a configured non-success status.
  - name: HealthRetryReady
    trigger: The retry delay elapsed before the subject startup deadline.
  - name: HealthTimeout
    trigger: The subject did not serve within the declared bound.
  - name: ValidatorCompleted
    trigger: One validator ran to completion.
  - name: ValidatorIncomplete
    trigger: One validator timed out or failed to start.
  - name: ValidatorsCompleted
    trigger: The validator iterator joined with every child completed.
  - name: ValidatorsRecorded
    trigger: Ordered joined validator outcomes were stored in the session.
  - name: ScenarioPassed
    trigger: Every validator in the scenario passed.
  - name: ScenarioFailed
    trigger: A validator failed, or a step before them did.
  - name: ScenarioChildrenListed
    trigger: Subject-first teardown items are available to the iterator.
  - name: ServiceStopped
    trigger: One scenario child was stopped.
  - name: ScenarioTornDown
    trigger: The child-stop iterator joined after every item.
  - name: AllServicesStopped
    trigger: Emergency teardown reaped every child still tracked by the run.
  - name: SessionPassed
    trigger: Every scenario passed.
  - name: SessionFailed
    trigger: At least one scenario failed.
  - name: CommandError
    trigger: A rig word failed.
  - name: BudgetExhausted
    trigger: The rig's global iteration or wall-clock bound was reached.
transitions:
  - state: Idle
    signal: Seed
    next: Discovering
    action: discover_scenarios

  # An empty corpus is a failure, not a silent pass: nothing was proven.
  - state: Discovering
    signal: SessionSeeded
    next: AdvancingScenario
    action: next_scenario
    label: current_scenario
  - state: Discovering
    signal: NoScenarios
    next: Failed
  - state: Discovering
    signal: CommandError
    next: Failed

  - state: AdvancingScenario
    signal: ScenarioReady
    next: StartingMocks
    action: start_scenario_mock
    label: started_mock
    for_each:
      items: $from(current_scenario).fixtures
      as: fixture
      mode: sequential
      failure: fail_fast
      continue_on: [MockStarted]
      abort_on: [CommandError]
      join:
        next: StartingMocks
        label: mocks_joined
        signals:
          all_success: MocksStarted
          failed: CommandError
          empty: MocksStarted
  - state: AdvancingScenario
    signal: AllScenariosDone
    next: Reporting
    action: report_session
  - state: AdvancingScenario
    signal: CommandError
    next: Failed

  # Every failure edge below records a verdict naming its cause, then tears the
  # scenario's children down before the loop continues (srd018 R1.5, R6.2).
  - state: StartingMocks
    signal: MocksStarted
    next: StartingSubject
    action: start_scenario_subject
    label: subject
  - state: StartingMocks
    signal: CommandError
    next: MarkingFailure
    action: fail_scenario_start

  - state: StartingSubject
    signal: SubjectStarted
    next: ProbingHealth
    action: probe_subject_health
  - state: StartingSubject
    signal: CommandError
    next: MarkingFailure
    action: fail_scenario_start

  - state: ProbingHealth
    signal: Healthy
    next: RunningValidators
    action: run_scenario_validator
    label: validator_result
    for_each:
      items: $from(current_scenario).validators
      as: validator
      mode: sequential
      # Bounded parallel iteration is deferred. Sequential dispatch preserves
      # deterministic order without hiding goroutines inside a Go tool.
      failure: collect_all
      continue_on: [ValidatorCompleted, ValidatorIncomplete]
      abort_on: [CommandError]
      join:
        next: RunningValidators
        label: validators_joined
        signals:
          all_success: ValidatorsCompleted
          partial: CommandError
          failed: CommandError
          empty: CommandError
  - state: ProbingHealth
    signal: HealthUnavailable
    next: WaitingToRetry
    action: wait_health_retry
  - state: ProbingHealth
    signal: CommandError
    next: WaitingToRetry
    action: wait_health_retry
  - state: ProbingHealth
    signal: BudgetExhausted
    next: MarkingFailure
    action: fail_scenario_unhealthy

  - state: WaitingToRetry
    signal: HealthRetryReady
    next: ProbingHealth
    action: probe_subject_health
  - state: WaitingToRetry
    signal: HealthTimeout
    next: MarkingFailure
    action: fail_scenario_unhealthy
  - state: WaitingToRetry
    signal: CommandError
    next: MarkingFailure
    action: fail_scenario_start
  - state: WaitingToRetry
    signal: BudgetExhausted
    next: MarkingFailure
    action: fail_scenario_unhealthy

  # The join owns collection traversal; this thin word only records its ordered
  # item outputs for verdict and session reporting.
  - state: RunningValidators
    signal: ValidatorsCompleted
    next: RecordingValidators
    action: record_scenario_validators
  - state: RunningValidators
    signal: CommandError
    next: MarkingFailure
    action: fail_scenario_validators

  - state: RecordingValidators
    signal: ValidatorsRecorded
    next: CollectingVerdict
    action: collect_scenario_verdict
  - state: RecordingValidators
    signal: CommandError
    next: MarkingFailure
    action: fail_scenario_validators

  - state: CollectingVerdict
    signal: ScenarioPassed
    next: ListingChildren
    action: list_scenario_children
    label: scenario_children
  - state: CollectingVerdict
    signal: ScenarioFailed
    next: ListingChildren
    action: list_scenario_children
    label: scenario_children

  - state: MarkingFailure
    signal: ScenarioFailed
    next: ListingChildren
    action: list_scenario_children
    label: scenario_children
  - state: MarkingFailure
    signal: BudgetExhausted
    next: ListingChildren
    action: list_scenario_children
    label: scenario_children

  - state: ListingChildren
    signal: ScenarioChildrenListed
    next: TearingDown
    action: stop_scenario_child
    label: stopped_child
    for_each:
      items: $from(scenario_children).children
      as: child
      mode: sequential
      failure: collect_all
      continue_on: [ServiceStopped]
      abort_on: [CommandError]
      join:
        next: TearingDown
        label: teardown_joined
        signals:
          all_success: ScenarioTornDown
          partial: CommandError
          failed: CommandError
          empty: ScenarioTornDown
  - state: ListingChildren
    signal: CommandError
    next: EmergencyTeardown
    action: stop_all_services

  # A failed scenario does not end the run: every scenario is exercised and the
  # aggregate reports at the end.
  - state: TearingDown
    signal: ScenarioTornDown
    next: AdvancingScenario
    action: next_scenario
    label: current_scenario
  - state: TearingDown
    signal: BudgetExhausted
    next: EmergencyTeardown
    action: stop_all_services
  - state: TearingDown
    signal: CommandError
    next: EmergencyTeardown
    action: stop_all_services
  - state: EmergencyTeardown
    signal: AllServicesStopped
    next: Failed

  - state: Reporting
    signal: SessionPassed
    next: Passed
  - state: Reporting
    signal: SessionFailed
    next: Failed
