  - id: R-MODEL-002
    target: specification
    level: MUST
    statement: >-
      Every `expand` entry in a tool-declaration or rest-definition
      specification MUST name its source fragment under the `fragment`
      keyname; argument bindings MAY accompany the name under the `args`
      keyname, and a name prefix under the `as` keyname.
    acceptance:
      - assertion: fixture
        path: fixtures/specification/expansion-fragment/named.yaml
        check: expansion_names_fragment
        verdict: valid
      - assertion: fixture
