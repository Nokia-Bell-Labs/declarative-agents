# /sessions/.
version: 2
id: bench-ui
title: Bench
source_owner: agents/bench
sidebar:
  title: Bench
panels:
  - id: experiments
    package: local
    route: /experiments
    label: Experiments
  - id: launch
    package: local
    route: /launch
    label: Launch
