unit: catalog-critic-point-exec
tools:
- name: run_oracle_check
  type: exec
  binary: go
  args:
  - test
  - ./...
  visibility: internal
  signature:
    emits:
    - ToolDone
    - ToolFailed
    - CommandError
  description: Run the critic profile's configured Go oracle across the point workspace.
  category: boundary
  side_effects:
  - kind: child_process
    target: go_toolchain
    state: read_only
    description: Runs the configured Go oracle in the point workspace.
  - kind: filesystem_read
    target: point_workspace
    description: Reads source, module, and test files from the point workspace.
  reversibility:
    classification: reversible
    requires_confirmation: false
  undo:
    strategy: noop
    description: Oracle validation does not mutate repository state.
  errors:
  - signal: ToolFailed
    condition: configured oracle exits non-zero
    message_shape: <captured oracle output>
    state_after_failure: point workspace is unchanged
  - signal: CommandError
    condition: configured oracle cannot be started
    message_shape: 'run_oracle_check: <error>'
    state_after_failure: point workspace is unchanged
  output:
    description: Raw configured oracle output.
    schema:
      type: string
- name: commit_workspace_baseline
  type: exec
  binary: git
  args:
  - -c
  - user.name=agent-core
  - -c
  - user.email=agent-core@example.invalid
  - commit
  - -m
  - baseline
  - --allow-empty
  visibility: internal
  signature:
    emits:
    - ToolDone
    - ToolFailed
    - CommandError
  description: Create the deterministic baseline commit for a critic point workspace.
  category: boundary
  side_effects:
  - kind: filesystem_write
    target: point_workspace_git_history
    paths:
    - .git
    description: Creates the baseline commit in the point workspace repository.
  reversibility:
    classification: compensatable
    requires_confirmation: false
  undo:
    strategy: compensating_action
    description: Restore the point workspace ref when checkpointed or compensate with an explicit revert policy.
    payload: boundary_compensation
    captures:
    - workspace_paths
    - git_ref
    requires:
    - Workspace
    - git_ref
  errors:
  - signal: ToolFailed
    condition: git exits non-zero
    message_shape: <captured git output>
    state_after_failure: baseline commit is absent
  - signal: CommandError
    condition: git cannot be started
    message_shape: 'commit_workspace_baseline: <error>'
    state_after_failure: baseline commit is absent
