name: labels
purpose: |-
  Write the program's label schema into the tracker (srd001): create the
  labels control/labels.md lists, and with update rewrite the ones that
  differ. Use when a person asks to set up or update the tracker's labels.

  This machine has no model state: scrum-master issue labels (design.md
  D10, D14; GH-37). The run starts in the system repository's checkout.
configuration:
  machine: plugin/agents/labels/machine.yaml
  tools: plugin/agents/labels/tools.yaml
invariants:
- Every step is a word; no model acts anywhere in this machine
- A refusal ends the run in the state that names it, with the word's reason
lifecycle: |-
  1. Idle → Labels (Seed): scrum-master issue labels
  2. Labels → Done (ToolDone)
initial_state: Idle
budget:
  command_timeout: 16m
  max_iterations: 10
states:
- name: Idle
  meaning: Initial state before the first word.
- name: Labels
  meaning: |
    The labels word: scrum-master issue labels creates the labels the
    schema lists and, with update, rewrites those that differ.
- name: Done
  run_status: succeeded
  meaning: |
    Terminal. Every word ran, and the last one reported what it did.
- name: Refused
  run_status: failed
  meaning: |
    Terminal. The labels could not be written, and the word's reason is
    the run's last output.
- name: Failed
  run_status: failed
  meaning: Terminal. An infrastructure error outside the words' refusals.
terminal_states:
- Done
- Refused
- Failed
signals:
- name: Seed
  trigger: Loop initialization.
- name: ToolDone
  trigger: A word executed successfully.
- name: ToolFailed
  trigger: A word reported failure — a refusal with its reason.
- name: CommandError
  trigger: Infrastructure-level error (not a tool failure).
transitions:
- state: Idle
  signal: Seed
  next: Labels
  action: issue_labels
  summary: true
- state: Labels
  signal: ToolFailed
  next: Refused
- state: Labels
  signal: ToolDone
  next: Done
- state: Idle
  signal: CommandError
  next: Failed
- state: Labels
  signal: CommandError
  next: Failed
