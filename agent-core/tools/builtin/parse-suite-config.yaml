tools:
- name: parse_suite_config
  type: builtin
  init: parse_suite_config
  visibility: internal
  emits:
  - SuiteConfigParsed
  - CommandError
  description: Read and validate evaluator suite YAML metadata without discovering samples or creating session artifacts.
  category: word
  side_effects:
  - kind: state_mutation
    target: eval_session_state
    state: suite_config_parsed
    description: Sets EvalSessionState.Suite with suite metadata and resolved samples directory.
  reversibility:
    classification: reversible
    undo: evaluator_session_restore
  undo:
    strategy: evaluator_session_restore
    description: Restore evaluator session state from the persisted pre-command receipt.
    payload: evaluator_session_snapshot
    captures: [suite, session_dir, result, point_context, iterator_state]
