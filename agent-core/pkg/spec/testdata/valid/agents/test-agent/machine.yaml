name: test-agent
initial_state: Idle
summary_signal: ToolDone
resume_signal: Seed
budget: {max_iterations: 100, command_timeout: 30s}
states:
- name: Idle
  meaning: Waiting for input.
- name: Running
  meaning: Processing the request.
- name: Done
  meaning: Terminal success.
  run_status: succeeded
- name: Failed
  meaning: Terminal failure.
  run_status: failed
terminal_states:
- Done
- Failed
signals:
- name: Seed
  trigger: Loop initialization.
- name: ToolDone
  trigger: A tool completed successfully.
- name: CommandError
  trigger: Infrastructure-level error.
transitions:
- state: Idle
  signal: Seed
  next: Running
  action: do_work
- state: Running
  signal: ToolDone
  next: Done
- state: Running
  signal: CommandError
  next: Failed
