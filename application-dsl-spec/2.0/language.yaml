        path: fixtures/specification/profile-keynames/valid.yaml
        check: profile_required_keynames
        verdict: valid
      - assertion: fixture
        path: fixtures/specification/profile-keynames/invalid.yaml
        check: profile_required_keynames
        verdict: invalid

  - id: R-PROF-002
    status: retired
    retired: >-
      The 2.0 revision retired agent blueprints; no statement replaces this one.
    target: specification
    level: MUST
    statement: >-
      An agent-profile specification that expands a blueprint MUST carry the
      `name` keyname and exactly one expansion entry, and that entry MUST NOT
      carry the `as` keyname.
    acceptance:
