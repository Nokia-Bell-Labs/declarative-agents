# Ollama query embedding (srd058 R1.3): the operation embed_query on the client
# query_embedder, emitting QueryEmbedded with a flat vector under embedding.
unit: provider-ollama-embed-query
params:
- name: input_selector
  type: string
  description: The selector the text to embed is read from, under body_source.
- name: id_selector
  type: string
  default: $.id
  description: The selector an optional record id is read from; the id is carried forward with the text when present.
- name: body_source
  type: string
  enum: [command_state, previous_result]
  default: previous_result
  description: Where input_selector and id_selector read; a command_state caller passes $from(label) selectors for both.
- name: base_url
  type: string
  default: ${OLLAMA_URL:-http://127.0.0.1:11434}
  description: The Ollama endpoint; a deployment sets OLLAMA_URL.
- name: model
  type: string
  default: "qwen3-embedding:8b"
rest:
  version: v1
  auth:
    query_embedder_auth:
      type: none
  limits:
    query_embedder_limits:
      timeout: 60s
      max_request_bytes: 1048576
      max_response_bytes: 4194304
      redirect:
        mode: none
  clients:
    query_embedder:
      base_url: $param(base_url)
      auth_ref: query_embedder_auth
      limits_ref: query_embedder_limits
      operations:
        embed_query:
          method: POST
          path: /api/embeddings
          params:
            body_schema:
              type: object
              required: [input]
              properties:
                input: {type: string}
                id: {}
            body_source: $param(body_source)
            input_mapping:
              input: $param(input_selector)
              id: $param(id_selector)
            carry_forward: [input, id]
          body:
            model: $param(model)
            prompt: "{{ params.input }}"
          success: {status: [200], signal: QueryEmbedded}
          failures:
          - {status: [401, 403], signal: ProviderUnauthorized}
          - {status: [429], signal: ProviderThrottled}
          - {status: [500, 502, 503, 504], signal: ProviderUnavailable}
          response:
            output:
              embedding: $.embedding
          side_effects:
          - kind: external_api
            target: ollama.embeddings
            state: read_only
          reversibility:
            classification: reversible
            undo: noop
