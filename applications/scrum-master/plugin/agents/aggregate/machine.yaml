name: aggregate
purpose: |-
  Aggregate a week or a range of status reports into signals by component
  (srd018): progress per Sprint Goal and the signals that need action. Use
  when the program manager asks for the week's aggregate.

  This machine has no model state: scrum-master reports aggregate
  (design.md D10, D14; GH-37). The reports repository is the run's
  checkout.
configuration:
  machine: plugin/agents/aggregate/machine.yaml
  tools: plugin/agents/aggregate/tools.yaml
invariants:
- Every step is a word; no model acts anywhere in this machine
- A refusal ends the run in the state that names it, with the word's reason
lifecycle: |-
  1. Idle → Aggregate (Seed): scrum-master reports aggregate
  2. Aggregate → Done (ToolDone)
initial_state: Idle
budget:
  command_timeout: 16m
  max_iterations: 10
states:
- name: Idle
  meaning: Initial state before the first word.
- name: Aggregate
  meaning: |
    The aggregate word: scrum-master reports aggregate reads the period's
    reports into progress per Sprint Goal and signals, and with push files
    each actionable signal once.
- name: Done
  run_status: succeeded
  meaning: |
    Terminal. Every word ran, and the last one reported what it did.
- name: Refused
  run_status: failed
  meaning: |
    Terminal. The aggregate was refused, and the word's reason is the
    run's last output.
- name: Failed
  run_status: failed
  meaning: Terminal. An infrastructure error outside the words' refusals.
terminal_states:
- Done
- Refused
- Failed
signals:
- name: Seed
  trigger: Loop initialization.
- name: ToolDone
  trigger: A word executed successfully.
- name: ToolFailed
  trigger: A word reported failure — a refusal with its reason.
- name: CommandError
  trigger: Infrastructure-level error (not a tool failure).
transitions:
- state: Idle
  signal: Seed
  next: Aggregate
  action: reports_aggregate
  summary: true
- state: Aggregate
  signal: ToolFailed
  next: Refused
- state: Aggregate
  signal: ToolDone
  next: Done
- state: Idle
  signal: CommandError
  next: Failed
- state: Aggregate
  signal: CommandError
  next: Failed
