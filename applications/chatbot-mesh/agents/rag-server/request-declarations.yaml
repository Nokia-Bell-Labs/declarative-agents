tools:
  - name: rag_resolve
    type: builtin
    init: rest_client_invoke
    category: boundary
    description: Create-or-get the served collection and carry the query vector forward.
    problem: Single-hop threading means the resolved collection id and the query vector must ride together into the query word.
    goals:
      - Create-or-get the plain served collection with no server-side embedding function.
      - Resolve the returned collection id for the query path.
      - Carry the caller-supplied query vector forward from the seeded request body.
    requirements:
      input:
        - The query vector is selected from the seeded request body output.
      output:
        - Output includes the mapped collection id and the carried query vector.
      errors:
        - Network, timeout, schema, and mapping failures emit CommandError.
    non_goals:
      - Does not configure a server-side embedding function.
      - Does not accept runtime method, URL, host, or auth overrides.
    parameters:
      type: object
      properties:
        query_embeddings: {type: array}
        # Carried through this word to the query that follows it. The operation
        # maps and requires it, so leaving it undeclared here described a word
        # that takes less than it is given.
        n_results: {type: integer}
    emits: [CollectionReady, CommandError]
    output:
      description: Mapped Chroma collection id with the carried query vector.
      schema:
        type: object
        properties:
          mapped: {type: object}
          carried: {type: object}
    side_effects:
      - kind: external_api
        target: chroma.collection
        state: collection_upserted
    # Irreversible, and deliberately stronger than the transport-level
    # reversible/noop the operation declares: the two describe different things.
    # The operation says the HTTP call needs no compensating request; this says
    # the effect cannot be undone, for the reason the undo block gives -- a
    # create-or-get may have created the collection, and deleting it to unwind
    # would destroy a pre-existing one carrying the same trusted name.
    reversibility:
      classification: irreversible
      requires_confirmation: true
    undo:
      strategy: irreversible
      description: Create-or-get may create an empty collection; deleting it could destroy a pre-existing collection with the same trusted name.
    config:
      rest_ref: chroma
      operation: rag_resolve_collection

  - name: rag_query
    type: builtin
    init: rest_client_invoke
    category: boundary
    description: Query the resolved collection with the caller-supplied query vector.
    problem: Chroma retrieval uses a client-supplied query vector threaded from the previous words.
    goals:
      - Thread the collection id and query vector from the previous Result.
      - Return the retrieved chunk ids, documents, and distances.
    requirements:
      input:
        - Collection id and query vector are selected from the previous Result output.
      output:
        - Output includes the retrieved chunk ids, documents, and distances.
      errors:
        - Network, timeout, schema, and mapping failures emit CommandError.
    non_goals:
      - Does not author the query vector.
      - Does not accept runtime method, URL, host, or auth overrides.
    parameters:
      type: object
      properties:
        collection: {type: string}
        query_embeddings: {type: array}
        # Required and mapped by the operation, so it belongs in the word's own
        # parameter set rather than arriving undeclared.
        n_results: {type: integer}
    emits: [QueryResponded, QueryRejected, CommandError]
    output:
      description: Mapped Chroma query result.
      schema:
        type: object
        # The REST client's result shape, the same one rag_resolve declares: the
        # mapped response sits under mapped, and the terminal body reads it as
        # $.mapped.ids. Declaring the three at the top level described a shape
        # no reader selects.
        properties:
          mapped: {type: object}
          carried: {type: object}
    side_effects:
      - kind: external_api
        target: chroma.query
        state: read_only
    reversibility:
      classification: reversible
    undo:
      strategy: noop
      description: Querying a collection does not mutate state.
    config:
      rest_ref: chroma
      operation: rag_query
