# Mock for the Ollama provider, claiming these behaviors:
# - POST /api/embeddings: the embed_query REST word maps $.embedding.
# - POST /api/chat: adapter chatResp shape {message:{role,content},...}. The
#   source selector, tier selector, and answer call hit this HTTP route in order.
# The real-stack ladder (#408) validates these claims against live Ollama.
routes:
  - method: POST
    path: /api/embeddings
    responses:
      - status: 200
        body:
          embedding: [0.11, 0.22, 0.33, 0.44]

  - method: POST
    path: /api/chat
    responses:
      - status: 200
        body:
          message:
            role: assistant
            # Malformed output must select all declared sources. This scenario
            # then observes rag0 success and rag1 degradation, proving full fan-out.
            content: 'not-json'
          eval_count: 4
          prompt_eval_count: 12
      - status: 200
        body:
          message:
            role: assistant
            # The single-turn fixture preserves deterministic fast-word evidence;
            # this degraded fixture proves the deep answer branch.
            content: '{"tool":"invoke_llm_deep"}'
          eval_count: 4
          prompt_eval_count: 12
      - status: 200
        body:
          message:
            role: assistant
            content: "The corpus describes the scenario critic rig and its mocks."
          eval_count: 11
          prompt_eval_count: 42
