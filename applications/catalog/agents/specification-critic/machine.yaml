name: specification-critic
purpose: |-
  The validator is a deterministic agent that loads a specification
  corpus, builds a labeled property graph of inter-document
  references, runs consistency checks, and produces a validation
  report. It does NOT use an LLM — it is a tool pipeline.
configuration:
  machine: agents/specification-critic/machine.yaml
  tools: agents/specification-critic/tools.yaml
invariants:
- The validator never calls an LLM
- Both pass and fail outcomes produce a formatted report
- The corpus is loaded from the filesystem — no network calls
- The graph is immutable once built — validation is read-only
lifecycle: |-
  1. Idle → Loading (Seed): load_corpus from project directory
  2. Loading → Validating (ToolDone): validate_specs
  3. Validating → RefSearching: externally scan one ref_check at a time
  4. RefSearching → RefReducing: reduce reference evidence
  5. RefReducing → ConsistencySearching: externally scan consistency evidence
  6. ConsistencySearching → ConsistencyReducing: evaluate YAML and path rules
  7. ConsistencyReducing → Searching: run one declared jurist_rg word per grep_check
  8. Searching → Reducing (GrepSearched): reduce_grep_checks
  9. Reducing → Reporting (ValidationPassed/ValidationFailed): format_report
  10. Reporting → Passed/Failed: validation completed with a formatted report
  11. Any active step → Failed (CommandError): infrastructure error

  Search iteration is deterministic and sequential, with no LLM calls.
initial_state: Idle
budget:
  command_timeout: 15m
  max_iterations: 100
states:
- name: Idle
  meaning: Initial state before validation begins.
- name: Loading
  meaning: |
    Loading the specification corpus from the project directory.
    Parses SRDs, use cases, test suites, and their cross-references.
- name: Validating
  meaning: |
    Running consistency checks on the specification graph:
    orphan detection, missing references, duplicate IDs, cycle
    detection, and coverage gap analysis.
- name: Searching
  meaning: Running declared ripgrep searches for each grep_check plan.
- name: RefSearching
  meaning: Running declared target and inventory scans for each ref_check plan.
- name: RefReducing
  meaning: Resolving extracted references against externally loaded inventories.
- name: ConsistencySearching
  meaning: Externally loading YAML documents and path inventories for consistency checks.
- name: ConsistencyReducing
  meaning: Evaluating YAML rules and provenance over externally loaded evidence.
- name: Reducing
  meaning: Shaping ripgrep events into match or missing findings with provenance.
- name: Reporting
  meaning: Formatting the validation results into a human-readable report.
- name: Passed
  run_status: succeeded
  meaning: Terminal. All validation checks passed.
- name: Failed
  run_status: failed
  meaning: Terminal. Validation errors were found or an infrastructure error occurred.
terminal_states:
- Passed
- Failed
signals:
- name: Seed
  trigger: Loop initialization.
- name: ToolDone
  trigger: A tool completed successfully.
- name: ToolFailed
  trigger: A tool completed with errors.
- name: CommandError
  trigger: Infrastructure-level error.
- name: ValidationPassed
  trigger: All consistency checks passed.
- name: ValidationFailed
  trigger: One or more consistency checks failed.
- name: GrepSearched
  trigger: All grep_check searches completed, including no-match outcomes.
- name: RefSearched
  trigger: All ref_check scans completed.
- name: ConsistencySearched
  trigger: All consistency_check file scans completed.
transitions:
- state: Idle
  signal: Seed
  next: Loading
  action: load_corpus
  label: loaded_corpus
- state: Loading
  signal: ToolDone
  next: Validating
  action: validate_specs
- state: Loading
  signal: CommandError
  next: Failed
- state: Validating
  signal: ValidationPassed
  next: RefSearching
  action: jurist_ref_scan
  label: ref_result
  for_each:
    items: $from(loaded_corpus).ref_checks
    as: ref_check
    mode: sequential
    failure: collect_all
    continue_on: [ToolDone]
    abort_on: [ToolFailed, CommandError]
    join:
      next: RefSearching
      label: ref_results
      signals:
        all_success: RefSearched
        partial: CommandError
        failed: CommandError
        empty: RefSearched
- state: Validating
  signal: ValidationFailed
  next: RefSearching
  action: jurist_ref_scan
  label: ref_result
  for_each:
    items: $from(loaded_corpus).ref_checks
    as: ref_check
    mode: sequential
    failure: collect_all
    continue_on: [ToolDone]
    abort_on: [ToolFailed, CommandError]
    join:
      next: RefSearching
      label: ref_results
      signals:
        all_success: RefSearched
        partial: CommandError
        failed: CommandError
        empty: RefSearched
- state: Validating
  signal: CommandError
  next: Failed
- state: RefSearching
  signal: RefSearched
  next: RefReducing
  action: reduce_ref_checks
- state: RefSearching
  signal: CommandError
  next: Failed
- state: RefReducing
  signal: ValidationPassed
  next: ConsistencySearching
  action: jurist_consistency_scan
  label: consistency_result
  for_each: &consistency_iteration
    items: $from(loaded_corpus).consistency_checks
    as: consistency_check
    mode: sequential
    failure: collect_all
    continue_on: [ToolDone]
    abort_on: [ToolFailed, CommandError]
    join:
      next: ConsistencySearching
      label: consistency_results
      signals:
        all_success: ConsistencySearched
        partial: CommandError
        failed: CommandError
        empty: ConsistencySearched
- state: RefReducing
  signal: ValidationFailed
  next: ConsistencySearching
  action: jurist_consistency_scan
  label: consistency_result
  for_each: *consistency_iteration
- state: RefReducing
  signal: CommandError
  next: Failed
- state: ConsistencySearching
  signal: ConsistencySearched
  next: ConsistencyReducing
  action: reduce_consistency_checks
- state: ConsistencySearching
  signal: CommandError
  next: Failed
- state: ConsistencyReducing
  signal: ValidationPassed
  next: Searching
  action: jurist_rg
  label: grep_result
  for_each: &grep_iteration
    items: $from(loaded_corpus).grep_checks
    as: grep_check
    mode: sequential
    failure: collect_all
    continue_on: [ToolDone, ToolFailed]
    abort_on: [CommandError]
    join:
      next: Searching
      label: grep_results
      signals:
        all_success: GrepSearched
        partial: CommandError
        failed: CommandError
        empty: GrepSearched
- state: ConsistencyReducing
  signal: ValidationFailed
  next: Searching
  action: jurist_rg
  label: grep_result
  for_each: *grep_iteration
- state: ConsistencyReducing
  signal: CommandError
  next: Failed
- state: Searching
  signal: GrepSearched
  next: Reducing
  action: reduce_grep_checks
- state: Searching
  signal: CommandError
  next: Failed
- state: Reducing
  signal: ValidationPassed
  next: Reporting
  action: format_report
- state: Reducing
  signal: ValidationFailed
  next: Reporting
  action: format_report
- state: Reducing
  signal: CommandError
  next: Failed
- state: Reporting
  signal: ToolDone
  next: Passed
- state: Reporting
  signal: ToolFailed
  next: Failed
- state: Reporting
  signal: CommandError
  next: Failed
