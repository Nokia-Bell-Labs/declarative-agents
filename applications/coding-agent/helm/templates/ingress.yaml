{{- if .Values.ingress.enabled }}
{{- $fullname := include "coding-agent.fullname" . }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "coding-agent.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.hosts.planner }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: {service: {name: {{ $fullname }}-planner, port: {name: request}}}
    - host: {{ .Values.ingress.hosts.plannerHealth }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: {service: {name: {{ $fullname }}-planner, port: {name: control}}}
    - host: {{ .Values.ingress.hosts.executor }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: {service: {name: {{ $fullname }}-executor, port: {name: control}}}
    - host: {{ .Values.ingress.hosts.critic }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: {service: {name: {{ $fullname }}-critic, port: {name: control}}}
    - host: {{ .Values.ingress.hosts.collector }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: {service: {name: {{ $fullname }}-collector, port: {name: query}}}
{{- end }}
