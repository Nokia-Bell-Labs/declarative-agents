{{- if .Values.applier.enabled }}
{{- include "agent-architecture.validateValues" . -}}
{{- $fullname := include "agent-architecture.fullname" . -}}
{{/*
The applier (srd002-applier): the Agent Architecture application's deployment-plane
actuation agent. It runs the runtime with a mounted profile whose request machines
bind the helm and kubectl CLIs its image carries as exec words. It edits deployment
values and triggers rollouts only; it submits no endpoint or credential to a running
curator or collector.

Sanctioned image divergence (srd001 R1.2, srd002-applier R5.3): the shared applier
image carries helm and kubectl alongside the agent-core runtime binary. Recorded
here so the declarative-decomposition audit does not re-flag it. The chart is not
baked into the image (GH-1368): it is delivered to the applier pod at /chart as a
mounted volume (the packaged chart, unpacked by the stage-chart init container),
so the bytes travel with the Helm release and one shared image serves every app.

The applier profile is mounted from its own ConfigMap (collector-style, .Files.Glob)
rather than the catalog curator and collector closures, because it is an
application-owned profile staged under profiles/applier by mage helmPrepare, not a
catalog-referenced role.
*/}}
{{- $applierFiles := .Files.Glob "profiles/applier/**" -}}
{{- if not $applierFiles }}
{{- fail "no staged applier profile closure under profiles/applier; run mage helmPrepare" -}}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fullname }}-applier-profiles
  labels:
    {{- include "agent-architecture.labels" . | nindent 4 }}
    app.kubernetes.io/component: applier
data:
  {{- range $path, $_ := $applierFiles }}
  {{- $key := $path | trimPrefix "profiles/applier/" | replace "/" "__" }}
  {{ $key }}: |-
  {{- if eq $key "agents__applier__exec-declarations.yaml" }}
    {{- /* Rewrite the applier exec args' placeholder coordinates to the installed
          release so an applier installed under any release name targets its own
          release, namespace, and collector Deployment rather than a baked
          agent-architecture/default. The deployment token is replaced before the
          bare release tokens because it contains the release-chart name. The applier
          verifies and reads the collector Deployment (the stable server), not the
          bounded curator, so only the collector token appears here. */}}
    {{- $exec := $.Files.Get $path }}
    {{- $exec = $exec | replace "deployment/agent-architecture-collector" (printf "deployment/%s-collector" $fullname) }}
    {{- $exec = $exec | replace "upgrade, agent-architecture," (printf "upgrade, %s," $.Release.Name) }}
    {{- $exec = $exec | replace "rollback, agent-architecture]" (printf "rollback, %s]" $.Release.Name) }}
    {{- $exec = $exec | replace "--namespace, default," (printf "--namespace, %s," $.Release.Namespace) }}
    {{- $exec | nindent 4 }}
  {{- else }}
    {{- $.Files.Get $path | nindent 4 }}
  {{- end }}
  {{- end }}
{{- if .Values.applier.chartArchive }}
---
# The chart the applier's `helm upgrade agent-architecture /chart` word installs,
# delivered to the applier pod as data rather than baked into the shared applier
# image (GH-1368): the app's packaged chart tarball, base64 in this ConfigMap,
# unpacked into an emptyDir at /chart by the stage-chart init container below. The
# bytes travel with the Helm release, so the shared image carries no per-app chart.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fullname }}-applier-chart
  labels:
    {{- include "agent-architecture.labels" . | nindent 4 }}
    app.kubernetes.io/component: applier
binaryData:
  chart.tgz: {{ .Values.applier.chartArchive | quote }}
{{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $fullname }}-applier
  labels:
    {{- include "agent-architecture.labels" . | nindent 4 }}
    app.kubernetes.io/component: applier
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $fullname }}-applier
  labels:
    {{- include "agent-architecture.labels" . | nindent 4 }}
    app.kubernetes.io/component: applier
rules:
  # Read deployment state for the rollout verification (kubectl rollout status of
  # the collector Deployment, the stable verify target).
  - apiGroups: [""]
    resources: [configmaps, services]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch]
  # kubectl rollout status judges readiness by watching the ReplicaSets and Pods a
  # Deployment owns, so the applier's verify step reads them even though it never
  # writes them. The apply itself no longer waits; the verify is what needs this.
  - apiGroups: [apps]
    resources: [replicasets]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
  {{- if .Values.applier.allowApply }}
  # The apply path runs helm upgrade in-cluster, which manages the chart's objects
  # and the release Secret. Scoped to this namespace by the RoleBinding.
  #
  # helm reads the release Secrets before it does anything -- even --dry-run queries
  # them to find the current release -- so secrets appear in a read rule here, not
  # only in the write rule below.
  - apiGroups: [""]
    resources: [secrets, serviceaccounts]
    verbs: [get, list, watch]
  # An upgrade re-renders the whole chart (srd002-applier R2.2), so the applier must
  # read and write every object kind the chart contains. Writing Roles is bounded:
  # the RoleBinding keeps every grant namespace-scoped, and Kubernetes forbids
  # granting permissions the grantor does not already hold, so the applier can
  # re-apply its own Role but cannot widen it.
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get, list, watch, create, update, patch]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [roles, rolebindings]
    verbs: [get, list, watch, create, update, patch]
  - apiGroups: [""]
    resources: [configmaps, secrets, services, serviceaccounts, persistentvolumeclaims]
    verbs: [create, update, patch, delete]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [create, update, patch]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $fullname }}-applier
  labels:
    {{- include "agent-architecture.labels" . | nindent 4 }}
    app.kubernetes.io/component: applier
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $fullname }}-applier
subjects:
  - kind: ServiceAccount
    name: {{ $fullname }}-applier
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-applier
  labels:
    {{- include "agent-architecture.labels" . | nindent 4 }}
    app.kubernetes.io/component: applier
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "agent-architecture.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: applier
  template:
    metadata:
      labels:
        {{- include "agent-architecture.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: applier
      annotations:
        checksum/profiles: {{ .Files.Glob "profiles/applier/**" | toString | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      # The applier calls the Kubernetes API through helm and kubectl, so unlike the
      # curator and collector it mounts its ServiceAccount token.
      automountServiceAccountToken: true
      serviceAccountName: {{ $fullname }}-applier
      terminationGracePeriodSeconds: 30
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.applier.chartArchive }}
      initContainers:
        # Unpack the app's packaged chart into the shared /chart emptyDir so the
        # applier's `helm upgrade agent-architecture /chart` word finds a chart
        # directory. The chart is delivered as data (the applier-chart ConfigMap),
        # not baked into the shared applier image (GH-1368). --strip-components=1
        # drops the tarball's top-level agent-architecture/ directory so /chart is
        # the chart root.
        - name: stage-chart
          image: "{{ .Values.applier.image.repository }}:{{ .Values.applier.image.tag }}"
          imagePullPolicy: {{ .Values.applier.image.pullPolicy }}
          command: ["sh", "-c", "tar -xzf /chart-src/chart.tgz -C /chart --strip-components=1"]
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - {name: chart-src, mountPath: /chart-src, readOnly: true}
            - {name: chart, mountPath: /chart}
      {{- end }}
      containers:
        - name: applier
          # The shared applier image carries the agent-core runtime plus helm and
          # kubectl; the chart is mounted at /chart (not baked, GH-1368). The exec
          # words run `helm upgrade <release> /chart ...`.
          image: "{{ .Values.applier.image.repository }}:{{ .Values.applier.image.tag }}"
          imagePullPolicy: {{ .Values.applier.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          args:
            - "--profile"
            - {{ include "agent-architecture.roleProfile" (dict "root" . "role" "applier") | quote }}
            - "--directory"
            - "{{ .Values.applier.workDir }}"
            - "--otel-service-name"
            - "agent-architecture-applier"
            {{- with include "agent-architecture.otlpEndpoint" . }}
            - "--otel-otlp-endpoint"
            - {{ . | quote }}
            {{- end }}
          env:
            - {name: APPLIER_BIND_HOST, value: "0.0.0.0"}
            # The workspace the agent writes its values file into, the same path
            # mounted as the work volume below and passed as --directory, so the
            # write stays inside the workspace wherever the mount moves.
            - {name: APPLIER_WORK_DIR, value: {{ .Values.applier.workDir | quote }}}
            - name: POD_NAME
              valueFrom:
                fieldRef: {fieldPath: metadata.name}
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "service.namespace=agent-architecture,service.instance.id=$(POD_NAME)"
            # helm and kubectl caches under a writable path, because the root
            # filesystem is read-only.
            - {name: HOME, value: /tmp}
            - {name: HELM_CACHE_HOME, value: /tmp/helm/cache}
            - {name: HELM_CONFIG_HOME, value: /tmp/helm/config}
            - {name: HELM_DATA_HOME, value: /tmp/helm/data}
          ports:
            - {name: apply, containerPort: {{ .Values.applier.ports.apply }}, protocol: TCP}
            - {name: control, containerPort: {{ .Values.applier.ports.control }}, protocol: TCP}
            - {name: monitor, containerPort: {{ .Values.applier.ports.monitor }}, protocol: TCP}
          readinessProbe:
            httpGet: {path: /api/lifecycle/health, port: control}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.applier.resources | nindent 12 }}
          volumeMounts:
            - {name: profiles, mountPath: /profiles, readOnly: true}
            - {name: work, mountPath: {{ .Values.applier.workDir }}}
            - {name: tmp, mountPath: /tmp}
            {{- if .Values.applier.chartArchive }}
            # The chart the stage-chart init container unpacked, at the /chart path
            # the helm_upgrade exec word references (GH-1368).
            - {name: chart, mountPath: /chart}
            {{- end }}
      volumes:
        {{- if .Values.applier.chartArchive }}
        - name: chart
          emptyDir: {}
        - name: chart-src
          configMap:
            name: {{ $fullname }}-applier-chart
        {{- end }}
        - name: profiles
          projected:
            defaultMode: 0444
            sources:
              - configMap:
                  name: {{ $fullname }}-applier-profiles
                  items:
                    {{- range $path, $_ := .Files.Glob "profiles/applier/**" }}
                    - key: {{ $path | trimPrefix "profiles/applier/" | replace "/" "__" }}
                      path: {{ $path | trimPrefix "profiles/applier/" }}
                    {{- end }}
        - name: work
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-applier
  labels:
    {{- include "agent-architecture.labels" . | nindent 4 }}
    app.kubernetes.io/component: applier
spec:
  type: ClusterIP
  selector:
    {{- include "agent-architecture.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: applier
  ports:
    - {name: apply, port: {{ .Values.applier.ports.apply }}, targetPort: apply}
    - {name: control, port: {{ .Values.applier.ports.control }}, targetPort: control}
    - {name: monitor, port: {{ .Values.applier.ports.monitor }}, targetPort: monitor}
{{- if .Values.applier.networkPolicy.enabled }}
---
# The apply surface carries no inbound authentication (agent-core REST servers do
# not), so it is gated at the network layer (srd002-applier R4.3): the default-deny
# ingress below admits nothing to the applier pods, keeping the apply port
# unreachable from the curator and collector pods. An authorized operator or CI
# caller reaches it by an explicitly provisioned path (port-forward or an ingress the
# operator adds), never from inside the release.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-applier
  labels:
    {{- include "agent-architecture.labels" . | nindent 4 }}
    app.kubernetes.io/component: applier
spec:
  podSelector:
    matchLabels:
      {{- include "agent-architecture.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: applier
  policyTypes: [Ingress]
  ingress: []
{{- end }}
{{- end }}
