# The validator word every rig-subject scenario drives the subject with. The
# three scenarios differ in their machine and expectation, not in this word,
# so they import it rather than each carrying a copy.
unit: rig-subject-validator-tools
tools:
  - name: drive_subject
    type: builtin
    init: rest_client_get
    visibility: internal
    category: boundary
    description: Read the subject's dependency-reading route and map its answer to a signal.
    parameters:
      type: object
      properties: {}
    signature:
      emits: [SubjectAnswered, SubjectDegraded, SubjectBroke, RESTResourceRead, CommandError]
    output:
      description: The subject's response.
      schema:
        type: object
        properties:
          dependency: {type: string}
    side_effects:
      - kind: state_read
        target: subject_agent
        state: read_only
    reversibility:
      classification: reversible
    undo:
      strategy: noop
      description: Driving a read-only route changes nothing.
    errors:
      - signal: CommandError
        condition: The subject is unreachable or returns an unmapped status.
        state_after_failure: No state changes.
    config:
      rest_ref: subject
      resource: read
      operation: get
