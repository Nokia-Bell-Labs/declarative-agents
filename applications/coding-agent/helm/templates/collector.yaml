{{- if .Values.collector.enabled }}
{{/*
The collector workload and its Service come from the shared agent-services
library (GH-2045). This chart supplies the role-sharded profile partitions it
mounts and the profile path the runtime reads; the collector serves its trace UI
from the profile directory, which the library uses as the working directory
(srd020 R7, GH-1228).
*/}}
{{- $context := dict "root" . "role" "collector" -}}
{{- $manifest := include "coding-agent.roleManifest" $context | fromYaml -}}
{{- include "agent-services.collector" (dict
      "root" .
      "profilePath" (printf "/profiles/%s" $manifest.profile)
      "profilesVolume" (include "coding-agent.profilesVolume" $context | fromYamlArray)
      "podAnnotations" (dict "checksum/profiles" (include "coding-agent.profileChecksum" $context))) }}
{{- end }}
