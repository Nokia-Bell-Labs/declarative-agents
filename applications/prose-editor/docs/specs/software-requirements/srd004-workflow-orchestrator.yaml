    - {name: appending_commit_progress, meaning: Persist commit and tree identities.}
    - {name: projecting_commit_progress, meaning: Project commit progress before remote mutation.}
    - {name: checking_publication_before_push, meaning: Reconcile remote branch state before push.}
    - {name: pushing_publication, meaning: Push the recorded commit without force.}
    - {name: appending_push_progress, meaning: Persist the pushed ref and remote head.}
    - {name: projecting_push_progress, meaning: Project push progress before PR mutation.}
    - {name: finding_pull_request, meaning: Find zero or one matching pull request.}
    - {name: creating_pull_request, meaning: Create or reuse one pull request.}
    - {name: appending_pr_progress, meaning: Persist pull-request identity.}
    - {name: projecting_pr_progress, meaning: Project PR progress before verification.}
    - {name: verifying_publication, meaning: Verify commit tree, branch head, base, and pull request.}
    - {name: appending_publication_complete, meaning: Persist complete publication as terminal intent.}
    - {name: projecting_publication_complete, meaning: Project terminal published state.}
    - {name: appending_nonpublication_terminal, meaning: Persist kept_original or failed before exit.}
    - {name: projecting_nonpublication_terminal, meaning: Project a non-publication terminal state.}
    - {name: appending_publication_blocked, meaning: Persist partial-publication conflict and evidence.}
    - {name: projecting_publication_blocked, meaning: Project blocked state before one operator suspension.}
    - {name: awaiting_operator, meaning: Suspend exactly once for partial publication, integrity conflict, or recovery conflict.}
    - {name: exiting_published, meaning: Exit after the published terminal revision is durable.}
    - {name: exiting_kept_original, meaning: Exit after the kept_original terminal revision is durable.}
    - {name: exiting_failed, meaning: Exit after the failed terminal revision is durable.}
    - {name: exiting_publication_blocked, meaning: Exit after blocked publication is durably unresolved or aborted.}
    - {name: exiting_operator_aborted, meaning: Exit after the operator_aborted terminal revision is durable.}
    - {name: published, meaning: Terminal; one publication is remotely verified.}
    - {name: kept_original, meaning: Terminal; policy kept the immutable original and published nothing.}
    - {name: failed, meaning: Terminal; saga ended without publication.}
    - {name: publication_blocked, meaning: Terminal; partial or conflicting publication requires operator action.}
    - {name: operator_aborted, meaning: Terminal; operator aborted without destructive compensation.}

