{{- if .Values.collector.enabled }}
{{- $fullname := include "chatbot-mesh.fullname" . -}}
{{- $external := .Values.collector.externalOTLPEndpoint -}}
{{- $agent := eq .Values.collector.implementation "agent" -}}
{{- $uiArchive := .Values.collector.uiArchiveConfigMap | default "" -}}
{{- if not $agent }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fullname }}-collector-contrib
  labels:
    {{- include "chatbot-mesh.labels" . | nindent 4 }}
    app.kubernetes.io/component: collector
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:{{ .Values.collector.otlpGRPCPort }}
          http:
            endpoint: 0.0.0.0:{{ .Values.collector.otlpHTTPPort }}
      {{- if .Values.dolt.enabled }}
      prometheus/dolt:
        config:
          scrape_configs:
            - job_name: dolt
              scrape_interval: 5s
              static_configs:
                - targets: [{{ printf "%s-dolt:%v" $fullname .Values.dolt.metricsPort | quote }}]
      {{- end }}
    processors:
      batch: {}
      {{- if $external }}
      resource/integration:
        attributes:
          - {key: test.repository, value: {{ .Values.collector.integrationResource.repository | quote }}, action: upsert}
          - {key: test.module, value: {{ .Values.collector.integrationResource.module | quote }}, action: upsert}
          - {key: test.target, value: {{ .Values.collector.integrationResource.target | quote }}, action: upsert}
          - {key: vcs.ref.head.revision, value: {{ .Values.collector.integrationResource.commit | quote }}, action: upsert}
          - {key: test.run.id, value: {{ .Values.collector.integrationResource.runID | quote }}, action: upsert}
      {{- end }}
    exporters:
      {{- if $external }}
      otlp/external:
        endpoint: {{ $external | quote }}
        tls:
          insecure: true
      {{- end }}
      debug:
        verbosity: basic
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [{{ if $external }}resource/integration, {{ end }}batch]
          exporters:
            {{- if $external }}
            - otlp/external
            {{- else }}
            - debug
            {{- end }}
        metrics:
          receivers: [otlp{{ if .Values.dolt.enabled }}, prometheus/dolt{{ end }}]
          processors: [{{ if $external }}resource/integration, {{ end }}batch]
          exporters:
            {{- if $external }}
            - otlp/external
            {{- else }}
            - debug
            {{- end }}
{{- end }}
{{- if and $agent (not $uiArchive) }}
---
# The collector's built trace UI (srd020 R7), carried by a collector-only
# ConfigMap so it never enters the shared profiles ConfigMap that every pod
# mounts. The collector container mounts it at /collector-ui and serves ui/dist
# from there.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fullname }}-collector-ui
  labels:
    {{- include "chatbot-mesh.labels" . | nindent 4 }}
    app.kubernetes.io/component: collector
data:
  {{- range $path, $_ := .Files.Glob "collector-ui/**" }}
  {{ $path | trimPrefix "collector-ui/" | replace "/" "__" }}: |-
    {{- $.Files.Get $path | nindent 4 }}
  {{- end }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-collector
  labels:
    {{- include "chatbot-mesh.labels" . | nindent 4 }}
    app.kubernetes.io/component: collector
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "chatbot-mesh.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: collector
  template:
    metadata:
      labels:
        {{- include "chatbot-mesh.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: collector
      {{- if $uiArchive }}
      annotations:
        checksum/collector-ui-archive: {{ required "collector.uiArchiveChecksum is required with collector.uiArchiveConfigMap" .Values.collector.uiArchiveChecksum | quote }}
      {{- end }}
    spec:
      {{- if and $agent $uiArchive }}
      initContainers:
        - name: stage-collector-ui
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - sh
            - -c
            - >-
              echo '{{ .Values.collector.uiArchiveChecksum }}  /collector-ui-src/assets.tgz' |
              sha256sum -c - &&
              tar -xzf /collector-ui-src/assets.tgz -C /collector-ui &&
              cd /collector-ui &&
              sha256sum -c .inventory.sha256 &&
              rm .inventory.sha256
          volumeMounts:
            - {name: collector-ui-source, mountPath: /collector-ui-src, readOnly: true}
            - {name: collector-ui, mountPath: /collector-ui}
      {{- end }}
      containers:
        - name: collector
          {{- if $agent }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # The collector serves its trace UI from the literal ui/dist path
          # (srd020 R7), resolved against the working directory. The UI bundle
          # rides a collector-only ConfigMap mounted at /collector-ui rather than
          # the shared profiles ConfigMap (which mounts into every pod and must
          # stay under its size limit), so the working directory is /collector-ui
          # -- no UI environment variable (GH-1228).
          workingDir: /collector-ui
          args:
            - "--profile"
            - "{{ .Values.profiles.mountPath }}/agents/collector/profile.yaml"
            - "--directory"
            - "{{ .Values.profiles.workMountPath }}"
            - "--otel-service-name"
            - "collector"
          env:
            - {name: COLLECTOR_BIND_HOST, value: "0.0.0.0"}
            - {name: COLLECTOR_RECEIVER_ADDRESS, value: "0.0.0.0:{{ .Values.collector.otlpGRPCPort }}"}
            - {name: COLLECTOR_RELAY_ENDPOINT, value: {{ default "" $external | quote }}}
            - {name: COLLECTOR_SPOOL_PATH, value: "{{ .Values.profiles.workMountPath }}/traces/collector.ndjson"}
            # The working directory is a read-only ConfigMap, so the relative
            # metrics-spool default would fail; point it at the writable work
            # volume. COLLECTOR_METRICS_SPOOL_PATH is an existing variable, and
            # this keeps received metrics off the read-only mount (GH-1228).
            - {name: COLLECTOR_METRICS_SPOOL_PATH, value: "{{ .Values.profiles.workMountPath }}/metrics/collector.ndjson"}
            - {name: COLLECTOR_MODE, value: {{ ternary "relay" "spool" (ne (default "" $external) "") | quote }}}
          ports:
            - {name: otlp-grpc, containerPort: {{ .Values.collector.otlpGRPCPort }}}
            - {name: control, containerPort: 18191}
            - {name: monitor, containerPort: 18192}
            - {name: query, containerPort: 18193}
          readinessProbe:
            httpGet: {path: /api/lifecycle/health, port: control}
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - {name: profiles, mountPath: {{ .Values.profiles.mountPath }}, readOnly: true}
            - {name: work, mountPath: {{ .Values.profiles.workMountPath }}}
            - {name: collector-ui, mountPath: /collector-ui, readOnly: true}
          {{- else }}
          image: "{{ .Values.collector.image.repository }}:{{ .Values.collector.image.tag }}"
          imagePullPolicy: {{ .Values.collector.image.pullPolicy }}
          args: ["--config=/etc/collector/config.yaml"]
          ports:
            - {name: otlp-grpc, containerPort: {{ .Values.collector.otlpGRPCPort }}}
            - {name: otlp-http, containerPort: {{ .Values.collector.otlpHTTPPort }}}
          volumeMounts:
            - {name: config, mountPath: /etc/collector, readOnly: true}
          {{- end }}
      volumes:
        {{- if $agent }}
        {{- include "chatbot-mesh.profilesVolume" . | nindent 8 }}
        - name: work
          emptyDir: {}
        - name: collector-ui
          {{- if $uiArchive }}
          emptyDir: {}
        - name: collector-ui-source
          configMap:
            name: {{ $uiArchive }}
            items:
              - {key: assets.tgz, path: assets.tgz}
          {{- else }}
          projected:
            defaultMode: 0444
            sources:
              - configMap:
                  name: {{ $fullname }}-collector-ui
                  items:
                    {{- range $path, $_ := .Files.Glob "collector-ui/**" }}
                    - key: {{ $path | trimPrefix "collector-ui/" | replace "/" "__" }}
                      path: {{ $path | trimPrefix "collector-ui/" }}
                    {{- end }}
          {{- end }}
        {{- else }}
        - name: config
          configMap:
            name: {{ $fullname }}-collector-contrib
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-collector
  labels:
    {{- include "chatbot-mesh.labels" . | nindent 4 }}
    app.kubernetes.io/component: collector
spec:
  selector:
    {{- include "chatbot-mesh.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: collector
  ports:
    - {name: otlp-grpc, port: {{ .Values.collector.otlpGRPCPort }}, targetPort: otlp-grpc}
    {{- if $agent }}
    - {name: query, port: 18193, targetPort: query}
    {{- else }}
    - {name: otlp-http, port: {{ .Values.collector.otlpHTTPPort }}, targetPort: otlp-http}
    {{- end }}
{{- end }}
