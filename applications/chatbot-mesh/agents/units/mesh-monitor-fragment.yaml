# The monitor REST pair -- launch the read-only monitor server, stop it -- as
# one fragment. Every mesh agent that serves monitor snapshots differs only in
# the agent its prose names and the control and requests words its
# relationships point at, so each instantiates this once, under the words'
# own names.
unit: mesh-monitor-fragment
imports:
  - /opt/agent-core/tools/units/types-core.yaml
  - /opt/agent-core/tools/units/types-server.yaml
params:
  - name: agent
    type: string
    description: The agent the problem statement names.
  - name: control_await
    type: string
    description: The agent's control-await word the pair sits around.
  - name: requests_stop
    type: string
    description: The agent's requests-stop word that follows the monitor stop.
tools:
  - name: launch_monitor_rest
    type: builtin
    init: rest_server_launch
    visibility: internal
    category: boundary
    description: Launch read-only REST endpoints for cached monitor state.
    signature:
      input: builtin-types-core.NoParameters
      output: builtin-types-server.ServerLaunch
      emits: [ServerLaunched, CommandError]
    output:
      description: Monitor REST server launch result.
    side_effects:
      - kind: network_listen
        target: monitor_rest_server
        state: listener_started
    reversibility:
      classification: compensatable
    undo:
      strategy: compensating_action
      description: Stop the monitor REST server if the launch owns the listener.
    errors:
      - signal: CommandError
        condition: Monitor REST server config, bind, route, or schema failure.
        state_after_failure: No monitor route is exposed.
    config:
      rest_ref: monitor
  - name: stop_monitor_rest
    type: builtin
    init: rest_server_stop
    visibility: internal
    category: boundary
    description: Stop the owned monitor REST listener.
    signature:
      input: builtin-types-core.NoParameters
      output: builtin-types-server.ServerStop
      emits: [ServerStopped, CommandError]
    output:
      description: Monitor REST server stop result.
    side_effects:
      - kind: network_listener_shutdown
        target: monitor_rest_server
        state: listener_stopped
    reversibility:
      classification: compensatable
    undo:
      strategy: server_shutdown_or_user_action_compensation
      description: The receipt records shutdown loss; MachineSpec must relaunch the trusted monitor definition.
      payload: boundary_compensation
      captures: [server, address, drained_events, dropped_events, relaunch_requirement]
    errors:
      - signal: CommandError
        condition: Monitor REST server is missing, shutdown times out, or cleanup fails.
        state_after_failure: Monitor listener state may be partially stopped.
    config:
      rest_ref: monitor
