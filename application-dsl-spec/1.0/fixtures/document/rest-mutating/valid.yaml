# Fixture for R-REST-005: mutating operations declaring their effects, reversibility, and compensation or confirmation.
rest:
  version: v1
  clients:
    github:
      operations:
        close_issue:
          method: PATCH
          path: /issues/current
          success: {status: [200], signal: RESTResourceWritten}
          side_effects:
            - {kind: external_api, target: github.issue}
          reversibility:
            classification: compensatable
          compensation:
            operation: reopen_issue
        reopen_issue:
          method: PATCH
          path: /issues/current
          success: {status: [200], signal: RESTResourceWritten}
          side_effects:
            - {kind: external_api, target: github.issue}
          reversibility:
            classification: irreversible
            requires_confirmation: true
