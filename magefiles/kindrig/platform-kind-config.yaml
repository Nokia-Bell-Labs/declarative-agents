# Shared cluster-services tier (da-platform, GH-2215). One pinned control-plane
# node; the ingress-ready label admits the rig's Traefik controller. No host
# port mappings: demo clusters own localhost:80/443.
#
# The API server and kubelet export traces to the host observability stack at
# host.docker.internal:4317 with static resource attributes, so every scenario
# on the platform shares one control-plane trace stream. When no collector
# listens there, the exporters drop spans and the cluster is unaffected.
# KINDRIG_PLATFORM_TRACING_CONFIG is replaced with a stable host path holding
# platform-tracing.yaml, which must outlive the node across Docker restarts.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    image: kindest/node:v1.36.1@sha256:3489c7674813ba5d8b1a9977baea8a6e553784dab7b84759d1014dbd78f7ebd5
    extraMounts:
      - hostPath: KINDRIG_PLATFORM_TRACING_CONFIG
        containerPath: /etc/kubernetes/tracing.yaml
        readOnly: true
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
kubeadmConfigPatches:
  - |
    apiVersion: kubeadm.k8s.io/v1beta4
    kind: ClusterConfiguration
    apiServer:
      extraArgs:
        - name: tracing-config-file
          value: /etc/kubernetes/tracing.yaml
      extraEnvs:
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: "k8s.cluster.name=da-platform,deployment.environment=kind"
      extraVolumes:
        - name: tracing-config
          hostPath: /etc/kubernetes/tracing.yaml
          mountPath: /etc/kubernetes/tracing.yaml
          readOnly: true
          pathType: File
  - |
    apiVersion: kubelet.config.k8s.io/v1beta1
    kind: KubeletConfiguration
    tracing:
      endpoint: host.docker.internal:4317
      samplingRatePerMillion: 1000000
