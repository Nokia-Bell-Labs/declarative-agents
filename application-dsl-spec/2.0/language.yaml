      envelope the engine fixes: `body`, of type `T`, the data; `source`, the
      step, channel, or seed it came from; and `request_id` within a
      request-reply exchange. `builtin.Message` alone carries nothing. A type
      is named `<unit>.<Name>` or `builtin.<Name>`; a tool whose input and
      emitted messages share a parameter `$T` is generic, bound at each use
      from the message that reaches it. A type argument MUST be a concrete
      type or a parameter, never itself a bound generic, and a use MUST give
      as many arguments as the type has parameters. `signature.output` and
      `parameters` are refused in favour of the typed messages.
