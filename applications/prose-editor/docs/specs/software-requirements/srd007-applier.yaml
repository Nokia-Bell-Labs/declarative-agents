id: srd007-applier
title: Declarative Applier Agent
status: planned

problem: |
  Once the Prose Editor chart (srd006) is packaged, it is installed and upgraded
  by an operator running helm and kubectl by hand or from a CI script. The same
  actuation is expressible as a declarative agent: a state machine that binds the
  helm and kubectl CLIs present in its container, validates a submitted values
  change against the chart's values schema, applies it as a rollout, verifies the
  rollout from a CLI exit code, and rolls back on failure.

  Prose Editor runs no control plane. It serves the workflow orchestrator, the
  specialist-editor stages, the voice critic, and the retrieval roles, plus an
  administrative corpus-ingest run; it runs no in-cluster creator, orchestrator
  of deployments, or provisioning panel. The applier therefore takes its decided
  input from outside the cluster. The requirements must name the actuation
  surface, the validate-then-apply and verify-then-rollback machine, the
  authority boundary that keeps helm and kubectl off the serving pods, and the
  sanctioned image divergence, separately from the agent-core runtime the applier
  builds on. This SRD specifies the applier as planned; it builds nothing.

goals:
  - "G1: Model the applier as a standalone deployment-plane agent whose apply surface an authorized operator or CI caller reaches from outside the serving pods."
  - "G2: Validate a submitted values patch against the Prose Editor chart's values schema before applying, and apply it as a values-file rollout rather than per-field construction."
  - "G3: Verify the rollout of the Prose Editor role Deployments from a CLI status read and roll the release back on an apply or verify failure."
  - "G4: Hold helm and kubectl authority in the applier alone; the orchestrator, editors, critic, and retrieval roles carry none, and authority is set by declared, validated config."
  - "G5: Carry the helm and kubectl CLIs in the applier image as a recorded, sanctioned divergence from the profile-free, binary-only image contract."

applicability:
  release: "00.3"
  capability:
    runnable_module: planned
    managed_service: planned
    packaged: planned
    helm_managed: planned
    kind_demo: planned
  implementation_status: documentation_only_runtime_planned

authority_boundary:
  rule: |
    The applier acts; it decides nothing. An authorized operator or CI caller
    decides the values change and submits it; the applier receives that decided
    document and realizes it. It edits deployment values and triggers rollouts
    only. It never submits a host, URL, method, or credential to a running
    orchestrator, editor, critic, or RAG role. The orchestrator's constrained git
    and gh publication authority is a separate serving-plane concern and grants no
    deployment authority. Authority is set by declared, validated config, never by
    this actuation surface.

requirements:
  R1:
    title: Actuation surface
    items:
      - id: R1.1
        text: |
          The applier SHALL expose one apply endpoint bound as a request-scoped
          machine request that accepts a decided values-plane patch for the Prose
          Editor chart and maps terminal signals to HTTP status.
        evidence: Planned applier profile binds one machine-request apply endpoint that returns a terminal status per outcome.
      - id: R1.2
        text: |
          The applier SHALL run a control server for health and lifecycle exit
          and a monitor server, with loopback-configurable bind addresses.
        evidence: Planned applier profile declares control and monitor servers on configurable addresses.
      - id: R1.3
        text: |
          The apply request SHALL carry a schema-version-tagged, values-plane
          overrides document as its only content, and the applier SHALL reject an
          unknown schema version.
        evidence: Planned tests accept a known schema version and reject an unknown one before any rollout.
      - id: R1.4
        text: |
          The applier SHALL serve no panel state view and SHALL depend on no
          in-cluster creator, orchestrator of deployments, or provisioning panel,
          because Prose Editor runs no control plane; the caller is an authorized
          operator or CI process reaching the apply surface.
        evidence: Planned applier profile exposes no panel route and no in-cluster caller dependency.
  R2:
    title: Validate then apply
    items:
      - id: R2.1
        text: |
          The applier SHALL validate a submitted values document against the
          Prose Editor chart's values schema (srd006 R4.1) by a helm upgrade
          dry-run before applying, rejecting a non-conforming document with a
          client error and no rollout.
        evidence: Planned tests reject a non-conforming document by path and constraint with no rollout.
      - id: R2.2
        text: |
          The applier SHALL write the validated values document to an overrides
          file and apply it with helm upgrade using reuse-values and the overrides
          file, returning without waiting so the role rollout is verified
          separately, re-rendering the prepared role topology rather than
          constructing per-field arguments.
        evidence: Planned tests prove a values-file apply with reuse-values and no per-field construction.
      - id: R2.3
        text: |
          The apply request SHALL be values-plane only; the applier SHALL NOT
          submit a host, URL, method, or credential to a running orchestrator,
          editor, critic, or RAG role.
        evidence: Planned tests assert no invocation carries a running-agent endpoint or credential.
  R3:
    title: Verify and roll back
    items:
      - id: R3.1
        text: |
          After an apply, the applier SHALL verify the Prose Editor role
          Deployments (the workflow-orchestrator, specialist-editor, voice-critic,
          and the structure, voice, and tightening RAG Deployments) via kubectl
          rollout status and report the phase from its exit outcome.
        evidence: Planned tests read rollout status for the named role Deployments and report the phase.
      - id: R3.2
        text: |
          On a verify failure, the applier SHALL roll the release back with an
          explicit helm rollback and report the failure; an apply that fails at
          the helm upgrade command SHALL be reported as a failure for operator
          attention.
        evidence: Planned tests reach the rollback terminal on a verify stall and report an upgrade-command failure as failed.
      - id: R3.3
        text: |
          A rollout status the cluster cannot serve SHALL return a gateway error
          rather than a phase, so a broken read is never reported as a
          progressing rollout.
        evidence: Planned tests map an unreadable rollout to a gateway error, distinct from progressing and complete.
  R4:
    title: Authority boundary
    items:
      - id: R4.1
        text: |
          The applier alone SHALL hold the helm and kubectl CLIs bound as exec
          tools; the orchestrator, specialist-editor, voice-critic, and RAG roles
          SHALL carry no deployment CLI and no actuation authority.
        evidence: Planned rendered chart and profiles bind helm and kubectl only in the applier.
      - id: R4.2
        text: |
          Authority SHALL be set by declared, validated config, never by this
          actuation surface; the applier SHALL accept no endpoint or credential
          for a running agent, and REST authority SHALL live in the applier's
          declared configuration with no runtime input supplying transport
          authority.
        evidence: Planned tests reject any runtime-supplied transport authority; declared config alone sets it.
      - id: R4.3
        text: |
          The apply surface SHALL be unreachable from the orchestrator, editor,
          critic, and retrieval pods, enforced at the network layer rather than in
          the profile, because the declarative REST servers carry no inbound
          authentication; the reachable caller is an authorized operator or CI
          process alone.
        evidence: Planned NetworkPolicy admits the apply surface only from the authorized caller, not the serving pods.
  R5:
    title: Non-goals and packaging
    items:
      - id: R5.1
        text: |
          The applier SHALL NOT decide the values change; the authorized operator
          or CI caller decides it and submits it as the apply request's
          values-plane content.
        evidence: Planned applier machine has no decision word; it validates and actuates a supplied document.
      - id: R5.2
        text: |
          The applier SHALL NOT select role profiles or own agent lifecycle;
          those remain the package's and chart's (srd006).
        evidence: Planned applier profile carries no role-selection or lifecycle-ownership word.
      - id: R5.3
        text: |
          The applier image SHALL carry the helm and kubectl CLIs alongside the
          runtime binary; this is a sanctioned divergence from the profile-free,
          binary-only image contract (srd006 R2.2), recorded so a
          declarative-decomposition audit does not re-flag it.
        evidence: Planned image manifest records the helm and kubectl divergence for the applier image alone.

non_goals:
  - Decide what values to change; the operator or CI caller owns that decision.
  - Select role profiles or own agent lifecycle; srd006 owns the package and chart.
  - Edit saga content, invoke retrieval or models, issue verdicts, or reach GitHub or Pangram.
  - Implement the applier profile, machine, image, or NetworkPolicy; this SRD specifies them as planned.

acceptance_criteria:
  - id: AC1
    criterion: |
      The applier exposes an apply endpoint bound as a request-scoped machine
      request that accepts a schema-version-tagged values-plane document,
      alongside control and monitor servers on loopback-configurable addresses,
      and serves no panel state view and depends on no in-cluster caller.
    traces: [R1.1, R1.2, R1.3, R1.4]
  - id: AC2
    criterion: |
      A submitted values document is validated against the Prose Editor chart's
      values schema by a helm dry-run and, when valid, written to an overrides
      file and applied with helm upgrade using reuse-values, values-plane only,
      with no per-field construction and no endpoint submitted to a running agent.
    traces: [R2.1, R2.2, R2.3]
  - id: AC3
    criterion: |
      The rollout of the Prose Editor role Deployments is verified via kubectl
      rollout status and its phase reported, a status the cluster cannot serve
      returns a gateway error rather than a phase, and an apply or verify failure
      rolls the release back and reports the failure.
    traces: [R3.1, R3.2, R3.3]
  - id: AC4
    criterion: |
      The applier alone holds helm and kubectl bound as exec tools, the serving
      roles carry none, authority is set by declared validated config and never by
      this surface, and the apply surface is unreachable from the serving and
      retrieval pods at the network layer.
    traces: [R4.1, R4.2, R4.3]
  - id: AC5
    criterion: |
      Deciding the values (the operator or CI caller) and profile selection or
      lifecycle (package and chart) are non-goals, and the applier image carries
      helm and kubectl as a recorded, sanctioned divergence from the binary-only
      image contract.
    traces: [R5.1, R5.2, R5.3]

