<!doctype html>
<!-- Generated by the site skill's scaffold word; written once and yours to edit (GH-119).
     It renders the generated Markdown beside it in the browser, so GitLab Pages serves the
     site as an app: publish the site/ folder as public/ in a pages CI job. An air-gapped
     GitLab can vendor the three pinned libraries below into this folder and point the
     script tags at them. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Program site</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4.13.1/themes/vue.css">
<style>
  :root { --theme-color: #2563eb; }
  body { font-size: 15px; }
  .markdown-section { max-width: 60em; }
  .markdown-section table { display: table; width: 100%; }
  .mermaid { text-align: center; }
</style>
</head>
<body>
<div id="app">Loading the program site…</div>
<script>
  // Links to files Docsify cannot render open as the files they are: the
  // interactive timeline (.html) and the JSON facts leave the hash router.
  function plainLinks() {
    document.querySelectorAll('a[href*="#/"]').forEach(function (a) {
      var path = a.getAttribute("href").split("#/")[1] || "";
      path = path.split("?")[0];
      if (/\.(html|json|css|js|txt)$/.test(path)) {
        a.setAttribute("href", path.replace(/^\//, ""));
        a.removeAttribute("data-link");
        if (/\.html$/.test(path)) a.setAttribute("target", "_blank");
      }
    });
  }
  function escapeHTML(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  window.$docsify = {
    name: "Program site",
    homepage: "index.md",
    relativePath: true,
    auto2top: true,
    alias: { "/(.*)/$": "/$1/index" },
    search: { paths: "auto", placeholder: "Search the site" },
    markdown: {
      renderer: {
        code: function (code, lang) {
          if (lang === "mermaid") {
            return '<pre class="mermaid">' + escapeHTML(code) + "</pre>";
          }
          return this.origin.code.apply(this, arguments);
        }
      }
    },
    plugins: [
      function (hook) {
        hook.doneEach(function () {
          plainLinks();
          if (window.mermaid) {
            window.mermaid.run({ querySelector: ".mermaid" });
          }
        });
      }
    ]
  };
</script>
<script src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/docsify.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/plugins/search.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.min.js"></script>
<script>
  if (window.mermaid) {
    window.mermaid.initialize({ startOnLoad: false, securityLevel: "strict" });
  }
</script>
</body>
</html>
