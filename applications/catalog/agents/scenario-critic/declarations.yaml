unit: catalog-scenario-critic-declarations
tools:
  - name: discover_scenarios
    type: builtin
    init: init_scenario_session
    visibility: internal
    category: boundary
    description: Enumerate scenarios under the configured roots and seed the work list.
    parameters:
      type: object
      properties: {}
    signature:
      emits: [SessionSeeded, NoScenarios, CommandError]
    output:
      description: Discovery result.
      schema:
        type: object
        properties:
          scenarios: {type: integer}
          roots: {type: array}
    side_effects:
      - kind: state_mutation
        target: scenario_session
        state: work_list_seeded
    reversibility:
      classification: irreversible
    undo:
      strategy: irreversible
      description: A seeded work list is replaced by a new run, not restored.
    errors:
      - signal: CommandError
        condition: A declared root exists but cannot be read.
        state_after_failure: The work list is empty.
    config:
      # Roots are literal: tool declarations are not environment-expanded, so
      # the rig is run from the applications/catalog root. Adding an area means
      # adding a root here, not a new rig.
      roots:
        - agents
        - testdata/conformance

  - name: next_scenario
    type: builtin
    init: next_scenario
    visibility: internal
    category: boundary
    description: Take the next scenario from the work list.
    parameters:
      type: object
      properties: {}
    signature:
      emits: [ScenarioReady, AllScenariosDone, CommandError]
    output:
      description: The scenario now current, or an exhausted marker when the cursor is done.
      schema:
        type: object
        properties:
          subject: {type: string}
          scenario: {type: string}
          validators: {type: array}
          fixtures: {type: array}
          exhausted: {type: boolean}
    side_effects:
      - kind: state_mutation
        target: scenario_session
        state: cursor_advanced
    reversibility:
      classification: irreversible
    undo:
      strategy: irreversible
      description: A consumed cursor position is not restored.
    errors:
      - signal: CommandError
        condition: The scenario's manifest cannot be read or parsed.
        state_after_failure: The cursor has advanced past the scenario.
    config: {}

  - name: start_scenario_mock
    type: builtin
    init: start_scenario_mock
    visibility: internal
    category: boundary
    description: Start the one fixture mock bound by the machine iterator.
    parameters:
      type: object
      properties: {}
    signature:
      emits: [MockStarted, CommandError]
    output:
      description: The mocks started for this scenario.
      schema:
        type: object
        properties:
          mock: {type: object}
    side_effects:
      - kind: child_agent_execution
        target: mock_agent
        state: mock_serving
      - kind: state_mutation
        target: scenario_session
        state: mocks_recorded
    reversibility:
      classification: compensatable
    undo:
      strategy: compensating_action
      description: Decode the per-item receipt and stop only the mock started by this dispatch.
    errors:
      - signal: CommandError
        condition: A mock fails to spawn or no port can be reserved.
        state_after_failure: Earlier item dispatches remain separately visible and reversible.
    config:
      profile: agents/mock/profile.yaml
      fixture: $from(fixture).path

  - name: start_scenario_subject
    type: builtin
    init: start_scenario_subject
    visibility: internal
    category: boundary
    description: Start the agent under test with its dependencies redirected at this scenario's mocks.
    parameters:
      type: object
      properties: {}
    signature:
      emits: [SubjectStarted, CommandError]
    output:
      description: The subject started for this scenario.
      schema:
        type: object
        properties:
          subject: {type: string}
          profile: {type: string}
          base_url: {type: string}
          env: {type: array}
          health_base_url: {type: string}
          health_path: {type: string}
          started_at: {type: string}
    side_effects:
      - kind: child_agent_execution
        target: subject_agent
        state: subject_serving
      - kind: state_mutation
        target: scenario_session
        state: subject_recorded
    reversibility:
      classification: compensatable
    undo:
      strategy: compensating_action
      description: Decode the subject receipt and stop only that child.
    errors:
      - signal: CommandError
        condition: The subject profile or health target is invalid, or the process fails to spawn.
        state_after_failure: The scenario's mocks stay tracked for teardown; no subject process or session record exists.
    config: {}

  - name: probe_subject_health
    type: builtin
    init: rest_client_get
    visibility: internal
    category: boundary
    description: Perform one declared REST probe against the started subject's health route.
    parameters:
      type: object
      properties: {}
    signature:
      emits: [Healthy, HealthUnavailable, CommandError]
    output:
      description: One health probe result.
      schema:
        type: object
        properties:
          operation: {type: string}
          attempts: {type: integer}
          status: {type: integer}
    side_effects:
      - kind: external_api
        target: scenario_subject.health
        state: read_only
    reversibility:
      classification: reversible
    undo:
      strategy: noop
      description: A health read changes no state.
    errors:
      - signal: CommandError
        condition: REST target resolution, network, timeout, or response mapping fails.
        state_after_failure: The subject remains tracked for retry or teardown.
    config:
      rest_ref: scenario_subject
      operation: health

  - name: wait_health_retry
    type: builtin
    init: delay
    visibility: internal
    category: boundary
    description: Wait once between subject health probes within the declared startup deadline.
    parameters:
      type: object
      properties: {}
    signature:
      emits: [HealthRetryReady, HealthTimeout, CommandError]
    output:
      description: One bounded delay result.
      schema:
        type: object
        properties:
          waited: {type: string}
          deadline_reached: {type: boolean}
    side_effects:
      - kind: state_read
        target: local_clock
        state: read_only
    reversibility:
      classification: reversible
    undo:
      strategy: noop
      description: Waiting changes no state.
    errors:
      - signal: CommandError
        condition: The deadline source cannot be resolved or parsed, or the wait is cancelled.
        state_after_failure: The subject remains tracked for teardown.
    config:
      duration: 100ms
      deadline: 30s
      deadline_source: $from(subject).started_at
      elapsed_signal: HealthRetryReady
      deadline_signal: HealthTimeout

  - name: run_scenario_validator
    type: builtin
    init: run_scenario_validator
    visibility: internal
    category: boundary
    description: Run the one validator bound by the machine iterator.
    parameters:
      type: object
      properties: {}
    signature:
      emits: [ValidatorCompleted, ValidatorIncomplete, CommandError]
    output:
      description: One validator outcome.
      schema:
        type: object
        properties:
          name: {type: string}
          profile: {type: string}
          exit_code: {type: integer}
          passed: {type: boolean}
          timed_out: {type: boolean}
    side_effects:
      - kind: child_agent_execution
        target: validator_agent
        state: validator_completed
    reversibility:
      classification: irreversible
    undo:
      strategy: irreversible
      description: A validator run that already drove the subject cannot be unrun.
    errors:
      - signal: CommandError
        condition: The iterator binding or current subject is unavailable.
        state_after_failure: The iterator join exposes the failed item.
    config:
      validator: $from(validator).profile
      timeout: 5m
      otlp_endpoint: ""

  - name: record_scenario_validators
    type: builtin
    init: record_scenario_validators
    visibility: internal
    category: boundary
    description: Record the validator iterator's ordered joined outcomes.
    parameters:
      type: object
      properties: {}
    signature:
      emits: [ValidatorsRecorded, CommandError]
    output:
      description: Recorded validator outcomes.
      schema:
        type: object
        properties:
          validators: {type: array}
          passed: {type: boolean}
    side_effects:
      - kind: state_mutation
        target: scenario_session
        state: outcomes_recorded
    reversibility:
      classification: irreversible
    undo:
      strategy: irreversible
      description: Recorded outcomes remain part of this scenario's report.
    errors:
      - signal: CommandError
        condition: The join output cannot be decoded.
        state_after_failure: No validator outcomes are recorded.
    config:
      outcomes: $from(validators_joined).items

  - name: collect_scenario_verdict
    type: builtin
    init: collect_scenario_verdict
    visibility: internal
    category: boundary
    description: Derive this scenario's verdict from its validator outcomes.
    parameters:
      type: object
      properties: {}
    signature:
      emits: [ScenarioPassed, ScenarioFailed]
    output:
      description: This scenario's verdict.
      schema:
        type: object
        properties:
          subject: {type: string}
          scenario: {type: string}
          passed: {type: boolean}
          reason: {type: string}
    side_effects:
      - kind: state_mutation
        target: scenario_session
        state: verdict_recorded
    reversibility:
      classification: irreversible
    undo:
      strategy: irreversible
      description: A recorded verdict is part of the run report.
    errors:
      - signal: ScenarioFailed
        condition: One or more recorded validator outcomes failed.
        state_after_failure: The failed verdict is retained for aggregate reporting.
    config: {}

  - name: fail_scenario_start
    type: builtin
    init: collect_scenario_verdict
    visibility: internal
    category: boundary
    description: Record a failed verdict for a scenario whose children did not start.
    parameters:
      type: object
      properties: {}
    signature:
      emits: [ScenarioFailed]
    output:
      description: The failed verdict.
      schema:
        type: object
        properties:
          passed: {type: boolean}
          reason: {type: string}
    side_effects:
      - kind: state_mutation
        target: scenario_session
        state: verdict_recorded
    reversibility:
      classification: irreversible
    undo:
      strategy: irreversible
      description: A recorded verdict is part of the run report.
    errors:
      - signal: ScenarioFailed
        condition: Subject or mock startup failed before validators ran.
        state_after_failure: The configured failure cause is retained for aggregate reporting.
    config:
      reason: the scenario's mocks or subject failed to start

  - name: fail_scenario_unhealthy
    type: builtin
    init: collect_scenario_verdict
    visibility: internal
    category: boundary
    description: Record a failed verdict for a scenario whose subject never served.
    parameters:
      type: object
      properties: {}
    signature:
      emits: [ScenarioFailed]
    output:
      description: The failed verdict.
      schema:
        type: object
        properties:
          passed: {type: boolean}
          reason: {type: string}
    side_effects:
      - kind: state_mutation
        target: scenario_session
        state: verdict_recorded
    reversibility:
      classification: irreversible
    undo:
      strategy: irreversible
      description: A recorded verdict is part of the run report.
    errors:
      - signal: ScenarioFailed
        condition: The subject did not become healthy within its declared bound.
        state_after_failure: The configured failure cause is retained for aggregate reporting.
    config:
      reason: the subject never became healthy within its declared bound

  - name: fail_scenario_validators
    type: builtin
    init: collect_scenario_verdict
    visibility: internal
    category: boundary
    description: Record a failed verdict for a scenario whose validators could not run.
    parameters:
      type: object
      properties: {}
    signature:
      emits: [ScenarioFailed]
    output:
      description: The failed verdict.
      schema:
        type: object
        properties:
          passed: {type: boolean}
          reason: {type: string}
    side_effects:
      - kind: state_mutation
        target: scenario_session
        state: verdict_recorded
    reversibility:
      classification: irreversible
    undo:
      strategy: irreversible
      description: A recorded verdict is part of the run report.
    errors:
      - signal: ScenarioFailed
        condition: The scenario validators could not be run.
        state_after_failure: The configured failure cause is retained for aggregate reporting.
    config:
      reason: the scenario's validators could not be run

  - name: list_scenario_children
    type: builtin
    init: list_scenario_children
    visibility: internal
    category: boundary
    description: Expose subject-first teardown items for the current scenario.
    parameters:
      type: object
      properties: {}
    signature:
      emits: [ScenarioChildrenListed, CommandError]
    output:
      description: Ordered teardown items.
      schema:
        type: object
        properties:
          children: {type: array}
    side_effects:
      - kind: state_read
        target: scenario_session
        state: read_only
    reversibility:
      classification: reversible
    undo:
      strategy: noop
      description: Listing children changes no state.
    errors:
      - signal: CommandError
        condition: The scenario session has no current scenario.
        state_after_failure: No teardown list is emitted; the run ends in Failed.
    config: {}

  - name: stop_scenario_child
    type: builtin
    init: stop_service
    visibility: internal
    category: boundary
    description: Stop the one scenario child bound by the teardown iterator.
    parameters:
      type: object
      properties: {}
    signature:
      emits: [ServiceStopped, CommandError]
    output:
      description: One child stop result.
      schema:
        type: object
        properties:
          service: {type: string}
          stopped: {type: boolean}
    side_effects:
      - kind: child_process
        target: scenario_child
        state: child_stopped
    reversibility:
      classification: irreversible
    undo:
      strategy: irreversible
      description: A stopped child is restarted by a new scenario, not by undo.
    errors:
      - signal: CommandError
        condition: The iterator binding cannot resolve a service name.
        state_after_failure: The join exposes the failed stop item.
    config:
      service: $from(child).service
      grace: 5s

  - name: stop_all_services
    type: builtin
    init: stop_all_services
    visibility: internal
    category: boundary
    description: Stop every child still owned by this rig run as one bounded recovery walk.
    parameters: {type: object, properties: {}}
    signature:
      emits: [AllServicesStopped]
    output:
      description: Emergency teardown summary.
      schema:
        type: object
        properties:
          stopped: {type: integer}
          children: {type: array}
        required: [stopped, children]
    side_effects:
      - {kind: child_process, target: all_tracked_scenario_children, state: stopped}
    reversibility: {classification: irreversible}
    undo: {strategy: irreversible, description: Recovery stops leaked children and does not restart them.}
    errors: []

  - name: report_rig_session
    type: builtin
    init: report_scenario_session
    visibility: internal
    category: boundary
    description: Reduce every scenario verdict into the run result.
    parameters:
      type: object
      properties: {}
    signature:
      emits: [SessionPassed, SessionFailed]
    output:
      description: The run report.
      schema:
        type: object
        properties:
          scenarios: {type: integer}
          passed: {type: boolean}
          verdicts: {type: array}
          first_failure: {type: object}
    side_effects:
      - kind: state_read
        target: scenario_session
        state: read_only
    reversibility:
      classification: reversible
    undo:
      strategy: noop
      description: Reporting reads the collected verdicts and changes nothing.
    errors:
      - signal: SessionFailed
        condition: At least one scenario verdict failed, or no scenario was proven.
        state_after_failure: The complete aggregate report is returned.
    config: {}
