id: srd005-live-helm-smoke
title: Packaged-Chart Live Helm Smoke
status: implemented

problem: |
  Static renders do not prove that the packaged chart, real runtime image,
  mounted role profiles, shared storage, deterministic model boundary, remote
  role flow, and trace backend work together on Kubernetes. A live proof must
  remain bounded, diagnostic, and safe for developer clusters.

requirements:
  R1:
    title: Prerequisites and ownership
    items:
      - R1.1: The target shall skip only when Docker, kind, Helm, kubectl, required checkouts, Docker health, or required pre-pulled images are unavailable.
      - R1.2: The target shall use the shared kind rig and a pinned node configuration, own only clusters it creates, and use a temporary kubeconfig.
      - R1.3: Smoke-owned namespace, Helm release, workspace PV, forwards, temporary files, and owned cluster shall be cleaned in all terminal paths.

  R2:
    title: Real packaged topology
    items:
      - R2.1: The target shall install only the validated packaged .tgz.
      - R2.2: It shall build and load one commit-addressed canonical profile-free agent image and run every agent workload from it, so the application under test uses the same one-image topology as production (GH-2494). Every agent and mock pod shall report the same image ID.
      - R2.3: The executor's Go 1.26 and golangci-lint v2.12.2 build, lint, and test validation shall run from digest-pinned, read-only tool-donor volumes mounted on the executor, while the critic's independent Go test oracle shall use a separate Go-only donor volume; neither shall require a second agent runtime image.
      - R2.4: A deterministic Ollama-compatible boundary shall run as the canonical catalog mock profile with an application-owned fixture on the same canonical agent image, providing model responses without replacing any agent, REST, workspace, critic, or telemetry behavior and without a bespoke model image.
      - R2.5: A kind-only RWX hostPath fixture shall provide one writable shared workspace to all three roles.

  R3:
    title: End-to-end evidence
    items:
      - R3.1: Planner, executor, and critic rollouts and their real lifecycle health endpoints shall become ready.
      - R3.2: One planner request shall remotely execute the canonical executor, mutate the shared workspace, pass Go tests, and receive canonical critic acceptance.
      - R3.3: The collector agent shall retain the supplied trace identifier with coding-planner, coding-executor, and coding-critic service spans.

  R4:
    title: Failure classification
    items:
      - R4.1: Docker and Kubernetes ready paths shall be bounded before semantic operations and rechecked after failures.
      - R4.2: An unhealthy ready path shall report infrastructure unavailable; healthy ready paths shall preserve the semantic operation failure.
      - R4.3: Failure diagnostics shall share one deadline and include Helm status/history, workloads, events, and targeted role, collector, and model logs.

acceptance_criteria:
  - id: AC1
    criterion: Healthy prerequisites produce a full packaged-chart planner-to-critic pass through build, v2 lint, and test, with every agent and mock pod running one canonical image ID, the executor tools mounted from donors, and the model boundary served by the canonical mock profile, followed by cleanup.
    traces: [R1.1, R1.2, R1.3, R2.1, R2.2, R2.3, R2.4, R2.5, R3.1, R3.2, R3.3]
  - id: AC2
    criterion: Missing external prerequisites print a specific SKIP without cluster mutation.
    traces: [R1.1]
  - id: AC3
    criterion: Deterministic tests distinguish infrastructure and semantic failures and prove bounded diagnostics.
    traces: [R4.1, R4.2, R4.3]

goals:
  - id: G1
    text: Prerequisites and ownership.
  - id: G2
    text: Real packaged topology.
  - id: G3
    text: End-to-end evidence.
  - id: G4
    text: Failure classification.
non_goals:
  - Production model performance and GPU sizing.
  - Multi-node RWX and high availability.
  - Public ingress and authentication.
