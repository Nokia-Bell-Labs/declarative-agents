    symbols_used: [Command, Result, Signal, CommandError]
  - srd_id: srd013-standard-tool-library
    symbols_used: [ToolDef]
  - srd_id: srd022-builtin-tools
    symbols_used: [BuiltinRegistry, DecodeToolConfig]
  - srd_id: srd038-command-state-store
    symbols_used: [CommandStateView]

related_documents:
  - cfg-tool-authoring-standard

implementation_status:
  implemented:
    - >-
      The pipeline word (internal/tools/pipeline), its factory registration as
      a standard family gated on the pipeline init, and stage-family
      co-selection in SelectedBuiltinInits shipped with GH-1957. Stages build
      eagerly at registration through their own factories, chain through the
      previous-Result contract, and propagate the injected command-state view,
      tracer, and monitor recorder.
  planned:
    - >-
      Adopting the word in chatbot-mesh's request machines, where the three
      rerank marshalling blocks and the source-selection block are the
      motivating geometry.

