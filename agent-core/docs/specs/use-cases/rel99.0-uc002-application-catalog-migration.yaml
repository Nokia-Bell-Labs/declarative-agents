id: rel99.0-uc002-application-catalog-migration
title: Maintainers migrate applications and reusable catalog blocks to explicit owner roots

summary: |
  Maintainers move runnable products to applications/, relocate reusable
  repository-specific blocks to applications/catalog, isolate Agent Core
  integration fixtures, and cut consumers over to an explicit catalog root.
  Source paths and Go module paths change while packaged profile paths and
  runtime mounts remain stable. Compatibility aliases and tags make the
  transition deterministic without mislabeling checkout provenance.

actor: Maintainers of Agent Core, the application catalog, root release orchestration, and runnable applications

trigger: |
  GH-1036 begins after this contract is indexed. The active examples/ and
  top-level agent-profiles/ layout obscures ownership and allows core tests or
  application commands to depend on caller CWD and sibling discovery.

flow:
  - F1: The documentation issue GH-1040 fixes the source layout, ownership, owner-root, environment, tag, module, package, and mount contracts in srd043.
  - F2: GH-1037 mechanically moves coding-agent and chatbot-mesh from examples/ to applications/ and updates their Go module identities and root participation.
  - F3: GH-1038 copies the minimal runtime programs required by core integrations into agent-core/testdata/integration and removes catalog discovery from those targets.
  - F4: GH-1041 mechanically moves the complete agent-profiles module to applications/catalog without reorganizing its internal taxonomy.
  - F5: GH-1039 replaces remaining catalog-backed core tests with core-owned fixtures and moves catalog membership assertions to catalog conformance.
  - F6: GH-1043 introduces AGENT_CATALOG_ROOT, applies deterministic AGENT_PROFILES_ROOT compatibility behavior, and resolves one absolute catalog root without changing CWD.
  - F7: GH-1046 cuts root release, UI, stats, and tag behavior to applications/, including canonical and legacy v0 catalog tags.
  - F8: GH-1044 migrates coding-agent catalog references and packages role-sharded closures while preserving /profiles paths and exact provenance.
  - F9: GH-1042 migrates chatbot-mesh catalog references while retaining its application-owned topology, package paths, and mount paths.
  - F10: GH-1045 documents the tool-first catalog taxonomy and removes stale active examples/ and top-level agent-profiles/ source-path claims.
  - F11: Maintainers run root, core, catalog, and application gates from each owner root and verify the formal issue-to-evidence mapping.

touchpoints:
  - T1: "srd043-application-catalog-layout R1 and R2 -- source layout, ownership, and tool/agent block boundaries"
  - T2: "srd043-application-catalog-layout R3 -- owner-root execution and CWD-independent resolution"
  - T3: "srd043-application-catalog-layout R4 -- AGENT_CATALOG_ROOT and temporary AGENT_PROFILES_ROOT alias"
  - T4: "srd043-application-catalog-layout R5 -- source, module, package, and mount path distinctions"
  - T5: "srd043-application-catalog-layout R6 -- applications/catalog/v0.* and agent-profiles/v0.* compatibility"
  - T6: "srd043-application-catalog-layout R7 -- approved migration order and owner-root release gates"
  - T7: "agent-core/testdata/integration -- sole source of core integration profiles"
  - T8: "applications/catalog -- reusable repository-specific tool and agent blocks"
  - T9: "applications/coding-agent and applications/chatbot-mesh -- application-owned composition and end-to-end proof"

success_criteria:
  - id: S1
    criterion: Active source ownership is visible under agent-core and applications/{catalog,coding-agent,chatbot-mesh}.
    traces:
      - srd043-application-catalog-layout AC1
  - id: S2
    criterion: Core tests and integrations use agent-core/testdata/integration and pass without a catalog checkout.
    traces:
      - srd043-application-catalog-layout AC3
  - id: S3
    criterion: Root, core, catalog, and application commands execute from their owner roots without os.Chdir or incidental-CWD discovery.
    traces:
      - srd043-application-catalog-layout AC2
  - id: S4
    criterion: AGENT_CATALOG_ROOT is canonical and legacy alias, conflict, discovery, missing-root, and retirement behavior are executable.
    traces:
      - srd043-application-catalog-layout AC4
  - id: S5
    criterion: Source and Go module paths use applications/ while packaged closures still mount under /profiles and core declarations under /opt/agent-core/tools.
    traces:
      - srd043-application-catalog-layout AC5
  - id: S6
    criterion: Canonical and compatibility v0 tags resolve the same release commit and package evidence records actual source provenance.
    traces:
      - srd043-application-catalog-layout AC6
  - id: S7
    criterion: All ten GH-1036 child issues have one formal test case and execute in the approved order.
    traces:
      - srd043-application-catalog-layout AC7
      - srd043-application-catalog-layout AC8

failure_scenarios:
  - id: E1
    scenario: A core test resolves applications/catalog or skips because no catalog environment variable is set.
    expected: Core isolation tests fail and identify the catalog dependency.
  - id: E2
    scenario: AGENT_CATALOG_ROOT and AGENT_PROFILES_ROOT identify different directories.
    expected: Resolution fails before work begins and names both conflicting inputs.
  - id: E3
    scenario: A source-path migration rewrites /profiles or /opt/agent-core/tools as if either were a checkout path.
    expected: Package, container, or path-contract tests fail.
  - id: E4
    scenario: A dirty checkout that is merely compatible with a v0 tag is recorded as a release.
    expected: Provenance tests reject the package.
  - id: E5
    scenario: Root orchestration or a module target changes process CWD to discover another module.
    expected: Owner-root and no-directory-jump regression tests fail.
  - id: E6
    scenario: An active document still presents examples/ or top-level agent-profiles/ as the current source layout after the final sweep.
    expected: The repository-wide path-reference audit fails.

out_of_scope:
  - Reorganizing catalog internals during its mechanical move.
  - Changing core runtime dispatch, MachineSpec, or ToolDef semantics.
  - Replacing /profiles or /opt/agent-core/tools runtime mounts.
  - Turning application-local agents into catalog members without satisfying the catalog membership contract.
  - Removing or retargeting immutable historical tags.

implementation_status: specified
srd: srd043-application-catalog-layout
test_suite: test-rel99.0-application-catalog-migration
