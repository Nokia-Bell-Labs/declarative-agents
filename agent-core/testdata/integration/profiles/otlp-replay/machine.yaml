name: otlp-replay
purpose: Load one trusted OTLP protobuf-JSON batch and relay it through declared words.
initial_state: ReadingBatch
budget: {max_iterations: 2, command_timeout: 1m}
states:
  - {name: ReadingBatch, meaning: Decode the configured offline batch.}
  - {name: Relaying, meaning: Select the decoded batch for the shared relay boundary.}
  - {name: Exporting, meaning: Await the single OTLP export result.}
  - {name: Done, meaning: Relay accepted the complete batch., run_status: succeeded}
  - {name: Failed, meaning: File, decode, or export failed., run_status: failed}
terminal_states: [Done, Failed]
signals: [Seed, BatchLoaded, SpansRelayed, CommandError]
transitions:
  - {state: ReadingBatch, signal: Seed, next: Relaying, action: load_replay_batch, label: loaded_batch}
  - {state: ReadingBatch, signal: CommandError, next: Failed}
  - {state: Relaying, signal: BatchLoaded, next: Exporting, action: relay_replay_batch}
  - {state: Relaying, signal: CommandError, next: Failed}
  - {state: Exporting, signal: SpansRelayed, next: Done}
  - {state: Exporting, signal: CommandError, next: Failed}
