name: prose-voice-critic
purpose: |-
  Independently evaluate the immutable original and one structure candidate.
  Return a six-category pass or structure-reject verdict as data, without
  editing, persistence, upload, or publication authority.
invariants:
  - Evaluation receives exact original and candidate bytes, identities, and hashes.
  - No editor prompt, reasoning, conversation, confidence, or verdict recommendation enters.
  - All six finding categories are schema-required before verdict routing.
  - This Release 00.1 profile exposes no external detector or upload tool.
  - Reject names structure as the only responsible stage in this tracer.
initial_state: AwaitingRequest
budget:
  max_iterations: 16
  max_tokens: 100000
  max_duration: 5m0s
states:
  - AwaitingRequest
  - ValidatingRequest
  - ComposingEvaluation
  - EvaluatingCandidate
  - CapturingEvaluation
  - ParsingEvaluation
  - CheckingOriginalHash
  - CheckingCandidateHash
  - RoutingVerdict
  - ComposingPassResponse
  - ComposingRejectResponse
  - {name: Passed, run_status: succeeded}
  - {name: Rejected, run_status: succeeded}
  - {name: Failed, run_status: failed}
terminal_states: [Passed, Rejected, Failed]
signals:
  - Seed
  - CriticRequestValid
  - CriticRequestRejected
  - CriticEvaluationContextReady
  - LLMResponded
  - CriticEvaluationCaptured
  - CriticEvaluationParsed
  - CriticEvaluationInvalid
  - CriticOriginalHashMatched
  - CriticOriginalHashMismatched
  - CriticCandidateHashMatched
  - CriticCandidateHashMismatched
  - CriticPassed
  - CriticRejected
  - CriticResponsePassed
  - CriticResponseRejected
  - CommandError
transitions:
  - {state: AwaitingRequest, signal: Seed, next: ValidatingRequest, action: validate_critic_request, label: validated_critic_request}
  - {state: ValidatingRequest, signal: CriticRequestValid, next: ComposingEvaluation, action: compose_critic_evaluation_context, label: critic_evaluation_context}
  - {state: ValidatingRequest, signal: CriticRequestRejected, next: Failed}
  - {state: ValidatingRequest, signal: CommandError, next: Failed}
  - {state: ComposingEvaluation, signal: CriticEvaluationContextReady, next: EvaluatingCandidate, action: evaluate_structure_candidate, label: critic_evaluation_raw}
  - {state: ComposingEvaluation, signal: CommandError, next: Failed}
  - {state: EvaluatingCandidate, signal: LLMResponded, next: CapturingEvaluation, action: capture_critic_evaluation, label: critic_evaluation_transport}
  - {state: EvaluatingCandidate, signal: CommandError, next: Failed}
  - {state: CapturingEvaluation, signal: CriticEvaluationCaptured, next: ParsingEvaluation, action: parse_critic_evaluation, label: critic_evaluation}
  - {state: CapturingEvaluation, signal: CommandError, next: Failed}
  - {state: ParsingEvaluation, signal: CriticEvaluationParsed, next: CheckingOriginalHash, action: critic_original_hash_matches, label: critic_original_hash_check}
  - {state: ParsingEvaluation, signal: CriticEvaluationInvalid, next: Failed}
  - {state: ParsingEvaluation, signal: CommandError, next: Failed}
  - {state: CheckingOriginalHash, signal: CriticOriginalHashMatched, next: CheckingCandidateHash, action: critic_candidate_hash_matches, label: critic_candidate_hash_check}
  - {state: CheckingOriginalHash, signal: CriticOriginalHashMismatched, next: Failed}
  - {state: CheckingOriginalHash, signal: CommandError, next: Failed}
  - {state: CheckingCandidateHash, signal: CriticCandidateHashMatched, next: RoutingVerdict, action: critic_verdict_is_pass, label: critic_verdict_route}
  - {state: CheckingCandidateHash, signal: CriticCandidateHashMismatched, next: Failed}
  - {state: CheckingCandidateHash, signal: CommandError, next: Failed}
  - {state: RoutingVerdict, signal: CriticPassed, next: ComposingPassResponse, action: compose_critic_pass_response, label: critic_response, summary: true}
  - {state: RoutingVerdict, signal: CriticRejected, next: ComposingRejectResponse, action: compose_critic_reject_response, label: critic_response, summary: true}
  - {state: RoutingVerdict, signal: CommandError, next: Failed}
  - {state: ComposingPassResponse, signal: CriticResponsePassed, next: Passed}
  - {state: ComposingPassResponse, signal: CommandError, next: Failed}
  - {state: ComposingRejectResponse, signal: CriticResponseRejected, next: Rejected}
  - {state: ComposingRejectResponse, signal: CommandError, next: Failed}
