# A review template the compose-entry and machine-composition fixtures
# include: one open parameter, a start state, and two final states.
kind: machine
schema_version: 1
unit: review
name: review
purpose: Review a candidate and end approved or rejected.
params:
  - {name: reviewer, type: string, description: The tool that performs the review.}
initial_state: Reviewing
states:
  - {name: Reviewing, meaning: The reviewer is judging the candidate.}
  - {name: Approved,  meaning: The candidate passed review., run_status: succeeded}
  - {name: Rejected,  meaning: The candidate failed review., run_status: failed}
terminal_states: [Approved, Rejected]
signals:
  - {name: Worked,       trigger: The host hands the candidate over.}
  - {name: ReviewPassed, trigger: The reviewer approved.}
  - {name: ReviewFailed, trigger: The reviewer rejected.}
  - {name: CommandError, trigger: A word failed.}
transitions:
  - {state: Reviewing, signal: ReviewPassed, next: Approved, action: $param(reviewer)}
  - {state: Reviewing, signal: ReviewFailed, next: Rejected}
  - {state: Reviewing, signal: CommandError, next: Rejected}
