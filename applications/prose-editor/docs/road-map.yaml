id: prose-editor-roadmap
title: Prose Editor Road Map

feedback_obligation: |
  Implementation findings that contradict an SRD are reconciled into the
  affected SRDs before specifying the next release. Spec mass stops
  compounding ahead of evidence: a requirement that contradicts runtime
  behavior discovered during 00.1 is corrected before 00.2 scope is
  finalized. Contradictions are filed as issues and tracked in the release
  that discovered them.

releases:
  - version: "00.0"
    name: Specification and documentation baseline
    description: |
      Specify one serial original -> structure -> voice -> style -> critique ->
      publication scenario. Six SRDs define the full service topology, saga
      workproducts, tool vocabulary, workflow-orchestrator machine,
      parameterized specialist-editor machine, and voice-critic machine.

      This release is documentation-only. It claims no executable evidence,
      runtime conformance, or publication behavior. The 30-case test suite and
      use case plan full-scenario coverage but remain unexecuted.
    status: specification_complete
    capability_status:
      documentation: specification_complete
      runnable_module: not_implemented
      managed_service: not_planned_for_release
      packaged: not_planned_for_release
      helm_managed: not_planned_for_release
      kind_demo: not_planned_for_release
    srds:
      - id: srd001-prose-editor-services
        status: specified
        summary: Define all agent, supporting, and external service boundaries and authority, including the shared agent-core telemetry flag contract every service accepts.
      - id: srd002-writing-saga-workproducts
        status: specified
        summary: Define exact immutable lineage, manifest state, stage contracts, idempotency, retries, non-destructive compensation, recovery, and one final publication.
      - id: srd003-writing-agent-tools
        status: specified
        summary: Define the complete ToolDef vocabulary, existing-factory reuse, compensation, and exclusive boundary-tool ownership.
      - id: srd004-workflow-orchestrator
        status: specified
        summary: Define exact flat orchestration, srd003 action mappings, persistence sequencing, responsible-stage replay, recovery, budgets, publication escalation, and terminal outcomes.
      - id: srd005-specialist-editor
        status: specified
        summary: Define the parameterized specialist-editor with structure, voice, and style stages sharing a common pipeline shape but differing in accepted parent type, RAG instance, edit operations, preservation invariants, and response contracts.
      - id: srd008-voice-critic
        status: specified
        summary: Define flat independent assurance, six findings, exact-hash consent, separate Pangram tasks, advisory comparison, categorized verdicts, responsible-stage closure, and bounded authority.
    use_cases:
      - id: rel00.0-uc001-edit-document
        summary: |
          Capture a GitHub original, perform structure, voice, and style stages,
          obtain an independent verdict, retry bounded responsible stages, and
          publish one accepted workproduct chain.
        status: planned
    test_suites:
      - id: test-rel00.0-prose-editor
        summary: |
          Plan 30 structural, authority, happy-path, critic-category,
          responsible-stage, boundary-error, retry-exhaustion, all-cut recovery,
          Pangram consent and provider, idempotency, partial-publication,
          immutable-lineage, closure, documentation-consistency, and telemetry
          cases for the full scenario. Runtime cases are staged across 00.1
          and 00.2.
        status: planned
        test_case_count: 30
    evidence_status:
      foundation_yaml: documented
      srd_requirements: srd001_through_srd005_and_srd008_specified
      reciprocal_traceability: 195_requirements_and_64_acceptance_criteria_closed_by_one_planned_use_case_and_30_planned_tests
      executable_evidence: none
    completion_gate: |
      All six SRDs, the use case, and the 30-case test suite exist with
      reciprocal documentation traces. Release 00.0 is complete as a
      documentation baseline. Runtime evidence is staged in 00.1 and 00.2.

  - version: "00.1"
    name: Tracer-bullet saga skeleton
    description: |
      The audit-only governance prerequisite is implemented: Prose Editor owns
      its planned-root application manifest, local documentation audit,
      composition-only stats, and root audit/stats registration. This evidence
      does not implement or partially satisfy the tracer runtime.

      Prove the end-to-end saga skeleton with the minimal runnable slice:
      workflow orchestrator, one specialist-editor stage (structure), critic
      verdict path (Pangram skipped), and local finalization. No voice or
      style stages, no GitHub publication, no Pangram upload.

      The tracer validates the orchestrator state machine, immutable lineage,
      structure-rag retrieval, one bounded retry from critic rejection, and
      local workproduct finalization. Implementation findings that contradict
      SRD details are reconciled before 00.2 scope is finalized.
    status: planned
    capability_status:
      documentation: specification_complete
      runnable_module: audit_only
      managed_service: not_planned_for_release
      packaged: not_planned_for_release
      helm_managed: not_planned_for_release
      kind_demo: not_planned_for_release
    requirement_subsets:
      srd001-prose-editor-services:
        scope: partial
        groups: [R1, R2, R3, R4, R5, R8]
        note: Orchestrator, specialist-editor:structure, voice-critic, and structure-rag only, including the R8 telemetry contract across those services. Voice-rag, tightening-rag, and specialist-editor voice/style stages excluded.
      srd002-writing-saga-workproducts:
        scope: partial
        groups: [R1, R2, R3, R4, R5, R6]
        note: Structure-stage lineage and local finalization only. Voice, style workproducts and publication excluded.
      srd003-writing-agent-tools:
        scope: partial
        groups: [R1, R2, R3, R4]
        note: Orchestrator, structure-editor, and critic tool words only. Voice and style tool words excluded.
      srd004-workflow-orchestrator:
        scope: partial
        groups: [R1, R2, R3, R4, R5, R6, R7]
        note: States through structure, critic, and local finalization. Voice, style, and publication states excluded.
      srd005-specialist-editor:
        scope: partial
        groups: [R1, R2, R3, R4, R5, R6, R7]
        note: Structure stage only (R1-R7). Voice (R8-R14) and style (R15-R20) stages excluded.
      srd008-voice-critic:
        scope: partial
        groups: [R1, R2, R3, R4, R5]
        note: Verdict path without Pangram. Consent-gated upload, separate tasks, advisory comparison excluded.
    use_cases:
      - id: rel00.1-uc001-tracer-saga
        summary: |
          Capture a GitHub original, perform one structure stage, obtain an
          independent critic verdict without Pangram, retry the responsible
          stage when bounded policy permits, and finalize the accepted
          workproduct chain locally without commit, push, or pull request.
        status: planned
    test_suites:
      - id: test-rel00.1-prose-editor
        summary: |
          Plan 13 tracer-scoped cases covering orchestrator structure-critic
          graph, structure-editor machine, critic without Pangram, tracer
          happy path, structure-stage retry, source capture, workproduct
          lineage, command errors, retry exhaustion, recovery, and the
          telemetry contract across the tracer services.
        status: planned
        test_case_count: 13
    planned_workproducts:
      - {path: workproducts/<saga-id>/manifest.yaml, owner: workflow-orchestrator, status: planned}
      - {path: workproducts/<saga-id>/manifest-history/<revision>.yaml, owner: workflow-orchestrator, status: planned}
      - {path: workproducts/<saga-id>/00-original.md, owner: workflow-orchestrator, status: planned}
      - {path: workproducts/<saga-id>/attempts/structure/<attempt>-<sha256>.md, owner: workflow-orchestrator, status: planned}
      - {path: workproducts/<saga-id>/10-structure.md, owner: workflow-orchestrator, status: planned}
      - {path: workproducts/<saga-id>/40-critique.yaml, owner: workflow-orchestrator, status: planned}
      - {path: workproducts/<saga-id>/final.md, owner: workflow-orchestrator, status: planned}
    dependencies:
      - id: applications-shared-module-contract
        reference: ../../docs/specs/software-requirements/srd001-application-module-contract.yaml
        status: available
        use: Cite baseline application governance without copying it.
      - id: applications-managed-services-contract
        reference: ../../docs/specs/software-requirements/srd002-managed-application-services.yaml
        status: available
        use: Cite applicable lifecycle and service obligations without copying them.
      - id: applications-consistency-contract
        reference: ../../docs/specs/software-requirements/srd003-application-consistency.yaml
        status: available
        use: Govern the audit-only manifest, status vocabulary, ownership, and root classification.
      - id: agent-role-realizations
        reference: ../../docs/specs/semantic-models/agent-role-realizations.yaml
        status: available
        use: Pin planned actor bindings and preserve canonical role ownership.
      - id: agent-core-profile-machine-tool-contracts
        reference: ../../../agent-core/docs/specs/
        status: available
        use: Cite profile, machine, ToolDef, REST, lifecycle, checkpoint, and command-state authorities.
      - id: chroma
        boundary: rebuildable retrieval index
        status: planned_dependency
      - id: ollama
        boundary: allowlisted embedding and generation model service
        status: planned_dependency
      - id: github
        boundary: source capture only (publication deferred to 00.2)
        status: planned_dependency
    evidence_status:
      foundation_yaml: documented
      srd_requirements: structure_stage_and_critic_subset
      profiles_and_machines: planned
      tools_and_services: planned
      structural_tests: planned
      boundary_tests: planned
      failure_and_recovery_tests: planned
      end_to_end_test: planned
      publication_test: deferred_to_00_2
      root_registration: audit_only
      executable_evidence: governance_only
    completion_gate: |
      The tracer saga runs end-to-end: source capture, structure edit via
      specialist-editor:structure and structure-rag, critic verdict without
      Pangram, bounded structure-stage retry, and local finalization with
      immutable workproduct lineage. All 13 planned tests pass. The audit-only
      governance evidence is a prerequisite and does not satisfy any runtime
      case. SRD
      contradictions discovered during implementation are filed and reconciled
      before 00.2 scope is finalized.

  - version: "00.2"
    name: Full multi-stage editing and publication
    description: |
      Complete the remaining stages: voice editing via specialist-editor:voice
      and voice-rag, style editing via specialist-editor:style and
      tightening-rag, consent-gated Pangram upload, multi-stage responsible
      retry, and GitHub publication (branch, commit, push, pull request).

      Implementation builds on the 00.1 saga skeleton. SRD requirement items
      contradicted during 00.1 have been reconciled before this release scope
      was finalized.
    status: planned
    capability_status:
      documentation: specification_complete
      runnable_module: planned
      managed_service: planned
      packaged: not_planned_for_release
      helm_managed: not_planned_for_release
      kind_demo: not_planned_for_release
    requirement_subsets:
      srd001-prose-editor-services:
        scope: remaining
        note: Voice-rag, tightening-rag, specialist-editor voice/style stages, and corpus-ingest wrapper.
      srd002-writing-saga-workproducts:
        scope: remaining
        note: Voice, style workproducts and GitHub publication lineage.
      srd003-writing-agent-tools:
        scope: remaining
        note: Voice-editor, style-editor, and Pangram tool words.
      srd004-workflow-orchestrator:
        scope: remaining
        note: Voice, style invocation states and publication states.
      srd005-specialist-editor:
        scope: remaining
        groups: [R8, R9, R10, R11, R12, R13, R14, R15, R16, R17, R18, R19, R20]
        note: Voice stage (R8-R14) and style stage (R15-R20).
      srd008-voice-critic:
        scope: remaining
        note: Pangram consent-gated upload, separate tasks, advisory comparison, and bounded polls.
    use_cases:
      - id: rel00.0-uc001-edit-document
        summary: |
          The full 00.0 use case becomes executable in 00.2 with all three
          editor stages, Pangram, multi-stage retry, and GitHub publication.
        status: planned
    test_suites:
      - id: test-rel00.0-prose-editor
        summary: |
          The 30-case 00.0 suite becomes executable. Cases not covered by the
          00.1 tracer suite exercise voice, style, Pangram, multi-stage retry,
          publication, telemetry, and full end-to-end paths.
        status: planned
        test_case_count: 30
    dependencies:
      - id: release-00-1
        reference: release 00.1
        status: planned
        use: Saga skeleton, orchestrator machine, structure stage, and critic verdict path.
      - id: canonical-corpus-ingest
        reference: ../../catalog/
        status: available_for_future_reference
        use: Reuse the canonical program through a planned local wrapper.
      - id: pangram
        boundary: optional consent-gated advisory upload
        status: planned_dependency
      - id: github
        boundary: source and final publication platform
        status: planned_dependency
    evidence_status:
      foundation_yaml: documented
      srd_requirements: all_195_requirement_items
      profiles_and_machines: planned
      tools_and_services: planned
      structural_tests: planned
      boundary_tests: planned
      failure_and_recovery_tests: planned
      end_to_end_test: planned
      publication_test: planned
      root_registration: planned
      executable_evidence: planned
    completion_gate: |
      All 195 requirement items and 64 acceptance criteria have executable
      evidence. The full 30-case test suite passes. Voice, style, Pangram,
      multi-stage retry, and GitHub publication paths run end-to-end.

  - version: "00.3"
    name: Deployment package, Helm topology, and declarative applier
    description: |
      Package and deploy the completed application. Two SRDs define the planned
      deployment form: a deterministic role-closure package plus a Helm chart
      that renders one Deployment and Service per served role on the profile-free
      runtime image, and a standalone declarative applier that actuates that
      chart. The applier validates a decided values patch against the chart
      values schema with a helm dry-run, applies it as a values-file rollout,
      verifies the role Deployments via kubectl rollout status, and rolls the
      release back on failure.

      This release builds on the 00.2 managed service. It adds the packaged,
      Helm-managed, and kind-demo capabilities and the applier component. The
      applier holds helm and kubectl authority alone; the workflow orchestrator,
      specialist-editor stages, voice critic, and retrieval roles carry none. The
      caller is an authorized operator or CI process reaching the apply surface
      from outside the serving pods. SRD contradictions discovered during 00.2
      have been reconciled before this release scope was finalized.
    status: planned
    capability_status:
      documentation: specification_complete
      runnable_module: planned
      managed_service: planned
      packaged: planned
      helm_managed: planned
      kind_demo: planned
    srds:
      - id: srd006-helm-topology
        status: planned
        summary: Define the planned role-closure package, per-role chart topology on the profile-free image, values schema, kind-demo smoke, and the canonical collector workload with its served trace UI and per-role OTLP flags.
      - id: srd007-applier
        status: planned
        summary: Define the planned standalone declarative applier — validate against the chart values schema, apply as a values-file rollout, verify role Deployments, and roll back on failure — with helm and kubectl authority held in the applier alone.
    use_cases:
      - id: rel00.3-uc001-declarative-applier
        summary: |
          An authorized operator or CI caller submits a decided values patch; the
          applier validates it against the chart values schema, applies it as a
          values-file rollout, verifies the role Deployments, and rolls back on a
          verify stall or apply-command failure, holding the deployment CLIs off
          the serving pods.
        status: planned
    test_suites:
      - id: test-rel00.3-applier
        summary: |
          Plan eight cases covering documentation trace closure, the
          validate-apply-verify-rollback machine over recording-fake CLIs, the
          chart values schema against real helm, the authority boundary over the
          rendered chart and profiles, the broken-rollout-read terminal, a live
          on-cluster rollout and rollback on kind, a deterministic
          role-closure package, and the collector observability topology with
          its served trace UI.
        status: planned
        test_case_count: 8
    dependencies:
      - id: release-00-2
        reference: release 00.2
        status: planned
        use: Completed runnable saga, managed services, and role serving contracts to package and deploy.
      - id: applications-managed-services-contract
        reference: ../../docs/specs/software-requirements/srd002-managed-application-services.yaml
        status: available
        use: Cite the packaged, Helm-managed, and kind-demo baseline obligations without copying them.
      - id: agent-core-rest-machine-exec-contracts
        reference: ../../../agent-core/docs/specs/
        status: available
        use: Cite REST server, machine-request, monitor, and CLI exec authorities the applier builds on.
      - id: kubernetes
        boundary: rollout target for the packaged chart
        status: planned_dependency
      - id: helm
        boundary: chart package, dry-run validation, upgrade, and rollback CLI held by the applier
        status: planned_dependency
    evidence_status:
      foundation_yaml: documented
      srd_requirements: srd006_and_srd007_planned
      package_and_chart: planned
      values_schema: planned
      applier_profile_and_machine: planned
      structural_tests: planned
      boundary_tests: planned
      live_kind_test: planned
      root_registration: planned
      executable_evidence: none
    completion_gate: |
      The role-closure package and Helm chart render the served-role Deployments
      on the profile-free image, the applier validates a decided patch against
      the chart values schema, applies it as a values-file rollout, verifies the
      role Deployments, and rolls back on failure, with helm and kubectl held in
      the applier alone. All eight planned tests pass, including the live kind
      rollout and rollback. SRD contradictions discovered during implementation
      are filed and reconciled before any later release scope is finalized.
