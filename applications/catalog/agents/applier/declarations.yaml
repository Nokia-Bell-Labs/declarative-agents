# The applier serving lifecycle and its monitor pair. The four lifecycle words
# arrive from the agent-core fragment under this agent's own names, and the
# monitor pair is the agent-core unit every such agent imports; nothing about
# either is written out here.
unit: catalog-applier-declarations
imports:
  - /opt/agent-core/tools/units/monitor-rest-declarations.yaml
instantiate:
  - fragment: /opt/agent-core/tools/units/serve-lifecycle-declarations-fragment.yaml
    args:
      agent: "applier"
      launch_requests: launch_applier_requests
      launch_control: launch_applier_control
      await_control: await_applier_control
      stop_requests: stop_applier_requests
      requests_rest_ref: applier_apply
      control_rest_ref: applier_control
      requests_noun: apply
      requests_purpose: that applies one deployment change
tools:
