unit: request-signal-tools
imports:
  - types.yaml
tools:
  - name: echo_request
    type: builtin
    init: compose
    category: word
    description: Render trusted request data forward as the completed value.
    visibility: internal
    signature:
      output: request-signal-types.RenderedValue
      emits: [WorkCompleted]
    config:
      template: '{"value":{{ json value }}}'
      inputs:
        value: $.data
      signal: WorkCompleted
  - name: suspend
    type: builtin
    init: suspend
    category: boundary
    visibility: internal
    signature:
      emits: [AwaitApproval, CommandError]
    config:
      label: request-signal-approval
      reason: awaiting continuation request
      require_checkpoint: true
    side_effects:
      - {kind: state_mutation, target: lifecycle_checkpoint, state: suspended, description: Requests a checkpointed continuation boundary.}
      - {kind: human_boundary, target: request_caller, description: Returns control until the next mapped request.}
    reversibility: {classification: compensatable}
    undo:
      strategy: compensating_action
      description: Continue, reject, or roll back the suspended request.
      payload: suspend_receipt
      captures: [label, reason, checkpoint_required, checkpoint_configured, checkpoint_reference_context]
      requires: [operator_decision, resume_signal_or_rollback_target]
  - name: fail_request
    type: builtin
    init: compose
    category: word
    description: Render the configured failure proof forward.
    visibility: internal
    signature:
      output: request-signal-types.RenderedValue
      emits: [WorkFailed]
    config:
      template: '{"value":{{ json value }}}'
      inputs:
        value: $.data
      signal: WorkFailed
