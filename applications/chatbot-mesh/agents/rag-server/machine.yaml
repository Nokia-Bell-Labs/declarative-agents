# An instance of agent-core's serve-machine template (srd054): the persistent
# service lifecycle with this agent's server words wired in. What a request
# does lives in request-machine.yaml.
unit: rag-server-machine
name: rag-server
purpose: |-
  The Chroma RAG server profile hosts the reader retrieval chain as a persistent
  service. It launches a machine_request query server, a control server, and a
  monitor server, then idles in AwaitingControl until a lifecycle exit event is
  enqueued, at which point it exits the agent and stops the servers. Each inbound
  query runs a request-scoped machine (request-machine.yaml): the request body
  supplies query_embeddings, the collection is resolved, and chroma_query returns
  the nearest chunks. The RAG server does not embed the query (the caller
  supplies the vector) and does not answer (it returns chunks).

  - The query vector is supplied by the caller in the request body; no embedding is computed here.
  - The Chroma server is an external precondition; the request path assumes an ingested collection.
instantiate:
  - fragment: /opt/agent-core/tools/machines/serve-machine-template.yaml
    args:
      launch_requests: launch_rag_requests
      launch_control: launch_rag_control
      await_control: await_rag_control
      stop_requests: stop_rag_requests
