name: status-issues
purpose: |-
  Leave one weekly status issue per listed person for the coming week,
  and with the roster in the system repository the team and program
  rollup issues (srd018 R7, R16): the program manager's weekly step. Use
  when the program manager asks to open the week's status issues.

  This machine has no model state: scrum-master reports status-issues
  (design.md D10, D14; GH-37). With control, it reads the roster in the
  system repository's control/reports.md (GH-2725); without it,
  SCRUM_MASTER_REPORTS names a central reports repository's checkout.
configuration:
  machine: plugin/agents/status-issues/machine.yaml
  tools: plugin/agents/status-issues/tools.yaml
invariants:
- Every step is a word; no model acts anywhere in this machine
- A refusal ends the run in the state that names it, with the word's reason
lifecycle: |-
  1. Idle → StatusIssues (Seed): scrum-master reports status-issues
  2. StatusIssues → Done (ToolDone)
initial_state: Idle
budget:
  command_timeout: 16m
  max_iterations: 10
states:
- name: Idle
  meaning: Initial state before the first word.
- name: StatusIssues
  meaning: |
    The status-issues word: scrum-master reports status-issues files one
    status issue per listed person for the coming week, in the repository
    they report in, and with control one team rollup issue per subsystem
    and one program rollup issue, each due after the last; it files none
    twice.
- name: Done
  run_status: succeeded
  meaning: |
    Terminal. Every word ran, and the last one reported what it did.
- name: Refused
  run_status: failed
  meaning: |
    Terminal. The status issues could not be filed, and the word's reason
    is the run's last output.
- name: Failed
  run_status: failed
  meaning: Terminal. An infrastructure error outside the words' refusals.
terminal_states:
- Done
- Refused
- Failed
signals:
- name: Seed
  trigger: Loop initialization.
- name: ToolDone
  trigger: A word executed successfully.
- name: ToolFailed
  trigger: A word reported failure — a refusal with its reason.
- name: CommandError
  trigger: Infrastructure-level error (not a tool failure).
transitions:
- state: Idle
  signal: Seed
  next: StatusIssues
  action: reports_status_issues
  summary: true
- state: StatusIssues
  signal: ToolFailed
  next: Refused
- state: StatusIssues
  signal: ToolDone
  next: Done
- state: Idle
  signal: CommandError
  next: Failed
- state: StatusIssues
  signal: CommandError
  next: Failed
