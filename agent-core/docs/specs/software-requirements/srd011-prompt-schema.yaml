id: srd011-prompt-schema
title: Prompt Schema and Assembly

problem: |
  Every agent needs a structured system prompt assembled from multiple
  parts: a persona (role), the caller's task, behavioral constraints,
  and an output format description. The generator implemented this in
  its internal/prompt package with a Prompt struct and compiled defaults.

  Without a shared prompt package, each new agent reimplements the same
  schema and assembly logic. Moving this to agent-core gives
  all agents a consistent prompt format with override points for their
  domain-specific defaults.

goals:
  - G1: Prompt struct with typed fields for each section of the system message.
  - G2: ToolDef config maps structured prompt fields into Prompt.
  - G3: Runtime request input supplies the per-run task separately from prompt policy.
  - G4: Assembly contract producing the system-role message text.
  - G5: Replace generator's internal/prompt package with agent-core internal/model/prompt.

requirements:
  R1:
    title: Prompt struct
    items:
      - R1.1: "Prompt is a Go struct with four string fields: Role, Task, Constraints, OutputFormat."
      - R1.2: Role is the system persona describing what kind of assistant the LLM is.
      - R1.3: Task is the caller's objective for the current run.
      - R1.4: Constraints is a free-text block of behavioral rules.
      - R1.5: OutputFormat describes the expected response structure.

  R2:
    title: Tool declaration schema
    items:
      - R2.1: invoke_llm ToolDef config MAY declare system_prompt and tool_prompt fields.
      - R2.2: Runtime request input supplies user task content through the machine data path.
      - R2.3: Prompt policy and runtime task data SHALL remain distinct.
      - R2.4: Unknown ToolDef config fields SHALL be rejected by strict config decoding.

  R3:
    title: Prompt construction
    items:
      - R3.1: invoke_llm factory construction maps declared prompt fields into Prompt.
      - R3.2: Missing optional policy fields select explicit adapter defaults.
      - R3.3: Runtime task text is appended through Conversation by invoke_llm.
      - R3.4: Prompt construction performs no hidden filesystem read.
      - R3.5: The constructed Prompt is consumed by DefaultAssembler.

  R4:
    title: Runtime task input
    items:
      - R4.1: Runtime task text comes from the machine seed, previous result, or declared command-state selector.
      - R4.2: Missing required runtime input emits CommandError.
      - R4.3: Runtime input does not choose prompt policy or templates.

  R5:
    title: Compiled defaults
    items:
      - R5.1: DefaultRole describes a general-purpose coding assistant persona.
      - R5.2: DefaultConstraints provides baseline behavioral rules (JSON-only, single tool per turn, workspace confinement).
      - R5.3: DefaultOutputFormat describes the expected JSON response structure.
      - R5.4: Defaults are compiled into the binary. Agents override them with domain-specific values.

  R6:
    title: Assembly
    items:
      - R6.1: DefaultAssembler maps Prompt fields into PromptData and calls RenderSystemPrompt.
      - R6.2: RenderSystemPrompt uses the embedded template and omits empty optional sections.
      - R6.3: Rendering is deterministic for fixed PromptData and tool manifest.
      - R6.4: Custom template parsing is not exposed as an unused runtime surface.

  R7:
    title: Validation
    items:
      - R7.1: Required runtime prompt input SHALL be validated at the invoke_llm boundary.
      - R7.2: Construction failures return an error rather than a partial command.

non_goals:
  - System prompt template rendering (srd for system prompt template).
  - Tool manifest serialization.
  - Conversation history management.
  - Loading standalone prompt files or inline prompt strings outside MachineSpec and ToolDef data paths.

acceptance_criteria:
  - id: AC1
    criterion: Prompt has four string fields and DefaultAssembler renders them deterministically through the embedded system template.
    traces: [R1.1, R1.2, R1.3, R1.4, R1.5, R6.1, R6.2, R6.3, R6.4]

  - id: AC2
    criterion: ToolDef config supplies prompt policy while machine runtime input supplies task data.
    traces: [R2.1, R2.2, R3.1, R3.2, R3.3]

  - id: AC3
    criterion: Prompt policy and runtime task remain distinct, and unknown ToolDef config fields are rejected.
    traces: [R2.3, R2.4, R3.4]

  - id: AC4
    criterion: invoke_llm builds Prompt without hidden filesystem reads and DefaultAssembler consumes it.
    traces: [R3.5, R4.1, R4.3]

  - id: AC5
    criterion: Compiled defaults provide Role, Constraints, OutputFormat. They are exported and overridable.
    traces: [R5.1, R5.2, R5.3, R5.4]

  - id: AC6
    criterion: Missing required runtime prompt input emits CommandError without a partial command.
    traces: [R7.1, R7.2, R4.2]

