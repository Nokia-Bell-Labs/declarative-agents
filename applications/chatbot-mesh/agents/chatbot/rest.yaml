unit: mesh-chatbot-rest
# The RAG query client is the shared retrieval contract (srd060): one expansion
# names the route, the per-item authority, and the query vector; the limits
# profile below still bounds every selected server.
expand:
  - fragment: /opt/agent-core/tools/rest/units/retrieval-query-client-fragment.yaml
    args:
      route_prefix: rag
      base_url_selector: $from(rag_unit).base_url
      input_selector: $from(normalize_query_embedding).mapped.embedding
      limits_ref: local_provider
rest:
  version: v1
  auth:
    none:
      type: none
  limits:
    local_provider:
      timeout: 130s
      read_timeout: 130s
      max_request_bytes: 1048576
      max_response_bytes: 1048576
      redirect:
        mode: none
      network:
        schemes: [http]
        hosts: [127.0.0.1, localhost]
        ports: [11434, 18085, 18095]
    local_chat_requests:
      timeout: 130s
      read_timeout: 130s
      max_request_bytes: 1048576
      max_response_bytes: 1048576
      redirect:
        mode: none
      network:
        schemes: [http]
        hosts: [127.0.0.1, localhost]
        ports: [18080]
    local_chatbot_control:
      timeout: 30s
      read_timeout: 5s
      max_request_bytes: 16384
      max_response_bytes: 65536
      redirect:
        mode: none
      network:
        schemes: [http]
        hosts: [127.0.0.1, localhost]
        ports: [18081]
  servers:
    chatbot_chat:
      address: 127.0.0.1:18080
      limits_ref: local_chat_requests
      endpoints:
        chat:
          method: POST
          path: /api/v1/chat
          binding: machine_request
          request:
            body_schema:
              type: object
              required: [message]
              properties:
                message: {type: string}
                history: {type: array}
          machine_request:
            # request-profile.yaml, not profile.yaml: the chat machine needs the
            # chat-LLM vocabulary in its tools selection, and the persistent
            # agent's profile must not carry it (GH-1900).
            profile: request-profile.yaml
            machine: request-machine.yaml
            timeout: 130s
            request:
              body:
                message: $.message
                history: $.history
            response:
              # Keyed by terminal state, not signal: compose_response reports the
              # unresolved selectors for every source outcome that did not happen,
              # so the turn can reach LLMResponded on either ResponseComposed or
              # CommandError and both must map to the same 200 (rest-tool-format
              # machine_request_response_mapping, GH-615).
              terminal_states:
                LLMResponded:
                  status: 200
                  content_type: application/json
                  body:
                    answer: $.answer
                    metadata: $.metadata
                Failed:
                  status: 500
                  content_type: application/json
                  body:
                    error: command_error
                    message: $.message
        monitor_proxy:
          method: GET
          path: /monitor-proxy/{agent}/{path...}
          binding: monitor_proxy
          # Same-origin reverse proxy so the SPA reads every mesh agent's monitor
          # state and SSE stream through this server (agent-core monitor_proxy,
          # GH-358). The upstreams are the monitored-agents surface srd003
          # co-generates; keep them in sync with agents/chatbot/ui/ui.yaml monitored_agents
          # and trace_backend, which the SPA's kit panels read.
          monitor_proxy:
            upstreams:
              chatbot: http://127.0.0.1:18082
              rag0: http://127.0.0.1:18087
              rag1: http://127.0.0.1:18097
              collector: http://127.0.0.1:18193
          request:
            path:
              agent: {type: string}
              path: {type: string}
        ui:
          method: GET
          path: /ui/{path...}
          binding: static_assets
          static_assets:
            root: "${CHATBOT_UI_ROOT:-agents/chatbot/ui/app/dist}"
            index: index.html
            spa: true
          request:
            path:
              path: {type: string}
        root_redirect:
          method: GET
          path: /
          binding: redirect
          redirect:
            location: /ui/
            status: 302

    chatbot_control:
      address: 127.0.0.1:18081
      limits_ref: local_chatbot_control
      queue:
        name: chatbot_control
        capacity: 8
        timeout: 30s
      shutdown:
        timeout: 5s
        drain_policy: drain_then_stop
      endpoints:
        health:
          method: GET
          path: /api/lifecycle/health
          binding: health

