# Fixture content is environment-expanded like other REST definitions, so one
# fixture can serve a value a scenario supplies at start.
routes:
  - method: GET
    path: /v1/echo
    responses:
      - status: 200
        body:
          value: ${MOCK_ECHO_VALUE:-default-value}
