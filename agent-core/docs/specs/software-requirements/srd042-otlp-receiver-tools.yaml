id: srd042-otlp-receiver-tools
title: OTLP Receiver Tools

problem: |
  Declarative agents export spans through OTLP, but agent-core has no inbound
  OTLP vocabulary. Integration deployments therefore require a collector
  process whose receive, retain, and relay decisions are outside MachineSpec.
  That process cannot participate in the agent monitor, lifecycle, scenario
  rig, or declared filtering rules.

  OTLP transport belongs in Go because a machine does not parse protobuf or
  own sockets. Intake policy belongs in MachineSpec because accepting, testing,
  spooling, and relaying a batch are workflow decisions. The runtime needs
  small boundary words that expose transport while leaving their order and
  branching visible in the grammar.

goals:
  - G1: Receive OTLP trace and metric batches through a declared server-binding family.
  - G2: Deliver bounded batches to a persistent machine through a blocking await word.
  - G3: Write deterministic trace and metric evidence in NDJSON shapes (stdouttrace for spans).
  - G4: Relay a selected batch to an upstream OTLP endpoint without changing span identity.
  - G5: Prevent the component implementing ingress from exporting telemetry to itself.

requirements:
  R0:
    title: Tool-language boundary
    items:
      - R0.1: Each receiver tool SHALL follow cfg-tool-authoring-standard and srd022 for category, typed config, signals, side effects, errors, and undo.
      - R0.2: OTLP protobuf decoding, socket ownership, queue synchronization, NDJSON encoding, and gRPC export SHALL live in the focused `internal/tools/otlp` package.
      - R0.3: MachineSpec SHALL own launch, await, offline load, filter, spool, relay, retry, and stop order.
      - R0.4: The package SHALL expose separate `otlp_receiver_launch`, `await_spans`, `load_otlp_batch`, `spool_spans`, `relay_spans`, and `otlp_receiver_stop` words; no word SHALL hide a complete ingress or replay sentence.
      - R0.5: Internal protobuf validation, stdouttrace-compatible span projection, synchronized complete-batch append, and bounded rotation SHALL remain in process unless a replacement proves field-level compatibility, queue/backpressure preservation, atomic batch writes, rotation semantics, runtime provisioning, and the same declared signals. The existence of otelcol or a stdout exporter alone is not equivalence (GH-1382).

  R1:
    title: Receiver launch
    items:
      - R1.1: "`otlp_receiver_launch` SHALL bind OTLP/gRPC on a configured address and register the OTLP TraceService Export operation."
      - R1.2: The default address SHALL be `0.0.0.0:4317`; automated tests SHALL configure an isolated loopback address.
      - R1.3: Launch SHALL validate receiver name, address, queue capacity, and overflow policy before listening.
      - R1.4: The receiver SHALL decode `ExportTraceServiceRequest` batches with `go.opentelemetry.io/proto/otlp` and SHALL NOT translate transport payloads in the gRPC handler.
      - R1.5: Launch SHALL return without waiting for a batch and SHALL emit `ReceiverLaunched` or `CommandError`.
      - R1.6: Launch output SHALL include receiver name, bound address, queue capacity, and overflow policy.
      - R1.7: Launch side effects SHALL be `network_listen` and receiver-state mutation; undo SHALL stop the listener only when this launch owns it.

  R2:
    title: Bounded batch queue
    items:
      - R2.1: Receiver state SHALL hold complete OTLP trace export requests as batches in a bounded FIFO queue.
      - R2.2: Queue capacity SHALL be at least one and SHALL be fixed at launch.
      - R2.3: The supported overflow policies SHALL be `reject`, `drop_oldest`, and `drop_newest`; any other value SHALL fail registration.
      - R2.4: Under `reject`, a full queue SHALL return an OTLP partial-success response whose rejected span count equals the incoming batch span count.
      - R2.5: Under a drop policy, the receiver SHALL report the dropped batch and span counts in bounded diagnostics and SHALL NOT block the gRPC handler indefinitely.
      - R2.6: Receiver state SHALL be safe for concurrent exporters, one or more awaiters, and stop.

  R3:
    title: Batch await
    items:
      - R3.1: "`await_spans` SHALL block until one queued batch is available, its configured timeout expires, the receiver stops, or context cancellation occurs."
      - R3.2: Await config SHALL name the receiver and MAY set a timeout; no request body or model output SHALL select the receiver.
      - R3.3: Await SHALL consume one FIFO batch and emit `SpansReceived`, `AwaitTimedOut`, `ReceiverStopped`, or `CommandError`.
      - R3.4: Successful output SHALL include the OTLP batch under `batch`, plus `batch_id`, `span_count`, service names, trace IDs, and resource attributes needed by later declared decisions.
      - R3.5: "`batch_id` SHALL be generated by receiver state and SHALL be bounded opaque correlation metadata, not a telemetry resource identity."
      - R3.6: Await side effects SHALL be limited to queue consumption and command-state output; undo SHALL be noop.
      - R3.7: "`load_otlp_batch` SHALL read one trusted OTLP protobuf-JSON file, decode it as an ExportTraceServiceRequest, and emit `BatchLoaded` or `CommandError` without exporting it."
      - R3.8: Load output SHALL include path, span count, and the decoded batch so a following declared `relay_spans` word can export it.
      - R3.9: Read and protobuf-JSON decode failures SHALL remain distinct and SHALL prevent relay dispatch.
      - R3.10: "`load_otlp_batch` SHALL NOT be replaced by an unvalidated byte copy: protobuf-JSON decoding is the trust-boundary check that makes its typed batch safe for relay."

  R4:
    title: Deterministic spool
    items:
      - R4.1: "`spool_spans` SHALL resolve an OTLP batch from a declared `batch_source` selector and append one NDJSON object per span to a configured file."
      - R4.2: Each object SHALL use the field names and value shapes emitted by the existing stdouttrace exporter, including `Name`, `SpanContext`, `Parent`, `StartTime`, `EndTime`, `Attributes`, `Events`, `Links`, `Status`, `Resource`, and `InstrumentationScope`.
      - R4.3: Resource attributes SHALL remain under `Resource` and SHALL preserve `service.name`, integration run identity, and every other received attribute.
      - R4.4: Appends SHALL serialize concurrent writers, write complete lines, and sync before reporting success.
      - R4.5: Config MAY set `max_bytes` and `max_files`; when the next complete batch would exceed `max_bytes`, rotation SHALL rename older files before writing the new batch and SHALL retain at most `max_files`.
      - R4.6: A failed append or rotation SHALL emit `CommandError`, SHALL leave the received batch addressable through command state, and SHALL NOT trigger relay implicitly.
      - R4.7: Successful output SHALL include path, batch id, span count, bytes written, and the selected batch so a following declared word can relay it.
      - R4.8: Spool side effects SHALL be `filesystem`; undo SHALL be noop because append evidence is an audit record.

  R5:
    title: Declared relay
    items:
      - R5.1: "`relay_spans` SHALL resolve a batch from a declared `batch_source` selector and export that unchanged request to a configured OTLP/gRPC endpoint."
      - R5.2: Relay SHALL preserve resource spans, scope spans, trace IDs, span IDs, parent IDs, timestamps, events, links, status, and attributes byte-for-byte at the protobuf field level.
      - R5.3: Relay config SHALL set an endpoint and MAY set a timeout; TLS, credentials, and endpoint selection from runtime input are outside this release.
      - R5.4: A partial-success response with rejected spans SHALL emit `CommandError` and report the bounded rejected count and upstream message.
      - R5.5: Relay SHALL emit `SpansRelayed` or `CommandError`; retry routing SHALL remain a MachineSpec decision.
      - R5.6: Relay output SHALL include endpoint, batch id, span count, and accepted span count.
      - R5.7: Relay side effects SHALL be `external_api`; undo SHALL be noop because an OTLP export cannot retract accepted spans.

  R6:
    title: Stop and lifecycle
    items:
      - R6.1: "`otlp_receiver_stop` SHALL gracefully stop the named receiver, reject new exports, and unblock all awaiters."
      - R6.2: Stop config SHALL include a shutdown timeout and a drain policy of `preserve` or `drop`.
      - R6.3: Stop SHALL emit `ReceiverStopped` or `CommandError` and report queued, drained, and dropped batch counts.
      - R6.4: Stop SHALL be idempotent for an already stopped receiver owned by the same runtime.
      - R6.5: No receiver operation SHALL leak a listener or goroutine after stop or failed launch.

  R7:
    title: Self-loop rule
    items:
      - R7.1: A profile that implements shared ingress SHALL configure its own agent telemetry with file export only and SHALL NOT set its OTLP endpoint to the receiver it owns (srd008 R9.6).
      - R7.2: Registration SHALL reject a statically identical receiver bind address and relay endpoint after normalizing wildcard and loopback aliases.
      - R7.3: The receiver SHALL preserve a batch whose resource `service.name` equals the collector role when that batch came from another process; service-name filtering alone SHALL NOT implement the self-loop rule.
      - R7.4: Tests SHALL prove that collector lifecycle and machine spans do not arrive at its receiver while client-agent spans do.

  R8:
    title: Scope and signal coverage
    items:
      - R8.1: The receiver SHALL accept OTLP trace and metric exports on the same gRPC listener.
      - R8.2: OTLP logs and direct Prometheus scraping SHALL remain outside these words; Dolt metrics reach the receiver as OTLP metric exports forwarded by the in-cluster collector, not by direct scraping.
      - R8.3: The receiver SHALL satisfy the srd008 R9 shared-ingress contract for both trace and metric evidence, so no separate metrics backend is required.

  R9:
    title: Metric intake, spool, and query
    items:
      - R9.1: "`otlp_receiver_launch` SHALL register the OTLP MetricsService Export operation on the same gRPC listener as the TraceService, and SHALL decode `ExportMetricsServiceRequest` batches with `go.opentelemetry.io/proto/otlp` without translating transport payloads in the handler."
      - R9.2: Receiver state SHALL hold complete OTLP metric export requests as batches under the same bounded FIFO and drop discipline as trace batches, and the drop policy SHALL report dropped batch and data-point counts in bounded diagnostics.
      - R9.3: A declared spool word SHALL append received metric batches as complete NDJSON lines carrying resource attributes, scope, metric name, and data points, under the same lock and bounded rotation as the trace spool, and SHALL NOT leave a partial line.
      - R9.4: Declared read-only query words SHALL list and fetch spooled metrics by metric name through config-capped pagination, and each fetched detail record SHALL return its decoded resource attributes unchanged, including `service.name` and `test.run.id`, so callers can identify the originating integration run while preserving the service and metric payload without an unbounded response from a persistent spool.
      - R9.5: Trace intake, spool, relay, and query behavior SHALL remain unchanged; metric words SHALL NOT alter span records or the stdouttrace shape.

non_goals:
  - Receiving OTLP logs.
  - Acting as a general-purpose, firehose-rate telemetry collector.
  - Sampling languages beyond machine composition from existing predicate words.
  - Querying Jaeger or serving a trace search API.
  - TLS, authentication, compression negotiation beyond gRPC defaults, or multi-tenant isolation.
  - Replacing deterministic per-run file export from producing agents.
  - Requiring otelcol as a runtime dependency for the receiver's declared spool contract without a compatibility and provisioning decision.

acceptance_criteria:
  - id: AC1
    criterion: A declared launch word accepts an OTLP/gRPC trace export into a bounded queue and a declared await word returns that complete batch to a machine, while transport/spool internals retain their compatibility and provisioning gate.
    traces: [R0.1, R0.2, R0.3, R0.4, R0.5, R1.1, R1.2, R1.3, R1.4, R1.5, R1.6, R2.1, R2.2, R2.3, R2.4, R2.5, R2.6, R3.1, R3.2, R3.3, R3.4, R3.5, R3.6]

  - id: AC2
    criterion: A received batch is appended as complete stdouttrace-compatible NDJSON lines with span and resource identity intact, and bounded rotation never leaves a partial line.
    traces: [R4.1, R4.2, R4.3, R4.4, R4.5, R4.6, R4.7, R4.8]

  - id: AC3
    criterion: A declared relay exports the selected batch to an upstream OTLP endpoint without changing protobuf span identity, and upstream rejection is a machine-visible fault.
    traces: [R5.1, R5.2, R5.3, R5.4, R5.5, R5.6, R5.7]

  - id: AC4
    criterion: Stop rejects new exports, unblocks awaiters, obeys the drain policy, and leaves no listener or goroutine behind.
    traces: [R1.7, R6.1, R6.2, R6.3, R6.4, R6.5]

  - id: AC5
    criterion: The ingress agent exports its own telemetry to file only, rejects a static relay self-loop, and receives client spans without receiving its own lifecycle spans.
    traces: [R7.1, R7.2, R7.3, R7.4]

  - id: AC6
    criterion: The receiver accepts OTLP trace and metric exports on one gRPC listener, makes no OTLP logs claim, and satisfies the persistent integration metrics contract without a separate metrics backend.
    traces: [R8.1, R8.2, R8.3]

  - id: AC7
    criterion: An offline replay machine validates and loads one trusted OTLP protobuf-JSON batch and relays it unchanged through separate visible words, with distinct read and decode failures and no unvalidated byte-copy substitute.
    traces: [R0.2, R0.3, R0.4, R3.7, R3.8, R3.9, R3.10, R5.1, R5.2, R5.4, R5.5]

  - id: AC8
    criterion: The receiver accepts an OTLP/gRPC metric export into the same bounded queue, spools it as NDJSON with resource and metric identity intact under bounded rotation, and serves it back through declared, config-capped paginated query words whose detail records preserve resource attributes such as `service.name` and `test.run.id`, leaving trace intake, spool, relay, and query behavior unchanged.
    traces: [R9.1, R9.2, R9.3, R9.4, R9.5]

