name: planner-plan-only
purpose: |-
  The planner is a pipeline agent that decomposes a requirement graph
  into tasks, generates implementation plans via LLM, and materializes
  them as issues. It loops over the requirement graph until all tasks
  are planned or all remaining work is blocked.

  Variant: plan-only materializes issues but does not execute generator tasks.
configuration:
  machine: agents/planner/machine.yaml
  tools: agents/planner/tools.yaml
  llm_configs: agents/planner/llm/*.yaml
  variants:
  - agents/planner/machine-passthrough.yaml
  - agents/planner/machine-plan-only.yaml
invariants:
- Conversation history is reset between tasks
- Each task gets a fresh prompt with SRD context
- Failed tasks can be retried before moving on
- Graph nodes are marked done/failed to track progress
- The planner terminates when no more tasks are extractable
lifecycle: |-
  1. Idle → Extracting: extract_task from requirement graph; NoTask routes through remaining_work
  2. Extracting → Resetting: task extracted, clear LLM history
  3. Resetting → ProjectingPromptContext → PromptAssembly: project structured context and compose the profile-owned prompt
  4. PromptAssembly → PlanInvoking: invoke_llm for plan generation
  5. PlanInvoking → PlanParsing: parse_plan from LLM response; invalid plans
     are reported and reinvoked until the explicit parse budget is exhausted
  6. PlanParsing → IssueFormatting → IssueBodyWriting: format_issue then write
  7. IssueBodyWriting → IssueCreating → IssueRecording: selected tracker exec then record_tracker_issue
  8. IssueRecording → Extracting: continue planning without task execution

  The outer loop (Extracting → ... → IssueRecording → Extracting)
  repeats until the graph is fully resolved.
pipeline_diagram: |-
  ```mermaid
  flowchart TD
    A[Idle] -->|Seed| B[Extracting]
    B -->|TaskExtracted| C[Resetting]
    C --> D[PromptAssembly]
    D --> E[PlanInvoking]
    E --> F[PlanParsing]
    F -->|ParseFailed| RPE[Report Parse Error]
    RPE -->|ToolDone| E
    RPE -->|BudgetExhausted| FAIL[Failed]
    F --> G[Format / Write / Tracker Exec / Record]
    G --> B
    B -->|NoTask| Q[QueryingRemainingWork]
    Q -->|AllDone| K[Completed]
    Q -->|Blocked| L[Stalled]
    Q -->|WorkRemaining| B
  ```
initial_state: Idle
budget:
  max_consecutive_parse_errors: 5
states:
- name: Idle
  meaning: Initial state before planning begins.
- name: Loading
  meaning: Loading the specification corpus and building the requirement graph.
- name: Extracting
  meaning: |
    Selecting the next ready task from the requirement graph.
    May terminate if all tasks are done, blocked, or batch limit reached.
- name: Resetting
  meaning: Clearing conversation history before a new task's LLM call.
- name: InitializingFailureContext
  meaning: Seeding empty labelled failure context for a newly extracted task.
- name: PromptAssembly
  meaning: Rendering profile-owned prompt sections from labelled planner context.
- name: ProjectingPromptContext
  meaning: Publishing prompt-neutral task and SRD fields for profile composition.
- name: PlanInvoking
  meaning: Calling the LLM to generate an implementation plan.
- name: PlanParsing
  meaning: Parsing the LLM response as a YAML implementation plan.
- name: ReportingParseError
  meaning: Feeding an invalid plan response back to the LLM and tracking the explicit parse retry budget.
- name: IssueFormatting
  meaning: Formatting the parsed plan as tracker-neutral issue parameters.
- name: IssueBodyWriting
  meaning: Writing the issue body to the configured workspace file.
- name: IssueCreating
  meaning: Creating an issue through the tracker exec word selected by the profile.
- name: IssueRecording
  meaning: Recording the configured tracker's issue ID in planner state.
- name: QueryingRemainingWork
  meaning: Reading graph state so the machine can route ready, done, or blocked work.
- name: Completed
  meaning: Terminal. All tasks in the graph are done.
- name: Stalled
  meaning: Terminal. Remaining tasks are blocked by failed dependencies.
- name: Failed
  meaning: Terminal. An unrecoverable error occurred.
terminal_states:
- Completed
- Stalled
- Failed
signals:
- name: Seed
  trigger: Loop initialization.
- name: GraphLoaded
  trigger: The requirement graph was loaded and seeded into pipeline state.
- name: TaskExtracted
  trigger: A task was extracted from the requirement graph.
- name: FailureContextInitialized
  trigger: Empty failure context was recorded for a newly extracted task.
- name: PlannerContextProjected
  trigger: Prompt-neutral task and SRD fields were published.
- name: PromptReady
  trigger: The profile-owned planner prompt was rendered.
- name: NoTask
  trigger: Extraction found no ready task; remaining_work must classify the graph.
- name: AllDone
  trigger: All tasks in the graph are done.
- name: Blocked
  trigger: Remaining tasks are blocked by failed dependencies.
- name: ToolDone
  trigger: A tool executed successfully.
- name: LLMResponded
  trigger: The LLM returned a response.
- name: PlanReady
  trigger: The LLM response was parsed as a valid implementation plan.
- name: IssueFormatted
  trigger: Planner state was serialized as tracker-neutral issue parameters.
- name: ParseFailed
  trigger: The LLM response could not be parsed as a valid plan.
- name: BudgetExhausted
  trigger: The configured consecutive parse-error retry limit was reached.
- name: Materialized
  trigger: An issue was created from the plan.
- name: WorkRemaining
  trigger: At least one graph task is ready for extraction.
- name: CommandError
  trigger: Infrastructure-level error.
transitions:
- state: Idle
  signal: Seed
  next: Loading
  action: load_graph
- state: Loading
  signal: GraphLoaded
  next: Extracting
  action: extract_task
- state: Loading
  signal: CommandError
  next: Failed
- state: Extracting
  signal: TaskExtracted
  next: InitializingFailureContext
  action: reset_failure_context
  label: failure_context
- state: InitializingFailureContext
  signal: FailureContextInitialized
  next: Resetting
  action: reset_history
- state: InitializingFailureContext
  signal: CommandError
  next: Failed
- state: Extracting
  signal: NoTask
  next: QueryingRemainingWork
  action: remaining_work
- state: Extracting
  signal: CommandError
  next: Failed
- state: Resetting
  signal: ToolDone
  next: ProjectingPromptContext
  action: project_planner_context
  label: planner_context
- state: Resetting
  signal: CommandError
  next: Failed
- state: ProjectingPromptContext
  signal: PlannerContextProjected
  next: PromptAssembly
  action: compose_planner_prompt
- state: ProjectingPromptContext
  signal: CommandError
  next: Failed
- state: PromptAssembly
  signal: PromptReady
  next: PlanInvoking
  action: invoke_llm
- state: PromptAssembly
  signal: CommandError
  next: Failed
- state: PlanInvoking
  signal: LLMResponded
  next: PlanParsing
  action: parse_plan
- state: PlanInvoking
  signal: CommandError
  next: Failed
- state: PlanParsing
  signal: PlanReady
  next: IssueFormatting
  action: format_issue
  label: issue_input
- state: PlanParsing
  signal: ParseFailed
  next: ReportingParseError
  action: report_parse_error
- state: PlanParsing
  signal: CommandError
  next: Failed
- state: ReportingParseError
  signal: ToolDone
  next: PlanInvoking
  action: invoke_llm
- state: ReportingParseError
  signal: BudgetExhausted
  next: Failed
- state: ReportingParseError
  signal: CommandError
  next: Failed
- state: IssueFormatting
  signal: IssueFormatted
  next: IssueBodyWriting
  action: write
- state: IssueFormatting
  signal: CommandError
  next: Failed
- state: IssueBodyWriting
  signal: ToolDone
  next: IssueCreating
  action: create_tracker_issue
- state: IssueBodyWriting
  signal: ToolFailed
  next: Failed
- state: IssueBodyWriting
  signal: CommandError
  next: Failed
- state: IssueCreating
  signal: ToolDone
  next: IssueRecording
  action: record_tracker_issue
- state: IssueCreating
  signal: ToolFailed
  next: Failed
- state: IssueCreating
  signal: CommandError
  next: Failed
- state: IssueRecording
  signal: Materialized
  next: Extracting
  action: extract_task
- state: IssueRecording
  signal: CommandError
  next: Failed
- state: QueryingRemainingWork
  signal: WorkRemaining
  next: Extracting
  action: extract_task
- state: QueryingRemainingWork
  signal: AllDone
  next: Completed
- state: QueryingRemainingWork
  signal: Blocked
  next: Stalled
- state: QueryingRemainingWork
  signal: CommandError
  next: Failed
