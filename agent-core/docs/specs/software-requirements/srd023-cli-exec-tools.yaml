id: srd023-cli-exec-tools
title: CLI and Exec Tool Declarations

problem: |
  Declarative state machines need to invoke external CLIs without
  embedding those CLI details in Go code. Exec tools provide this bridge:
  YAML declares the binary, base arguments, parameter-to-argv mapping,
  working directory behavior, child environment overlay, output limits, and
  side effects. Without a focused contract for exec tools, each external
  command risks becoming a bespoke builtin instead of a reusable
  declarative capability.

  ToolDef and parameter schema contracts live in internal/tools/catalog.
  ExecBuilder and subprocess command construction live in internal/tools/exec,
  and shared undo payload helpers live in internal/tools/undo.

goals:
  - "G1": "Define the YAML contract for type: exec tool declarations."
  - G2: Define JSON Schema parameter mapping extensions used to build argv.
  - G3: Define subprocess execution, output capture, cancellation, and signal mapping.
  - G4: Define declaration includes, declaration loading, and selection behavior for exec tools.
  - G5: Clarify how exec tools differ from builtin tools.
  - G6: Define the target package ownership for exec declarations, command construction, and undo helpers.
  - G7: Let an exec parameter select a non-adjacent command-state value without changing adjacent previous-Result mapping.
  - G8: Let one exec word consume a bounded, redacted output field from a prior labelled word over stdin without authoring a shell pipeline.
  - G9: Let an exec word overlay child environment entries expanded from resolved command parameters.

requirements:
  R0:
    title: Tool authoring standard
    items:
      - R0.1: Exec tool declarations SHOULD follow cfg-tool-authoring-standard for vocabulary category, problem, goals, requirements, non-goals, output, side effects, reversibility, undo, errors, and relationships.
      - R0.2: Exec tools SHOULD model one external CLI verb; multi-step workflows SHOULD be represented by machine.yaml transitions that use multiple exec or builtin tools.

  R1:
    title: Exec declaration schema
    items:
      - R1.1: An exec tool declaration SHALL set type to exec or omit type, since exec is the default.
      - R1.2: An exec tool declaration SHALL provide name, the registry-visible tool name.
      - R1.3: An exec tool declaration SHALL provide binary, the executable name or path.
      - R1.4: An exec tool declaration MAY provide args, a base argument list prepended to every invocation.
      - R1.5: An exec tool declaration MAY provide dir, a working-directory override relative to the agent workspace.
      - R1.6: An exec tool declaration MAY provide precondition, output_cap, stdin_source, stdin_max_bytes, env, side_effects, visibility, description, and parameters.
      - R1.7: An exec tool declaration MAY provide emits, the set of Result.Signal values the command wrapper can return.
      - R1.8: An exec output contract MAY set mode to structured. Structured mode SHALL wrap the captured command result as a JSON object with output and exit_code fields. Omitted or raw mode SHALL preserve the existing raw Result.Output string.

  R2:
    title: Parameter-to-argv mapping
    items:
      - R2.1: Exec tool parameters SHALL be described with JSON Schema under parameters.properties.
      - R2.2: The flag extension SHALL map a parameter value to a named CLI flag such as --path.
      - R2.3: The positional extension SHALL append a parameter value as a positional argument.
      - R2.4: The bool_flag extension SHALL be boolean; when true and the parameter value is true, the flag value is appended without a following value.
      - R2.5: The default extension SHALL provide a parameter value when the caller omits it.
      - R2.6: CLI mapping extensions SHALL be stripped from the ToolSpec schema sent to LLMs.
      - R2.7: The position extension SHALL order mapped arguments numerically; mappings without a position SHALL follow in stable parameter-name order.
      - R2.8: A parameter property MAY declare source as one canonical $from(<label>).<dotted-path> selector (srd038 R2). When source is absent, ExecBuilder SHALL continue to read parameters.<name> from the immediately previous Result.
      - R2.9: The source extension SHALL be stripped from the ToolSpec schema sent to LLMs with the other CLI mapping extensions.
      - R2.10: Integer parameters mapped to argv SHALL retain their decimal representation so exec declarations such as list_files can enforce numeric CLI limits without changing the public JSON Schema type.
      - R2.11: A resolved parameter that declares no flag, positional, or bool_flag extension SHALL contribute no argv entry. Its value SHALL remain available to non-argv consumers such as env expansion.

  R3:
    title: Subprocess execution
    items:
      - R3.1: ExecBuilder SHALL construct argv from base args plus mapped parameter values.
      - R3.2: ExecBuilder SHALL run the command in the configured workspace directory or dir override.
      - R3.3: ExecBuilder SHALL capture stdout, stderr, exit code, elapsed duration, and execution errors.
      - R3.4: Successful exit SHALL map to ToolDone.
      - R3.5: Non-zero exit or execution failure SHALL map to ToolFailed unless the failure prevents command construction, which SHALL map to CommandError.
      - R3.6: Output SHALL be capped when output_cap is configured.
      - R3.7: Parent context cancellation SHALL stop the subprocess.
      - "R3.8": "Exec tools used as named machine actions SHOULD declare emits: [ToolDone, ToolFailed] unless they implement a more specific signal mapping."
      - R3.9: ExecBuilder SHALL defer a source selector until the command receives its CommandStateView and SHALL resolve it before subprocess launch. An unresolved label or path SHALL emit CommandError with the selector cause preserved, and the subprocess SHALL NOT run with an empty substituted value.

  R4:
    title: Declaration loading and selection
    items:
      - R4.1: Tool declaration files MAY include other declaration files with file-level includes.
      - R4.2: Included declarations SHALL load before the including file so local definitions can override shared definitions.
      - R4.3: Production startup SHOULD use LoadToolDeclarations + LoadToolSelection + SelectTools.
      - R4.4: Selected exec tools SHALL fail startup if the selected name is not declared.
      - R4.5: A source value that is not a canonical $from(<label>).<dotted-path> selector SHALL fail declaration validation before a run.

  R5:
    title: Relationship to builtin tools
    items:
      - R5.1: Exec tools SHALL represent external process capabilities described entirely by YAML.
      - R5.2: Builtin tools SHALL be used when behavior requires Go-owned state, in-process APIs, or custom command construction that cannot be represented as argv mapping.
      - R5.3: A CLI SHOULD be modeled as an exec tool before introducing a bespoke builtin wrapper.
      - R5.4: Agent subprogram invocation SHOULD use the agent CLI exec tool contract when possible.

  R6:
    title: Command-state stdin
    items:
      - R6.1: stdin_source MAY contain one canonical $from(<label>).<dotted-path> selector resolved through the injected CommandStateView and ResolveFromSelector before process launch.
      - R6.2: The selected value SHALL be a non-empty string from the prior step's redacted output object. Missing labels, missing paths, empty values, non-string values, unavailable redacted output, and malformed selectors SHALL fail before subprocess launch with CommandError or declaration-validation failure as applicable.
      - R6.3: stdin_max_bytes MAY declare a positive byte limit only when stdin_source is present. The implementation SHALL apply a finite default when omitted and SHALL reject, rather than truncate, input exceeding the effective limit before launch.
      - R6.4: One exec word SHALL still launch exactly one declared binary and argv. stdin_source SHALL NOT invoke a shell or accept a pipeline authoring surface.
      - R6.5: ExecCmd SHALL implement ContextCommand. Cancellation or timeout SHALL close the stdin pipe, terminate the process group, wait for the subprocess, and join the stdin writer before returning.
      - R6.6: Resolved stdin bytes SHALL NOT be added to trace attributes, metric attributes, or exec receipts. CommandStateView receipt blindness SHALL keep prior receipts unaddressable.
      - R6.7: Structured producer output and its redaction metadata SHALL remain selectable after checkpoint save/load. Existing argv-only declarations SHALL retain their prior execution and output behavior.

  R7:
    title: Command-state environment
    items:
      - R7.1: env MAY list KEY=VALUE strings. KEY SHALL match [A-Za-z_][A-Za-z0-9_]*. Each entry SHALL contain a KEY, an equals sign, and a non-empty VALUE. Omitted or empty env SHALL inherit the parent environment only.
      - R7.2: A VALUE MAY contain "{{ params.NAME }}" tokens. ExecCmd SHALL expand those tokens from resolved exec parameters after source resolution and before subprocess launch. Env values SHALL NOT contain $from selectors; command-state threading uses the parameter source extension (R2.8).
      - R7.3: Missing parameters, empty expanded values, malformed entries, unknown template tokens, and template names that are not declared parameters SHALL fail before launch with CommandError or declaration-validation failure as applicable. The subprocess SHALL NOT start.
      - R7.4: ExecBuilder SHALL pass expanded entries as subprocess.Spec.Env. The subprocess layer SHALL append them to os.Environ so declared keys overlay inherited ones without replacing the rest of the parent environment.
      - R7.5: Builtin ToolDefs SHALL NOT declare env. env SHALL require binary.
      - R7.6: Resolved env values SHALL NOT be added to trace attributes, metric attributes, or exec receipts.
      - R7.7: Existing argv-only and stdin-only declarations SHALL retain their prior execution and output behavior.

package_ownership:
  status: planned
  notes:
    - Exec ToolDef schema and declaration selection move to internal/tools/catalog.
    - ExecBuilder, ExecCmd, parameter extraction, argv construction, env expansion, precondition checks, output caps, and subprocess result mapping move to internal/tools/exec.
    - Exec undo memento payload helpers use internal/tools/undo.
    - internal/tools/stl exposes only thin aliases or wrappers during migration and is not the long-term exec implementation package.

declaration_layout:
  status: planned
  shared_groups:
    - tools/exec/go/
    - tools/exec/workspace/
    - tools/exec/git/
    - tools/exec/issues/
  compatibility_bundles:
    - tools/exec.yaml
    - tools/exec/all.yaml
  rules:
    - Shared groups own reusable exec identity, argv mapping, output caps, side effects, undo, and emits.
    - tools/exec.yaml remains a compatibility bundle while existing startup paths migrate.
    - tools/exec/all.yaml is the planned explicit full exec bundle.
    - Agent tools.yaml files keep selecting exec tools by name only.

non_goals:
  - Defining every external command used by the repository.
  - Defining builtin factory config validation; see srd022.
  - Defining the agent CLI itself as a child tool; see srd021.
  - Passing per-request values through a parent-written --request file.
  - Replacing the subprocess overlay of declared env onto os.Environ.

acceptance_criteria:
  - id: AC1
    criterion: Exec declarations support name, type, binary, args, dir, precondition, output_cap, optional command-state stdin, optional env overlay, raw or structured output, side_effects, visibility, description, parameters, and optional emits.
    traces: [R0.1, R0.2, R1.1, R1.2, R1.3, R1.4, R1.5, R1.6, R1.7, R1.8]

  - id: AC2
    criterion: Parameter mapping converts JSON string and integer tool parameters into deterministic argv using flag, positional, bool_flag, default, position, and optional command-state source extensions while stripping those extensions from the LLM-visible schema. Omitting source preserves immediately previous Result mapping.
    traces: [R2.1, R2.2, R2.3, R2.4, R2.5, R2.6, R2.7, R2.8, R2.9, R2.10, R2.11]

  - id: AC3
    criterion: Exec tools run subprocesses in the correct directory, capture output/exit/duration, honor output caps and cancellation, map outcomes to ToolDone, ToolFailed, or CommandError, and can declare those signals in emits. A command-state source resolves after view injection and a broken source prevents subprocess launch with CommandError.
    traces: [R3.1, R3.2, R3.3, R3.4, R3.5, R3.6, R3.7, R3.8, R3.9]

  - id: AC4
    criterion: Declaration includes and declaration+selection loading support shared exec definitions with mode-local overrides, and malformed command-state sources fail validation before a run.
    traces: [R4.1, R4.2, R4.3, R4.4, R4.5]

  - id: AC5
    criterion: Architecture guidance prefers exec tools for external CLIs and builtin tools only for in-process behavior that cannot be represented declaratively.
    traces: [R5.1, R5.2, R5.3, R5.4]

  - id: AC6
    criterion: A structured-output producer can feed a selected redacted output string to a separate consumer binary over bounded stdin; invalid input prevents launch, cancellation joins the child, persistence preserves safe selection, receipts remain isolated, and telemetry does not capture stdin.
    traces: [R1.8, R6.1, R6.2, R6.3, R6.4, R6.5, R6.6, R6.7]

  - id: AC7
    criterion: An exec word overlays KEY=VALUE environment entries expanded from resolved parameters onto the inherited parent environment; invalid or unresolved env prevents launch; telemetry and receipts omit resolved env values; argv-only and stdin-only declarations stay unchanged.
    traces: [R1.6, R7.1, R7.2, R7.3, R7.4, R7.5, R7.6, R7.7]

