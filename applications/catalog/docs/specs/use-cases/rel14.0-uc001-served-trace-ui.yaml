id: rel14.0-uc001-served-trace-ui
title: The collector serves its own trace UI at the query origin

summary: |
  An operator opens the collector's query URL in a browser and lands on the
  trace list, then clicks through to a per-trace waterfall. The UI is served by
  the collector_query server from the shipped ui/dist tree, same-origin with
  /query/*, so no separate UI workload is deployed. A collector built without
  its UI answers an explicit error rather than a blank page.

actor: Operator browsing a deployed collector, or the conformance harness

trigger: |
  The collector profile is running with its query server bound, and a client
  issues GET / (or a deep link such as /traces/{trace_id}) against the query
  origin.

flow:
  - F1: The client issues GET / against the collector_query origin; the server returns the SPA index document from the configured ui/dist root.
  - F2: The SPA loads and calls GET /query/traces on the same origin; the server returns the paginated trace summaries.
  - F3: The operator selects a trace; the client router navigates to /traces/{trace_id}.
  - F4: The client issues GET /traces/{trace_id}; the static_assets endpoint resolves the deep link to the SPA index (spa true), and the client router renders the waterfall after calling GET /query/traces/{trace_id}.
  - F5: The /query/* endpoints keep answering their JSON contracts unchanged; the static_assets catch-all never intercepts a query path.

touchpoints:
  - T1: "srd020-collector R7 -- UI served by the collector_query server via static_assets, same-origin with the query API"
  - T2: "srd020-collector R5 -- the query surface the UI reads for trace list and detail"
  - T3: "srd020-collector R6 -- the shipped ui/ SPA and its uiDist reproducibility gate"

success_criteria:
  - id: S1
    criterion: GET / on the query origin returns the SPA index with an HTML content type.
    traces:
      - srd020-collector AC4
  - id: S2
    criterion: A deep link such as GET /traces/{trace_id} resolves to the SPA index rather than a 404, so the client router can render it.
    traces:
      - srd020-collector AC4
  - id: S3
    criterion: Serving the UI leaves every /query/* response body and status unchanged.
    traces:
      - srd020-collector AC4
  - id: S4
    criterion: The UI root is a literal profile-declared path with no new environment variable; a missing UI root yields an explicit error status, not a silent empty body.
    traces:
      - srd020-collector AC5

out_of_scope:
  - The Explore/analytics UI and span-stats query routes (a later release).
  - Helm delivery of the UI to application charts (a sibling sub-issue).
  - Metrics UI or Dolt scraping.

test_suite_trace: test-rel14.0-served-ui
status: implemented
