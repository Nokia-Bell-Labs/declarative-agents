    status: planned
    evidence_type: kit_test
    implemented_by: GH-2263, GH-2264, GH-2265, GH-2266
    command: |
      mage uikit:test
    expected:
      panel_set_matches_r4_4: true
      required_endpoints_subset_of_contract: true
      no_application_imports: true
      every_panel_renders_from_fixtures: true
    traces:
      - rel15.0-uc001-declarative-ux S1
      - srd004-declarative-ux AC4

  - id: TC5
    use_case: rel15.0-uc001-declarative-ux
    name: ui.yaml version 2 validates, rejects, and renders from Helm values
    status: planned
    evidence_type: go_test
    implemented_by: GH-2270
    command: |
