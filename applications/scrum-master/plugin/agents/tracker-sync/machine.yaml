name: tracker-sync
purpose: |-
  Reconcile the tracker clone with what it pushed while offline (srd042):
  provisional pops and writes land, or are named when someone else took
  them first. Use when a person asks to sync the tracker after working
  offline.

  This machine has no model state: scrum-master tracker reconcile
  (design.md D10, D14; GH-37). The run starts in a checkout of the
  program.
configuration:
  machine: plugin/agents/tracker-sync/machine.yaml
  tools: plugin/agents/tracker-sync/tools.yaml
invariants:
- Every step is a word; no model acts anywhere in this machine
- A refusal ends the run in the state that names it, with the word's reason
lifecycle: |-
  1. Idle → Reconcile (Seed): scrum-master tracker reconcile
  2. Reconcile → Done (ToolDone)
initial_state: Idle
budget:
  command_timeout: 16m
  max_iterations: 10
states:
- name: Idle
  meaning: Initial state before the first word.
- name: Reconcile
  meaning: |
    The reconcile word: scrum-master tracker reconcile pushes what was
    written offline and names any pop someone else took first.
- name: Done
  run_status: succeeded
  meaning: |
    Terminal. Every word ran, and the last one reported what it did.
- name: Refused
  run_status: failed
  meaning: |
    Terminal. The reconcile failed, and the word's reason is the run's
    last output.
- name: Failed
  run_status: failed
  meaning: Terminal. An infrastructure error outside the words' refusals.
terminal_states:
- Done
- Refused
- Failed
signals:
- name: Seed
  trigger: Loop initialization.
- name: ToolDone
  trigger: A word executed successfully.
- name: ToolFailed
  trigger: A word reported failure — a refusal with its reason.
- name: CommandError
  trigger: Infrastructure-level error (not a tool failure).
transitions:
- state: Idle
  signal: Seed
  next: Reconcile
  action: tracker_reconcile
  summary: true
- state: Reconcile
  signal: ToolFailed
  next: Refused
- state: Reconcile
  signal: ToolDone
  next: Done
- state: Idle
  signal: CommandError
  next: Failed
- state: Reconcile
  signal: CommandError
  next: Failed
