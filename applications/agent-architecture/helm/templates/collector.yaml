{{- if .Values.collector.enabled }}
{{- $fullname := include "agent-architecture.fullname" . -}}
{{- $collectorFiles := .Files.Glob "profiles/collector/**" -}}
{{- if not $collectorFiles }}
{{- fail "no staged collector profile closure under profiles/collector; run mage helmPrepare" -}}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fullname }}-collector-profiles
  labels:
    {{- include "agent-architecture.labels" . | nindent 4 }}
    app.kubernetes.io/component: collector
data:
  {{- range $path, $_ := $collectorFiles }}
  {{ $path | trimPrefix "profiles/collector/" | replace "/" "__" }}: |-
    {{- $.Files.Get $path | nindent 4 }}
  {{- end }}
---
{{/*
The collector workload and its Service come from the shared agent-services
library (GH-2045). This chart supplies the staged profile closure it mounts and
the profile path the runtime reads; the collector serves its trace UI from the
profile directory, which the library uses as the working directory (srd020 R7,
GH-1228).
*/}}
{{- $items := list -}}
{{- range $path, $_ := $collectorFiles }}
{{- $items = append $items (dict "key" ($path | trimPrefix "profiles/collector/" | replace "/" "__") "path" ($path | trimPrefix "profiles/collector/")) -}}
{{- end }}
{{- $profilesVolume := list (dict "name" "profiles" "projected" (dict "defaultMode" 0444 "sources" (list (dict "configMap" (dict "name" (printf "%s-collector-profiles" $fullname) "items" $items))))) -}}
{{- include "agent-services.collector" (dict
      "root" .
      "profilePath" (include "agent-architecture.roleProfile" (dict "root" . "role" "collector"))
      "profilesVolume" $profilesVolume) }}
{{- end }}
