implementation_status:
  complete:
    - GH-2114 implements machine templates in the machine closure loader (R1, R2, R3), with a control-template fixture whose instance equals the control machine apart from its name; startup wiring faults name the template beside the instance. A reference left after substitution reports its line in the template; a strict-decode fault in a template body reports the line of the re-encoded body rather than the template (R2.5, partial).
    - GH-2115 extracts the serve machine shared by catalog's applier and the four chatbot-mesh serve agents into agent-core's library at tools/machines/serve-machine-template.yaml, instantiated by each through its install path.
    - >-
      GH-2116 migrates the remaining groups that were one shape: the test-
      evidence audit, lifecycle approval, and Ollama model-listing machines
      into agent-core library machines, catalog mock and rig-subject lifecycle
      into a catalog template, and the two chat-turn critics into a scenario
      template; it deletes the unselected copy of the scenario-critic machine
      under the chatbot-mesh rig. GH-2126 corrects two of its exclusions: the
      rig-subject happy-path and broken verdicts differ only in three next
      values, which are verdict parameters with a Passed/Failed enum, and the
      runtime-state-reader and monitor fixture machines were structurally
      identical apart from the profile metric label, so both pairs are
      instances now. The groups that stay hand-written each have a mechanism-
      level reason: dep-failure primes through an extra state a template
      cannot add; the rag-server query critic drives a word whose emitted
      signals differ, and a shared template would route signals its drive
      cannot emit, which the tool-emits and exhaustiveness checks reject;
      control-imports and control-types are held byte-equal to the control
      dump by srd050 AC8 and prove one mechanism each; library-one and
      library-two are the srd056 two-importer proof.
