# The profile the bench read routes run under. It shares rest.yaml with
# profile.yaml and carries nothing the host machine alone uses, so the
# host-only monitor server is not judged unused against a request's selection
# (srd050 R5, srd052 R3.1).
name: bench-request
machine: request-machine.yaml
tools: [request-tools.yaml]
tool_declarations: [request-declarations.yaml]
rest_definitions: [rest.yaml]
