# =============================================================================
# language.yaml
# Application DSL Specification — normative statements
# =============================================================================
#
# WHAT THIS FILE IS
# -----------------
# This is the machine-readable companion to the prose chapters in this
# directory. Every requirement the specification makes is a statement here,
# and nothing normative exists only in prose. The chapters cite statements
# with `{{statement <id>}}` placeholders; the render target expands each
# citation in place with a stable anchor, and the audit target fails when a
# citation does not resolve, when a statement is never cited, or when a
# statement's acceptance evidence is missing or failing.
#
# HOW TO READ EACH STATEMENT
# --------------------------
#   id          stable identifier, R-<CHAPTER TAG>-<NNN>. Identifiers are
#               never renumbered or reused; constitutions, tests, and commits
#               cite them.
#   target      which conformance target the statement binds — one of the
#               names under language.conformance_targets (chapter 01).
#   level       RFC 2119 requirement level: MUST, MUST NOT, SHOULD,
#               SHOULD NOT, or MAY.
#   statement   the normative text itself.
#   acceptance  at least one evidence entry proving the statement is checked:
#                 assertion: fixture   a document under fixtures/ with the
#                                      named check applied and an expected
#                                      verdict (valid or invalid)
#                 assertion: go_test   a named Go test that must exist and
#                                      pass, path relative to the module
#                                      root (application-dsl-spec/), where
#                                      the shared harness lives
#                 assertion: rig       a named Go test in the wider repository
#                                      (path relative to the repository root)
#                                      anchoring a runtime or population
#                                      statement; the audit verifies the
#                                      reference resolves to a declared test,
#                                      and the repository's test and
#                                      integration gates execute it
#
language:
  id: application-dsl
  title: "A Domain-Specific Language for Agents"
  version: 1.0.0
  conformance_targets:
    - document
    - processor
    - runtime
    - population

statements:
  - id: R-INTRO-001
    target: document
    level: MUST
    statement: >-
      A conforming document MUST be a single YAML document whose root node is
      a mapping.
    acceptance:
      - assertion: fixture
        path: fixtures/document/root-mapping/valid.yaml
        check: yaml_mapping
        verdict: valid
      - assertion: fixture
        path: fixtures/document/root-mapping/invalid.yaml
        check: yaml_mapping
        verdict: invalid

  - id: R-INTRO-002
    target: processor
    level: MUST
    statement: >-
      A conforming processor MUST reject a document whose root node is not a
      mapping.
    acceptance:
      - assertion: go_test
        path: magefiles/evidence_test.go
        test: TestFixtureCheckRejectsNonMappingRoot

  - id: R-MODEL-001
    target: document
    level: MUST
    statement: >-
      A machine-profile document MUST either declare both `states` and
      `transitions`, or declare neither and carry exactly one expansion
      entry.
    acceptance:
      - assertion: fixture
        path: fixtures/document/machine-expansion/body.yaml
        check: machine_expansion_shape
        verdict: valid
      - assertion: fixture
        path: fixtures/document/machine-expansion/template-instance.yaml
        check: machine_expansion_shape
        verdict: valid
      - assertion: fixture
        path: fixtures/document/machine-expansion/no-body-no-expansion.yaml
        check: machine_expansion_shape
        verdict: invalid
      - assertion: fixture
        path: fixtures/document/machine-expansion/double-expansion.yaml
        check: machine_expansion_shape
        verdict: invalid

  - id: R-LCM-001
    target: runtime
    level: MUST
    statement: >-
      A conforming runtime MUST bind an agent-instance to exactly one
      workspace at instantiation and MUST release the binding when the
      agent-instance terminates.
    acceptance:
      - assertion: rig
        path: applications/coding-agent/magefiles/integration_coding_loop_test.go
        test: TestFreshWorkspaceIsPortableAndIsolated

  - id: R-LCM-002
    target: runtime
    level: MUST
    statement: >-
      Terminating an agent-instance MUST NOT decommission its workspace; a
      later agent-instance MAY bind the same workspace and resume its
      identity.
    acceptance:
      - assertion: rig
        path: applications/coding-agent/magefiles/integration_coding_loop_test.go
        test: TestCodingLoopStagesGenerateOnceAndPreserveExactWorkspace

  - id: R-POP-001
    target: population
    level: MUST
    statement: >-
      Every agent-instance in a conforming population MUST realize an
      agent-profile that a governing application-profile names among its
      roots.
    acceptance:
      - assertion: rig
        path: applications/chatbot-mesh/magefiles/application_manifest_test.go
        test: TestApplicationManifestDeclaresExactProductionRoots

  - id: R-POP-002
    target: population
    level: MUST
    statement: >-
      In a conforming population, a deployment authority MUST rest with
      exactly one agent-profile's instances, and an agent-instance that
      decides operations MUST NOT hold the deployment authority those
      operations act through.
    acceptance:
      - assertion: rig
        path: applications/chatbot-mesh/magefiles/creator_ingest_chart_test.go
        test: TestCreatorCarriesTheIngestChromaAuthority
      - assertion: rig
        path: applications/chatbot-mesh/magefiles/provisioning_workflow_orchestrator_state_test.go
        test: TestCreatorStateReadIsProvisioningWorkflowOrchestratorFacing

  - id: R-POP-003
    target: population
    level: MUST
    statement: >-
      A workspace MUST be bound by at most one agent-instance at any time.
    acceptance:
      - assertion: rig
        path: applications/coding-agent/magefiles/integration_coding_loop_test.go
        test: TestFreshWorkspaceIsPortableAndIsolated

  - id: R-POP-004
    target: population
    level: MAY
    statement: >-
      A conforming population MAY contain orphan workspaces; a workspace with
      no bound agent-instance is a legal state that only an explicit
      decommission removes.
    acceptance:
      - assertion: rig
        path: applications/coding-agent/magefiles/integration_coding_loop_test.go
        test: TestFreshWorkspaceIsPortableAndIsolated

  - id: R-APP-001
    target: document
    level: MUST
    statement: >-
      An application-profile document MUST carry the `schema_version`,
      `application`, `ownership`, `capabilities`, and `roots` keynames, and
      every `roots` entry MUST carry `id`, `ownership`, and `source`.
    acceptance:
      - assertion: fixture
        path: fixtures/document/application-keynames/valid.yaml
        check: application_required_keynames
        verdict: valid
      - assertion: fixture
        path: fixtures/document/application-keynames/invalid.yaml
        check: application_required_keynames
        verdict: invalid

  - id: R-PROF-001
    target: document
    level: MUST
    statement: >-
      An agent-profile document MUST carry the `machine` keyname, a non-empty
      string that references the machine-profile document the agent-instance
      executes; the `name` keyname MAY accompany it, and when present MUST be
      a string.
    acceptance:
      - assertion: fixture
        path: fixtures/document/profile-keynames/valid.yaml
        check: profile_required_keynames
        verdict: valid
      - assertion: fixture
        path: fixtures/document/profile-keynames/nameless.yaml
        check: profile_required_keynames
        verdict: valid
      - assertion: fixture
        path: fixtures/document/profile-keynames/invalid.yaml
        check: profile_required_keynames
        verdict: invalid
      - assertion: rig
        path: agent-core/internal/tools/catalog/spec_pin_errata_test.go
        test: TestSpecPinProfileLoadsWithoutName
  - id: R-PROF-002
    target: document
    level: MUST NOT
    statement: >-
      An agent-profile document MUST NOT carry the `expand` keyname: an
      agent-profile is written out in full, and no expansion constructs one.
    acceptance:
      - assertion: fixture
        path: fixtures/document/profile-expansion/valid.yaml
        check: profile_admits_no_expansion
        verdict: valid
      - assertion: fixture
        path: fixtures/document/profile-expansion/invalid.yaml
        check: profile_admits_no_expansion
        verdict: invalid
      - assertion: rig
        path: agent-core/internal/tools/catalog/spec_pin_errata_test.go
        test: TestSpecPinProfileRejectsBlueprintKeynames
  - id: R-PROF-003
    target: document
    level: MUST NOT
    statement: >-
      An agent-profile document MUST NOT carry the `unit`, `params`, or
      `profile` keynames; a document carrying them is not an agent-profile
      document.
    acceptance:
      - assertion: fixture
        path: fixtures/document/blueprint-body/valid.yaml
        check: profile_carries_no_blueprint_keynames
        verdict: valid
      - assertion: fixture
        path: fixtures/document/blueprint-body/invalid.yaml
        check: profile_carries_no_blueprint_keynames
        verdict: invalid
      - assertion: rig
        path: agent-core/internal/tools/catalog/spec_pin_errata_test.go
        test: TestSpecPinProfileRejectsBlueprintKeynames
  - id: R-MACH-001
    target: document
    level: MUST
    statement: >-
      A machine-profile document that declares its own body MUST carry its
      `states` and `transitions` as sequences; the `name` keyname MAY
      accompany them, and when present MUST be a string.
    acceptance:
      - assertion: fixture
        path: fixtures/document/machine-keynames/valid.yaml
        check: machine_body_keynames
        verdict: valid
      - assertion: fixture
        path: fixtures/document/machine-keynames/nameless.yaml
        check: machine_body_keynames
        verdict: valid
      - assertion: fixture
        path: fixtures/document/machine-keynames/invalid.yaml
        check: machine_body_keynames
        verdict: invalid
      - assertion: rig
        path: agent-core/internal/runtime/core/spec_pin_errata_test.go
        test: TestSpecPinMachineBodyLoadsWithoutName
  - id: R-MACH-002
    target: document
    level: MUST
    statement: >-
      A machine-profile document that declares no body MUST carry only the
      `unit`, `name`, `purpose`, and `expand` keynames, and its expansion
      entry MUST NOT carry the `as` keyname.
    acceptance:
      - assertion: fixture
        path: fixtures/document/machine-instance-header/valid.yaml
        check: machine_instance_header
        verdict: valid
      - assertion: fixture
        path: fixtures/document/machine-instance-header/invalid.yaml
        check: machine_instance_header
        verdict: invalid
      - assertion: rig
        path: agent-core/internal/runtime/core/machine_template_test.go
        test: TestMachineInstanceCarriesOnlyItsHeader

  - id: R-MODEL-003
    target: processor
    level: MUST
    statement: >-
      A conforming processor MUST select expansion behavior by the body kind
      of each expansion target, replacing the expanding document's body for a
      `machine` body and splicing for a `stage` body, and MUST reject a
      machine-template that expands another machine-template.
    acceptance:
      - assertion: rig
        path: agent-core/internal/runtime/core/machine_template_test.go
        test: TestExpandTargetBodyKindSelectsReplaceOrSplice
      - assertion: rig
        path: agent-core/internal/runtime/core/machine_template_test.go
        test: TestMachineTemplateCannotNestOrBeLoadedAsAMachine

  - id: R-CONF-001
    target: processor
    level: MUST
    statement: >-
      A conforming processor MUST accept every fixture document whose
      declared verdict is valid and MUST reject every fixture document whose
      declared verdict is invalid.
    acceptance:
      - assertion: go_test
        path: magefiles/evidence_test.go
        test: TestRepositoryFixtureEvidencePasses

  - id: R-MODEL-002
    target: document
    level: MUST
    statement: >-
      Every expansion entry in a document MUST name its source unit under the
      fragment keyname; argument bindings MAY accompany the name under the
      args keyname.
    acceptance:
      - assertion: fixture
        path: fixtures/document/expansion-fragment/named.yaml
        check: expansion_names_fragment
        verdict: valid
      - assertion: fixture
        path: fixtures/document/expansion-fragment/unnamed.yaml
        check: expansion_names_fragment
        verdict: invalid

  - id: R-MACH-003
    target: document
    level: MUST
    statement: >-
      A machine-profile document MUST carry only the keynames `unit`, `expand`,
      `name`, `purpose`, `invariants`, `lifecycle`, `configuration`,
      `metric_labels`, `pipeline_diagram`, `view_tags`, `initial_state`,
      `summary_signal`, `resume_signal`, `states`, `terminal_states`,
      `signals`, `transitions`, `budget`, and `external_labels`; in particular
      it MUST NOT carry `imports`, because a machine-profile expands
      stage-fragments rather than importing them.
    acceptance:
      - assertion: fixture
        path: fixtures/document/machine-top-keynames/valid.yaml
        check: machine_top_keynames
        verdict: valid
      - assertion: fixture
        path: fixtures/document/machine-top-keynames/invalid.yaml
        check: machine_top_keynames
        verdict: invalid
      - assertion: rig
        path: agent-core/internal/runtime/core/spec_pin_machine_test.go
        test: TestSpecPinMachineKeynamesAreAClosedSet
      - assertion: rig
        path: agent-core/internal/runtime/core/machine_stage_test.go
        test: TestMachineImportsAreRejectedWithTheReason

  - id: R-MACH-004
    target: document
    level: MUST
    statement: >-
      Every `transitions` entry MUST carry `state`, `signal`, and `next` as
      non-empty strings, and MAY carry only `action`, `label`, `report_output`,
      `summary`, `for_each`, and `metric_labels` beside them.
    acceptance:
      - assertion: fixture
        path: fixtures/document/machine-transition-keynames/valid.yaml
        check: machine_transition_keynames
        verdict: valid
      - assertion: fixture
        path: fixtures/document/machine-transition-keynames/invalid.yaml
        check: machine_transition_keynames
        verdict: invalid
      - assertion: rig
        path: agent-core/internal/runtime/core/machine_parsing_test.go
        test: TestParseMachineSpecRejectsUnknownTransitionField

  - id: R-MACH-005
    target: document
    level: MUST
    statement: >-
      Each `states` entry MUST be either a state name or a mapping carrying
      `name` and optionally `meaning`, `run_status`, and `tags`; each `signals`
      entry MUST be either a signal name or a mapping carrying `name` and
      optionally `trigger`. The two forms MAY be mixed in one list, and a name
      MUST NOT repeat within its list.
    acceptance:
      - assertion: fixture
        path: fixtures/document/machine-named-specs/valid.yaml
        check: machine_named_specs
        verdict: valid
      - assertion: fixture
        path: fixtures/document/machine-named-specs/invalid.yaml
        check: machine_named_specs
        verdict: invalid
      - assertion: rig
        path: agent-core/internal/runtime/core/machine_parsing_test.go
        test: TestParseMachineSpec_RichStateAndSignalMetadata
      - assertion: rig
        path: agent-core/internal/runtime/core/machine_parsing_test.go
        test: TestParseMachineSpecRejectsUnknownNamedSpecFields
      - assertion: rig
        path: agent-core/internal/runtime/core/machine_parsing_test.go
        test: TestParseMachineSpecRejectsDuplicateGrammarEntries

  - id: R-MACH-006
    target: document
    level: MUST
    statement: >-
      A machine-profile body MUST declare at least one state, one terminal
      state, and one transition; `initial_state` MUST name a declared state;
      every `terminal_states` entry MUST name a declared state and appear once;
      every transition's `state` and `next` MUST name declared states and its
      `signal` a declared signal; and no two transitions MAY share the same
      `state` and `signal`.
    acceptance:
      - assertion: fixture
        path: fixtures/document/machine-graph/valid.yaml
        check: machine_graph_references
        verdict: valid
      - assertion: fixture
        path: fixtures/document/machine-graph/invalid.yaml
        check: machine_graph_references
        verdict: invalid
      - assertion: rig
        path: agent-core/internal/runtime/core/machine_parsing_test.go
        test: TestParseMachineSpecValidationErrors
      - assertion: rig
        path: agent-core/internal/runtime/core/machine_parsing_test.go
        test: TestParseMachineSpecRejectsDuplicateGrammarEntries
      - assertion: rig
        path: agent-core/internal/runtime/core/spec_pin_machine_test.go
        test: TestSpecPinMachineRequiresAWellFormedGraph

  - id: R-MACH-007
    target: document
    level: MUST
    statement: >-
      A state's `run_status`, when present, MUST be one of `succeeded`,
      `failed`, `budget_exceeded`, `cancelled`, or `suspended`, and MUST appear
      only on a state listed under `terminal_states`; every state listed under
      `terminal_states` MUST declare its `run_status`.
    acceptance:
      - assertion: fixture
        path: fixtures/document/machine-run-status/valid.yaml
        check: machine_run_status
        verdict: valid
      - assertion: fixture
        path: fixtures/document/machine-run-status/invalid.yaml
        check: machine_run_status
        verdict: invalid
      - assertion: rig
        path: agent-core/internal/runtime/core/machine_parsing_test.go
        test: TestParseMachineSpecValidatesDeclaredRunStatus
      - assertion: rig
        path: agent-core/internal/runtime/core/machine_policy_test.go
        test: TestValidateMachinePolicyRequiresResumeSignalAndIterationBudget

  - id: R-MACH-008
    target: document
    level: MUST
    statement: >-
      A machine-profile document that an agent-profile executes MUST carry
      `budget` with a positive integer `max_iterations` and a positive duration
      `command_timeout`; `budget` MAY also carry `max_tokens`, `max_duration`,
      and `max_consecutive_parse_errors`, and MUST carry no other keyname.
    acceptance:
      - assertion: fixture
        path: fixtures/document/machine-budget/valid.yaml
        check: machine_budget
        verdict: valid
      - assertion: fixture
        path: fixtures/document/machine-budget/invalid.yaml
        check: machine_budget
        verdict: invalid
      - assertion: rig
        path: agent-core/internal/runtime/core/machine_policy_test.go
        test: TestValidateMachinePolicyRequiresResumeSignalAndIterationBudget
      - assertion: rig
        path: agent-core/internal/runtime/core/machine_parsing_test.go
        test: TestParseMachineSpecRejectsInvalidRuntimePolicy
      - assertion: rig
        path: agent-core/internal/runtime/core/spec_pin_machine_test.go
        test: TestSpecPinMachineKeynamesAreAClosedSet

  - id: R-MACH-009
    target: document
    level: MUST
    statement: >-
      `summary_signal` and `resume_signal`, when present, MUST each name a
      declared signal, and a machine-profile whose `signals` declares
      `AwaitApproval` MUST carry `resume_signal`.
    acceptance:
      - assertion: fixture
        path: fixtures/document/machine-policy-signals/valid.yaml
        check: machine_policy_signals
        verdict: valid
      - assertion: fixture
        path: fixtures/document/machine-policy-signals/invalid.yaml
        check: machine_policy_signals
        verdict: invalid
      - assertion: rig
        path: agent-core/internal/runtime/core/machine_parsing_test.go
        test: TestParseMachineSpecRejectsInvalidRuntimePolicy
      - assertion: rig
        path: agent-core/internal/runtime/core/machine_policy_test.go
        test: TestValidateMachinePolicyRequiresResumeSignalAndIterationBudget

  - id: R-MACH-010
    target: processor
    level: MUST
    statement: >-
      A conforming processor MUST reject, before dispatch, a machine-profile
      whose `budget` sets `max_consecutive_parse_errors` unless the
      agent-profile selects `report_parse_error`, a `ParseFailed` transition
      runs that action, and the state it leads to routes `BudgetExhausted`.
    acceptance:
      - assertion: rig
        path: agent-core/internal/tools/catalog/parse_retry_test.go
        test: TestValidateParseRetryWiringReportsActionableProfileErrors
      - assertion: rig
        path: agent-core/internal/tools/catalog/parse_retry_test.go
        test: TestValidateParseRetryWiringRequiresExhaustionRouteFromReportDestination
      - assertion: rig
        path: agent-core/internal/tools/catalog/parse_retry_test.go
        test: TestValidateParseRetryWiringAcceptsExplicitRetryAndExhaustion

  - id: R-MACH-011
    target: document
    level: MUST
    statement: >-
      A transition's `action`, when present, MUST be a tool name or the
      dynamic-dispatch sentinel `$tool`; a transition without `action` is a
      move that runs no command. `report_output` MUST be a `$.path` selector,
      and `report_output` and a true `summary` MUST NOT appear on a transition
      without `action`.
    acceptance:
      - assertion: fixture
        path: fixtures/document/machine-action-forms/valid.yaml
        check: machine_action_forms
        verdict: valid
      - assertion: fixture
        path: fixtures/document/machine-action-forms/invalid.yaml
        check: machine_action_forms
        verdict: invalid
      - assertion: rig
        path: agent-core/internal/runtime/core/machine_parsing_test.go
        test: TestParseMachineSpecRejectsInvalidRuntimePolicy
      - assertion: rig
        path: agent-core/internal/runtime/core/machine_parsing_test.go
        test: TestParseMachineSpecDeclarativeRuntimePolicy

  - id: R-MACH-012
    target: processor
    level: MUST
    statement: >-
      A conforming processor MUST reject, before dispatch, a transition whose
      named action is not a tool the agent-profile selects; a transition
      without `action` and a `$tool` transition name no tool and are not
      subject to this check.
    acceptance:
      - assertion: rig
        path: agent-core/internal/tools/catalog/action_validation_test.go
        test: TestValidateMachineActionsRejectsUnselectedLiteralActions
      - assertion: rig
        path: agent-core/internal/tools/catalog/action_validation_test.go
        test: TestValidateMachineActionsAcceptsSelectedAndSpecialActions
      - assertion: rig
        path: agent-core/internal/runtime/core/machine_transition_test.go
        test: TestBuildTransitionTable_UnknownAction

  - id: R-MACH-013
    target: document
    level: MUST
    statement: >-
      A transition's `label` and every `external_labels` name MUST be a
      non-empty command-state label containing no dot, parenthesis, whitespace,
      or control character; transition labels MAY repeat, and `external_labels`
      names MUST NOT.
    acceptance:
      - assertion: fixture
        path: fixtures/document/machine-step-labels/valid.yaml
        check: machine_step_labels
        verdict: valid
      - assertion: fixture
        path: fixtures/document/machine-step-labels/invalid.yaml
        check: machine_step_labels
        verdict: invalid
      - assertion: rig
        path: agent-core/internal/runtime/core/spec_pin_machine_test.go
        test: TestSpecPinMachineStepLabelGrammar

  - id: R-MACH-014
    target: processor
    level: MUST
    statement: >-
      A conforming processor MUST reject, before dispatch, a
      `$from(label).path` selector in a selected tool whose label is neither a
      transition label, an executed command name, nor a runtime-seeded label of
      the machine-profile, and MUST reject one whose path the label's declared
      output type does not contain.
    acceptance:
      - assertion: rig
        path: agent-core/cmd/agent/main_tool_validation_test.go
        test: TestRuntimeStartupRejectsUnresolvedSelectorLabel
      - assertion: rig
        path: agent-core/internal/tools/catalog/selector_labels_test.go
        test: TestValidateSelectorLabelsStrictNamesEveryUnresolvedReference
      - assertion: rig
        path: agent-core/internal/tools/catalog/selector_paths_test.go
        test: TestValidateSelectorPathsStrictNamesEveryMismatch

  - id: R-MACH-015
    target: runtime
    level: MUST
    statement: >-
      A conforming runtime MUST resolve a `$from(label)` selector to the most
      recent completed step whose label or executed command name equals the
      label, scanning from newest to oldest.
    acceptance:
      - assertion: rig
        path: agent-core/internal/runtime/core/command_state_test.go
        test: TestCommandStateViewDuplicateLabelMostRecentWins
      - assertion: rig
        path: agent-core/internal/runtime/core/command_state_test.go
        test: TestCommandStateViewCommandNameFallbackAndAddressCollision

  - id: R-MACH-016
    target: document
    level: MUST
    statement: >-
      A transition carrying `for_each` MUST name an action other than `$tool`;
      `for_each.items` MUST be a `$from(label).path` selector, `for_each.as` a
      command-state label, and `for_each.continue_on` a non-empty list of
      declared signals; `abort_on` signals MUST be declared; `join.next` MUST
      name a declared state; `join.signals` MUST map `all_success`, `failed`,
      and `empty`, and MAY map `partial`, to declared signals; and when
      `join.next` is not terminal, a transition MUST route each join signal
      from it.
    acceptance:
      - assertion: fixture
        path: fixtures/document/machine-for-each-shape/valid.yaml
        check: machine_for_each_shape
        verdict: valid
      - assertion: fixture
        path: fixtures/document/machine-for-each-shape/invalid.yaml
        check: machine_for_each_shape
        verdict: invalid
      - assertion: rig
        path: agent-core/internal/runtime/core/iterator_spec_test.go
        test: TestMachineSpecForEachValidation
      - assertion: rig
        path: agent-core/internal/runtime/core/spec_pin_machine_test.go
        test: TestSpecPinForEachJoinAndFailurePolicy

  - id: R-MACH-017
    target: document
    level: MUST
    statement: >-
      `for_each.mode`, when present, MUST be `sequential` or `parallel`;
      `parallel` MUST carry a positive `max_concurrency`, which MUST NOT appear
      otherwise; `for_each.failure`, when present, MUST be `fail_fast` or
      `collect_all`; and `collect_all` MUST map `join.signals.partial`.
    acceptance:
      - assertion: fixture
        path: fixtures/document/machine-for-each-policy/valid.yaml
        check: machine_for_each_policy
        verdict: valid
      - assertion: fixture
        path: fixtures/document/machine-for-each-policy/invalid.yaml
        check: machine_for_each_policy
        verdict: invalid
      - assertion: rig
        path: agent-core/internal/runtime/core/iterator_spec_test.go
        test: TestMachineSpecForEachValidation
      - assertion: rig
        path: agent-core/internal/runtime/core/spec_pin_machine_test.go
        test: TestSpecPinForEachJoinAndFailurePolicy

  - id: R-MACH-018
    target: runtime
    level: MUST
    statement: >-
      A conforming runtime MUST dispatch each `for_each` item as its own
      command step, MUST run at most `max_concurrency` items at once in
