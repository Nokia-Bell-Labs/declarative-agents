name: recur
purpose: |-
  Close a recurring issue and open its next instance (srd013 R8): once,
  with the run's summary recorded. Use when a person asks to close this
  instance of a recurring issue.

  This machine has no model state: scrum-master issue recur (design.md
  D10, D14; GH-37). SCRUM_MASTER_PROJECT and SCRUM_MASTER_ISSUE name the recurring issue.
configuration:
  machine: plugin/agents/recur/machine.yaml
  tools: plugin/agents/recur/tools.yaml
invariants:
- Every step is a word; no model acts anywhere in this machine
- A refusal ends the run in the state that names it, with the word's reason
lifecycle: |-
  1. Idle → Recur (Seed): scrum-master issue recur
  2. Recur → Done (ToolDone)
initial_state: Idle
budget:
  command_timeout: 16m
  max_iterations: 10
states:
- name: Idle
  meaning: Initial state before the first word.
- name: Recur
  meaning: |
    The recur word: scrum-master issue recur closes the instance with its
    summary and opens the next one, finding one already open.
- name: Done
  run_status: succeeded
  meaning: |
    Terminal. Every word ran, and the last one reported what it did.
- name: Refused
  run_status: failed
  meaning: |
    Terminal. The recur was refused, and the word's reason is the run's
    last output.
- name: Failed
  run_status: failed
  meaning: Terminal. An infrastructure error outside the words' refusals.
terminal_states:
- Done
- Refused
- Failed
signals:
- name: Seed
  trigger: Loop initialization.
- name: ToolDone
  trigger: A word executed successfully.
- name: ToolFailed
  trigger: A word reported failure — a refusal with its reason.
- name: CommandError
  trigger: Infrastructure-level error (not a tool failure).
transitions:
- state: Idle
  signal: Seed
  next: Recur
  action: issue_recur
  summary: true
- state: Recur
  signal: ToolFailed
  next: Refused
- state: Recur
  signal: ToolDone
  next: Done
- state: Idle
  signal: CommandError
  next: Failed
- state: Recur
  signal: CommandError
  next: Failed
