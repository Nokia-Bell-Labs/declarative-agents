# Shapes the chatbot-mesh applier's exec words publish. ExecResult is the process
# result every agent-core exec tool returns; it is declared here rather than
# imported from agent-core because an application cannot reach another
# tree's units (srd051 R1.5).
unit: mesh-types-applier
types:
- name: ExecResult
  description: The exit status and captured output of one child process an exec word ran.
  schema:
    type: object
    properties:
      exit_code: {type: integer}
      output: {type: string}
    required: [exit_code, output]
