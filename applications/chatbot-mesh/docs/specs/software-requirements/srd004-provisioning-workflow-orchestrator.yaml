id: srd004-provisioning-workflow-orchestrator
title: Provisioning Workflow Orchestrator Agent Functional Block

role_realization_decision:
  current_actor: provisioning-workflow-orchestrator
  implemented_responsibility: Sequence an optional corpus-ingest request followed by a values rollout request through the creator and aggregate the terminal result.
  canonical_role_sub_role: Executor / Workflow Orchestrator; explicitly not Coordinator.
  retained_or_proposed_name: Use `provisioning-workflow-orchestrator`; implemented in GH-1077.
  authority_boundary: Holds no deployment API, child-process, synchronization, conflict-resolution, negotiation, or consensus authority.
  evidence: [agents/provisioning-workflow-orchestrator/request-machine.yaml, agents/provisioning-workflow-orchestrator/rest.yaml, helm/templates/provisioning-workflow-orchestrator.yaml]
  migration_impact: GH-1077 migrated profile and directory names, Helm objects and policies, SRD004 and references, integrations, packaging closure, release artifacts, and compatibility metadata together.

context: |
  The mesh control plane is two agents. The provisioning-workflow-orchestrator is the workflow
  orchestrator: the UX agent (chatbot, srd002) accomplishes a user's provisioning
  intent by delegating it to the provisioning-workflow-orchestrator, which sequences the ingestion and
  reconfiguration workflows, realizes the caller's desired mesh state (the full
  values-plane document, decided by the operator through the provisioning panel),
  and aggregates status for the provisioning panel. The implemented actor assumes
  Executor / Workflow Orchestrator. It does not currently synchronize concurrent
  workflows, resolve conflicts, negotiate, or facilitate consensus, so its bare
  `provisioning-workflow-orchestrator` name does not establish the reference-architecture Coordinator
  role. GH-1077 completed the actor and workload rename while retaining that binding.

  The provisioning-workflow-orchestrator orchestrates; the creator (srd005) acts. Every instance operation --
  creating a child ingest run, restarting a reconfigured agent, terminating an
  instance -- is a declared-client request to the creator, never a direct call to
  the deployment API or a run_agent word. The provisioning-workflow-orchestrator holds no deployment-API
  credentials and runs no instances. The reusable request runtime, monitor server,
  and REST client transport stay in agent-core; the intent endpoint mapping, the
  workflow machines, and the declared creator client stay profile-owned.

problem: |
  The provisioning surface (srd003 R4) edits deployment values and triggers
  rollouts, but a user's intent -- "add this directory as a knowledge source" --
  is a workflow, not a single values edit: it ingests corpora, realizes the
  caller's desired values, restarts affected agents, and reports progress. The mesh
  needs an agent that owns that workflow, sequences it, and aggregates its status,
  while keeping the orchestration-versus-action split and the authority boundary of
  srd003 R4 intact.
  The requirements must name the intent boundary, the ingestion and reconfiguration
  workflows, the delegation-to-creator rule, and what the provisioning-workflow-orchestrator does not do,
  separately from the agent-core request and REST runtime.

goals:
  - G1: Model the provisioning-workflow-orchestrator as a persistent workflow orchestrator that binds a user provisioning intent from the UX agent to a request-scoped workflow run.
  - G2: Sequence the ingestion workflow -- given directories and target collections, drive corpus-ingest instance requests through the creator and verify the outcomes.
  - G3: Sequence the reconfiguration workflow -- decide the values and config changes, request rollout of the affected agents through the creator, and confirm reported health.
  - G4: Keep every instance operation a declared-client request to the creator, so the provisioning-workflow-orchestrator never holds deployment-API authority or runs an instance directly.
  - G5: Aggregate per-step status and progress so the provisioning panel can render a running intent, while keeping the intent endpoint and workflow machines profile-owned.

requirements:
  R1:
    title: Provisioning-intent boundary
    items:
      - R1.1: The provisioning-workflow-orchestrator SHALL expose a machine_request intent endpoint (agent-core srd030) that binds one inbound provisioning intent from the UX agent (srd002) to one request-scoped run of a workflow machine and maps terminal signals to HTTP status.
      - R1.2: The intent endpoint SHALL accept a declared intent (add or remove a knowledge source, reconfigure a parameter) and SHALL NOT accept a host, URL, method, or credential for a running agent (srd003 R4.2 lineage, agent-core srd028 V30).
      - R1.3: The provisioning-workflow-orchestrator SHALL run a monitor server (agent-core srd033) and a control server (health + lifecycle exit), and SHALL aggregate per-step status and progress into a form the provisioning panel can render. The aggregate SHALL be readable by the panel, which polls it while a reconfiguration proceeds; the panel SHALL NOT read rollout progress from the deployment API directly (srd003 R4.4).
      - R1.4: The intent, monitor, and control server bind addresses SHALL be loopback-configurable inputs rather than agent-authored values.
      - R1.5: The intent endpoint SHALL be the panel's only provisioning intake (srd003 R4.1). No other agent SHALL expose a browser-facing provisioning surface, so an operator intent enters the mesh in one place and follows one path to the apply surface.
      - R1.6: The intent endpoint SHALL accept a values-only edit as well as an intent that names a new source to ingest. A values-plane document is replaced wholesale on apply (R3.1), so requiring source fields on every intent would make a pure reconfiguration inexpressible; an intent that does name a source SHALL still carry its collection, its directory, and the embedding family it expects. The creator judges that family against the one it ingests at and refuses a mismatch (srd005 R3.1), which it can do only if the intent states one.
  R2:
    title: Ingestion workflow
    items:
      - R2.1: Given directories and their target collections, the provisioning-workflow-orchestrator SHALL sequence one corpus-ingest instance request per directory to the creator (srd005) and collect the per-directory outcomes.
      - R2.2: The provisioning-workflow-orchestrator SHALL verify each ingested collection's count against the requested source before treating the ingestion step as complete.
      - R2.3: A failed or partial ingest SHALL be reported in the aggregated status and SHALL NOT silently advance the reconfiguration workflow.
  R3:
    title: Reconfiguration workflow
    items:
      - R3.1: The provisioning-workflow-orchestrator SHALL accept the full desired mesh state -- the complete values-plane document (the whole ragUnits list, parameters, and LLM config) -- from the intent and realize it, forwarding it unchanged as the values document the creator applies (srd006 R1.4). The desired-state decision is the operator's, made through the provisioning panel (srd002), because a values-plane list is replaced wholesale on apply and a partial patch would drop unlisted units; the provisioning-workflow-orchestrator remains the sole orchestrator of the workflow (R3.2, R3.3).
      - R3.2: The provisioning-workflow-orchestrator SHALL request rollout or restart of the affected agents from the creator (srd005) and SHALL confirm the health the creator reports before completing the intent.
      - R3.3: The provisioning-workflow-orchestrator SHALL eventually resolve conflicts between concurrent intents so two intents do not apply contradictory values, serializing or rejecting as needed. Until that behavior is implemented and evidenced, it SHALL NOT claim Coordinator / Conflict Resolver or Workflow Synchronizer.
  R4:
    title: Delegation boundary
    items:
      - R4.1: Every instance operation -- create, restart, terminate -- SHALL be a declared rest.yaml client request to the creator (srd005), never a direct deployment-API call or a run_agent word from the provisioning-workflow-orchestrator.
      - R4.2: The provisioning-workflow-orchestrator SHALL hold no deployment-API credentials and SHALL authenticate its intent endpoint apart from the chat path.
      - R4.3: All provisioning-workflow-orchestrator clients SHALL be declared rest.yaml entries; no endpoint reaches the provisioning-workflow-orchestrator from runtime input (agent-core srd028 V30).
  R5:
    title: Non-goals
    items:
      - R5.1: The provisioning-workflow-orchestrator SHALL NOT orchestrate the chat turn path (route, embed, fan-out, compose); that stays in the chatbot (srd002).
      - R5.2: The provisioning-workflow-orchestrator SHALL NOT perform agent lifecycle mechanics (template selection, instance creation, rollout execution, health probing); those are the creator (srd005).
      - R5.3: The provisioning-workflow-orchestrator SHALL NOT mutate a running agent's client registry in process; reconfiguration is a rollout (srd003 R3.3).

acceptance_criteria:
  - id: AC1
    criterion: The provisioning-workflow-orchestrator is described as a persistent workflow orchestrator with a machine_request intent endpoint from the UX agent, monitor and control servers, aggregated status, and loopback-configurable bind addresses, accepting no agent endpoint or credential.
    traces: [R1.1, R1.2, R1.3, R1.4]
  - id: AC6
    criterion: The intent endpoint is the panel's only provisioning intake, it serves the panel's status polling rather than the deployment API doing so, and it accepts a values-only edit as well as an intent naming a source to ingest.
    traces: [R1.3, R1.5, R1.6]
    tests:
      - "test-rel06.0-applier: The panel route reaches only the authorized surface"
  - id: AC2
    criterion: The ingestion workflow sequences one corpus-ingest instance request per directory through the creator, verifies collection counts, and reports partial failures without advancing.
    traces: [R2.1, R2.2, R2.3]
  - id: AC3
    criterion: The reconfiguration workflow makes the provisioning-workflow-orchestrator realize the caller's full desired mesh state as the forwarded values document, requests rollout from the creator, confirms reported health, and resolves conflicts between concurrent intents.
    traces: [R3.1, R3.2, R3.3]
  - id: AC4
    criterion: Every instance operation is a declared-client request to the creator; the provisioning-workflow-orchestrator holds no deployment-API credentials, authenticates apart from chat, and receives no endpoint from runtime input.
    traces: [R4.1, R4.2, R4.3]
  - id: AC5
    criterion: The turn-path, LCM-mechanics, and in-process-mutation non-goals are stated as SHALL NOT requirements, cross-referencing srd002, srd005, and srd003 R3.3.
    traces: [R5.1, R5.2, R5.3]

depends_on:
  - srd_id: srd002-chatbot-agent
    symbols_used: [R5]
  - srd_id: srd003-chatbot-deployment
    symbols_used: [R2, R3, R4]
  - srd_id: srd005-creator
    symbols_used: [R1, R2, R3, R4]

platform_dependencies:
  # agent-core runtime contracts this agent builds on. External references, owned
  # by agent-core, not part of this application's corpus.
  - srd_id: srd030-machine-request-rest-binding
    provider: agent-core
    symbols_used: [R1]
  - srd_id: srd033-monitor-rest-api
    provider: agent-core
    symbols_used: [R1]
  - srd_id: srd028-rest-client-tools
    provider: agent-core
    symbols_used: [V30]

implementation_status:
  implemented:
    - >-
      The provisioning-workflow-orchestrator profile (agents/provisioning-workflow-orchestrator) and its intent endpoint,
      ingestion and reconfiguration workflow machines, and declared creator
      clients. mage integration:controlPlane proves the values-only path through
      the real provisioning-workflow-orchestrator and creator against a recording fake deployment API.
      The ingest path delegates to the creator's implemented corpus-ingest child
      endpoint and checks the returned count. These paths have independent
      evidence; no live integration yet joins ingest, rollout, and a grounded turn
      from the newly added source.
  planned:
    - >-
      R3.3 concurrent-intent serialization or rejection. The shipped request
      machine contains only ingest and rollout sequencing and no lock, conflict,
      negotiation, synchronization, or consensus state; planned behavior does not
      confer a canonical Coordinator binding.

diagrams:
  requirements_trace: |
    ```mermaid
    flowchart LR
      Problem["Problem: A provisioning intent is a workflow, not one values edit"] --> Goals["Goals: Provisioning Workflow Orchestrator Agent Functional Block"]
      Goals --> R1["R1: Provisioning-intent boundary"]
      Goals --> R2["R2: Ingestion workflow"]
      Goals --> R3["R3: Reconfiguration workflow"]
      Goals --> R4["R4: Delegation boundary"]
      Goals --> R5["R5: Non-goals"]
      R1 --> AC1["AC1: intent endpoint + status aggregation, no agent endpoint"]
      R2 --> AC2["AC2: sequence ingest via creator, verify counts"]
      R3 --> AC3["AC3: sole values decision, rollout via creator, conflict resolution"]
      R4 --> AC4["AC4: every instance op delegated to the creator"]
      R5 --> AC5["AC5: not the turn path, not LCM, not in-process mutation"]
    ```
  control_plane: |
    ```mermaid
    flowchart LR
      User["User"] --> Chatbot["Chatbot (UX, srd002)"]
      Chatbot -->|provisioning intent| Provisioning Workflow Orchestrator["Provisioning Workflow Orchestrator (srd004)"]
      Provisioning Workflow Orchestrator -->|instance requests| Creator["Creator (srd005)"]
      Creator -->|values edit + rollout| DeployAPI["Deployment API (srd003 R4)"]
      Provisioning Workflow Orchestrator -->|status| Chatbot
    ```

non_goals:
  - The provisioning-workflow-orchestrator SHALL NOT orchestrate the chat turn path (route, embed, fan-out, compose); that stays
    in the chatbot (srd002).
  - The provisioning-workflow-orchestrator SHALL NOT perform agent lifecycle mechanics (template selection, instance creation,
    rollout execution, health probing); those are the creator (srd005).
  - The provisioning-workflow-orchestrator SHALL NOT mutate a running agent's client registry in process; reconfiguration is
    a rollout (srd003 R3.3).
