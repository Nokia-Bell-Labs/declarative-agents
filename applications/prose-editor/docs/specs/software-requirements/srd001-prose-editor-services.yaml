id: srd001-prose-editor-services
title: Prose Editor Services and Role Boundaries
status: specified

problem: |
  Prose Editor needs separate editing, assurance, retrieval, ingestion,
  persistence, model, publication, and advisory-analysis boundaries without
  combining authority in one actor. The topology must justify each split by
  responsibility, authority, failure, scaling, or lifecycle and must preserve
  the canonical one-agent-one-corpus RAG contract.

  A vague service inventory could let an editor publish its own output, let a
  critic mutate the candidate it evaluates, let the orchestrator upload content
  to Pangram, or let one retrieval process choose among corpora. It could also
  imply that planned profiles, machines, services, or integrations already run.
  This SRD fixes the planned service shape and role bindings while leaving all
  runtime implementation and executable evidence for later issues.

goals:
  - "G1: Define one responsibility and explicit authority for every Prose Editor actor and boundary."
  - "G2: Bind each agent actor to existing canonical roles without creating application-local roles."
  - "G3: Define lifecycle, persistence, scaling, and failure boundaries for the serial writing saga."
  - "G4: Preserve exclusive orchestrator mutation authority and exclusive critic Pangram authority."
  - "G5: Reuse three corpus-scoped read-only RAG server instances and canonical corpus-ingest behavior by reference."
  - "G6: Adopt the shared agent-core telemetry contract so every service joins one saga trace through declared flags, never environment variables."

applicability:
  release: "00.0"
  capability:
    runnable_module: planned
    managed_service: planned
    packaged: not_planned_for_release
    helm_managed: not_planned_for_release
    kind_demo: not_planned_for_release
  implementation_status: documentation_only_runtime_planned

role_bindings:
  authority: ../../../../docs/specs/semantic-models/agent-role-realizations.yaml
  rule: |
    Actor names identify Prose Editor realizations or wrappers. Role and sub-role
    IDs resolve against the shared canonical catalog and do not add roles.
  actors:
    - actor: workflow-orchestrator
      classification: role_realization
      primary_role: executor
      sub_roles: [workflow-orchestrator]
      domain: prose-editor-writing-saga
      execution_scope: service
    - actor: specialist-editor
      classification: role_realization
      primary_role: executor
      sub_roles: [change-manager]
      execution_scope: request
      stage_configurations:
        structure: {domain: document-structure}
        voice: {domain: document-voice}
        style: {domain: document-tightening}
    - actor: voice-critic
      classification: role_realization
      primary_role: critic
      sub_roles: [output-evaluator, feedback-generator]
      domain: document-assurance
      execution_scope: request
    - actor: corpus-ingest
      classification: wrapper
      inherits: corpus-ingest
      inheritance_target: applications/catalog/agents/knowledge-manager/corpus-ingest/profile.yaml
      inherited_role: knowledge-manager
      inherited_sub_roles: [ontology-manager]
      domain: prose-editor-retrieval-corpus
      execution_scope: batch
    - actor: rag-server
      classification: role_realization
      implementation_reference: applications/chatbot-mesh/agents/rag-server/profile.yaml
      primary_role: knowledge-manager
      sub_roles: [recommendation-generator]
      domain: retrieval
      execution_scope: server
      instances: [structure-rag, voice-rag, tightening-rag]

service_topology:
  agent_services:
    - actor: workflow-orchestrator
      responsibility: Coordinate one serial saga and own its durable workproducts and publication.
      lifecycle: Long-running request service with persistent per-saga state.
      persistence: Sole writer of the saga directory, immutable artifacts, manifest, and publication state.
      scaling: One active writer per saga ID; different saga IDs may execute independently.
      failure: Child, storage, or publication failure cannot replace an accepted parent and resumes or terminates under saga policy.
      authority:
        allowed:
          - Capture an allowlisted GitHub source and revision.
          - Sequence stages, retries, finalization, and idempotent publication.
          - Mutate saga workproducts and invoke constrained git and gh tools.
        prohibited:
          - Edit document content.
          - Query retrieval corpora.
          - Issue critic verdicts.
          - Write retrieval collections.
          - Invoke Pangram.
    - actor: specialist-editor
      responsibility: Transform supplied content along one configured stage dimension and return content with retrieval provenance.
      lifecycle: Request/on-demand stateless agent execution.
      persistence: No durable state and no shared-filesystem access; the response is its only output.
      scaling: Requests may scale independently while the orchestrator preserves serial saga order.
      failure: Retrieval, model, copy-risk, or validation failure returns no accepted artifact.
      stage_configurations:
        structure:
          responsibility: Restructure supplied content using section and outline evidence.
          corpus: structure-rag
          prohibited_corpora: [voice-rag, tightening-rag]
        voice:
          responsibility: Rewrite supplied content toward the selected voice using passage anchors with copy-risk detection.
          corpus: voice-rag
          prohibited_corpora: [structure-rag, tightening-rag]
        style:
          responsibility: Tighten explicit target spans using transformation-pair evidence.
          corpus: tightening-rag
          prohibited_corpora: [structure-rag, voice-rag]
      authority:
        allowed:
          - Query only the stage-bound RAG instance.
          - Invoke allowlisted Ollama models for the bounded request.
          - Return a stage-specific edit and evidence provenance.
        prohibited:
          - Mutate workproducts, Chroma, or GitHub.
          - Query a RAG instance outside the configured stage binding.
          - Issue acceptance verdicts or invoke Pangram.
    - actor: voice-critic
      responsibility: Evaluate the supplied immutable original and style candidate and return a categorized verdict and retry feedback.
      lifecycle: Request/on-demand stateless agent execution isolated from editor executions.
      persistence: No workproduct persistence; it returns verdict evidence to the orchestrator.
      scaling: Evaluations may scale independently; one verdict binds exactly one saga attempt and content hashes.
      failure: Evaluation or Pangram failure cannot become acceptance or trigger publication.
      authority:
        allowed:
          - Query the shared voice-rag instance read-only.
          - Invoke allowlisted Ollama models for bounded evaluation.
          - Invoke Pangram only after affirmative human consent.
          - Return pass, warn, or reject with responsible-stage feedback.
        prohibited:
          - Edit content or mutate workproducts, Chroma, or GitHub.
          - Query structure-rag or tightening-rag.
          - Treat Pangram output as the verdict.
    - actor: corpus-ingest
      responsibility: Parameterize and run canonical corpus-ingest for declared Prose Editor collections.
      lifecycle: On-demand administrative batch execution outside writing sagas.
      persistence: Writes only rebuildable Chroma records; trusted source corpora remain authoritative.
      scaling: Writes serialize per declared collection; independent collections may ingest independently.
      failure: A partial or failed run affects only a rebuildable index and cannot access source truth or saga workproducts.
      authority:
        allowed:
          - Read configured trusted corpus roots.
          - Invoke allowlisted embedding models.
          - Write only the declared structure, voice, or tightening collection.
        prohibited:
          - Access writing sagas or GitHub publication.
          - Edit or evaluate content.
          - Invoke Pangram.
          - Define a fork of canonical ingest behavior.
  rag_instances:
    - instance: structure-rag
      corpus_scope: structure
      clients: [specialist-editor:structure]
    - instance: voice-rag
      corpus_scope: voice
      clients: [specialist-editor:voice, voice-critic]
      sharing_rule: The critic may share this instance because both clients read the same voice corpus and neither gains mutation authority.
    - instance: tightening-rag
      corpus_scope: tightening
      clients: [specialist-editor:style]
    - common_contract:
        implementation_reference: applications/chatbot-mesh/docs/specs/software-requirements/srd001-rag-server-agent.yaml
        responsibility: Serve one configured corpus as ranked chunks and embedding metadata.
        lifecycle: Long-running read-only service with request-scoped stateless query runs.
        persistence: Reads one preloaded Chroma database and collection set; it owns no durable query state.
        scaling: Each instance scales independently from ingestion, editors, and the other corpus instances.
        failure: Unavailability fails or degrades only its bounded caller stage and cannot alter accepted artifacts.
        authority:
          allowed:
            - Accept configured vector-in retrieval requests.
            - Read its one declared Chroma corpus.
            - Return chunks, distances, record metadata, and embedding-model identity.
          prohibited:
            - Multiplex or route among structure, voice, and tightening corpora.
            - Write collection records, compose answers, edit content, or mutate saga state.
            - Invoke Pangram or GitHub.
  supporting_and_external_boundaries:
    - boundary: Chroma
      classification: infrastructure_adapter
      responsibility: Persist rebuildable embedding records and retrieval metadata for three declared corpus scopes.
      lifecycle: Long-running external supporting datastore.
      scaling: Collections may scale for ingest and query load without changing saga writers.
      failure: Loss or corruption requires corpus rebuild and cannot destroy trusted corpora or saga artifacts.
      authority: Accept collection writes only from corpus-ingest and collection reads only from the matching RAG instance.
      prohibited_authority: Source-of-truth content, saga persistence, editing, verdicts, Pangram, and publication.
    - boundary: Ollama
      classification: infrastructure_adapter
      responsibility: Serve allowlisted embedding and generation models for bounded calls.
      lifecycle: Long-running external model dependency.
      scaling: Model-serving capacity scales independently from application actors.
      failure: Timeout, unavailable model, or malformed output fails the current ingest, edit, retrieval preparation, or evaluation operation.
      authority: Execute configured model inference.
      prohibited_authority: Choose tools, endpoints, paths, refs, credentials, verdicts, workproduct mutations, or publication.
    - boundary: GitHub
      classification: external_platform
      responsibility: Host immutable source revisions and the final accepted branch, commit, and pull request.
      lifecycle: External platform reached on demand through constrained git and gh ToolDefs.
      scaling: Outside application ownership; one saga publication remains serialized and idempotent.
      failure: Fetch or publication failure is recorded for retry or escalation and cannot imply acceptance or discard local workproducts.
      authority: Perform requested source and repository operations under platform policy.
      prohibited_authority: Intermediate saga storage, document editing, critic acceptance, and Pangram consent.
    - boundary: Pangram
      classification: external_advisory_service
      responsibility: Analyze explicitly consented original and candidate uploads and return advisory evidence.
      lifecycle: Optional external dependency invoked on demand only by the voice critic.
      scaling: Outside application ownership; scans are independently bounded by timeout and request identity.
      failure: Denial of consent, timeout, or service error is explicit evidence and never silently becomes acceptance.
      authority: Analyze uploaded text and return a result.
      prohibited_authority: Determine the Prose Editor verdict, edit content, mutate saga state, or access GitHub.

requirements:
  R1:
    title: Actor topology and separation
    items:
      - id: R1.1
        text: |
          Prose Editor SHALL define workflow-orchestrator, specialist-editor
          (three stage configurations: structure, voice, style), voice-critic,
          and corpus-ingest as four planned agent actors with exactly the
          responsibilities in service_topology.agent_services.
        evidence: The four actor entries exist, have distinct responsibilities, and remain status planned at runtime.
      - id: R1.2
        text: |
          Each agent separation SHALL identify its authority, failure, scaling,
          lifecycle, and persistence boundary. A split SHALL NOT be justified
          only by a descriptive actor name.
        evidence: Every agent service entry contains lifecycle, persistence, scaling, failure, allowed authority, and prohibited authority.
      - id: R1.3
        text: |
          Child editors and the critic SHALL exchange content and provenance or
          verdict data with the orchestrator. They SHALL NOT receive a shared
          saga filesystem or workproduct mutation tools.
        evidence: Planned profile and ToolDef tests reject path-bearing or workproduct-authority request fields.
  R2:
    title: Canonical role realizations
    items:
      - id: R2.1
        text: |
          The workflow-orchestrator SHALL bind Executor / Workflow Orchestrator.
          The specialist-editor SHALL bind Executor / Change Manager with
          per-stage domains (document-structure, document-voice,
          document-tightening). The voice-critic SHALL bind Critic / Output
          Evaluator and Feedback Generator.
        evidence: Planned profiles and the shared role-realization index match role_bindings exactly.
      - id: R2.2
        text: |
          The local corpus-ingest wrapper SHALL inherit Knowledge Manager /
          Ontology Manager from the canonical catalog corpus-ingest profile. It
          SHALL reference canonical behavior rather than copy or fork it.
        evidence: The planned wrapper resolves the catalog inheritance target and contains only application-owned parameters.
      - id: R2.3
        text: |
          Each RAG instance SHALL inherit the existing rag-server Knowledge
          Manager / Recommendation Generator realization. Chroma, Ollama,
          GitHub, and Pangram SHALL remain infrastructure or external boundaries
          and SHALL NOT be assigned invented canonical roles.
        evidence: Role validation resolves only canonical IDs and excludes supporting and external boundaries from role coverage.
  R3:
    title: Exclusive mutation and advisory authority
    items:
      - id: R3.1
        text: |
          Only workflow-orchestrator SHALL mutate saga workproducts or invoke
          constrained GitHub source and publication tools. It SHALL publish only
          after critic acceptance under human policy.
        evidence: Planned authority tests deny workproduct and git/gh ToolDefs to every other actor and reject pre-acceptance publication.
      - id: R3.2
        text: |
          The specialist-editor SHALL have authority to transform only supplied
          content and return it. It SHALL NOT persist an authoritative artifact,
          publish, issue an acceptance verdict, or invoke Pangram.
        evidence: Planned profile-closure tests expose no workproduct, GitHub, verdict, or Pangram words to editor profiles.
      - id: R3.3
        text: |
          Only voice-critic SHALL invoke Pangram, and only after affirmative
          human upload consent. The critic SHALL NOT edit content, mutate
          workproducts, or invoke GitHub publication.
        evidence: Planned consent and authority tests cover allowed, denied, absent, timeout, and unauthorized invocation paths.
      - id: R3.4
        text: |
          Pangram results SHALL be advisory evidence. They SHALL NOT alone
          determine pass, warn, or reject.
        evidence: Planned critic tests require independent semantic, structure, voice, tightening, unsupported-addition, and copy-risk evidence.
  R4:
    title: Corpus-scoped retrieval and ingestion
    items:
      - id: R4.1
        text: |
          Prose Editor SHALL use exactly three long-running read-only RAG server
          instances: structure-rag, voice-rag, and tightening-rag. Each instance
          SHALL serve exactly one configured corpus and SHALL NOT multiplex,
          select, or route among corpora.
        evidence: Planned topology and startup validation pin one database, collection set, and embedding model to each instance.
      - id: R4.2
        text: |
          specialist-editor:structure SHALL query only structure-rag,
          specialist-editor:voice SHALL query only voice-rag, and
          specialist-editor:style SHALL query only tightening-rag.
          voice-critic MAY share voice-rag read-only.
        evidence: Planned endpoint allowlists and negative tests enforce the client matrix in service_topology.rag_instances.
      - id: R4.3
        text: |
          RAG queries SHALL use the canonical vector-in request and ranked-chunk
          response contract, including embedding-model metadata. RAG instances
          SHALL NOT ingest records, compose answers, or keep durable query state.
        evidence: Planned contract tests cite chatbot-mesh srd001 AC2 through AC4 for each configured instance.
      - id: R4.4
        text: |
          Only corpus-ingest SHALL write the three declared Chroma collection
          scopes. Trusted source corpora SHALL remain authoritative, and Chroma
          indexes SHALL remain rebuildable.
        evidence: Planned authority and recovery tests reject RAG and editor writes and rebuild each collection from its declared source.
  R5:
    title: Lifecycle, scaling, and failure behavior
    items:
      - id: R5.1
        text: |
          workflow-orchestrator and the three RAG instances SHALL be planned
          long-running managed services. The specialist-editor (all stages) and
          voice-critic SHALL execute per request. corpus-ingest SHALL execute as an on-demand
          administrative batch outside a writing saga.
        evidence: Planned profiles, service declarations, and lifecycle tests match each declared lifecycle.
      - id: R5.2
        text: |
          Every long-running application-owned service SHALL cite shared managed
          service R1 through R3 for start, readiness, liveness, finite stop,
          declared authority, telemetry, and configuration validation.
        evidence: Future service implementation and tests trace applications srd002 AC1 through AC3.
      - id: R5.3
        text: |
          One orchestrator writer SHALL own each saga ID. Stateless child
          requests and corpus-scoped RAG query capacity MAY scale independently
          only while that single-writer and serial-stage invariant remains true.
        evidence: Planned concurrency tests reject duplicate saga writers and preserve stage ordering under parallel unrelated requests.
      - id: R5.4
        text: |
          A child, RAG, Chroma, Ollama, GitHub, or Pangram failure SHALL be
          attributed to its boundary and SHALL NOT overwrite an accepted parent,
          silently accept a candidate, or grant authority to another actor.
        evidence: Planned failure tests preserve hashes and authority closure across representative dependency failures.
  R6:
    title: Boundary interfaces and configuration
    items:
      - id: R6.1
        text: |
          A human SHALL supply repository and revision intent, target voice,
          retry and publication policy, and Pangram consent. The human retains
          intent, policy, privacy, exception, and accountability authority.
        evidence: Planned request schema and use case identify required human inputs and decision points.
      - id: R6.2
        text: |
          Service endpoints, corpus identities, model names, filesystem roots,
          credentials, and publication destinations SHALL come from validated
          profile or application configuration. Model output and request content
          SHALL NOT create or widen that authority.
        evidence: Planned startup and request tests reject missing, conflicting, and authority-bearing runtime inputs.
      - id: R6.3
        text: |
          GitHub SHALL be accessed only through orchestrator-owned constrained
          git and gh ToolDefs. Prose Editor SHALL NOT define GitHub as an
          application-owned service implementation or expose arbitrary shell.
        evidence: Planned tool declarations allowlist operations and arguments and expose no generic shell word.
      - id: R6.4
        text: |
          Remote requests SHALL preserve saga, stage, attempt, content-hash, and
          trace identity where applicable and SHALL return bounded diagnostics
          without credentials or source content leakage.
        evidence: Planned integration tests inspect trace continuity, correlation fields, and redaction.
  R7:
    title: Specification and implementation status
    items:
      - id: R7.1
        text: |
          This SRD SHALL remain a specification of planned behavior. It SHALL
          NOT claim profiles, machines, ToolDefs, services, packages,
          deployments, tests, or runtime conformance before executable evidence
          exists.
        evidence: Architecture, specification index, and roadmap report srd001 as specified while runtime surfaces remain planned or not implemented.
      - id: R7.2
        text: |
          Prose Editor SHALL cite the shared application module, managed-service,
          role-realization, RAG, and agent-core runtime contracts by reference
          and SHALL define only application topology and stricter local
          authority.
        evidence: related_documents names each authority and local requirements do not reproduce its full platform contract.
  R8:
    title: Telemetry contract
    items:
      - id: R8.1
        text: |
          Every planned Prose Editor service SHALL accept the agent-core
          standard telemetry flags --otel-log-file, --otel-parent-span,
          --otel-otlp-endpoint, and --otel-service-name (agent-core srd018 R1,
          R7). Telemetry configuration SHALL come only from declared flags and
          validated profile or deployment values, never from environment
          variables.
        evidence: Planned startup tests accept the four flags on every service and reject environment-variable telemetry configuration.
      - id: R8.2
        text: |
          The orchestrator SHALL invoke specialist-editor stages and the
          voice-critic with propagated trace context and telemetry destination
          built through PropagateArgs, so each child joins the saga trace via
          the W3C traceparent under its own declared service name (agent-core
          srd018 R2.5 and R7.3, srd016 traceparent format).
        evidence: Planned integration tests assert connected parent and child spans and per-role service.name values across one saga trace.
      - id: R8.3
        text: |
          Services SHALL emit machine, tool, and model spans through the
          agent-core runtime, including GenAI semantic-convention spans for
          Ollama calls. No Prose Editor service SHALL wire a per-service OTel
          SDK.
        evidence: Planned span inspection finds agent-core-emitted GenAI spans and no application-local exporter or SDK setup.

non_goals:
  - Implement profiles, machines, ToolDefs, services, packages, deployments, or tests.
  - Define detailed workproduct, retry, or publication state; srd002 owns that behavior.
  - Define the writing-agent ToolDef vocabulary; srd003 owns those words.
  - Define editor, critic, or orchestrator state machines; srd004, srd005, and srd008 own them.
  - Fork canonical corpus-ingest or change its reusable loading behavior.
  - Create one RAG service that multiplexes structure, voice, and tightening corpora.
  - Assign canonical roles to Chroma, Ollama, GitHub, Pangram, deployment forms, or model choices.
  - Claim packaged, Helm-managed, kind-demo, or executable release capability.

acceptance_criteria:
  - id: AC1
    criterion: |
      All four agent actors (specialist-editor with three stage configurations)
      have one responsibility and explicit authority, persistence, lifecycle,
      scaling, and failure boundaries; child agents receive no shared saga
      filesystem.
    traces: [R1.1, R1.2, R1.3]
  - id: AC2
    criterion: |
      Every agent role binding resolves to the shared canonical role model,
      canonical wrappers and realizations are reused by reference, and no
      supporting or external boundary invents a role.
    traces: [R2.1, R2.2, R2.3]
  - id: AC3
    criterion: |
      Only the orchestrator can mutate workproducts or GitHub, only the critic
      can invoke consent-gated Pangram, editors cannot publish or accept their
      output, and Pangram remains advisory.
    traces: [R3.1, R3.2, R3.3, R3.4]
  - id: AC4
    criterion: |
      Three read-only corpus-scoped RAG instances serve structure, voice, and
      tightening without multiplexing; the critic may share voice-rag, and only
      canonical corpus-ingest writes rebuildable Chroma indexes.
    traces: [R4.1, R4.2, R4.3, R4.4]
  - id: AC5
    criterion: |
      Long-running, request, and batch lifecycles are explicit; scaling
      preserves one saga writer and serial stages; dependency failures preserve
      accepted artifacts and authority.
    traces: [R5.1, R5.2, R5.3, R5.4]
  - id: AC6
    criterion: |
      Human policy, configuration authority, constrained GitHub access, and
      remote correlation and redaction boundaries are explicit and checkable.
    traces: [R6.1, R6.2, R6.3, R6.4]
  - id: AC7
    criterion: |
      Indexes report this SRD as specified while every runtime surface remains
      planned, and shared contracts remain external references.
    traces: [R7.1, R7.2]
  - id: AC8
    criterion: |
      Every service accepts the four standard telemetry flags with no
      environment-variable configuration, children join the saga trace through
      PropagateArgs traceparent propagation under distinct service names, and
      spans are emitted only through the agent-core runtime.
    traces: [R8.1, R8.2, R8.3]

