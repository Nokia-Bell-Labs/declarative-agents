# Fixture for R-MACH-014: summary_signal names a declared signal, and the approval
# machine declares the resume signal it suspends for.
kind: machine
schema_version: 1
name: worker
initial_state: Idle
summary_signal: Worked
resume_signal: Approved
budget: {command_timeout: 1m, max_iterations: 10}
terminal_states: [Done, Failed]
states:
  - {name: Idle, meaning: Waiting for work.}
  - {name: Working, meaning: Doing the work.}
  - {name: Done, meaning: Work finished., run_status: succeeded}
  - {name: Failed, meaning: Work failed., run_status: failed}
signals:
  - {name: Seed, trigger: A caller hands work over.}
  - {name: Worked, trigger: The work is done.}
  - {name: CommandError, trigger: A word failed.}
  - {name: AwaitApproval, trigger: The machine suspends for an operator.}
  - {name: Approved, trigger: The operator approved.}
transitions:
  - {state: Idle, signal: Seed, next: Working, action: work, label: result}
  - {state: Working, signal: Worked, next: Done}
  - {state: Working, signal: CommandError, next: Failed}
  - {state: Working, signal: AwaitApproval, next: Working}
  - {state: Working, signal: Approved, next: Done}
