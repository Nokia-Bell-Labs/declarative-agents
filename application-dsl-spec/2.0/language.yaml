        check: blueprint_body_shape
        verdict: invalid

  - id: R-PROF-004
    target: processor
    level: MUST
    statement: >-
      For each channel an agent service consumes, a conforming processor
      MUST give the agent's machines the channel's arrival, decided by the
      agent service's side of the wiring rather than by any channel
      attribute. A dialing consumer takes items with a receive tool for the
      channel, emitting `Received` with the item or `Empty` after a bounded
      wait, which some machine in the agent's closure MUST call. A listening
      consumer of a direct or `push-pull` channel takes them with that
      receive tool when some machine in its closure calls it; otherwise, as
      the listening replier of a `request-reply` channel always does, it
      takes each item as a signal named for the channel, which the machine
      MUST declare and handle in its initial state, where an arrival starts
      a run. A machine MUST NOT call a receive tool for a channel its agent
      service does not consume. It MUST refuse an agent that breaks any of
      these rules, naming the agent service, the channel, and the signal and
      state where they apply, both when the agent starts and when its
      configuration is validated.
    acceptance:
      - assertion: pending
        note: >-
          No test in this repository anchors this statement; the engine in
          this repository implements the 1.0 language.

  - id: R-PROF-005
    target: specification
    level: MUST
    statement: >-
      An agent-profile specification MAY carry `action_channels`, a
      sequence of entries that each move one action off its implied
      transport. Each entry MUST carry `action` and `transport`, one of
      `function` (in the engine's process), `process` (a child process or
      child agent), or a network transport, `rest`, `ws`, or `udp`. A
      network entry MUST name under `channel` the channel that carries the
      action; a local entry MUST NOT name a channel and MAY carry
      `policy.rate_limit`, written as for a channel (R-APP-010). An action
      MUST appear in at most one entry, and an action no entry names keeps
      its implied transport.
    acceptance:
      - assertion: fixture
        path: fixtures/specification/profile-action-channels/valid.yaml
        check: profile_action_channels
        verdict: valid
      - assertion: fixture
        path: fixtures/specification/profile-action-channels/network-without-channel.yaml
        check: profile_action_channels
        verdict: invalid
      - assertion: fixture
        path: fixtures/specification/profile-action-channels/local-with-channel.yaml
        check: profile_action_channels
        verdict: invalid
      - assertion: fixture
        path: fixtures/specification/profile-action-channels/duplicate-action.yaml
        check: profile_action_channels
        verdict: invalid
      - assertion: fixture
        path: fixtures/specification/profile-action-channels/unknown-transport.yaml
        check: profile_action_channels
        verdict: invalid
      - assertion: pending
        note: >-
          No test in this repository anchors this statement; the engine in
          this repository implements the 1.0 language.

  - id: R-PROF-006
    target: processor
    level: MUST
    statement: >-
      The initiating half of an exchange is an action in the profile
      (`action_channels`); the completing half of an exchange another agent
      service initiated stays an engine word. A conforming processor MUST
      refuse an agent whose closure selects a synthesized word that opens an
      exchange, `request_`, `send_`, `publish_`, or `survey_` followed by a
      channel id, naming the word, the channel, and the `action_channels`
      entry that replaces it. The completing-side `receive_` and `respond_`
      words remain. `reply_` is retired, since a listener run answers with
      its outcome (R-MODEL-006), and a processor MUST refuse a machine that
      calls it.
    acceptance:
      - assertion: pending
        note: >-
          No test in this repository anchors this statement; the engine in
          this repository implements the 1.0 language.

  - id: R-MACH-001
    target: specification
    level: MUST
    statement: >-
      A machine specification that declares its own body MUST carry the
      `name` keyname, and its `states` and `transitions` MUST be sequences.
    acceptance:
      - assertion: fixture
        path: fixtures/specification/machine-keynames/valid.yaml
        check: machine_body_keynames
        verdict: valid
      - assertion: fixture
        path: fixtures/specification/machine-keynames/invalid.yaml
        check: machine_body_keynames
        verdict: invalid

  - id: R-MACH-002
    status: retired
    retired: >-
      The 2.0 revision replaced the
      template instance with adoption: a machine with no states of its own
      composes one template whole. Replaced by R-MODEL-001.
    target: specification
    level: MUST
    statement: >-
      A machine-profile specification that declares no body MUST carry only the
      `unit`, `name`, `purpose`, and `expand` keynames, and its expansion
      entry MUST NOT carry the `as` keyname.
    acceptance:
      - assertion: fixture
        path: fixtures/retired/machine-instance-header/valid.yaml
