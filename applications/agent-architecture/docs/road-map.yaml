id: agent-architecture-roadmap
title: Agent Architecture Application Road Map

overview: |
  Release 00.0 establishes the standalone guided demo. Release 01.0 adds
  trace collection through the canonical collector agent so the presenter can
  show the trace waterfall as part of the demo story. Both releases reference
  the canonical catalog profiles, pin the Go present tool, and provide
  deterministic Mage evidence, extending shared srd001 and srd002 R1 through R3
  by reference. Releases 02.0 and 03.0 provide the implemented Kubernetes deployment: a
  chart running the documentation-curator and the collector from mounted
  catalog-owned closures, a values schema, and a bounded kind smoke, citing
  srd002 R4 through R6 and the application-owned srd001-helm-deployment. Release
  04.0 provides the implemented standalone declarative applier
  (srd002-applier). The package, render, bounded kind, and applier integration
  targets are checked in; live execution remains prerequisite-gated.

releases:
  - version: "00.0"
    name: Guided Knowledge Manager presentation
    description: |
      An operator serves the slide deck, launches the canonical
      documentation-curator from an explicit catalog root, opens its
      catalog-owned browser interface, and requests clean shutdown through the
      catalog-owned declarative lifecycle-exit client. The application
      reports composition only and contributes no canonical agents.
    status: partial
    capabilities:
      - id: runnable_module
        status: implemented
      - id: managed_service
        status: partial
        services: [documentation-curator, Go present]
        live_observation_status: dependency_gated
      - id: packaged
        status: implemented
        realized_in: "02.0"
      - id: helm_managed
        status: implemented
        realized_in: "02.0"
      - id: kind_demo
        status: implemented
        realized_in: "03.0"
    shared_requirements:
      - owner: applications
        id: srd001-application-module-contract
        requirements: [R1, R2, R3, R4, R5, R6]
      - owner: applications
        id: srd002-managed-application-services
        requirements: [R1, R2, R3]
    external_requirements:
      - owner: applications/catalog
        id: srd011-knowledge-manager
      - owner: applications/catalog
        id: rel07.0-uc001-documentation-curator-profile-ux
    use_cases:
      - id: rel00.0-uc001-guided-agent-architecture
        summary: An operator serves the deck, starts the canonical curator, opens its UI, and exits it declaratively.
        status: partial
        live_observation_status: dependency_gated
    test_suites:
      - id: test-rel00.0-guided-agent-architecture
        summary: Deterministic command and contract tests plus dependency-gated launch and exit evidence.
        status: partial
        live_observation_status: dependency_gated
    evidence:
      - command: go test ./magefiles
        proves: Exact run and presentation commands, working directories, root resolution, trace reciprocity, and failure messages.
      - command: mage run
        status: dependency_gated
        proves_when_run: The canonical catalog profile starts through agent-core with explicit profile, directory, and development core-root arguments.
      - command: mage presentation
        status: dependency_gated
        proves_when_run: The pinned Go present tool serves agent-architecture.slide from the application root.
      - command: mage audit
        proves: Required documents, reciprocal traces, portable paths, canonical references, and stale-path exclusions satisfy the application contract.
      - command: mage stats
        proves: Valid composition-only JSON reports agents_contributed as zero and omits an agents section.
      - command: mage audit
        working_directory: repository root
        evidence_path: magefiles/build.go auditParticipants and magefiles/example_modules_test.go TestApplicationModulesParticipateInAudit
        proves: Root audit dispatches applications/agent-architecture.
      - command: mage test
        working_directory: repository root
        evidence_path: magefiles/example_modules_test.go TestTestSubModulesDispatchesApplicationModules
        proves: Root tests dispatch the demo's Go tests.
      - command: mage stats
        working_directory: repository root
        evidence_path: magefiles/build.go statsParticipants and magefiles/stats_test.go TestSumAgentsTotals
        proves: Root stats accepts the composition-only application section without double-counting the curator.
      - command: go test ./magefiles -run '^Test(ApplicationModulesParticipateInAudit|KnowledgeManager|Orchestration|ReleaseTags|StatsParticipants|SumAgentsTotals|TestSubModulesDispatchesApplicationModules)'
        working_directory: repository root
        evidence_path: magefiles/example_modules_test.go, magefiles/stats_test.go, and magefiles/tag_test.go
        proves: Stable root audit, test, stats, and release participation.
    evidence_boundary: |
      Checked-in deterministic tests prove command construction, configuration,
      traceability, accounting, and root dispatch. They do not prove live
      startup, browser rendering, role readiness, liveness, representative
      failure, diagnostics, telemetry, shutdown, in-flight handling, or listener
      release. Those observations remain dependency_gated on available ports, a
      buildable agent-core checkout, and operator execution. Until they run,
      srd002 AC1 through AC3 and the aggregate managed-service, use-case, suite,
      and release statuses remain partial.
  - version: "01.0"
    name: Demo trace collection
    description: |
      The demo launch path starts the canonical collector agent in spool mode
      before the documentation-curator, exports OTLP traces from the curator
      to the local collector, and stops the collector cleanly via its control
      exit route after the curator terminates. The presenter opens the collector
      query surface to show the trace waterfall.
    status: implemented
    use_cases:
      - id: rel01.0-uc001-demo-trace-collection
        summary: The demo run starts the collector, exports curator traces, and stops the collector cleanly.
        status: implemented
    test_suites:
      - id: test-rel01.0-demo-trace-collection
        summary: Deterministic tracing toggle, collector command, and curator OTLP flag tests.
        status: implemented
    evidence:
      - command: go test ./magefiles -run '^TestTracingEnabled'
        proves: Tracing is on by default and disabled by tracing:false in demo.yaml.
      - command: go test ./magefiles -run '^TestCollectorCommand'
        proves: Collector command targets the canonical profile with correct env and ports.
      - command: go test ./magefiles -run '^TestTracedCurator'
        proves: Curator receives OTLP endpoint and service name flags.
  - version: "02.0"
    name: Packaged chart render and validation
    description: |
      A chart runs the documentation-curator and the collector as persistent
      Kubernetes workloads from mounted catalog-owned profile closures. A mage
      preparation target stages and checksum-validates the closures, a
      values.schema.json and template guards own the deployment values, and a
      package target emits one self-contained archive that lints and renders
      without a source checkout. The chart deploys canonical profiles by
      reference and copies neither canonical implementation. Oversized curator UI
      assets are provisioned out-of-release from manifest-declared catalog roots;
      the collector UI remains in its bounded role package.
    status: implemented
    capabilities:
      - id: packaged
        status: implemented
      - id: helm_managed
        status: implemented
    shared_requirements:
      - owner: applications
        id: srd002-managed-application-services
        requirements: [R4, R5]
    application_srds:
      - srd001-helm-deployment
    external_requirements:
      - owner: applications/catalog
        id: srd011-knowledge-manager
    use_cases:
      - id: rel02.0-uc001-render-packaged-chart
        summary: An operator prepares the catalog-owned closures and renders and validates the packaged chart.
        status: implemented
    test_suites:
      - id: test-rel02.0-render-packaged-chart
        summary: Topology render, manifest-derived closure and checksum, values schema and guards, and self-contained archive evidence.
        status: implemented
    evidence:
      - command: go test ./magefiles
        proves: Manifest mutations control package output, undeclared roots fail, prepared provenance validates, and package/render/UI/applier guards pass.
      - command: mage helm:package
        proves: The manifest-derived self-contained chart archive lints and renders.
  - version: "03.0"
    name: Live Helm smoke
    description: |
      A bounded kind target installs only the validated archive, builds and loads
      the runtime image the chart references, and mounts the packaged
      curator and collector closures. The curator and collector Deployments and
      their real lifecycle health endpoints become ready, the curator serves its
      documentation interface, a declarative lifecycle-exit request stops the
      curator cleanly, and the collector retains a trace the curator exported. The
      target skips on missing prerequisites and cleans up on every terminal path.
      The target is checked in and skips truthfully when a required live
      prerequisite is unavailable.
    status: implemented
    capabilities:
      - id: kind_demo
        status: implemented
    shared_requirements:
      - owner: applications
        id: srd002-managed-application-services
        requirements: [R6]
    application_srds:
      - srd001-helm-deployment
    use_cases:
      - id: rel03.0-uc001-live-helm-smoke
        summary: A developer proves the packaged topology on a disposable kind cluster.
        status: implemented
    test_suites:
      - id: test-rel03.0-live-helm-smoke
        summary: Packaged-archive install, real readiness and clean exit, retained trace, and skip and cleanup evidence.
        status: implemented
    evidence:
      - command: mage integration:helmSmoke
        proves: The bounded prerequisite-gated kind workflow installs the archive, observes workloads and lifecycle exit, and cleans up.
      - command: go test ./magefiles -run '^Test(SelectCuratorPod|CuratorShutdownObserved)$'
        proves: Deterministic pod selection and clean lifecycle termination classification.
  - version: "04.0"
    name: Declarative applier agent
    description: |
      A standalone declarative applier actuates the chart. An authorized operator
      or CI caller submits a decided values-plane patch to the applier's apply
      endpoint; the applier validates it against the chart's values.schema.json by
      a helm dry-run, applies it with helm upgrade --reuse-values returning
      without waiting, verifies the curator and collector Deployments via kubectl
      rollout status, rolls back on a verify stall, and reports an apply-command
      failure as failed. The applier alone holds helm and kubectl bound as exec
      tools, the curator and collector carry none, and its apply surface is
      network-gated off the serving pods. The Agent Architecture runs no control
      plane, so there is no creator, orchestrator, or panel; the applier image
      carrying the CLIs is a recorded divergence from the profile-free image
      contract. The profile, chart resources, recording-fake tracer, schema
      tests, and prerequisite-gated live target are checked in. The applier stays
      application-local pending GH-1420.
    status: implemented
    application_srds:
      - srd002-applier
    use_cases:
      - id: rel04.0-uc001-declarative-applier
        summary: An operator or CI caller submits a decided values patch that the applier validates, applies, verifies, and rolls back on failure.
        status: implemented
    test_suites:
      - id: test-rel04.0-declarative-applier
        summary: Recording-fake terminal coverage, real chart-schema rejection, applier-only CLI authority, broken-read classification, and a live on-cluster rollout and rollback target.
        status: implemented
    evidence:
      - command: go test ./magefiles -run '^TestApplier'
        proves: Local applier machine, schema, render, authority, rollout, and bounded infrastructure contracts.
      - command: mage integration:applier
        proves: Recording fakes drive every declared terminal and enforce values-plane authority.
      - command: mage integration:applierLive
        proves: The prerequisite-gated kind target exercises real upgrade, verification, rollback, and schema rejection.

  - version: "99.0"
    name: Fleet observer adoption
    description: |
      Adopt the catalog-owned observer family (catalog srd021-observer,
      monitor/fleet-observer) as an agent-architecture workload pointed at this
      application's release label selector and namespace, giving the curator and
      collector topology a fleet view without forking the profile. Unscheduled;
      specification of the catalog family lands first (GH-1247). No new
      environment variables.
    status: planned
    planned_work:
      - id: gh-1247
        summary: Specify the cross-application observer family this application adopts.
        status: planned
