        check: profile_closure
        verdict: invalid
      - assertion: fixture
        path: fixtures/specification/profile-closure/reserved-root.yaml
        check: profile_closure
        verdict: invalid

  - id: R-TOOL-007
    target: specification
    level: MUST
    statement: >-
      A tool's contract MAY declare `side_effects`, entries naming a
      `kind` of effect (such as `filesystem_write`, `external_api`, or
      `child_process`), its `target`, and a description; `reversibility`,
      whose `classification` MUST be `reversible`, `compensatable`, or
      `irreversible`; and `undo`, whose `strategy` MUST be one the engine
      runs (`noop`, `conversation_truncate`, `file_snapshot_restore`,
      `workspace_restore`, `compensating_action`, `child_command_undo`, or
      `irreversible`), with the `captures` and `requires` its reversal
      reads. An `exec` tool's strategy MUST be `noop`, `workspace_restore`,
      `compensating_action`, or `irreversible`, the ones the shared exec
      interpreter runs.
    acceptance:
      - assertion: fixture
        path: fixtures/specification/tool-contract/valid.yaml
        check: tool_contract
        verdict: valid
      - assertion: fixture
        path: fixtures/specification/tool-contract/unknown-classification.yaml
        check: tool_contract
        verdict: invalid
      - assertion: fixture
        path: fixtures/specification/tool-contract/unknown-strategy.yaml
        check: tool_contract
        verdict: invalid
      - assertion: fixture
