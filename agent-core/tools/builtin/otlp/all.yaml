  category: boundary
  visibility: internal
  signature:
    emits: [MetricRetrieved, CommandError]
  description: Read one bounded page of spooled records for one metric name from the NDJSON metric spool.
  parameters: {type: object, properties: {}}
  output:
    description: One bounded page of spooled records for one metric name; total reports all matching records.
    schema:
      type: object
      properties:
        metric_name: {type: string}
        records:
          type: array
          items:
            type: object
            properties:
              name: {type: string}
              type: {type: string}
              unit: {type: string}
              data_point_count: {type: integer}
              service: {type: string}
              resource:
                type: array
                items: {type: object}
              metric: {type: object}
        record_count: {type: integer}
        page_record_count: {type: integer}
        total: {type: integer}
        data_point_count: {type: integer}
        offset: {type: integer}
        page_size: {type: integer}
