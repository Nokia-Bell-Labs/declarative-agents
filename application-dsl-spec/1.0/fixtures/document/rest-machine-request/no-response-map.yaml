# Fixture for R-REST-008: a machine_request endpoint with neither terminal_states nor terminal_signals.
rest:
  version: v1
  servers:
    docs:
      address: 127.0.0.1:0
      endpoints:
        answer:
          method: POST
          path: /answer
          binding: machine_request
          machine_request:
            machine: answer-machine.yaml
            timeout: 30s
