tools:
- name: otlp_receiver_launch
  type: builtin
  init: otlp_receiver_launch
  category: boundary
  visibility: internal
  emits: [ReceiverLaunched, CommandError]
  description: Bind a declared OTLP/gRPC receiver for trace and metric exports and return without waiting for traffic.
  problem: A machine cannot own telemetry-ingress lifecycle unless listener launch is an explicit word.
  goals:
  - Bind one named receiver with bounded trace and metric queues.
  - Keep the launch-to-await transition visible in MachineSpec.
  requirements:
    input:
    - Receiver name, address, queue capacity, overflow policy, and shutdown policy come from trusted config.
    output:
    - Output reports receiver, bound address, queue capacity, and overflow policy.
    side_effects:
    - Opens a network listener and registers receiver state.
    errors:
    - Invalid config, duplicate live name, or bind failure emits CommandError.
  non_goals:
  - Does not wait for or process a trace batch.
  parameters: {type: object, properties: {}}
  output:
    description: Bound receiver identity and queue policy.
    schema:
      type: object
      properties:
        receiver: {type: string}
        address: {type: string}
        queue_capacity: {type: integer}
        overflow_policy: {type: string}
      required: [receiver, address, queue_capacity, overflow_policy]
  side_effects:
  - kind: network_listen
    target: configured OTLP/gRPC address
    state: named receiver remains live until stop or undo
  reversibility:
    classification: compensatable
    undo: otlp_receiver_stop
  undo:
    strategy: compensating_action
    description: Stop the listener owned by this launch.
  errors:
  - signal: CommandError
    condition: config is invalid, the receiver is live, or the address cannot bind
    message_shape: 'tool <name>: bind OTLP receiver <receiver>: <cause>'
    state_after_failure: no newly bound receiver remains
  relationships:
    before: [await_spans, otlp_receiver_stop]
  config:
    receiver: ingress
    address: ${COLLECTOR_RECEIVER_ADDRESS:-0.0.0.0:4317}
    queue_capacity: 16
    overflow_policy: reject
    shutdown_timeout: 5s
    drain_policy: preserve

- name: await_spans
  type: builtin
  init: await_spans
  category: boundary
  visibility: internal
  emits: [SpansReceived, AwaitTimedOut, ReceiverStopped, CommandError]
  description: Wait for and consume one complete FIFO trace batch from a named OTLP receiver.
  problem: OTLP handler goroutines cannot decide machine policy, so accepted batches need a bounded handoff into the grammar.
  goals:
  - Return one complete request and bounded decision metadata.
  - Distinguish timeout, lifecycle stop, and transport faults.
  requirements:
    input:
    - Receiver and timeout come from trusted config.
    output:
    - Output includes batch, batch_id, span_count, service_names, trace_ids, resource_attributes, and received_at.
    errors:
    - An absent receiver or canceled wait emits CommandError; timeout and receiver stop have distinct signals.
  non_goals:
  - Does not filter, spool, relay, or mutate spans.
  parameters: {type: object, properties: {}}
  output:
    description: Complete OTLP batch plus bounded metadata used by declared decisions.
    schema:
      type: object
      properties:
        batch: {type: object}
        batch_id: {type: string}
        span_count: {type: integer}
        service_names: {type: array}
        trace_ids: {type: array}
        resource_attributes: {type: object}
        received_at: {type: string}
      required: [batch, batch_id, span_count, service_names, trace_ids, resource_attributes]
  side_effects:
  - kind: state_mutation
    target: configured receiver
    state: consumes one FIFO batch
  reversibility:
    classification: irreversible
    undo: irreversible
    requires_confirmation: true
  undo:
    strategy: irreversible
    description: A consumed concurrent queue item cannot be restored in original order.
  errors:
  - signal: CommandError
    condition: receiver is absent or context cancellation is not the declared timeout
    message_shape: 'tool <name>: OTLP receiver <receiver>: <cause>'
    state_after_failure: no batch is returned
  relationships:
    before: [spool_spans, relay_spans]
    after: [otlp_receiver_launch]
  config:
    receiver: ingress
    timeout: 30s

- name: load_otlp_batch
  type: builtin
  init: load_otlp_batch
  category: boundary
  visibility: internal
  emits: [BatchLoaded, CommandError]
  description: Read and decode one trusted OTLP protobuf-JSON trace batch.
  problem: Offline replay needs a visible file/decode step before the shared relay boundary.
  goals:
  - Distinguish file-read failures from protobuf-JSON decode failures.
  - Return the unchanged batch for a later declared relay_spans dispatch.
  requirements:
    input:
    - The OTLP protobuf-JSON path comes from trusted config.
    output:
    - Output includes path, span_count, and the decoded batch.
    errors:
    - Read and decode failures emit CommandError before any network dispatch.
  non_goals:
  - Does not export, retry, mutate, or convert stdouttrace NDJSON.
  parameters: {type: object, properties: {}, additionalProperties: false}
  output:
    description: Trusted OTLP protobuf-JSON batch and metadata.
    schema:
      type: object
      properties:
        path: {type: string}
        span_count: {type: integer}
        batch: {type: object}
      required: [path, span_count, batch]
  side_effects:
  - kind: filesystem_read
    target: configured OTLP batch path
    state: read_only
  reversibility:
    classification: reversible
    undo: noop
  undo:
    strategy: noop
    description: Loading a batch changes nothing.
  errors:
  - signal: CommandError
    condition: the configured file cannot be read or decoded as an ExportTraceServiceRequest
    message_shape: 'tool <name>: read|decode OTLP batch <path>: <cause>'
    state_after_failure: relay is not invoked
  relationships:
    before: [relay_spans]
  config:
    path: traces/replay.otlp.json

- name: spool_spans
  type: builtin
  init: spool_spans
  category: boundary
  visibility: internal
  emits: [SpansSpooled, CommandError]
  description: Append a selected OTLP batch as complete stdouttrace-compatible NDJSON span lines.
  problem: A live backend is not deterministic test evidence, so received spans need a local format existing assertions already read.
  goals:
  - Preserve span and resource identity in stdouttrace-compatible objects.
  - Rotate only before a complete batch and sync evidence before success.
  requirements:
    input:
    - Path, batch selector, and rotation bounds come from trusted config.
    output:
    - Output reports path, span count, bytes written, and repeats the selected batch for declared relay.
    side_effects:
    - Appends and syncs a trace evidence file.
    errors:
    - Selector, conversion, rotation, append, and sync failures emit CommandError.
  non_goals:
  - Does not relay, query, or delete accepted backend spans.
  parameters: {type: object, properties: {}}
  output:
    description: Spool result plus the unchanged selected OTLP batch.
    schema:
      type: object
      properties:
        path: {type: string}
        span_count: {type: integer}
        bytes_written: {type: integer}
        batch: {type: object}
      required: [path, span_count, bytes_written, batch]
  side_effects:
  - kind: filesystem_write
    target: configured spool path
    state: appends durable audit evidence and may rotate bounded generations
  reversibility:
    classification: irreversible
    undo: irreversible
    requires_confirmation: true
  undo:
    strategy: irreversible
    description: Appended audit evidence is retained.
  errors:
  - signal: CommandError
    condition: batch selection, encoding, rotation, append, or sync fails
    message_shape: 'tool <name>: <spool operation>: <cause>'
    state_after_failure: relay is not invoked and the source batch remains in command state
  relationships:
    before: [relay_spans]
    after: [await_spans]
  config:
    path: traces/collector.ndjson
    batch_source: $.batch
    max_bytes: 10485760
    max_files: 3

- name: relay_spans
  type: builtin
  init: relay_spans
  category: boundary
  visibility: internal
  emits: [SpansRelayed, CommandError]
  description: Export a selected complete trace batch unchanged to one trusted OTLP/gRPC endpoint.
  problem: Persistent backends need accepted batches, but relay and retry order must remain visible in MachineSpec.
  goals:
  - Preserve protobuf resource and span identity at the upstream.
  - Separate upstream rejection from successful acceptance.
  - Reject a statically equivalent receiver and relay endpoint.
  requirements:
    input:
    - Endpoint, receiver address, batch selector, and timeout come from trusted config.
    output:
    - Output reports endpoint, span count, and accepted span count.
    errors:
    - Selection, connection, timeout, RPC, and partial-success rejection emit CommandError.
  non_goals:
  - Does not retry, sample, mutate, or retract spans.
  parameters: {type: object, properties: {}}
  output:
    description: Upstream endpoint and accepted span count.
    schema:
      type: object
      properties:
        endpoint: {type: string}
        span_count: {type: integer}
        accepted_span_count: {type: integer}
      required: [endpoint, span_count, accepted_span_count]
  side_effects:
  - kind: external_api
    target: configured OTLP/gRPC endpoint
    state: upstream may retain accepted spans
  reversibility:
    classification: irreversible
    undo: irreversible
    requires_confirmation: true
  undo:
    strategy: irreversible
    description: OTLP has no operation that retracts accepted spans.
  errors:
  - signal: CommandError
    condition: batch selection, connection, timeout, RPC, or upstream partial success fails
    message_shape: 'tool <name>: relay spans to <endpoint>: <cause>'
    state_after_failure: local spool evidence and command-state batch remain available for declared retry
  relationships:
    after: [spool_spans, await_spans]
  config:
    endpoint: jaeger:4317
    receiver_address: 0.0.0.0:4317
    batch_source: $.batch
    timeout: 10s

- name: otlp_receiver_stop
  type: builtin
  init: otlp_receiver_stop
  category: boundary
  visibility: internal
  emits: [ReceiverStopped, CommandError]
  description: Stop a named OTLP receiver, reject new exports, and unblock waiting commands.
  problem: A machine-owned listener needs an explicit terminal lifecycle word that releases transport resources.
  goals:
  - Stop intake and unblock every waiter within a declared bound.
  - Report retained and dropped queue state.
  requirements:
    input:
    - Receiver, shutdown timeout, and drain policy come from trusted config.
    output:
    - Output reports status, queue counts, drop counts, and drain policy.
    side_effects:
    - Closes the listener and mutates receiver lifecycle state.
    errors:
    - Missing receiver, shutdown timeout, or cleanup failure emits CommandError.
  non_goals:
  - Does not retract already relayed or spooled spans.
  parameters: {type: object, properties: {}}
  output:
    description: Final receiver queue and drop state.
    schema:
      type: object
      properties:
        receiver: {type: string}
        address: {type: string}
        status: {type: string}
        queued_batches: {type: integer}
        dropped_batches: {type: integer}
        dropped_spans: {type: integer}
        drain_policy: {type: string}
      required: [receiver, address, status, queued_batches, drain_policy]
  side_effects:
  - kind: network_listen
    target: configured OTLP/gRPC address
    state: releases the listener and marks receiver stopped
  reversibility:
    classification: irreversible
    undo: irreversible
    requires_confirmation: true
  undo:
    strategy: irreversible
    description: A stopped listener is relaunched by a later explicit launch word.
  errors:
  - signal: CommandError
    condition: the named receiver was never launched or graceful shutdown exceeds its bound
    message_shape: 'tool <name>: shutdown OTLP receiver <receiver>: <cause>'
    state_after_failure: forced stop still releases the listener when graceful shutdown times out
  relationships:
    after: [otlp_receiver_launch, await_spans]
  config:
    receiver: ingress
    shutdown_timeout: 5s
    drain_policy: preserve

- name: spool_list_traces
  type: builtin
  init: spool_list_traces
  category: boundary
  visibility: internal
  emits: [TracesListed, CommandError]
  description: Read the NDJSON trace spool and return paginated trace summaries, newest first.
  problem: A collector needs a read path over spooled traces so operators and UIs can browse ingested data without a separate backend.
  goals:
  - Aggregate spooled spans into trace summaries with bounded pagination.
  - Read across the active spool and rotated files without mutation.
  requirements:
    input:
    - Path, page size, max page size, and offset come from trusted config.
    output:
    - Output includes traces (trace id, root service, root span name, span count, start time, duration), total, offset, page size, and skipped line count.
    side_effects:
    - Read-only file access.
    errors:
    - Unreadable spool path emits CommandError.
  non_goals:
  - Does not mutate, rotate, or delete spool files.
  parameters: {type: object, properties: {}}
  output:
    description: Paginated trace summaries and spool health metadata.
    schema:
      type: object
      properties:
        traces:
          type: array
          items:
            type: object
            properties:
              trace_id: {type: string}
              root_service: {type: string}
              root_span_name: {type: string}
              span_count: {type: integer}
              start_time: {type: string}
              duration_ms: {type: integer}
        total: {type: integer}
        offset: {type: integer}
        page_size: {type: integer}
        skipped_lines: {type: integer}
      required: [traces, total, offset, page_size, skipped_lines]
  side_effects:
  - kind: filesystem_read
    target: configured spool path and rotated files
    state: read_only
  reversibility:
    classification: reversible
    undo: noop
  undo:
    strategy: noop
    description: Reading a spool changes nothing.
  errors:
  - signal: CommandError
    condition: the configured spool path cannot be read
    message_shape: 'tool <name>: <cause>'
    state_after_failure: no output is returned
  relationships:
    after: [spool_spans]
  config:
    path: traces/collector.ndjson
    page_size: 20
    max_page_size: 100
    offset: 0

- name: spool_get_trace
  type: builtin
  init: spool_get_trace
  category: boundary
  visibility: internal
  emits: [TraceRetrieved, CommandError]
  description: Read all spans for one trace from the NDJSON spool, returning the fields a waterfall UI needs.
  problem: A trace detail view needs per-span records with parent linkage, timing, and attributes from the spool without a separate query backend.
  goals:
  - Return all spans for one trace id with waterfall-ready fields.
  - Read across the active spool and rotated files without mutation.
  requirements:
    input:
    - Path and trace id come from trusted config.
    output:
    - Output includes trace id, spans (span id, parent span id, service, name, start time, end time, status, attributes), span count, and skipped line count.
    side_effects:
    - Read-only file access.
    errors:
    - Missing trace id or unreadable spool path emits CommandError.
  non_goals:
  - Does not mutate, rotate, or delete spool files.
  parameters: {type: object, properties: {}}
  output:
    description: All spans for one trace with waterfall fields.
    schema:
      type: object
      properties:
        trace_id: {type: string}
        spans:
          type: array
          items:
            type: object
            properties:
              span_id: {type: string}
              parent_span_id: {type: string}
              service: {type: string}
              name: {type: string}
              start_time: {type: string}
              end_time: {type: string}
              status:
                type: object
                properties:
                  code: {type: integer}
                  description: {type: string}
              attributes: {type: array}
        span_count: {type: integer}
        skipped_lines: {type: integer}
      required: [trace_id, spans, span_count, skipped_lines]
  side_effects:
  - kind: filesystem_read
    target: configured spool path and rotated files
    state: read_only
  reversibility:
    classification: reversible
    undo: noop
  undo:
    strategy: noop
    description: Reading a spool changes nothing.
  errors:
  - signal: CommandError
    condition: trace id is missing or the configured spool path cannot be read
    message_shape: 'tool <name>: <cause>'
    state_after_failure: no output is returned
  relationships:
    after: [spool_spans]
  config:
    path: traces/collector.ndjson
    trace_id: ""

- name: spool_span_stats
  type: builtin
  init: spool_span_stats
  category: boundary
  visibility: internal
  emits: [SpanStatsReady, CommandError]
  description: Filter spooled spans and return a duration-over-time heatmap and group-by counts.
  problem: An Explore panel needs an aggregate latency view over the spool -- where the time is spent and how a slice breaks down by an attribute -- without a separate analytics backend.
  goals:
  - Filter spans by time, service, name, and attribute equality, then bucket them into a duration-over-time heatmap.
  - Count filtered spans grouped by an attribute, reporting the dropped remainder rather than truncating silently.
  requirements:
    input:
    - Spool path, time-bucket count, duration bucket edges, group-by key, and caps come from trusted config; the filter, group-by, and top-N arrive per request.
    output:
    - Output includes the heatmap grid with axis boundaries, the matched span count, a capped list of exemplar trace IDs for the matched set, group-by counts, the dropped group and span totals, and skipped line count.
    side_effects:
    - Read-only file access.
    errors:
    - Unreadable spool path emits CommandError.
  non_goals:
  - Does not mutate, rotate, or delete spool files.
  - Does not depend on any environment variable.
  parameters:
    type: object
    properties:
      start_ms: {type: integer}
      end_ms: {type: integer}
      service: {type: string}
      span_name: {type: string}
      min_duration_ms: {type: integer}
      max_duration_ms: {type: integer}
      attributes: {type: object}
      time_buckets: {type: integer}
      group_by: {type: string}
      top_n: {type: integer}
  output:
    description: A duration-over-time heatmap and optional group-by counts over the filtered spans.
    schema:
      type: object
      properties:
        heatmap:
          type: object
          properties:
            time_bucket_boundaries: {type: array, items: {type: integer}}
            duration_bucket_boundaries: {type: array, items: {type: integer}}
            cells: {type: array, items: {type: array, items: {type: integer}}}
          required: [time_bucket_boundaries, duration_bucket_boundaries, cells]
        matched: {type: integer}
        exemplar_trace_ids: {type: array, items: {type: string}}
        skipped_lines: {type: integer}
        group_by: {type: string}
        groups:
          type: array
          items:
            type: object
            properties:
              value: {type: string}
              count: {type: integer}
        dropped_groups: {type: integer}
        dropped_span_total: {type: integer}
      required: [heatmap, matched, exemplar_trace_ids, skipped_lines]
  side_effects:
  - kind: filesystem_read
    target: configured spool path and rotated files
    state: read_only
  reversibility:
    classification: reversible
    undo: noop
  undo:
    strategy: noop
    description: Reading a spool changes nothing.
  errors:
  - signal: CommandError
    condition: the configured spool path cannot be read
    message_shape: 'tool <name>: <cause>'
    state_after_failure: no output is returned
  relationships:
    after: [spool_spans]
  config:
    path: traces/collector.ndjson
    time_buckets: 24
    duration_edges_ms: [0, 1, 10, 50, 100, 500, 1000, 5000]
    group_by: ""
    top_n: 20
    max_top_n: 100
    exemplar_cap: 20

- name: spool_span_breakdown
  type: builtin
  init: spool_span_breakdown
  category: boundary
  visibility: internal
  emits: [SpanBreakdownReady, CommandError]
  description: Rank the attributes that most distinguish a selected span region from its complement.
  problem: After spotting a slow region in the heatmap, an operator needs to know which attribute values explain it, without guessing which dimension to group by.
  goals:
  - Partition a baseline span set into a selection and its complement, then rank attribute values by their concentration inside the selection.
  - Report inside and outside counts and a deterministic divergence score, capped with a dropped remainder.
  requirements:
    input:
    - Spool path and caps come from trusted config; the baseline and selection filters and top-N arrive per request.
    output:
    - Output includes inside and outside totals, a capped list of exemplar trace IDs for the selection, the ranked attribute divergences, the dropped count, and skipped line count.
    side_effects:
    - Read-only file access.
    errors:
    - Unreadable spool path emits CommandError.
  non_goals:
  - Does not mutate, rotate, or delete spool files.
  - Does not depend on any environment variable.
  parameters:
    type: object
    properties:
      baseline: {type: object}
      selection: {type: object}
      top_n: {type: integer}
  output:
    description: The ranked attribute divergence between the selection and its complement.
    schema:
      type: object
      properties:
        inside_total: {type: integer}
        outside_total: {type: integer}
        exemplar_trace_ids: {type: array, items: {type: string}}
        ranked:
          type: array
          items:
            type: object
            properties:
              key: {type: string}
              value: {type: string}
              inside_count: {type: integer}
              outside_count: {type: integer}
              inside_proportion: {type: number}
              outside_proportion: {type: number}
              score: {type: number}
        dropped: {type: integer}
        skipped_lines: {type: integer}
      required: [inside_total, outside_total, exemplar_trace_ids, ranked, dropped, skipped_lines]
  side_effects:
  - kind: filesystem_read
    target: configured spool path and rotated files
    state: read_only
  reversibility:
    classification: reversible
    undo: noop
  undo:
    strategy: noop
    description: Reading a spool changes nothing.
  errors:
  - signal: CommandError
    condition: the configured spool path cannot be read
    message_shape: 'tool <name>: <cause>'
    state_after_failure: no output is returned
  relationships:
    after: [spool_spans]
  config:
    path: traces/collector.ndjson
    top_n: 20
    max_top_n: 100
    exemplar_cap: 20

