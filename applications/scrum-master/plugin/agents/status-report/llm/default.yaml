# The status-report profile's model binding: the model acts only in the Report
# state (design.md D10), reading SCRUM_MASTER_MODEL, SCRUM_MASTER_RESPONSE_PROFILE, and
# OLLAMA_URL with the defaults the parent's executor ships.
unit: scrum-master-status-report-llm-default
imports:
- /opt/agent-core/tools/units/types-core.yaml
tools:
- name: invoke_llm
  type: builtin
  init: invoke_llm
  visibility: internal
  signature:
    emits: [LLMResponded, CommandError]
  description: Invoke the model with the current conversation history.
  category: boundary
  output:
    description: Raw model response text.
    schema:
      type: string
  side_effects:
  - kind: external_api_call
    target: llm_provider
    description: Sends the current prompt and tool manifest to the configured model provider.
  - kind: state_mutation
    target: conversation_history
    state: appended
    description: Appends the model response to the in-memory conversation history.
  reversibility:
    classification: reversible
    requires_confirmation: false
  undo:
    strategy: conversation_truncate
    description: Restore the conversation history checkpoint captured before invoking the model.
    requires: [conversation_checkpoint]
  errors:
  - signal: CommandError
    condition: provider configuration is invalid or the model call fails
    message_shape: 'invoke_llm: <provider/model>: <error>'
    state_after_failure: conversation history unchanged unless the provider response was already appended
  config:
    model: ${SCRUM_MASTER_MODEL:-qwen3.6:35b-mlx}
    dialect: /opt/providers/chat-dialect.yaml
    provider_url: ${OLLAMA_URL:-http://localhost:11434}
    manifest_state: Report
    response_profile: ${SCRUM_MASTER_RESPONSE_PROFILE:-qwen}
    max_time: 600
    system_prompt: |
      You are the status-report workflow of scrum-master. The person's status issue
      was taken for you: you are in its worktree, in the repository they worked in.
      scrum-master gathers every fact; you ask the person only for judgment and
      write only the report's words (design.md D10).

      Run reports_week, reports_previous, and reports_path first, and show what
      they gathered. Then ask, one question at a time, only what the tracker
      cannot know: each open Sprint Goal's status (on-track, at-risk, blocked, or
      done), its problems, and whether it is complete; why the week's work
      mattered; what blocks the work; whether last week's Next landed; and what
      comes next. Draft the report in the report format with Work, Blockers,
      Impact, and Next, show it, and revise it until the person approves it.

      Constraints:
      - Every fact comes from the words; invent nothing, and ask nothing they answer
      - The report says what its author did and what blocks it; it never rates
        another person
      - Write it at the path reports_path names, and nowhere else
      - Run reports_validate and fix what it names before you commit
      - Commit with stage_all then commit, the message ending Closes <project#iid>
        for the status issue; never push, merge, or close anything

      Call done once the approved report is committed.

- name: parse_response
  type: builtin
  contract: legacy
  init: parse_response
  visibility: internal
  description: Parse raw model output into a tool call or task-completed signal.
  signature:
    output: builtin-types-core.Text
    emits: [ToolDone, TaskCompleted, ParseFailed, CommandError]
  category: word
  side_effects:
  - kind: command_state
    description: Parses the prior command output and may reset the parse retry counter after a non-ParseFailed result.
  undo:
    strategy: parse_retry_counter_restore
    description: Restores the parse retry counter snapshot captured before parsing.
  errors:
  - signal: CommandError
    condition: required input, configuration, or runtime state is invalid
    message_shape: 'parse_response: <error>'
    state_after_failure: no additional workflow step is executed by this tool
  output:
    description: Parsed tool-request JSON or a plain completion summary.
  config:
    manifest_state: Report
