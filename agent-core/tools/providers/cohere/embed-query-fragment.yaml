# Cohere query embedding (srd058 R1.3): embed_query on query_embedder, asking
# /v2/embed for a search_query vector. The reply is one row of floats under
# embedding, which the embed stage normalizes to a flat vector.
unit: provider-cohere-embed-query
params:
- name: limits_ref
  type: string
  description: The importing agent's limits profile, whose network allowlist admits the provider.
- name: input_selector
  type: string
  description: The selector the text to embed is read from, under body_source.
- name: body_source
  type: string
  enum: [command_state, previous_result]
  default: command_state
  description: Where input_selector reads.
- name: base_url
  type: string
  default: https://api.cohere.com
- name: model
  type: string
  default: embed-v4.0
rest:
  version: v1
  auth:
    query_embedder_auth:
      type: bearer
      token_ref: COHERE_API_KEY
  clients:
    query_embedder:
      base_url: $param(base_url)
      auth_ref: query_embedder_auth
      limits_ref: $param(limits_ref)
      operations:
        embed_query:
          method: POST
          path: /v2/embed
          params:
            body_schema:
              type: object
              required: [input]
              properties:
                input: {type: string}
            body_source: $param(body_source)
            input_mapping:
              input: $param(input_selector)
          body:
            model: $param(model)
            input_type: search_query
            embedding_types: [float]
            texts: ["{{ params.input }}"]
          success: {status: [200], signal: QueryEmbedded}
          failures:
          - {status: [401, 403], signal: ProviderUnauthorized}
          - {status: [429], signal: ProviderThrottled}
          - {status: [500, 502, 503, 504], signal: ProviderUnavailable}
          response:
            output:
              embedding: $.embeddings.float
          side_effects:
          - kind: external_api
            target: cohere.embed
            state: read_only
          reversibility:
            classification: reversible
            undo: noop
