{{- if .Values.observer.enabled }}
{{- $fullname := include "chatbot-mesh.fullname" . -}}
{{- $uiArchive := .Values.observer.uiArchiveConfigMap | default "" -}}
{{- if not $uiArchive }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fullname }}-observer-ui
  labels:
    {{- include "chatbot-mesh.labels" . | nindent 4 }}
    app.kubernetes.io/component: observer
data:
  {{- range $path, $_ := .Files.Glob "profiles/agents/observer/ui/dist/**" }}
  {{- $relative := $path | trimPrefix "profiles/agents/observer/ui/dist/" }}
  {{ printf "agents__observer__ui__dist__%s" ($relative | replace "/" "__") }}: |-
    {{- $.Files.Get $path | nindent 4 }}
  {{- end }}
---
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $fullname }}-observer
  labels:
    {{- include "chatbot-mesh.labels" . | nindent 4 }}
    app.kubernetes.io/component: observer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $fullname }}-observer
  labels:
    {{- include "chatbot-mesh.labels" . | nindent 4 }}
    app.kubernetes.io/component: observer
rules:
  - apiGroups: [""]
    resources: [pods, services]
    verbs: [get, list]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list]
  - apiGroups: [metrics.k8s.io]
    resources: [pods]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $fullname }}-observer
  labels:
    {{- include "chatbot-mesh.labels" . | nindent 4 }}
    app.kubernetes.io/component: observer
subjects:
  - kind: ServiceAccount
    name: {{ $fullname }}-observer
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $fullname }}-observer
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-observer
  labels:
    {{- include "chatbot-mesh.labels" . | nindent 4 }}
    app.kubernetes.io/component: observer
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "chatbot-mesh.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: observer
  template:
    metadata:
      labels:
        {{- include "chatbot-mesh.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: observer
      {{- if $uiArchive }}
      annotations:
        checksum/observer-ui-archive: {{ required "observer.uiArchiveChecksum is required with observer.uiArchiveConfigMap" .Values.observer.uiArchiveChecksum | quote }}
      {{- end }}
    spec:
      serviceAccountName: {{ $fullname }}-observer
      {{- if $uiArchive }}
      initContainers:
        - name: stage-observer-ui
          image: {{ include "chatbot-mesh.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - sh
            - -c
            - >-
              echo '{{ .Values.observer.uiArchiveChecksum }}  /observer-ui-src/assets.tgz' |
              sha256sum -c - &&
              tar -xzf /observer-ui-src/assets.tgz -C /observer-ui &&
              cd /observer-ui &&
              sha256sum -c .inventory.sha256 &&
              rm .inventory.sha256
          volumeMounts:
            - {name: observer-ui-source, mountPath: /observer-ui-src, readOnly: true}
            - {name: observer-ui, mountPath: /observer-ui}
      {{- end }}
      containers:
        - name: observer
          image: {{ include "chatbot-mesh.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - "--profile"
            - "{{ .Values.profiles.mountPath }}/agents/observer/profile.yaml"
            - "--directory"
            - "{{ .Values.profiles.workMountPath }}"
            {{- with include "chatbot-mesh.otlpEndpoint" . }}
            - "--otel-otlp-endpoint"
            - {{ . | quote }}
            - "--otel-service-name"
            - "observer"
            {{- end }}
            {{- with include "chatbot-mesh.otlpMetricEndpoint" . }}
            - "--otel-metric-otlp-endpoint"
            - {{ . | quote }}
            {{- end }}
          env:
            {{- with include "chatbot-mesh.integrationResourceAttributes" . }}
            - {name: OTEL_RESOURCE_ATTRIBUTES, value: {{ . | quote }}}
            {{- end }}
            - {name: OBSERVER_BIND_HOST, value: "0.0.0.0"}
            - {name: OBSERVER_NAMESPACE, value: {{ .Release.Namespace | quote }}}
            - {name: OBSERVER_LABEL_SELECTOR, value: {{ printf "app.kubernetes.io/instance=%s" .Release.Name | quote }}}
            - {name: OBSERVER_POLL_INTERVAL, value: {{ .Values.observer.pollInterval | quote }}}
            {{- if $uiArchive }}
            - {name: OBSERVER_UI_ROOT, value: "/observer-ui"}
            {{- else }}
            - {name: OBSERVER_UI_ROOT, value: "{{ .Values.profiles.mountPath }}/agents/observer/ui/dist"}
            {{- end }}
            # The kube_api client targets the loopback kubectl-proxy sidecar with
            # auth_ref none; the sidecar adds the service-account bearer token
            # (GH-1302).
            - {name: KUBE_API_URL, value: "http://127.0.0.1:{{ .Values.observer.proxy.port }}"}
          ports:
            - {name: control, containerPort: {{ .Values.observer.ports.control }}}
            - {name: monitor, containerPort: {{ .Values.observer.ports.monitor }}}
          readinessProbe:
            httpGet: {path: /api/lifecycle/health, port: control}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.observer.resources | nindent 12 }}
          volumeMounts:
            - {name: profiles, mountPath: {{ .Values.profiles.mountPath }}, readOnly: true}
            {{- if $uiArchive }}
            # Keep the external emptyDir beside, rather than nested under, the
            # read-only profiles ConfigMap mount. Nested volume mounts can mask
            # the observer profile itself on kubelet mount setup.
            - {name: observer-ui, mountPath: "/observer-ui", readOnly: true}
            {{- else }}
            - {name: observer-ui, mountPath: "{{ .Values.profiles.mountPath }}/agents/observer/ui/dist", readOnly: true}
            {{- end }}
            - {name: work, mountPath: {{ .Values.profiles.workMountPath }}}
        # kubectl-proxy sidecar: holds the pod's service-account token and serves
        # an unauthenticated read-only proxy on loopback. It rejects write verbs
        # and needs no RBAC beyond the observer's existing get/list Role, so bearer
        # auth never enters the declarative runtime (GH-1302).
        - name: kube-proxy
          image: {{ printf "%s:%s" .Values.observer.proxy.image.repository .Values.observer.proxy.image.tag | quote }}
          imagePullPolicy: {{ .Values.observer.proxy.image.pullPolicy }}
          command: ["kubectl"]
          args:
            - "proxy"
            - "--port={{ .Values.observer.proxy.port }}"
            - "--address=127.0.0.1"
            - "--reject-methods=POST,PUT,PATCH,DELETE"
          resources:
            {{- toYaml .Values.observer.proxy.resources | nindent 12 }}
      volumes:
        {{- include "chatbot-mesh.profilesVolume" . | nindent 8 }}
        - name: observer-ui
          {{- if $uiArchive }}
          emptyDir: {}
        - name: observer-ui-source
          configMap:
            name: {{ $uiArchive }}
            items:
              - {key: assets.tgz, path: assets.tgz}
          {{- else }}
          projected:
            defaultMode: 0444
            sources:
              - configMap:
                  name: {{ $fullname }}-observer-ui
                  items:
                    {{- range $path, $_ := .Files.Glob "profiles/agents/observer/ui/dist/**" }}
                    {{- $relative := $path | trimPrefix "profiles/agents/observer/ui/dist/" }}
                    - key: {{ printf "agents__observer__ui__dist__%s" ($relative | replace "/" "__") }}
                      path: {{ $relative }}
                    {{- end }}
          {{- end }}
        - name: work
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-observer
  labels:
    {{- include "chatbot-mesh.labels" . | nindent 4 }}
    app.kubernetes.io/component: observer
spec:
  selector:
    {{- include "chatbot-mesh.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: observer
  ports:
    - {name: control, port: {{ .Values.observer.ports.control }}, targetPort: control}
    - {name: monitor, port: {{ .Values.observer.ports.monitor }}, targetPort: monitor}
{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullname }}-observer
  labels:
    {{- include "chatbot-mesh.labels" . | nindent 4 }}
    app.kubernetes.io/component: observer
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  rules:
    - host: "observer.localhost"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $fullname }}-observer
                port: {name: monitor}
{{- end }}
{{- end }}
