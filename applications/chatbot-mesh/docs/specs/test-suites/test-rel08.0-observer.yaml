id: test-rel08.0-observer
title: Test Suite for Release 08.0 Observer Agent
release: "08.0"

traces: [rel08.0-uc001-mesh-observer]

preconditions:
  - agent-core REST client get, REST server launch, await, and stop words are available.
  - The observer profile mounts a ServiceAccount with namespace-scoped pod list/get RBAC.
  - At least the chatbot and one RAG server are running in the demo cluster.

test_cases:
  - use_case: rel08.0-uc001-mesh-observer
    name: Observer profile validates
    status: planned
    description: The observer profile loads and every action, signal, declaration, REST client, REST server route, and monitor route validates. Boot smoke passes.
    expected:
      profile_loads: true
      machine_validates: true
      rest_definitions_validate: true
      boot_smoke_passes: true
    traces: [rel08.0-uc001-mesh-observer S1, srd008-observer-agent AC1]

  - use_case: rel08.0-uc001-mesh-observer
    name: Observer discovers mesh agent pods on the demo cluster
    integration_target: mage integration:rig
    status: planned
    description: On a running demo cluster, the observer discovers at least the chatbot and one RAG server pod via kube API label selector. The discovery result contains pod names and addresses.
    expected:
      chatbot_discovered: true
      rag_server_discovered: true
      discovery_by_label_selector: true
    traces: [rel08.0-uc001-mesh-observer S1, srd008-observer-agent AC1]

  - use_case: rel08.0-uc001-mesh-observer
    name: Observer serves four monitor fan-in joins and survives degraded discovery
    integration_target: mage integration:observer
    status: done
    description: |
      The observer's monitor fan-in is four MachineSpec for_each passes, one per
      monitor endpoint, each expanding a single-request read word over the
      discovered pods. The profile validates that grammar at load, and the served
      /monitor/fleet view carries all four join labels beside the discovery
      labels. With the kube client pointed at a non-routable address the pod list
      never resolves, so the fan-in records nothing and the cycle still proceeds
      to metrics, waits, and exits cleanly rather than failing.
    expected:
      four_join_labels_served: true
      one_request_per_dispatch: true
      degraded_discovery_does_not_fail_cycle: true
      per_item_counts_consistent: true
      clean_lifecycle_exit: true
    traces: [rel08.0-uc001-mesh-observer S2, srd008-observer-agent AC2]

  - use_case: rel08.0-uc001-mesh-observer
    name: Observer polls agent monitor endpoints and aggregates fleet data
    integration_target: mage integration:rig
    status: planned
    description: For each discovered agent, the observer polls /monitor/machine, /monitor/state, /monitor/tools, and /monitor/events and returns valid JSON. An unreachable agent does not prevent polling others. This is the cluster-verified case; the fan-in grammar and its degraded path are covered above.
    expected:
      machine_spec_returned: true
      current_state_returned: true
      tools_returned: true
      events_returned: true
      unreachable_agent_degraded: true
    traces: [rel08.0-uc001-mesh-observer S2, srd008-observer-agent AC2]

  - use_case: rel08.0-uc001-mesh-observer
    name: Fleet UX renders a card per pod from the four fan-in joins
    go_test: cd agents/observer/ui && npm test
    status: done
    description: |
      fleetData zips the four monitor fan-in joins into one card per discovered
      pod, joining them on the pod name each item carries, and maps each
      endpoint's payload to the shape the card reads. A pod whose state read
      failed renders unreachable while the others render normally, even though
      the join counts every dispatched item as succeeded. Absent or unavailable
      joins yield the empty fleet view rather than an exception.
    expected:
      card_per_pod: true
      machine_tools_state_events_mapped: true
      pod_name_keys_resource_lookup: true
      failed_state_read_renders_unreachable: true
      absent_joins_degrade_to_empty: true
    traces: [rel08.0-uc001-mesh-observer S2, rel08.0-uc001-mesh-observer S3, srd008-observer-agent AC3]

  - use_case: rel08.0-uc001-mesh-observer
    name: Fleet UX serves and displays agent cards
    integration_target: mage demo:up
    status: planned
    description: The observer UX is reachable at its .localhost URL and renders a card per agent showing machine name, tools, state, and events. The page auto-refreshes. This is the served-and-reachable case; the rendering itself is covered above.
    expected:
      ux_reachable: true
      auto_refresh: true
    traces: [rel08.0-uc001-mesh-observer S2, rel08.0-uc001-mesh-observer S3, srd008-observer-agent AC3]

  - use_case: rel08.0-uc001-mesh-observer
    name: Observer RBAC is namespace-scoped and read-only
    status: planned
    description: The rendered Helm template creates a Role (not ClusterRole) with only get and list verbs on pods, services, deployments, and metrics.k8s.io pod metrics in the release namespace.
    expected:
      role_not_cluster_role: true
      verbs_get_list_only: true
      resources_pods_services_deployments_podmetrics: true
      namespace_scoped: true
    traces: [rel08.0-uc001-mesh-observer S5, srd008-observer-agent AC5]

  - use_case: rel08.0-uc001-mesh-observer
    name: Observer discovers topology and the UX groups pods by Deployment and Service
    integration_target: mage integration:rig
    status: planned
    description: The observer lists the release Deployments and Services alongside pods; the fleet view groups each pod under its owning Deployment and the Service fronting it, matching the running topology within one poll. Configuration uses declarations and flags with no environment variable.
    expected:
      deployments_discovered: true
      services_discovered: true
      pods_grouped_by_deployment: true
      no_new_environment_variable: true
    traces: [rel08.0-uc001-mesh-observer S6, srd008-observer-agent AC6]

  - use_case: rel08.0-uc001-mesh-observer
    name: Observer shows per-pod resource usage and degrades when metrics are absent
    integration_target: mage integration:rig
    status: planned
    description: The observer polls metrics.k8s.io PodMetrics and shows each pod's CPU and memory on its card. When the cluster has no metrics-server, topology and monitor fan-in still render and each card shows an explicit "metrics unavailable" state rather than failing.
    expected:
      cpu_and_memory_per_pod: true
      metrics_unavailable_state_when_absent: true
      discovery_unaffected_by_metrics_failure: true
    traces: [rel08.0-uc001-mesh-observer S7, srd008-observer-agent AC7]

  - use_case: rel08.0-uc001-mesh-observer
    name: Observer lifecycle exit stops cleanly
    integration_target: mage integration:rig
    status: planned
    description: A lifecycle exit request stops the discovery loop, monitor, and control servers. The observer reaches terminal Done.
    expected:
      discovery_stopped: true
      monitor_stopped: true
      terminal_state_done: true
    traces: [rel08.0-uc001-mesh-observer S4, srd008-observer-agent AC4]
