name: bench
purpose: |-
  Host the profile-owned bench REST application, route operator actions,
  and invoke evaluator children through reusable runtime primitives.
configuration:
  machine: agents/bench/machine.yaml
  tools: agents/bench/tools.yaml
invariants:
- The bench never calls an LLM directly
- REST routes and UI assets are owned by the bench profile
- Operator actions enter through the generic REST event queue
- The web UI remains accessible during experiment execution for progress monitoring
- All experiment execution uses self_invoke to launch the critic profile
lifecycle: |-
  1. Launch the generic REST server.
  2. Await a declared operator launch or shutdown action.
  3. Validate launch input and self-invoke the critic.
  4. Return to the operator wait after child completion or failure.
  5. Stop and drain the REST server on shutdown.
pipeline_diagram: |-
  ```mermaid
  flowchart TD
    A[Idle] -->|Seed| B[Launching HTTP]
    B -->|ServerLaunched| C[Awaiting Action]
    C -->|ExperimentRequested| D[Validating Suite]
    D -->|SuiteSelected| E[Launching Evaluator]
    E -->|ToolDone or ToolFailed| C
    C -->|Shutdown| F[Stopping HTTP]
    F -->|ServerStopped| G[Done]
  ```
initial_state: Idle
budget:
  command_timeout: 25h
  max_iterations: 10000
metric_labels:
  workflow: bench
states:
- name: Idle
  meaning: Initial state before the web server starts.
- name: LaunchingHTTP
  meaning: The generic profile-configured REST listener is starting.
- name: Serving
  meaning: The UI is available while the host awaits one queued operator action.
- name: Validating
  meaning: The declared suite predicate is checking launch input.
- name: Launching
  meaning: self_invoke is running the critic while REST remains available.
- name: StoppingHTTP
  meaning: The generic REST listener is draining and stopping.
- name: Done
  run_status: succeeded
  meaning: Terminal. The user requested shutdown.
- name: Failed
  run_status: failed
  meaning: Terminal. An infrastructure error occurred during experiment launch.
terminal_states:
- Done
- Failed
signals:
- name: Seed
  trigger: Agent startup.
- name: ServerLaunched
  trigger: Generic REST listener started.
- name: ExperimentRequested
  trigger: User clicked Launch in the web UI.
- name: Shutdown
  trigger: User requested shutdown or Ctrl+C.
- name: SuiteSelected
  trigger: The launch request includes a non-empty suite path.
- name: SuiteMissing
  trigger: The launch request omitted its suite path.
- name: ToolDone
  trigger: The evaluator child completed.
- name: ToolFailed
  trigger: The evaluator child failed.
- name: ServerStopped
  trigger: Generic REST listener stopped.
- name: AwaitTimedOut
  trigger: No operator action arrived before the configured bound.
- name: CommandError
  trigger: Infrastructure-level error.
transitions:
- state: Idle
  signal: Seed
  next: LaunchingHTTP
  action: launch_bench_http
- state: LaunchingHTTP
  signal: ServerLaunched
  next: Serving
  action: await_bench_action
  label: operator_action
- state: LaunchingHTTP
  signal: CommandError
  next: Failed
- state: Serving
  signal: ExperimentRequested
  next: Validating
  action: validate_eval_suite
- state: Serving
  signal: Shutdown
  next: StoppingHTTP
  action: stop_bench_http
- state: Serving
  signal: CommandError
  next: Failed
- state: Serving
  signal: AwaitTimedOut
  next: Serving
  action: await_bench_action
  label: operator_action
- state: Serving
  signal: ServerStopped
  next: Failed
- state: Validating
  signal: SuiteSelected
  next: Launching
  action: launch_evaluator
- state: Validating
  signal: SuiteMissing
  next: Serving
  action: await_bench_action
  label: operator_action
- state: Validating
  signal: CommandError
  next: Failed
- state: Launching
  signal: ToolDone
  next: Serving
  action: await_bench_action
  label: operator_action
- state: Launching
  signal: ToolFailed
  next: Serving
  action: await_bench_action
  label: operator_action
- state: Launching
  signal: CommandError
  next: Failed
- state: StoppingHTTP
  signal: ServerStopped
  next: Done
- state: StoppingHTTP
  signal: CommandError
  next: Failed
