name: prose-workflow-orchestrator
purpose: |-
  Coordinate the Release 00.1 tracer: capture one source, preserve its original
  and manifest lineage, request one structure candidate, obtain an independent
  verdict, permit one structure replay, and finalize locally. Only this machine
  selects workproduct mutation words.
invariants:
  - Structure and critic children receive content identities, never workspace paths.
  - Critique evidence is written and manifested before its verdict is routed.
  - A first rejection may replay structure once; a second rejection cannot cycle.
  - Finalization is reachable only from an accepted critic verdict.
  - No voice, style, Pangram, publication, Helm, kind, or applier action exists.
initial_state: AwaitingRequest
budget:
  max_iterations: 64
  max_tokens: 100000
  max_duration: 10m0s
states:
  - AwaitingRequest
  - CapturingSource
  - WritingOriginal
  - ManifestingCapture
  - InvokingStructure
  - WritingStructure
  - ManifestingStructure
  - InvokingCritic
  - CapturingCritic
  - ParsingCritic
  - WritingCritique
  - ManifestingCritique
  - RoutingCritic
  - ManifestingRetry
  - InvokingStructureRetry
  - WritingStructureRetry
  - ManifestingStructureRetry
  - InvokingCriticRetry
  - CapturingCriticRetry
  - ParsingCriticRetry
  - WritingCritiqueRetry
  - ManifestingCritiqueRetry
  - RoutingCriticRetry
  - MaterializingFinalFirst
  - MaterializingFinalRetry
  - ManifestingFinal
  - ManifestingKeptOriginal
  - {name: LocallyFinalized, run_status: succeeded}
  - {name: KeptOriginal, run_status: succeeded}
  - {name: Failed, run_status: failed}
terminal_states: [LocallyFinalized, KeptOriginal, Failed]
signals:
  - Seed
  - ToolDone
  - ToolFailed
  - CommandError
  - CriticOutputCaptured
  - CriticResponseParsed
  - CriticResponseInvalid
  - CriticAccepted
  - CriticRejected
transitions:
  - {state: AwaitingRequest, signal: Seed, next: CapturingSource, action: capture_source, label: source_capture}
  - {state: CapturingSource, signal: ToolDone, next: WritingOriginal, action: write_original, label: original_write}
  - {state: WritingOriginal, signal: ToolDone, next: ManifestingCapture, action: append_capture_manifest, label: capture_manifest}
  - {state: ManifestingCapture, signal: ToolDone, next: InvokingStructure, action: invoke_structure_editor, label: structure_child}
  - {state: InvokingStructure, signal: ToolDone, next: WritingStructure, action: write_structure_attempt, label: structure_attempt}
  - {state: WritingStructure, signal: ToolDone, next: ManifestingStructure, action: append_structure_manifest, label: structure_manifest}
  - {state: ManifestingStructure, signal: ToolDone, next: InvokingCritic, action: invoke_voice_critic, label: critic_child}
  - {state: InvokingCritic, signal: ToolDone, next: CapturingCritic, action: capture_critic_output, label: critic_transport}
  - {state: CapturingCritic, signal: CriticOutputCaptured, next: ParsingCritic, action: parse_critic_response, label: critic_response}
  - {state: ParsingCritic, signal: CriticResponseParsed, next: WritingCritique, action: write_critique_attempt, label: critique_attempt}
  - {state: WritingCritique, signal: ToolDone, next: ManifestingCritique, action: append_critique_manifest, label: critique_manifest}
  - {state: ManifestingCritique, signal: ToolDone, next: RoutingCritic, action: critic_verdict_is_pass, label: critic_route}
  - {state: RoutingCritic, signal: CriticAccepted, next: MaterializingFinalFirst, action: materialize_final_chain, label: final_chain}
  - {state: RoutingCritic, signal: CriticRejected, next: ManifestingRetry, action: append_retry_manifest, label: retry_manifest}
  - {state: ManifestingRetry, signal: ToolDone, next: InvokingStructureRetry, action: invoke_structure_editor, label: structure_child}
  - {state: InvokingStructureRetry, signal: ToolDone, next: WritingStructureRetry, action: write_structure_attempt, label: structure_attempt}
  - {state: WritingStructureRetry, signal: ToolDone, next: ManifestingStructureRetry, action: append_structure_retry_manifest, label: structure_manifest}
  - {state: ManifestingStructureRetry, signal: ToolDone, next: InvokingCriticRetry, action: invoke_voice_critic, label: critic_child}
  - {state: InvokingCriticRetry, signal: ToolDone, next: CapturingCriticRetry, action: capture_critic_output, label: critic_transport}
  - {state: CapturingCriticRetry, signal: CriticOutputCaptured, next: ParsingCriticRetry, action: parse_critic_response, label: critic_response}
  - {state: ParsingCriticRetry, signal: CriticResponseParsed, next: WritingCritiqueRetry, action: write_critique_attempt, label: critique_attempt_retry}
  - {state: WritingCritiqueRetry, signal: ToolDone, next: ManifestingCritiqueRetry, action: append_critique_retry_manifest, label: critique_manifest_retry}
  - {state: ManifestingCritiqueRetry, signal: ToolDone, next: RoutingCriticRetry, action: critic_verdict_is_pass, label: critic_route_retry}
  - {state: RoutingCriticRetry, signal: CriticAccepted, next: MaterializingFinalRetry, action: materialize_final_chain, label: final_chain}
  - {state: RoutingCriticRetry, signal: CriticRejected, next: ManifestingKeptOriginal, action: append_kept_original_manifest, label: kept_original_manifest}
  - {state: MaterializingFinalFirst, signal: ToolDone, next: ManifestingFinal, action: append_final_manifest, label: final_manifest}
  - {state: MaterializingFinalRetry, signal: ToolDone, next: ManifestingFinal, action: append_final_retry_manifest, label: final_manifest}
  - {state: ManifestingFinal, signal: ToolDone, next: LocallyFinalized}
  - {state: ManifestingKeptOriginal, signal: ToolDone, next: KeptOriginal}
  - {state: CapturingCritic, signal: CriticResponseInvalid, next: Failed}
  - {state: ParsingCritic, signal: CriticResponseInvalid, next: Failed}
  - {state: CapturingCriticRetry, signal: CriticResponseInvalid, next: Failed}
  - {state: ParsingCriticRetry, signal: CriticResponseInvalid, next: Failed}
  - {state: CapturingSource, signal: ToolFailed, next: Failed}
  - {state: WritingOriginal, signal: ToolFailed, next: Failed}
  - {state: ManifestingCapture, signal: ToolFailed, next: Failed}
  - {state: InvokingStructure, signal: ToolFailed, next: Failed}
  - {state: WritingStructure, signal: ToolFailed, next: Failed}
  - {state: ManifestingStructure, signal: ToolFailed, next: Failed}
  - {state: InvokingCritic, signal: ToolFailed, next: Failed}
  - {state: WritingCritique, signal: ToolFailed, next: Failed}
  - {state: ManifestingCritique, signal: ToolFailed, next: Failed}
  - {state: ManifestingRetry, signal: ToolFailed, next: Failed}
  - {state: InvokingStructureRetry, signal: ToolFailed, next: Failed}
  - {state: WritingStructureRetry, signal: ToolFailed, next: Failed}
  - {state: ManifestingStructureRetry, signal: ToolFailed, next: Failed}
  - {state: InvokingCriticRetry, signal: ToolFailed, next: Failed}
  - {state: WritingCritiqueRetry, signal: ToolFailed, next: Failed}
  - {state: ManifestingCritiqueRetry, signal: ToolFailed, next: Failed}
  - {state: MaterializingFinalFirst, signal: ToolFailed, next: Failed}
  - {state: MaterializingFinalRetry, signal: ToolFailed, next: Failed}
  - {state: ManifestingFinal, signal: ToolFailed, next: Failed}
  - {state: ManifestingKeptOriginal, signal: ToolFailed, next: Failed}
  - {state: CapturingSource, signal: CommandError, next: Failed}
  - {state: WritingOriginal, signal: CommandError, next: Failed}
  - {state: ManifestingCapture, signal: CommandError, next: Failed}
  - {state: InvokingStructure, signal: CommandError, next: Failed}
  - {state: WritingStructure, signal: CommandError, next: Failed}
  - {state: ManifestingStructure, signal: CommandError, next: Failed}
  - {state: InvokingCritic, signal: CommandError, next: Failed}
  - {state: CapturingCritic, signal: CommandError, next: Failed}
  - {state: ParsingCritic, signal: CommandError, next: Failed}
  - {state: WritingCritique, signal: CommandError, next: Failed}
  - {state: ManifestingCritique, signal: CommandError, next: Failed}
  - {state: RoutingCritic, signal: CommandError, next: Failed}
  - {state: ManifestingRetry, signal: CommandError, next: Failed}
  - {state: InvokingStructureRetry, signal: CommandError, next: Failed}
  - {state: WritingStructureRetry, signal: CommandError, next: Failed}
  - {state: ManifestingStructureRetry, signal: CommandError, next: Failed}
  - {state: InvokingCriticRetry, signal: CommandError, next: Failed}
  - {state: CapturingCriticRetry, signal: CommandError, next: Failed}
  - {state: ParsingCriticRetry, signal: CommandError, next: Failed}
  - {state: WritingCritiqueRetry, signal: CommandError, next: Failed}
  - {state: ManifestingCritiqueRetry, signal: CommandError, next: Failed}
  - {state: RoutingCriticRetry, signal: CommandError, next: Failed}
  - {state: MaterializingFinalFirst, signal: CommandError, next: Failed}
  - {state: MaterializingFinalRetry, signal: CommandError, next: Failed}
  - {state: ManifestingFinal, signal: CommandError, next: Failed}
  - {state: ManifestingKeptOriginal, signal: CommandError, next: Failed}
