      - assertion: rig
        path: agent-core/internal/runtime/core/loop_runtime_test.go
        test: TestLoop_RunsToCompletion

  - id: R-RUN-004
    target: runtime
    level: MUST
    statement: >-
      A conforming runtime MUST select each transition by the pair of the
      current state and the last result's signal; a pair the machine-instance
      does not declare MUST end the run with the failed status without
      dispatching a tool, and a run that reaches a terminal state MUST report
