# Small-footprint values for the in-cluster LLM-tier kind smoke (rel09.5, GH-338).
# The LLM tier is enabled with CPU-only small models so the preload and readiness
# gate run on a disposable kind cluster without a GPU. This diverges from GPU
# production sizing by design (srd015 R6.4, recorded limitation).
image:
  pullPolicy: IfNotPresent

chatbot:
  embeddingModel: all-minilm
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {cpu: 500m, memory: 512Mi}

ragUnits:
  - name: rag0
    description: In-cluster LLM smoke-test corpus.
    collection: corpus
    embeddingModel: all-minilm
    replicas: 1

ragServer:
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {cpu: 500m, memory: 512Mi}

chroma:
  image:
    repository: docker.io/chromadb/chroma
    tag: "1.5.3"
    digest: ""
    pullPolicy: Never
  storage: 256Mi
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {cpu: 500m, memory: 512Mi}

dolt:
  image:
    repository: docker.io/dolthub/dolt-sql-server
    tag: "2.3.5"
    digest: ""
    pullPolicy: Never
  storage: 256Mi

observer:
  proxy:
    image:
      repository: docker.io/rancher/kubectl
      tag: v1.31.4
      digest: ""
      pullPolicy: Never

collector:
  image:
    repository: docker.io/otel/opentelemetry-collector-contrib
    tag: "0.127.0"
    digest: ""
    pullPolicy: Never

ingress:
  enabled: false

applier:
  enabled: false

# The in-cluster LLM tier: CPU-only small models (no GPU), tiny storage.
ollama:
  enabled: true
  utilityImage: docker.io/library/busybox:1.36
  # The integration host pulls the chart digest pin, builds the derived runtime,
  # and imports it under the typed local reference below. Helm install overrides
  # ollama.image.tag with the host-built upstream/recipe identity.
  image:
    repository: localhost/declarative-agents/derived/ollama
    tag: upstream-0.34.2-kind-trusted-recipe-000000000000-linux-amd64
    digest: ""
    pullPolicy: Never
  models:
    embedding: all-minilm
    chat: ["qwen2.5:0.5b"]
    tier: qwen2.5:0.5b
  persistence:
    size: 2Gi
  resources:
    requests: {cpu: 500m, memory: 512Mi}
    limits: {cpu: "4", memory: 4Gi}
  gpu:
    count: 0
