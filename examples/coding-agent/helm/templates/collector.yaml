{{- if .Values.collector.enabled }}
{{- $fullname := include "coding-agent.fullname" . -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fullname }}-collector
  labels:
    {{- include "coding-agent.labels" . | nindent 4 }}
    app.kubernetes.io/component: collector
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:{{ .Values.collector.otlpGRPCPort }}
          http:
            endpoint: 0.0.0.0:{{ .Values.collector.otlpHTTPPort }}
    processors:
      batch: {}
    exporters:
      debug: {verbosity: basic}
      {{- if .Values.jaeger.enabled }}
      otlp/jaeger:
        endpoint: {{ $fullname }}-jaeger:{{ .Values.jaeger.otlpGRPCPort }}
        tls: {insecure: true}
      {{- end }}
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [{{ ternary "otlp/jaeger" "debug" .Values.jaeger.enabled }}]
        metrics:
          receivers: [otlp]
          processors: [batch]
          exporters: [debug]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-collector
  labels:
    {{- include "coding-agent.labels" . | nindent 4 }}
    app.kubernetes.io/component: collector
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "coding-agent.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: collector
  template:
    metadata:
      labels:
        {{- include "coding-agent.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: collector
      annotations:
        checksum/config: {{ printf "%s-%t" (toYaml .Values.collector) .Values.jaeger.enabled | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if .Values.jaeger.enabled }}
      initContainers:
        - name: wait-for-jaeger-otlp
          image: {{ .Values.collector.utilityImage | quote }}
          command: ["/bin/sh", "-c"]
          args:
            - until nc -z -w 2 {{ $fullname }}-jaeger {{ .Values.jaeger.otlpGRPCPort }}; do sleep 2; done
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
      {{- end }}
      containers:
        - name: collector
          image: "{{ .Values.collector.image.repository }}:{{ .Values.collector.image.tag }}"
          imagePullPolicy: {{ .Values.collector.image.pullPolicy }}
          args: ["--config=/etc/collector/config.yaml"]
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - {name: otlp-grpc, containerPort: {{ .Values.collector.otlpGRPCPort }}}
            - {name: otlp-http, containerPort: {{ .Values.collector.otlpHTTPPort }}}
          readinessProbe:
            tcpSocket: {port: otlp-grpc}
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            {{- toYaml .Values.collector.resources | nindent 12 }}
          volumeMounts:
            - {name: config, mountPath: /etc/collector, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: config
          configMap: {name: {{ $fullname }}-collector}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-collector
  labels:
    {{- include "coding-agent.labels" . | nindent 4 }}
    app.kubernetes.io/component: collector
spec:
  selector:
    {{- include "coding-agent.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: collector
  ports:
    - {name: otlp-grpc, port: {{ .Values.collector.otlpGRPCPort }}, targetPort: otlp-grpc}
    - {name: otlp-http, port: {{ .Values.collector.otlpHTTPPort }}, targetPort: otlp-http}
{{- end }}
