# The admit machine's words (GH-37). SCRUM_MASTER_PROJECT and SCRUM_MASTER_ISSUE name the issue; optional flags are
# parameters from the run's request, never ${VAR} args (GH-135).
unit: scrum-master-admit-declarations
tools:
- name: issue_milestone
  type: exec
  binary: scrum-master
  args:
  - issue
  - milestone
  - --json
  - --project
  - ${SCRUM_MASTER_PROJECT}
  - --issue
  - ${SCRUM_MASTER_ISSUE}
  visibility: internal
  description: 'Set the issue''s milestone and record why (srd041 R4).'
  category: boundary
  parameters:
    type: object
    properties:
      milestone:
        type: string
        description: 'The milestone; empty is the active sprint''s.'
        flag: --milestone
      control:
        type: string
        description: 'Program repository holding control/ files, when not the project.'
        flag: --control
  signature:
    emits: [ToolDone, ToolFailed, CommandError]
  output:
    description: 'The milestone word''s JSON report.'
    schema:
      type: string
  side_effects:
  - kind: external_api_call
    target: tracker
    description: 'Sets the issue''s milestone and posts an Admitted note.'
  reversibility:
    classification: irreversible
    requires_confirmation: false
  undo:
    strategy: noop
    description: The word's write is a person's to reverse with the tracker.
  errors:
  - signal: CommandError
    condition: the word cannot start — this agent does not serve the scrum-master words — or an environment variable is unset
    message_shape: 'issue_milestone: <error>'
    state_after_failure: nothing ran in a word that did not start
  - signal: ToolFailed
    condition: the word refuses and exits non-zero
    message_shape: <the word's reason, as printed>
    state_after_failure: the tracker is as the word's refusal left it
