name: applier-apply-request
purpose: |-
  One request-scoped run of a decided values patch against the coding chart. The
  machine_request apply endpoint seeds this machine with the overrides content and
  a fixed values-file path. The applier writes the overrides to the file
  (write_overrides), validates them against the chart schema with a helm dry-run
  (helm_dry_run), applies the patch as an in-place rollout that returns without
  waiting (helm_upgrade), and then verifies the planner, executor, and critic
  Deployments in turn (kubectl_rollout_status_planner, _executor, _critic). An
  apply command that itself fails lands in Failed; a verify stall on any of the
  three role Deployments is compensated by helm_rollback. The applier authors no
  values decision and passes no endpoint or credential into a running agent.

  Every word here is an exec word (or the file write), so each emits only ToolDone
  or ToolFailed. The outcomes are told apart by the terminal state a run ends in
  rather than by the signal that got it there: a dry-run reject is the caller's bad
  patch (Rejected), a write or apply failure is ours (Failed), and a compensated
  verify stall is its own outcome (RolledBack). The apply endpoint maps those
  states to 400, 500, and 500 with distinct bodies (srd030 R4.3).
initial_state: AwaitingRequest
budget:
  max_iterations: 12
states:
  - {name: AwaitingRequest, meaning: Seeded by the apply endpoint with the overrides content and path.}
  - {name: Writing, meaning: Writing the overrides to the values file.}
  - {name: Validating, meaning: Rendering the release with --dry-run to validate against the chart schema.}
  - {name: Applying, meaning: Applying the patch as an in-place rollout that returns without waiting for readiness.}
  - {name: VerifyingPlanner, meaning: Reading the planner Deployment rollout status to confirm completion.}
  - {name: VerifyingExecutor, meaning: Reading the executor Deployment rollout status to confirm completion.}
  - {name: VerifyingCritic, meaning: Reading the critic Deployment rollout status to confirm completion.}
  - {name: RollingBack, meaning: Rolling the release back after a verify stall.}
  - {name: Done, meaning: Terminal. The rollout applied and all three role Deployments verified.}
  - {name: Rejected, meaning: Terminal. The dry-run rejected the patch against the chart schema; the caller sent a bad patch and nothing was applied.}
  - {name: RolledBack, meaning: Terminal. A role rollout stalled and the release was rolled back to the prior revision.}
  - {name: Failed, meaning: Terminal. The values file could not be written, the apply failed, or the rollback itself failed.}
terminal_states:
  - Done
  - Rejected
  - RolledBack
  - Failed
signals:
  - {name: Seed, trigger: The apply endpoint starts a request-scoped run.}
  - {name: ToolDone, trigger: A boundary word exited zero.}
  - {name: ToolFailed, trigger: A boundary word exited non-zero.}
transitions:
  - {state: AwaitingRequest,   signal: Seed,       next: Writing,           action: write_overrides}
  - {state: Writing,           signal: ToolDone,   next: Validating,        action: helm_dry_run}
  - {state: Writing,           signal: ToolFailed, next: Failed}
  - {state: Validating,        signal: ToolDone,   next: Applying,          action: helm_upgrade}
  - {state: Validating,        signal: ToolFailed, next: Rejected}
  - {state: Applying,          signal: ToolDone,   next: VerifyingPlanner,  action: kubectl_rollout_status_planner}
  - {state: Applying,          signal: ToolFailed, next: Failed}
  - {state: VerifyingPlanner,  signal: ToolDone,   next: VerifyingExecutor, action: kubectl_rollout_status_executor}
  - {state: VerifyingPlanner,  signal: ToolFailed, next: RollingBack,       action: helm_rollback}
  - {state: VerifyingExecutor, signal: ToolDone,   next: VerifyingCritic,   action: kubectl_rollout_status_critic}
  - {state: VerifyingExecutor, signal: ToolFailed, next: RollingBack,       action: helm_rollback}
  - {state: VerifyingCritic,   signal: ToolDone,   next: Done}
  - {state: VerifyingCritic,   signal: ToolFailed, next: RollingBack,       action: helm_rollback}
  - {state: RollingBack,       signal: ToolDone,   next: RolledBack}
  - {state: RollingBack,       signal: ToolFailed, next: Failed}
