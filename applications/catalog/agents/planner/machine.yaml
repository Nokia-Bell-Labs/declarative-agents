name: planner
purpose: |-
  The planner is a pipeline agent that decomposes a requirement graph
  into tasks, generates implementation plans via LLM, materializes
  them as issues, executes them by invoking the generator profile, and
  validates the results. It loops over the requirement graph until
  all tasks are done, all are blocked, or a batch limit is reached.
configuration:
  machine: agents/planner/machine.yaml
  tools: agents/planner/tools.yaml
  llm_configs: agents/planner/llm/*.yaml
  tool_declarations:
  - tools/builtin.yaml
  - tools/exec.yaml
  - agents/planner/tracker-exec.yaml
  variants:
  - agents/planner/machine-passthrough.yaml
  - agents/planner/machine-plan-only.yaml
invariants:
- Conversation history is reset between tasks
- Each task gets a fresh prompt with SRD context
- Failed tasks can be retried before moving on
- Graph nodes are marked done/failed to track progress
- The planner terminates when no more tasks are extractable
lifecycle: |-
  1. Idle → Extracting: extract_task from requirement graph
  2. Extracting → InitializingRetry → Resetting: seed visible retry count, clear LLM history
  3. Resetting → PromptAssembly: assemble_prompt with SRD context
  4. PromptAssembly → PlanInvoking: invoke_llm for plan generation
  5. PlanInvoking → PlanParsing: parse_plan from LLM response; invalid plans
     are reported and reinvoked until the explicit parse budget is exhausted
  6. PlanParsing → IssueFormatting → IssueBodyWriting: format_issue then write
  7. IssueBodyWriting → IssueCreating → IssueRecording: selected tracker exec then record_tracker_issue
  8. IssueRecording → Executing: execute_task (run generator profile)
  9. Executing → Vetting → Building → Testing: validation pipeline
  10. Validation failure → IncrementingRetry → CheckingRetryLimit
  11. RetryAvailable → Resetting; RetriesExhausted → Exhausted → remaining-work routing
  12. Testing success → MarkingTaskDone → QueryingRemainingWork

  The outer loop (Extracting → ... → QueryingRemainingWork → Extracting)
  repeats until the graph is fully resolved.
pipeline_diagram: |-
  ```mermaid
  flowchart TD
    A[Idle] -->|Seed| B[Extracting]
    B -->|TaskExtracted| Z[InitializingRetry]
    Z --> C[Resetting]
    C --> D[PromptAssembly]
    D --> E[PlanInvoking]
    E --> F[PlanParsing]
    F -->|ParseFailed| RPE[Report Parse Error]
    RPE -->|ToolDone| E
    RPE -->|BudgetExhausted| FAIL[Failed]
    F --> G[Format / Write / Tracker Exec / Record]
    G --> H[Executing]
    H --> I[Vet / Build / Test]
    I -->|Success| J[MarkingTaskDone]
    J --> Q[QueryingRemainingWork]
    Q -->|WorkRemaining| B
    I -->|Failure| R[IncrementingRetry]
    R --> P[CheckingRetryLimit]
    P -->|RetryAvailable| C
    P -->|RetriesExhausted| X[Exhausted]
    X --> Q
    B -->|AllDone| K[Completed]
    B -->|AllBlocked| L[Stalled]
    B -->|BatchLimit| M[Paused]
  ```
initial_state: Idle
budget:
  max_consecutive_parse_errors: 5
states:
- name: Idle
  meaning: Initial state before planning begins.
- name: Loading
  meaning: Loading the specification corpus and building the requirement graph.
- name: Extracting
  meaning: |
    Selecting the next ready task from the requirement graph.
    May terminate if all tasks are done, blocked, or batch limit reached.
- name: InitializingRetry
  meaning: Seeding retry count zero in labelled command state for the extracted task.
- name: Resetting
  meaning: Clearing conversation history before a new task's LLM call.
- name: PromptAssembly
  meaning: Building the task context and SRD references into a prompt.
- name: PlanInvoking
  meaning: Calling the LLM to generate an implementation plan.
- name: PlanParsing
  meaning: Parsing the LLM response as a YAML implementation plan.
- name: ReportingParseError
  meaning: Feeding an invalid plan response back to the LLM and tracking the explicit parse retry budget.
- name: IssueFormatting
  meaning: Formatting the parsed plan as tracker-neutral issue parameters.
- name: IssueBodyWriting
  meaning: Writing the issue body to the configured workspace file.
- name: IssueCreating
  meaning: Creating an issue through the tracker exec word selected by the profile.
- name: IssueRecording
  meaning: Recording the configured tracker's issue ID in planner state.
- name: Executing
  meaning: Running the generator profile to implement the task.
- name: Vetting
  meaning: Running go vet on the workspace.
- name: Building
  meaning: Running go build on the workspace.
- name: Testing
  meaning: Running go test on the workspace.
- name: IncrementingRetry
  meaning: Incrementing the latest labelled retry count with jq.
- name: CheckingRetryLimit
  meaning: Comparing the visible retry count with the declared limit.
- name: Exhausted
  meaning: Retry limit reached; query the graph before routing onward.
- name: MarkingTaskDone
  meaning: Mutating only the successfully validated task's graph nodes to Done.
- name: QueryingRemainingWork
  meaning: Reading graph state so the machine can route ready, done, or blocked work.
- name: Completed
  meaning: Terminal. All tasks in the graph are done.
- name: Stalled
  meaning: Terminal. Remaining tasks are blocked by failed dependencies.
- name: Paused
  meaning: Terminal. Batch limit reached — resume later.
- name: Failed
  meaning: Terminal. An unrecoverable error occurred.
terminal_states:
- Completed
- Stalled
- Paused
- Failed
signals:
- name: Seed
  trigger: Loop initialization.
- name: GraphLoaded
  trigger: The requirement graph was loaded and seeded into pipeline state.
- name: TaskExtracted
  trigger: A task was extracted from the requirement graph.
- name: RetryCountInitialized
  trigger: Retry count zero was recorded in labelled command state.
- name: AllDone
  trigger: All tasks in the graph are done.
- name: Blocked
  trigger: Remaining tasks are blocked by failed dependencies.
- name: BatchLimitReached
  trigger: Batch limit reached — resume later.
- name: ToolDone
  trigger: A tool executed successfully.
- name: ToolFailed
  trigger: A tool executed but reported failure.
- name: LLMResponded
  trigger: The LLM returned a response.
- name: PlanReady
  trigger: The LLM response was parsed as a valid implementation plan.
- name: IssueFormatted
  trigger: Planner state was serialized as tracker-neutral issue parameters.
- name: ParseFailed
  trigger: The LLM response could not be parsed as a valid plan.
- name: BudgetExhausted
  trigger: The configured consecutive parse-error retry limit was reached.
- name: Materialized
  trigger: An issue was created from the plan.
- name: ExecutionDone
  trigger: The generator agent completed successfully.
- name: ExecutionFailed
  trigger: The generator agent failed.
- name: RetryAvailable
  trigger: Retries remain for the current task.
- name: RetriesExhausted
  trigger: All retries consumed for the current task.
- name: TaskCompleted
  trigger: The current task's graph nodes were marked Done.
- name: WorkRemaining
  trigger: At least one graph task is ready for extraction.
- name: CommandError
  trigger: Infrastructure-level error.
