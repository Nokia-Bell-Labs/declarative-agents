name: people-unreview
purpose: |-
  Take a person off signing off on a scrum or document in control/people.md
  (srd013). Use only when a person asks; an agent never changes a reviewer on
  its own.

  This machine has no model state: scrum-master people unreview (design.md D10,
  D14; GH-2869). The run starts in the system repository's checkout, or one
  beside it, and its request names the person.
configuration:
  machine: plugin/agents/people-unreview/machine.yaml
  tools: plugin/agents/people-unreview/tools.yaml
invariants:
- Every step is a word; no model acts anywhere in this machine
- A refusal ends the run in the state that names it, with the word's reason
lifecycle: |-
  1. Idle → Unreview (Seed): scrum-master people unreview
  2. Unreview → Done (ToolDone)
initial_state: Idle
budget:
  command_timeout: 16m
  max_iterations: 10
states:
- name: Idle
  meaning: Initial state before the first word.
- name: Unreview
  meaning: |
    The unreview word: scrum-master people unreview takes the person off in
    control/people.md, and a person on nothing leaves the document.
- name: Done
  run_status: succeeded
  meaning: |
    Terminal. Every word ran, and the last one reported what it did.
- name: Refused
  run_status: failed
  meaning: |
    Terminal. The word refused — no scrum or document was named, or no system
    repository's checkout is at or beside the directory — and its reason is the
    run's last output.
- name: Failed
  run_status: failed
  meaning: Terminal. An infrastructure error outside the words' refusals.
terminal_states:
- Done
- Refused
- Failed
signals:
- name: Seed
  trigger: Loop initialization.
- name: ToolDone
  trigger: A word executed successfully.
- name: ToolFailed
  trigger: A word reported failure — a refusal with its reason.
- name: CommandError
  trigger: Infrastructure-level error (not a tool failure).
transitions:
- state: Idle
  signal: Seed
  next: Unreview
  action: people_unreview
  summary: true
- state: Unreview
  signal: ToolFailed
  next: Refused
- state: Unreview
  signal: ToolDone
  next: Done
- state: Idle
  signal: CommandError
  next: Failed
- state: Unreview
  signal: CommandError
  next: Failed
