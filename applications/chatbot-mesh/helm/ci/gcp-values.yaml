# GKE values for the unmodified chart (eng08). Everything environment-shaped
# lives here: image paths at the project registry and the donor mirror pin,
# nothing else. The registry segment region-docker.pkg.dev/project/agents is
# a placeholder in the checked-in file; mage gcp:deploy resolves the real
# path from gcp.yaml and the pushed commit revision through the same
# overrides document the kind deploy writes, so this file never carries a
# project id or a moving tag.
image:
  repository: region-docker.pkg.dev/project/agents/agent-core
  # mage gcp:deploy always overrides this fail-closed sentinel with the
  # pushed checkout's 12-character commit revision (eng01: never latest).
  tag: must-be-overridden-with-git-revision
  pullPolicy: IfNotPresent

collector:
  image:
    repository: region-docker.pkg.dev/project/agents/agent-core
    tag: must-be-overridden-with-git-revision
    pullPolicy: IfNotPresent

applier:
  enabled: true
  image:
    repository: region-docker.pkg.dev/project/agents/agent-core
    tag: must-be-overridden-with-git-revision
    pullPolicy: IfNotPresent
  # The CLI donor is pulled from the project registry, never Docker Hub:
  # enterprise GKE nodes are commonly barred from it (eng08). mage
  # gcp:mirrorDonor copies the manifest list byte-identically, so this
  # digest is the mirror's as well as the upstream source's and needs no
  # edit after mirroring; only the repository path resolves per deployment
  # (GH-2437).
  cliDonor:
    image:
      repository: region-docker.pkg.dev/project/agents/cli-donor
      tag: "1.31.4"
      digest: "sha256:9c4976d47656d78cf53a92b0203fc54ac45eae18a2b45001ac221c27da4c8036"
      pullPolicy: IfNotPresent

# The models are pulled from upstream on GKE, where no seeded host cache
# exists: the three the release declares are about 12.2GB resident, and a
# blob downloads beside the one being written. The chart default of 10Gi is
# sized for the kind path, where models arrive from the cache, and it fills
# mid-pull — the preload Job exhausts its backoff limit and every rag agent
# waits forever on wait-for-llm-models (GH-2453).
ollama:
  persistence:
    size: 40Gi
