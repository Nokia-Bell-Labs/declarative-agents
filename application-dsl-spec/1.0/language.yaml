    target: runtime
    level: MUST
    statement: >-
      A conforming runtime MUST apply the startup checks to every
      machine-instance the agent-profile's closure reaches -- the
      machine-instances of child agent-profiles and of nested in-process runs
      included -- and MUST refuse to start when any reached machine-instance
      fails them.
