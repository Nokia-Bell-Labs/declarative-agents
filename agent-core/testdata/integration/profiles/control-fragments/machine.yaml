name: core-control-fragments
purpose: Prove a fragment instantiated twice drives the same control flow as hand-written declarations.
initial_state: Idle
budget:
  command_timeout: 1m
  max_iterations: 5
states:
  - {name: Idle, meaning: Initial state.}
  - {name: Launching, meaning: Starting the control server.}
  - {name: Awaiting, meaning: Waiting for an exit request.}
  - {name: Exiting, meaning: Dispatching exit_agent.}
  - {name: Retrying, meaning: Relaunching the control server with a patient await.}
  - {name: Patient, meaning: Waiting longer for an exit request.}
  - {name: Succeeded, meaning: Terminal success., run_status: succeeded}
  - {name: Failed, meaning: Terminal failure., run_status: failed}
terminal_states: [Succeeded, Failed]
signals:
  - {name: Seed, trigger: Loop initialization.}
  - {name: ServerLaunched, trigger: Control server started.}
  - {name: ExitRequested, trigger: Operator requested exit.}
  - {name: AwaitTimedOut, trigger: No event arrived.}
  - {name: ServerStopped, trigger: Server stopped.}
  - {name: AgentExited, trigger: exit_agent requested shutdown.}
  - {name: CommandError, trigger: Runtime failure.}
transitions:
  - {state: Idle, signal: Seed, next: Launching, action: primary_launch_agent_control}
  - {state: Launching, signal: ServerLaunched, next: Awaiting, action: primary_await_agent_control}
  - {state: Launching, signal: CommandError, next: Failed}
  - {state: Awaiting, signal: ExitRequested, next: Exiting, action: exit_agent}
  - {state: Awaiting, signal: AwaitTimedOut, next: Retrying, action: patient_launch_agent_control}
  - {state: Awaiting, signal: ServerStopped, next: Failed}
  - {state: Awaiting, signal: CommandError, next: Failed}
  - {state: Exiting, signal: AgentExited, next: Succeeded}
  - {state: Exiting, signal: CommandError, next: Failed}
  - {state: Retrying, signal: ServerLaunched, next: Patient, action: patient_await_agent_control}
  - {state: Retrying, signal: CommandError, next: Failed}
  - {state: Patient, signal: ExitRequested, next: Exiting, action: exit_agent}
  - {state: Patient, signal: AwaitTimedOut, next: Failed}
  - {state: Patient, signal: ServerStopped, next: Failed}
  - {state: Patient, signal: CommandError, next: Failed}
