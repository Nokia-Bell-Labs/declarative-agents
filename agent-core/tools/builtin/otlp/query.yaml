# Read traces and metrics back out of the spool.
unit: builtin-otlp-query
tools:
- name: spool_list_traces
  type: builtin
  init: spool_list_traces
  category: boundary
  visibility: internal
  signature:
    emits: [TracesListed, CommandError]
  description: Read the NDJSON trace spool and return paginated trace summaries, newest first.
  parameters: {type: object, properties: {}}
  output:
    description: Paginated trace summaries and spool health metadata.
    schema:
      type: object
      properties:
        traces:
          type: array
          items:
            type: object
            properties:
              trace_id: {type: string}
              root_service: {type: string}
              root_span_name: {type: string}
              span_count: {type: integer}
              start_time: {type: string}
              duration_ms: {type: integer}
        total: {type: integer}
        offset: {type: integer}
        page_size: {type: integer}
        skipped_lines: {type: integer}
        storage_status: {type: string, description: complete, partial, or unavailable; a bucket outage never labels WAL-only history complete (srd042 R6).}
      required: [traces, total, offset, page_size, skipped_lines, storage_status]
  side_effects:
  - kind: filesystem_read
    target: configured spool path and rotated files
    state: read_only
  reversibility:
    classification: reversible
  undo:
    strategy: noop
    description: Reading a spool changes nothing.
  errors:
  - signal: CommandError
    condition: the configured spool path cannot be read
    message_shape: 'tool <name>: <cause>'
    state_after_failure: no output is returned
  config:
    path: traces/collector.ndjson
    page_size: 20
    max_page_size: 100
    offset: 0
    # Optional object read backend (srd042 R1, R3): reads the configured
    # application bucket, bounded by object count, bytes, and deadline. Bucket,
    # endpoint, and prefix are configuration only; no request field redirects it.
    storage: {backend: filesystem, bucket_url: "", endpoint: "", prefix: traces, wal_path: "", max_objects: 500, max_bytes: 67108864}
- name: spool_get_trace
  type: builtin
  init: spool_get_trace
  category: boundary
  visibility: internal
  signature:
    emits: [TraceRetrieved, CommandError]
  description: Read all spans for one trace from the NDJSON spool, returning the fields a waterfall UI needs.
  parameters: {type: object, properties: {}}
  output:
    description: All spans for one trace with waterfall fields.
    schema:
      type: object
      properties:
        trace_id: {type: string}
        spans:
          type: array
          items:
            type: object
            properties:
              span_id: {type: string}
              parent_span_id: {type: string}
              service: {type: string}
              name: {type: string}
              start_time: {type: string}
              end_time: {type: string}
              status:
                type: object
                properties:
                  code: {type: integer}
                  description: {type: string}
              attributes: {type: array}
        span_count: {type: integer}
        skipped_lines: {type: integer}
        storage_status: {type: string}
      required: [trace_id, spans, span_count, skipped_lines, storage_status]
  side_effects:
  - kind: filesystem_read
    target: configured spool path and rotated files
    state: read_only
  reversibility:
    classification: reversible
  undo:
    strategy: noop
    description: Reading a spool changes nothing.
  errors:
  - signal: CommandError
    condition: trace id is missing or the configured spool path cannot be read
    message_shape: 'tool <name>: <cause>'
    state_after_failure: no output is returned
  config:
    path: traces/collector.ndjson
    trace_id: ""
    storage: {backend: filesystem, bucket_url: "", endpoint: "", prefix: traces, wal_path: "", max_objects: 500, max_bytes: 67108864}
- name: spool_list_metrics
  type: builtin
  init: spool_list_metrics
  category: boundary
  visibility: internal
  signature:
    emits: [MetricsListed, CommandError]
  description: Read the NDJSON metric spool and return paginated metric summaries by name.
  parameters: {type: object, properties: {}}
  output:
    description: Paginated metric summaries and spool health metadata.
    schema:
      type: object
      properties:
        metrics:
          type: array
          items:
            type: object
            properties:
              name: {type: string}
              type: {type: string}
              unit: {type: string}
              record_count: {type: integer}
              data_point_count: {type: integer}
              services: {type: array}
        total: {type: integer}
        offset: {type: integer}
        page_size: {type: integer}
        skipped_lines: {type: integer}
        storage_status: {type: string}
      required: [metrics, total, offset, page_size, skipped_lines, storage_status]
  side_effects:
  - kind: filesystem_read
    target: configured metric spool path and rotated files
    state: read_only
  reversibility:
    classification: reversible
  undo:
    strategy: noop
    description: Reading a spool changes nothing.
  errors:
  - signal: CommandError
    condition: the configured metric spool path cannot be read
    message_shape: 'tool <name>: <cause>'
    state_after_failure: no output is returned
  config:
    path: metrics/collector.ndjson
    page_size: 20
    max_page_size: 100
    offset: 0
    storage: {backend: filesystem, bucket_url: "", endpoint: "", prefix: metrics, wal_path: "", max_objects: 500, max_bytes: 67108864}
- name: spool_get_metric
  type: builtin
  init: spool_get_metric
  category: boundary
  visibility: internal
  signature:
    emits: [MetricRetrieved, CommandError]
  description: Read one bounded page of spooled records for one metric name from the NDJSON metric spool.
  parameters: {type: object, properties: {}}
  output:
    description: One bounded page of spooled records for one metric name; total reports all matching records.
    schema:
      type: object
      properties:
        metric_name: {type: string}
        records:
          type: array
          items:
            type: object
            properties:
              name: {type: string}
              type: {type: string}
              unit: {type: string}
              data_point_count: {type: integer}
              service: {type: string}
              resource:
                type: array
                items: {type: object}
              metric: {type: object}
        record_count: {type: integer}
        page_record_count: {type: integer}
        total: {type: integer}
        data_point_count: {type: integer}
        offset: {type: integer}
        page_size: {type: integer}
        skipped_lines: {type: integer}
        storage_status: {type: string}
      required: [metric_name, records, record_count, page_record_count, total, data_point_count, offset, page_size, skipped_lines, storage_status]
  side_effects:
  - kind: filesystem_read
    target: configured metric spool path and rotated files
    state: read_only
  reversibility:
    classification: reversible
  undo:
    strategy: noop
    description: Reading a spool changes nothing.
  errors:
  - signal: CommandError
    condition: metric name is missing or the configured metric spool path cannot be read
    message_shape: 'tool <name>: <cause>'
    state_after_failure: no output is returned
  config:
    path: metrics/collector.ndjson
    metric_name: ""
    page_size: 20
    max_page_size: 100
    offset: 0
    storage: {backend: filesystem, bucket_url: "", endpoint: "", prefix: metrics, wal_path: "", max_objects: 500, max_bytes: 67108864}
