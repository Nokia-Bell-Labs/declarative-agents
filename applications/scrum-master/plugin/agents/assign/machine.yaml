name: assign
purpose: |-
  Assign an issue to someone, for them to pop (srd013). Use only when a
  person asks to assign an issue, after confirming with them which issue
  and which person; an agent never assigns anyone on its own (srd041).

  This machine has no model state: scrum-master issue assign (design.md
  D10, D14; GH-2866). SCRUM_MASTER_PROJECT and SCRUM_MASTER_ISSUE name the
  issue, and the run's request names the person.
configuration:
  machine: plugin/agents/assign/machine.yaml
  tools: plugin/agents/assign/tools.yaml
invariants:
- Every step is a word; no model acts anywhere in this machine
- A refusal ends the run in the state that names it, with the word's reason
lifecycle: |-
  1. Idle → Assign (Seed): scrum-master issue assign
  2. Assign → Done (ToolDone)
initial_state: Idle
budget:
  command_timeout: 16m
  max_iterations: 10
states:
- name: Idle
  meaning: Initial state before the first word.
- name: Assign
  meaning: |
    The assign word: scrum-master issue assign sets the assignee and leaves
    the issue for that person to pop; it refuses once work has started.
- name: Done
  run_status: succeeded
  meaning: |
    Terminal. Every word ran, and the last one reported what it did.
- name: Refused
  run_status: failed
  meaning: |
    Terminal. The assignment was refused — work has started, naming the
    assignee, or the issue is closed — and the word's reason is the run's
    last output.
- name: Failed
  run_status: failed
  meaning: Terminal. An infrastructure error outside the words' refusals.
terminal_states:
- Done
- Refused
- Failed
signals:
- name: Seed
  trigger: Loop initialization.
- name: ToolDone
  trigger: A word executed successfully.
- name: ToolFailed
  trigger: A word reported failure — a refusal with its reason.
- name: CommandError
  trigger: Infrastructure-level error (not a tool failure).
transitions:
- state: Idle
  signal: Seed
  next: Assign
  action: issue_assign
  summary: true
- state: Assign
  signal: ToolFailed
  next: Refused
- state: Assign
  signal: ToolDone
  next: Done
- state: Idle
  signal: CommandError
  next: Failed
- state: Assign
  signal: CommandError
  next: Failed
