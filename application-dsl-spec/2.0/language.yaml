        note: >-
          No test in this repository anchors this statement; the engine in
          this repository implements the 1.0 language.

  - id: R-MACH-024
    target: specification
    level: MUST
    statement: >-
      A `for_each` MAY carry `expect`, which holds each element's result to
      it as the element completes, in sequential and parallel mode; under
      `dispatch`, every field path `where` names MUST exist in each row's
      decided output type. Its `otherwise.signal` MUST be named in
      `continue_on`, `abort_on`, or `fail_on`: a miss is the element's
      outcome under the declared failure policy, and `next` need not route
      it. Under `quarantine` the element's step keeps its body and is
      withheld as R-MACH-023 states, its join outcome carries the mismatch
      report and a `quarantined` flag in place of the output, and the join
      records a `quarantined` count; the join signals keep their meaning.
      An approval releases element quarantines without rewriting a
      recorded join, and a resumed fan-out keeps the quarantines its
      checkpoint recorded.
