# The draft profile's model binding: the model acts only in the Converse
# state (design.md D10), reading SCRUM_MASTER_MODEL, SCRUM_MASTER_RESPONSE_PROFILE, and
# OLLAMA_URL with the defaults the parent's executor ships (srd043 R4.7).
unit: scrum-master-draft-llm-default
imports:
- /opt/agent-core/tools/units/types-core.yaml
tools:
- name: invoke_llm
  type: builtin
  init: invoke_llm
  visibility: internal
  signature:
    emits: [LLMResponded, CommandError]
  description: Invoke the model with the current conversation history.
  category: boundary
  output:
    description: Raw model response text.
    schema:
      type: string
  side_effects:
  - kind: external_api_call
    target: llm_provider
    description: Sends the current prompt and tool manifest to the configured model provider.
  - kind: state_mutation
    target: conversation_history
    state: appended
    description: Appends the model response to the in-memory conversation history.
  reversibility:
    classification: reversible
    requires_confirmation: false
  undo:
    strategy: conversation_truncate
    description: Restore the conversation history checkpoint captured before invoking the model.
    requires: [conversation_checkpoint]
  errors:
  - signal: CommandError
    condition: provider configuration is invalid or the model call fails
    message_shape: 'invoke_llm: <provider/model>: <error>'
    state_after_failure: conversation history unchanged unless the provider response was already appended
  config:
    model: ${SCRUM_MASTER_MODEL:-qwen3.6:35b-mlx}
    dialect: /opt/providers/chat-dialect.yaml
    provider_url: ${OLLAMA_URL:-http://localhost:11434}
    manifest_state: Converse
    response_profile: ${SCRUM_MASTER_RESPONSE_PROFILE:-qwen}
    max_time: 600
    system_prompt: |
      You are the draft workflow of scrum-master: one planning or engineering document,
      written in conversation with its owner. scrum-master reads and checks the
      hierarchy; you write only the document and iterate on it with the person
      (design.md D10, srd046).

      The hierarchy listing opened the run. Read the level's fields in
      docs/constitutions/design.md. Say what you understood the item to be and
      propose its id, title, and parent; name overlaps and a scope wrong for the
      level. Ask only what the description and the repository leave open, at
      most five questions at a time, each with your recommended answer; write
      nothing until the person answers or says to use your recommendations.
      Write the document at the level's location with status to_be_agreed (an
      engineering document has no status; name it in ARCHITECTURE.md's related
      documents), run backlog_check, and fix every finding. Show the
      document and revise it with the person, checking after each revision.
      Offer the next level down.

      Constraints:
      - Never set another status, commit, or merge: the document reaches main
        through the repository's own issue
      - Never estimate, rank, or assign a person; the person gives points and
        rank

      Call done with the document's path, its check verdict, and the children
      you offered.

- name: parse_response
  type: builtin
  contract: legacy
  init: parse_response
  visibility: internal
  description: Parse raw model output into a tool call or task-completed signal.
  signature:
    output: builtin-types-core.Text
    emits: [ToolDone, TaskCompleted, ParseFailed, CommandError]
  category: word
  side_effects:
  - kind: command_state
    description: Parses the prior command output and may reset the parse retry counter after a non-ParseFailed result.
  undo:
    strategy: parse_retry_counter_restore
    description: Restores the parse retry counter snapshot captured before parsing.
  errors:
  - signal: CommandError
    condition: required input, configuration, or runtime state is invalid
    message_shape: 'parse_response: <error>'
    state_after_failure: no additional workflow step is executed by this tool
  output:
    description: Parsed tool-request JSON or a plain completion summary.
  config:
    manifest_state: Converse
