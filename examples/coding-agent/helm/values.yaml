# One profile-free runtime image executes every role. Profiles are generated by
# `mage helmPrepare` from the #875 package and mounted read-only at /profiles.
image:
  repository: ghcr.io/nokia-bell-labs/declarative-agents/agent-core
  tag: "0.1.0"
  pullPolicy: IfNotPresent

profiles:
  mountPath: /profiles

workspace:
  mountPath: /work
  existingClaim: ""
  storageClass: ""
  accessModes: [ReadWriteMany]
  size: 5Gi

roles:
  planner:
    replicas: 1
    requestPort: 18200
    controlPort: 18201
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {cpu: "2", memory: 2Gi}
  executor:
    replicas: 1
    requestPort: 18210
    controlPort: 18211
    resources:
      requests: {cpu: 250m, memory: 512Mi}
      limits: {cpu: "4", memory: 4Gi}
  critic:
    replicas: 1
    requestPort: 18220
    controlPort: 18221
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {cpu: "2", memory: 2Gi}

# Planner and executor canonical declarations read OLLAMA_URL. The chart-owned
# tier is optional; disabling it uses the fixed external endpoint below.
llm:
  externalURL: http://ollama.default.svc.cluster.local:11434
  port: 11434

ollama:
  enabled: false
  image: {repository: ollama/ollama, tag: latest, pullPolicy: IfNotPresent}
  utilityImage: busybox:1.36
  models: ["qwen3.6:35b-mlx"]
  persistence:
    storageClass: ""
    size: 25Gi
  resources:
    requests: {cpu: "1", memory: 4Gi}
    limits: {cpu: "8", memory: 32Gi}
  gpu:
    count: 0
  nodeSelector: {}
  tolerations: []

collector:
  enabled: true
  image:
    repository: otel/opentelemetry-collector-contrib
    tag: "0.127.0"
    pullPolicy: IfNotPresent
  otlpGRPCPort: 4317
  otlpHTTPPort: 4318
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {cpu: 500m, memory: 512Mi}

jaeger:
  enabled: true
  image:
    repository: jaegertracing/all-in-one
    tag: "1.62.0"
    pullPolicy: IfNotPresent
  otlpGRPCPort: 4317
  queryPort: 16686
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {cpu: "1", memory: 1Gi}

podSecurityContext:
  runAsNonRoot: true
  seccompProfile: {type: RuntimeDefault}

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
