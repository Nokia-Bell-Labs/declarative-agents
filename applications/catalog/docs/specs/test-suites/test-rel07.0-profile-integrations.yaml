id: test-rel07.0-profile-integrations
title: Test Suite for Release 07.0 Profile Integrations
release: "07.0"

overview: |
  This suite defines profile-owned tracer bullets for concrete state machines
  and cross-profile boundaries. Release 06.0 proved that profiles can live in
  this repository and be consumed by agent-core. Release 07.0 proves the
  documentation-curator UX, bench-to-critic, and monitor/control relationships.
  The retired evaluator-to-generator and planner-to-generator entries preserve
  traceability to application-owned replacements; they are not implemented
  library evidence.

  The suite deliberately separates implemented, planned, and blocked evidence.
  A tracer is implemented only when applications/catalog owns the target, fixtures,
  and expected output evidence. Planned entries name target contracts and
  follow-up issues. Blocked entries must name the missing profile asset or
  fixture rather than accepting a fake pass.

traces:
  - rel07.0-uc001-documentation-curator-profile-ux
  - rel07.0-uc002-evaluator-generator-profile-boundary
  - rel07.0-uc003-planner-generator-profile-boundary
  - rel07.0-uc004-bench-evaluator-profile-boundary
  - rel07.0-uc005-monitor-control-profile-boundary

preconditions:
  - agent-core is available as AGENT_CORE_ROOT or as a sibling ../../agent-core checkout.
  - applications/catalog owns all profile paths, fixtures, suites, and expected outputs named by the tracer.
  - Integration targets load concrete profiles through the demo.yaml catalog_root or repository-relative paths.
  - agent-core remains responsible only for runtime execution and builtin capabilities.

test_cases:
  - use_case: rel07.0-uc001-documentation-curator-profile-ux
    name: Documentation curator profile UX and lifecycle tracer
    follow_up_issue: "#107"
    integration_target: mage integration:documentationCurator
    go_test: go test ./magefiles -run 'TestPrepareDocumentationCuratorIntegration(WritesEphemeralProfile|CleansUpAfterFailure)|TestDocumentationActionEndpointsUseMachineRequestBinding|TestDocumentationPatchDecisionClientsMapMissingPatches'
    status: implemented
    description: |
      Run the concrete Knowledge Manager/documentation-curator proof from
      applications/catalog. The target runs the shipped profile through an ephemeral
      profile overlay, proves machine_request document and curator-action routes,
      serves profile-owned UI assets, records trace metadata, and shuts down
      through lifecycle control.
    inputs:
      profile: agents/knowledge-manager/documentation-curator/profile.yaml
      ux_config: agents/knowledge-manager/documentation-curator/ui/ux.yaml
      request_machine: agents/knowledge-manager/documentation-curator/request-machine.yaml
      fixture_docs: testdata/integration/rel07-documentation-curator/
    expected:
      terminal_signal: DocumentDetailReady
      action_terminal_signal: RESTResponded
      missing_patch_terminal_signal: RESTMissing
      legacy_action_envelope_used: false
      trace_fields: [server, route, machine, terminal_signal, status]
      lifecycle_signal: ExitRequested
      terminal_state: Done
      listener_released: true
      runtime_state_root: temporary integration workspace
      release_checkout_clean: true
      target_owner: applications/catalog
    traces:
      - rel07.0-uc001-documentation-curator-profile-ux S1
      - rel07.0-uc001-documentation-curator-profile-ux S2
      - rel07.0-uc001-documentation-curator-profile-ux S3
      - rel07.0-uc001-documentation-curator-profile-ux S4
      - rel07.0-uc001-documentation-curator-profile-ux S5
      - sm-agent-role-taxonomy documentation-curator

  - use_case: rel07.0-uc002-evaluator-generator-profile-boundary
    name: Evaluator-to-generator boundary retired from library integration
    follow_up_issue: "#108"
    replacement_target: applications/coding-agent mage integration:criticGate
    status: planned
    description: |
      The former target used writeGeneratorChildAgent, a shell binary that
      fabricated both the workspace edit and token trace. It is retired rather
      than retained as a library contract because those artifacts did not prove
      the declared child profile. The application-owned critic target now uses
      the real built agent binary and canonical executor profile. Its current
      profile-contract limitation remains planned rather than passed evidence.
    inputs:
      evaluator_profile: agents/critic/profile.yaml
      subject_profile: agents/executor/profile.yaml
      suite: testdata/integration/rel07-evaluator-generator/suite.yaml
      expected_summary: testdata/integration/rel07-evaluator-generator/expected/summary.yaml
      output_dir: temporary evaluator results directory
    expected:
      child_profile: generator
      point_status_recorded: true
      session_summary_recorded: true
      oracle_accounting_recorded: true
      target_owner: applications/coding-agent
    traces:
      - rel07.0-uc002-evaluator-generator-profile-boundary S1
      - rel07.0-uc002-evaluator-generator-profile-boundary S2
      - rel07.0-uc002-evaluator-generator-profile-boundary S3
      - sm-multi-agent-profile-system dependency_directions evaluator->generator

  - use_case: rel07.0-uc003-planner-generator-profile-boundary
    name: Planner-to-generator boundary retired from library integration
    follow_up_issue: "#109"
    replacement_target: applications/coding-agent mage integration:plannerDelegation
    status: planned
    coverage: application-live
    description: |
      The former target synthesized materialization in Mage and delegated to the
      same shell fake as the evaluator tracer. It is retired because it was not
      an accurate cheap contract for the shipped planner. The application-owned
      replacement runs the canonical planner, a disposable local tracker, and
      the canonical executor through the real built agent binary.
    inputs:
      planner_profile: agents/planner/profile.yaml
      child_profile: agents/executor/profile.yaml
      graph_fixture: testdata/integration/rel07-planner-generator/graph.yaml
      workspace: testdata/integration/rel07-planner-generator/workspace
      expected_terminal_state: testdata/integration/rel07-planner-generator/expected/terminal-state.yaml
    expected:
      materialized_task_count: 1
      child_profile: generator
      graph_terminal_state_recorded: true
      child_run_outcome_recorded: true
      target_owner: applications/coding-agent
    traces:
      - rel07.0-uc003-planner-generator-profile-boundary S1
      - rel07.0-uc003-planner-generator-profile-boundary S2
      - rel07.0-uc003-planner-generator-profile-boundary S3
      - sm-multi-agent-profile-system dependency_directions planner->generator

  - use_case: rel07.0-uc004-bench-evaluator-profile-boundary
    name: Bench launches critic from a human action
    follow_up_issue: "#110"
    integration_target: mage integration:benchEvaluator
    go_test: go test ./conformance -run TestBenchConformance
    status: implemented
    description: |
      Run the shipped bench wrapper through agent-core, send a fixture operator
      action to its real REST/machine boundary, and observe the running profile
      dispatch the configured critic child. The controlled child records only
      the arguments the profile supplied; it does not fabricate bench evidence.
    inputs:
      bench_profile: agents/bench/profile.yaml
      critic_profile: agents/critic/profile.yaml
      launch_action: '{"type":"launch_eval","config":{"suite":"suites/basic.yaml","output_dir":"eval-results"}}'
    expected:
      human_action_received: true
      critic_profile_dispatched: true
      real_rest_machine_path_executed: true
      shipped_profile_trace_observed: true
      target_owner: applications/catalog
    traces:
      - rel07.0-uc004-bench-evaluator-profile-boundary S1
      - rel07.0-uc004-bench-evaluator-profile-boundary S2
      - rel07.0-uc004-bench-evaluator-profile-boundary S3
      - sm-multi-agent-profile-system dependency_directions bench->critic

  - use_case: rel07.0-uc005-monitor-control-profile-boundary
    name: Runtime state reader and control profile boundary
    follow_up_issue: "#111"
    integration_target: mage integration:monitorControl
    go_test: go test ./magefiles -run TestCollectMonitorControlEvidenceRecordsRoutesAndLifecycleBoundary
    status: implemented
    description: |
      Record profile-owned runtime-state-reader/control boundary evidence from
      the concrete adapter and control YAML assets. This is load-and-wiring
      evidence: the target proves monitor state routes,
      control exit routes, emit_signal HTTP boundaries, MachineSpec lifecycle
      routing, and the declared monitor stop transition. Runtime listener
      shutdown is exercised by the separate monitor conformance test.
    inputs:
      runtime_state_reader_profile: agents/runtime-state-reader/profile.yaml
      control_profile: testdata/conformance/control/profile.yaml
      expected_evidence: testdata/integration/rel07-monitor-control/expected/evidence.yaml
    expected:
      monitor_state_exposed: true
      lifecycle_signal_routed: true
      monitor_stop_transition_declared: true
      http_handlers_enqueue_only: true
      target_owner: applications/catalog
    traces:
      - rel07.0-uc005-monitor-control-profile-boundary S1
      - rel07.0-uc005-monitor-control-profile-boundary S2
      - rel07.0-uc005-monitor-control-profile-boundary S3
      - sm-agent-role-taxonomy runtime-state-reader
      - sm-agent-role-taxonomy control
