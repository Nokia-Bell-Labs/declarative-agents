rest:
  version: v1
  auth:
    none: {type: none}
  limits:
    role_request:
      timeout: 15m
      read_timeout: 15m
      max_request_bytes: 1048576
      max_response_bytes: 1048576
      redirect: {mode: none}
      network:
        schemes: [http]
        hosts: [127.0.0.1, localhost]
        ports: [18210]
        allow_public_listener: true
    role_control:
      timeout: 30s
      read_timeout: 5s
      max_request_bytes: 16384
      max_response_bytes: 65536
      redirect: {mode: none}
      network:
        schemes: [http]
        hosts: [127.0.0.1, localhost]
        ports: [18211]
        allow_public_listener: true
  servers:
    role_requests:
      address: ${EXECUTOR_BIND_HOST:-127.0.0.1}:18210
      limits_ref: role_request
      shutdown: {timeout: 10s, drain_policy: drain_then_stop}
      endpoints:
        execute:
          method: POST
          path: /api/v1/execute
          binding: machine_request
          request:
            body_schema:
              type: object
              required: [task, workspace_id]
              properties:
                task: {type: string, min_length: 1}
                workspace_id: {type: string, min_length: 1}
          machine_request:
            profile: ../../../agents/executor/profile.yaml
            timeout: 15m
            request:
              body:
                task: $.task
                workspace_id: $.workspace_id
            response:
              terminal_states:
                Succeeded:
                  status: 200
                  content_type: application/json
                  body:
                    status: succeeded
                Failed:
                  status: 422
                  content_type: application/json
                  body:
                    status: failed
                BudgetExceeded:
                  status: 422
                  content_type: application/json
                  body:
                    status: budget_exceeded
    role_control:
      address: ${EXECUTOR_BIND_HOST:-127.0.0.1}:18211
      limits_ref: role_control
      queue: {name: executor_control, capacity: 8, timeout: 30s}
      shutdown: {timeout: 5s, drain_policy: drain_then_stop}
      endpoints:
        exit:
          method: POST
          path: /api/lifecycle/exit
          binding: emit_signal
          signal: ExitRequested
          request:
            body_schema:
              type: object
              properties:
                reason: {type: string}
          response:
            output: {accepted: "true"}
        health:
          method: GET
          path: /api/lifecycle/health
          binding: health
