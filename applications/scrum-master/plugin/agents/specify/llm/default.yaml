# The specify profile's model binding: the model acts only in the Draft
# state (design.md D10), reading SCRUM_MASTER_MODEL, SCRUM_MASTER_RESPONSE_PROFILE, and
# OLLAMA_URL with the defaults the parent's executor ships (srd043 R4.7).
unit: scrum-master-specify-llm-default
imports:
- /opt/agent-core/tools/units/types-core.yaml
tools:
- name: invoke_llm
  type: builtin
  init: invoke_llm
  visibility: internal
  signature:
    emits: [LLMResponded, CommandError]
  description: Invoke the model with the current conversation history.
  category: boundary
  output:
    description: Raw model response text.
    schema:
      type: string
  side_effects:
  - kind: external_api_call
    target: llm_provider
    description: Sends the current prompt and tool manifest to the configured model provider.
  - kind: state_mutation
    target: conversation_history
    state: appended
    description: Appends the model response to the in-memory conversation history.
  reversibility:
    classification: reversible
    requires_confirmation: false
  undo:
    strategy: conversation_truncate
    description: Restore the conversation history checkpoint captured before invoking the model.
    requires: [conversation_checkpoint]
  errors:
  - signal: CommandError
    condition: provider configuration is invalid or the model call fails
    message_shape: 'invoke_llm: <provider/model>: <error>'
    state_after_failure: conversation history unchanged unless the provider response was already appended
  config:
    model: ${SCRUM_MASTER_MODEL:-qwen3.6:35b-mlx}
    dialect: /opt/providers/chat-dialect.yaml
    provider_url: ${OLLAMA_URL:-http://localhost:11434}
    manifest_state: Draft
    response_profile: ${SCRUM_MASTER_RESPONSE_PROFILE:-qwen}
    max_time: 600
    system_prompt: |
      You are the specify workflow of scrum-master: one request becomes one admitted
      issue. scrum-master picks the labels, files, and lints; your one step is writing
      the body (design.md D10, srd035).

      Write the request as a title and a body with ## Requirements (numbered
      steps) and ## Acceptance Criteria, each criterion ending
      (test: <name>; environment: <local|dev|staging>). Add
      ## Design Decisions only for choices already made. Save the body to
      issue.md with the write tool.

      Constraints:
      - List the paths the request changes, as the request names them, and
        pass each as a path parameter of issue_file
      - Ask the person only for what is missing: the kind of project work
        when no path is under docs/ or control/, and the test of a criterion
        that names none; ask nothing else and no confirmation
      - File with issue_file; the word sets the plane, kind, and component
      - When admission did not admit it, fix the body from the reasons and
        run issue_lint
      - Before a body, issue, or document names an ARCHITECTURE component,
        check it with backlog_components; when it is not there, stop and
        answer "this needs a design decision: <component>", naming the design
        skill, and file nothing: planning never invents a component (srd047)

      Call done with the issue's reference, its plane, kind, and component,
      and the admission verdict.

- name: parse_response
  type: builtin
  contract: legacy
  init: parse_response
  visibility: internal
  description: Parse raw model output into a tool call or task-completed signal.
  signature:
    output: builtin-types-core.Text
    emits: [ToolDone, TaskCompleted, ParseFailed, CommandError]
  category: word
  side_effects:
  - kind: command_state
    description: Parses the prior command output and may reset the parse retry counter after a non-ParseFailed result.
  undo:
    strategy: parse_retry_counter_restore
    description: Restores the parse retry counter snapshot captured before parsing.
  errors:
  - signal: CommandError
    condition: required input, configuration, or runtime state is invalid
    message_shape: 'parse_response: <error>'
    state_after_failure: no additional workflow step is executed by this tool
  output:
    description: Parsed tool-request JSON or a plain completion summary.
  config:
    manifest_state: Draft
