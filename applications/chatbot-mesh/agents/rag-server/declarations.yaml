# The RAG server serving lifecycle and its monitor pair. The four lifecycle words
# arrive from the agent-core fragment under this agent's own names, and the
# monitor pair is the agent-core unit every such agent imports; nothing about
# either is written out here.
unit: mesh-rag-server-declarations
imports:
  - /opt/agent-core/tools/units/monitor-rest-declarations.yaml
instantiate:
  - fragment: /opt/agent-core/tools/units/serve-lifecycle-declarations-fragment.yaml
    args:
      agent: "RAG server"
      launch_requests: launch_rag_requests
      launch_control: launch_rag_control
      await_control: await_rag_control
      stop_requests: stop_rag_requests
      requests_rest_ref: chroma_rag_requests
      control_rest_ref: chroma_rag_control
      requests_noun: query
      requests_purpose: for vector-in RAG queries
tools:
