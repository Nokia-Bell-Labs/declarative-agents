# Fixture for R-TOOL-002: two variants share a discriminator value.
kind: tool-declaration
schema_version: 1
unit: union-example-types
types:
  - name: Implement
    schema:
      type: object
      properties:
        kind: {type: string, enum: [implement]}
        path: {type: string}
      required: [kind, path]
  - name: Review
    schema:
      type: object
      properties:
        kind: {type: string, enum: [review]}
        verdict: {type: string}
      required: [kind, verdict]
  - name: Work
    schema:
      type: array
      items:
        oneOf:
          - {$type: union-example-types.Implement}
          - type: object
            properties:
              kind: {type: string, enum: [implement]}
            required: [kind]
        discriminator: kind
