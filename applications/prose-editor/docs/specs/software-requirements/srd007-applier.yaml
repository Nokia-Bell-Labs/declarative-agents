diagrams:
  actuation_machine: |
    ```mermaid
    flowchart LR
      Apply["POST apply (operator or CI caller)"] --> Validate["Validate: helm upgrade dry-run against the chart values schema"]
      Validate -->|Valid| ApplyStep["Apply: helm upgrade reuse-values with overrides file"]
      Validate -->|Invalid| Reject["Client error, no rollout"]
      ApplyStep -->|Applied| Verify["Verify: kubectl rollout status of the Prose Editor role Deployments"]
      ApplyStep -->|CommandError| Failed["Report failed"]
      Verify -->|Healthy| Done["Report applied"]
      Verify -->|Stalled| Rollback["helm rollback"]
      Verify -->|Unreadable| Gateway["Gateway error"]
      Rollback --> RolledBack["Report rolled back"]
    ```
