  - doc: agent-profiles/docs/specs/software-requirements/srd003-critic.yaml
    purpose: Canonical critic family contract.
  - doc: agent-profiles/docs/specs/software-requirements/srd004-planner.yaml
    purpose: Canonical planner family contract.
