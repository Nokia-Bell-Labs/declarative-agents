id: srd002-chatbot-agent
title: Chatbot Agent Functional Block

role_realization_decision:
  current_actor: chatbot
  implemented_responsibility: Select sources and model tier, embed once, retrieve, compose a grounded prompt, answer, and host the browser request boundary.
  canonical_role_sub_role: Planner / Intent Handler; Executor / Workflow Orchestrator; Knowledge Manager / Recommendation Generator.
  retained_or_proposed_name: Retain `chatbot` as a descriptive multi-role actor.
  authority_boundary: Selects declared words and trusted topology entries only; it has no lifecycle or deployment authority.
  evidence: [agents/chatbot/profile.yaml, agents/chatbot/request-machine.yaml, srd002 R1-R6]
  migration_impact: None; the actor and Helm workload keep their descriptive identity while bindings remain separate.

context: |
  The `chatbot` actor assumes several roles rather than defining a Chatbot role:
  Planner / Intent Handler, Executor / Workflow Orchestrator, and Knowledge
  Manager / Recommendation Generator. It is the browser-facing actor of the mesh
  and follows the
  the standard agent layout: a rest.yaml with static_assets,
  machine_request, monitor, and control servers; a ui/ directory holding a built
  single-page app; and a ui.yaml actor configuration that places the panels.

  Each chat turn is a request-scoped machine run. A turn uses separate classifier
  calls to select declared RAG sources and one chat-LLM word (the $tool
  indirection), embeds the query once, fans out that one embedding to the selected RAG server agents
  (srd001, vector-in), composes the answer prompt from the returned chunks and
  the original query, and invokes the chosen chat-LLM word; the terminal signal
  maps to the HTTP chat response. Non-adjacent data -- the original query, the
  tier selection, the retrieved chunks -- reaches later steps by command-state
  $from() addressing (agent-core srd038), not by threading carry_forward through
  every intervening word.

  The reusable HTTP runtime, static-asset host, machine_request binding, monitor,
  and command-state store stay in agent-core. The turn machine, the tier-selector
  classifier prompt, the RAG and LLM client declarations, the SPA, and the ui.yaml
  panel placement stay profile-owned.

problem: |
  The mesh needs a browser-facing agent that turns a chat request into a routed,
  retrieval-augmented answer over N RAG sources, with observable per-turn behavior
  and no server-side session coupling. The requirements must name the turn machine
  shape and its command-state data flow, the tier selector and its fallback, the
  multi-RAG fan-out and degradation rules, the stateless-v1 session decision, the
  two-panel UX surface, and the transport-authority boundary, separately from
  the agent-core runtime.

goals:
  - G1: Model each chat turn as a request-scoped machine that selects a model tier, embeds, fans out to RAG servers, composes, and answers, with non-adjacent data flowing by command-state $from().
  - G2: Define separate source and tier classifiers with declared-vocabulary validation and normative fallbacks.
  - G3: Define selected sequential multi-RAG fan-out with not-selected, per-RAG degradation, and embedding-space mismatch outcomes.
  - G4: Fix stateless-v1 sessions (browser sends history) and record durable sessions as a follow-on non-goal.
  - G5: Declare the two-panel UX surface in ui.yaml over a static_assets-served SPA, deferring panel content to their own requirements.
  - G6: Keep RAG and LLM endpoints declared rest.yaml clients so nothing in the turn machine or UX can alter transport authority.

requirements:
  R1:
    title: Turn machine shape and data flow
    items:
      - R1.1: A chat turn SHALL run a request-scoped machine (agent-core srd030) that sequences select_tier, embed_query, RAG fan-out, compose, and the chosen invoke_llm word, mapping the terminal signal to the HTTP chat response.
      - R1.2: The original query, the tier selection, and the retrieved chunks SHALL reach the compose and answer steps through command-state $from() addressing (agent-core srd038), not through carry_forward chains across intervening words. The compose step SHALL use the agent-core compose builtin, which renders a grounding template from $from(label).path selectors, so invoke_llm receives one composed prompt without carry_forward for the non-adjacent message hop.
      - R1.3: embed_query SHALL embed the incoming query once, and the single resulting vector SHALL be the fan-out input to every selected RAG server.
  R2:
    title: Source and LLM tier selection
    items:
      - R2.1: The tier selector SHALL make one classifier LLM call over the original question whose response is parsed to a $tool selection over the declared chat-LLM words.
      - R2.2: The declared tool set for the tier selector SHALL be the chat-LLM words; the tier selector SHALL NOT select any word outside that declared set.
      - R2.3: A misparse or an out-of-set selection SHALL fall back to a configured default chat-LLM word rather than fail the turn.
      - R2.4: Before retrieval, select_sources SHALL make a classifier call over the original question and a catalog rendered from every declared topology item's required human-readable name and description. The catalog SHALL NOT contain REST authority or target configuration.
      - R2.5: A generic compose step immediately after select_sources SHALL JSON-escape the adjacent raw model reply into one fixed response field. parse_structured SHALL read that captured field and validate it as an object containing names as an array of strings. select_subset SHALL constrain those names against the declared topology and SHALL emit selected entries copied from that trusted topology, never from model-authored fields.
      - R2.6: A select_sources or capture error, malformed or schema-invalid response, empty names array, or result containing no declared name SHALL fall back to selecting every declared topology entry, preserving full fan-out behavior.
      - R2.7: A result containing declared and undeclared names SHALL discard the undeclared names and query only the trusted entries corresponding to declared names.
      - R2.8: Source selection SHALL use a classifier call separate from select_tier so each prompt and word has one responsibility and the existing tier-selection contract remains unchanged.
  R3:
    title: Multi-RAG fan-out and degradation
    items:
      - R3.1: The turn SHALL declare one ordered RAG topology and query only select_subset's trusted selected array through exactly one source-count-independent MachineSpec sequential for_each; its ordered join SHALL retain each queried source input, signal, and structured REST output.
      - R3.2: Generic partition SHALL separate QueryResponded join entries from QueryRejected and CommandError entries. A per-RAG failure SHALL degrade rather than fail the turn, so the answer SHALL be composed from remaining chunks and the failed entry SHALL remain in response metadata.
      - R3.3: Generic partition SHALL compare each answered source's reported embedding model (srd001 R2.3) with the query model. A mismatch SHALL be excluded from render_each grounding and reported separately from vector rejection in response metadata.
      - R3.4: Response metadata SHALL report declared but not selected source names separately from composed, embedding-model-excluded, vector-rejected, and degraded queried sources.
  R4:
    title: Stateless sessions
    items:
      - R4.1: The chat turn SHALL be stateless in v1, so the browser SHALL send the conversation history with each turn and the agent SHALL NOT keep a server-side session store.
      - R4.2: Durable Dolt-backed sessions SHALL be an explicit follow-on and SHALL NOT be part of the v1 contract.
  R5:
    title: UX surface
    items:
      - R5.1: The agent SHALL declare three panels -- chat, observability, and provisioning -- in ui.yaml. The provisioning panel delegates a user's provisioning intent to the provisioning-workflow-orchestrator (srd004) through a declared client rather than editing config itself.
      - R5.2: static_assets SHALL serve the built SPA that renders the panels; the SPA build and panel content requirements SHALL be owned by their own issues, not this SRD.
  R6:
    title: Transport-authority boundary
    items:
      - R6.1: RAG and LLM endpoints SHALL be declared rest.yaml operations. The generic RAG operation MAY select its base URL only from the trusted declared topology through command_state; its method, path, auth, operation, and network allowlist SHALL remain fixed configuration (agent-core srd028 R14).
      - R6.2: Tier and RAG selection SHALL choose among declared words and trusted topology entries only. Undeclared model names SHALL never reach a query target, and no model-authored or request-supplied endpoint, URL, host, credential, collection, or target configuration SHALL reach the REST operation.

non_goals:
  - Define Go package APIs for the agent-core request, static-asset, monitor, or command-state runtime.
  - Server-side session persistence; durable Dolt-backed sessions are a recorded follow-on (R4.2).
  - Panel content and SPA implementation; those are owned by the chat-panel and observability-panel issues.
  - Parallel or concurrent RAG fan-out; v1 is sequential (R3.1).
  - In-agent RAG multiplexing; each RAG source is its own srd001 instance.

acceptance_criteria:
  - id: AC1
    criterion: The chat turn is described as a request-scoped machine (select tier, embed, fan-out, compose, answer) with the original query, tier selection, and chunks flowing by command-state $from() rather than carry_forward chains, and one embedding fanned out to every selected RAG.
    traces: [R1.1, R1.2, R1.3]
  - id: AC2
    criterion: Separate source and tier classifier calls preserve the tier $tool contract; source output is schema-validated and constrained to trusted topology entries, partial undeclared picks are discarded, and error, malformed, empty, or only-undeclared outcomes fall back to all declared sources.
    traces: [R2.1, R2.2, R2.3, R2.4, R2.5, R2.6, R2.7, R2.8]
  - id: AC3
    criterion: One sequential for_each over the trusted selected array feeds generic partitions and render_each; not-selected, composed, query failure degradation, vector rejection, and embedding-model mismatch exclusion remain distinguishable in response metadata.
    traces: [R3.1, R3.2, R3.3, R3.4]
  - id: AC4
    criterion: Stateless-v1 sessions (browser-sent history, no server store) and the durable-session follow-on are stated as requirements and non-goals rather than prose.
    traces: [R4.1, R4.2]
  - id: AC5
    criterion: The three-panel ui.yaml surface over a static_assets-served SPA is declared, with panel content and SPA build deferred to their own issues.
    traces: [R5.1, R5.2]
  - id: AC6
    criterion: The transport-authority boundary permits only trusted topology-selected RAG authorities while method, path, auth, operation, and network policy remain declared and model/request input cannot supply an endpoint.
    traces: [R6.1, R6.2]

depends_on:
  - srd_id: srd001-rag-server-agent
    symbols_used: [R2]
  # The provisioning panel (R5.1) delegates a user's provisioning intent to the
  # provisioning-workflow-orchestrator through a declared client rather than editing config itself; the
  # provisioning-workflow-orchestrator (srd004) and creator (srd005) are the mesh control plane behind the
  # provisioning surface (srd003 R4). The chat turn path (R1-R3) is unchanged.
  - srd_id: srd004-provisioning-workflow-orchestrator
    symbols_used: [R1]

platform_dependencies:
  # agent-core runtime contracts this agent builds on. External references, owned
  # by agent-core, not part of this application's corpus.
  - srd_id: srd030-machine-request-rest-binding
    provider: agent-core
    symbols_used: [R1]
  - srd_id: srd033-monitor-rest-api
    provider: agent-core
    symbols_used: [R1]
  - srd_id: srd038-command-state-store
    provider: agent-core
    symbols_used: [R1, R2]

implementation_status:
  done:
    - >-
      Turn machine and single-RAG data flow (R1): the chatbot agent hosts a chat
      machine_request endpoint whose request-scoped turn sequences embed_query,
      rag_query, compose, and invoke_llm, threading non-adjacent data by
      command-state $from(); a RAG failure degrades to a mapped 200.
    - >-
      LLM $tool tier selector (R2, GH-904): select_tier reads the original question,
      parse_tier validates one chat-LLM word, and a misparse or out-of-set selection
      falls back to the default word. GH-904 cleanly renamed the application-app
      environment from CHATBOT_ROUTER_MODEL to CHATBOT_TIER_MODEL with no
      compatibility fallback.
    - >-
      Sequential multi-RAG fan-out (R3, GH-901): one MachineSpec for_each walks
      the trusted ordered topology through one selected-target REST operation.
      Its structured join feeds generic query-signal and embedding-model
      partitions, then render_each formats compatible chunks. Source additions
      change topology data but no word or state count; response metadata keeps
      compatible, model-excluded, vector-rejected, and degraded outcomes distinct.
    - >-
      Source routing (R2.4-R2.8, R3.1, R3.4, R6.2, GH-903): required topology
      descriptions render a names-and-descriptions-only catalog. A separate
      select_sources classifier reads that catalog and the original question;
      capture_source_selection JSON-escapes the adjacent raw reply into one fixed
      response field, parse_structured validates `{names:[string]}`, and select_subset converts only
      declared names to trusted selected topology entries. The single for_each reads
      only that selected array, whose base URLs remain trusted command state.
      Classifier/capture errors, malformed output, empty picks, and only-undeclared picks
      select all declared sources; mixed picks discard undeclared names. Metadata
      reports declared not-selected names separately. The separate-call design keeps
      source routing atomic and preserves the tested select_tier contract.
    - >-
      Stateless sessions (R4) and the two-panel UX surface (R5) over a
      static_assets-served SPA; the observability panels (per-agent monitor and
      the cross-agent trace waterfall) render from monitor SSE and the trace
      backend.
    - >-
      The application-local chatbot-turn-critic realizes Critic / Output
      Evaluator for both the single-turn and degraded-RAG scenarios. Scenario
      scope stays in each tests/ directory and its configuration rather than
      creating a degraded-turn actor. The isolated single-turn case additionally
      binds Sandbox Validator because it proves that an undeclared URL-shaped
      source cannot cross the controlled mock topology; the degraded-RAG case
      evaluates turn output without claiming that isolation responsibility.
  planned:
    - >-
      Concurrent multi-RAG fan-out (async await-any), and structured response
      metadata for the tier selection and the degraded and excluded RAG labels.

