        - {name: publication_commit_created, left: $from(publication_commit).status, op: eq, right: committed, operand_type: string, satisfied: PublicationCommitted, unsatisfied: PublicationCommitNotCreated}
        - {name: publication_commit_reused, left: $from(publication_commit).status, op: eq, right: reused, operand_type: string, satisfied: PublicationCommitReused, unsatisfied: PublicationConflict}
        - {name: publication_push_created, left: $from(publication_push).status, op: eq, right: pushed, operand_type: string, satisfied: PublicationPushed, unsatisfied: PublicationPushNotCreated}
        - {name: publication_push_reused, left: $from(publication_push).status, op: eq, right: reused, operand_type: string, satisfied: PublicationPushReused, unsatisfied: PublicationConflict}
        - {name: pull_request_is_absent, left: $from(pull_request_find).status, op: eq, right: absent, operand_type: string, satisfied: PullRequestAbsent, unsatisfied: PullRequestNotAbsent}
        - {name: pull_request_is_matching, left: $from(pull_request_find).status, op: eq, right: matching, operand_type: string, satisfied: PullRequestMatching, unsatisfied: PublicationConflict}
        - {name: pull_request_was_created, left: $from(pull_request_create).status, op: eq, right: created, operand_type: string, satisfied: PullRequestCreated, unsatisfied: PullRequestNotCreated}
        - {name: pull_request_was_reused, left: $from(pull_request_create).status, op: eq, right: reused, operand_type: string, satisfied: PullRequestReused, unsatisfied: PublicationConflict}
        - {name: publication_verification_succeeded, left: $from(publication_verification).status, op: eq, right: verified, operand_type: string, satisfied: PublicationVerified, unsatisfied: PublicationConflict}
    - name: manifest_scalar_predicate
      kind: declaration_family
      owner: workflow-orchestrator
      implementation: {type: builtin, factory: value_predicate, reuse: Context-specific declarations compare one parsed manifest scalar.}
      inputs: [one fixed $from(manifest_projection).field selector, one configured enum literal]
      outputs: [one comparison record]
      emits: [ConfiguredSatisfied, ConfiguredUnsatisfied, CommandError]
      infrastructure_errors: [selector or coercion failure]
      domain_errors: [comparison false]
      side_effects: [none]
      reversibility: {classification: reversible, undo: noop}
      compensation: Comparing changes no external state.
      authority: |
        This is a specification family, not one dynamic runtime word. Distinct
        fixed ToolDefs check request_mode, stage_result, verdict, warn_allowed,
        responsible_stage, retry_disposition, resume_step, and terminal_status.
        Each comparison emits two bounded route signals; unsatisfied outcomes
        continue a visible predicate chain and never silently choose a default
        outside the schema-closed final alternative.
      planned_instances:
        - {name: manifest_request_is_new, left: $from(manifest_projection).request_mode, op: eq, right: new, operand_type: string, satisfied: RequestNew, unsatisfied: RequestResume}
        - {name: manifest_stage_result_is_accepted, left: $from(manifest_projection).stage_result, op: eq, right: accepted, operand_type: string, satisfied: StageAccepted, unsatisfied: StageNotAccepted}
        - {name: manifest_verdict_is_pass, left: $from(manifest_projection).verdict, op: eq, right: pass, operand_type: string, satisfied: CritiqueAccepted, unsatisfied: VerdictNotPass}
        - {name: manifest_verdict_is_warn, left: $from(manifest_projection).verdict, op: eq, right: warn, operand_type: string, satisfied: VerdictWarn, unsatisfied: VerdictReject}
        - {name: manifest_warn_is_allowed, left: $from(manifest_projection).warn_allowed, op: eq, right: "true", operand_type: string, satisfied: CriticWarnAccepted, unsatisfied: CriticWarnRejected}
        - {name: manifest_responsible_stage_is_structure, left: $from(manifest_projection).responsible_stage, op: eq, right: structure, operand_type: string, satisfied: CriticRejectedStructure, unsatisfied: ResponsibleStageNotStructure}
        - {name: manifest_responsible_stage_is_voice, left: $from(manifest_projection).responsible_stage, op: eq, right: voice, operand_type: string, satisfied: CriticRejectedVoice, unsatisfied: CriticRejectedStyle}
        - {name: manifest_retry_is_available, left: $from(manifest_projection).retry_disposition, op: eq, right: retry, operand_type: string, satisfied: RetryAvailable, unsatisfied: RetryExhausted}
        - {name: manifest_exhaustion_keeps_original, left: $from(manifest_projection).retry_disposition, op: eq, right: keep_original, operand_type: string, satisfied: ExhaustedKeepOriginal, unsatisfied: ExhaustedFail}
        - {name: manifest_resume_is_capture, left: $from(manifest_projection).resume_step, op: eq, right: capture, operand_type: string, satisfied: ResumeCapture, unsatisfied: ResumeNotCapture}
        - {name: manifest_resume_is_structure, left: $from(manifest_projection).resume_step, op: eq, right: structure, operand_type: string, satisfied: ResumeStructure, unsatisfied: ResumeNotStructure}
        - {name: manifest_resume_is_voice, left: $from(manifest_projection).resume_step, op: eq, right: voice, operand_type: string, satisfied: ResumeVoice, unsatisfied: ResumeNotVoice}
        - {name: manifest_resume_is_style, left: $from(manifest_projection).resume_step, op: eq, right: style, operand_type: string, satisfied: ResumeStyle, unsatisfied: ResumeNotStyle}
        - {name: manifest_resume_is_critique, left: $from(manifest_projection).resume_step, op: eq, right: critique, operand_type: string, satisfied: ResumeCritique, unsatisfied: ResumeNotCritique}
        - {name: manifest_resume_is_finalization, left: $from(manifest_projection).resume_step, op: eq, right: finalization, operand_type: string, satisfied: ResumeFinalization, unsatisfied: ResumeNotFinalization}
        - {name: manifest_resume_is_commit, left: $from(manifest_projection).resume_step, op: eq, right: commit, operand_type: string, satisfied: ResumeCommit, unsatisfied: ResumeNotCommit}
        - {name: manifest_resume_is_push, left: $from(manifest_projection).resume_step, op: eq, right: push, operand_type: string, satisfied: ResumePush, unsatisfied: ResumeNotPush}
        - {name: manifest_resume_is_pull_request, left: $from(manifest_projection).resume_step, op: eq, right: pull_request, operand_type: string, satisfied: ResumePullRequest, unsatisfied: ResumeNotPullRequest}
        - {name: manifest_resume_is_verification, left: $from(manifest_projection).resume_step, op: eq, right: verification, operand_type: string, satisfied: ResumeVerification, unsatisfied: ResumeTerminal}
        - {name: manifest_terminal_is_published, left: $from(manifest_projection).terminal_status, op: eq, right: published, operand_type: string, satisfied: TerminalPublished, unsatisfied: TerminalNotPublished}
        - {name: manifest_terminal_is_kept_original, left: $from(manifest_projection).terminal_status, op: eq, right: kept_original, operand_type: string, satisfied: TerminalKeptOriginal, unsatisfied: TerminalNotKeptOriginal}
        - {name: manifest_terminal_is_failed, left: $from(manifest_projection).terminal_status, op: eq, right: failed, operand_type: string, satisfied: TerminalFailed, unsatisfied: TerminalNotFailed}
        - {name: manifest_terminal_is_publication_blocked, left: $from(manifest_projection).terminal_status, op: eq, right: publication_blocked, operand_type: string, satisfied: TerminalPublicationBlocked, unsatisfied: TerminalOperatorAborted}

  editor_and_critic_retrieval:
    - name: validate_structure_request
      owner: specialist-editor:structure
      implementation: {type: builtin, factory: parse_structured, reuse: Validate the specialist-editor:structure request envelope and bounded policy.}
      inputs: [supplied parent bytes and artifact ID, saga/stage/attempt identity, bounded structure policy, required-content inventory, invocation identity]
      outputs: [validated parent bytes and identity, normalized structure intent, protected-content inventory, refinement count zero]
      emits: [StructureRequestValid, StructureRequestRejected, CommandError]
      infrastructure_errors: [missing schema, selector failure, validator failure]
      domain_errors: [missing or empty parent, wrong stage, malformed identity, unsupported intent, invalid required-content inventory, path or authority-bearing field present]
      side_effects: [none]
      reversibility: {classification: reversible, undo: noop}
      compensation: No state exists to compensate.
      authority: Validates supplied bytes, identities, and bounded enums only; cannot read a path, widen policy, or add content.

    - name: formulate_structure_query
      owner: specialist-editor:structure
      implementation: {type: builtin, factory: compose, reuse: Deterministic configured section-and-outline query template.}
      inputs: [validated structure intent and initial query descriptor from $from(validated_structure_request), or parsed helper-computed refined descriptor and next count from the newest $from(structure_grounding_report)]
      outputs: [bounded structure question text, supplied query identity, and supplied refinement count zero or one]
      emits: [StructureQueryFormulated]
      infrastructure_errors: [none emitted by compose; trusted selector defects are recorded on the Result while the configured signal remains StructureQueryFormulated]
      domain_errors: [none; validate_structure_request and parse_structure_grounding_report reject missing, malformed, or out-of-bound query fields before composition]
      side_effects: [none]
      reversibility: {classification: reversible, undo: noop}
      compensation: Deterministic composition only.
      authority: Renders one configured template over schema-validated state. It does not derive or increment a count, formulate a refined descriptor, or author an endpoint, model, collection, path, tool, or free-form editing instruction. Future declaration validation must prove every selector resolves because compose has no error branch.

    - name: embed_structure_query
      owner: specialist-editor:structure
      implementation: {type: builtin, factory: rest_client_invoke, reuse: Configured Ollama embedding operation.}
      inputs: [bounded structure question text and query identity from formulate_structure_query]
      outputs: [embedding vector, embedding model identity, carried query identity]
      emits: [StructureQueryEmbedded, StructureQueryRejected, CommandError]
      infrastructure_errors: [REST config, network, timeout, authentication, schema, or mapping failure]
      domain_errors: [provider rejects bounded input]
      side_effects: [external_api]
      reversibility: {classification: irreversible, undo: record_observation}
      compensation: No remote inference can be undone; discard output on failure.
      authority: Endpoint and model are profile-configured; vector comes only from the mapped provider response.

    - name: query_structure_rag
      owner: specialist-editor:structure
      implementation: {type: builtin, factory: rest_client_invoke, reuse: Vector-in query operation bound to structure-rag.}
      inputs: [vector from embed_structure_query, configured result limit, trace and content-hash identity]
      outputs: [ranked chunks, distances, metadata, embedding model identity]
      emits: [StructureEvidenceReady, StructureEvidenceInsufficient, QueryRejected, CommandError]
      infrastructure_errors: [REST config, network, timeout, response schema, or mapping failure]
      domain_errors: [embedding mismatch, query rejected, no evidence above configured sufficiency policy]
      side_effects: [external_api]
      reversibility: {classification: reversible, undo: noop}
      compensation: Read-only.
      authority: Calls only configured structure-rag; vector is selected from the embedding word, never model-authored.

    - name: compose_structure_grounding_input
      owner: specialist-editor:structure
      implementation: {type: builtin, factory: compose, reuse: Fixed grounding-helper JSON input template and configured signal.}
      inputs: [ranked retrieval output from the newest $from(structure_retrieval), validated policy and parent identity from $from(validated_structure_request), and current query identity and count from the newest $from(structure_query)]
      outputs: [JSON envelope whose stdin field is one bounded JSON string containing only grounding-helper input fields]
      emits: [StructureGroundingInputReady]
      infrastructure_errors: [none emitted by compose; trusted selector defects are recorded on the Result while the configured signal remains StructureGroundingInputReady]
      domain_errors: [none]
      side_effects: [none]
      reversibility: {classification: reversible, undo: noop}
      compensation: Deterministic composition only.
      authority: Renders schema-validated state with one fixed JSON template and exposes the rendered helper document only as the selectable stdin string.

    - name: inspect_structure_grounding
      owner: specialist-editor:structure
      implementation: {type: exec, factory: exec, reuse: Fixed inspect-grounding operation of the planned non-shell specialist-editor:structure helper.}
      inputs: [bounded JSON string selected by fixed stdin_source $from(structure_grounding_input).stdin and rejected before launch above fixed stdin_max_bytes]
      outputs: [output mode structured JSON object with output containing bounded report stdout and exit_code containing the process status; report stdout contains grounding_status, accepted evidence references, per-check findings, current count, helper-computed next count and refined query descriptor when eligible, and bounded insufficiency reason]
      emits: [ToolDone, ToolFailed, CommandError]
      infrastructure_errors: [CommandError when fixed stdin_source does not resolve to one non-empty string within stdin_max_bytes, process start fails, execution is canceled or times out, or structured output encoding fails; ToolFailed when the launched helper exits non-zero]
      domain_errors: [none; insufficient evidence is a zero-exit report with grounding_status deficient]
      side_effects: [child_process]
      reversibility: {classification: reversible, undo: noop}
      compensation: Read-only deterministic observation; discard stdout unless ToolDone.
      authority: Executes one fixed helper binary and inspect-grounding argument with bounded JSON stdin, structured output mode, and no shell, path, environment, endpoint, model, corpus, credential, or runtime executable selection.

    - name: parse_structure_grounding_report
      owner: specialist-editor:structure
      implementation: {type: builtin, factory: parse_structured, reuse: Parse inspect_structure_grounding stdout against the configured grounding-report JSON Schema.}
      inputs: [exact ToolDone stdout string selected by source $from(structure_grounding_report_raw).output from the structured exec JSON object]
      outputs: [schema-valid normalized report with grounding_status, accepted evidence and provenance, categorized findings, current and next counts, refined query descriptor when eligible, and bounded reason]
      emits: [StructureGroundingReportParsed, StructureGroundingReportInvalid, CommandError]
      infrastructure_errors: [source selector does not resolve or normalized output encoding fails]
      domain_errors: [stdout is malformed JSON, exceeds schema bounds, or omits or mistypes a required report field]
      side_effects: [none]
      reversibility: {classification: reversible, undo: noop}
      compensation: Reject an invalid report and retain the parent unchanged.
      authority: Parses and validates helper stdout only; it cannot compute findings, repair a report, route more than parsed or invalid, or create authority-bearing values.

    - name: structure_grounding_sufficient
      owner: specialist-editor:structure
      implementation: {type: builtin, factory: value_predicate, reuse: Compare the parsed grounding_status scalar with configured literal sufficient.}
      inputs: [left $.grounding_status from the immediately preceding parse_structure_grounding_report Result, operator eq, right literal sufficient, operand type string]
      outputs: [raw operands, equality operator, string operand type, held result]
      emits: [StructureGroundingSufficient, StructureGroundingDeficient, CommandError]
      infrastructure_errors: [left operand selector does not resolve]
      domain_errors: [none; a non-matching scalar is StructureGroundingDeficient]
      side_effects: [none]
      reversibility: {classification: reversible, undo: noop}
      compensation: Scalar comparison only.
      authority: Performs exactly one configured scalar comparison.

    - name: structure_grounding_refinement_available
      owner: specialist-editor:structure
      implementation: {type: builtin, factory: value_predicate, reuse: Compare parsed refinement_count with configured hard limit one.}
      inputs: [left $from(structure_grounding_report).refinement_count, operator lt, right literal one, operand type number]
      outputs: [raw operands, less-than operator, number operand type, held result]
      emits: [StructureGroundingRefinementAllowed, StructureGroundingInsufficient, CommandError]
      infrastructure_errors: [operand selector does not resolve or number coercion fails]
      domain_errors: [none; an exhausted count is StructureGroundingInsufficient]
      side_effects: [none]
      reversibility: {classification: reversible, undo: noop}
      compensation: Scalar comparison only.
      authority: Performs exactly one configured scalar comparison.

    - name: compose_structure_edit_context
      owner: specialist-editor:structure
