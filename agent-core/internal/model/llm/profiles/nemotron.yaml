name: nemotron
match_prefixes: ["nemotron"]

envelope:
  open: "[tool_call]"
  close: "[/tool_call]"
strict_format: false

extraction_pipeline:
  - strip_thinking_blocks
  - strip_code_fences
  - extract_envelope:
      open: "[tool_call]"
      close: "[/tool_call]"
  - extract_braces
