  - id: R-MACH-021
    target: specification
    level: MUST
    statement: >-
      A transition with an action MAY carry `expect`, holding its result body
      to more than its type: `where` maps body fields to refinements, and
      `otherwise` names the `signal` raised for a body outside them and
      whether the result is put in `quarantine`. Every field `where` names
      is required. A refinement MUST use only the declaration type subset
      without references or unions, plus `min_items` and `max_items` on an
      array and `min` and `max` on a number, with no lower bound above its
      upper bound; it is static data, and a selector anywhere in it MUST be
      refused. When the action's output type is decided, every field path
      `where` names MUST exist in it and every `enum` value MUST be one the
      type allows. `expect` on a transition with neither an action nor
      `for_each` MUST be refused; on a `for_each`, R-MACH-024 applies.
