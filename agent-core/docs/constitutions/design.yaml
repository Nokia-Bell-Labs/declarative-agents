          - source_provenance
          - success_criteria
          - not
          - canonical_documents
          - dependencies
          - external_references
          - platform_references
          - library_references
        construction_sequence_entry:
          tag: construction_sequence_entry
          level: 3
          parent: 'field:construction_sequence'
          heading: id
          content: none
          yaml: {from: construction_sequence, records: list, id: name}
        dependencies_field:
          tag: field
          level: 3
          parent: 'field:dependencies'
          heading: free
          content: any
          fields:
          - direct
          - indirect
        library_references_field:
