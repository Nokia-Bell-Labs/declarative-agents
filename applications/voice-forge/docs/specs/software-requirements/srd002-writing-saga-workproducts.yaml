id: srd002-writing-saga-workproducts
title: Writing Saga and Workproduct Lifecycle
status: specified

problem: |
  Voice Forge needs a durable contract for the document bytes and lineage that
  cross its serial editing and criticism boundaries. A process checkpoint alone
  is insufficient: agent-core checkpoints persist machine position, execution
  entries, and opaque receipts, but they do not make application document bytes
  durable or publishable. Treating those two state planes as interchangeable
  would let a database revert silently discard or misidentify a document.

  Retries add a second risk. A critic can reject a structure, voice, or style
  decision after downstream work exists. Reusing fixed filenames by overwrite
  would destroy evidence, while committing every attempt would expose rejected
  work remotely. This SRD defines an application-owned, append-only attempt
  store, a recoverable manifest, one finalized named chain, and one forward-only
  GitHub publication after independent acceptance. Runtime implementation and
  executable evidence remain planned.

goals:
  - "G1: Define the exact persistent workspace, manifest schema, and immutable artifact lineage."
  - "G2: Define explicit inputs, outputs, parent selection, and acceptance for every serial stage."
  - "G3: Define idempotent invocation, bounded retry, and non-destructive compensation."
  - "G4: Recover safely when either the application manifest or agent-core checkpoint is newer after a crash."
  - "G5: Materialize and publish one accepted chain through one idempotent GitHub publication."
  - "G6: Keep all runtime behavior planned until profiles, machines, tools, services, and tests exist."

applicability:
  release: "00.0"
  implementation_status: documentation_only_runtime_planned
  owner: workflow-orchestrator
  single_writer: one active writer per saga_id

workspace_contract:
  root: "<persistent-output>/workproducts/<saga-id>/"
  required_persistence: |
    <persistent-output> is the resolved persistent --output workspace. An
    ephemeral process directory does not satisfy this contract. The
    orchestrator is the sole writer. Child services receive bytes and metadata
    in bounded requests and return bytes or verdict data; they never receive
    workspace paths.
  paths:
    manifest: manifest.yaml
    manifest_history: manifest-history/<zero-padded-revision>.yaml
    original: 00-original.md
    structure: 10-structure.md
    voice: 20-voice.md
    style: 30-style.md
    critique: 40-critique.yaml
    final: final.md
    attempt_artifact: attempts/<stage>/<zero-padded-attempt>-<sha256>.<md-or-yaml>
  mutability:
    immutable:
      - 00-original.md
      - manifest-history/*.yaml
      - attempts/**
      - 10-structure.md after finalization
      - 20-voice.md after finalization
      - 30-style.md after finalization
      - 40-critique.yaml after finalization
      - final.md after finalization
    mutable_projection:
      - manifest.yaml
  write_protocol: |
    Each file write uses a same-directory temporary file, verifies the expected
    SHA-256 digest, fsyncs the file, renames atomically, and fsyncs the parent
    directory. A manifest transition first creates the next immutable
    manifest-history revision and then atomically replaces manifest.yaml with
    the same bytes. Recovery repairs manifest.yaml from the highest valid
    contiguous history revision when the projection is absent or torn.

manifest_schema:
  schema_version: voice-forge.saga-manifest/v1
  required_top_level_fields:
    - schema_version
    - saga_id
    - revision
    - created_at
    - updated_at
    - source
    - policy
    - saga_state
    - selected_lineage
    - artifacts
    - stage_runs
    - publication
  source:
    required_fields: [repository, path, commit, content_sha256]
    rules: |
      repository is the canonical allowlisted repository identity; path is the
      repository-relative source path; commit is the resolved full commit ID,
      never a moving ref; content_sha256 is the lowercase SHA-256 digest of the
      exact bytes written once to 00-original.md.
  policy:
    required_fields:
      - target_voice
      - retry_limit_by_stage
      - critic_warn_policy
      - keep_original_on_exhaustion
      - pangram_consent
      - publication_repository
      - publication_base
      - publication_branch
    rules: |
      The orchestrator records the validated policy before the first child
      invocation. Model output cannot change these authority-bearing values.
  saga_state:
    required_fields:
      - phase
      - terminal_status
      - active_stage
      - last_accepted_artifact_id
      - accepted_critic_artifact_id
    phase_values:
      - capturing
      - editing
      - criticizing
      - retrying
      - finalizing
      - publishing
      - terminal
    terminal_status_values: [null, published, kept_original, failed, publication_blocked]
  selected_lineage:
    required_keys: [original, structure, voice, style, critique, final]
    value: An artifact_id or null. Every non-null child references the preceding selected parent except critique, which references both original and style.
  artifact_record:
    required_fields:
      - artifact_id
      - logical_name
      - path
      - media_type
      - stage
      - attempt
      - status
      - content_sha256
      - byte_length
      - parent_artifact_ids
      - producer
      - invocation_id
      - created_at
      - provenance
    artifact_id: "<stage>:<zero-padded-attempt>:sha256:<lowercase-hex-digest>"
    optional_fields: [materialized_from_artifact_id]
    status_values: [captured, candidate, accepted, rejected, superseded, finalized]
    producer_fields: [actor, profile_id, profile_version]
    provenance_fields:
      - trace_id
      - model_provider
      - model_name
      - model_version
      - model_parameters_digest
      - tools
    tool_provenance_fields: [name, version, request_digest, response_digest]
    rules: |
      artifact_id distinguishes stage attempts even when a valid no-op
      transformation returns byte-identical content; its digest component still
      identifies exact bytes. path is workspace-relative and cannot escape the
      saga root. parent_artifact_ids contains exact artifact IDs, not filenames.
      The original has no parent; editor outputs have one parent; critique has
      the original and evaluated style candidate as ordered parents; final has
      the accepted style candidate as its parent. A fixed-path finalization copy
      records its selected immutable source in materialized_from_artifact_id.
      Provenance records identities and digests, not credentials, hidden
      reasoning, raw checkpoint receipts, or unredacted request data.
  stage_run_record:
    required_fields:
      - stage
      - attempt
      - invocation_id
      - idempotency_key
      - input_artifact_ids
      - input_content_sha256
      - status
      - output_artifact_id
      - error
      - started_at
      - completed_at
    status_values: [intent_recorded, running, accepted, rejected, failed, uncertain, superseded]
    idempotency_key: "sha256(saga_id, stage, attempt, ordered input hashes, policy digest, child profile version)"
  publication_record:
    required_fields:
      - state
      - publication_key
      - repository
      - base
      - branch
      - expected_tree_sha
      - commit_sha
      - pushed_ref
      - pull_request_number
      - pull_request_url
      - attempts
      - last_error
    state_values: [not_started, intent_recorded, committed, pushed, pull_request_open, complete, blocked]
    publication_key: "sha256(saga_id, accepted lineage artifact IDs, destination repository, base, branch)"

stage_contracts:
  - stage: capture
    input:
      - validated source repository, path, and requested revision
      - persistent output root and saga policy
    parent: none
    output: 00-original.md and its captured artifact record
    acceptance: |
      Resolve the revision to a full commit, fetch exact source bytes, write
      00-original.md only if absent, and verify repository, path, commit, byte
      length, and SHA-256 before recording capture as accepted.
  - stage: structure
    input:
      - exact bytes and artifact ID of the selected original
      - target and bounded structure policy
    parent: selected_lineage.original
    output: immutable attempts/structure/<attempt>-<sha256>.md
    acceptance: |
      Validate a successful child response, required provenance, media type,
      non-empty content, parent identity, and response hash before selecting it.
  - stage: voice
    input:
      - exact bytes and artifact ID of the selected structure candidate
      - target voice and bounded voice policy
    parent: selected_lineage.structure
    output: immutable attempts/voice/<attempt>-<sha256>.md
    acceptance: |
      Apply the common editor acceptance checks and record voice evidence and
      copy-risk provenance before selecting the output.
  - stage: style
    input:
      - exact bytes and artifact ID of the selected voice candidate
      - bounded tightening policy
    parent: selected_lineage.voice
    output: immutable attempts/style/<attempt>-<sha256>.md
    acceptance: |
      Apply the common editor acceptance checks and record transformation-tool
      provenance before selecting the output.
  - stage: critique
    input:
      - exact bytes and artifact ID of 00-original.md
      - exact bytes and artifact ID of the selected style candidate
      - acceptance policy and explicit Pangram consent state
    parent: [selected_lineage.original, selected_lineage.style]
    output: immutable attempts/critique/<attempt>-<sha256>.yaml
    acceptance: |
      Validate a schema-bound pass, warn, or reject verdict; evaluated content
      hashes; semantic, structure, voice, style, unsupported-addition, and
      copy-risk findings; Pangram request status; and, for reject, exactly one
      responsible stage plus bounded feedback. Warn proceeds only when policy
      permits it. Pangram evidence alone cannot satisfy acceptance.
  - stage: finalization
    input:
      - one critic-accepted selected lineage
      - all selected immutable attempt artifacts and their verified hashes
    parent: selected_lineage.style
    output:
      - 10-structure.md
      - 20-voice.md
      - 30-style.md
      - 40-critique.yaml
      - final.md
    acceptance: |
      Create each fixed path exactly once from the selected immutable attempt
      bytes. final.md is byte-identical to 30-style.md. Verify every copy and
      record finalized artifacts before publication. Existing matching files
      are reused; any mismatching existing file is a blocking integrity error.
  - stage: publication
    input:
      - finalized manifest and all files under the saga root
      - critic acceptance and validated destination policy
    parent: selected_lineage.final
    output: publication state and remote commit, ref, and pull-request identities
    acceptance: |
      Create exactly one commit whose tree contains the complete saga root,
      push that commit to the declared branch, and create or reuse exactly one
      pull request. Completion requires remote verification of commit, tree,
      branch head, base, and pull-request identity.

requirements:
  R1:
    title: Workspace ownership and immutable bytes
    items:
      - id: R1.1
        text: |
          The workflow-orchestrator SHALL be the sole writer under
          <persistent-output>/workproducts/<saga-id>/. Child services SHALL
          exchange content and provenance or verdict data and SHALL NOT receive
          workspace paths or filesystem authority.
        evidence: Planned authority tests expose no workspace ToolDefs or path fields to child profiles.
      - id: R1.2
        text: |
          Capture SHALL write 00-original.md exactly once and SHALL bind its
          bytes to source repository, repository-relative path, resolved full
          commit, content SHA-256, and byte length. No retry, compensation,
          finalization, or recovery path SHALL overwrite it.
        evidence: Planned capture and fault-injection tests preserve the original inode content and digest.
      - id: R1.3
        text: |
          Every child output SHALL first be stored at its content-addressed
          immutable attempt path. The fixed 10, 20, 30, 40, and final paths
          SHALL be created only during accepted-lineage finalization and SHALL
          never be reused for retry scratch state.
        evidence: Planned retry tests preserve all attempt paths and create fixed paths only after critic acceptance.
      - id: R1.4
        text: |
          All workspace-relative paths SHALL remain beneath the saga root, and
          all durable writes SHALL use the workspace_contract write protocol.
        evidence: Planned path-containment, torn-write, and fsync recovery tests validate the protocol.
  R2:
    title: Manifest state and exact lineage
    items:
      - id: R2.1
        text: |
          manifest.yaml SHALL conform to manifest_schema and SHALL identify
          exact bytes through artifact IDs and content hashes rather than
          mutable filenames alone.
        evidence: Planned schema tests reject missing fields, unknown states, invalid hashes, and escaping paths.
      - id: R2.2
        text: |
          Every artifact record SHALL contain stage, attempt, status, exact
          parent artifact IDs, producer identity, invocation identity, model
          and tool provenance, content SHA-256, byte length, and creation time.
        evidence: Planned lineage tests reconstruct every accepted and rejected edge from manifest records.
      - id: R2.3
        text: |
          Critique SHALL name the immutable original and evaluated style
          candidate as ordered parents. Final SHALL name the accepted style
          candidate, and final.md SHALL be byte-identical to 30-style.md.
        evidence: Planned hash and parent-closure tests reject critique or final records bound to other bytes.
      - id: R2.4
        text: |
          The orchestrator SHALL persist a new manifest revision after capture,
          each accepted or rejected stage result, each selection or
          supersession, finalization, and each publication-state transition.
        evidence: Planned crash tests stop after every transition and recover the last durable revision.
      - id: R2.5
        text: |
          Manifest history SHALL be append-only. manifest.yaml SHALL be a
          repairable current projection and SHALL NOT be the only copy of an
          accepted state transition.
        evidence: Planned torn-projection tests recover from the highest valid contiguous history revision.
  R3:
    title: Serial stage inputs and outputs
    items:
      - id: R3.1
        text: |
          The saga SHALL execute capture, structure, voice, style, critique,
          finalization, and publication serially with the exact inputs, outputs,
          parents, and acceptance checks in stage_contracts.
        evidence: Planned contract tests trace every request and response to its declared parent hashes.
      - id: R3.2
        text: |
          An editor response SHALL NOT become an accepted parent until its
          invocation, schema, provenance, byte length, content hash, media type,
          and expected parent identity validate.
        evidence: Planned malformed, wrong-parent, wrong-hash, and missing-provenance tests preserve the prior parent.
      - id: R3.3
        text: |
          A critic response SHALL bind both evaluated hashes and contain all
          declared finding categories. Reject SHALL identify one responsible
          stage in structure, voice, or style; pass or policy-permitted warn
          SHALL be the only verdicts that permit finalization.
        evidence: Planned verdict-schema and policy tests reject incomplete or hash-mismatched criticism.
      - id: R3.4
        text: |
          The orchestrator SHALL NOT infer successful child work from a process
          signal alone. It SHALL accept only validated returned content or
          verdict data and a durable artifact record.
        evidence: Planned boundary-tool tests cover success signals with missing, malformed, or undurable output.
  R4:
    title: Retry and non-destructive compensation
    items:
      - id: R4.1
        text: |
          Each stage SHALL have a bounded retry count from policy. Attempt
          numbers SHALL increase monotonically per stage and SHALL never be
          reused, including after restart.
        evidence: Planned retry and restart tests prove monotonic attempts and terminal exhaustion.
      - id: R4.2
        text: |
          A retry SHALL start from the last selected accepted parent immediately
          before the responsible stage: original for structure, selected
          structure for voice, and selected voice for style. It SHALL replay
          every downstream stage before another critique.
        evidence: Planned responsible-stage tests verify input hashes and downstream replay order.
      - id: R4.3
        text: |
          Retry compensation SHALL append status changes that supersede the
          rejected selection and its downstream selections. It SHALL NOT delete,
          truncate, overwrite, reset, or rewrite any original, attempt, or
          finalized artifact.
        evidence: Planned compensation tests retain every prior file and lineage record byte-for-byte.
      - id: R4.4
        text: |
          Child failure, timeout, invalid output, or uncertain completion SHALL
          leave the prior accepted parent selected and available. Remote model,
          retrieval, and advisory calls SHALL be treated as irreversible
          observations and logged, not falsely undone.
        evidence: Planned boundary failure tests preserve selected hashes and record explicit failure state.
      - id: R4.5
        text: |
          Retry exhaustion SHALL terminate as kept_original or failed according
          to recorded policy. It SHALL not finalize or publish a rejected chain.
        evidence: Planned exhaustion tests cover both policy outcomes and deny publication.
  R5:
    title: Invocation and state idempotency
    items:
      - id: R5.1
        text: |
          Before a child call, the orchestrator SHALL persist an intent record
          with the stage_run_record idempotency key. Re-entry SHALL reuse that
          key and SHALL NOT allocate a second attempt for the same intent.
        evidence: Planned crash-before-call and crash-after-call tests reuse one recorded intent.
      - id: R5.2
        text: |
          Repeated delivery of byte-identical output for one invocation SHALL
          resolve to one artifact ID and one stage result. Conflicting output
          for the same invocation and key SHALL be an integrity error.
        evidence: Planned duplicate and equivocation tests deduplicate matching bytes and block conflicts.
      - id: R5.3
        text: |
          Finalization SHALL be idempotent by expected artifact hash. Existing
          matching fixed files SHALL be accepted; existing mismatching fixed
          files SHALL never be overwritten.
        evidence: Planned repeated-finalization and mismatch tests verify reuse or blocking behavior.
      - id: R5.4
        text: |
          Saga creation with an existing saga_id SHALL load and reconcile that
          saga or reject conflicting source or policy identity. It SHALL NOT
          initialize a second directory or original.
        evidence: Planned duplicate-start tests cover matching and conflicting identities.
  R6:
    title: Checkpoint and artifact-state separation
    items:
      - id: R6.1
        text: |
          Agent-core Checkpoint Position and Execution SHALL persist runtime
          machine position, counters, conversation, execution metadata, and
          opaque tool receipts. They SHALL NOT be the authoritative store for
          document artifact bytes or manifest history.
        evidence: Planned checkpoint inspection proves only artifact references and hashes, not document bodies, are required for recovery.
      - id: R6.2
        text: |
          The persistent --output workspace SHALL be the authoritative store for
          source, attempt, finalized, critique, and manifest bytes. Artifact
          bytes SHALL survive process exit independently of checkpoint backend
          retention or branch reaping.
        evidence: Planned recovery tests replace or reap checkpoint state while preserving and validating workspace bytes.
      - id: R6.3
        text: |
          Checkpoint entries MAY carry saga_id, manifest revision, artifact IDs,
          hashes, invocation IDs, and tool-owned receipts. They SHALL NOT embed
          artifact bodies in command-state output or receipts as a substitute
          for the workspace.
        evidence: Planned output and receipt tests reject embedded document bodies and preserve reference-only state.
      - id: R6.4
        text: |
          Dolt Revert and checkpoint_rollback SHALL affect agent-core persisted
          runtime state only. Voice Forge compensation SHALL reconcile the
          append-only manifest and SHALL NOT claim that checkpoint rollback
          deletes or restores workspace files.
        evidence: Planned rollback tests cite srd036 R6 and retain all saga files across runtime-state revert.
  R7:
    title: Restart recovery and reconciliation
    items:
      - id: R7.1
        text: |
          On restart the orchestrator SHALL lock the saga, validate source and
          policy identity, repair manifest.yaml from immutable history when
          needed, verify every referenced file hash, and only then load and
          compare the agent-core checkpoint.
        evidence: Planned restart tests cover absent projection, torn revision, hash mismatch, and lock contention.
      - id: R7.2
        text: |
          If manifest state is newer than the checkpoint, recovery SHALL treat
          the durable manifest transition as authoritative and resume at its
          next incomplete stage without rewriting its artifacts.
        evidence: Planned crash-after-manifest-before-checkpoint tests resume from the manifest revision.
      - id: R7.3
        text: |
          If checkpoint position is newer than the manifest, recovery SHALL
          treat unmanifested child or file effects as unaccepted, return to the
          last manifest-selected parent, and reconcile the recorded invocation
          idempotently.
        evidence: Planned crash-after-checkpoint-without-acceptance tests preserve the manifest parent and reuse intent.
      - id: R7.4
        text: |
          Recovery SHALL inspect publication state and remote identities before
          issuing any GitHub mutation. An unverifiable artifact hash,
          conflicting remote identity, or policy mismatch SHALL block automatic
          progress and preserve local evidence.
        evidence: Planned corruption and remote-conflict tests enter an explicit blocked state.
  R8:
    title: One final GitHub publication and planned status
    items:
      - id: R8.1
        text: |
          Publication SHALL begin only after critic acceptance and successful
          finalization. The orchestrator SHALL create exactly one commit for the
          complete saga root; no intermediate attempt SHALL be committed
          separately.
        evidence: Planned git-history tests show one saga commit and no pre-acceptance remote mutation.
      - id: R8.2
        text: |
          The publication key, expected tree, destination, commit SHA, pushed
          ref, and pull-request identity SHALL be persisted as progress advances.
          Retry SHALL continue the same forward publication and SHALL NOT create
          a replacement commit, branch, or pull request.
        evidence: Planned fault injection after commit, push, and PR creation converges on the same identities.
      - id: R8.3
        text: |
          Before each publication action, the orchestrator SHALL query local and
          remote state. A matching effect SHALL be reused; an absent effect
          SHALL be created; a conflicting effect SHALL block for operator
          resolution without destructive remote compensation.
        evidence: Planned duplicate invocation and conflict tests prove create-or-reuse behavior.
      - id: R8.4
        text: |
          Publication SHALL become complete only after remote verification that
          the declared branch points to the one recorded commit, its tree
          matches expected_tree_sha, and one pull request targets the declared
          base. Duplicate invocation SHALL not duplicate any publication effect.
        evidence: Planned remote-verification tests cover repeated requests and uncertain API outcomes.
      - id: R8.5
        text: |
          This SRD SHALL report the contract as specified while profiles,
          machines, ToolDefs, services, tests, persistence wiring, and GitHub
          behavior remain planned and without executable evidence.
        evidence: Architecture, specification index, roadmap, and implementation_status agree.

non_goals:
  - Implement profiles, MachineSpecs, ToolDefs, services, storage adapters, tests, or GitHub publication.
  - Define child editor, critic, or orchestrator transition tables; srd004 through srd008 own those machines.
  - Define the boundary-tool vocabulary and receipt formats; srd003 owns those ToolDefs.
  - Store document artifact bytes in agent-core checkpoint, command-state, Dolt tool_outputs, or opaque receipts.
  - Use agent-core Dolt Revert as filesystem rollback or destructively reset the saga directory.
  - Publish rejected work, publish intermediate attempts as separate commits, or process stages in parallel.
  - Guarantee undo of model, retrieval, Pangram, git push, or pull-request effects.

acceptance_criteria:
  - id: AC1
    criterion: |
      One orchestrator owns a persistent contained saga directory; original,
      attempt, and finalized bytes obey exact immutability and atomic-write
      rules; child services receive no filesystem authority.
    traces: [R1.1, R1.2, R1.3, R1.4]
  - id: AC2
    criterion: |
      The versioned manifest schema records exact source identity, policy,
      artifact lineage, attempts, provenance, saga state, and publication state;
      every transition has append-only history and a repairable projection.
    traces: [R2.1, R2.2, R2.3, R2.4, R2.5]
  - id: AC3
    criterion: |
      Capture, structure, voice, style, critique, finalization, and publication
      have explicit validated inputs, outputs, and parents; no signal or verdict
      can advance the saga without durable hash-bound data.
    traces: [R3.1, R3.2, R3.3, R3.4]
  - id: AC4
    criterion: |
      Bounded retries restart at the responsible stage's last accepted parent,
      replay downstream work, preserve every prior byte and lineage record, and
      terminate without publication when exhausted.
    traces: [R4.1, R4.2, R4.3, R4.4, R4.5]
  - id: AC5
    criterion: |
      Intent records, invocation keys, content IDs, hash-checked finalization,
      and saga identity make child invocation, repeated delivery,
      finalization, and duplicate saga start idempotent or explicitly blocked.
    traces: [R5.1, R5.2, R5.3, R5.4]
  - id: AC6
    criterion: |
      Agent-core checkpoint state is explicitly limited to runtime position,
      execution metadata, references, and opaque receipts; the application
      workspace alone owns document bytes, and DB rollback never claims
      filesystem compensation.
    traces: [R6.1, R6.2, R6.3, R6.4]
  - id: AC7
    criterion: |
      Restart validates and repairs the workspace, reconciles either checkpoint
      ordering window from the manifest-selected parent, reuses invocation
      identity, and blocks safely on corruption or conflict.
    traces: [R7.1, R7.2, R7.3, R7.4]
  - id: AC8
    criterion: |
      Only an accepted finalized chain can enter one create-or-reuse GitHub
      publication; retries converge on one commit, ref, and pull request, while
      documentation reports all runtime surfaces as planned.
    traces: [R8.1, R8.2, R8.3, R8.4, R8.5]

