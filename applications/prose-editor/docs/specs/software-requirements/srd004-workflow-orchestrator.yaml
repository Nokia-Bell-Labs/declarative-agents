    - {name: hashing_structure_candidate, meaning: Validate and hash returned structure bytes.}
    - {name: writing_structure_attempt, meaning: Create or reuse the immutable structure attempt.}
    - {name: appending_structure_result, meaning: Record accepted, rejected, failed, uncertain, or superseded structure state.}
    - {name: projecting_structure_result, meaning: Project the structure result before routing.}
    - {name: appending_voice_intent, meaning: Allocate and persist one voice attempt and invocation key.}
    - {name: projecting_voice_intent, meaning: Project voice intent before reading or invoking.}
