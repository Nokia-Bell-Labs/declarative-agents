# The word every chatbot scenario drives a turn with. The scenarios differ in
# their mocks, machine, and expectation, not in this word, so they import it
# rather than each carrying a copy.
unit: mesh-chatbot-scenario-tools
tools:
  - name: drive_chat_turn
    type: builtin
    init: rest_client_invoke
    visibility: internal
    category: boundary
    description: Post one chat turn to the chatbot the rig started and map its answer.
    parameters:
      type: object
      properties: {}
    signature:
      emits: [SubjectAnswered, SubjectBroke, RESTResponded, CommandError]
    output:
      description: The chatbot's turn response.
      schema:
        type: object
        properties:
          answer: {type: string}
    side_effects:
      - kind: external_api
        target: chatbot.chat
        state: read_only
    reversibility:
      classification: reversible
    undo:
      strategy: noop
      description: A chat turn against mocks changes nothing durable.
    errors:
      - signal: CommandError
        condition: The chatbot is unreachable or returns an unmapped status.
        state_after_failure: No state changes.
    config:
      rest_ref: subject
      operation: chat_turn
