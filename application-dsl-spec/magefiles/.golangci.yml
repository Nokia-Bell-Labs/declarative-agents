version: "2"

linters:
  default: none
  enable:
    - forbidigo
  settings:
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: ^os\.Getenv$
          msg: use explicit configuration instead of os.Getenv
        - pattern: ^os\.LookupEnv$
          msg: use explicit configuration instead of os.LookupEnv
        - pattern: ^os\.Setenv$
          msg: pass environment on the child command instead of os.Setenv
  exclusions:
    rules:
      # Tests may stage process environment for child and re-exec helpers.
      - path: _test\.go$
        linters:
          - forbidigo

# gofmt is a formatter in the v2 schema, so it is declared here rather than in
# linters.enable, where it would be ignored. magefiles/format_test.go is the gate
# that fails a build, because mage lint is not part of the release recipe
# (GH-1477).
formatters:
  enable:
    - gofmt

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
