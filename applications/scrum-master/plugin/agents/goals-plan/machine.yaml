name: goals-plan
purpose: |-
  Plan one Sprint Goal per team for a release (srd022): the goals the road
  map's deliverables call for. Use when a model skill's tasks steps run
  without a model.

  This machine has no model state: scrum-master goals plan (design.md D10,
  D14; GH-48). The run starts in a checkout of the program.
configuration:
  machine: plugin/agents/goals-plan/machine.yaml
  tools: plugin/agents/goals-plan/tools.yaml
invariants:
- Every step is a word; no model acts anywhere in this machine
- A refusal ends the run in the state that names it, with the word's reason
lifecycle: |-
  1. Idle → Word (Seed): scrum-master goals plan
  2. Word → Done (ToolDone)
initial_state: Idle
budget:
  command_timeout: 16m
  max_iterations: 10
states:
- name: Idle
  meaning: Initial state before the first word.
- name: Word
  meaning: |
    The goals plan word: scrum-master goals plan names each team's Sprint
    Goal for the release.
- name: Done
  run_status: succeeded
  meaning: |
    Terminal. The word ran and reported what it did.
- name: Refused
  run_status: failed
  meaning: |
    Terminal. The word refused, and its reason is the run's last output.
- name: Failed
  run_status: failed
  meaning: Terminal. An infrastructure error outside the word's refusals.
terminal_states:
- Done
- Refused
- Failed
signals:
- name: Seed
  trigger: Loop initialization.
- name: ToolDone
  trigger: The word executed successfully.
- name: ToolFailed
  trigger: The word reported failure — a refusal with its reason.
- name: CommandError
  trigger: Infrastructure-level error (not a tool failure).
transitions:
- state: Idle
  signal: Seed
  next: Word
  action: goals_plan
  summary: true
- state: Word
  signal: ToolFailed
  next: Refused
- state: Word
  signal: ToolDone
  next: Done
- state: Idle
  signal: CommandError
  next: Failed
- state: Word
  signal: CommandError
  next: Failed
