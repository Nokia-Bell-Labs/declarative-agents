# The onboard machine's words (GH-29): lay down a joining repository, file
# its registration in the system repository, and install its skills, then
# vendor the profiles. SCRUM_MASTER_SYSTEM and SCRUM_MASTER_SUBSYSTEM name where it joins;
# optional flags are parameters from the run's request, never ${VAR} args
# (GH-135).
unit: scrum-master-onboard-declarations
tools:
- name: onboard
  type: exec
  binary: scrum-master
  args:
  - onboard
  - --json
  - --require-profiles
  - --system
  - ${SCRUM_MASTER_SYSTEM}
  - --subsystem
  - ${SCRUM_MASTER_SUBSYSTEM}
  visibility: internal
  description: Lay down a repository joining the program — corpus and orientation — file its registration in the system repository, and install the skills for the named agents (srd034, srd037); a rerun files nothing more.
  category: boundary
  parameters:
    type: object
    properties:
      agent:
        type: string
        description: The agents whose skills install, cursor, claude, copilot, or all; empty is the agents the repository already uses, refused when it uses none.
        flag: --agent
        default: detect
      ref:
        type: string
        description: The ref of the system repository's SRDs and control files, when not main.
        flag: --ref
      repository:
        type: string
        description: The repository's URL, when not its origin.
        flag: --repository
      path:
        type: string
        description: The component's path in the repository.
        flag: --path
      role:
        type: string
        description: What the repository is to its subsystem, component (a component's repository) or scrum (the team's scrum repository, where it plans and journals).
        flag: --role
        default: component
      owner:
        type: string
        description: The subsystem's owner, for a subsystem SRD the registration asks to create.
        flag: --owner
      components:
        type: string
        description: The subsystem's components, comma-separated, for a subsystem SRD the registration asks to create; empty is the subsystem's short name.
        flag: --component
  signature:
    emits: [ToolDone, ToolFailed, CommandError]
  output:
    description: scrum-master onboard's JSON report — the files, the registration issue, and the skills.
    schema:
      type: string
  side_effects:
  - kind: filesystem_write
    target: repository
    description: Writes the corpus, the orientation files, and the skills; an edited file is kept.
  - kind: external_api_call
    target: tracker
    description: Files the registration issue in the system repository, once.
  reversibility:
    classification: irreversible
    requires_confirmation: false
  undo:
    strategy: noop
    description: The files are the person's to commit or discard; the registration closes with its merge.
  errors:
  - signal: CommandError
    condition: the word cannot start — this agent does not serve the scrum-master words — or an environment variable is unset
    message_shape: 'onboard: <error>'
    state_after_failure: nothing written by a process that did not start
  - signal: ToolFailed
    condition: the word refuses the onboarding and exits non-zero
    message_shape: <the word's reason, as printed>
    state_after_failure: the repository is as the word's refusal left it

- name: vendor
  type: exec
  binary: scrum-master
  args:
  - install
  - --profiles
  - --json
  visibility: internal
  description: Vendor the release's profiles and agent-core declarations into .scrum-master, which the installed skills run, and report what drifted (GH-29).
  category: boundary
  signature:
    emits: [ToolDone, ToolFailed, CommandError]
  output:
    description: The vendoring's JSON report — the release and each file's action, created, updated, unchanged, kept, or removed.
    schema:
      type: string
  side_effects:
  - kind: filesystem_write
    target: repository
    description: Writes .scrum-master/agents, .scrum-master/agent-core/tools, and .scrum-master/manifest.json; an edited file is kept.
  reversibility:
    classification: irreversible
    requires_confirmation: false
  undo:
    strategy: noop
    description: The vendored tree is the person's to commit or discard; a rerun rewrites what nobody edited.
  errors:
  - signal: CommandError
    condition: the word cannot start — this agent does not serve the scrum-master words
    message_shape: 'vendor: <error>'
    state_after_failure: nothing written by a process that did not start
  - signal: ToolFailed
    condition: the release's source is not on this host, or a write fails
    message_shape: <the word's reason, as printed>
    state_after_failure: the repository is laid down; a rerun vendors what is missing
