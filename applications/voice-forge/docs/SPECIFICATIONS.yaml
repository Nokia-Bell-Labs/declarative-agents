coverage_gaps:
  - id: planned-srd-corpus
    status: planned
    description: |
      SRDs srd001 through srd004 are specified with requirement and
      acceptance-criterion traces. SRDs srd005 through srd008 are indexed but
      do not yet exist; their traces will be added by their owning
      documentation issues.
  - id: planned-orchestrator-signal-alignment
    status: planned
    description: |
      srd004 specifies bounded policy and responsible-stage signal refinements
      because MachineSpec cannot branch on CriticRejected output fields. The
      future srd003 declarations and profile ToolDefs must align before the
      workflow-orchestrator MachineSpec can validate; no runtime machine or
      executable conformance is claimed.
  - id: planned-release-trace
    status: planned
    description: |
      rel00.0-uc001-edit-document and test-rel00.0-voice-forge are indexed but
      do not yet exist. GH-1117 will define reciprocal touchpoint, success-
      criterion, acceptance-criterion, and test-case coverage.
  - id: executable-application
    status: planned
    description: |
      Profiles, machines, ToolDefs, services, persistent storage, external
      integrations, Mage targets, and root registration are outside this
      documentation epic. No runtime conformance claim is made.
  - id: external-dependency-evidence
    status: planned
    description: |
      Chroma, Ollama, GitHub, and optional Pangram behavior has no local
      executable evidence. Future tests must use bounded fixtures and explicit
      live-test policy without converting dependency availability into a
      documentation claim.
