        actor: chatbot-turn-validator
        role: critic
        sub_roles: [output-evaluator, sandbox-validator]
      - path: applications/chatbot-mesh/agents/chatbot/tests/degraded-rag/profile.yaml
        actor: chatbot-turn-validator
