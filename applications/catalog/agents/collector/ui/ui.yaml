# The collector trace UI composed on the ui-kit shell (srd004 R5, R7). The
# collector serves this UI same-origin with /query/* (srd020 R7), so
# trace_backend.query_path has an empty prefix and the kit reads the traces at
# the origin root rather than through /monitor-proxy/{agent}/ (srd004 R2.4).
# The traces panel is the kit TraceView driven by the URL; Explore is this
# application's own. The actions bind each page to the query machine request
# it drives.
version: 2
id: collector-trace-ui
title: Collector Trace Query UI
source_owner: agents/collector
sidebar:
  title: Collector
panels:
  - id: traces
    package: local
    route: /traces
    label: Traces
  - id: explore
    package: local
    route: /explore
    label: Explore
trace_backend:
  name: collector
  query_path: /query/traces/{trace_id}
actions:
  list_traces:
    ui_action: list_traces
    request_machine_action: query_list_traces
    route: traces
  get_trace:
    ui_action: get_trace
    request_machine_action: query_get_trace
    route: traces
  span_stats:
    ui_action: span_stats
    request_machine_action: query_span_stats
    route: explore
  span_breakdown:
    ui_action: span_breakdown
    request_machine_action: query_span_breakdown
    route: explore
