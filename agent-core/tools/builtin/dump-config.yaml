unit: builtin-dump-config
imports:
- ../units/types-core.yaml
tools:
- name: dump_config
  type: builtin
  init: dump_config
  visibility: internal
  description: Serialize the full experiment configuration (harness, model, tools, prompts) into experiment.yaml.
  signature:
    output: builtin-types-core.CommandSummary
    emits: [ConfigDumped, CommandError]
  category: word
  side_effects:
  - kind: filesystem_write
    target: experiment_config
    paths:
    - experiment.yaml
    description: Writes resolved experiment configuration for reproducibility.
  undo:
    strategy: owned_artifact_removal_and_point_context_restore
    description: Remove the receipt-recorded experiment config and restore PointContext.
    payload: evaluator_point_snapshot
    captures: [point_context, owned_artifact_paths]
  errors:
  - signal: CommandError
    condition: required input, configuration, or runtime state is invalid
    message_shape: 'dump_config: <error>'
    state_after_failure: no additional workflow step is executed by this tool
  relationships:
    before:
    - machine-selected predecessor
    after:
    - machine-selected successor
  output:
    description: dump_config command result summary.
