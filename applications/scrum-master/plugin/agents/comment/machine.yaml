name: comment
purpose: |-
  Comment on an issue as the caller (srd013). Use when a person asks to
  comment on an issue.

  This machine has no model state: scrum-master issue comment (design.md
  D10, D14; GH-37). SCRUM_MASTER_PROJECT and SCRUM_MASTER_ISSUE name the issue.
configuration:
  machine: plugin/agents/comment/machine.yaml
  tools: plugin/agents/comment/tools.yaml
invariants:
- Every step is a word; no model acts anywhere in this machine
- A refusal ends the run in the state that names it, with the word's reason
lifecycle: |-
  1. Idle → Comment (Seed): scrum-master issue comment
  2. Comment → Done (ToolDone)
initial_state: Idle
budget:
  command_timeout: 16m
  max_iterations: 10
states:
- name: Idle
  meaning: Initial state before the first word.
- name: Comment
  meaning: |
    The comment word: scrum-master issue comment posts the comment on the
    issue as the caller.
- name: Done
  run_status: succeeded
  meaning: |
    Terminal. Every word ran, and the last one reported what it did.
- name: Refused
  run_status: failed
  meaning: |
    Terminal. The comment was refused, and the word's reason is the run's
    last output.
- name: Failed
  run_status: failed
  meaning: Terminal. An infrastructure error outside the words' refusals.
terminal_states:
- Done
- Refused
- Failed
signals:
- name: Seed
  trigger: Loop initialization.
- name: ToolDone
  trigger: A word executed successfully.
- name: ToolFailed
  trigger: A word reported failure — a refusal with its reason.
- name: CommandError
  trigger: Infrastructure-level error (not a tool failure).
transitions:
- state: Idle
  signal: Seed
  next: Comment
  action: issue_comment
  summary: true
- state: Comment
  signal: ToolFailed
  next: Refused
- state: Comment
  signal: ToolDone
  next: Done
- state: Idle
  signal: CommandError
  next: Failed
- state: Comment
  signal: CommandError
  next: Failed
