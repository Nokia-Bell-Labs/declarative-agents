coverage_gaps:
  - id: planned-srd-corpus
    status: documentation_complete_runtime_planned
    description: |
      SRDs srd001 through srd008, two use cases (rel00.0-uc001-edit-document
      and rel00.1-uc001-tracer-saga), and two test suites (30-case 00.0 and
      13-case 00.1 tracer) provide reciprocal documentation traces. All 195
      requirement items map to SRD acceptance criteria and exact use-case
      touchpoints. Runtime implementation is staged across 00.1 (tracer
      skeleton) and 00.2 (full scenario).
  - id: planned-runtime-signal-alignment
    status: planned
    description: |
      srd003 now specifies bounded deterministic routing emissions required by
      srd004, srd005, and srd008 because MachineSpec cannot branch on
      result payload fields. Future profile ToolDefs and fixed non-shell helpers
      must implement those declared emissions before any MachineSpec can
      validate; no runtime machine or executable conformance is claimed.
  - id: executable-application
    status: planned
    description: |
      Profiles, machines, ToolDefs, services, persistent storage, external
      integrations, Mage targets, and root registration are outside this
      documentation epic. No runtime conformance claim is made.
  - id: external-dependency-evidence
    status: planned
    description: |
      Chroma, Ollama, GitHub, and optional Pangram behavior has no local
      executable evidence. Future tests must use bounded fixtures and explicit
      live-test policy without converting dependency availability into a
      documentation claim.
