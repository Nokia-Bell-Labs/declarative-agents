      domain_errors: [none; a changed invariant is a zero-exit report with preservation_status invalid]
      side_effects: [child_process]
      reversibility: {classification: reversible, undo: noop}
      compensation: Read-only deterministic observation; reject the candidate unless a parsed report later passes every branch.
      authority: Executes one fixed helper binary and inspect-constraints argument with bounded JSON stdin, structured output mode, and no shell, path, environment, endpoint, model, corpus, credential, or runtime executable selection.

