  - id: R-MACH-020
    target: specification
    level: MUST
    statement: >-
      A `for_each` that carries `dispatch` MAY carry `order`, a sequence
      contract over its kinds: `precedes` lists pairs `{before, after}`, and
      an array keeps the contract when no element of a pair's `after` kind
      comes ahead of an element of its `before` kind. `order` without
      `dispatch` MUST be refused. Each pair MUST name two distinct
      `dispatch.actions` keys; a pair need not mention every kind.
      `refused` MUST be a declared signal, and the join state MUST route it
      unless that state is terminal. A conforming runtime MUST check the
      whole array before any element runs; an array that breaks the
      contract runs no element and lands at the join on `refused`, recorded
      as one join step whose output names the broken pair and the indices
      of its two elements. Runtime data cannot alter the contract.
