# The plan type the expect fixtures hold to an expectation.
kind: tool-declaration
schema_version: 1
unit: expect-types
types:
  - name: Step
    schema:
      type: object
      properties:
        kind: {type: string, enum: [edit, test, review]}
  - name: Plan
    schema:
      type: object
      properties:
        steps: {type: array, items: {$type: expect-types.Step}}
        target: {type: string, enum: [staging, dev, prod]}
      required: [steps, target]
