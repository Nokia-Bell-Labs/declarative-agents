    test_case: Taxonomy and active path references match the new ownership

non_goals:
  - Reorganizing catalog internals during the mechanical relocation.
  - Moving generic Go tool implementations or core shared declarations into the catalog.
  - Changing MachineSpec, ToolDef, profile-relative reference, or runtime dispatch semantics.
  - Changing the /profiles or /opt/agent-core/tools runtime mount contracts.
  - Making Agent Core tests validate catalog membership or product behavior.
  - Treating the runtime as a package resolver or profile registry.
  - Rewriting or deleting existing git tags.

acceptance_criteria:
  - id: AC1
    criterion: The contract assigns the target source trees and separates core, catalog, and application ownership.
    traces: [R1.1, R1.2, R1.3, R1.4, R1.5, R1.6, R1.7, R2.1, R2.2, R2.3, R2.4, R2.5, R2.6]
  - id: AC2
    criterion: Every owner runs tests and Mage commands from its root without process-wide directory changes or incidental-CWD path resolution.
    traces: [R3.1, R3.2, R3.3, R3.4, R3.6]
  - id: AC3
    criterion: Agent Core tests, audit, and integrations require only core-owned fixtures and no catalog checkout.
    traces: [R1.2, R1.3, R3.5, R4.6]
  - id: AC4
    criterion: Catalog root resolution defines canonical input, legacy alias precedence, conflict behavior, discovery, diagnostics, and retirement.
    traces: [R4.1, R4.2, R4.3, R4.4, R4.5, R4.6, R4.7]
  - id: AC5
    criterion: Source paths, Go module paths, packaged closure paths, and runtime mount paths remain distinct and checkable.
    traces: [R5.1, R5.2, R5.3, R5.4, R5.5, R5.6]
  - id: AC6
    criterion: Catalog tag transition preserves existing exact v0 pins, defines canonical tags and dual-tag duration, and keeps compatibility separate from provenance.
    traces: [R6.1, R6.2, R6.3, R6.4, R6.5, R6.6]
  - id: AC7
    criterion: Migration order and release gates are explicit and preserve fail-fast owner-root execution.
    traces: [R7.1, R7.2, R7.3, R7.4, R7.5, R7.6]
  - id: AC8
    criterion: Every child issue in GH-1036 maps to requirements and one named formal test case.
    traces: [R7.1, R7.2, R7.3, R7.4, R7.5, R7.6]

