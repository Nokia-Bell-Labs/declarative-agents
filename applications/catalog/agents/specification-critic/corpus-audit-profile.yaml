# The catalog's corpus audit: the shipped specification-critic machine, bound
# to the catalog charter, run over the catalog's own documents by mage audit
# (GH-2310). The sibling audit-profile.yaml audits formal go_test evidence;
# this one audits the specification graph and the document indexes.
name: specification-critic-corpus-audit
machine: machine.yaml
tools:
  - tools.yaml
tool_declarations:
  - corpus-load.yaml
  - /opt/agent-core/tools/builtin/validate-specs.yaml
  - /opt/agent-core/tools/builtin/format-report.yaml
  - /opt/agent-core/tools/builtin/spec-validation/reduce-grep-checks.yaml
  - /opt/agent-core/tools/builtin/spec-validation/reduce-ref-checks.yaml
  - /opt/agent-core/tools/builtin/spec-validation/reduce-consistency-checks.yaml
  - ripgrep.yaml
  - ref-scan.yaml
  - consistency-scan.yaml
