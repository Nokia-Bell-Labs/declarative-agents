unit: monitor-tools
tools:
  - name: launch_monitor_rest
    type: builtin
    init: rest_server_launch
    visibility: internal
    description: Launch the embedded monitor REST server.
    category: boundary
    parameters: {type: object, properties: {}}
    signature:
      emits: [ServerLaunched, CommandError]
    side_effects: [{kind: network_listen, target: monitor, state: listener_started}]
    reversibility: {classification: compensatable}
    undo: {strategy: compensating_action, description: Stop the monitor listener.}
    config:
      rest_ref: monitor
  - name: await_monitor_control
    type: builtin
    init: rest_await_event
    visibility: internal
    description: Await the monitor control exit event.
    category: boundary
    parameters: {type: object, properties: {}}
    signature:
      emits: [ExitRequested, AwaitTimedOut, ServerStopped, CommandError]
    side_effects:
      - kind: state_mutation
        target: rest_server_queue
        state: selected_event_consumed
    reversibility:
      classification: reversible
    undo:
      strategy: queue_event_restore
      payload: rest_await_event
      captures: [source, event]
    config:
      sources:
        - server: monitor
          routes: [control_exit]
          signals: [ExitRequested]
      timeout: 30s
      stopped_behavior: emit_server_stopped
  - name: stop_monitor_rest
    type: builtin
    init: rest_server_stop
    visibility: internal
    description: Stop the embedded monitor REST server.
    category: boundary
    parameters: {type: object, properties: {}}
    signature:
      emits: [ServerStopped, CommandError]
    side_effects: [{kind: network_listener_shutdown, target: monitor, state: listener_stopped}]
    reversibility: {classification: reversible}
    undo: {strategy: noop, description: Relaunch is a separate machine action.}
    config:
      rest_ref: monitor
