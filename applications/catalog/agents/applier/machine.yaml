# An instance of agent-core's serve-machine template (srd054): the persistent
# service lifecycle with this agent's server words wired in. What a request
# does lives in request-machine.yaml.
unit: applier-machine
name: applier
purpose: |-
  Host a deployment actuation boundary as a persistent service. The host starts
  the request, control, and monitor listeners, waits for a lifecycle exit event,
  exits the agent, and stops the listeners. Application wrappers supply the REST
  definitions and deployment authority; this machine supplies only lifecycle
  sequencing shared by applier consumers.

  - The host grants no chart, release, namespace, deployment, endpoint, or credential authority.
instantiate:
  - fragment: /opt/agent-core/tools/machines/serve-machine-template.yaml
    args:
      launch_requests: launch_applier_requests
      launch_control: launch_applier_control
      await_control: await_applier_control
      stop_requests: stop_applier_requests
