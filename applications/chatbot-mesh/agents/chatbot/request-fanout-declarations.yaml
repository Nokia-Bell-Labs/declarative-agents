# Source-count-independent multi-RAG fan-out. request-topology-declarations.yaml
# declares the ordered topology; one sequential MachineSpec for_each dispatches
# rag_query over it. The join retains each item and its structured REST output,
# so generic partition and render_each words can filter and render without
# indexed words.
tools:
  - name: rag_query
    type: builtin
    init: rest_client_invoke
    visibility: internal
    category: boundary
    description: Query the currently bound RAG source with the message vector.
    problem: The chatbot must fan one embedding out over an ordered runtime topology without one word per source.
    goals:
      - Read the selected RAG authority from the trusted for_each item binding.
      - Return chunks and the source's reported embedding model.
    requirements:
      input:
        - The query embedding and current topology item are selected from command state.
      output:
        - Output includes ids, documents, distances, and embedding_model.
      errors:
        - A mapped 400 emits QueryRejected; transport and mapping failures emit CommandError.
    non_goals:
      - Does not accept a model-authored URL, method, credential, or operation.
    parameters:
      type: object
      properties: {}
      additionalProperties: false
    emits: [QueryResponded, QueryRejected, CommandError]
    output:
      description: Mapped RAG query response.
      schema:
        type: object
        properties:
          mapped: {type: object}
    side_effects:
      - {kind: external_api, target: rag_server.query, state: read_only}
    reversibility: {classification: reversible}
    undo: {strategy: noop, description: Querying a RAG source does not mutate it.}
    config:
      rest_ref: rag
      operation: query

  - name: partition_query_results
    type: builtin
    init: partition
    visibility: internal
    category: response
    description: Separate answered RAG queries from rejected or degraded queries.
    problem: Only successful REST results contain structured chunks and a reported embedding model.
    goals:
      - Preserve topology order in answered and failed sets.
      - Keep QueryRejected distinguishable from CommandError in the unmatched entries.
    requirements:
      input:
        - The for_each join items are selected through one fixed command-state selector.
      output:
        - matched contains QueryResponded items; unmatched contains rejected and degraded items.
      errors:
        - An unresolved or malformed join emits CommandError.
    non_goals:
      - Does not interpret embedding model identity.
    parameters: {type: object, properties: {}, additionalProperties: false}
    emits: [QueryResultsPartitioned, CommandError]
    output:
      description: Ordered answered and failed query outcomes.
      schema: {type: object}
    side_effects: []
    reversibility: {classification: reversible}
    undo: {strategy: noop, description: Partitioning changes no external state.}
    config:
      items: $from(rag_queries).items
      field: result.signal
      op: eq
      right: QueryResponded
      operand_type: string
      satisfied: QueryResultsPartitioned

  - name: partition_embedding_models
    type: builtin
    init: partition
    visibility: internal
    category: response
    description: Keep answered sources whose reported embedding model matches the query model.
    problem: A same-width foreign embedding can return 200, so vector acceptance alone does not prove model compatibility.
    goals:
      - Exclude model-mismatched sources from grounding.
      - Preserve the mismatched entries for explicit response metadata.
    requirements:
      input:
        - Answered join entries expose redacted JSON at result.structured_output.
      output:
        - matched sources may ground the answer; unmatched sources are embedding-model exclusions.
      errors:
        - Missing structured output or model fields emit CommandError.
    non_goals:
      - Does not merge, rank, or rewrite chunks.
    parameters: {type: object, properties: {}, additionalProperties: false}
    emits: [EmbeddingModelsPartitioned, CommandError]
    output:
      description: Ordered model-compatible and model-excluded query results.
      schema: {type: object}
    side_effects: []
    reversibility: {classification: reversible}
    undo: {strategy: noop, description: Partitioning changes no external state.}
    config:
      items: $from(partition_query_results).matched
      field: result.structured_output.mapped.embedding_model
      op: eq
      right: $from(declare_query_model).model
      operand_type: string
      satisfied: EmbeddingModelsPartitioned

  - name: render_grounding
    type: builtin
    init: render_each
    visibility: internal
    category: response
    description: Render model-compatible RAG chunks under their topology names.
    problem: Grounding must scale with topology size without indexed compose inputs.
    goals:
      - Render compatible sources in declared order.
      - Produce an empty string when no source survives.
    requirements:
      input:
        - The model-compatible partition is selected through one fixed selector.
      output:
        - Output is the joined per-source grounding text.
      errors:
        - Missing source names or documents emit CommandError.
    non_goals:
      - Does not filter, rank, or merge source arrays.
    parameters: {type: object, properties: {}, additionalProperties: false}
    emits: [GroundingRendered, CommandError]
    output: {description: Joined grounding sections., schema: {type: string}}
    side_effects: []
    reversibility: {classification: reversible}
    undo: {strategy: noop, description: Rendering changes no external state.}
    config:
      items: $from(partition_embedding_models).matched
      item_template: |-
        [{{ input.name }}]
        {{ json result.structured_output.mapped.documents }}
      separator: "\n\n"
      signal: GroundingRendered

  - name: compose_prompt
    type: builtin
    init: compose
    visibility: internal
    category: response
    description: Compose the question and rendered compatible grounding sections.
    problem: The answer model needs one fixed prompt independent of the RAG source count.
    goals:
      - Preserve the original question.
      - Include only model-compatible rendered sources.
    requirements:
      input:
        - The question and rendered grounding are selected from command state.
      output:
        - Output is the complete grounding prompt.
      errors:
        - Selector failures emit CommandError.
    non_goals:
      - Does not call a model or choose sources.
    parameters: {type: object, properties: {}, additionalProperties: false}
    emits: [Composed, CommandError]
    output: {description: Grounded answer prompt., schema: {type: string}}
    side_effects: []
    reversibility: {classification: reversible}
    undo: {strategy: noop, description: Prompt composition changes no external state.}
    config:
      signal: Composed
      inputs:
        message: $from(embed_query).carried.input
        grounding: $.
      template: |
        A user asked the following question:

        {{ message }}

        The following corpus chunks were retrieved to ground the answer. Each item
        is a document; cite the retrieved chunk when you use it. The chunks are
        grouped by the RAG source they came from.

        {{ grounding }}

        Answer the user's question using only these retrieved chunks. If the chunks
        do not contain the answer, say so plainly and do not speculate.

  # The three source lists the response reports, each projected to the fields a
  # reader needs before it leaves the mesh.
  #
  # A join entry is not a reportable shape. It carries `input`, the whole
  # topology entry the fan-out iterated -- including base_url, the in-cluster
  # address of the RAG unit -- alongside the query result. Composing the entries
  # directly put those addresses in the browser's response, while
  # compose_source_selection_prompt is careful to withhold exactly those fields
  # from a classifier that only had to pick source names.
  #
  # Rendered rather than projected: the project word extracts one field per item
  # and these need the source's name beside its outcome. Each renders its
  # entries as JSON objects and compose_response wraps them in the brackets, so
  # the pairing costs three words rather than six.
  - name: render_composed_sources
    type: builtin
    init: render_each
    visibility: internal
    category: response
    description: Render the composed sources as reportable entries.
    problem: A composed join entry carries the topology entry it was fanned out to, which names an in-cluster address the browser has no use for.
    goals:
      - Report the source name, its query outcome, and the chunks it contributed.
      - Leave the topology entry, and the address in it, inside the mesh.
    requirements:
      input:
        - The composed entries are the model-compatible partition.
      output:
        - Output is the entries as JSON objects, comma separated.
      errors:
        - An entry missing the projected fields emits CommandError.
    non_goals:
      - Does not filter, reorder, or count the entries.
    parameters: {type: object, properties: {}, additionalProperties: false}
    emits: [ComposedSourcesRendered, CommandError]
    output: {description: Rendered composed source entries., schema: {type: string}}
    side_effects: []
    reversibility: {classification: reversible}
    undo: {strategy: noop, description: Rendering changes no external state.}
    config:
      items: $from(partition_embedding_models).matched
      # documents and ids stay. The interface reports how much each source
      # contributed and the runtime has no length function to count it here
      # instead, and the ids are the record identities the rag-server returned
      # beside the chunks. Both are the reader's own corpus, already reachable
      # through the answer they grounded -- which is not true of base_url.
      item_template: '{"name": {{ json input.name }}, "signal": {{ json result.signal }}, "documents": {{ json result.structured_output.mapped.documents }}, "ids": {{ json result.structured_output.mapped.ids }}}'
      separator: ","
      signal: ComposedSourcesRendered

  - name: render_model_excluded_sources
    type: builtin
    init: render_each
    visibility: internal
    category: response
    description: Render the embedding-model-excluded sources as reportable entries.
    problem: An excluded join entry carries the same topology entry, and the exclusion is reported to the browser.
    goals:
      - Name each source excluded by the srd002 R3.3 comparison and the identity it reported.
      - Leave the topology entry inside the mesh.
    requirements:
      input:
        - The excluded entries are the model-incompatible partition.
      output:
        - Output is the entries as JSON objects, comma separated.
      errors:
        - An entry missing the projected fields emits CommandError.
    non_goals:
      - Does not filter or reorder the entries.
    parameters: {type: object, properties: {}, additionalProperties: false}
    emits: [ModelExcludedSourcesRendered, CommandError]
    output: {description: Rendered excluded source entries., schema: {type: string}}
    side_effects: []
    reversibility: {classification: reversible}
    undo: {strategy: noop, description: Rendering changes no external state.}
    config:
      items: $from(partition_embedding_models).unmatched
      # The identity it reported is the whole reason it was excluded, so that is
      # reported beside the name; the chunks it returned are not, because none
      # of them reached the answer.
      item_template: '{"name": {{ json input.name }}, "embedding_model": {{ json result.structured_output.mapped.embedding_model }}}'
      separator: ","
      signal: ModelExcludedSourcesRendered

  - name: render_query_failed_sources
    type: builtin
    init: render_each
    visibility: internal
    category: response
    description: Render the failed sources as reportable entries.
    problem: A failed join entry carries the topology entry, and its signal is the only thing separating a refusal from a broken boundary.
    goals:
      - Name each source whose query did not answer, with the signal that says why.
      - Leave the topology entry inside the mesh.
    requirements:
      input:
        - The failed entries are the unmatched query-result partition.
      output:
        - Output is the entries as JSON objects, comma separated.
      errors:
        - An entry missing the projected fields emits CommandError.
    non_goals:
      - Does not retry, filter, or reorder the entries.
    parameters: {type: object, properties: {}, additionalProperties: false}
    emits: [QueryFailedSourcesRendered, CommandError]
    output: {description: Rendered failed source entries., schema: {type: string}}
    side_effects: []
    reversibility: {classification: reversible}
    undo: {strategy: noop, description: Rendering changes no external state.}
    config:
      items: $from(partition_query_results).unmatched
      # QueryRejected is the rag-server refusing an incompatible vector and
      # CommandError is the boundary failing. The response keeps them apart, so
      # the signal is projected rather than flattened to "failed".
      item_template: '{"name": {{ json input.name }}, "signal": {{ json result.signal }}}'
      separator: ","
      signal: QueryFailedSourcesRendered

  - name: compose_response
    type: builtin
    init: compose
    visibility: internal
    category: response
    description: Compose the answer with complete source selection and query outcome metadata.
    problem: Every declared source must remain reportable without rebuilding an indexed metadata array.
    goals:
      - Report not-selected, compatible, model-excluded, and query-failed sources as distinct ordered sets.
      - Preserve QueryRejected versus CommandError in each failed join entry.
    requirements:
      input:
        - Fixed selectors read the query partition counts and both generic partitions.
      output:
        - Output carries answer, query model, and all per-source outcomes.
      errors:
        - Missing fixed pipeline outputs emit CommandError.
    non_goals:
      - Does not infer outcomes or merge collections.
    parameters: {type: object, properties: {}, additionalProperties: false}
    emits: [ResponseComposed, CommandError]
    output: {description: Answer and source outcome metadata., schema: {type: object}}
    side_effects: []
    reversibility: {classification: reversible}
    undo: {strategy: noop, description: Response composition changes no external state.}
    config:
      signal: ResponseComposed
      inputs:
        answer: $.
        query_model: $from(declare_query_model).model
        succeeded: $from(partition_query_results).matched_count
        failed: $from(partition_query_results).unmatched_count
        # The rendered projections, not the join entries: the entries carry the
        # topology the fan-out iterated, base_url included, and this template
        # writes what the browser receives.
        composed: $from(render_composed_sources).$
        model_excluded: $from(render_model_excluded_sources).$
        query_failed: $from(render_query_failed_sources).$
        not_selected: $from(source_selection_report).unmatched
      template: |
        {
          "answer": {{ json answer }},
          "metadata": {
            "query_embedding_model": {{ json query_model }},
            "query_counts": {"succeeded": {{ succeeded }}, "failed": {{ failed }}},
            "sources": {
              "not_selected": {{ json not_selected }},
              "composed": [{{ composed }}],
              "embedding_model_excluded": [{{ model_excluded }}],
              "query_failed": [{{ query_failed }}]
            }
          }
        }
