{{- if .Values.applier.enabled }}
{{- $fullname := include "chatbot-mesh.fullname" . -}}
{{/*
The applier (srd006): the deployment-plane actuation agent that replaces the
standard-library Go provisioner as the deployment API (srd003 R4). It runs the
agent-core runtime with a mounted profile whose request-machine binds the helm and
kubectl CLIs in this image as exec words. It edits deployment values and triggers
rollouts only; it submits no endpoint or credential to a running agent.

Sanctioned image divergence (srd003 R1.3): the shared applier image carries helm
and kubectl alongside the agent-core runtime binary, diverging from the binary-only
runtime image because a deployment-plane agent needs its CLIs in its container.
Recorded here so the declarative-decomposition audit does not re-flag it. The chart
is not baked into the image (GH-1368): it is delivered to the applier pod at /chart
as a mounted volume (the packaged chart, unpacked by the stage-chart init
container), so one shared image serves every app.

The chart tarball is carried by a ConfigMap the deploy/test tooling provisions
out-of-release (kubectl create), named by applier.chartArchiveConfigMap. It is kept
out of the Helm release because the chatbot-mesh chart embeds the collector trace
UI, and encoding the packaged chart into the release values and a rendered
ConfigMap's binaryData stored the archive twice and pushed the release Secret past
the 1 MiB apiserver limit (GH-1407). Provisioning it out-of-release mirrors the
GH-1402 curator-UI shard delivery.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fullname }}-mesh-state
  labels:
    {{- include "chatbot-mesh.labels" . | nindent 4 }}
    app.kubernetes.io/component: applier
data:
  # The mesh view (srd003 R4) projected from the same values that render the
  # topology, mounted read-only for the applier's state read path.
  mesh.json: |-
    {{- include "chatbot-mesh.meshView" . | nindent 4 }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $fullname }}-applier
  labels:
    {{- include "chatbot-mesh.labels" . | nindent 4 }}
    app.kubernetes.io/component: applier
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $fullname }}-applier
  labels:
    {{- include "chatbot-mesh.labels" . | nindent 4 }}
    app.kubernetes.io/component: applier
rules:
  # Read deployment state for the rollout verification (kubectl rollout status).
  - apiGroups: [""]
    resources: [configmaps, services]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, statefulsets]
    verbs: [get, list, watch]
  # helm --wait judges readiness by watching the ReplicaSets and Pods a
  # Deployment owns, so an apply that waits needs to read them even though it
  # never writes them. Reading them is also what kubectl rollout status does.
  - apiGroups: [apps]
    resources: [replicasets]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
  {{- if .Values.applier.allowApply }}
  # The apply path runs helm upgrade in-cluster, which manages the chart's objects
  # and the release Secret. Scoped to this namespace by the RoleBinding.
  #
  # helm needs to *read* the release Secrets before it can do anything at all --
  # even --dry-run queries them to find the current release -- so secrets appear
  # in a read rule here and not only in the write rule below. Without it an apply
  # fails at the validate step with "secrets is forbidden ... cannot list", which
  # the applier reports as a rejected patch: the caller is told their values were
  # bad when the applier could not read its own release (GH-747).
  - apiGroups: [""]
    resources: [secrets, serviceaccounts]
    verbs: [get, list, watch]
  # An upgrade re-renders the whole chart (srd006 R2.2), so the applier must be
  # able to read and write every object kind the chart contains -- not only the
  # workloads. It renders its own NetworkPolicy, ServiceAccount, Role, and
  # RoleBinding, and helm compares each against the cluster before applying.
  #
  # Writing Roles is a privilege-escalation surface, bounded here by two things:
  # the RoleBinding keeps every grant namespace-scoped, and Kubernetes forbids
  # granting permissions the grantor does not already hold, so the applier can
  # re-apply its own Role but cannot widen it.
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get, list, watch, create, update, patch]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [roles, rolebindings]
    verbs: [get, list, watch, create, update, patch]
  - apiGroups: [""]
    resources: [configmaps, secrets, services, serviceaccounts]
    verbs: [create, update, patch, delete]
  - apiGroups: [apps]
    resources: [deployments, statefulsets]
    verbs: [create, update, patch]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $fullname }}-applier
  labels:
    {{- include "chatbot-mesh.labels" . | nindent 4 }}
    app.kubernetes.io/component: applier
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $fullname }}-applier
subjects:
  - kind: ServiceAccount
    name: {{ $fullname }}-applier
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-applier
  labels:
    {{- include "chatbot-mesh.labels" . | nindent 4 }}
    app.kubernetes.io/component: applier
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "chatbot-mesh.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: applier
  template:
    metadata:
      labels:
        {{- include "chatbot-mesh.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: applier
        # The observer's monitor fan-in reads this pod's monitor port from a
        # label, because a pod's container ports live in an array the
        # command-state selector grammar cannot address (srd008 R2.1, GH-1319).
        # The key carries no dot so the dotted selector can reach it.
        monitorPort: {{ .Values.applier.ports.monitor | quote }}
    spec:
      # The applier calls the Kubernetes API through helm and kubectl (helm upgrade,
      # kubectl rollout status), so unlike the mesh's chat-path agents it mounts its
      # ServiceAccount token. Made explicit (matching the other apps' appliers) so a
      # namespace or ServiceAccount default of automount=false could never leave the
      # in-pod kubectl without the token it needs to reach the API in-cluster.
      automountServiceAccountToken: true
      serviceAccountName: {{ $fullname }}-applier
      {{- if .Values.applier.chartArchiveConfigMap }}
      initContainers:
        # Unpack the app's packaged chart into the shared /chart emptyDir so the
        # applier's `helm upgrade chatbot-mesh /chart` word finds a chart directory.
        # The chart is delivered as data via a ConfigMap the deploy/test tooling
        # provisions out-of-release (applier.chartArchiveConfigMap), not baked into
        # the shared applier image (GH-1368) and not carried in the release Secret
        # (GH-1407). --strip-components=1 drops the tarball's top-level
        # chatbot-mesh/ directory so /chart is the chart root.
        - name: stage-chart
          image: "{{ .Values.applier.image.repository }}:{{ .Values.applier.image.tag }}"
          imagePullPolicy: {{ .Values.applier.image.pullPolicy }}
          command: ["sh", "-c", "tar -xzf /chart-src/chart.tgz -C /chart --strip-components=1"]
          volumeMounts:
            - {name: chart-src, mountPath: /chart-src, readOnly: true}
            - {name: chart, mountPath: /chart}
      {{- end }}
      containers:
        - name: applier
          # The shared applier image carries the agent-core runtime plus helm and
          # kubectl; the chart is mounted at /chart (not baked, GH-1368). The exec
          # words run `helm upgrade chatbot-mesh /chart ...`, so the release name
          # matches the chart name.
          image: "{{ .Values.applier.image.repository }}:{{ .Values.applier.image.tag }}"
          imagePullPolicy: {{ .Values.applier.image.pullPolicy }}
          args:
            - "--profile"
            - "{{ .Values.profiles.mountPath }}/applications/chatbot-mesh/applier/profile.yaml"
            - "--directory"
            - "{{ .Values.profiles.workMountPath }}"
            {{- with include "chatbot-mesh.otlpEndpoint" . }}
            - "--otel-otlp-endpoint"
            - {{ . | quote }}
            - "--otel-service-name"
            - "applier"
            {{- end }}
            {{- with include "chatbot-mesh.otlpMetricEndpoint" . }}
            - "--otel-metric-otlp-endpoint"
            - {{ . | quote }}
            {{- end }}
          env:
            {{- with include "chatbot-mesh.integrationResourceAttributes" . }}
            - {name: OTEL_RESOURCE_ATTRIBUTES, value: {{ . | quote }}}
            {{- end }}
            - {name: APPLIER_BIND_HOST, value: "0.0.0.0"}
            # The workspace the agent writes its values file into, the same path
            # mounted as the work volume below and passed as --directory, so the
            # write stays inside the workspace wherever the mount moves (GH-737).
            - {name: APPLIER_WORK_DIR, value: {{ .Values.profiles.workMountPath | quote }}}
          ports:
            - {name: apply, containerPort: {{ .Values.applier.ports.apply }}}
            - {name: control, containerPort: {{ .Values.applier.ports.control }}}
            - {name: monitor, containerPort: {{ .Values.applier.ports.monitor }}}
          readinessProbe:
            httpGet: {path: /api/lifecycle/health, port: control}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.applier.resources | nindent 12 }}
          volumeMounts:
            - {name: profiles, mountPath: {{ .Values.profiles.mountPath }}, readOnly: true}
            - {name: work, mountPath: {{ .Values.profiles.workMountPath }}}
            - {name: mesh-state, mountPath: /etc/applier, readOnly: true}
            {{- if .Values.applier.chartArchiveConfigMap }}
            # The chart the stage-chart init container unpacked, at the /chart path
            # the helm_upgrade exec word references (GH-1368).
            - {name: chart, mountPath: /chart}
            {{- end }}
      volumes:
        {{- if .Values.applier.chartArchiveConfigMap }}
        - name: chart
          emptyDir: {}
        - name: chart-src
          configMap:
            name: {{ .Values.applier.chartArchiveConfigMap }}
        {{- end }}
        {{- include "chatbot-mesh.profilesVolume" . | nindent 8 }}
        - name: work
          emptyDir: {}
        - name: mesh-state
          configMap:
            name: {{ $fullname }}-mesh-state
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-applier
  labels:
    {{- include "chatbot-mesh.labels" . | nindent 4 }}
    app.kubernetes.io/component: applier
spec:
  selector:
    {{- include "chatbot-mesh.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: applier
  ports:
    - {name: apply, port: {{ .Values.applier.ports.apply }}, targetPort: apply}
    - {name: control, port: {{ .Values.applier.ports.control }}, targetPort: control}
    - {name: monitor, port: {{ .Values.applier.ports.monitor }}, targetPort: monitor}
{{- if .Values.applier.networkPolicy.enabled }}
---
# Authenticated apart from the chat path (srd003 R4.1 / srd006 R4.1) at the network
# layer: only the creator (and provisioning-workflow-orchestrator) may reach the apply surface. agent-core
# REST servers carry no inbound auth, so the boundary is enforced here rather than in
# the profile.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-applier
  labels:
    {{- include "chatbot-mesh.labels" . | nindent 4 }}
    app.kubernetes.io/component: applier
spec:
  podSelector:
    matchLabels:
      {{- include "chatbot-mesh.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: applier
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "chatbot-mesh.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: creator
      ports:
        - {protocol: TCP, port: apply}
{{- end }}
{{- end }}
