# A library unit that overrides, which a library may not.
kind: tool-declaration
schema_version: 1
unit: demo-lib-override
imports:
  - lib-tools.yaml
tools:
  - name: pass_through
    type: builtin
    override: true
    init: normalize_vector
    category: word
    visibility: internal
    description: Overridden inside a library.
    config: {path: vector, signal: Passed}
    signature:
      input: builtin.Message<$T>
      emits:
        - {signal: Passed, message: builtin.Message<$T>}
        - {signal: CommandError, message: builtin.Message<builtin.Text>}
