# One profile-free runtime image runs both workloads. It carries agent-core and
# the core-owned tool declarations the curator profile names under
# /opt/agent-core; the canonical curator and collector profiles are generated by
# `mage helmPrepare` and mounted read-only at /profiles rather than baked in.
image:
  repository: ghcr.io/nokia-bell-labs/declarative-agents/agent-architecture-runtime
  tag: "0.1.0"
  pullPolicy: IfNotPresent

profiles:
  mountPath: /profiles

# The documentation-curator (applications/catalog documentation-curator profile).
# Ports match the canonical profile's rest.yaml server binds: documentation
# 18081, lifecycle-control 18082, monitor 18084. The catalog profile binds these
# on loopback, so probes call the lifecycle health endpoint over the pod's own
# localhost via an exec probe rather than a kubelet httpGet.
curator:
  replicas: 1
  documentationPort: 18081
  controlPort: 18082
  monitorPort: 18084
  # OTel resource service.name the curator exports its spans under; the collector
  # retains traces keyed by this name (srd001 R1.5, R3.4).
  serviceName: knowledge-manager-curator
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: "2", memory: 2Gi}

# The collector (applications/catalog collector profile) in spool mode. It binds
# the OTLP receiver and its control, monitor, and query surfaces on 0.0.0.0 via
# the profile's COLLECTOR_BIND_HOST parameter, so kubelet httpGet probes and the
# in-cluster OTLP path both reach it. Disable it to run the curator alone.
collector:
  enabled: true
  image:
    repository: ghcr.io/nokia-bell-labs/declarative-agents/agent-core
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  otlpGRPCPort: 4317
  controlPort: 18191
  monitorPort: 18192
  queryPort: 18193
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {cpu: 500m, memory: 512Mi}

# The applier (srd002-applier): the deployment-plane actuator that realizes a
# decided values patch against the chart on Kubernetes. Disabled by default -- it
# runs the shared applier image (agent-core plus helm and kubectl, a sanctioned
# divergence from the profile-free runtime image, srd001 R1.2; GH-1368), which is
# not the runtime image the curator and collector smoke tests kind-load, so the
# live tier enables it explicitly (ci/kind-applier-values.yaml) and supplies the
# chart it mounts at /chart via applier.chartArchive.
applier:
  enabled: false
  # The shared applier image carries the agent-core runtime plus helm and kubectl
  # (GH-1368); it bakes no chart. Built from agent-core/applier.Dockerfile.
  image:
    repository: ghcr.io/nokia-bell-labs/declarative-agents/applier
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  # The packaged chart the applier's `helm upgrade agent-architecture /chart` word
  # installs, base64-encoded, delivered to the applier pod at /chart as a mounted
  # volume rather than baked into the image (GH-1368). Empty by default; whoever
  # enables the applier supplies it, e.g. the release tooling passes
  #   --set-file applier.chartArchive=<packaged-chart.tgz.b64>
  # so the chart bytes travel with the Helm release. With it empty the applier
  # renders without the chart mount (fine for render-only checks; a live applier
  # needs the chart).
  chartArchive: ""
  # apply/request server, control server, monitor server. Chosen apart from the
  # curator ports (18081/18082/18084) and the collector ports (4317/18191-18193)
  # so no listener collides.
  ports: {apply: 18230, control: 18231, monitor: 18232}
  # The workspace the applier writes its values overrides file into; APPLIER_WORK_DIR
  # and the helm read path bind to it so the write and read never diverge.
  workDir: /work
  # allowApply grants the apply-path RBAC (helm upgrade manages the chart objects).
  allowApply: true
  # Gate the apply surface off the curator and collector pods at the network layer:
  # the declarative REST servers carry no inbound auth, so only an authorized
  # operator or CI caller reaches the apply port (srd002-applier R4.3).
  networkPolicy:
    enabled: true
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 500m, memory: 256Mi}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile: {type: RuntimeDefault}

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
