name: specification-critic-test-evidence-audit
purpose: |-
  Load formal test claims, inventory and run Go tests through declared
  subprocesses, reduce the results deterministically, and report findings.
initial_state: Idle
budget:
  command_timeout: 15m
  max_iterations: 100
states:
  - {name: Idle, meaning: Initial state.}
  - {name: LoadingClaims, meaning: Loading formal test-suite claims.}
  - {name: InventoryModule, meaning: Reading the Go module path.}
  - {name: InventoryPackages, meaning: Reading the raw Go package inventory.}
  - {name: NormalizingPackages, meaning: Sorting package inventory through bounded command-state stdin.}
  - {name: InventoryTests, meaning: Listing top-level Go tests.}
  - {name: ResolvingClaims, meaning: Resolving formal claims against the inventory.}
  - {name: RunningTests, meaning: Running the declared full-module test command.}
  - {name: ReducingTests, meaning: Reducing test events against resolved claims.}
  - {name: Reporting, meaning: Formatting all findings.}
  - {name: Passed, meaning: Terminal successful audit., run_status: succeeded}
  - {name: Failed, meaning: Terminal failed audit., run_status: failed}
terminal_states: [Passed, Failed]
signals:
  - {name: Seed, trigger: Loop initialization.}
  - {name: ToolDone, trigger: A tool completed successfully.}
  - {name: ToolFailed, trigger: A tool completed with a governed failure.}
  - {name: CommandError, trigger: Infrastructure or malformed-data failure.}
  - {name: ValidationPassed, trigger: A reduction found no errors.}
  - {name: ValidationFailed, trigger: A reduction found errors.}
transitions:
  - {state: Idle, signal: Seed, next: LoadingClaims, action: load_test_claims}
  - {state: LoadingClaims, signal: ToolDone, next: InventoryModule, action: go_module, label: go_module}
  - {state: LoadingClaims, signal: CommandError, next: Failed}
  - {state: InventoryModule, signal: ToolDone, next: InventoryPackages, action: go_packages_raw, label: go_packages_raw}
  - {state: InventoryModule, signal: ToolFailed, next: Failed}
  - {state: InventoryModule, signal: CommandError, next: Failed}
  - {state: InventoryPackages, signal: ToolDone, next: NormalizingPackages, action: go_packages, label: go_packages}
  - {state: InventoryPackages, signal: ToolFailed, next: Failed}
  - {state: InventoryPackages, signal: CommandError, next: Failed}
  - {state: NormalizingPackages, signal: ToolDone, next: InventoryTests, action: go_test_inventory, label: go_test_inventory}
  - {state: NormalizingPackages, signal: ToolFailed, next: Failed}
  - {state: NormalizingPackages, signal: CommandError, next: Failed}
  - {state: InventoryTests, signal: ToolDone, next: ResolvingClaims, action: resolve_test_evidence}
  - {state: InventoryTests, signal: ToolFailed, next: ResolvingClaims, action: resolve_test_evidence}
  - {state: InventoryTests, signal: CommandError, next: Failed}
  - {state: ResolvingClaims, signal: ValidationPassed, next: RunningTests, action: go_test_run, label: go_test_run}
  - {state: ResolvingClaims, signal: ValidationFailed, next: Reporting, action: format_report}
  - {state: ResolvingClaims, signal: CommandError, next: Failed}
  - {state: RunningTests, signal: ToolDone, next: ReducingTests, action: reduce_test_evidence_run}
  - {state: RunningTests, signal: ToolFailed, next: ReducingTests, action: reduce_test_evidence_run}
  - {state: RunningTests, signal: CommandError, next: Failed}
  - {state: ReducingTests, signal: ValidationPassed, next: Reporting, action: format_report}
  - {state: ReducingTests, signal: ValidationFailed, next: Reporting, action: format_report}
  - {state: ReducingTests, signal: CommandError, next: Failed}
  - {state: Reporting, signal: ToolDone, next: Passed}
  - {state: Reporting, signal: ToolFailed, next: Failed}
  - {state: Reporting, signal: CommandError, next: Failed}
