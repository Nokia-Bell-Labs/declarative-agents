  - id: R-PROF-008
    target: specification
    level: MUST
    statement: >-
      A profile MAY declare `libraries`, mapping lowercase-kebab root names
      to directories relative to its file; `agent-core` is the implicit
      root of the standard library and MUST NOT be declared. An import
      under `/opt/<name>/` maps to the named root, which MUST be declared in
      the closure of the profile that reaches it; a child agent declares its
      own. A library is read-only to its importers: a tool in a file under a
      root MUST NOT carry `override: true`, and a relative import there
      MUST NOT leave the root. `--library <name>=<path>` overrides a
      declared root for one run.
    acceptance:
      - assertion: fixture
        path: fixtures/specification/profile-closure/library.yaml
