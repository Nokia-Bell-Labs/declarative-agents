        verdict: invalid
      - assertion: rig
        path: agent-core/internal/runtime/core/machine_template_test.go
        test: TestMachineInstanceCarriesOnlyItsHeader

  - id: R-MACH-003
    target: processor
    level: MUST
    statement: >-
      A conforming processor MUST run only a machine: a machine specification
      that binds every parameter, names a start state under `initial_state`,
      and names at least one final state under `terminal_states`. It MUST
      refuse to run a specification that leaves a parameter open or lacks
      either state, naming what is missing; such a specification is a
      template, which other machine specifications compose.
    acceptance:
      - assertion: pending
        note: >-
          No test in this repository anchors this statement; the engine in
          this repository implements the 1.0 language.

  - id: R-MACH-004
    target: specification
    level: MUST NOT
    statement: >-
      A machine specification MUST NOT carry the `imports` or `expand`
      keynames; a machine reuses other machines only by composing them.
    acceptance:
      - assertion: fixture
        path: fixtures/specification/machine-reuse/composes.yaml
        check: machine_reuses_by_composition
        verdict: valid
      - assertion: fixture
        path: fixtures/specification/machine-reuse/expands.yaml
        check: machine_reuses_by_composition
        verdict: invalid

  - id: R-MACH-005
    target: processor
    level: MUST
    statement: >-
      A conforming processor MUST raise the loop signals itself, in
      whatever state the run is in and whatever any word declares: `Seed`
      when a run starts, carrying the request seed for a machine an endpoint
      dispatches; `CommandError` when a word, or the exchange that carries
      it, fails; and `BudgetExhausted` when the machine's iteration or
      token budget, or a bounded retry, is spent. A transition on a loop
      signal is therefore live in every state.
    acceptance:
      - assertion: rig
        path: agent-core/internal/runtime/core/loop_runtime_test.go
        test: TestLoop_BudgetExhausted
      - assertion: rig
        path: agent-core/internal/runtime/core/loop_runtime_test.go
        test: TestLoop_TokenBudgetExhausted
      - assertion: pending
        note: >-
          No test in this repository anchors this statement; the engine in
          this repository implements the 1.0 language.

  - id: R-MACH-006
    target: processor
    level: MUST
    statement: >-
      A conforming processor MUST give the engine's other reserved signals
      one meaning each. `ArgumentsRejected` reaches the target of a `$tool`
      transition whose chosen tool's arguments do not conform, and the tool
      did not run. `<Id>Received`, the channel id in upper camel case, is an
      item arriving on a channel the agent service consumes (R-PROF-004).
      A network action answers with `Replied` or `SendFailed` on a
      `request-reply` channel when no local tool gives it a contract, with
      `Sent` or `Dropped` on a one-way channel, adding `ChainExhausted` on
      a budgeted agent service's cycle channel (R-RUN-005), and with
      `Answers` or `Deadline` on a `survey` channel; the completing-side words answer
      with `Received` or `Empty` (`receive_`) and `Sent` (`respond_`); and a
      listener run answers with its outcome, `ToolDone` or `ToolFailed`
      (R-MODEL-006, R-PROF-006).
    acceptance:
      - assertion: pending
        note: >-
          No test in this repository anchors this statement; the engine in
          this repository implements the 1.0 language.

  - id: R-RUN-005
    target: runtime
    level: MUST
    statement: >-
      The engine enforces each declared `budget` (R-APP-005) on the item
      chains that cross it. A delivery on a channel that can bring an item
      back to its emitter, a `request-reply` request and a `survey` question
      included, carries the chain's remaining hop count beside the item,
      never inside it, and the run the delivery starts, or the run that
      takes it, holds that count. An agent service that declares a `budget`
      starts an uncounted chain at its budget and otherwise spends one hop on
      each such send, never raising the count above its budget; any other
      agent service passes the count on unchanged. When a budgeted agent
      service's send would leave the chain no hop, nothing is delivered: a
      one-way send answers `ChainExhausted` (R-MACH-006), and a request or a
      survey fails, each naming the channel and the budget. The budget bounds
      each chain's depth, not its volume: every copy a send delivers carries
      the same count, so an agent service that sends k items per arrival can
      cause on the order of k^budget deliveries. A loop that closes through
      state one agent service stores and another reads in an unrelated later
      run carries no count and is outside the bound.
    acceptance:
      - assertion: pending
        note: >-
          No test in this repository anchors this statement; the engine in
          this repository implements the 1.0 language.

  - id: R-RUN-007
    target: runtime
    level: MUST
    statement: >-
      A listener admits an item on a channel only from one of the channel's
      declared emitters, named by the request's `Loom-Root` header, and
      refuses any other root with status 403. When the application's
      channel key is configured, as `LOOM_CHANNEL_KEY` or the file
      `LOOM_CHANNEL_KEY_FILE` names, every request an agent service dials to
      a listener MUST carry an HMAC-SHA256 signature under that key over its
      method, its path and query (which name the channel), its emitter
      root, hop count, request id, and respondent headers, its body, a
      timestamp, and a nonce, and the listener MUST refuse with the same 403
      a request that is unsigned, signed under another key or over other
      contents, timestamped more than two minutes from the listener's
      clock, or carrying a nonce it accepted within that window. A key
      named by `LOOM_CHANNEL_KEY_FILE` that cannot be read refuses the
      start. With no key configured the listener admits on the header
      alone and MUST say so once at startup, naming its address and root.
      The key stops a process outside the application from injecting an
      item under an emitter's id. It does not tell the application's agent
      services apart: every one holds the key and can sign as any root, an
      exec tool's program inherits it with the agent's environment and
      files (R-TOOL-009), and the agents of one application are trusted
      with each other's ids. It does not encrypt an item, authenticate the
      lifecycle routes, or cover the agent operator's intake, which accepts
      a task agent's item unsigned and signs it at delivery.
    acceptance:
      - assertion: pending
        note: >-
          No test in this repository anchors this statement; the engine in
          this repository implements the 1.0 language.

  - id: R-MACH-007
    target: specification
    level: MUST NOT
    statement: >-
      A machine declares a reserved signal under `signals` only to route
      the engine's signal, and routing it gives it the engine's meaning. A
      machine MUST NOT route a reserved signal where the engine cannot
      raise it: the loop signals and a consumed channel's arrival reach any
      state, `ArgumentsRejected` only the target of a `$tool` transition,
      and a word's outcome only the target of a transition that calls that
      word. A transition on a reserved signal anywhere else is dead, and a
      conforming processor refuses it.
    acceptance:
      - assertion: pending
        note: >-
          No test in this repository anchors this statement; the engine in
          this repository implements the 1.0 language.
      - assertion: rig
        path: agent-core/internal/tools/catalog/exhaustiveness_test.go
        test: TestExhaustivenessAcceptsExternallyInjectedSignals
      - assertion: pending
        note: >-
          No fixture exercises the rule, because the fixture checks load a
          machine without its tools, and liveness needs the tools' emits.
          A check that loads a machine with a declaration unit would give
          this statement a valid and an invalid fixture.

  - id: R-MACH-008
    target: specification
    level: MUST
    statement: >-
      A template or a declaration fragment MAY reference a parameter it
      declares as `$param(name)`. A reference MUST stand inside a scalar
      value, never as a mapping name or as list structure, so an argument
      cannot add a key, an entry, or a tool, and substitution gives the
      scalar the parameter's type. A reference reaches only the parameters
      of the document it appears in; a nested template receives a value only
      through its compose entry's `args` (R-MODEL-005). A conforming
      processor MUST refuse a reference to an undeclared parameter and one
      left after substitution, naming the document and the line.
    acceptance:
      - assertion: fixture
        path: fixtures/specification/param-reference/valid.yaml
        check: param_reference
        verdict: valid
      - assertion: fixture
        path: fixtures/specification/param-reference/undeclared.yaml
        check: param_reference
        verdict: invalid
      - assertion: fixture
        path: fixtures/specification/param-reference/mapping-name.yaml
        check: param_reference
        verdict: invalid
      - assertion: rig
        path: agent-core/internal/fragments/substitute_test.go
        test: TestSubstituteFillsScalarHolesWithTheirTypes
      - assertion: rig
        path: agent-core/internal/fragments/substitute_test.go
        test: TestSubstituteIgnoresEnvironmentAndSelectorForms

  - id: R-MACH-009
    target: processor
    level: MUST
    statement: >-
      A selector `$from(label).path`, or `$from(label:Signal).path`, reads
      the output of the newest completed step the label addresses: a
      transition's `label`, or the name of the command it ran, so an
      unlabeled step answers to its command name and a `$tool` step keeps
      its label whichever tool ran. `:Signal` narrows the read to the output
      the step produced with that signal, and `.path` names a field of that
      output's type. A conforming processor MUST refuse, before any run, a
      selector whose label no step on a path to it publishes, whose signal
      the step does not emit, or whose path a message the step may produce
      lacks.
    acceptance:
      - assertion: rig
        path: agent-core/internal/runtime/core/selector_test.go
        test: TestParseSelectorGrammar
      - assertion: rig
        path: agent-core/internal/tools/catalog/selector_labels_test.go
        test: TestValidateSelectorLabelsReportsUnknownToolLabel
      - assertion: rig
        path: agent-core/internal/tools/catalog/selector_labels_test.go
        test: TestMachineLabelsAddressesUnlabeledTransitionByCommandName
      - assertion: rig
        path: agent-core/internal/tools/catalog/selector_paths_test.go
        test: TestValidateSelectorPathsRejectsAFieldTheTypeLacks
      - assertion: pending
        note: >-
          No test in this repository anchors this statement; the engine in
          this repository implements the 1.0 language.

  - id: R-MACH-010
    target: processor
    level: MUST
    statement: >-
      A transition whose action is `$tool` runs the tool the model chose in
      the state it leaves. The tools valid there are the external tools
      that transition can dispatch whose every declared signal its target
      state routes, or whose target is final; the manifest the model sees
      lists exactly those. A conforming processor MUST refuse, before the
      tool runs, a chosen tool outside that set with `ParseFailed`, naming
      an out-of-state tool apart from an unknown one, and MUST land
      arguments that do not conform to the chosen tool's input type on
      `ArgumentsRejected` at the target state, which the machine MUST route
      (R-MACH-006).
    acceptance:
      - assertion: rig
        path: agent-core/internal/tools/catalog/emits_test.go
        test: TestDeriveDynamicToolPhasesScopesExternalToolsByRoutableSignals
      - assertion: rig
        path: agent-core/internal/tools/catalog/emits_test.go
        test: TestApplyDynamicToolPhasesFiltersRegistryManifest
      - assertion: rig
        path: agent-core/internal/tools/llm/parse_response_test.go
        test: TestParseResponseRejectsOutOfStateTool
      - assertion: rig
        path: agent-core/internal/tools/llm/parse_response_test.go
        test: TestParseResponseUnknownToolStillReportsUnknown
      - assertion: pending
        note: >-
          No test in this repository anchors this statement; the engine in
          this repository implements the 1.0 language.

  - id: R-MACH-011
    target: specification
    level: MUST
    statement: >-
      Each entry under `transitions` MUST carry `state`, `signal`, and
      `next`, each naming a state or signal the machine declares, and a
      machine MUST NOT declare two transitions that leave one state on one
      signal. `action` MAY name a tool, MAY be `$tool` (R-MACH-010), or MAY
      be absent, in which case the machine moves to `next` running nothing.
      `label`, when present, MUST be a non-empty address with no dot,
      parenthesis, or whitespace (R-MACH-009); `summary` and
      `report_output` read an action's output, so a transition carrying
      either MUST carry an `action`.
    acceptance:
      - assertion: fixture
        path: fixtures/specification/machine-transitions/valid.yaml
        check: machine_transitions
        verdict: valid
      - assertion: fixture
        path: fixtures/specification/machine-transitions/undeclared-next.yaml
        check: machine_transitions
        verdict: invalid
      - assertion: fixture
        path: fixtures/specification/machine-transitions/duplicate-pair.yaml
        check: machine_transitions
        verdict: invalid
      - assertion: fixture
        path: fixtures/specification/machine-transitions/bad-label.yaml
        check: machine_transitions
        verdict: invalid
      - assertion: fixture
        path: fixtures/specification/machine-transitions/summary-without-action.yaml
        check: machine_transitions
        verdict: invalid

  - id: R-MACH-012
    target: specification
    level: MUST
    statement: >-
      `states` and `signals` MAY mix the short form, a name, and the long
      form, a mapping with `name` and its prose (`meaning` or `trigger`);
      names MUST be non-empty and unique. `initial_state` and every entry
      of `terminal_states` MUST name a declared state, each terminal state
      once. A state MUST carry `run_status` exactly when it is terminal:
      `terminal_states` and the per-state `run_status` state the same fact
      twice, and the redundancy is deliberate, so a checker can catch the
      two disagreeing.
    acceptance:
      - assertion: fixture
        path: fixtures/specification/machine-states/valid.yaml
        check: machine_states
        verdict: valid
      - assertion: fixture
        path: fixtures/specification/machine-states/run-status-not-terminal.yaml
        check: machine_states
        verdict: invalid
      - assertion: fixture
        path: fixtures/specification/machine-states/terminal-not-a-state.yaml
        check: machine_states
        verdict: invalid
      - assertion: fixture
        path: fixtures/specification/machine-states/duplicate-state.yaml
        check: machine_states
        verdict: invalid
      - assertion: fixture
        path: fixtures/specification/machine-states/initial-not-a-state.yaml
        check: machine_states
        verdict: invalid
      - assertion: rig
        path: agent-core/internal/runtime/core/machine_policy_test.go
        test: TestValidateMachinePolicyRequiresResumeSignalAndIterationBudget

  - id: R-MACH-013
    target: processor
    level: MUST
    statement: >-
      A machine's `budget` MAY carry `max_iterations`, `command_timeout`,
      `max_tokens`, `max_duration`, and `max_consecutive_parse_errors`, and
      nothing else. A conforming processor MUST refuse to run a machine
      whose budget lacks a positive `max_iterations` or a `command_timeout`;
      it MUST raise `BudgetExhausted` when the iterations, the tokens, or
      the consecutive parse failures are spent (R-MACH-005), bound every
      dispatch by `command_timeout`, and cancel the run when `max_duration`
      elapses. Once the budget is spent the loop raises `BudgetExhausted`
      at every following step, whatever a word answers, so after
      exhaustion a run walks only the machine's `BudgetExhausted`
      transitions: a chain through working states that reaches a terminal
      state, or a state without such a transition, ends the run, but a
      cycle does not. A conforming processor MUST refuse a machine whose
      `BudgetExhausted` transitions cycle through working states, naming
      the cycle.
    acceptance:
      - assertion: fixture
        path: fixtures/specification/machine-budget/valid.yaml
        check: machine_budget
        verdict: valid
      - assertion: fixture
        path: fixtures/specification/machine-budget/unknown-limit.yaml
        check: machine_budget
        verdict: invalid
      - assertion: fixture
        path: fixtures/specification/machine-budget/exhaustion-chain.yaml
        check: machine_budget
        verdict: valid
      - assertion: fixture
        path: fixtures/specification/machine-budget/exhaustion-cycle.yaml
        check: machine_budget
        verdict: invalid
      - assertion: pending
        note: >-
          No test in this repository anchors this statement; the engine in
          this repository implements the 1.0 language.
      - assertion: rig
        path: agent-core/internal/runtime/core/machine_policy_test.go
        test: TestValidateMachinePolicyRequiresResumeSignalAndIterationBudget
      - assertion: rig
        path: agent-core/internal/runtime/core/loop_runtime_test.go
