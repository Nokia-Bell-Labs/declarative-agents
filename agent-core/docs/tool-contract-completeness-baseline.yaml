# Tool-contract completeness baseline (GH-1525).
#
# Declared words whose six-section contract is incomplete, measured by the
# same rule mage audit gates on. This list is a ratchet: it may shrink and
# must never grow. Completing a contract means deleting its entry.
#
# A word absent from this list must have a complete contract. Declaring a
# new incomplete word fails mage audit rather than extending this file.
#
# Regenerate after completing contracts; do not hand-edit to silence a gate.

incomplete:
  - tool: commit
    source: tools/exec/commit.yaml
    missing: [emits, errors, goals, non_goals, output.schema, problem, relationships, requirements.errors, requirements.input, requirements.output]
