id: rel11.0-uc001-scenario-critic-scenario-run
title: The Scenario Critic Runs an Agent's Scenarios to a Verdict Without Live Services
historical_aliases: [rel11.0-uc001-assembler-scenario-run]

summary: |
  A profile author adds a tests/<scenario>/ directory beside an agent and runs
  the scenario critic. The scenario critic discovers the scenario, starts the mocks its
  fixtures declare, starts the subject with its REST dependency pointed at a
  mock, awaits health, dispatches each validator machine visibly, and reduces
  the ordered join to a verdict. The subject gets a fresh instance per
  scenario, every child is torn down, and no live Chroma, Ollama, or
  Kubernetes is involved. A second scenario over the same subject scripts a
  dependency failure and asserts the subject's clean failure path.

actor: A profile author testing an agent's machine and REST tools.

trigger: |
  A profile author runs the scenario critic over discovery roots containing an agent
  that carries one or more scenario directories.

preconditions:
  - The scenario critic and mock profiles are shipped in applications/catalog.
  - agent-core provides the service-child, validator-execution, and discovery words (srd040) and the mock endpoint binding (srd039).
  - The subject agent's REST dependency base_url is environment-expandable.

flow:
  - id: F1
    text: The scenario critic enumerates scenarios under its configured roots and takes the first, which names the subject, its validators, and its fixture files.
  - id: F2
    text: A labeled command-state fixture array drives sequential MachineSpec for_each dispatch; each item starts one mock on its own address, records its own receipt-bearing Entry, and joins in input order.
  - id: F3
    text: The scenario critic starts the subject with environment additions pointing its dependency base_url at the mock addresses, and awaits its health.
  - id: F4
    text: A labeled validator array drives sequential MachineSpec for_each dispatch; each child execution drives the subject over HTTP and records its own receipt-bearing Entry before an ordered join.
  - id: F5
    text: A thin word records joined validator outcomes and derives the verdict; the scenario critic then lists the subject before its mocks and iterates stop_service once per child before joining teardown.
  - id: F6
    text: The scenario critic repeats for the subject's remaining scenarios with a fresh subject each time, then reports the aggregate verdict as its terminal state.

touchpoints:
  - id: T1
    target: srd018-scenario-critic R1
    reason: The pipeline composes, verdicts, and tears down each scenario with a fresh subject and no model call.
  - id: T2
    target: srd018-scenario-critic R2
    reason: One subject carries several self-contained scenarios as profile-owned data.
  - id: T3
    target: srd018-scenario-critic R3
    reason: Scenarios are discovered by convention under configurable roots.
  - id: T4
    target: srd018-scenario-critic R4
    reason: The subject reaches its mocks through declared environment additions over base_url expansion, with its behavior unchanged.
  - id: T5
    target: srd018-scenario-critic R6
    reason: The verdict is the conjunction of validator terminals, and a failure names its cause.
  - id: T6
    target: srd019-mock R2
    reason: Each mock serves the scenario's fixture selected at start, so several mocks run from one profile.
  - id: T7
    target: sm-agent-role-taxonomy
    reason: The scenario-critic joins the realization inventory as a Critic-bound test harness, while mock remains a non-role test double.

success_criteria:
  - id: S1
    criterion: A scenario runs end to end with no live external service; fixture starts, validator executions, and child stops are ordered machine-visible item dispatches with separate checkpoint, receipt, and rollback boundaries.
    traces:
      - srd018-scenario-critic AC1
      - srd019-mock AC2
  - id: S2
    criterion: Adding a second scenario to the same subject requires only new files in a tests/ directory, with no change to the scenario critic profile.
    traces:
      - srd018-scenario-critic AC2
  - id: S3
    criterion: A scenario whose fixture scripts a dependency failure drives the subject's failure path, and the scenario passes because the validator's expectation was met.
    traces:
      - srd018-scenario-critic AC6
  - id: S4
    criterion: A scenario whose validator expectation is deliberately wrong makes the scenario critic reach Failed and name the failing validator.
    traces:
      - srd018-scenario-critic AC6
  - id: S5
    criterion: No child process survives the ordered subject-first stop iterator, and a second consecutive run passes without port or state leakage.
    traces:
      - srd018-scenario-critic AC1
  - id: S6
    criterion: The same scenario critic discovers and runs scenarios under the applications tree with no special-casing.
    traces:
      - srd018-scenario-critic AC3

failure_scenarios:
  - id: E1
    scenario: A scenario's mock fails to start and the scenario critic proceeds to run validators against a subject with a dead dependency.
    expected: Rejected; a failed start or health timeout routes to teardown and the scenario reports Failed with the cause.
  - id: E2
    scenario: Two scenarios share one subject instance and the second observes state the first left behind.
    expected: Rejected; each scenario gets a fresh subject (srd018 R1.3).
  - id: E3
    scenario: A scenario patches the subject's machine or tool selections to make a test pass.
    expected: Rejected; only addresses and other harness-controlled fields may differ (srd018 R4.3).

out_of_scope:
  - The agent-core words themselves and the mock fixture schema; those are srd040 and srd039.
  - Kubernetes, containers, or a hierarchical control plane; children are local processes at this release.
  - Span-based state assertion; responses and the mock request log are the witnesses.
  - Authoring scenarios for the existing mesh agents, which is application-owned work.
  - Bounded parallel validator iteration; sequential dispatch is intentional until MachineSpec supports a bounded parallel mode.

evidence_gaps:
  - Current rig evidence asserts ordered scenario and aggregate verdicts but not
    the failing validator's name or reason.
  - Child-stop item spans and two consecutive runs show dispatch and
    repeatability but do not inspect operating-system process survival.
  - No current test induces mock-start failure and then verifies failure-path
    teardown.

test_suite_trace: test-rel11.0-scenario-critic-rig
status: in-progress
