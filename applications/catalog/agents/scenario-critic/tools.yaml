# Tool selection for the scenario critic rig machine (machine.yaml).
#
# The three fail_scenario_* words share one init with collect_scenario_verdict:
# each declares the reason its failure edge records, so a scenario that fails
# before its validators run still names its cause.

tools:
  - discover_scenarios
  - next_scenario
  - start_scenario_mock
  - start_scenario_subject
  - probe_subject_health
  - wait_health_retry
  - run_scenario_validator
  - record_scenario_validators
  - collect_scenario_verdict
  - fail_scenario_start
  - fail_scenario_unhealthy
  - fail_scenario_validators
  - list_scenario_children
  - stop_scenario_child
  - stop_all_services
  - report_rig_session
