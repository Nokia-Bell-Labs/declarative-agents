unit: catalog-bench-rest
rest:
  version: v1
  auth:
    none: {type: none}
  limits:
    local_bench:
      timeout: 30s
      read_timeout: 10s
      max_request_bytes: 262144
      max_response_bytes: 8388608
      max_header_bytes: 16384
      redirect: {mode: none}
      network:
        schemes: [http]
        hosts: [127.0.0.1, localhost]
        ports: [8080]
    local_bench_control:
      timeout: 30s
      read_timeout: 5s
      max_request_bytes: 16384
      max_response_bytes: 65536
      redirect: {mode: none}
      network:
        schemes: [http]
        hosts: [127.0.0.1, localhost]
        ports: [8081]
  servers:
    bench:
      address: 127.0.0.1:8080
      limits_ref: local_bench
      shutdown: {timeout: 5s, drain_policy: drain_then_stop, stop_listeners: true}
      endpoints:
        health:
          method: GET
          path: /api/v1/health
          binding: health

        sessions:
          method: GET
          path: /api/v1/sessions
          binding: machine_request
          machine_request: &sessions_request
            profile: request-profile.yaml
            timeout: 30s
            response:
              terminal_states:
                Ready: {status: 200, content_type: application/json, body: {data: $.data}}
                Missing: {status: 404, content_type: application/json, body: {error: evaluation_missing}}
                Denied: {status: 400, content_type: application/json, body: {error: invalid_evaluation_path}}
                Failed: {status: 500, content_type: application/json, body: {error: command_error}}

        session:
          method: GET
          path: /api/v1/sessions/{suite}/{timestamp}
          binding: machine_request
          request:
            path: {suite: {type: string}, timestamp: {type: string}}
          machine_request:
            <<: *sessions_request
            initial_signal: SessionRequested
            request:
              path: {suite: $.suite, timestamp: $.timestamp}

        points:
          method: GET
          path: /api/v1/sessions/{suite}/{timestamp}/points
          binding: machine_request
          request:
            path: {suite: {type: string}, timestamp: {type: string}}
          machine_request:
            <<: *sessions_request
            initial_signal: PointsRequested
            request:
              path: {suite: $.suite, timestamp: $.timestamp}

        trace:
          method: GET
          path: /api/v1/sessions/{suite}/{timestamp}/points/{point_id}
          binding: machine_request
          request:
            path: {suite: {type: string}, timestamp: {type: string}, point_id: {type: string}}
          machine_request:
            <<: *sessions_request
            initial_signal: TraceRequested
            request:
              path: {suite: $.suite, timestamp: $.timestamp, point_id: $.point_id}

        experiment:
          method: GET
          path: /api/v1/sessions/{suite}/{timestamp}/points/{point_id}/experiment
          binding: machine_request
          request:
            path: {suite: {type: string}, timestamp: {type: string}, point_id: {type: string}}
          machine_request:
            <<: *sessions_request
            initial_signal: ExperimentRequested
            request:
              path: {suite: $.suite, timestamp: $.timestamp, point_id: $.point_id}

        configs:
          method: GET
          path: /api/v1/configs
          binding: machine_request
          machine_request:
            <<: *sessions_request
            initial_signal: ConfigsRequested

        config:
          method: GET
          path: /api/v1/configs/{path...}
          binding: machine_request
          request:
            path: {path: {type: string}}
          machine_request:
            <<: *sessions_request
            initial_signal: ConfigRequested
            request:
              path: {path: $.path}

        profiles:
          method: GET
          path: /api/v1/profiles
          binding: machine_request
          machine_request:
            <<: *sessions_request
            initial_signal: ProfilesRequested

        source:
          method: GET
          path: /api/v1/source/{path...}
          binding: machine_request
          request:
            path: {path: {type: string}}
          machine_request:
            <<: *sessions_request
            initial_signal: SourceRequested
            request:
              path: {path: $.path}

        experiments:
          method: POST
          path: /api/v1/experiments
          binding: machine_request
          request:
            body_schema:
              type: object
              required: [suite, output_dir]
              properties:
                suite: {type: string, minLength: 1}
                output_dir: {type: string, minLength: 1}
          machine_request:
            profile: experiments-profile.yaml
            timeout: 10s
            request:
              body: {suite: $.suite, output_dir: $.output_dir}
            response:
              terminal_states:
                Launched: {status: 202, content_type: application/json, body: {service: $.service, pid: $.pid, started_at: $.started_at}}
                Busy: {status: 429, content_type: application/json, body: {error: too_many_experiments, max_running: $.max_running}}
                Failed: {status: 500, content_type: application/json, body: {error: launch_failed}}

        experiment_runs:
          method: GET
          path: /api/v1/experiments/runs
          binding: machine_request
          machine_request:
            profile: experiments-profile.yaml
            timeout: 10s
            initial_signal: ListRequested
            response:
              terminal_states:
                Listed: {status: 200, content_type: application/json, body: {data: $.services}}

        ui:
          method: GET
          path: /{path...}
          binding: static_assets
          static_assets:
            root: agents/bench/ui/dist
            index: index.html
            spa: true
          request:
            path: {path: {type: string}}

    bench_control:
      address: 127.0.0.1:8081
      limits_ref: local_bench_control
      queue: {name: bench_control, capacity: 8, timeout: 30s}
      shutdown: {timeout: 5s, drain_policy: drain_then_stop}
      endpoints:
        control_health: {method: GET, path: /api/lifecycle/health, binding: health}
