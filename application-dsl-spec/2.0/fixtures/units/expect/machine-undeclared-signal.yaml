# The otherwise signal is not in the signals list.
kind: machine
schema_version: 1
name: planner
initial_state: Idle
budget: {command_timeout: 1m, max_iterations: 20}
terminal_states: [Done, Failed]
states:
  - {name: Idle, meaning: Waiting for a plan request.}
  - {name: Reviewing, meaning: Routing the plan or the report of what was wrong with it.}
  - {name: Done, meaning: A plan inside the expectation is ready., run_status: succeeded}
  - {name: Failed, meaning: Planning failed., run_status: failed}
signals:
  - {name: Seed, trigger: A caller asks for a plan.}
  - {name: PlanReady, trigger: A plan is listed.}
  - {name: PlanSuspect, trigger: The plan falls outside its expectation.}
  - {name: CommandError, trigger: A word failed.}
transitions:
  - state: Idle
    signal: Seed
    next: Reviewing
    action: plan_steps
    label: plan
    expect:
      where: {steps: {min_items: 1, max_items: 20}, target: {enum: [staging, dev]}}
      otherwise: {signal: Suspect, quarantine: true}
  - {state: Reviewing, signal: PlanReady, next: Done}
  - {state: Reviewing, signal: PlanSuspect, next: Reviewing, action: replan_steps, label: plan}
  - {state: Reviewing, signal: CommandError, next: Failed}
