name: rig-doctor
purpose: |-
  The rig-doctor diagnoses one failed kind scenario from a captured evidence
  directory. It gates on the evidence being there, then correlates events,
  rollout counts, logs, and captured traces through a model loop, and writes
  one diagnosis whose claims cite the files they came from.
configuration:
  machine: agents/rig-doctor/machine.yaml
  tools: agents/rig-doctor/tools.yaml
  llm_configs: agents/rig-doctor/llm/*.yaml
invariants:
- The evidence gate runs before any model call, so an empty directory costs no tokens
- The diagnosis is read back and decoded before the run succeeds, so an unreadable one is repaired rather than reported
- A failed model call is retried twice before the run gives up, so a busy provider does not discard the evidence already read
- Every tool result is fed back to the LLM before the next reasoning step
- Reads cannot leave the evidence directory and the only write is the diagnosis beside it
- No cluster, kubectl, helm, or network boundary other than the model provider participates
- Parse failures are reported to the LLM for self-correction
- Infrastructure errors (CommandError) are terminal -- no recovery
lifecycle: |-
  1. Idle -> ListingEvidence (Seed): list_files over the evidence directory
  2. ListingEvidence -> CheckingEvidence (ToolDone): evidence_present tests the
     listing; a listing that cannot be produced at all is NoEvidence
  3. CheckingEvidence -> Composing (Satisfied): invoke_llm with the diagnosis
     prompt; an empty listing reaches NoEvidence without calling the model
  4. Composing -> Parsing (LLMResponded): parse_response extracts a tool call
  5. Parsing -> Composing (ToolDone): the $tool sentinel dispatches the read,
     find, spool query, or write the model asked for
  6. Composing -> Composing (ToolDone, ToolFailed, TracesListed,
     TraceRetrieved): invoke_llm feeds the tool result back, whichever signal
     the dispatched word reports
  7. Parsing -> Composing (ParseFailed): report_parse_error to the LLM, or
     BudgetExhausted when max_consecutive_parse_errors is reached
  8. Parsing -> SeedingDiagnosisRead (TaskCompleted): the model called done,
     and the gate reads back what it claims to have written
  9. ReadingDiagnosis -> CheckingCause -> CheckingFindings -> Diagnosed: the
     diagnosis decoded as YAML, names a cause, and carries findings
  10. A missing, undecodable, or incomplete diagnosis -> Composing: the failure
     goes back to the model for repair rather than passing
  11. Composing -> RetryingModel -> RetryingModelLast (CommandError): a failed
     model call is retried twice, and each retry rejoins Parsing on a
     response; a third failure reaches Failed
  12. Composing -> Failed (BudgetExhausted): the loop ran out of budget
  13. CommandError while seeding or reading -> Failed
  14. BudgetExhausted in any non-terminal state -> Failed, so a run that stops
     mid-gate still reports a terminal
pipeline_diagram: |-
  ```mermaid
  flowchart TD
    A[Idle] -->|Seed| B[ListingEvidence]
    B -->|ToolDone| C[CheckingEvidence]
    B -->|ToolFailed| N[NoEvidence]
    C -->|Unsatisfied| N
    C -->|Satisfied| D[Composing]
    D -->|LLMResponded| E[Parsing]
    E -->|ToolDone| F[Dispatch Tool]
    F --> D
    E -->|ParseFailed| G[Report Error]
    G --> D
    E -->|TaskCompleted| R[ReadingDiagnosis]
    R -->|DocumentReady| C2[CheckingCause]
    C2 -->|CausePresent| C3[CheckingFindings]
    C3 -->|FindingsPresent| H[Diagnosed]
    R -->|missing or undecodable| D
    C2 -->|DiagnosisIncomplete| D
    C3 -->|DiagnosisIncomplete| D
    D -->|CommandError| T1[RetryingModel]
    T1 -->|CommandError| T2[RetryingModelLast]
    T1 -->|LLMResponded| E
    T2 -->|LLMResponded| E
    T2 -->|CommandError| I
    D -->|BudgetExhausted| I[Failed]
  ```
instantiate:
  - fragment: diagnosis-gate-fragment.yaml
    args:
      from: Parsing
      enter: TaskCompleted
      accepted: Diagnosed
      repair: Composing
      repair_action: invoke_llm
      failed: Failed
initial_state: Idle
budget:
  command_timeout: 10m
  max_iterations: 40
  max_consecutive_parse_errors: 5
states:
- name: Idle
  meaning: Initial state before the evidence directory is inspected.
- name: ListingEvidence
  meaning: |
    The evidence directory is being listed. The listing is the gate: a
    diagnosis of nothing is worse than saying there is nothing to diagnose.
- name: CheckingEvidence
  meaning: |
    The listing is being tested for content. An empty evidence directory
    stops here rather than paying for a model call.
- name: RetryingModel
  meaning: |
    The first model call failed. The evidence already read is worth one more
    attempt, so the call is repeated rather than the run discarded.
- name: RetryingModelLast
  meaning: |
    The retry failed too. One final attempt runs; a third failure is a
    provider the run cannot reach, and it reaches Failed.
- name: Composing
  meaning: |
    The LLM is being invoked or a tool result is being fed back. This is the
    working state where the agent reads evidence and reasons about the cause.
- name: Parsing
  meaning: |
    The raw LLM response is being parsed to extract a tool call. If parsing
    fails, the error is reported back to the LLM.
- name: Diagnosed
  run_status: succeeded
  meaning: |
    Terminal. The model wrote a diagnosis that was read back, decoded, and
    found to name a cause and carry findings.
- name: NoEvidence
  run_status: failed
  meaning: |
    Terminal. The evidence directory is empty or could not be listed, so
    there is nothing to diagnose and no diagnosis is written.
- name: Failed
  run_status: failed
  meaning: Terminal. Budget exhaustion or an unrecoverable error occurred.
terminal_states:
- Diagnosed
- NoEvidence
- Failed
signals:
- name: Seed
  trigger: Loop initialization.
- name: ToolDone
  trigger: A tool executed successfully.
- name: ToolFailed
  trigger: A tool executed but reported failure (recoverable).
- name: Satisfied
  trigger: The evidence listing found files to read.
- name: Unsatisfied
  trigger: The evidence listing is empty.
- name: LLMResponded
  trigger: The LLM returned a response (invoke_llm completed).
- name: TracesListed
  trigger: A captured-spool trace listing completed.
- name: TraceRetrieved
  trigger: A captured-spool trace detail read completed.
- name: DiagnosisPathReady
  trigger: The read-back gate composed the diagnosis path.
- name: DocumentReady
  trigger: The written diagnosis was read back and decoded as YAML.
- name: DocumentMissing
  trigger: The model declared the work done without writing a diagnosis.
- name: DocumentParseFailed
  trigger: The written diagnosis is not decodable YAML.
- name: DocumentResourceDenied
  trigger: The written file is not the diagnosis the gate allows.
- name: CausePresent
  trigger: The diagnosis names a probable cause.
- name: FindingsPresent
  trigger: The diagnosis carries at least one finding.
- name: DiagnosisIncomplete
  trigger: The diagnosis decoded but lacks a required field.
- name: ParseFailed
  trigger: The LLM response could not be parsed as a valid tool call.
- name: TaskCompleted
  trigger: The LLM called the done tool, declaring the diagnosis written.
- name: CommandError
  trigger: Infrastructure-level error (not a tool failure).
- name: BudgetExhausted
  trigger: Iteration or parse-error budget limit reached.
transitions:
- state: Idle
  signal: Seed
  next: ListingEvidence
  action: list_files
  label: evidence
- state: ListingEvidence
  signal: ToolDone
  next: CheckingEvidence
  action: evidence_present
- state: ListingEvidence
  signal: ToolFailed
  next: NoEvidence
- state: ListingEvidence
  signal: CommandError
  next: Failed
- state: CheckingEvidence
  signal: Satisfied
  next: Composing
  action: invoke_llm
- state: CheckingEvidence
  signal: Unsatisfied
  next: NoEvidence
- state: CheckingEvidence
  signal: CommandError
  next: Failed
- state: Composing
  signal: LLMResponded
  next: Parsing
  action: parse_response
- state: Parsing
  signal: ToolDone
  next: Composing
  action: $tool
- state: Parsing
  signal: ParseFailed
  next: Composing
  action: report_parse_error
- state: Composing
  signal: ToolDone
  next: Composing
  action: invoke_llm
- state: Composing
  signal: ToolFailed
  next: Composing
  action: invoke_llm
- state: Composing
  signal: TracesListed
  next: Composing
  action: invoke_llm
- state: Composing
  signal: TraceRetrieved
  next: Composing
  action: invoke_llm
- state: Composing
  signal: BudgetExhausted
  next: Failed
# The budget can run out anywhere in the read-back chain, and a run that stops
# mid-gate reaches no terminal at all unless each of its states routes the
# signal the engine raises (srd023 R4.3, GH-2294).
- state: Parsing
  signal: BudgetExhausted
  next: Failed
# A model call that fails is retried twice before the run gives up. The
# runtime reports every provider failure as CommandError (srd009 R4.3), so a
# hung endpoint and a misconfigured one arrive as one signal; the machine
# cannot tell them apart and spends three bounded attempts rather than
# discarding an evidence read that already cost tokens (GH-2297).
- state: Composing
  signal: CommandError
  next: RetryingModel
  action: invoke_llm
- state: RetryingModel
  signal: LLMResponded
  next: Parsing
  action: parse_response
- state: RetryingModel
  signal: CommandError
  next: RetryingModelLast
  action: invoke_llm
- state: RetryingModel
  signal: BudgetExhausted
  next: Failed
- state: RetryingModelLast
  signal: LLMResponded
  next: Parsing
  action: parse_response
- state: RetryingModelLast
  signal: CommandError
  next: Failed
- state: RetryingModelLast
  signal: BudgetExhausted
  next: Failed
- state: Parsing
  signal: CommandError
  next: Failed
