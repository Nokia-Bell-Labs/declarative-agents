id: srd001-serving-contract
title: Persistent Coding-Agent Serving Contract
status: implemented

problem: |
  The canonical planner, executor, and critic are finite batch machines. A
  Kubernetes Deployment needs a persistent process with truthful lifecycle
  health, while the application needs network boundaries between roles without
  copying reusable library behavior or allowing requests to choose profiles,
  workspace roots, endpoints, or credentials.

requirements:
  R1:
    title: Persistent role hosts
    items:
      - R1.1: The application shall own one persistent serving profile for planner, executor, and critic.
      - R1.2: Each host shall launch a declared role request server and lifecycle server, remain in a non-terminal awaiting-control state, and stop through the declared lifecycle exit path.
      - R1.3: Each lifecycle server shall expose GET /api/lifecycle/health through the agent-core health binding; no sidecar, sleep process, or unmodeled idle loop shall report health.

  R2:
    title: Canonical role composition
    items:
      - R2.1: The executor endpoint shall run the canonical executor profile as a profile-backed machine_request.
      - R2.2: The critic endpoint shall run the canonical changed-workspace critic profile as a profile-backed machine_request.
      - R2.3: The planner request machine shall reuse canonical planner LLM configuration, planner builtin tools, and plan parsing while owning only application sequencing.
      - R2.4: Existing canonical batch profiles and local coding-loop integrations shall remain unchanged.

  R3:
    title: Remote application sequence
    items:
      - R3.1: A planner coding request shall invoke the executor through a declared REST client and invoke the critic through a second declared REST client only after executor success.
      - R3.2: Executor failure, critic rejection, and infrastructure failure shall map to distinct declared terminal outcomes and HTTP responses.
      - R3.3: Runtime input shall provide a task and opaque workspace identity but shall not choose a filesystem root, profile, machine, URL, host, or credential.

  R4:
    title: Shared workspace and trace
    items:
      - R4.1: All three processes shall bind the same operator-supplied runtime directory, suitable for one Kubernetes shared workspace volume.
      - R4.2: The workspace identity shall be carried as correlation metadata while the trusted process directory remains the filesystem authority.
      - R4.3: The planner inbound machine_request and both outbound REST operations shall use agent-core W3C trace propagation so all role spans share one trace identifier.

acceptance_criteria:
  - id: AC1
    criterion: All three profiles boot with the real agent binary and return HTTP 200 from their declared lifecycle health endpoints.
    traces: [R1.1, R1.2, R1.3]
  - id: AC2
    criterion: A localhost planner request changes the shared workspace through the remote canonical executor and receives an accepting verdict from the remote canonical critic.
    traces: [R2.1, R2.2, R2.3, R3.1, R3.2, R3.3, R4.1, R4.2]
  - id: AC3
    criterion: Planner, executor, and critic trace output for the remote request contains the caller's W3C trace identifier.
    traces: [R4.3]
  - id: AC4
    criterion: The existing local batch coding-loop tests and integrations remain valid.
    traces: [R2.4]

goals:
  - id: G1
    text: Persistent role hosts.
  - id: G2
    text: Canonical role composition.
  - id: G3
    text: Remote application sequence.
  - id: G4
    text: Shared workspace and trace.
non_goals:
  - Helm resources, profile ConfigMap sizing, and closure sharding.
  - Per-request filesystem roots or dynamically supplied transport authority.
  - Replacing the local canonical batch integrations.
