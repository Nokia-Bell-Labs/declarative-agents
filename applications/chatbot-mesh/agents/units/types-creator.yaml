# Shapes the creator publishes while it provisions and ingests a corpus.
# Comparison restates the shape agent-core declares under the same name; the
# unit segment of an address is a namespace, so a shape is named for what it
# is (srd051 R1.4, R4.3).
unit: mesh-types-creator
types:
- name: Comparison
  description: The resolved comparison a value_predicate word publishes; right is absent for unary operations.
  schema:
    type: object
    properties:
      left:
        type: string
      op:
        type: string
      right:
        type: string
      operand_type:
        type: string
      held:
        type: boolean
    required:
    - left
    - op
    - operand_type
    - held
- name: IngestOutcome
  description: The judged document count and the collection the run ingested into.
  schema:
    type: object
    properties:
      count:
        type: string
      collection:
        type: string
    required:
    - count
    - collection
