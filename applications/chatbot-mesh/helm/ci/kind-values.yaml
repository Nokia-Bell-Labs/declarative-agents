# Small-footprint values for the kind smoke test (the smoke test itself lands in
# its own issue). One RAG unit, minimal resources, no ingress, tiny storage.
image:
  pullPolicy: IfNotPresent

chatbot:
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {cpu: 500m, memory: 512Mi}

ragUnits:
  - name: rag0
    description: Kind smoke-test corpus.
    collection: corpus
    embeddingModel: qwen3-embedding:8b
    replicas: 1

ragServer:
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {cpu: 500m, memory: 512Mi}

chroma:
  storage: 256Mi
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {cpu: 500m, memory: 512Mi}

dolt:
  storage: 256Mi

# The chart-local Collector remains the pod-facing gateway while forwarding
# integration traces and metrics to the persistent host ingress. The Mage
# launcher overrides commit and runID for each scenario.
collector:
  externalOTLPEndpoint: host.docker.internal:4317
  integrationResource:
    repository: Nokia-Bell-Labs/declarative-agents
    module: applications/chatbot-mesh
    target: integration:helm
    commit: unknown
    runID: local-kind

ingress:
  enabled: false

# The applier needs the chart ConfigMap and the kind-loaded CLI donor (GH-2222),
# which only the live tier provisions. Disable it here so the smoke and swap tests
# do not wait on them; the deployment-API flow is exercised by
# Integration.ControlPlane with a fake deployment API.
applier:
  enabled: false

# The smoke/swap tests use an external Ollama on the host; the in-cluster LLM tier
# is exercised by its own values (ci/kind-llm-values.yaml) so these tests do not
# wait on a model preload.
ollama:
  enabled: false

llm:
  externalURL: http://host.docker.internal:11434
