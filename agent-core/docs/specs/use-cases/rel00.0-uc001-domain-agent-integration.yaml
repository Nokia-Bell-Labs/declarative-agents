success_criteria:
  - id: S1
    criterion: Domain agent can create a Registry, register ToolSpec-Builder pairs, and freeze it.
    traces:
      - srd004-tool-registry AC2
      - srd004-tool-registry AC5
  - id: S2
    criterion: Domain agent can build a TransitionTable from a YAML MachineSpec or programmatically.
    traces:
      - srd002-state-machine AC1
      - srd006-yaml-machine-config AC3
  - id: S3
    criterion: Domain agent can call Loop with LoopParams and receive a RunResult.
    traces:
      - srd005-agentic-loop AC4
      - srd005-agentic-loop AC5
  - id: S4
    criterion: Budget enforcement stops the loop when limits are exceeded.
    traces:
      - srd005-agentic-loop AC1
      - srd005-agentic-loop AC5
  - id: S5
    criterion: LoopHooks inject domain-specific behavior (validation, budget, status, result processing).
    traces:
      - srd005-agentic-loop AC3
  - id: S6
    criterion: Dispatch wraps command execution with tracing, timeout, and panic recovery.
    traces:
      - srd003-command-dispatch AC1
      - srd003-command-dispatch AC2
  - id: S7
    criterion: MachineSpec YAML is validated for referential integrity before building the table.
    traces:
      - srd006-yaml-machine-config AC2
      - srd006-yaml-machine-config AC4
  - id: S8
    criterion: Tracer interface is satisfied by TraceAdapter from internal/observability/telemetry.
    traces:
      - srd007-tracer-interface AC1
      - srd008-telemetry AC8
  - id: S9
    criterion: NewRoot creates providers from ExporterConfig and returns a Trace and shutdown function.
    traces:
      - srd008-telemetry AC1
      - srd008-telemetry AC4
      - srd008-telemetry AC5
  - id: S10
    criterion: Trace supports Push, Event, SetAttributes, Context, and Meter methods.
    traces:
      - srd008-telemetry AC2
      - srd008-telemetry AC3
  - id: S11
    criterion: File exporter writes atomically via temp file rename. OTLP exporter sends via gRPC.
    traces:
      - srd008-telemetry AC6
      - srd008-telemetry AC7
  - id: S12
    criterion: A replay MachineSpec loads a trusted OTLP protobuf-JSON batch and sends it unchanged through relay_spans.
    traces:
      - srd008-telemetry AC9
  - id: S13
    criterion: An integration launcher can dual-export attributable file and OTLP evidence, propagate the endpoint and child service identity, and query retained trace and metric backends after the run.
    traces:
      - srd008-telemetry AC10
      - srd018-cli-flag-contract AC2
      - srd018-cli-flag-contract AC7

out_of_scope:
  - Domain-specific tool implementations.
  - TLS or authenticated OTLP connections.
  - CLI integration (domain agent responsibility).

test_suite: test-rel00.0
