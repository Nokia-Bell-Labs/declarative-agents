name: corpus-reader
purpose: |-
  The Chroma reader profile answers a question grounded in chunks retrieved from
  a local Chroma collection. It checks the Chroma server, composes the
  question, embeds it at the bound provider (the embed-query stage,
  srd058 R4.1), create-or-gets the collection (which resolves the
  returned collection id and carries the query vector forward), queries the
  collection with the agent-supplied query vector, and invokes the configured
  model over the retrieved chunks to produce a grounded answer.

  The query vector is machine-sequenced because a model cannot author a raw
  embedding vector; the vector rides between boundary words through the
  agent-core previous-Result parameter threading (srd028 R12). Because threading
  is single-hop, create-or-get sits immediately before chroma_query: it returns
  the collection id and carries the query vector forward so chroma_query can
  thread both.
invariants:
  - REST authority lives in agents/knowledge-manager/corpus-rest.yaml.
  - MachineSpec owns sequencing between the embed, Chroma, and invoke_llm words.
  - No embedding vector is authored by a model; the query vector threads between words.
  - The Chroma server is an external precondition, surfaced through chroma_ready, not started by the agent.
  - The embedding provider is the library the profile binds to the providers root; its failures arrive as ProviderUnauthorized, ProviderThrottled, or ProviderUnavailable (srd058 R1.4).
initial_state: Idle
budget:
  command_timeout: 3m
  max_iterations: 16
states:
  - name: Idle
    meaning: Initial state before the reader flow starts.
  - name: CheckingChroma
    meaning: The Chroma v2 heartbeat is being checked.
  - name: ComposingQuestion
    meaning: The question the reader answers is being composed for the embed stage.
  - name: ResolvingCollection
    meaning: The collection is being create-or-got and the query vector is carried forward.
  - name: Querying
    meaning: The collection is being queried with the agent-supplied query vector.
  - name: Answering
    meaning: The configured model is answering over the retrieved chunks.
  - name: Succeeded
    run_status: succeeded
    meaning: Terminal. A grounded answer was produced from retrieved chunks.
  - name: Failed
    run_status: failed
    meaning: Terminal. A REST, embedding, or model boundary word failed.
terminal_states:
  - Succeeded
  - Failed
signals:
  - name: Seed
    trigger: Loop initialization.
  - name: ChromaReady
    trigger: The Chroma heartbeat returned a configured success status.
  - name: QuestionReady
    trigger: The question was composed.
  - name: QueryEmbedded
    trigger: The bound embedding provider returned a vector for the question.
  - name: QueryEmbeddingNormalized
    trigger: The provider result contains one validated flat query vector.
  - name: ProviderUnauthorized
    trigger: The embedding provider rejected the credential.
  - name: ProviderThrottled
    trigger: The embedding provider rate-limited the call.
  - name: ProviderUnavailable
    trigger: The embedding provider failed.
  - name: CollectionReady
    trigger: The collection was create-or-got and its id resolved.
  - name: QueryResponded
    trigger: Chroma returned the retrieved chunks for the query vector.
  - name: LLMResponded
    trigger: The configured model produced a grounded answer.
  - name: CommandError
    trigger: Runtime or REST boundary infrastructure failed.
transitions:
  - state: Idle
    signal: Seed
    next: CheckingChroma
    action: chroma_ready
  - state: CheckingChroma
    signal: ChromaReady
    next: ComposingQuestion
    action: compose_question
  - state: CheckingChroma
    signal: CommandError
    next: Failed
  - state: ComposingQuestion
    signal: CommandError
    next: Failed
  - state: ResolvingCollection
    signal: CollectionReady
    next: Querying
    action: chroma_query
  - state: ResolvingCollection
    signal: CommandError
    next: Failed
  - state: Querying
    signal: QueryResponded
    next: Answering
    action: invoke_llm
  - state: Querying
    signal: CommandError
    next: Failed
  - state: Answering
    signal: LLMResponded
    next: Succeeded
  - state: Answering
    signal: CommandError
    next: Failed
# The embedding opening: the composed question is embedded at the bound
# provider and normalized to one flat vector before the collection step
# (srd058 R4.1).
expand:
  - fragment: /opt/agent-core/tools/machines/embed-query-stage-fragment.yaml
    args: {from: ComposingQuestion, enter: QuestionReady, next: ResolvingCollection, next_action: resolve_collection}
