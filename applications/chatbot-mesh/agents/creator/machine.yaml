# An instance of agent-core's serve-machine template (srd054): the persistent
# service lifecycle with this agent's server words wired in. What a request
# does lives in request-machine.yaml.
unit: creator-machine
name: creator
purpose: |-
  The creator profile hosts the mesh control plane's agent lifecycle management (LCM)
  agent as a persistent service. It launches a machine_request instance server, a
  control server, and a monitor server, then idles in AwaitingControl until a
  lifecycle exit event is enqueued, at which point it exits the agent and stops the
  servers. Each inbound instance operation runs a request-scoped machine
  (request-machine.yaml): the creator realizes a decided operation (create, restart,
  terminate, ingest) by driving the deployment API, then verifies the instance's
  health before reporting back to the provisioning-workflow-orchestrator. The creator acts on the
  provisioning-workflow-orchestrator's decisions; it alone holds the deployment-API credentials (srd005), it
  authors no values decision, and it passes no endpoint or credential into a running
  agent.

  - The creator alone holds the deployment-API authority; it is the only agent that declares a deployment-API client, and the bearer credential is deployment-realized (a mounted Secret), never a runtime-supplied one.
  - The creator forwards the provisioning-workflow-orchestrator's decided values-plane document to the deployment API as the apply content; it authors no values decision (that is the provisioning-workflow-orchestrator's).
instantiate:
  - fragment: /opt/agent-core/tools/machines/serve-machine-template.yaml
    args:
      workflow: creator
      launch_requests: launch_creator_requests
      launch_control: launch_creator_control
      await_control: await_creator_control
      stop_requests: stop_creator_requests
