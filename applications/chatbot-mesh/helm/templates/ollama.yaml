{{- if .Values.ollama.enabled }}
{{- $fullname := include "chatbot-mesh.fullname" . -}}
{{/*
The in-cluster LLM tier (srd015 R6): a chart-owned Ollama StatefulSet with a PVC
for model storage, its Service, a readiness-probe script, and a model-preload Job.
A StatefulSet with a volumeClaimTemplate is used (not Deployment+PVC) in normal
deployments because the single-instance topology owns one durable model volume.
The aggregate integration cache instead supplies fresh owned node storage for
each scenario. GPU scheduling is values.
*/}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $fullname }}-ollama
  labels:
    {{- include "chatbot-mesh.labels" . | nindent 4 }}
    app.kubernetes.io/component: ollama
spec:
  serviceName: {{ $fullname }}-ollama
  replicas: 1
  selector:
    matchLabels:
      {{- include "chatbot-mesh.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: ollama
  template:
    metadata:
      labels:
        {{- include "chatbot-mesh.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: ollama
    spec:
      {{- with .Values.ollama.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ollama.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: ollama
          image: "{{ .Values.ollama.image.repository }}:{{ .Values.ollama.image.tag }}"
          imagePullPolicy: {{ .Values.ollama.image.pullPolicy }}
          ports:
            - {name: http, containerPort: {{ .Values.llm.port }}}
          resources:
            {{- $res := deepCopy .Values.ollama.resources }}
            {{- if gt (int .Values.ollama.gpu.count) 0 }}
            {{- $_ := set (index $res "limits") "nvidia.com/gpu" (.Values.ollama.gpu.count | toString) }}
            {{- end }}
            {{- toYaml $res | nindent 12 }}
          readinessProbe:
            httpGet: {path: /api/tags, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - {name: models, mountPath: /root/.ollama}
      {{- if .Values.ollama.preload.integrationCacheHostPath }}
      volumes:
        - name: models
          hostPath:
            path: {{ printf "%s/active" .Values.ollama.preload.integrationCacheHostPath | quote }}
            type: Directory
      {{- else }}
  volumeClaimTemplates:
    - metadata:
        name: models
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.ollama.persistence.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.ollama.persistence.size }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-ollama
  labels:
    {{- include "chatbot-mesh.labels" . | nindent 4 }}
    app.kubernetes.io/component: ollama
spec:
  selector:
    {{- include "chatbot-mesh.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: ollama
  ports:
    - {name: http, port: {{ .Values.llm.port }}, targetPort: http}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $fullname }}-ollama-preload
  labels:
    {{- include "chatbot-mesh.labels" . | nindent 4 }}
    app.kubernetes.io/component: ollama
  annotations:
    # Re-render the Job on a model-list change so an added model is pulled; ollama
    # pull is idempotent, so a re-run over already-present models is a no-op (R6.2).
    checksum/models: {{ include "chatbot-mesh.ollamaModels" . | sha256sum }}
spec:
  suspend: {{ .Values.ollama.preload.suspend }}
  backoffLimit: 6
  template:
    metadata:
      labels:
        {{- include "chatbot-mesh.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: ollama-preload
    spec:
      restartPolicy: OnFailure
      containers:
        - name: preload
          image: "{{ .Values.ollama.image.repository }}:{{ .Values.ollama.image.tag }}"
          imagePullPolicy: {{ .Values.ollama.image.pullPolicy }}
          env:
            - {name: OLLAMA_HOST, value: "http://{{ $fullname }}-ollama:{{ .Values.llm.port }}"}
          {{- if .Values.ollama.preload.integrationCacheHostPath }}
          volumeMounts:
            - {name: active-models, mountPath: /models}
            - {name: integration-model-cache, mountPath: /cache}
          {{- end }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              {{- if .Values.ollama.preload.integrationCacheHostPath }}
              if [ -f /cache/seeded ] || [ -f /cache/ready ]; then
                echo "restoring identity-matched integration model cache"
                cp -a /cache/models/. /models/
              fi
              {{- end }}
              # The ollama image ships neither wget nor curl, so reachability is
              # probed with the ollama CLI itself (it honors OLLAMA_HOST), not an
              # HTTP client that is absent from the image.
              until ollama list >/dev/null 2>&1; do
                echo "waiting for ollama at $OLLAMA_HOST..."; sleep 3
              done
              for m in {{ include "chatbot-mesh.ollamaModels" . }}; do
                echo "pulling $m"; ollama pull "$m"
              done
              {{- if .Values.ollama.preload.integrationCacheHostPath }}
              rm -rf /cache/models
              mkdir -p /cache/models
              cp -a /models/. /cache/models/
              touch /cache/ready
              sync
              {{- end }}
              echo "preload complete"
      {{- if .Values.ollama.preload.integrationCacheHostPath }}
      volumes:
        - name: active-models
          hostPath:
            path: {{ printf "%s/active" .Values.ollama.preload.integrationCacheHostPath | quote }}
            type: Directory
        - name: integration-model-cache
          hostPath:
            path: {{ .Values.ollama.preload.integrationCacheHostPath | quote }}
            type: Directory
      {{- end }}
{{- end }}
