# Shapes the creator publishes while it provisions and ingests a corpus.
# Comparison is imported from agent-core's library (srd051 R1.5, srd056).
unit: mesh-types-creator
types:
- name: IngestOutcome
  description: The judged document count and the collection the run ingested into.
  schema:
    type: object
    properties:
      count:
        type: string
      collection:
        type: string
    required:
    - count
    - collection
