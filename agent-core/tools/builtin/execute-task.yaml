tools:
- name: mark_nodes_executing
  type: builtin
  init: mark_nodes_executing
  description: Advance the selected task nodes to Executing.
  visibility: internal
  emits:
  - NodesMarkedExecuting
  - CommandError
  category: stateful_internal
  side_effects:
  - kind: state_mutation
    target: requirement_graph
    state: selected_nodes_executing
    description: Advances only current-task graph nodes to Executing.
  reversibility:
    classification: reversible
  undo:
    strategy: pipeline_state_restore
    description: Restore the receipt-recorded graph lifecycle.
    payload: pipeline_state_snapshot
    captures: [current_task, graph_status]
  problem: Child invocation must not hide graph lifecycle mutation.
  goals: [Advance selected nodes in one machine-selected graph word.]
  requirements: {input: [A current task and graph are required.], output: [NodesMarkedExecuting is emitted after mutation.], errors: [Invalid graph transitions emit CommandError.]}
  non_goals: [Does not format files or invoke a child agent.]
  errors: [{signal: CommandError, condition: Task or graph state is invalid, state_after_failure: Receipt-backed state remains recoverable.}]
  relationships: {before: [mark_nodes_planning, record_tracker_issue], after: [format_task_file]}
  output: {description: Graph lifecycle summary, schema: {type: object}}

- name: format_task_file
  type: builtin
  init: format_task_file
  description: Project the current plan into one profile-configured write request.
  visibility: internal
  emits: [TaskFileFormatted, CommandError]
  category: word
  side_effects: [{kind: none, description: Serializes plan state without writing a file.}]
  reversibility: {classification: reversible}
  undo: {strategy: noop, description: Projection changes no state.}
  problem: The generic write word needs declared path and YAML content without hidden filesystem work.
  goals: [Produce path and content parameters consumed by write.]
  requirements: {input: [A current implementation plan and configured path are required.], output: [TaskFileFormatted carries write parameters.], errors: [Serialization failures emit CommandError.]}
  non_goals: [Does not write the task file or invoke a child agent.]
  errors: [{signal: CommandError, condition: Current plan is absent or cannot serialize, state_after_failure: No state or file changes.}]
  relationships: {before: [mark_nodes_executing], after: [write]}
  output: {description: Write parameters for the configured task path, schema: {type: object}}
  config: {path: doc/task.yaml}
