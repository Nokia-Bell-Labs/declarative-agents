name: rig-subject
# An instance of catalog's rest-service machine template (srd054).
unit: rig-subject-machine
purpose: |-
  A reference agent under test: it serves a route whose request-scoped machine
  reads one REST dependency, so a dependency failure surfaces as a mapped
  response rather than preventing the agent from starting. The rig points that
  dependency at a scenario's mock.
instantiate:
  - fragment: ../../../agents/units/rest-service-machine-template.yaml
    args:
      launch: launch_subject_rest
      await: await_subject_control
      stop: stop_subject_rest
      route_group: rig-subject
      profile: rig-subject
      machine: machine.yaml
      tools: tools.yaml
