# Documentation Design Constitution

id: design
title: Documentation Design Constitution
purpose: 'We use this constitution when creating or changing VISION, ARCHITECTURE,

  SRDs, use cases, test suites, semantic models, config-format specs, and

  other project documentation. The goal is a spec corpus that humans can read

  and tools can validate.

  '
articles:
- id: D1
  title: Specification-driven development
  rule: 'Specifications lead implementation. New behavior starts with a SRD, use

    case, test suite, or explicit documentation issue before code changes.

    Code changes should point back to the requirement or design artifact they

    implement.

    '
- id: D2
  title: Markdown structured docs
  rule: 'Write structured project artifacts as Markdown corpus documents (eng10).

    This includes VISION, ARCHITECTURE, SPECIFICATIONS, road-map, SRDs, use

    cases, test suites, semantic models, config-format specs, engineering

    guidelines, migrations, audit registers, and constitutions. Each type''s

    declaration under document_types gives its layout; run mage fmt to put a

    document in canonical form and mage audit to check it. Every field a

    document holds, nested fields included, is declared in its type''s field

    slots in order, and mage audit checks both. This constitution

    and corpus charters stay YAML: the first declares the types, and a charter

    is a check plan the audit executes. Use plain Markdown for prose-heavy

    operator guides and historical design notes.

    '
- id: D3
  title: Traceability
  rule: 'Vision explains goals and boundaries. Architecture explains components

    and flows. SRDs define numbered requirements. Use cases exercise SRDs

    through touchpoints. Test suites validate use cases and SRD acceptance

    criteria. Code and config changes should keep that chain intact.

    '
- id: D4
  title: Profile-first runtime docs
  rule: 'Agent Core behavior is profile-driven. Documentation should describe

    profiles, machine.yaml, tools.yaml, tool declarations, and boundary-tool

    config as the agent program. Do not describe generator, evaluator,

    planner, jurist, bench, history, or rollback as separate Go binaries.

    '
- id: D5
  title: Tool language boundary
  rule: 'MachineSpec owns workflow sequencing. ToolDef owns one vocabulary word:

    input, output, emitted signals, side effects, errors, and undo or

    compensation. Documentation must call out boundary tools when they cross

    a model, human, child process, external API, nested machine, or workspace.

    '
- id: D6
  title: Identifiers are immutable
  rule: 'An SRD id (srdNNN), a requirement id (Rn, Rn.m), an acceptance

    criterion id (ACn), a use-case id, and a test-suite id are never

    renumbered or reused once a release tag contains them. An entry that no

    longer applies keeps its id with status: retired, the release that

    retired it (retired_in), and the ids that replace it (replaced_by,

    possibly empty). Merging or splitting SRDs retires the old ids with

    pointers. This is the rule application-dsl-spec/language.yaml already

    states for statements, applied to the corpus.

    '
documentation_standards:
  style: 'Write short, exact sentences. Use active voice. Remove filler. Prefer

    exact paths, symbols, and commands over broad claims.

    '
  voice: 'Use "we" for project behavior and obligations. Use present tense for

    current behavior. Use planned status only when implementation or tests are

    missing.

    '
  diction: 'Avoid hype, vague intensifiers, stock transitions, and claims that do not

    name a behavior, file, command, or contract.

    '
  formatting:
    prose: 'Use paragraph form for explanation. Use lists for fields, steps, and

      checklists. Keep table content short when tables are useful.

      '
    yaml: 'Use lowercase snake_case field names, as YAML keys and in Markdown

      markers. In YAML, use block literals for multi-sentence prose. Keep IDs

      stable once referenced.

      '
    diagrams: 'Use Mermaid for diagrams, in a fenced block of a Markdown document

      or a multiline YAML string. Do not add generated image files.

      '
  external_references: 'A requirement that exists because a parent repository''s requirement

    demands it says so with a derived_from entry on the SRD, the requirement

    item, or the acceptance criterion: repo, the release it was validated

    against, srd, item, and an optional reason. Resolution is offline against

    a mandated clone cache, a sibling checkout named after the repository

    (docs/external-checkouts.yaml overrides the location); the tracked

    target pin per parent lives in docs/external-pins.yaml. An entry without

    a release resolves against the cache HEAD during co-development and is

    refused at release. A stale entry -- the cited item changed between the

    validated release and the tracked pin -- is resolved by revalidating the

    local requirement and re-pinning the entry in the same change. mage

    upgrade (or mage upgrade:to for a named release) moves the pin and

    re-pins every entry whose cited item is byte-identical across the two

    releases; mage upgrade:status prints the

    entries still behind their pins, the pre-planning worklist.

    '
  success_criteria: 'A success criterion states a measurable outcome in domain terms and

    names no implementation technology. A criterion a person cannot check

    without reading the implementation is a design note, not a criterion.

    '
  clarification_marker: 'A corpus document records a decision nobody has made as an entry in

    its optional needs_clarification list. Each entry carries id, the

    requirement item, acceptance criterion, or success criterion the question

    blocks, and question, the decision to make. A document with a non-empty

    list is not ready. A person resolves an entry by making the decision,

    editing the blocked entry in place, and deleting the entry, never by

    answering in a comment or a separate note. Tracker issues live outside

    the corpus and keep the inline literal marker [NEEDS CLARIFICATION:

    question] instead (issue-format.md). mage clarify lists every open

    entry across participating modules; run it and resolve the entries

    before planning work on the document.

    '
document_types:
  vision:
    location: docs/VISION.md
    converts_from: docs/VISION.yaml
    required_fields:
    - id
    - title
    - executive_summary
    - problem
    - what_this_does
    - why_we_build_this
    - success_criteria
    - not
