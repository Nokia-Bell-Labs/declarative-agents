# An instance of agent-core's serve-machine template (srd054): the persistent
# service lifecycle with the curator's server words wired in. Documentation
# workflow behavior lives in request-machine.yaml, not here.
unit: documentation-curator-machine
name: documentation-curator
purpose: |-
  Serve the Knowledge Manager documentation application through generic,
  profile-configured REST servers. Request behavior is owned by the companion
  request machine; this host machine owns only listener lifecycle. All browser
  routes are declared in rest.yaml, documentation workflow policy is executed
  by request-machine.yaml, and every listener binds only to configured
  loopback addresses.
expand:
  - fragment: /opt/agent-core/tools/machines/serve-machine-template.yaml
    args:
      workflow: documentation_curator
      command_timeout: 1m
      launch_requests: launch_curator_http
      launch_control: launch_curator_control
      await_control: await_curator_control
      stop_requests: stop_curator_http
