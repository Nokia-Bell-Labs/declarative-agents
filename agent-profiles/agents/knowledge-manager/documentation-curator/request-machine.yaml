name: documentation-curator-request
purpose: |-
  Request-scoped machine for Knowledge Manager document resource and action
  requests. REST machine_request endpoints keep list, read, validate, suggest,
  approve, and reject behavior in profile-owned configuration.
initial_state: AwaitingRequest
budget:
  max_iterations: 4
states:
  - name: AwaitingRequest
    meaning: Initial state seeded by a trusted REST endpoint.
  - name: ListingDocuments
    meaning: The machine is listing configured documentation resources.
  - name: ReadingDocument
    meaning: The machine is reading one configured documentation resource.
  - name: ShapingDocumentIndex
    meaning: The machine is preparing document index output for HTTP response mapping.
  - name: ShapingDocumentDetail
    meaning: The machine is preparing document detail output for HTTP response mapping.
  - name: ValidatingDocuments
    meaning: The machine is executing configured documentation validation.
  - name: SuggestingChanges
    meaning: The machine is creating a configured documentation patch suggestion.
  - name: ApprovingPatch
    meaning: The machine is approving one configured pending patch.
  - name: RejectingPatch
    meaning: The machine is rejecting one configured pending patch.
  - name: DocumentIndexReady
    meaning: Terminal. Document index data is ready for HTTP response mapping.
  - name: DocumentDetailReady
    meaning: Terminal. Document detail data is ready for HTTP response mapping.
  - name: ActionCompleted
    meaning: Terminal. A documentation action completed and its result is ready for HTTP response mapping.
  - name: ActionRejected
    meaning: Terminal. A documentation action returned a domain failure.
  - name: ActionMissing
    meaning: Terminal. A documentation action addressed a patch that does not exist.
  - name: DocumentNotFound
    meaning: Terminal. The requested document path is absent.
  - name: RequestDenied
    meaning: Terminal. The request selected a path outside configured resource rules.
  - name: Failed
    meaning: Terminal. The resource command failed.
terminal_states:
  - DocumentIndexReady
  - DocumentDetailReady
  - ActionCompleted
  - ActionRejected
  - ActionMissing
  - DocumentNotFound
  - RequestDenied
  - Failed
signals:
  - name: Seed
    trigger: Machine request endpoint starts a list request.
  - name: ReadRequested
    trigger: Machine request endpoint starts a detail request.
  - name: ValidateRequested
    trigger: Machine request endpoint starts documentation validation.
  - name: SuggestRequested
    trigger: Machine request endpoint starts patch suggestion.
  - name: ApproveRequested
    trigger: Machine request endpoint starts patch approval.
  - name: RejectRequested
    trigger: Machine request endpoint starts patch rejection.
  - name: DocumentListReady
    trigger: doc_list_resource returned configured resource entries.
  - name: DocumentReady
    trigger: doc_read_resource returned configured resource content.
  - name: DocumentIndexReady
    trigger: doc_index_response shaped document entries for the browser.
  - name: DocumentDetailReady
    trigger: doc_detail_response shaped document content for the browser.
  - name: DocumentMissing
    trigger: doc_read_resource could not find the requested path.
  - name: DocumentResourceDenied
    trigger: A resource command rejected the requested path or extension.
  - name: DocumentParseFailed
    trigger: A resource command could not parse configured document content.
  - name: RESTResponded
    trigger: A configured action REST word returned a synchronous success response.
  - name: RESTAccepted
    trigger: A configured action REST word accepted asynchronous work.
  - name: RESTDomainFailed
    trigger: A configured action REST word returned a declared domain failure.
  - name: RESTMissing
    trigger: A configured action REST word could not find the requested patch.
  - name: CommandError
    trigger: Resource configuration or filesystem access failed.
transitions:
  - state: AwaitingRequest
    signal: Seed
    next: ListingDocuments
    action: doc_list_resource
  - state: AwaitingRequest
    signal: ReadRequested
    next: ReadingDocument
    action: doc_read_resource
  - state: AwaitingRequest
    signal: ValidateRequested
    next: ValidatingDocuments
    action: doc_validate
  - state: AwaitingRequest
    signal: SuggestRequested
    next: SuggestingChanges
    action: doc_suggest_changes
  - state: AwaitingRequest
    signal: ApproveRequested
    next: ApprovingPatch
    action: doc_patch_approve
  - state: AwaitingRequest
    signal: RejectRequested
    next: RejectingPatch
    action: doc_patch_reject
  - state: ListingDocuments
    signal: DocumentListReady
    next: ShapingDocumentIndex
    action: doc_index_response
  - state: ShapingDocumentIndex
    signal: DocumentIndexReady
    next: DocumentIndexReady
  - state: ListingDocuments
    signal: DocumentResourceDenied
    next: RequestDenied
  - state: ListingDocuments
    signal: CommandError
    next: Failed
  - state: ReadingDocument
    signal: DocumentReady
    next: ShapingDocumentDetail
    action: doc_detail_response
  - state: ShapingDocumentDetail
    signal: DocumentDetailReady
    next: DocumentDetailReady
  - state: ReadingDocument
    signal: DocumentMissing
    next: DocumentNotFound
  - state: ReadingDocument
    signal: DocumentResourceDenied
    next: RequestDenied
  - state: ReadingDocument
    signal: DocumentParseFailed
    next: Failed
  - state: ReadingDocument
    signal: CommandError
    next: Failed
  - state: ValidatingDocuments
    signal: RESTResponded
    next: ActionCompleted
  - state: ValidatingDocuments
    signal: RESTDomainFailed
    next: ActionRejected
  - state: ValidatingDocuments
    signal: CommandError
    next: Failed
  - state: SuggestingChanges
    signal: RESTAccepted
    next: ActionCompleted
  - state: SuggestingChanges
    signal: RESTResponded
    next: ActionCompleted
  - state: SuggestingChanges
    signal: RESTDomainFailed
    next: ActionRejected
  - state: SuggestingChanges
    signal: CommandError
    next: Failed
  - state: ApprovingPatch
    signal: RESTResponded
    next: ActionCompleted
  - state: ApprovingPatch
    signal: RESTDomainFailed
    next: ActionRejected
  - state: ApprovingPatch
    signal: RESTMissing
    next: ActionMissing
  - state: ApprovingPatch
    signal: CommandError
    next: Failed
  - state: RejectingPatch
    signal: RESTResponded
    next: ActionCompleted
  - state: RejectingPatch
    signal: RESTDomainFailed
    next: ActionRejected
  - state: RejectingPatch
    signal: RESTMissing
    next: ActionMissing
  - state: RejectingPatch
    signal: CommandError
    next: Failed
