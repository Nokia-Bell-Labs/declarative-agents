# The four words a serving agent's lifecycle is made of -- launch the request
# server, launch the control server, await the control exit, stop the request
# server -- as one fragment. An agent that serves requests differs only in what
# it calls those words, which REST definitions they launch, and the noun its
# prose uses for the work, so each instantiates this once and the words arrive
# under its own names.
#
# The monitor pair that sits between the control launch and the control await
# is a separate fragment, because an agent whose control server is its monitor
# server composes a different set (srd057 R1).
unit: builtin-serve-lifecycle
imports:
  - types-core.yaml
  - types-server.yaml
params:
  - name: agent
    type: string
    description: The agent the problem statements name.
  - name: launch_requests
    type: string
    description: The name the request-server launch word takes.
  - name: launch_control
    type: string
    description: The name the control-server launch word takes.
  - name: await_control
    type: string
    description: The name the control-await word takes.
  - name: stop_requests
    type: string
    description: The name the request-server stop word takes.
  - name: requests_rest_ref
    type: string
    description: The REST definition the request server launches and stops.
  - name: control_rest_ref
    type: string
    description: The REST definition the control server launches.
  - name: requests_noun
    type: string
    description: The noun the prose uses for the work the request server serves, such as chat, query, or intent.
  - name: requests_purpose
    type: string
    description: What the request server serves, completing "Launch the machine_request <noun> server ...".
  - name: control_route
    type: string
    default: exit
    description: The control-server route whose requests the await consumes.
  - name: await_timeout
    type: string
    default: 600s
    description: How long the await waits for a lifecycle exit event before it times out.
tools:
  - name: $param(launch_requests)
    type: builtin
    init: rest_server_launch
    visibility: internal
    category: boundary
    description: Launch the machine_request $param(requests_noun) server $param(requests_purpose).
    signature:
      input: builtin-types-core.NoParameters
      output: builtin-types-server.ServerLaunch
      emits: [ServerLaunched, CommandError]
    output:
      description: The $param(requests_noun) REST server launch result.
    side_effects:
      - kind: network_listen
        target: $param(requests_rest_ref)
        state: listener_started
    reversibility:
      classification: compensatable
    undo:
      strategy: compensating_action
      description: Stop the $param(requests_noun) REST server if the launch owns the listener.
    errors:
      - signal: CommandError
        condition: The $param(requests_noun) REST server config, bind, route, or schema fails.
        state_after_failure: No $param(requests_noun) route is exposed.
    config:
      rest_ref: $param(requests_rest_ref)

  - name: $param(launch_control)
    type: builtin
    init: rest_server_launch
    visibility: internal
    category: boundary
    description: Launch the control server for health and lifecycle exit.
    signature:
      input: builtin-types-core.NoParameters
      output: builtin-types-server.ServerLaunch
      emits: [ServerLaunched, CommandError]
    output:
      description: Control REST server launch result.
    side_effects:
      - kind: network_listen
        target: $param(control_rest_ref)
        state: listener_started
    reversibility:
      classification: compensatable
    undo:
      strategy: compensating_action
      description: Stop the control REST server if the launch owns the listener.
    errors:
      - signal: CommandError
        condition: Control REST server config, bind, route, or schema failure.
        state_after_failure: No control route is exposed.
    config:
      rest_ref: $param(control_rest_ref)

  - name: $param(await_control)
    type: builtin
    init: rest_await_event
    visibility: internal
    category: boundary
    description: Await a lifecycle exit event from the control server.
    signature:
      input: builtin-types-core.NoParameters
      output: builtin-types-server.ControlEvent
      emits: [ExitRequested, AwaitTimedOut, ServerStopped, CommandError]
    output:
      description: Selected lifecycle control event.
    side_effects:
      - kind: state_mutation
        target: rest_server_queue
        state: selected_event_consumed
    reversibility:
      classification: reversible
    undo:
      strategy: queue_event_restore
      description: Restore the receipt-recorded event to the front of its source queue.
      payload: rest_await_event
      captures: [source, event]
    errors:
      - signal: AwaitTimedOut
        condition: No configured lifecycle exit event arrives before the timeout elapses.
        state_after_failure: Listeners remain open; the machine may retry the await or exit.
      - signal: ServerStopped
        condition: A configured source server stops while awaiting under the emit_server_stopped policy.
        state_after_failure: The stopped source no longer delivers events; other sources continue.
      - signal: CommandError
        condition: A configured source server is missing or a queue read fails.
        state_after_failure: Listener state is unchanged.
    config:
      sources:
        - server: $param(control_rest_ref)
          routes: [$param(control_route)]
          signals: [ExitRequested]
      timeout: $param(await_timeout)
      stopped_behavior: emit_server_stopped

  - name: $param(stop_requests)
    type: builtin
    init: rest_server_stop
    visibility: internal
    category: boundary
    description: Stop the owned $param(requests_noun) REST listener.
    signature:
      input: builtin-types-core.NoParameters
      output: builtin-types-server.ServerStop
      emits: [ServerStopped, CommandError]
    output:
      description: The $param(requests_noun) REST server stop result.
    side_effects:
      - kind: network_listener_shutdown
        target: $param(requests_rest_ref)
        state: listener_stopped
    reversibility:
      classification: compensatable
    undo:
      strategy: server_shutdown_or_user_action_compensation
      description: The receipt records shutdown loss; MachineSpec must relaunch the trusted $param(requests_noun) definition.
      payload: boundary_compensation
      captures: [server, address, drained_events, dropped_events, relaunch_requirement]
    errors:
      - signal: CommandError
        condition: The $param(requests_noun) REST server is missing, shutdown times out, or cleanup fails.
        state_after_failure: The $param(requests_noun) listener state may be partially stopped.
    config:
      rest_ref: $param(requests_rest_ref)
