name: runtime-state-reader
# An instance of agent-core's monitor-service machine template (srd054).
unit: runtime-state-reader-machine
purpose: |-
  Launches the runtime-state reader over embedded monitor REST and keeps it serving
  until a configured control exit request stops the owned listener.
expand:
  - fragment: /opt/agent-core/tools/machines/monitor-service-machine-template.yaml
    args:
      profile: runtime-state-reader
      machine: agents/runtime-state-reader/machine.yaml
      tools: agents/runtime-state-reader/tools.yaml
