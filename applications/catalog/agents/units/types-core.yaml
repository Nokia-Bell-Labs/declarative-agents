# Shapes the runtime produces for catalog words, independent of which agent
# declares them. Shapes agent-core already declares, such as Text and
# Comparison, are imported from /opt/agent-core/tools/units instead
# (srd051 R1.5, srd056). ExecStep stays here until agent-core's library
# declares the exec result (GH-2122).
unit: catalog-types-core
types:
- name: ExecStep
  description: The structured envelope an exec word publishes under output mode structured.
  schema:
    type: object
    properties:
      output:
        type: string
      exit_code:
        type: integer
    required:
    - output
    - exit_code
