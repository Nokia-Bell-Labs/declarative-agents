# Shapes the shipped builtin words share regardless of what they compute:
# plain text, an opaque object, the message/signal summary every command word
# publishes, and the process result an exec word publishes under structured
# output.
unit: builtin-types-core
types:
- name: Text
  description: Plain text a word publishes as its whole result.
  schema:
    type: string
- name: AnyValue
  description: Any JSON value accepted by the schema configured on the word.
  schema:
    description: The runtime value is any JSON value accepted by the configured schema.
- name: CommandSummary
  description: The message and outcome signal a command word publishes.
  schema:
    type: object
    properties:
      message:
        type: string
      signal:
        type: string
    required:
    - message
- name: ExecResult
  description: The exit status and captured output of one child process an exec word ran.
  schema:
    type: object
    properties:
      exit_code:
        type: integer
      output:
        type: string
    required:
    - exit_code
    - output
- name: NoParameters
  description: The empty parameter object of a word whose input arrives through config selectors.
  schema:
    type: object
    properties: {}
