# Fixture for R-TOOL-004: an exec entry pipes a selected prior output to stdin and a builtin carries no exec field.
tools:
  - name: consume
    type: exec
    binary: wc
    stdin_source: $from(search).output
    stdin_max_bytes: 2048
    output:
      mode: structured
    env:
      - CORPUS={{ params.collection }}
    parameters:
      type: object
      properties:
        collection: {type: string, flag: --collection, default: "main"}
  - name: done
    type: builtin
    init: done
