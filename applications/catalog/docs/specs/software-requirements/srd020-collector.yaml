id: srd020-collector
title: Collector Agent Family

problem: |
  The chatbot-mesh owns a collector agent that receives, spools, and optionally
  relays OTLP trace batches. This profile is independently useful outside the
  mesh — any deployment that needs an OTLP trace collector with a declarative
  state machine and spool-first evidence model can use it. Promoting it to the
  catalog gives it a canonical home, a generalized default configuration, and
  conformance coverage.

goals:
  - G1: Provide a canonical collector family in the catalog generalized from the mesh profile.
  - G2: Default to spool mode so a standalone collector works without a relay endpoint.
  - G3: Cover the family with deterministic conformance tests exercising the agent-core OTLP builtins.
  - G4: Serve the shipped trace UI from the collector itself, so every collector deployment browses its own spool without a separate UI workload.
  - G5: Expose an Explore surface -- a duration heatmap, group-by counts, and attribute divergence -- so an operator drills from a latency region to the responsible attribute and into a trace waterfall.

requirements:
  R1:
    title: Generalized defaults
    items:
      - R1.1: The collector family SHALL default COLLECTOR_MODE to spool, not relay.
      - R1.2: The relay endpoint SHALL have no default; relay mode requires COLLECTOR_RELAY_ENDPOINT set.
      - R1.3: The decide_collector_relay predicate SHALL compare COLLECTOR_MODE against relay, defaulting to spool when unset.

  R2:
    title: Catalog SRD
    items:
      - R2.1: The family SHALL have a per-family SRD in the catalog adapted from the mesh srd007.
      - R2.2: The SRD SHALL scope the monitor surface to lifecycle and state reads; the monitor exposes no span payloads.
      - R2.3: The SRD SHALL define a separate query surface (collector_query) that serves bounded spool reads via spool_list_traces and spool_get_trace.

  R3:
    title: Conformance coverage
    items:
      - R3.1: The family SHALL enter the membership contract with a bindings.catalog entry in agent-role-realizations.yaml.
      - R3.2: A per-family conformance test SHALL exercise otlp_receiver_launch, await_spans, spool_collector_spans, and the shutdown sequence.

  R4:
    title: Role-realization binding
    items:
      - R4.1: The bindings.catalog entry SHALL have classification role_realization, primary_role monitor, sub_roles [telemetry-collector], domain observability.
      - R4.2: The mesh binding SHALL remain until the mesh swap issue replaces it with a catalog reference.

  R5:
    title: Query REST surface
    items:
      - R5.1: A collector_query server SHALL serve GET /query/traces for paginated trace summaries via spool_list_traces.
      - R5.2: A collector_query server SHALL serve GET /query/traces/{trace_id} for single-trace span detail via spool_get_trace.
      - R5.3: Page size SHALL be capped in tool config, not trusted from the HTTP request.
      - R5.4: The query server lifecycle SHALL follow the same launch/stop pattern as control and monitor, with shutdown ordering after receiver stop and before monitor stop.

  R6:
    title: Trace query UI
    items:
      - R6.1: The collector family SHALL ship a ui/ directory with a React SPA rendering trace list and per-trace waterfall from the collector_query surface.
      - R6.2: The UI SHALL vendor the canonical design-token block and join the root uiDist reproducibility gate.

  R7:
    title: Served UI
    items:
      - R7.1: The collector_query server SHALL serve the shipped ui/dist tree through a static_assets endpoint with spa true, so the UI is reachable at the same origin as /query/*.
      - R7.2: The UI index SHALL answer GET / and SPA deep links (for example /traces/{trace_id}) SHALL resolve to the index document so the client router renders the requested view.
      - R7.3: The /query/* API endpoints SHALL take precedence over the static_assets catch-all; serving the UI SHALL NOT alter any /query/* response body or status.
      - R7.4: The static_assets root SHALL be a literal path declared in the collector REST configuration, resolved relative to the profile directory; it SHALL NOT be introduced as a new environment variable.
      - R7.5: When the configured UI root is absent, the server SHALL answer with an explicit HTTP error status, not a silent empty body.

  R8:
    title: Explore query surface
    items:
      - R8.1: The collector_query server SHALL serve GET /query/spans/stats through declared query-machine actions for agent-core spool_span_heatmap and spool_span_group_by followed by a compose word, returning a duration-over-time heatmap, group-by counts, and a capped list of exemplar trace IDs for the matched span set.
      - R8.2: The collector_query server SHALL serve GET /query/spans/breakdown, bound to spool_span_breakdown, returning the ranked attribute divergence between a selected span region and its complement, and a capped list of exemplar trace IDs for the selection.
      - R8.3: Both routes SHALL accept the filter, bucket, group-by, selection, and top-N inputs as request query parameters passed to the tool config; page and result caps SHALL come from tool config, not be trusted from the request. No route behavior SHALL depend on an environment variable.
      - R8.4: The stats and breakdown JSON response contracts SHALL be pinned by conformance tests so UI and tool drift fail there first, following the R5 query-contract precedent.
      - R8.5: An empty or absent spool SHALL yield a well-formed empty stats or breakdown response, not an error.

  R9:
    title: Explore UI
    items:
      - R9.1: The shipped UI SHALL add an Explore page that renders the duration heatmap from /query/spans/stats and lets the operator drag-select a region of it.
      - R9.2: The Explore page SHALL show the ranked attribute divergence for the selected region from /query/spans/breakdown, and list the selection-scoped exemplar traces the breakdown (or, before any selection, the stats) response returns, each linking into the existing per-trace waterfall (R6).
      - R9.3: The Explore page SHALL join the root uiDist reproducibility gate and reach the server through same-origin /query/* only, adding no new runtime dependency for the heatmap.

non_goals:
  - Removing the mesh collector or changing the mesh deployment to reference the catalog family.
  - Metrics ingress or Dolt scraping.

acceptance_criteria:
  - id: AC1
    criterion: The catalog conformance suite passes with the collector family; the profile launches standalone in spool mode and reaches the AwaitingSpans loop.
    traces: [R1.1, R1.3, R3.2]

  - id: AC2
    criterion: The role-realization audit passes with both the catalog and mesh bindings present.
    traces: [R4.1, R4.2]

  - id: AC3
    criterion: The relay endpoint config has no default; the decide predicate defaults COLLECTOR_MODE to spool.
    traces: [R1.2, R1.3]

  - id: AC4
    criterion: The collector_query server serves the UI index at / and resolves SPA deep links to that index, at the same origin as the query API, and no /query/* response changes.
    traces: [R7.1, R7.2, R7.3]

  - id: AC5
    criterion: The UI root is a literal profile-declared path with no new environment variable, and a missing UI root yields an explicit error status rather than a blank page.
    traces: [R7.4, R7.5]

  - id: AC6
    criterion: GET /query/spans/stats returns the heatmap, group-by, and exemplar-trace-ID contract and GET /query/spans/breakdown returns the ranked divergence and exemplar-trace-ID contract, both pinned by conformance, with caps taken from tool config not the request.
    traces: [R8.1, R8.2, R8.3, R8.4]

  - id: AC7
    criterion: An empty or absent spool yields a well-formed empty stats and breakdown response rather than an error.
    traces: [R8.5]

  - id: AC8
    criterion: The Explore page renders the heatmap, drag-selects a region, shows the ranked divergence and the selection-scoped exemplar traces linking into the waterfall, and reproduces from a clean uiDist build.
    traces: [R9.1, R9.2, R9.3]

depends_on:
  - srd_id: srd042-otlp-receiver-tools
    symbols_used: [otlp_receiver_launch, await_spans, spool_spans, relay_spans, otlp_receiver_stop]
  - srd_id: srd044-spool-query-tools
    symbols_used: [spool_list_traces, spool_get_trace]
  - srd_id: srd045-span-analytics-tools
    symbols_used: [spool_span_heatmap, spool_span_group_by, spool_span_breakdown]

related_documents:
  - srd007-collector-agent
  - cfg-tool-authoring-standard

implementation_status:
  implemented:
    - "applications/catalog/agents/collector/ owns the canonical collector family."
    - "applications/catalog/conformance/collector_test.go proves receive-spool-exit in spool mode."
    - "applications/docs/specs/semantic-models/agent-role-realizations.yaml carries the catalog binding."
