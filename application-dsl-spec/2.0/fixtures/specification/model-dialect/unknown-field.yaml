# Fixture for R-MODEL-007: a key the dialect grammar does not name.
kind: llm-configuration
schema_version: 1
unit: example-chat-dialect
provider_name: example
streaming: true
path: /v1/chat
auth:
  type: bearer
  token_ref: EXAMPLE_API_KEY
body:
  model: "{{ params.model }}"
  messages: "{{ params.messages }}"
  temperature: "{{ params.temperature }}"
response:
  text: $.choices.0.message.content
  text_required: true
  input_tokens: $.usage.prompt_tokens
  output_tokens: $.usage.completion_tokens
failures:
  - {status: [401, 403], signal: ProviderUnauthorized}
  - {status: [429], signal: ProviderThrottled}
  - {status: [500, 502, 503, 504], signal: ProviderUnavailable}
