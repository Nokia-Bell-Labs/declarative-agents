id: srd005-chart-conformance
title: Chart Conformance Against the Rig Guideline
status: planned

problem: |
  ENG01 states the rules an application chart must satisfy — images pinned
  and never floating, names that name registry, role, and typed identity,
  pull policies that keep a kind node off the registry, no load balancer a
  kind cluster cannot provide, readiness observed rather than assumed — and
  nothing enforces them. Review is the only gate, and review already missed
  three images that ship on a floating tag. A chart renders differently
  under each values overlay, so reading the templates does not answer
  whether the rules hold; only the rendered manifests do. There is also no
  way to accept a violation on purpose: a chart that must break a rule for
  a stated reason cannot say so, and a rule that has been fixed cannot
  prove it stays fixed.

goals:
  - "G1: Restate the gateable ENG01 chart rules as numbered requirements a check can cite."
  - "G2: Gate the rules on rendered manifests, once per chart and values overlay, rather than on template text."
  - "G3: Give an accepted violation one checked-in place to live, and make that place shrink."
  - "G4: Report a violation as the chart, the overlay, the resource, and the rule, so a reader can act without re-rendering."

applicability:
  baseline: |
    R1 through R5, R9, and R10 apply to every application chart in this
    repository and to every checked-in values overlay that chart renders
    under. R6 applies to every checked-in kind configuration. R7 governs
    the exception baseline and applies whenever any other requirement is
    suspended. R8 applies to every finding the gate reports.
  capability_gates:
    helm_managed: R1 through R5, R8, R9, and R10 apply only to an application that ships a chart.
    kind_demo: R6 applies only to an application that carries a kind configuration.

requirements:
  R1:
    title: Image tags do not float
    applicability: helm_managed
    items:
      - id: R1.1
        text: |
          No image reference in a rendered manifest shall resolve to the tag
          `latest` or to no tag at all.
        evidence: |
          Rendering every chart under every checked-in values overlay yields
          no container, init container, or pod-template image whose tag is
          `latest` or absent.
      - id: R1.2
        text: |
          A values file shall not carry a floating tag that an overlay is
          expected to replace. The default render is subject to the same
          rule as every overlay render.
        evidence: |
          The chart's own defaults render without a floating tag, so an
          operator installing the chart unmodified receives pinned images.

  R2:
    title: Third-party images carry digests
    applicability: helm_managed
    items:
      - id: R2.1
        text: |
          Every image not built from this checkout shall carry a digest
          alongside its tag. The tag names the version for a reader; the
          digest is what the cluster resolves.
        evidence: |
          Each third-party image reference in a rendered manifest carries a
          `sha256:` digest, and removing the digest from a values file fails
          the gate.
      - id: R2.2
        text: |
          Every image built from this checkout shall carry a non-floating
          tag and shall not be required to carry a digest, because the
          digest is not known until the image is built. The tag may name a
          release, a typed git or recipe identity, or a fail-closed
          sentinel a run replaces.
        evidence: |
          Repository-built image references are distinguished from
          third-party ones by repository prefix, and each class is checked
          against its own rule rather than one rule applied to both. A
          repository-built image without a digest does not fail the gate.

  R3:
    title: Pull policies keep a loaded node off the registry
    applicability: helm_managed
    items:
      - id: R3.1
        text: |
          Every container shall set `imagePullPolicy` to `IfNotPresent` or
          `Never`. `Always` shall not appear in a rendered manifest.
        evidence: |
          No rendered container carries `imagePullPolicy: Always`, so an
          image a kind node already holds is used rather than re-fetched.

  R4:
    title: No service type a kind cluster cannot provide
    applicability: helm_managed
    items:
      - id: R4.1
        text: |
          No Service of type `LoadBalancer` shall render from any chart or
          values overlay. A chart that needs one in production shall put it
          behind a values switch that every checked-in overlay leaves off.
        evidence: |
          No rendered Service declares `type: LoadBalancer`, and a chart
          that introduces one behind a switch renders without it under
          every checked-in overlay.

  R5:
    title: Readiness is declared where traffic arrives
    applicability: helm_managed
    items:
      - id: R5.1
        text: |
          Every workload a Service selects shall declare a readiness probe
          on the container that serves the selected port.
        evidence: |
          Each rendered Service's selector resolves to a workload whose
          serving container carries a readiness probe, so the Service does
          not route to a pod that has not reported it can serve.

  R6:
    title: Kind node images are pinned by version and digest
    applicability: kind_demo
    items:
      - id: R6.1
        text: |
          Every checked-in kind configuration shall pin its node image by
          version and digest, in the form `kindest/node:vX.Y.Z@sha256:...`.
        evidence: |
          Each kind configuration file carries a node image with both a
          version tag and a digest, so two machines create the same cluster.

  R7:
    title: The exception baseline shrinks
    applicability: runnable_module
    items:
      - id: R7.1
        text: |
          An accepted violation shall be recorded in one checked-in
          exception baseline. Each entry shall name the chart, the values
          overlay, the resource, the requirement it suspends, the issue
          that will remove it, and why it stands.
        evidence: |
          The baseline parses, every entry carries all six fields, and a
          violation listed in it does not fail the gate.
      - id: R7.2
        text: |
          A violation absent from the baseline shall fail the gate. The
          baseline shall not be written by the gate that reads it.
        evidence: |
          Introducing a violation fails the gate, and the gate produces no
          edit to the baseline file.
      - id: R7.3
        text: |
          A baseline entry whose violation no longer reproduces shall fail
          the gate, naming the entry to remove.
        evidence: |
          Fixing a violation while leaving its baseline entry in place fails
          with a message identifying the stale entry, so the file cannot
          accumulate exceptions that no longer apply.

  R8:
    title: A finding names where it is
    applicability: helm_managed
    items:
      - id: R8.1
        text: |
          A reported violation shall name the chart, the values overlay, the
          rendered resource kind and name, the offending value, and the
          requirement it breaks.
        evidence: |
          A seeded violation produces a message carrying all five, so a
          reader locates it without re-rendering the chart.

  R9:
    title: Every agent workload runs one image
    applicability: helm_managed
    items:
      - id: R9.1
        text: |
          Every rendered workload whose main container runs the `agent`
          binary shall resolve to one image reference per application: the
          application's declared agent image. Planner, executor, critic,
          collector, applier, and any repository-deployed test double are
          agent workloads and shall not carry a per-role or per-test agent
          image. This is the composition model's one-image invariant.
        evidence: |
          Rendering every chart under every checked-in overlay yields one
          distinct agent-container image reference, and setting a collector,
          applier, or role agent image that differs from the application
          image fails the gate.
      - id: R9.2
        text: |
          A container that is not an agent workload shall be classified, not
          silently exempted. An init or tool-donor image that copies binaries
          into a volume the agent consumes, and a non-agent workload whose
          main process is not the `agent` binary, are the only images that
          may differ from the application agent image.
        evidence: |
          The gate distinguishes agent main containers from init containers
          and non-agent workloads, checks only the former against R9.1, and
          names the classification it applied for each differing image.

  R10:
    title: Image references name registry, role, and typed identity
    applicability: helm_managed
    items:
      - id: R10.1
        text: |
          A third-party image shall be fully qualified: its repository shall
          include a registry host. A first-party image this checkout builds
          for a local cluster shall use the repository
          `localhost/declarative-agents/<role>/<component>`, where role is
          one of `runtime`, `test`, `derived`, and `cache`. A published
          first-party image shall keep its release-registry path.
        evidence: |
          Rendering every chart under every overlay yields no third-party
          image whose first path component is not a registry host, and no
          local first-party image outside `localhost/declarative-agents/`.
      - id: R10.2
        text: |
          A local first-party tag shall be a typed identity:
          `git-<12-hex>-linux-<arch>`, `recipe-<12-hex>-linux-<arch>`, or
          `upstream-<version>-recipe-<12-hex>-linux-<arch>`. Environment
          and cluster names are not image identity.
        evidence: |
          Every `localhost/declarative-agents/` reference carries a typed
          tag; a malformed typed tag fails the gate.
      - id: R10.3
        text: |
          A rendered manifest shall not carry an active `kindrig/*`
          repository, the tag `local`, a consumer-oriented `*-smoke`
          repository, or an untyped 12-hex tag on a local first-party
          image.
        evidence: |
          Introducing any of those forms fails the gate naming the chart,
          the overlay, the resource, the offending image, and R10.3.

  R11:
    title: The applier can upgrade everything its chart renders
    applicability: helm_managed
    items:
      - id: R11.1
        text: |
          An applier Role that grants any write verb shall grant get and
          update (or patch) on every object kind the chart renders, by API
          group and resource. An in-cluster upgrade re-renders the whole
          chart and reads each object before writing it, so a kind the
          Role cannot read refuses the upgrade on its first object of that
          kind. A Role with no write verb never upgrades and is not checked.
        evidence: |
          Rendering every chart under every overlay yields no rendered kind
          outside its applier Role's read-and-write grants; removing
          ingresses from the Role, or rendering a new kind the Role does not
          name, fails the gate naming the chart, the overlay, the Role, the
          uncovered group and resource, and R11.1.

non_goals:
  - Rendering charts against a live cluster. The gate reads manifests and needs no Kubernetes.
  - Judging whether an application template should instead call the shared library chart. That classification is tracked separately.
  - Refreshing pinned digests when an upstream release appears. Pin maintenance is its own concern.
  - Governing charts outside this repository. A consumer repository owns its own conformance.
  - Linting chart template style, values schema shape, or documentation. Existing per-application gates own those.

acceptance_criteria:
  - id: AC1
    criterion: |
      Every application chart renders under its own defaults and under each
      of its checked-in values overlays, and each rendered manifest is
      checked against R1 through R5.
    traces:
      - R1.1
      - R1.2
      - R3.1
      - R4.1
      - R5.1
  - id: AC2
    criterion: |
      Third-party images carry a digest and repository-built images carry a
      non-floating tag, each checked against its own rule.
    traces:
      - R2.1
      - R2.2
  - id: AC3
    criterion: |
      Every checked-in kind configuration pins its node image by version and
      digest.
    traces:
      - R6.1
  - id: AC4
    criterion: |
      The exception baseline suspends a named violation, fails on an
      unlisted one, and fails on an entry that no longer reproduces.
    traces:
      - R7.1
      - R7.2
      - R7.3
  - id: AC5
    criterion: |
      A violation is reported as chart, overlay, resource, value, and
      requirement.
    traces:
      - R8.1
  - id: AC6
    criterion: |
      Every rendered agent workload in every application chart resolves to the
      one application agent image; a differing role, collector, applier, or
      test-double agent image fails the gate, while classified init/tool-donor
      and non-agent images do not.
    traces:
      - R9.1
      - R9.2
  - id: AC7
    criterion: |
      Every rendered image is a fully qualified upstream reference, a
      canonical `localhost/declarative-agents/<role>/<component>:<typed-identity>`
      local reference, or a published first-party release-registry path.
      Active `kindrig/*` aliases, the tag `local`, untyped 12-hex local
      tags, and consumer-oriented `*-smoke` repositories fail the gate.
    traces:
      - R10.1
      - R10.2
      - R10.3
  - id: AC8
    criterion: |
      Every applier Role that may write grants get and update on every
      object kind its chart renders; a rendered kind outside those grants
      fails the gate, and a read-only applier is not checked.
    traces:
      - R11.1

