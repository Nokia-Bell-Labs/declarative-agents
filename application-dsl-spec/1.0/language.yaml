      - assertion: rig
        path: agent-core/internal/runtime/core/loop_runtime_test.go
        test: TestLoop_UnhandledTransitionPreservesOriginalFailure
      - assertion: rig
        path: agent-core/internal/runtime/core/loop_runtime_test.go
        test: TestLoopUsesDeclaredStatusForArbitrarilyNamedTerminal
      - assertion: rig
        path: agent-core/internal/runtime/core/loop_runtime_test.go
        test: TestLoop_OmittedTerminalStatusFailsClosed

  - id: R-RUN-005
    target: runtime
    level: MUST
    statement: >-
      A conforming runtime MUST check the iteration and token budgets before
      each transition and, when either is exhausted, MUST inject the
      `BudgetExhausted` signal for the machine-instance to route; when the
      wall-clock budget is exhausted or the run is cancelled, the runtime MUST
      end the run with the cancelled status without routing any further
      transition.
    acceptance:
      - assertion: rig
        path: agent-core/internal/runtime/core/loop_runtime_test.go
        test: TestLoop_BudgetExhausted
      - assertion: rig
        path: agent-core/internal/runtime/core/loop_runtime_test.go
        test: TestLoop_TokenBudgetExhausted
      - assertion: rig
        path: agent-core/internal/runtime/core/spec_pin_runtime_test.go
        test: TestLoop_WallClockBudgetTerminatesAsCancelled
      - assertion: rig
        path: agent-core/internal/runtime/core/loop_runtime_test.go
        test: TestLoop_ActiveDispatchCancellation

  - id: R-RUN-006
    target: runtime
    level: MUST
    statement: >-
      A conforming runtime MUST convert a dispatch that panics or exceeds the
      command timeout into a result carrying the `CommandError` signal, and
      MUST route that signal through the machine-instance like any other
      result.
    acceptance:
      - assertion: rig
        path: agent-core/internal/runtime/core/dispatch_test.go
        test: TestSafeExecute_RecoversPanicAndForcesCommandError
      - assertion: rig
        path: agent-core/internal/runtime/core/dispatch_test.go
        test: TestSafeExecute_TimeoutAndIndefiniteWait
      - assertion: rig
        path: agent-core/cmd/agent/machine_policy_test.go
        test: TestMachineCommandTimeoutRoutesRecoveryAndContinues

  - id: R-RUN-007
    target: runtime
    level: MUST
    statement: >-
      A conforming runtime MUST record one step-log entry per dispatch, naming
      the tool, its result signal, and its from and to states, and MUST save
      the position and the step log through the configured checkpoint port
      after each dispatch; a failed save MUST end the run with the failed
      status, and the unsaved step MUST NOT be persisted as resumable.
    acceptance:
      - assertion: rig
        path: agent-core/internal/runtime/core/loop_runtime_test.go
        test: TestLoop_DispatchesNamedActionTargetingTerminalState
      - assertion: rig
        path: agent-core/internal/runtime/core/loop_checkpoint_test.go
        test: TestLoop_SavesSnapshotAfterDispatchWithConfiguredAdapter
      - assertion: rig
        path: agent-core/internal/runtime/core/loop_checkpoint_test.go
        test: TestLoop_PeriodicSaveFailureStopsAtUnpersistedStep
      - assertion: rig
        path: agent-core/internal/runtime/core/loop_checkpoint_test.go
        test: TestLoop_TerminalFinalizationFailureIsNotReportedAsSuccess

  - id: R-RUN-008
    target: runtime
    level: MUST
    statement: >-
      A conforming runtime process MUST exit 0 when the run ends succeeded or
      suspended, MUST exit 2 when it ends failed, budget-exceeded, or
      cancelled, and MUST exit 1 when a startup or runtime error prevents a
      completed outcome; on a completed outcome it MUST write the labeled
      `terminal state:` and `final machine state:` lines to standard error.
    acceptance:
      - assertion: rig
        path: agent-core/cmd/agent/main_exit_code_test.go
        test: TestExitCodeForStatus
      - assertion: rig
        path: agent-core/cmd/agent/main_exit_code_test.go
        test: TestExitCodesAreDistinct
      - assertion: rig
        path: agent-core/cmd/agent/main_bootstrap_test.go
        test: TestRunPreparedPrintsSummaryFinalStateAndMappedExit
      - assertion: rig
        path: agent-core/cmd/agent/checkpoint_lifecycle_test.go
        test: TestRunPreparedMachineFailureUsesMachineExitCode
      - assertion: rig
        path: agent-core/cmd/agent/spec_pin_process_test.go
        test: TestSpecPinRunErrorExitsOne
  - id: R-RUN-009
    target: runtime
    level: MUST
    statement: >-
      A conforming runtime process MUST write a terminal summary to standard
      output only when the machine-instance declares the signal whose result
      supplies it, and MUST bound that summary to 1 MiB including its
      truncation marker.
    acceptance:
      - assertion: rig
        path: agent-core/cmd/agent/main_bootstrap_test.go
        test: TestCLIResultReporterDoesNotInventUndeclaredSummary
      - assertion: rig
        path: agent-core/cmd/agent/main_bootstrap_test.go
        test: TestCLIResultReporterBoundsDeclaredMachineSummary

  - id: R-RUN-010
    target: runtime
    level: MUST
    statement: >-
      Until a prepared run begins, a conforming runtime process MUST leave
      SIGINT and SIGTERM at their operating-system disposition, so a signal
      during startup ends the process; once the prepared run begins, it MUST
      treat SIGINT and SIGTERM as cancellation of the run: the active dispatch
      is cancelled, owned resources are closed, and the run's trace is
      published before the process exits.
    acceptance:
      - assertion: rig
        path: agent-core/cmd/agent/signal_shutdown_test.go
        test: TestRuntimeSignalCancelsDispatchAndPublishesTrace
      - assertion: rig
        path: agent-core/cmd/agent/checkpoint_lifecycle_test.go
        test: TestPreparedRunCloseCancelsBeforeCheckpointAndTelemetry
      - assertion: rig
        path: agent-core/cmd/agent/spec_pin_process_test.go
        test: TestSpecPinPreRunSignalKeepsOSDefault
  - id: R-RUN-011
    target: runtime
    level: MUST
    statement: >-
      A conforming runtime MUST start a child agent-instance from a child
      agent-profile path alone, passing it only that path and the runtime data
      channels (workspace directory, request, output, and telemetry), never a
      child machine-profile or tool-selection path, and MUST reject at
      registration a child-invoking tool whose configuration names no
      agent-profile; a nested in-process run MUST name its machine-profile,
      tool selection, and tool declarations in its tool configuration.
    acceptance:
      - assertion: rig
        path: agent-core/internal/support/execute/execute_test.go
        test: TestBuildArgs_ProfileOnly
      - assertion: rig
        path: agent-core/internal/tools/catalog/config_validation_from_stl_test.go
        test: TestValidateChildAgentConfigRequiresFields
      - assertion: rig
        path: agent-core/internal/tools/catalog/config_validation_from_stl_test.go
        test: TestValidateRunPointConfigRequiresFields

  - id: R-RUN-012
    target: runtime
    level: MUST NOT
    statement: >-
      A conforming runtime MUST NOT select behavior by the name of an
      agent-profile, a mode, or a specific tool in its interpreter or
      composition code; workflow choice MUST come only from the machine-profile
      and the tools the agent-profile selects.
    acceptance:
      - assertion: rig
        path: agent-core/internal/runtime/core/engine_guard_test.go
        test: TestCoreSourceDoesNotEmbedModeOrToolPolicyNames
      - assertion: rig
        path: agent-core/cmd/agent/main_bootstrap_test.go
        test: TestMainRuntimeDoesNotBranchOnAgentModeNames
      - assertion: rig
        path: agent-core/internal/runtime/core/loop_declarative_test.go
        test: TestLoop_DeclarativeInit_MachineNameDoesNotChangeEngineBehavior

  - id: R-POP-005
    target: population
    level: MUST
    statement: >-
      A conforming population authority MUST realize each declared `Agent`
      resource as agent-instances that all run the one agent-profile the
      resource names, as many as the resource's replica count declares and one
      when it declares none, and MUST own the workload and the service that
      realize it.
    acceptance:
      - assertion: rig
        path: operator/internal/controller/agent_controller_test.go
        test: TestReconcileCreatesDeploymentAndService
      - assertion: rig
        path: operator/internal/controller/agent_controller_test.go
        test: TestReconcileRollsOnSpecChange
      - assertion: rig
        path: operator/internal/controller/agent_controller_test.go
        test: TestReconcilePassesArgsServiceAccountAndClaim

  - id: R-POP-006
    target: population
    level: MUST NOT
    statement: >-
      A conforming population authority MUST NOT start agent-instances for an
      agent-profile that is missing or fails the runtime's startup checks; it
      MUST report the declaration not ready and retry rather than schedule.
    acceptance:
      - assertion: rig
        path: operator/internal/controller/agent_controller_test.go
        test: TestReconcileReportsProfileInvalid
      - assertion: rig
        path: operator/internal/controller/agent_controller_test.go
        test: TestReconcileReportsMissingProfile
      - assertion: rig
        path: agent-core/pkg/profileservers/profileservers_test.go
        test: TestValidateAppliesTheStartupBoundary

  - id: R-POP-007
    target: population
    level: MUST
    statement: >-
      A conforming population authority MUST derive the endpoints, ports, and
      readiness checks of the agent-instances it realizes from the
      agent-profile's declarations, and MUST carry a change to the
      agent-profile through to those agent-instances.
    acceptance:
      - assertion: rig
        path: operator/internal/controller/agent_controller_test.go
        test: TestReconcileDerivesPortsFromTheProfile
      - assertion: rig
        path: operator/internal/controller/agent_controller_test.go
        test: TestReconcileFollowsAProfileChange
