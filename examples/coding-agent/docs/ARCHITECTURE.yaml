    purpose: End-to-end planner, executor, and critic flow.
  - doc: docs/specs/test-suites/test-rel01.0-coding-loop.yaml
    purpose: Inputs and expected outputs for the three integration stages.
  - doc: agent-profiles/docs/specs/software-requirements/srd002-executor.yaml
