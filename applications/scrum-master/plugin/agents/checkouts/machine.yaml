name: checkouts
purpose: |-
  Lay the program's checkouts down from the system checkout (GH-2812):
  clone every repository the registry names at its group path beside the
  system checkout, and fetch and fast-forward the ones already there. Use
  when a program's repositories are missing beside the system checkout, or
  before words that read the whole program, the site and the roll-up among
  them.

  This machine has no model state: scrum-master checkouts (design.md D10,
  D14). It runs in the system checkout. A checkout on another branch, or
  holding changes git status shows, is kept with the reason, and a
  repository that cannot be reached fails alone.
configuration:
  machine: plugin/agents/checkouts/machine.yaml
  tools: plugin/agents/checkouts/tools.yaml
invariants:
- Every step is a word; no model acts anywhere in this machine
- Nothing a person is working in is touched; a kept checkout names its reason
lifecycle: |-
  1. Idle → Checkouts (Seed): scrum-master checkouts
  2. Checkouts → Done (ToolDone)
initial_state: Idle
budget:
  command_timeout: 16m
  max_iterations: 10
states:
- name: Idle
  meaning: Initial state before the first word.
- name: Checkouts
  meaning: |
    The checkouts word: from the system checkout, scrum-master checkouts
    reads the registry, clones each registered repository that has no
    checkout at its group path, fast-forwards the clean ones on their
    default branch, and reports each as cloned, updated, kept, or failed.
- name: Done
  run_status: succeeded
  meaning: |
    Terminal. Every word ran, and the last one reported what it did.
- name: Refused
  run_status: failed
  meaning: |
    Terminal. The directory is no system checkout, has no forge origin, or
    its registry names no repositories, and the word's reason is the run's
    last output.
- name: Failed
  run_status: failed
  meaning: Terminal. An infrastructure error outside the words' refusals.
terminal_states:
- Done
- Refused
- Failed
signals:
- name: Seed
  trigger: Loop initialization.
- name: ToolDone
  trigger: A word executed successfully.
- name: ToolFailed
  trigger: A word reported failure — a refusal with its reason.
- name: CommandError
  trigger: Infrastructure-level error (not a tool failure).
transitions:
- state: Idle
  signal: Seed
  next: Checkouts
  action: checkouts
  summary: true
- state: Checkouts
  signal: ToolFailed
  next: Refused
- state: Checkouts
  signal: ToolDone
  next: Done
- state: Idle
  signal: CommandError
  next: Failed
- state: Checkouts
  signal: CommandError
  next: Failed
