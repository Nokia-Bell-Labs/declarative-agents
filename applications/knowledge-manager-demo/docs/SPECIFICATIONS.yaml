id: knowledge-manager-demo-specifications
title: Knowledge Manager Demo Application Specification Index

overview: |
  This index governs the standalone Knowledge Manager demo composition.
  Release 00.0 has one application use case and one reciprocal test suite. The
  application references the canonical documentation-curator requirements and
  profile UX evidence in applications/catalog; it does not fork or re-index
  them as application-owned requirements.

  The dependency direction is application -> applications/catalog ->
  agent-core. The Go present tool, catalog checkout, and agent-core checkout are
  explicit development or runtime inputs. Planned Mage evidence validates
  command construction, portable root resolution, launch and exit behavior,
  documentation traceability, and composition-only statistics.

