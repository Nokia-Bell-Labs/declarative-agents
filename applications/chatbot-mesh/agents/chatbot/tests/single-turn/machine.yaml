name: chatbot-turn-critic
# An instance of the chat-turn critic machine template (srd054); the purpose
# says what this scenario proves.
unit: single-turn-critic-machine
purpose: |-
  Critiques one tier-selected chatbot turn against isolated mock dependencies and
  passes when the turn returns an answer: embed at the mock provider, source selection keeps rag0
  while discarding an undeclared URL-shaped name, the tier selector's tool call,
  and the selected chat word all completed. The undeclared name has no topology
  entry and therefore cannot reach a REST target.

  The drive runs on the way into Checking so its signal decides the terminal
  state; routing straight to a terminal would pass regardless of the result.
instantiate:
  - fragment: ../chat-turn-critic-machine-template.yaml
    args: {drive: drive_chat_turn}
