coverage_notes:
  implemented_now:
    - TC1 through TC8 are executable and validate the completed Release 14
      normalization, reciprocal traces, and repository audit.
  remaining:
    - A capability with no declaration remains not_applicable and does not need
      an empty directory or a passing no-op test.
