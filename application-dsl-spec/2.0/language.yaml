  - id: R-MACH-017
    target: runtime
    level: MUST
    statement: >-
      A conforming runtime MUST dispatch each element as an ordinary step,
      with its own trace, checkpoint entry, receipt, cancellation, and
      budget iteration, and MUST reduce the outcomes in input order whatever
      order parallel work finishes in, never running more than
      `max_concurrency` at once. `fail_fast` cancels the elements still
      running and waits for them before the join; an empty array joins at
      once on `empty`; a resumed run continues after the last element its
      checkpoint recorded. The join records one step holding the ordered
      outcomes and their counts under its `label`, then raises the signal
      its outcome selects. When a composed template's `exit` maps the state
      a join lands on, the join lands on the mapped host state
      (R-MODEL-005).
