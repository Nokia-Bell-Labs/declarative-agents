name: chatbot-turn-critic
# An instance of the chat-turn critic machine template (srd054); the purpose
# says what this scenario proves.
unit: degraded-rag-critic-machine
purpose: |-
  Critiques one chatbot turn whose source classifier returns malformed JSON while
  the first RAG mock fails every query. Passing means malformed selection fell
  back to both declared sources and the chatbot degraded as srd002 requires: the
  failed source is excluded and the turn still answers from the remaining one.

  The drive runs on the way into Checking so its signal decides the terminal
  state; routing straight to a terminal would pass regardless of the result.
expand:
  - fragment: ../chat-turn-critic-machine-template.yaml
    args: {drive: drive_chat_turn}
