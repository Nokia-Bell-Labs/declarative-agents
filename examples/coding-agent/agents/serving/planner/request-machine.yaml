name: coding-planner-request
purpose: Plan one coding request, delegate it to the remote executor, then gate the shared workspace through the remote critic.
initial_state: AwaitingRequest
budget:
  max_iterations: 8
states:
  - {name: AwaitingRequest, meaning: The trusted endpoint has seeded a task and workspace identity.}
  - {name: Planning, meaning: Canonical planner model behavior is producing a structured plan.}
  - {name: Parsing, meaning: Canonical planner parsing is validating the structured plan.}
  - {name: Executing, meaning: The task is running on the declared executor service over the shared workspace mount.}
  - {name: Critiquing, meaning: The executor result is being gated by the declared critic service.}
  - {name: Succeeded, meaning: Terminal after critic acceptance.}
  - {name: Rejected, meaning: Terminal after critic rejection.}
  - {name: Failed, meaning: Terminal after planning or remote-boundary failure.}
terminal_states: [Succeeded, Rejected, Failed]
signals:
  - {name: Seed, trigger: A validated planner request.}
  - {name: LLMResponded, trigger: The canonical planner LLM boundary returned.}
  - {name: PlanReady, trigger: The canonical planner parser accepted the plan.}
  - {name: ParseFailed, trigger: The planner response was not a valid plan.}
  - {name: ExecutionDone, trigger: The executor service reached Succeeded.}
  - {name: ExecutionFailed, trigger: The executor service rejected the task.}
  - {name: CriticAccepted, trigger: The critic accepted the shared workspace.}
  - {name: CriticRejected, trigger: The critic rejected the shared workspace.}
  - {name: CommandError, trigger: A model or declared REST boundary failed.}
transitions:
  - {state: AwaitingRequest, signal: Seed, next: Planning, action: invoke_llm}
  - {state: Planning, signal: LLMResponded, next: Parsing, action: parse_plan}
  - {state: Planning, signal: CommandError, next: Failed}
  - {state: Parsing, signal: PlanReady, next: Executing, action: delegate_executor}
  - {state: Parsing, signal: ParseFailed, next: Failed}
  - {state: Parsing, signal: CommandError, next: Failed}
  - {state: Executing, signal: ExecutionDone, next: Critiquing, action: delegate_critic}
  - {state: Executing, signal: ExecutionFailed, next: Failed}
  - {state: Executing, signal: CommandError, next: Failed}
  - {state: Critiquing, signal: CriticAccepted, next: Succeeded}
  - {state: Critiquing, signal: CriticRejected, next: Rejected}
  - {state: Critiquing, signal: CommandError, next: Failed}
