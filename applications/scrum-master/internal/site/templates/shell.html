<!doctype html>
<!-- Generated by the site skill's scaffold word (GH-119, GH-127). Regenerate it; an edited
     copy is kept and no longer refreshed. It renders the generated Markdown beside it in
     the browser, so GitLab Pages serves the site as an app: publish the site/ folder as
     public/ in a pages CI job. An air-gapped GitLab can vendor the three pinned libraries
     below into this folder and point the script tags at them. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Program site</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4.13.1/themes/vue.css">
<style>
  :root { --theme-color: #2563eb; --nav-width: 300px; }
  body { font-size: 15px; }
  .markdown-section { max-width: 60em; }
  .markdown-section table { display: table; width: 100%; }
  .mermaid { text-align: center; }
  /* The overview's timeline and initiative tiles (GH-128). */
  iframe.timeline { width: 100%; height: 520px; border: 1px solid #e5e7eb; border-radius: 6px; overflow: hidden; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; margin: 1em 0; }
  .markdown-section a.tile { display: flex; flex-direction: column; gap: 6px; padding: 14px; border: 1px solid #e5e7eb;
    border-radius: 8px; color: inherit; text-decoration: none; background: #fff; }
  .markdown-section a.tile:hover { border-color: var(--theme-color); box-shadow: 0 1px 4px rgba(0,0,0,.08); }
  .tile-title { font-weight: 600; }
  .tile-state { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: #6b7280; }
  .tile.state-active .tile-state { color: var(--theme-color); }
  .tile.state-done .tile-state { color: #16a34a; }
  .tile-bar { height: 6px; background: #e5e7eb; border-radius: 3px; overflow: hidden; }
  .tile-bar > span { display: block; height: 100%; background: var(--theme-color); }
  .tile-points, .tile-facts { font-size: 13px; color: #4b5563; }
  /* The navigator as an expandable tree (GH-131): a branch folds under its
     toggle; the current page's branch opens on every route. */
  .sidebar-nav li.branch > ul { margin-left: 0.6em; }
  .sidebar-nav li.branch.folded > ul { display: none; }
  .sidebar-nav li.branch { list-style: none; position: relative; }
  /* The toggle sits in the row's left margin: sidebar links are blocks, so
     an inline toggle would take a line of its own. */
  .sidebar-nav .twisty { position: absolute; left: -1.2em; top: 0; width: 1.2em; line-height: 2em; cursor: pointer;
    color: #6b7280; user-select: none; font-size: 11px; text-align: center; }
  .sidebar-nav .twisty:hover { color: var(--theme-color); }
  /* Narrow windows (GH-131): from 520 pixels the navigator stays docked,
     narrower; below that a labelled Menu button opens it from the top-left. */
  @media screen and (min-width: 520px) and (max-width: 768px) {
    :root { --nav-width: 210px; }
    .sidebar { left: 0; width: var(--nav-width); transform: none; }
    .content { position: absolute; left: var(--nav-width); right: 0; padding-top: 20px; transform: none; }
    body.close .sidebar, body.close .content { transform: none; }
    .sidebar-toggle { display: none; }
  }
  @media screen and (max-width: 519px) {
    .sidebar-toggle { top: 0; bottom: auto; width: auto; padding: 8px 12px; background: #fff;
      border-bottom-right-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.15); }
    .sidebar-toggle .sidebar-toggle-button::after { content: "Menu"; margin-left: 22px; font-size: 14px; color: #374151; }
    .content { padding-top: 48px; }
  }
  /* Wherever the navigator is docked, from 520 pixels, the divider between
     it and the page drags, and the width a reader chose is kept in this
     browser (GH-2723); the navigator's default width is set at the top,
     ahead of the narrow windows' own. */
  @media screen and (min-width: 769px) {
    .sidebar { width: var(--nav-width); }
    .sidebar-toggle { width: calc(var(--nav-width) - 16px); }
    .content { left: var(--nav-width); }
    body.close .sidebar { transform: translateX(calc(-1 * var(--nav-width))); }
    body.close .sidebar-toggle { width: auto; }
    body.close .content { left: 0; }
    body.close .nav-resizer { display: none; }
  }
  @media screen and (min-width: 520px) {
    .nav-resizer { position: fixed; top: 0; bottom: 0; left: calc(var(--nav-width) - 4px); width: 8px; cursor: col-resize; z-index: 25; touch-action: none; }
    .nav-resizer::after { content: ""; position: absolute; top: 0; bottom: 0; left: 3px; width: 2px; background: transparent; transition: background .15s; }
    .nav-resizer:hover::after, .nav-resizer:focus-visible::after, body.nav-resizing .nav-resizer::after { background: var(--theme-color); }
    .nav-resizer:focus { outline: none; }
    body.nav-resizing, body.nav-resizing * { cursor: col-resize !important; user-select: none; }
    body.nav-resizing .sidebar, body.nav-resizing .content { transition: none; }
    body.nav-resizing iframe { pointer-events: none; }
  }
  @media screen and (max-width: 519px) { .nav-resizer { display: none; } }
  /* Each planning level has one colour, the interactive timeline's, on
     every page: a labelled chip on the plan and the pages, a letter in
     the navigator (GH-2723). */
  .kind, .kb { display: inline-block; border: 1px solid; border-radius: 999px; font-weight: 600; line-height: 1.5; white-space: nowrap; vertical-align: middle; }
  .kind { font-size: 11px; padding: 0 8px; text-transform: uppercase; letter-spacing: .04em; }
  .kb { font-size: 10px; width: 1.7em; text-align: center; margin-right: 4px; line-height: 1.6; }
  .kind-theme, .kb-theme { background: #ede9fe; border-color: #c4b5fd; color: #6d28d9; }
  .kind-initiative, .kb-initiative { background: #dbeafe; border-color: #93c5fd; color: #1d4ed8; }
  .kind-epic, .kb-epic { background: #ccfbf1; border-color: #5eead4; color: #0f766e; }
  .kind-feature, .kb-feature { background: #fef3c7; border-color: #fcd34d; color: #b45309; }
  .kind-story, .kb-story { background: #dcfce7; border-color: #86efac; color: #15803d; }
  .markdown-section .crumbs { font-size: 13px; color: #6b7280; margin-bottom: 6px; }
  .markdown-section .crumbs p { margin: 0; }
  .markdown-section .crumbs .kind { font-size: 10px; padding: 0 6px; }
  /* The plan as boards (GH-2723): a band per theme, a tab per initiative,
     a kanban board of its epics by state. */
  .markdown-section:has(.band) { max-width: 90em; }
  .markdown-section a.card-title, .markdown-section a.band-title { text-decoration: none; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 18px; margin: 0 0 1.4em; font-size: 13px; color: #4b5563; }
  .legend-item { display: inline-flex; align-items: center; gap: 6px; }
  .band { margin: 0 0 1.6em; border-radius: 10px; background: #faf8ff; border: 1px solid #e9e3fb; border-left: 6px solid #a78bfa; padding: 12px 14px 14px; }
  .band-none { background: #f9fafb; border-color: #e5e7eb; border-left-color: #d1d5db; }
  .band-head, .panel-head { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; margin-bottom: 12px; }
  .markdown-section .band-title { font-size: 1.25em; font-weight: 700; color: #1f2937; }
  .band-meta { font-size: 13px; color: #6b7280; }
  .band-head .bar, .panel-head .bar { flex: 0 0 100%; max-width: 360px; }
  .card-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .card-state { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: #6b7280; }
  .state-active .card-state, .state-active > .card-head .card-state { color: var(--theme-color); }
  .state-done .card-state, .state-done > .card-head .card-state { color: #16a34a; }
  .markdown-section a.card-title { font-weight: 600; font-size: 1.05em; color: #111827; line-height: 1.35; }
  .card-meta { font-size: 12.5px; color: #6b7280; }
  .card-meta:empty { display: none; }
  .bar { display: block; height: 6px; background: #e5e7eb; border-radius: 3px; overflow: hidden; }
  .bar > span { display: block; height: 100%; background: var(--theme-color); }
  .state-done .bar > span { background: #16a34a; }
  /* A theme's initiatives as tabs: the shell builds the strip from the
     panels, so without it, and on the forge, the panels follow each other. */
  .tab-strip { display: flex; gap: 2px; overflow-x: auto; border-bottom: 1px solid #e5e7eb; }
  .tab-strip button { appearance: none; display: flex; align-items: center; gap: 6px; max-width: 320px; padding: 8px 14px; border: 1px solid transparent;
    border-bottom: 0; border-radius: 8px 8px 0 0; background: transparent; font: inherit; font-size: 13px; color: #4b5563; cursor: pointer; white-space: nowrap; }
  .tab-strip button:hover { color: #111827; background: rgba(255,255,255,.6); }
  .tab-strip button[aria-selected="true"] { background: #fff; border-color: #e5e7eb; color: #111827; font-weight: 600; margin-bottom: -1px; box-shadow: inset 0 3px 0 #60a5fa; }
  .tab-strip button:focus-visible { outline: 2px solid var(--theme-color); outline-offset: -2px; }
  .tab-title { overflow: hidden; text-overflow: ellipsis; }
  .tab-dot { flex: none; width: 8px; height: 8px; border-radius: 50%; background: #9ca3af; }
  .tab-dot.state-active { background: var(--theme-color); }
  .tab-dot.state-done { background: #16a34a; }
  .tab-points { font-size: 11px; font-weight: 400; color: #6b7280; }
  .tab-panel { background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; padding: 12px; }
  .tabbed:not(.has-tabs) .tab-panel + .tab-panel { margin-top: 12px; }
  .tabbed.has-tabs .tab-panel { border-top: 0; border-radius: 0 0 8px 8px; }
  .tab-panel[hidden] { display: none; }
  /* The board: a column per state, the page growing with the cards rather
     than scrolling inside a column. */
  .tab-panel, .band-none { container-type: inline-size; }
  .board { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 10px; }
  .column { display: flex; flex-direction: column; gap: 8px; min-height: 64px; padding: 8px; border-radius: 8px; background: #f3f4f6; }
  .column-head { display: flex; align-items: center; justify-content: space-between; padding: 2px 4px; font-size: 12px; font-weight: 700;
    text-transform: uppercase; letter-spacing: .05em; color: #4b5563; }
  .column-active .column-head { color: var(--theme-color); }
  .column-done .column-head { color: #16a34a; }
  .column-count { padding: 0 8px; border-radius: 999px; background: #e5e7eb; font-size: 11px; color: #374151; }
  .board-empty { margin: 4px 0; font-size: 13px; color: #6b7280; }
  .markdown-section a.subcard { display: flex; flex-direction: column; gap: 4px; padding: 8px 10px; border-radius: 6px; border: 1px solid #e5e7eb;
    border-left: 4px solid #d1d5db; background: #fff; color: inherit; text-decoration: none; box-shadow: 0 1px 2px rgba(0,0,0,.05); }
  .markdown-section a.subcard:hover, .markdown-section a.card-title:hover, .markdown-section a.band-title:hover { color: var(--theme-color); }
  .markdown-section a.subcard:hover { border-color: var(--theme-color); }
  .markdown-section a.subcard-initiative { border-left-color: #60a5fa; }
  .markdown-section a.subcard-epic { border-left-color: #2dd4bf; }
  .markdown-section a.subcard-feature { border-left-color: #fbbf24; }
  .markdown-section a.subcard-story { border-left-color: #4ade80; }
  .subcard-title { font-weight: 600; color: #1f2937; }
  .subcard .kind { font-size: 10px; padding: 0 6px; }
  @container (max-width: 520px) { .board { grid-auto-flow: row; } }
</style>
</head>
<body>
<div id="app">Loading the program site…</div>
<script>
  // Links to files Docsify cannot render open as the files they are: the
  // interactive timeline (.html) and the JSON facts leave the hash router.
  // The overview's tiles and the plan's cards are HTML, which Docsify does
  // not route: their .md links, relative to the page as the forge reads
  // them, become app routes from the page's folder (GH-128, GH-2723).
  function plainLinks(route) {
    var folder = (route || "/").replace(/[^\/]*$/, "");
    document.querySelectorAll(".markdown-section a.tile, .markdown-section a.subcard, .markdown-section a.card-title, .markdown-section a.band-title").forEach(function (a) {
      var href = a.getAttribute("href") || "";
      if (/\.md$/.test(href) && !/^(#|\/|https?:)/.test(href)) {
        var path = new URL(href, "http://site" + folder).pathname;
        a.setAttribute("href", "#" + path.replace(/\.md$/, ""));
      }
    });
    document.querySelectorAll('a[href*="#/"]').forEach(function (a) {
      var path = a.getAttribute("href").split("#/")[1] || "";
      path = path.split("?")[0];
      if (/\.(html|json|css|js|txt)$/.test(path)) {
        a.setAttribute("href", path.replace(/^\//, ""));
        a.removeAttribute("data-link");
        if (/\.html$/.test(path)) a.setAttribute("target", "_blank");
      }
    });
  }
  // A theme's panels become tabs, one per initiative, with the state and
  // points on each; the tab a reader chose is kept in this browser, and the
  // arrow keys move between them (GH-2723).
  function buildTabs() {
    document.querySelectorAll(".markdown-section .tabbed").forEach(function (box) {
      if (box.classList.contains("has-tabs")) return;
      var panels = [].slice.call(box.querySelectorAll(":scope > .tab-panel"));
      if (!panels.length) return;
      var name = box.getAttribute("data-tabs") || "tabs", key = "site-tab:" + name;
      var strip = document.createElement("div");
      strip.className = "tab-strip";
      strip.setAttribute("role", "tablist");
      var buttons = panels.map(function (p, i) {
        var b = document.createElement("button"), state = p.getAttribute("data-state") || "", points = p.getAttribute("data-points") || "";
        b.type = "button";
        b.id = "tab-" + name + "-" + i;
        p.id = "panel-" + name + "-" + i;
        b.setAttribute("role", "tab");
        b.setAttribute("aria-controls", p.id);
        p.setAttribute("role", "tabpanel");
        p.setAttribute("aria-labelledby", b.id);
        b.title = [p.getAttribute("data-tab"), state, points].filter(Boolean).join(" · ");
        var dot = document.createElement("span");
        dot.className = "tab-dot state-" + state.replace(/[^a-z0-9]+/gi, "-").toLowerCase();
        var title = document.createElement("span");
        title.className = "tab-title";
        title.textContent = p.getAttribute("data-tab");
        b.appendChild(dot);
        b.appendChild(title);
        if (points) {
          var pts = document.createElement("span");
          pts.className = "tab-points";
          pts.textContent = points;
          b.appendChild(pts);
        }
        b.addEventListener("click", function () { select(i, true); });
        strip.appendChild(b);
        return b;
      });
      function select(i, keep) {
        buttons.forEach(function (b, j) {
          b.setAttribute("aria-selected", String(i === j));
          b.tabIndex = i === j ? 0 : -1;
          panels[j].hidden = i !== j;
        });
        if (keep) { try { localStorage.setItem(key, String(i)); } catch (e) {} }
      }
      strip.addEventListener("keydown", function (e) {
        var i = buttons.indexOf(document.activeElement), n = buttons.length;
        if (i < 0) return;
        var to = e.key === "ArrowRight" ? (i + 1) % n : e.key === "ArrowLeft" ? (i - 1 + n) % n : e.key === "Home" ? 0 : e.key === "End" ? n - 1 : -1;
        if (to < 0) return;
        e.preventDefault();
        select(to, true);
        buttons[to].focus();
      });
      box.insertBefore(strip, box.firstChild);
      box.classList.add("has-tabs");
      var chosen = 0;
      try { chosen = Number(localStorage.getItem(key) || 0); } catch (e) {}
      select(chosen >= 0 && chosen < panels.length ? chosen : 0, false);
    });
  }
  // The navigator's nested lists fold into a tree: top-level sections open,
  // deeper branches folded, the branch holding the current page open, and
  // what a reader opened or closed kept across routes (GH-131).
  var openBranches = {};
  function branchKey(li) {
    var a = li.querySelector(":scope > a");
    return a ? a.getAttribute("href") : (li.firstChild && li.firstChild.textContent || "").trim();
  }
  function foldTree() {
    var nav = document.querySelector(".sidebar-nav");
    if (!nav) return;
    nav.querySelectorAll("li").forEach(function (li) {
      var kids = li.querySelector(":scope > ul");
      if (!kids || li.classList.contains("branch")) return;
      li.classList.add("branch");
      var depth = 0;
      for (var p = li.parentElement; p && p !== nav; p = p.parentElement) if (p.tagName === "UL") depth++;
      var key = branchKey(li);
      var open = key in openBranches ? openBranches[key] : depth <= 1;
      li.classList.toggle("folded", !open);
      var t = document.createElement("span");
      t.className = "twisty";
      t.textContent = open ? "▾" : "▸";
      t.addEventListener("click", function (e) {
        e.preventDefault(); e.stopPropagation();
        var folded = li.classList.toggle("folded");
        t.textContent = folded ? "▸" : "▾";
        openBranches[key] = !folded;
      });
      li.insertBefore(t, li.firstChild);
    });
    var active = nav.querySelector("li.active");
    for (var li = active; li && li !== nav; li = li.parentElement) {
      if (li.classList && li.classList.contains("branch") && li !== active) {
        li.classList.remove("folded");
        var t = li.querySelector(":scope > .twisty");
        if (t) t.textContent = "▾";
      }
    }
  }
  // An embedded timeline says how tall it is after each draw; its frame
  // takes that height, so the chart scrolls with the page, not inside its
  // frame (GH-136).
  window.addEventListener("message", function (e) {
    if (!e.data || typeof e.data.timelineHeight !== "number") return;
    document.querySelectorAll("iframe.timeline").forEach(function (f) {
      if (f.contentWindow === e.source) f.style.height = Math.max(200, Math.ceil(e.data.timelineHeight) + 4) + "px";
    });
  });
  function escapeHTML(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  // A private Pages site's sign-in session lapses while the app stays
  // open. A whole reload renews it through the sign-in and returns to this
  // route; a minute's guard keeps it from looping (GH-139).
  function renewSession() {
    if (!/^https?:$/.test(location.protocol)) return;
    var last = 0;
    try { last = Number(sessionStorage.getItem("site-renewed") || 0); } catch (e) {}
    if (Date.now() - last < 60000) return;
    try { sessionStorage.setItem("site-renewed", String(Date.now())); } catch (e) {}
    location.reload();
  }
  // Docsify keeps the pages it fetched, so a page read before the session
  // lapsed renders again without asking the server, while its embedded
  // timeline is fetched anew and lands on the sign-in, which refuses to be
  // framed. A frame that loads anything but the timeline renews the
  // session (GH-2723).
  function watchFrames() {
    document.querySelectorAll("iframe.timeline").forEach(function (f) {
      if (f.getAttribute("data-watched")) return;
      f.setAttribute("data-watched", "1");
      f.addEventListener("load", function () {
        var ok = false;
        try { ok = !!(f.contentDocument && f.contentDocument.getElementById("plot")); } catch (e) {}
        if (!ok) renewSession();
      });
    });
  }
  window.$docsify = {
    name: "Program site",
    homepage: "overview.md",
    relativePath: true,
    auto2top: true,
    // The navigator is the plan's tree; a page's own headings would
    // nest under it as noise (GH-131).
    loadSidebar: true,
    subMaxLevel: 0,
    alias: {
      "/.*/_sidebar.md": "/_sidebar.md",
      "/(.*)/$": "/$1/index"
    },
    // Every page the navigator links is searched: every story among them.
    search: { paths: "auto", depth: 3, placeholder: "Search the site" },
    markdown: {
      renderer: {
        code: function (code, lang) {
          if (lang === "mermaid") {
            return '<pre class="mermaid">' + escapeHTML(code) + "</pre>";
          }
          return this.origin.code.apply(this, arguments);
        }
      }
    },
    plugins: [
      // Once the session lapses, every page the app fetches is redirected
      // to GitLab's sign-in, which a background fetch cannot follow, and
      // comes back 404. A 404 whose request redirects is that, not a
      // missing page, and renews the session (GH-139).
      function (hook, vm) {
        hook.afterEach(function (html, next) {
          if (/404 - Not found/.test(html) && window.fetch && vm.route && vm.route.file) {
            fetch(vm.route.file, { redirect: "manual", cache: "no-store" }).then(function (r) {
              if (r.type === "opaqueredirect") renewSession();
            }).catch(function () {});
          }
          next(html);
        });
      },
      function (hook, vm) {
        hook.doneEach(function () {
          plainLinks(vm.route && vm.route.path);
          watchFrames();
          buildTabs();
          foldTree();
          if (window.mermaid) {
            window.mermaid.run({ querySelector: ".mermaid" });
          }
        });
      }
    ]
  };
</script>
<script src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/docsify.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/plugins/search.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.min.js"></script>
<script>
  if (window.mermaid) {
    window.mermaid.initialize({ startOnLoad: false, securityLevel: "strict" });
  }
  // The divider between the navigator and the page: drag it, move it with
  // the arrow keys when it has focus, or double-click it to reset to the
  // window's own width; the width is kept in this browser (GH-2723).
  (function () {
    var KEY = "site-nav-width", MIN = 180, root = document.documentElement;
    function widest() { return Math.max(MIN, Math.min(640, Math.round(window.innerWidth * 0.6))); }
    function current() { return parseFloat(getComputedStyle(root).getPropertyValue("--nav-width")) || 300; }
    function apply(w) {
      w = Math.min(widest(), Math.max(MIN, Math.round(w)));
      root.style.setProperty("--nav-width", w + "px");
      handle.setAttribute("aria-valuenow", String(w));
      return w;
    }
    function keep(w) { try { localStorage.setItem(KEY, String(w)); } catch (e) {} }
    var handle = document.createElement("div");
    handle.className = "nav-resizer";
    handle.tabIndex = 0;
    handle.title = "Drag to resize the navigator; double-click to reset";
    handle.setAttribute("role", "separator");
    handle.setAttribute("aria-orientation", "vertical");
    handle.setAttribute("aria-label", "Resize the navigator");
    handle.setAttribute("aria-valuemin", String(MIN));
    handle.setAttribute("aria-valuemax", String(widest()));
    try { var saved = Number(localStorage.getItem(KEY)); if (saved) apply(saved); } catch (e) {}
    var dragging = false;
    handle.addEventListener("pointerdown", function (e) {
      if (e.button !== 0) return;
      e.preventDefault();
      dragging = true;
      handle.setPointerCapture(e.pointerId);
      document.body.classList.add("nav-resizing");
    });
    handle.addEventListener("pointermove", function (e) { if (dragging) apply(e.clientX); });
    function stop() {
      if (!dragging) return;
      dragging = false;
      document.body.classList.remove("nav-resizing");
      keep(current());
    }
    handle.addEventListener("pointerup", stop);
    handle.addEventListener("pointercancel", stop);
    handle.addEventListener("dblclick", function () {
      root.style.removeProperty("--nav-width");
      try { localStorage.removeItem(KEY); } catch (e) {}
      handle.setAttribute("aria-valuenow", String(current()));
    });
    handle.addEventListener("keydown", function (e) {
      var step = e.shiftKey ? 64 : 16, w = null;
      if (e.key === "ArrowLeft") w = current() - step;
      else if (e.key === "ArrowRight") w = current() + step;
      else if (e.key === "Home") w = MIN;
      else if (e.key === "End") w = widest();
      if (w === null) return;
      e.preventDefault();
      keep(apply(w));
    });
    window.addEventListener("resize", function () {
      handle.setAttribute("aria-valuemax", String(widest()));
      if (root.style.getPropertyValue("--nav-width")) apply(current());
    });
    document.body.appendChild(handle);
  })();
</script>
