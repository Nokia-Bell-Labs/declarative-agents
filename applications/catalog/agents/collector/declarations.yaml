tools:
  - name: launch_collector_control
    type: builtin
    init: rest_server_launch
    category: boundary
    visibility: internal
    emits: [ServerLaunched, CommandError]
    description: Launch collector lifecycle control routes.
    problem: Persistent intake needs health and graceful exit outside OTLP handlers.
    goals: [Bind trusted control routes, Keep lifecycle routing in MachineSpec]
    requirements:
      input: [Trusted config names collector_control]
      output: [Reports bound server identity]
      errors: [Bind and config faults emit CommandError]
    non_goals: [Does not execute lifecycle behavior in HTTP handlers]
    parameters: {type: object, properties: {}}
    output:
      description: REST launch result.
      schema: {type: object}
    side_effects:
      - {kind: network_listen, target: collector_control, state: listener_started}
    reversibility: {classification: compensatable}
    undo: {strategy: compensating_action, description: Stop the owned control listener.}
    errors:
      - {signal: CommandError, condition: config or bind failure, state_after_failure: no new control listener remains}
    relationships: {before: [await_collector_control]}
    config: {rest_ref: collector_control}

  - name: launch_collector_monitor
    type: builtin
    init: rest_server_launch
    category: boundary
    visibility: internal
    emits: [ServerLaunched, CommandError]
    description: Launch collector monitor snapshot and stream routes.
    problem: Operators need bounded collector state without exposing raw span payloads.
    goals: [Expose standard monitor views, Keep monitor reads side-effect free]
    requirements:
      input: [Trusted config names collector_monitor]
      output: [Reports bound server identity]
      errors: [Bind and config faults emit CommandError]
    non_goals: [Does not expose queued span payloads]
    parameters: {type: object, properties: {}}
    output: {description: REST launch result, schema: {type: object}}
    side_effects:
      - {kind: network_listen, target: collector_monitor, state: listener_started}
    reversibility: {classification: compensatable}
    undo: {strategy: compensating_action, description: Stop the owned monitor listener.}
    errors:
      - {signal: CommandError, condition: config or bind failure, state_after_failure: no new monitor listener remains}
    relationships: {before: [await_collector_control]}
    config: {rest_ref: collector_monitor}

  - name: launch_collector_query
    type: builtin
    init: rest_server_launch
    category: boundary
    visibility: internal
    emits: [ServerLaunched, CommandError]
    description: Launch collector query routes for bounded spool reads.
    problem: Trace reads need a dedicated surface separate from monitor and control.
    goals: [Bind query routes, Keep query reads side-effect free]
    requirements:
      input: [Trusted config names collector_query]
      output: [Reports bound server identity]
      errors: [Bind and config faults emit CommandError]
    non_goals: [Does not expose raw span payloads on the monitor surface]
    parameters: {type: object, properties: {}}
    output: {description: REST launch result, schema: {type: object}}
    side_effects:
      - {kind: network_listen, target: collector_query, state: listener_started}
    reversibility: {classification: compensatable}
    undo: {strategy: compensating_action, description: Stop the owned query listener.}
    errors:
      - {signal: CommandError, condition: config or bind failure, state_after_failure: no new query listener remains}
    relationships: {before: [await_collector_control], after: [launch_collector_monitor]}
    config: {rest_ref: collector_query}

  - name: stop_collector_query
    type: builtin
    init: rest_server_stop
    category: boundary
    visibility: internal
    emits: [ServerStopped, CommandError]
    description: Stop the collector query listener.
    problem: Clean terminal shutdown must release the query address.
    goals: [Release the owned query listener]
    requirements: {input: [Trusted query reference], output: [Reports stopped state], errors: [Stop faults emit CommandError]}
    non_goals: [Does not delete query history]
    parameters: {type: object, properties: {}}
    output: {description: REST stop result, schema: {type: object}}
    side_effects:
      - {kind: network_listener_shutdown, target: collector_query, state: listener_stopped}
    reversibility: {classification: compensatable}
    undo:
      strategy: server_shutdown_or_user_action_compensation
      description: The receipt records shutdown loss; MachineSpec must relaunch the trusted query definition.
      payload: boundary_compensation
      captures: [server, address, drained_events, dropped_events, relaunch_requirement]
    errors:
      - {signal: CommandError, condition: stop fails, state_after_failure: listener may be partially stopped}
    relationships: {after: [otlp_receiver_stop], before: [stop_collector_monitor]}
    config: {rest_ref: collector_query}

  - name: await_collector_control
    type: builtin
    init: rest_await_event
    category: boundary
    visibility: internal
    emits: [ExitRequested, AwaitTimedOut, ServerStopped, CommandError]
    description: Check control and monitor queues for lifecycle exit between intake waits.
    problem: A single-threaded machine must remain responsive to exit while awaiting trace traffic.
    goals: [Fan in both exit routes, Use a short bounded wait]
    requirements:
      input: [Trusted config names control sources]
      output: [Returns one selected lifecycle event]
      errors: [Stopped or absent sources remain distinct]
    non_goals: [Does not inspect monitor snapshots]
    parameters: {type: object, properties: {}}
    output: {description: Selected lifecycle event, schema: {type: object}}
    side_effects:
      - {kind: state_mutation, target: rest_server_queue, state: selected_event_consumed}
    reversibility: {classification: reversible}
    undo:
      strategy: queue_event_restore
      description: Restore the receipt-recorded event to the front of its source queue.
      payload: rest_await_event
      captures: [source, event]
    errors:
      - {signal: CommandError, condition: source lookup or queue read fails, state_after_failure: listeners remain unchanged}
    relationships: {after: [launch_collector_control, launch_collector_monitor]}
    config:
      sources:
        - {server: collector_control, routes: [exit], signals: [ExitRequested]}
      timeout: 100ms
      stopped_behavior: emit_server_stopped

  - name: filter_collector_batch
    type: builtin
    init: value_predicate
    category: word
    visibility: internal
    emits: [Satisfied, Unsatisfied, CommandError]
    description: Accept only a received batch whose span count is positive.
    problem: Empty transport batches must not create spool or relay evidence.
    goals: [Keep acceptance as a visible machine branch]
    requirements:
      input: [Read span_count from the preceding await result]
      output: [Report the declared comparison]
      errors: [A broken selector emits CommandError]
    non_goals: [Does not mutate or sample spans]
    parameters: {type: object, properties: {}}
    output: {description: Predicate result, schema: {type: object}}
    side_effects:
      - {kind: none, target: batch metadata, state: unchanged}
    reversibility: {classification: reversible}
    undo: {strategy: noop, description: Comparison changes nothing.}
    errors:
      - {signal: CommandError, condition: selector or coercion failure, state_after_failure: no branch outcome is emitted}
    relationships: {after: [await_spans], before: [spool_collector_spans]}
    config:
      left: $.span_count
      op: gt
      right: "0"
      operand_type: number
      satisfied: Satisfied
      unsatisfied: Unsatisfied

  - name: spool_collector_spans
    type: builtin
    init: spool_spans
    category: boundary
    visibility: internal
    emits: [SpansSpooled, CommandError]
    description: Spool the last accepted batch before any relay.
    problem: Live relay is not deterministic retained evidence.
    goals: [Write complete NDJSON lines, Preserve the batch for relay]
    requirements:
      input: [Select the labeled await batch from command state]
      output: [Report path counts bytes and unchanged batch]
      errors: [Selection append rotation and sync failures emit CommandError]
    non_goals: [Does not relay spans]
    parameters: {type: object, properties: {}}
    output: {description: Spool result and batch, schema: {type: object}}
    side_effects:
      - {kind: filesystem_write, target: collector trace spool, state: durable_lines_appended}
    reversibility: {classification: irreversible, requires_confirmation: true}
    undo: {strategy: irreversible, description: Audit evidence remains retained and cannot be removed safely after rotation.}
    errors:
      - {signal: CommandError, condition: selection or filesystem failure, state_after_failure: command-state source remains}
    relationships: {after: [filter_collector_batch], before: [decide_collector_relay]}
    config:
      path: ${COLLECTOR_SPOOL_PATH:-traces/collector.ndjson}
      batch_source: $from(received_batch).batch
      max_bytes: 10485760
      max_files: 3

  - name: await_collector_metrics
    type: builtin
    init: await_metrics
    category: boundary
    visibility: internal
    emits: [MetricsReceived, AwaitTimedOut, ReceiverStopped, CommandError]
    description: Wait a short bounded interval for one metric batch between trace intake cycles.
    problem: A single-threaded machine must drain buffered metrics without blocking trace intake or lifecycle response.
    goals: [Return one complete metric batch or a distinct timeout, Keep the poll bounded]
    requirements:
      input: [Receiver name and a short timeout come from trusted config]
      output: [Returns one metric batch plus data-point and metric-name metadata]
      errors: [Receiver stop and cancellation remain distinct signals]
    non_goals: [Does not spool, mutate, or relay metrics]
    parameters: {type: object, properties: {}}
    output: {description: Metric batch and bounded metadata, schema: {type: object}}
    side_effects:
      - {kind: state_mutation, target: receiver metric queue, state: consumes one FIFO metric batch}
    reversibility: {classification: irreversible, requires_confirmation: true}
    undo: {strategy: irreversible, description: A consumed concurrent queue item cannot be restored in original order.}
    errors:
      - {signal: CommandError, condition: receiver is absent or the wait is canceled, state_after_failure: no metric batch is returned}
    relationships: {after: [await_collector_control], before: [spool_collector_metrics]}
    config:
      receiver: ingress
      timeout: 500ms

  - name: spool_collector_metrics
    type: builtin
    init: spool_metrics
    category: boundary
    visibility: internal
    emits: [MetricsSpooled, CommandError]
    description: Spool the last accepted metric batch as NDJSON metric records to a separate file.
    problem: Metric evidence must be retained deterministically without a Prometheus backend.
    goals: [Write one NDJSON record per metric, Keep the metric spool separate from the trace spool]
    requirements:
      input: [Select the labeled metric await batch from command state]
      output: [Report path, metric count, data-point count, bytes, and the unchanged batch]
      errors: [Selection, append, rotation, and sync failures emit CommandError]
    non_goals: [Does not relay metrics or touch the trace spool]
    parameters: {type: object, properties: {}}
    output: {description: Metric spool result and batch, schema: {type: object}}
    side_effects:
      - {kind: filesystem_write, target: collector metric spool, state: durable_lines_appended}
    reversibility: {classification: irreversible, requires_confirmation: true}
    undo: {strategy: irreversible, description: Audit evidence remains retained and cannot be removed safely after rotation.}
    errors:
      - {signal: CommandError, condition: selection or filesystem failure, state_after_failure: command-state source remains}
    relationships: {after: [await_collector_metrics]}
    config:
      path: ${COLLECTOR_METRICS_SPOOL_PATH:-metrics/collector.ndjson}
      batch_source: $from(received_metrics).batch
      max_bytes: 10485760
      max_files: 3

  - name: decide_collector_relay
    type: builtin
    init: value_predicate
    category: word
    visibility: internal
    emits: [Satisfied, Unsatisfied, CommandError]
    description: Branch to relay only when the declared collector mode is relay.
    problem: Spool and relay modes must share one profile without hiding the branch in Go.
    goals: [Keep mode selection visible]
    requirements:
      input: [Compare the deployment-expanded mode literal]
      output: [Report the comparison]
      errors: [Malformed config emits CommandError]
    non_goals: [Does not inspect or mutate spans]
    parameters: {type: object, properties: {}}
    output: {description: Mode predicate result, schema: {type: object}}
    side_effects:
      - {kind: none, target: mode literal, state: unchanged}
    reversibility: {classification: reversible}
    undo: {strategy: noop, description: Comparison changes nothing.}
    errors:
      - {signal: CommandError, condition: malformed mode predicate, state_after_failure: relay is not invoked}
    relationships: {after: [spool_collector_spans], before: [relay_collector_spans]}
    config:
      left: ${COLLECTOR_MODE:-spool}
      op: eq
      right: relay
      operand_type: string
      satisfied: Satisfied
      unsatisfied: Unsatisfied

  - name: relay_collector_spans
    type: builtin
    init: relay_spans
    category: boundary
    visibility: internal
    emits: [SpansRelayed, CommandError]
    description: Relay the labeled spooled batch unchanged to a configured OTLP endpoint.
    problem: Persistent trace query needs accepted batches upstream after local evidence.
    goals: [Preserve protobuf identity, Fail on any partial rejection]
    requirements:
      input: [Select the labeled spool batch and trusted endpoint]
      output: [Report endpoint and completely accepted span count]
      errors: [Connection timeout RPC and rejection emit CommandError]
    non_goals: [Does not retry or retract spans]
    parameters: {type: object, properties: {}}
    output:
      description: Completely accepted relay endpoint and span count.
      schema:
        type: object
        properties: {endpoint: {type: string}, span_count: {type: integer}}
        required: [endpoint, span_count]
    side_effects:
      - {kind: external_api, target: OTLP collector endpoint, state: spans_may_be_retained}
    reversibility: {classification: irreversible, requires_confirmation: true}
    undo: {strategy: irreversible, description: OTLP cannot retract accepted spans.}
    errors:
      - {signal: CommandError, condition: selection transport or rejection failure, state_after_failure: spool evidence remains}
    relationships: {after: [spool_collector_spans]}
    config:
      endpoint: ${COLLECTOR_RELAY_ENDPOINT:-}
      receiver_address: ${COLLECTOR_RECEIVER_ADDRESS:-0.0.0.0:4317}
      batch_source: $from(spooled_batch).batch
      timeout: 10s

  - name: stop_collector_monitor
    type: builtin
    init: rest_server_stop
    category: boundary
    visibility: internal
    emits: [ServerStopped, CommandError]
    description: Stop the collector monitor listener.
    problem: Clean terminal shutdown must release the monitor address.
    goals: [Release the owned monitor listener]
    requirements: {input: [Trusted monitor reference], output: [Reports stopped state], errors: [Stop faults emit CommandError]}
    non_goals: [Does not delete monitor history]
    parameters: {type: object, properties: {}}
    output: {description: REST stop result, schema: {type: object}}
    side_effects:
      - {kind: network_listener_shutdown, target: collector_monitor, state: listener_stopped}
    reversibility: {classification: compensatable}
    undo:
      strategy: server_shutdown_or_user_action_compensation
      description: The receipt records shutdown loss; MachineSpec must relaunch the trusted monitor definition.
      payload: boundary_compensation
      captures: [server, address, drained_events, dropped_events, relaunch_requirement]
    errors:
      - {signal: CommandError, condition: stop fails, state_after_failure: listener may be partially stopped}
    relationships: {before: [stop_collector_control]}
    config: {rest_ref: collector_monitor}

  - name: stop_collector_control
    type: builtin
    init: rest_server_stop
    category: boundary
    visibility: internal
    emits: [ServerStopped, CommandError]
    description: Stop the collector control listener.
    problem: Clean terminal shutdown must release the control address.
    goals: [Release the owned control listener]
    requirements: {input: [Trusted control reference], output: [Reports stopped state], errors: [Stop faults emit CommandError]}
    non_goals: [Does not relaunch control]
    parameters: {type: object, properties: {}}
    output: {description: REST stop result, schema: {type: object}}
    side_effects:
      - {kind: network_listener_shutdown, target: collector_control, state: listener_stopped}
    reversibility: {classification: compensatable}
    undo:
      strategy: server_shutdown_or_user_action_compensation
      description: The receipt records shutdown loss; MachineSpec must relaunch the trusted control definition.
      payload: boundary_compensation
      captures: [server, address, drained_events, dropped_events, relaunch_requirement]
    errors:
      - {signal: CommandError, condition: stop fails, state_after_failure: listener may be partially stopped}
    relationships: {after: [stop_collector_monitor]}
    config: {rest_ref: collector_control}
