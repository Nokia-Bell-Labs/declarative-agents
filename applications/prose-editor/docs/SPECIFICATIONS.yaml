id: prose-editor-specifications
title: Prose Editor Specification Index

overview: |
  This index covers four Prose Editor releases. Release 00.0 is a
  documentation baseline: six specified SRDs, one planned full-scenario use
  case, and one 30-case planned test suite with reciprocal traces across all
  195 requirement items and 64 acceptance criteria. Release 00.1 stages the
  tracer-bullet saga skeleton: one tracer use case and one 13-case tracer
  test suite covering the orchestrator, structure stage, critic without
  Pangram, local finalization, and the shared telemetry contract. Release
  00.2 completes the remaining voice, style, Pangram, multi-stage retry, and
  publication paths. Release 00.3 packages and deploys the completed
  application: two planned SRDs for the role-closure package, Helm topology
  with the canonical collector and its served trace UI, and standalone
  declarative applier, with one applier use case and one eight-case applier
  test suite.

  Shared application and agent-core requirements remain external references.
  Local SRDs cite them and define only Prose Editor behavior and stricter
  authority boundaries.

