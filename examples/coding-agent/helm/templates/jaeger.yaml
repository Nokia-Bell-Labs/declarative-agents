{{- if .Values.jaeger.enabled }}
{{- $fullname := include "coding-agent.fullname" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-jaeger
  labels:
    {{- include "coding-agent.labels" . | nindent 4 }}
    app.kubernetes.io/component: jaeger
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "coding-agent.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: jaeger
  template:
    metadata:
      labels:
        {{- include "coding-agent.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: jaeger
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: jaeger
          image: "{{ .Values.jaeger.image.repository }}:{{ .Values.jaeger.image.tag }}"
          imagePullPolicy: {{ .Values.jaeger.image.pullPolicy }}
          env:
            - {name: COLLECTOR_OTLP_ENABLED, value: "true"}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - {name: otlp-grpc, containerPort: {{ .Values.jaeger.otlpGRPCPort }}}
            - {name: query, containerPort: {{ .Values.jaeger.queryPort }}}
          readinessProbe:
            httpGet: {path: /, port: query}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.jaeger.resources | nindent 12 }}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-jaeger
  labels:
    {{- include "coding-agent.labels" . | nindent 4 }}
    app.kubernetes.io/component: jaeger
spec:
  selector:
    {{- include "coding-agent.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: jaeger
  ports:
    - {name: otlp-grpc, port: {{ .Values.jaeger.otlpGRPCPort }}, targetPort: otlp-grpc}
    - {name: query, port: {{ .Values.jaeger.queryPort }}, targetPort: query}
{{- end }}
