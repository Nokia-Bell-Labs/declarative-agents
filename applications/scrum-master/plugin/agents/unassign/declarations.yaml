# The unassign machine's words (GH-2866). SCRUM_MASTER_PROJECT and SCRUM_MASTER_ISSUE name the issue.
unit: scrum-master-unassign-declarations
tools:
- name: issue_unassign
  type: exec
  binary: scrum-master
  args:
  - issue
  - unassign
  - --json
  - --project
  - ${SCRUM_MASTER_PROJECT}
  - --issue
  - ${SCRUM_MASTER_ISSUE}
  visibility: internal
  description: 'Give back an issue assigned to the caller (srd013 R10.2).'
  category: boundary
  signature:
    emits: [ToolDone, ToolFailed, CommandError]
  output:
    description: 'The unassign word''s JSON report: the issue, who it was assigned to, and what it did.'
    schema:
      type: string
  side_effects:
  - kind: external_api_call
    target: tracker
    description: 'Clears the issue''s assignee; a started issue on beads is ready again.'
  reversibility:
    classification: irreversible
    requires_confirmation: false
  undo:
    strategy: noop
    description: The word's write is a person's to reverse, by popping or assigning the issue again.
  errors:
  - signal: CommandError
    condition: the word cannot start — this agent does not serve the scrum-master words — or an environment variable is unset
    message_shape: 'issue_unassign: <error>'
    state_after_failure: nothing ran in a word that did not start
  - signal: ToolFailed
    condition: the word refuses and exits non-zero
    message_shape: <the word's reason, as printed>
    state_after_failure: the tracker is as the word's refusal left it
