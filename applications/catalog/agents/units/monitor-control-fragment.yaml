# The monitor REST trio -- launch the monitor server, await its control exit,
# stop it -- as one fragment. The profiles that serve monitor snapshots differ
# only in which profile the prose names and which control route the await
# consumes, so each instantiates this once, under the words' own names.
unit: catalog-monitor-control-fragment
params:
  - name: profile
    type: string
    description: The profile name the problem statements refer to.
  - name: route
    type: string
    enum: [control_exit, exit]
    default: exit
    description: The monitor server endpoint whose requests the await consumes.
tools:
  - name: launch_monitor_rest
    type: builtin
    init: rest_server_launch
    visibility: internal
    category: boundary
    description: Launch read-only REST endpoints for cached monitor state.
    parameters:
      type: object
      properties: {}
    signature:
      emits: [ServerLaunched, CommandError]
    output:
      description: Monitor REST server launch result.
      schema:
        type: object
        properties:
          server: {type: string}
          address: {type: string}
          route_count: {type: integer}
          bindings: {type: array}
    side_effects:
      - kind: network_listen
        target: monitor_rest_server
        state: listener_started
      - kind: state_mutation
        target: rest_server_state
        state: routes_registered
    reversibility:
      classification: compensatable
    undo:
      strategy: compensating_action
      description: Stop the REST server if the launch command owns the listener.
    errors:
      - signal: CommandError
        condition: Monitor REST server config, bind, route, or schema failure.
        state_after_failure: No monitor route is exposed.
    config:
      rest_ref: monitor
  - name: await_monitor_control
    type: builtin
    init: rest_await_event
    visibility: internal
    category: boundary
    description: Await the monitor REST control exit event.
    parameters:
      type: object
      properties: {}
    signature:
      emits: [ExitRequested, AwaitTimedOut, ServerStopped, CommandError]
    output:
      description: Selected monitor control event.
      schema:
        type: object
        properties:
          source: {type: string}
          route: {type: string}
          signal: {type: string}
          payload: {type: object}
          request_id: {type: string}
    side_effects:
      - kind: state_mutation
        target: rest_server_queue
        state: selected_event_consumed
    reversibility:
      classification: reversible
    undo:
      strategy: queue_event_restore
      description: Restore the receipt-recorded event to the front of its source queue.
      payload: rest_await_event
      captures: [source, event]
    errors:
      - signal: CommandError
        condition: Monitor control source is missing or stopped with command_error policy.
        state_after_failure: Monitor listener state is unchanged.
    config:
      sources:
        - server: monitor
          routes: [$param(route)]
          signals: [ExitRequested]
      timeout: 30s
      stopped_behavior: emit_server_stopped
  - name: stop_monitor_rest
    type: builtin
    init: rest_server_stop
    visibility: internal
    category: boundary
    description: Stop the owned monitor REST listener.
    parameters:
      type: object
      properties: {}
    signature:
      emits: [ServerStopped, CommandError]
    output:
      description: Monitor REST server stop result.
      schema:
        type: object
        properties:
          server: {type: string}
          address: {type: string}
          drained_events: {type: integer}
          dropped_events: {type: integer}
          status: {type: string}
    side_effects:
      - kind: network_listener_shutdown
        target: monitor_rest_server
        state: listener_stopped
      - kind: state_mutation
        target: rest_server_state
        state: server_stopped
    reversibility:
      classification: compensatable
    undo:
      strategy: server_shutdown_or_user_action_compensation
      description: The receipt records shutdown loss; MachineSpec must relaunch the trusted monitor definition.
      payload: boundary_compensation
      captures: [server, address, drained_events, dropped_events, relaunch_requirement]
    errors:
      - signal: CommandError
        condition: Monitor REST server is missing, shutdown times out, or cleanup fails.
        state_after_failure: Monitor listener state may be partially stopped.
    config:
      rest_ref: monitor
