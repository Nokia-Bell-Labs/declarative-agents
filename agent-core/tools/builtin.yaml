# Builtin tool declarations — Go-implemented tools.
# Contains reusable tool identity, init, parameters, emits, and visibility.
# Mode-specific config lives in per-mode override files (e.g.
# agents/planner/builtin.yaml, agents/critic/builtin.yaml).
# Pass via: agent --tools-declaration tools/builtin.yaml \
#                 --tools-declaration agents/<mode>/builtin.yaml

includes:
  - builtin/checkpoint-history.yaml
  - builtin/checkpoint-rollback.yaml
  - builtin/partition.yaml
  - builtin/select-subset.yaml
  - builtin/render-each.yaml
  - builtin/parse-structured.yaml
  # GH-1376: list_files has one source of truth in builtin/list-files.yaml; the
  # legacy inline copy that drifted from it (missing problem/goals/requirements/
  # errors/non_goals) was removed in favor of this include.
  - builtin/list-files.yaml
  - builtin/read.yaml
  - builtin/write.yaml
  - builtin/edit.yaml
  - builtin/find.yaml

tools:
  # --- file tools ---
  # list_files is declared once in builtin/list-files.yaml (see includes above).

  # --- LLM tools ---
  # invoke_llm is NOT declared here — it is defined per-agent via
  # --llm config files (e.g. agents/executor/llm/default.yaml).
  # Multiple LLM tools can be registered with different names/models.

  - name: parse_response
    type: builtin
    contract: legacy
    init: parse_response
    visibility: internal
    emits: [ToolDone, TaskCompleted, ParseFailed, CommandError]
    description: "Parse raw LLM output into a tool call or task-completed signal."
    output:
      description: "Parsed tool-request JSON or a plain completion summary."
      schema: {type: string}
    category: word
    side_effects:
      - kind: command_state
        description: "Parses the prior command output and may reset the parse retry counter after a non-ParseFailed result."
    reversibility:
      classification: reversible
      undo: "parse_retry_counter_restore"
    undo:
      strategy: parse_retry_counter_restore
      description: "Restores the parse retry counter snapshot captured before parsing."

  - name: report_parse_error
    type: builtin
    init: report_parse_error
    visibility: internal
    emits: [ToolDone, BudgetExhausted]
    description: "Report a parse error back to the LLM for correction."
    output:
      description: "Plain-text feedback requesting a corrected model response."
      schema: {type: string}
    category: word
    side_effects:
      - kind: command_state
        description: "Increments the parse retry counter and emits BudgetExhausted when the configured retry limit is reached."
    reversibility:
      classification: reversible
      undo: "parse_retry_counter_restore"
    undo:
      strategy: parse_retry_counter_restore
      description: "Restores the parse retry counter snapshot captured before reporting the parse error."

  - name: reset_history
    type: builtin
    init: reset_history
    visibility: internal
    emits: [ToolDone, CommandError]
    description: "Clear the conversation history and restart the LLM context."
    output:
      description: "The literal plain-text reset prompt."
      schema: {type: string}
    category: stateful_internal
    side_effects:
      - kind: state_mutation
        target: conversation_history
        state: reset_to_empty
        description: "Clears the in-memory LLM conversation history."
    reversibility:
      classification: reversible
      undo: "conversation_restore"
    undo:
      strategy: conversation_restore
      description: "Restore the conversation snapshot captured before clearing history."

  - name: nudge_reread
    type: builtin
    init: nudge_reread
    visibility: internal
    emits: [ToolDone]
    description: "Append a re-read instruction after file edits to prompt the model to verify changes."
    output:
      description: "Plain-text edit result followed by the reread instruction."
      schema: {type: string}
    category: word
    side_effects:
      - kind: none
        description: "Formats the previous edit result with a re-read instruction without mutating state."
    reversibility:
      classification: reversible
      undo: "noop"
    undo:
      strategy: noop
      description: "The nudge only changes the command output passed to the next transition."

  - name: done
    type: builtin
    init: done
    visibility: internal
    emits: [TaskCompleted]
    description: "Signal that the generation task is complete."
    category: word
    side_effects:
      - kind: none
        description: "Emits TaskCompleted and does not mutate state."
    reversibility:
      classification: reversible
      undo: "noop"
    undo:
      strategy: noop
      description: "Completion signaling has no effects to reverse."

  - name: suspend
    type: builtin
    init: suspend
    visibility: internal
    emits: [AwaitApproval, CommandError]
    description: "Suspend the run at an approval gate. The loop saves through the configured Checkpoint port when persistence is enabled."
    category: boundary
    config:
      label: approval
      reason: "awaiting approval"
      require_checkpoint: false
    side_effects:
      - kind: state_mutation
        target: lifecycle_checkpoint
        state: suspended
        description: "Requests suspension; the loop saves through the configured Checkpoint port when persistence is enabled."
      - kind: human_boundary
        target: operator_approval
        description: "Hands control to an operator approval decision before resume."
    reversibility:
      classification: compensatable
      undo: "resume_with_rejected_or_rollback_checkpoint"
    undo:
      strategy: compensating_action
      description: "Resume with an explicit approval/rejection signal or roll back to an earlier checkpoint."
      payload: boundary_compensation
      captures: [reason, checkpoint_required]

  # --- pipeline/planner tools ---
  - name: extract_task
    type: builtin
    init: extract_task
    description: "Extract the next unblocked task from the dependency graph."
    visibility: internal
    emits: [TaskExtracted, NoTask, CommandError]
    category: stateful_internal
    side_effects:
      - kind: state_mutation
        target: pipeline_state
        state: current_task_selected
        description: "Updates the current task cursor and graph task status."
    reversibility:
      classification: reversible
      undo: "pipeline_state_restore"
    undo:
      strategy: session_state_restore
      description: "Restore the pipeline state snapshot captured before extraction."

  - name: select_all_ready
    type: builtin
    init: select_all_ready
    description: "Select all ready requirements as one pass-through task."
    visibility: internal
    emits: [ReadySelected, NoTask, CommandError]
    category: stateful_internal
    side_effects:
      - kind: state_mutation
        target: pipeline_state
        state: passthrough_task_selected
        description: "Updates only the current task to represent all ready requirements."
    reversibility:
      classification: reversible
      undo: "pipeline_state_restore"
    undo:
      strategy: session_state_restore
      description: "Restore the pipeline state snapshot captured before selection."

  - name: seed_passthrough_plan
    type: builtin
    init: seed_passthrough_plan
    description: "Seed profile-configured pass-through plan text."
    visibility: internal
    emits: [PassThroughPlanSeeded, CommandError]
    category: stateful_internal
    config:
      title: "Execute all ready requirements"
      summary: "Pass-through execution for the selected ready graph nodes."
    side_effects:
      - kind: state_mutation
        target: pipeline_state
        state: current_plan_seeded
        description: "Sets only the current implementation plan."
    reversibility: {classification: reversible, undo: "pipeline_state_restore"}
    undo: {strategy: session_state_restore, description: "Restore the prior pipeline state."}

  - name: mark_nodes_planning
    type: builtin
    init: mark_nodes_planning
    description: "Advance only selected task nodes to Planning."
    visibility: internal
    emits: [NodesMarkedPlanning, CommandError]
    category: stateful_internal
    side_effects:
      - kind: state_mutation
        target: requirement_graph
        state: selected_nodes_planning
        description: "Advances selected current-task nodes to Planning."
    reversibility: {classification: reversible, undo: "pipeline_state_restore"}
    undo: {strategy: session_state_restore, description: "Restore the prior graph lifecycle."}

  - name: project_planner_context
    type: builtin
    init: project_planner_context
    description: "Project prompt-neutral task and SRD context."
    visibility: internal
    emits: [PlannerContextProjected, CommandError]
    category: word
    side_effects:
      - kind: none
        description: "Projects structured context without mutating state."
    reversibility:
      classification: reversible
      undo: "noop"
    undo:
      strategy: noop
      description: "Context projection has no effects to reverse."

  - name: capture_planner_failure
    type: builtin
    init: capture_planner_failure
    description: "Publish preceding validation output for retry prompt composition."
    visibility: internal
    emits: [FailureCaptured, CommandError]
    category: word
    side_effects: [{kind: none, description: "Wraps prior output."}]
    reversibility: {classification: reversible, undo: noop}
    undo: {strategy: noop, description: "History truncation removes captured context."}

  - name: parse_plan
    type: builtin
    init: parse_plan
    description: "Parse the LLM YAML response into an ImplementationPlan."
    visibility: internal
    emits: [PlanReady, ParseFailed, CommandError]
    category: stateful_internal
    side_effects:
      - kind: state_mutation
        target: pipeline_state
        state: current_plan_parsed
        description: "Sets the parsed implementation plan on pipeline state."
    reversibility:
      classification: reversible
      undo: "pipeline_state_restore"
    undo:
      strategy: session_state_restore
      description: "Restore the pipeline state snapshot captured before parsing."

  - name: mark_nodes_executing
    type: builtin
    init: mark_nodes_executing
    description: "Advance selected task nodes to Executing."
    visibility: internal
    emits: [NodesMarkedExecuting, CommandError]
    category: stateful_internal
    side_effects:
      - {kind: state_mutation, target: requirement_graph, state: selected_nodes_executing}
    reversibility: {classification: reversible, undo: "pipeline_state_restore"}
    undo: {strategy: session_state_restore, description: "Restore prior graph lifecycle."}

  - name: format_task_file
    type: builtin
    init: format_task_file
    description: "Project the current plan into write parameters for doc/task.yaml."
    visibility: internal
    emits: [TaskFileFormatted, CommandError]
    category: word
    side_effects: [{kind: none, description: "Serializes without writing."}]
    reversibility: {classification: reversible, undo: noop}
    undo: {strategy: noop, description: "Projection changes no state."}

  - name: mark_task_done
    type: builtin
    init: mark_task_done
    description: "Mark the current planner task's graph nodes done."
    problem: "Successful validation needs one focused graph completion mutation."
    goals:
      - "Mutate graph completion state without deciding retry or remaining-work policy."
    requirements:
      input:
        - "The current task and graph must exist in planner pipeline state."
      output:
        - "TaskCompleted is emitted after all current task nodes reach Done."
      errors:
        - "CommandError is emitted for missing state or invalid node transitions."
    non_goals:
      - "Does not inspect validation results."
      - "Does not count retries or query remaining work."
    visibility: internal
    emits: [TaskCompleted, CommandError]
    category: stateful_internal
    side_effects:
      - kind: state_mutation
        target: pipeline_state
        state: current_task_completed
        description: "Advances only the current task's graph nodes to Done."
    reversibility:
      classification: reversible
      undo: "pipeline_state_restore"
    undo:
      strategy: session_state_restore
      description: "Restore the graph snapshot captured before task completion."
    output:
      description: "Human-readable confirmation naming the completed planner task."
      schema:
        type: string
    errors:
      - signal: CommandError
        condition: "The current task or graph is missing, or a task node cannot transition to Done."
        message_shape: "mark_task_done: <error>"
        state_after_failure: "The machine does not route completion; rollback restores any graph nodes changed before the error."
    relationships:
      before: [test]
      after: [remaining_work]

  - name: mark_task_failed
    type: builtin
    init: mark_task_failed
    description: "Mark the current planner task's graph nodes failed after retry exhaustion."
    visibility: internal
    emits: [TaskFailed, CommandError]
    category: stateful_internal
    side_effects:
      - {kind: state_mutation, target: requirement_graph, state: current_task_failed}
    reversibility: {classification: reversible, undo: "pipeline_state_restore"}
    undo: {strategy: session_state_restore, description: "Restore graph status before failure marking."}
    problem: "Retry exhaustion needs an explicit graph failure before remaining-work routing."
    goals: ["Advance exhausted task nodes to Failed without owning retry policy."]
    requirements: {input: ["Current task and graph are required."], output: ["TaskFailed follows mutation."], errors: ["Invalid transitions emit CommandError."]}
    non_goals: ["Does not count retries or classify remaining work."]
    errors: [{signal: CommandError, condition: "Task or graph state is invalid.", state_after_failure: "Receipt-backed state is recoverable."}]
    relationships: {before: [check_retry_limit], after: [remaining_work]}
    output: {description: "Explicit graph failure summary.", schema: {type: string}}

  - name: remaining_work
    type: builtin
    init: remaining_work
    description: "Query whether the planner graph has ready, completed, or blocked work."
    problem: "Remaining-work routing belongs in the planner machine, not a graph-mutating word."
    goals:
      - "Report ready work separately from a fully done or blocked graph."
    requirements:
      input:
        - "A loaded graph must exist in planner pipeline state."
      output:
        - "WorkRemaining, AllDone, or Blocked describes the graph."
      errors:
        - "CommandError is emitted when no graph is loaded."
    non_goals:
      - "Does not extract tasks or mutate graph state."
      - "Does not decide where the planner routes next."
    visibility: internal
    emits: [WorkRemaining, AllDone, Blocked, CommandError]
    category: word
    side_effects:
      - kind: none
        description: "Reads graph state without mutating it."
    reversibility:
      classification: reversible
      undo: "noop"
    undo:
      strategy: noop
      description: "The graph query has no effects to reverse."
    output:
      description: "Human-readable ready, complete, or blocked graph summary."
      schema:
        type: string
    errors:
      - signal: CommandError
        condition: "No planner graph is loaded."
        message_shape: "remaining_work: graph is required"
        state_after_failure: "Graph and planner state remain unchanged."
    relationships:
      before: [mark_task_done, mark_task_failed]
      after: [extract_task]

  # --- evaluator session tools ---
  - name: parse_suite_config
    type: builtin
    init: parse_suite_config
    visibility: internal
    emits: [SuiteConfigParsed, CommandError]
    description: "Read and validate evaluator suite YAML metadata without discovering samples or creating session artifacts."
    category: word
    side_effects:
      - kind: state_mutation
        target: eval_session_state
        state: suite_config_parsed
        description: "Sets EvalSessionState.Suite with suite metadata and resolved samples directory."
    reversibility:
      classification: reversible
      undo: "session_state_restore"
    undo:
      strategy: session_state_restore
      description: "Restore evaluator session state to the snapshot before parsing suite config."

  - name: discover_suite_samples
    type: builtin
    init: discover_suite_samples
    visibility: internal
    emits: [SuiteSamplesDiscovered, CommandError]
    description: "Discover evaluator samples from the parsed suite samples directory."
    category: word
    side_effects:
      - kind: state_mutation
        target: eval_session_state
        state: suite_samples_discovered
        description: "Sets EvalSessionState.Suite.Samples from the resolved samples directory."
    reversibility:
      classification: reversible
      undo: "session_state_restore"
    undo:
      strategy: session_state_restore
      description: "Restore evaluator session state to the snapshot before discovering samples."

  - name: expand_eval_grid
    type: builtin
    init: expand_eval_grid
    visibility: internal
    emits: [EvalGridExpanded, CommandError]
    description: "Expand evaluator suite grid parameters into concrete grid points."
    category: word
    side_effects:
      - kind: state_mutation
        target: eval_session_state
        state: eval_grid_expanded
        description: "Sets the EvalSessionState grid point iterator input."
    reversibility:
      classification: reversible
      undo: "session_state_restore"
    undo:
      strategy: session_state_restore
      description: "Restore evaluator session state to the snapshot before expanding the grid."

  - name: init_eval_session
    type: builtin
    init: init_eval_session
    visibility: internal
    emits: [EvalSessionInitialized, CommandError]
    description: "Create the evaluator session output directory and resolve runtime defaults."
    category: word
    side_effects:
      - kind: filesystem_write
        target: evaluator_session_dir
        description: "Creates the evaluator session output directory."
      - kind: state_mutation
        target: eval_session_state
        state: eval_session_initialized
        description: "Sets session directory, reps, timeout, Ollama URL, and iteration start time."
    reversibility:
      classification: reversible
      undo: "workspace_restore_and_session_state_restore"
    undo:
      strategy: session_state_restore
      description: "Restore evaluator session state and workspace artifacts from persisted receipts."
      requires: [Receipt]

  - name: report_suite_summary
    type: builtin
    init: report_suite_summary
    visibility: internal
    emits: [SuiteLoaded, CommandError]
    description: "Report suite point count after config parsing, sample discovery, grid expansion, and session initialization."
    category: word
    side_effects:
      - kind: stderr_write
        target: evaluator_output
        description: "Prints suite summary to evaluator stderr."
    reversibility:
      classification: reversible
      undo: "noop"
    undo:
      strategy: noop
      description: "Summary reporting writes only diagnostic output and has no state to restore."

  - name: materialize_eval_points
    type: builtin
    init: materialize_eval_points
    visibility: internal
    emits: [EvalPointsMaterialized, CommandError]
    description: "Materialize deterministic profile, grid, sample, and repetition combinations for declared iteration."
    category: word
    side_effects:
      - kind: state_read
        target: eval_session_state
        description: "Reads resolved suite dimensions and runtime defaults without mutating session state."
    reversibility:
      classification: reversible
      undo: "noop"
    undo:
      strategy: noop
      description: "Read-only point materialization has no effects to reverse."

  - name: run_point
    type: builtin
    init: run_point
    visibility: internal
    emits: [PointDone, CommandError]
    description: "Run the per-point evaluation pipeline via a nested core.Loop with the point machine."
    category: boundary
    side_effects:
      - kind: nested_machine_execution
        target: evaluator_point_machine
        description: "Runs a nested point machine that may mutate point state and workspace artifacts."
    reversibility:
      classification: compensatable
      undo: "nested_machine_rollback"
    undo:
      strategy: child_command_undo
      description: "Use nested point machine history and workspace refs to roll back point effects."
      payload: boundary_compensation
      captures: [eval_session_snapshot, nested_machine_history]

  - name: report_session
    type: builtin
    init: report_session
    visibility: internal
    emits: [SessionReported, CommandError]
    description: "Print session summary with pass/fail/timeout counts and total duration."
    category: word
    side_effects:
      - kind: stderr_write
        target: evaluator_output
        description: "Prints evaluator session summary."
      - kind: state_mutation
        target: eval_session_state
        state: session_duration_finalized
        description: "Sets the final session duration on EvalSessionState.Result."
    reversibility:
      classification: reversible
      undo: "evaluator_session_restore"
    undo:
      strategy: session_state_restore
      description: "Restore evaluator session state to the snapshot before finalizing session duration."

  # --- evaluator per-point tools ---
  - name: create_point_dir
    type: builtin
    init: create_point_dir
    visibility: internal
    emits: [PointDirCreated, CommandError]
    description: "Create the per-point evaluation directory and record trace artifact paths."
    category: word
    side_effects:
      - kind: filesystem_write
        target: point_artifacts
        description: "Creates the point output directory under the evaluator session directory."
      - kind: state_mutation
        target: point_context
        state: point_dir_and_trace_path_set
        description: "Sets PointContext.PointDir and PointContext.TracePath for later point tools."
    reversibility:
      classification: reversible
      undo: "workspace_restore_and_point_context_restore"
    undo:
      strategy: session_state_restore
      description: "Restore point context and artifact workspace state from persisted receipts."
      requires: [Receipt]

  - name: sample_docs
    type: builtin
    init: sample_docs
    visibility: internal
    emits: [SampleDocsPresent, SampleDocsAbsent, CommandError]
    description: "Report optional sample docs and expose shared copy_dir parameters when present."
    category: word
    side_effects:
      - kind: filesystem_read
        target: point_context
        description: "Reads the configured sample documentation path."
    reversibility:
      classification: reversible
      undo: "noop"
    undo:
      strategy: noop
      description: "Read-only presence projection has no effects to reverse."

  - name: run_agent
    type: builtin
    init: run_agent
    visibility: internal
    emits: [HarnessFinished, HarnessFailed, HarnessTimedOut, CommandError]
    description: "Run the agent binary on the prepared workspace and collect exit code, timing, and output."
    category: boundary
    side_effects:
      - kind: child_process
        target: harness_agent
        description: "Runs the configured agent binary for the current point."
      - kind: filesystem_write
        target: point_workspace
        description: "The harness agent may mutate files in the point workspace."
      - kind: state_mutation
        target: point_context
        state: harness_result_recorded
        description: "Records exit code, timing, stdout, stderr, timeout, and trace path."
    reversibility:
      classification: compensatable
      undo: "workspace_restore_and_point_context_restore"
    undo:
      strategy: compensating_action
      description: "Restore point context and workspace refs; external child process effects may require compensation."
      payload: boundary_compensation
      captures: [point_context_snapshot, point_workspace, trace_path, result_path]
      requires: [Receipt]

  - name: record_oracle_result
    type: builtin
    init: record_oracle_result
    visibility: internal
    emits: [OracleCheckPassed, OracleCheckFailed, CommandError]
    description: "Record the configured oracle exec result in the current point context."
    category: stateful_internal
    side_effects:
      - kind: state_mutation
        target: point_context
        state: test_result_recorded
        description: "Sets PointContext.TestsPassed and PointContext.TestOutput from the configured oracle exec result."
    reversibility:
      classification: reversible
      undo: "point_context_restore"
    undo:
      strategy: session_state_restore
      description: "Restore PointContext test result fields from the prior snapshot."

  - name: collect_trace_tokens
    type: builtin
    init: collect_trace_tokens
    visibility: internal
    emits: [TraceTokensCollected, CommandError]
    description: "Read the point trace file and record total GenAI input/output token usage."
    category: word
    side_effects:
      - kind: state_mutation
        target: point_context
        state: trace_tokens_recorded
        description: "Sets PointContext.Tokens from gen_ai.usage input and output token attributes in the trace file."
    reversibility:
      classification: reversible
      undo: "point_context_restore"
    undo:
      strategy: session_state_restore
      description: "Restore PointContext token fields from the prior snapshot."

  - name: check_agent_version
    type: builtin
    init: check_agent_version
    visibility: internal
    emits: [AgentVersionChecked, AgentVersionMismatch, CommandError]
    description: "Compare the configured harness agent version with the version reported in the point trace."
    category: word
    side_effects:
      - kind: state_mutation
        target: point_context
        state: agent_version_checked
        description: "Sets PointContext.TraceVersion and PointContext.VersionMismatch when a traced version differs from the harness config."
      - kind: stderr_write
        target: evaluator_output
        description: "Writes a warning when the configured and traced agent versions differ."
    reversibility:
      classification: reversible
      undo: "point_context_restore"
    undo:
      strategy: session_state_restore
      description: "Restore PointContext version fields from the prior snapshot."

  - name: summarize_point_results
    type: builtin
    init: summarize_point_results
    visibility: internal
    emits: [ResultsCollected, CommandError]
    description: "Summarize previously collected point oracle, trace, and version state."
    category: word
    side_effects:
      - kind: state_read
        target: point_context
        description: "Reads PointContext test, token, and version fields without mutating them."
    reversibility:
      classification: reversible
      undo: "noop"
    undo:
      strategy: noop
      description: "Summarization is read-only and has no effects to reverse."

  - name: record_point_failure
    type: builtin
    init: record_point_failure
    visibility: internal
    emits: [PointFailureRecorded, CommandError]
    description: "Project a failed point command result into failure stage and cause fields."
    category: stateful_internal
    side_effects:
      - kind: state_mutation
        target: point_context
        state: point_failure_recorded
        description: "Sets PointContext.FailureStage and PointContext.FailureCause."
    reversibility:
      classification: reversible
      undo: "point_context_restore"
    undo:
      strategy: point_context_restore
      description: "Restore PointContext from the persisted pre-command receipt."
      requires: [Receipt]

  - name: collect_metrics
    type: builtin
    init: collect_metrics
    visibility: internal
    emits: [MetricsCollected, CommandError]
    description: "Write evaluation metadata (exit code, duration, test results, tokens) to meta.json."
    category: word
    side_effects:
      - kind: filesystem_write
        target: point_metrics
        paths: [meta.json]
        description: "Writes point metadata to meta.json."
    reversibility:
      classification: reversible
      undo: "workspace_restore"
    undo:
      strategy: workspace_restore
      description: "Restore point artifact files from the persisted receipt."
      requires: [Receipt]

  - name: record_agent_commit
    type: builtin
    init: record_agent_commit
    visibility: internal
    emits: [AgentCommitRecorded, CommandError]
    description: "Record a configured rev_parse result in the current point context."
    category: stateful_internal
    side_effects:
      - kind: state_mutation
        target: point_context
        state: agent_commit_recorded
        description: "Sets PointContext.AgentCommit from declared command output."
    reversibility:
      classification: reversible
      undo: "point_context_restore"
    undo:
      strategy: session_state_restore
      description: "Restore PointContext.AgentCommit from the prior snapshot."

  - name: dump_config
    type: builtin
    init: dump_config
    visibility: internal
    emits: [ConfigDumped, CommandError]
    description: "Serialize the full experiment configuration (harness, model, tools, prompts) into experiment.yaml."
    category: word
    side_effects:
      - kind: filesystem_write
        target: experiment_config
        paths: [experiment.yaml]
        description: "Writes resolved experiment configuration for reproducibility."
    reversibility:
      classification: reversible
      undo: "workspace_restore"
    undo:
      strategy: workspace_restore
      description: "Restore experiment artifacts from the persisted receipt."
      requires: [Receipt]

  # --- spec validation tools ---
  - name: load_corpus
    type: builtin
    init: load_corpus
    visibility: internal
    emits: [ToolDone, CommandError]
    description: "Load the specification corpus from the project directory."
    output:
      description: "Loaded corpus summary and declared grep, reference, and consistency plans."
      schema:
        type: object
        properties:
          summary: {type: string}
          grep_checks: {type: array, items: {type: object}}
          ref_checks: {type: array, items: {type: object}}
          consistency_checks: {type: array, items: {type: object}}
        required: [summary, grep_checks, ref_checks, consistency_checks]
    category: stateful_internal
    side_effects:
      - kind: state_mutation
        target: validation_state
        state: corpus_loaded
        description: "Loads specification documents into validation state."
    reversibility:
      classification: reversible
      undo: "validation_state_restore"
    undo:
      strategy: session_state_restore
      description: "Restore validation state to the snapshot before loading the corpus."

  - name: validate_specs
    type: builtin
    init: validate_specs
    visibility: internal
    emits: [ValidationPassed, ValidationFailed, CommandError]
    description: "Run consistency checks on the loaded specification corpus."
    output:
      description: "Plain-text finding and error count summary."
      schema: {type: string}
    category: stateful_internal
    side_effects:
      - kind: state_mutation
        target: validation_state
        state: validation_results_recorded
        description: "Records validation findings in validation state."
    reversibility:
      classification: reversible
      undo: "validation_state_restore"
    undo:
      strategy: session_state_restore
      description: "Restore validation state to the snapshot before running checks."

  - name: format_report
    type: builtin
    init: format_report
    visibility: internal
    emits: [ToolDone, ToolFailed]
    description: "Format the validation results as a human-readable report."
    output:
      description: "Plain-text human-readable validation report."
      schema: {type: string}
    category: word
    side_effects:
      - kind: stderr_write
        target: process_stderr
        description: "Prints the human-readable validation report to stderr."
    reversibility:
      classification: reversible
      undo: "noop"
    undo:
      strategy: noop
      description: "Report formatting has no effects to reverse."
    errors:
      - signal: ToolFailed
        condition: "The validation finding set contains error-level findings."
        state_after_failure: "The complete report is printed and returned."
