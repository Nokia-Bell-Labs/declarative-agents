name: jurist
purpose: |-
  The validator is a deterministic agent that loads a specification
  corpus, builds a labeled property graph of inter-document
  references, runs consistency checks, and produces a validation
  report. It does NOT use an LLM — it is a tool pipeline.
configuration:
  machine: agents/jurist/machine.yaml
  tools: agents/jurist/tools.yaml
invariants:
- The validator never calls an LLM
- Both pass and fail outcomes produce a formatted report
- The corpus is loaded from the filesystem — no network calls
- The graph is immutable once built — validation is read-only
lifecycle: |-
  1. Idle → Loading (Seed): load_corpus from project directory
  2. Loading → Validating (ToolDone): validate_specs
  3. Validating → Searching: run one declared jurist_rg word per grep_check
  4. Searching → Reducing (GrepSearched): reduce_grep_checks
  5. Reducing → Reporting (ValidationPassed/ValidationFailed): format_report
  6. Reporting → Passed (ToolDone): validation completed successfully
  6a. Reporting → Failed (ToolFailed): report indicates errors
  7. Any active step → Failed (CommandError): infrastructure error

  Search iteration is deterministic and sequential, with no LLM calls.
initial_state: Idle
states:
- name: Idle
  meaning: Initial state before validation begins.
- name: Loading
  meaning: |
    Loading the specification corpus from the project directory.
    Parses SRDs, use cases, test suites, and their cross-references.
- name: Validating
  meaning: |
    Running consistency checks on the specification graph:
    orphan detection, missing references, duplicate IDs, cycle
    detection, and coverage gap analysis.
- name: Searching
  meaning: Running declared ripgrep searches for each grep_check plan.
- name: Reducing
  meaning: Shaping ripgrep events into match or missing findings with provenance.
- name: Reporting
  meaning: Formatting the validation results into a human-readable report.
- name: Passed
  meaning: Terminal. All validation checks passed.
- name: Failed
  meaning: Terminal. Validation errors were found or an infrastructure error occurred.
terminal_states:
- Passed
- Failed
signals:
- name: Seed
  trigger: Loop initialization.
- name: ToolDone
  trigger: A tool completed successfully.
- name: ToolFailed
  trigger: A tool completed with errors.
- name: CommandError
  trigger: Infrastructure-level error.
- name: ValidationPassed
  trigger: All consistency checks passed.
- name: ValidationFailed
  trigger: One or more consistency checks failed.
- name: GrepSearched
  trigger: All grep_check searches completed, including no-match outcomes.
transitions:
- state: Idle
  signal: Seed
  next: Loading
  action: load_corpus
  label: loaded_corpus
- state: Loading
  signal: ToolDone
  next: Validating
  action: validate_specs
- state: Loading
  signal: CommandError
  next: Failed
- state: Validating
  signal: ValidationPassed
  next: Searching
  action: jurist_rg
  label: grep_result
  for_each:
    items: $from(loaded_corpus).grep_checks
    as: grep_check
    mode: sequential
    failure: collect_all
    continue_on: [ToolDone, ToolFailed]
    abort_on: [CommandError]
    join:
      next: Searching
      label: grep_results
      signals:
        all_success: GrepSearched
        partial: CommandError
        failed: CommandError
        empty: GrepSearched
- state: Validating
  signal: ValidationFailed
  next: Searching
  action: jurist_rg
  label: grep_result
  for_each:
    items: $from(loaded_corpus).grep_checks
    as: grep_check
    mode: sequential
    failure: collect_all
    continue_on: [ToolDone, ToolFailed]
    abort_on: [CommandError]
    join:
      next: Searching
      label: grep_results
      signals:
        all_success: GrepSearched
        partial: CommandError
        failed: CommandError
        empty: GrepSearched
- state: Validating
  signal: CommandError
  next: Failed
- state: Searching
  signal: GrepSearched
  next: Reducing
  action: reduce_grep_checks
- state: Searching
  signal: CommandError
  next: Failed
- state: Reducing
  signal: ValidationPassed
  next: Reporting
  action: format_report
- state: Reducing
  signal: ValidationFailed
  next: Reporting
  action: format_report
- state: Reducing
  signal: CommandError
  next: Failed
- state: Reporting
  signal: ToolDone
  next: Passed
- state: Reporting
  signal: ToolFailed
  next: Failed
- state: Reporting
  signal: CommandError
  next: Failed
