  - id: R-MACH-016
    target: specification
    level: MUST
    statement: >-
      A transition MAY carry `for_each`, which runs its `action` once per
      element of an array. `items` MUST be a `$from(label).path` selector
      over a prior step's output: the specification names the action and
      the binding, and runtime data can choose neither an action nor an
      expression. `as` binds each element while it is dispatched, an object
      at `$from(as).field` and a scalar at `$from(as).value`. `mode` is
      `sequential`, the default, or `parallel`, which MUST carry a positive
      `max_concurrency` that `sequential` MUST NOT carry. `failure` is
      `fail_fast`, the default, or `collect_all`; `continue_on` MUST name at
      least one signal that counts an element as done, `abort_on` names
      signals that stop the fan-out, and `fail_on` MUST appear only with
      `collect_all`. `join` names its `next` state, an optional `label`, and
      the signals for `all_success`, `failed`, and `empty`, plus `partial`,
      which `collect_all` MUST name; each MUST be declared, and each MUST be
      routed from `join.next` unless that state is final. `body`, when
      present, MUST be a `$from(as).path` selector into the bound element;
      each step is then built with the selected value as its input body.
