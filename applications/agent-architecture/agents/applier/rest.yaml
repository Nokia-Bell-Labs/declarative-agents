rest:
  version: v1
  auth:
    none:
      type: none
  limits:
    local_applier_apply:
      timeout: 130s
      read_timeout: 130s
      max_request_bytes: 1048576
      max_response_bytes: 1048576
      redirect:
        mode: none
      network:
        schemes: [http]
        hosts: [127.0.0.1, localhost]
        ports: [18330]
        allow_public_listener: true
    local_applier_control:
      timeout: 30s
      read_timeout: 5s
      max_request_bytes: 16384
      max_response_bytes: 65536
      redirect:
        mode: none
      network:
        schemes: [http]
        hosts: [127.0.0.1, localhost]
        ports: [18331]
        allow_public_listener: true
    local_applier_monitor:
      timeout: 5s
      read_timeout: 5s
      max_request_bytes: 4096
      max_response_bytes: 1048576
      redirect:
        mode: none
      network:
        schemes: [http]
        hosts: [127.0.0.1, localhost]
        ports: [18332]
        allow_public_listener: true

  servers:
    applier_apply:
      # The apply endpoint accepts a decided values-overrides document and SHALL
      # NOT accept an endpoint or credential for a running agent; no runtime input
      # supplies transport authority (srd002-applier R1.1, R4.2).
      address: ${APPLIER_BIND_HOST:-127.0.0.1}:18330
      limits_ref: local_applier_apply
      endpoints:
        apply:
          method: POST
          path: /api/v1/apply
          binding: machine_request
          request:
            # The apply request carries the decided values-plane document as
            # content under the versioned contract (srd002-applier R1.3); the
            # applier writes and applies it, deciding no values (R5.1).
            body_schema:
              type: object
              required: [schema_version, content]
              properties:
                schema_version: {type: string}
                content: {type: string}
          machine_request:
            profile: apply-profile.yaml
            timeout: 130s
            request:
              body:
                content: $.content
                # The values file lands in the agent's workspace, set from
                # .Values.workspace mount via APPLIER_WORK_DIR. Binding the write
                # path and the helm read path to one reference keeps write_overrides
                # inside the workspace and prevents the write and the read from
                # diverging when the mount moves. The default keeps a default render
                # unchanged.
                path: ${APPLIER_WORK_DIR:-/work}/overrides.yaml
            response:
              # Keyed by terminal state, not terminal signal: every word in
              # apply-machine.yaml emits only ToolDone or ToolFailed, so signal
              # keying could not separate a rejected patch from a failed apply,
              # nor a successful rollback from either (srd030 R4.3).
              terminal_states:
                Done:
                  status: 200
                  content_type: application/json
                  body:
                    schema_version: "1"
                    status: applied
                # The dry-run rejected the patch against the chart schema. The
                # caller sent bad values and nothing was applied, so this is a
                # client error and retrying the same patch will not help.
                Rejected:
                  status: 400
                  content_type: application/json
                  body:
                    schema_version: "1"
                    status: rejected
                    error: validate_rejected
                # A rollout stalled and helm_rollback restored the prior revision.
                # The release is intact; the patch did not take.
                RolledBack:
                  status: 500
                  content_type: application/json
                  body:
                    schema_version: "1"
                    status: rolled_back
                    error: rolled_back
                Failed:
                  status: 500
                  content_type: application/json
                  body:
                    schema_version: "1"
                    status: failed
                    error: apply_failed
        rollout:
          # Read the collector Deployment's rollout status (srd002-applier R3.3).
          # The collector is the stable read target; the bounded curator holds no
          # durable rollout. kubectl computes the phase, then the machine reads the
          # Deployment itself for the counts so a broken read is not reported as a
          # progressing rollout.
          method: GET
          path: /api/v1/rollout
          binding: machine_request
          machine_request:
            profile: rollout-profile.yaml
            timeout: 10s
            request:
              body: {}
            response:
              terminal_states:
                Complete:
                  status: 200
                  content_type: application/json
                  body:
                    schema_version: "1"
                    phase: complete
                    ready: $.ready
                    desired: $.desired
                    revision: $.revision
                Progressing:
                  status: 200
                  content_type: application/json
                  body:
                    schema_version: "1"
                    phase: progressing
                    ready: $.ready
                    desired: $.desired
                    revision: $.revision
                # kubectl could not read the Deployment: it is absent, or the
                # kubeconfig, RBAC, or API server denies the read. Reporting a
                # phase here would render a broken read as an ongoing rollout.
                Unavailable:
                  status: 502
                  content_type: application/json
                  body:
                    schema_version: "1"
                    status: unavailable
                    error: rollout_read_failed

    applier_control:
      address: ${APPLIER_BIND_HOST:-127.0.0.1}:18331
      limits_ref: local_applier_control
      queue:
        name: applier_control
        capacity: 8
        timeout: 30s
      shutdown:
        timeout: 5s
        drain_policy: drain_then_stop
      endpoints:
        health:
          method: GET
          path: /api/lifecycle/health
          binding: health

    monitor:
      address: ${APPLIER_BIND_HOST:-127.0.0.1}:18332
      limits_ref: local_applier_monitor
      lifecycle_exit: {disabled: true}
      queue:
        name: applier_monitor
        capacity: 8
        overflow: reject
        timeout: 100ms
      shutdown:
        timeout: 2s
        drain_policy: drain_then_stop
        stop_listeners: true
        unblock_await_signal: ServerStopped
      endpoints:
        machine_spec:  {method: GET, path: /monitor/machine,       binding: read_state,    monitor_view: machine_spec}
        current_state: {method: GET, path: /monitor/state,         binding: read_state,    monitor_view: current_state}
        tools:         {method: GET, path: /monitor/tools,         binding: read_state,    monitor_view: tools}
        metrics:       {method: GET, path: /monitor/metrics,       binding: read_state,    monitor_view: metrics}
        recent_events: {method: GET, path: /monitor/events,        binding: read_state,    monitor_view: events}
        event_stream:  {method: GET, path: /monitor/events/stream, binding: stream_events, monitor_view: events}
