# Fixture for R-REST-007: an emit_dynamic_signal endpoint with no allowed_signals.
rest:
  version: v1
  servers:
    control:
      address: 127.0.0.1:0
      endpoints:
        decide:
          method: POST
          path: /decide
          binding: emit_dynamic_signal
