  - id: R-PROF-003
    status: retired
    retired: >-
      The 2.0 revision retired agent blueprints; no statement replaces this one.
    target: specification
    level: MUST NOT
    statement: >-
      A blueprint MUST NOT carry an expansion; a specification carrying the
      `params` and `profile` keynames is a blueprint, and is not itself an
      agent-profile specification.
    acceptance:
