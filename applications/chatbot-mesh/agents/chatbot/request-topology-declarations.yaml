unit: mesh-chatbot-request-topology-declarations
imports:
- ../units/types-chatbot.yaml
# Local two-source topology. The Helm chart co-generates this declaration from
# ragUnits; changing the list changes only trusted data, never the number of
# words or machine states. catalog intentionally contains only names and
# descriptions; selected REST/config fields stay in trusted items.
tools:
  - name: declare_rag_topology
    type: builtin
    init: compose
    visibility: internal
    category: response
    description: Declare the ordered trusted RAG topology for this chatbot instance.
    parameters: {type: object, properties: {}, additionalProperties: false}
    signature:
      output: mesh-types-chatbot.RagTopology
      emits: [RagTopologyDeclared]
    output:
      description: Ordered RAG topology.
    config:
      signal: RagTopologyDeclared
      inputs: {}
      template: |
        {
          "names": ["rag0", "rag1"],
          "catalog": "- rag0: Primary declarative-agent and scenario critic rig behavior.\n- rag1: Secondary mock-dependency and Solar Ridge integration fixtures.",
          "items": [
            {
              "name": "rag0",
              "description": "Primary declarative-agent and scenario critic rig behavior.",
              "collection": "corpus",
              "embedding_model": "qwen3-embedding:8b",
              "base_url": "http://127.0.0.1:18085"
            },
            {
              "name": "rag1",
              "description": "Secondary mock-dependency and Solar Ridge integration fixtures.",
              "collection": "corpus2",
              "embedding_model": "qwen3-embedding:8b",
              "base_url": "http://127.0.0.1:18095"
            }
          ]
        }
