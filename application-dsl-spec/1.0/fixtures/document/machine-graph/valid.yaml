# Fixture for R-MACH-006: a graph whose every reference names a declared state or signal.
initial_state: Idle
states: [Idle, Working, Done]
terminal_states: [Done]
signals: [Seed, Relayed]
transitions:
  - {state: Idle, signal: Seed, next: Working, action: relay}
  - {state: Working, signal: Relayed, next: Done}
