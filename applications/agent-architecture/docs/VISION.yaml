id: agent-architecture
title: Agent Architecture Application Vision

executive_summary: |
  applications/agent-architecture is a standalone presentation application.
  It guides an operator through launching the canonical documentation-curator
  profile, opening its browser interface, and stopping it with a declarative
  lifecycle-exit client.

  The dependency direction is application -> applications/catalog ->
  agent-core. The application owns the slide deck, operator entry points, and
  composition-only reporting; it composes catalog-owned profiles. The catalog is
  the canonical owner of the documentation-curator profile and user interface
  and of the reusable lifecycle-exit client. agent-core owns the runtime and
  builtin capabilities.

  This application extends the shared runnable-application contract in
  applications/docs. It declares runnable_module and managed_service for
  Release 00.0. The managed-service scope covers the canonical
  documentation-curator launched by the application and the application-owned
  Go present server. It also declares packaged, helm_managed, and kind_demo,
  planned for Releases 02.0 and 03.0: a chart runs the documentation-curator and
  the collector as Kubernetes workloads from mounted catalog-owned closures, a
  values schema owns the deployment values, and a bounded kind target proves the
  packaged archive. A standalone declarative applier actuates that chart for an
  authorized operator or CI caller in Release 04.0.

problem: |
  Presentation-only launch and lifecycle behavior must not copy or fork the
  reusable catalog profiles it demonstrates. Otherwise the demo appears to be
  part of the canonical profile contract and can depend on operator-installed
  presentation tooling.

  The standalone application records the demo composition and dependencies
  without copying the documentation-curator profile, its user interface, or the
  reusable lifecycle-exit client, all of which the catalog owns.

what_this_does: |
  The application serves agent-architecture.slide with a version-pinned Go
  present tool. A Mage entry point launches the canonical
  applications/catalog/agents/knowledge-manager/documentation-curator/profile.yaml
  through agent-core. The operator opens the catalog-owned interface and then
  runs the catalog-owned lifecycle-exit client to request a clean shutdown.

  Source-checkout operation resolves the catalog_root and core_root declared in
  demo.yaml, with portable monorepo defaults. The application reports only composition
  facts, including agents_contributed: 0, so repository statistics count the
  canonical profile once under applications/catalog. Root mage audit, mage
  test, and mage stats dispatch this application as an application module.

  The application cites shared srd001 for module ownership, documentation,
  Mage participation, and composition-only accounting. It cites shared srd002
  R1 through R3 for both managed servers. It does not copy those requirements
  into a local SRD.

why_we_build_this: |
  A standalone application gives presentation, launch, and shutdown behavior a
  clear owner. Reproducible Mage commands let a reader run the same guided flow
  without moving reusable assets or installing an unpinned slide server.

  Explicit roots preserve the ownership chain. The application consumes the
  catalog profile, and the catalog profile consumes agent-core declarations and
  runtime capability. No dependency points back from either provider to this
  application.

success_criteria:
  guided_demo: |
    Release 00.0 traces presentation startup, canonical profile launch, browser
    access, and declarative lifecycle exit through one use case and one
    reciprocal executable test suite.
  canonical_profile_reuse: |
    Every launch resolves the documentation-curator from the catalog_root
    declared in demo.yaml. This application contains no copy of that profile, its
    machine, or its user interface.
  reproducible_operator_tools: |
    The Go present command is a pinned tool dependency. Mage exposes run,
    presentation, audit, and stats entry points with tested command
    construction.
  portable_development: |
    Source checkouts accept explicit core_root and catalog_root values declared
    in demo.yaml and provide monorepo-relative defaults without developer-specific
    absolute paths.
  composition_only_accounting: |
    mage stats emits valid JSON with ownership: composition,
    agents_contributed: 0, and one canonical reference. It emits no agents
    section.
  deployable_composition: |
    Releases 02.0 and 03.0 run the documentation-curator and the collector as
    Kubernetes workloads from mounted catalog-owned closures, validate the
    deployment values with a schema, and prove the packaged archive on a bounded
    kind cluster. Release 04.0 adds a standalone declarative applier that
    validates, applies, verifies, and rolls back a decided values patch for an
    authorized operator or CI caller, holding helm and kubectl authority alone.
    These capabilities are declared and planned; their resources land in later
    sub-issues.
  shared_contract_conformance: |
    Application documents trace to applicable srd001 requirements, srd002 R1
    through R3, and catalog srd011. Application-local deterministic tests and
    root orchestration prove the checked-in command, configuration, audit,
    stats, and dispatch surfaces. The managed-service capability remains
    partial: dependency-gated live startup, readiness, liveness, failure,
    shutdown, diagnostic, telemetry, and listener-release observations are
    still required before the application can claim srd002 AC1 through AC3.

not:
  - We do not own or copy the canonical documentation-curator profile.
  - We do not own or copy the Knowledge Manager user interface.
  - We do not implement the documentation host, REST runtime, or builtin tools.
  - We do not add presentation behavior to applications/catalog.
  - We do not replace the declarative lifecycle-exit client with a bespoke HTTP
    program.
  - We do not count the reused documentation-curator as an application agent.
  - We do not copy the canonical curator or collector profiles into the chart;
    the chart mounts their catalog-owned closures.
  - We do not let the applier decide a values change or hold deployment
    authority on a serving pod; the caller decides and the applier alone binds
    helm and kubectl.
  - We do not treat deterministic command construction as proof that a live
    server, browser endpoint, shutdown, or listener release was observed.

