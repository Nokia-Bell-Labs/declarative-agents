unit: mesh-creator-declarations
imports:
  - ../units/types-server.yaml
instantiate:
  - fragment: ../units/mesh-monitor-fragment.yaml
    args: {agent: "creator", control_await: await_creator_control, requests_stop: stop_creator_requests}
tools:
  - name: launch_creator_requests
    type: builtin
    init: rest_server_launch
    visibility: internal
    category: boundary
    description: Launch the machine_request instance server for instance operations.
    problem: The creator must expose a request-scoped instance-request endpoint over REST.
    goals:
      - Register the instance-request machine_request route.
      - Keep intent access inside the existing REST server tool path.
    requirements:
      input:
        - Tool config references the trusted intent REST server definition.
      output:
        - Output reports server name, bound address, and route count.
      errors:
        - Config, bind, route conflict, and schema failures emit CommandError.
    non_goals:
      - Does not run the request machine itself; the binding runner does.
      - Does not accept runtime transport authority.
    emits: [ServerLaunched, CommandError]
    signature:
      input: mesh-types-server.NoParameters
      output: mesh-types-server.ServerLaunch
      emits: [ServerLaunched, CommandError]
    output:
      description: Instance REST server launch result.
    side_effects:
      - kind: network_listen
        target: creator_instance
        state: listener_started
    reversibility:
      classification: compensatable
    undo:
      strategy: compensating_action
      description: Stop the instance REST server if the launch owns the listener.
    errors:
      - signal: CommandError
        condition: Instance REST server config, bind, route, or schema failure.
        state_after_failure: No instance route is exposed.
    relationships:
      overlaps:
        - tool: rest_server_launch
          difference: This profile-specific word binds only the instance-request machine_request REST route set.
      before: [await_creator_control]
    config:
      rest_ref: creator_instance

  - name: launch_creator_control
    type: builtin
    init: rest_server_launch
    visibility: internal
    category: boundary
    description: Launch the control server for health and lifecycle exit.
    problem: The creator needs a control plane for health checks and graceful exit.
    goals:
      - Register the control exit and health routes.
      - Keep control access inside the existing REST server tool path.
    requirements:
      input:
        - Tool config references the trusted control REST server definition.
      output:
        - Output reports server name, bound address, and route count.
      errors:
        - Config, bind, route conflict, and schema failures emit CommandError.
    non_goals:
      - Does not execute lifecycle behavior inside HTTP handlers.
      - Does not accept runtime transport authority.
    emits: [ServerLaunched, CommandError]
    signature:
      input: mesh-types-server.NoParameters
      output: mesh-types-server.ServerLaunch
      emits: [ServerLaunched, CommandError]
    output:
      description: Control REST server launch result.
    side_effects:
      - kind: network_listen
        target: creator_control
        state: listener_started
    reversibility:
      classification: compensatable
    undo:
      strategy: compensating_action
      description: Stop the control REST server if the launch owns the listener.
    errors:
      - signal: CommandError
        condition: Control REST server config, bind, route, or schema failure.
        state_after_failure: No control route is exposed.
    relationships:
      overlaps:
        - tool: rest_server_launch
          difference: This profile-specific word binds only the control exit and health route set.
      before: [await_creator_control]
    config:
      rest_ref: creator_control

  - name: await_creator_control
    type: builtin
    init: rest_await_event
    visibility: internal
    category: boundary
    description: Await a lifecycle exit event from the control server.
    problem: The creator needs one grammar-visible wait word so the process stays alive while serving instance operations.
    goals:
      - Wait on the control server queue after launch.
      - Accept only configured lifecycle exit events.
      - Return the selected lifecycle signal to MachineSpec.
    requirements:
      input:
        - Tool config references the trusted control REST server queue.
      output:
        - Output reports source, route, signal, payload, and request ID.
      errors:
        - Missing server, timeout, stopped server, and queue failures emit declared signals.
    non_goals:
      - Does not read or mutate monitor snapshots.
      - Does not execute lifecycle behavior inside HTTP handlers.
    emits: [ExitRequested, AwaitTimedOut, ServerStopped, CommandError]
    signature:
      input: mesh-types-server.NoParameters
      output: mesh-types-server.ControlEvent
      emits: [ExitRequested, AwaitTimedOut, ServerStopped, CommandError]
    output:
      description: Selected lifecycle control event.
    side_effects:
      - kind: state_mutation
        target: rest_server_queue
        state: selected_event_consumed
    reversibility:
      classification: reversible
    undo:
      strategy: queue_event_restore
      description: Restore the receipt-recorded event to the front of its source queue.
      payload: rest_await_event
      captures: [source, event]
    errors:
      - signal: AwaitTimedOut
        condition: No configured lifecycle exit event arrives before the timeout elapses.
        state_after_failure: Listeners remain open; the machine may retry the await or exit.
      - signal: ServerStopped
        condition: A configured source server stops while awaiting under the emit_server_stopped policy.
        state_after_failure: The stopped source no longer delivers events; other sources continue.
      - signal: CommandError
        condition: A configured source server is missing or a queue read fails.
        state_after_failure: Listener state is unchanged.
    relationships:
      after: [launch_creator_requests, launch_creator_control, launch_monitor_rest]
      before: [stop_monitor_rest, stop_creator_requests]
    config:
      sources:
        - server: creator_control
          routes: [exit]
          signals: [ExitRequested]
      timeout: 600s
      stopped_behavior: emit_server_stopped

  - name: stop_creator_requests
    type: builtin
    init: rest_server_stop
    visibility: internal
    category: boundary
    description: Stop the owned intent REST listener.
    problem: The creator must release its instance-request listener before reaching Done.
    goals:
      - Stop the configured intent REST server.
      - Emit ServerStopped so MachineSpec can route to Done.
    requirements:
      input:
        - Tool config references the trusted intent REST server definition.
      output:
        - Output reports server name, bound address, and stopped status.
      errors:
        - Missing server, shutdown timeout, and cleanup failures emit CommandError.
    non_goals:
      - Does not write instance results.
      - Does not relaunch the intent server.
    emits: [ServerStopped, CommandError]
    signature:
      input: mesh-types-server.NoParameters
      output: mesh-types-server.ServerStop
      emits: [ServerStopped, CommandError]
    output:
      description: Instance REST server stop result.
    side_effects:
      - kind: network_listener_shutdown
        target: creator_instance
        state: listener_stopped
    reversibility:
      classification: compensatable
    undo:
      strategy: server_shutdown_or_user_action_compensation
      description: The receipt records shutdown loss; MachineSpec must relaunch the trusted instance definition.
      payload: boundary_compensation
      captures: [server, address, drained_events, dropped_events, relaunch_requirement]
    errors:
      - signal: CommandError
        condition: Instance REST server is missing, shutdown times out, or cleanup fails.
        state_after_failure: Intent listener state may be partially stopped.
    relationships:
      after: [await_creator_control, stop_monitor_rest]
    config:
      rest_ref: creator_instance
