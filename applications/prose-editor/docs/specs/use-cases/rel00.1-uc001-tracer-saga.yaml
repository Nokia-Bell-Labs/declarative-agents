  - Style editing (specialist-editor:style, tightening-rag) — deferred to 00.2.
  - Pangram consent-gated upload and advisory comparison — deferred to 00.2.
  - GitHub publication (branch, commit, push, pull request) — deferred to 00.2.
  - Multi-stage responsible retry (voice and style stages) — deferred to 00.2.
  - Corpus-ingest wrapper — deferred to 00.2.
