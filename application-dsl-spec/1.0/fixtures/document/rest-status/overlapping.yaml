# Fixture for R-REST-004: an operation mapping one status to two signals.
rest:
  version: v1
  clients:
    github:
      operations:
        search_issues:
          method: GET
          path: /search/issues
          success: {status: [200], signal: RESTResponded}
          failures:
            - {status: [404, 422], signal: RESTNotFound}
            - {status: [422, 500], signal: RESTFailed}
