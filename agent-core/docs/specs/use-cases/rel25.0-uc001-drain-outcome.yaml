id: rel25.0-uc001-drain-outcome
title: A monitor exit on a loaded host succeeds and names its unfinished drain
status: specified

summary: |
  An operator sends the control exit request to a running monitor while the
  host is busy enough that an in-flight connection outlives the shutdown
  budget. The listener closes at once, so the profile has done what it was
  asked to do, and the run reaches its success terminal. The stop output
  carries a structured drain field saying the budget expired, so a machine
  branching on the report sees the condition that a passing exit status
  would otherwise hide. A stop that cannot release the listener, or that
  fails for any other reason, still fails the command.

actor: An operator stopping a serving profile, and the machine that branches on what the stop reported.

trigger: |
  A control exit request arrives at a monitor whose in-flight connections
  cannot all finish inside the configured shutdown budget.

flow:
  - id: F1
    text: The control route fires the stop step, which closes the owned listener immediately and waits out the shutdown budget for open connections (srd033 R6.4).
  - id: F2
    text: The wait expires with connections still open; the server is already deregistered and no longer accepting requests (srd033 R6.5).
  - id: F3
    text: The stop step reports the drain outcome as a structured field of its declared output rather than as prose alone (srd033 R6.10).
  - id: F4
    text: The MachineSpec routes the stop to Done or Succeeded, and the run status is succeeded (srd033 R6.5).
  - id: F5
    text: A stop naming an unlaunched server, or one whose shutdown fails for a reason other than the expired budget, stays a command failure and routes to the failure terminal (srd033 R6.5).
  - id: F6
    text: A drain that finishes inside the budget reports the completed outcome through the same field, so the two cases differ in the value and not in the shape (srd033 R6.10).

touchpoints:
  - T1: "srd033-monitor-rest-api R6.4 -- the stop step releases the owned monitor listener"
  - T2: "srd033-monitor-rest-api R6.5 -- a released listener routes to the success terminal, and other faults stay failures"
  - T3: "srd033-monitor-rest-api R6.10 -- the drain outcome is a structured field a machine can branch on"
  - T4: "srd038-command-state-store R3.3 -- the reported field travels as declared output, never as a receipt"

success_criteria:
  - id: S1
    criterion: A stop whose drain exceeds its budget returns success, and the run reaches the success terminal instead of the failure terminal.
    traces: [srd033-monitor-rest-api AC6]
  - id: S2
    criterion: The stop output carries a structured drain field whose value separates a completed drain from one the budget cut short, in both cases and with the same shape.
    traces: [srd033-monitor-rest-api AC6]
  - id: S3
    criterion: An unlaunched server and a shutdown failing for any reason other than the expired budget remain command failures.
    traces: [srd033-monitor-rest-api AC6]
  - id: S4
    criterion: The runtime-state-reader proof keeps its shipped shutdown budget and reports succeeded whether or not the drain finished.
    traces: [srd033-monitor-rest-api AC6]

out_of_scope:
  - Changing any shipped shutdown budget, which stays a profile decision.
  - Reporting per-connection detail; the field names the outcome, not the connections.
  - Any monitor read endpoint, which R5 and R7 already govern.
