unit: control-fragments-program
imports:
  - ../../units/control-types.yaml
  - ../../../../tools/builtin/lifecycle/exit-agent.yaml
expand:
  - fragment: ../../units/control-tool-fragment.yaml
    as: primary
    args: {server: alpha_agent_control, route: alpha_exit}
  - fragment: ../../units/control-tool-fragment.yaml
    as: patient
    args: {server: beta_agent_control, route: beta_exit, timeout: 45s}
tools:
  - name: exit_agent
    override: true
    type: builtin
    init: exit_agent
    category: lifecycle
    visibility: internal
    emits: [AgentExited, CommandError]
    output:
      description: The outcome of the exit request.
      schema: {$type: control-types.ExitReport}
