#
# Accepted chart conformance violations (srd005 R7, ENG01 chart conformance
# rules). Shrink-only: every entry names the issue that removes it, the gate
# fails on a violation this file does not list, and it fails again once a
# listed violation stops reproducing. The gate reads this file and never
# writes it.
#
# Seeded by GH-2408 with the 50 violations the charts carried when the
# gate first ran. GH-2409 empties it.
exceptions:
  - chart: chatbot-mesh
    overlay: defaults
    rule: R1.1
    resource: Deployment/conformance-chatbot-mesh-chatbot container/initialize-dolt-database
    value: "dolthub/dolt-sql-server:latest"
    issue: GH-2409
    reason: Floating upstream tag. GH-2409 pins it by version and digest.
