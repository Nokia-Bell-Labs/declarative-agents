tools:
  - name: get_payment
    type: builtin
    init: rest_client_get
    category: boundary
    description: Read one payment through the configured REST client.
    parameters:
      type: object
      properties:
        params: {type: object}
    signature:
      emits: [RESTResourceRead, RESTMissing, RESTDomainFailed, CommandError]
    output:
      description: Mapped REST payment read result.
      schema:
        type: object
        properties:
          operation: {type: string}
          status: {type: integer}
          body: {type: object}
    side_effects:
      - kind: external_api
        target: payments.payment
        state: read_only
    reversibility:
      classification: reversible
    undo:
      strategy: noop
      description: Payment reads do not mutate local or remote state.
    errors:
      - signal: CommandError
        condition: REST config, schema, network, timeout, or response mapping failure.
        state_after_failure: No REST command state changes.
    config:
      rest_ref: payments
      resource: payment
      operation: get

  - name: create_payment
    type: builtin
    init: rest_client_send
    category: boundary
    description: Submit an asynchronous payment create request.
    parameters:
      type: object
      properties:
        params: {type: object}
    signature:
      emits: [RESTAccepted, CommandError]
    output:
      description: Async REST submission result.
      schema:
        type: object
        properties:
          request_id: {type: string}
          operation: {type: string}
          correlation: {type: string}
    side_effects:
      - kind: external_api
        target: payments.payment
        state: payment_submitted
      - kind: state_mutation
        target: rest_command_state
        state: async_request_recorded
    reversibility:
      classification: compensatable
    undo:
      strategy: compensating_action
      description: Cancel the payment when the configured service supports it.
    errors:
      - signal: CommandError
        condition: REST config, schema, network, timeout, or async state failure.
        state_after_failure: Async state is recorded only after accepted submission.
    config:
      rest_ref: payments
      operation: create_payment

  - name: probe_payment
    type: builtin
    init: rest_client_get
    category: boundary
    description: Probe the submitted payment exactly once.
    parameters:
      type: object
      properties:
        params: {type: object}
    signature:
      emits: [RESTResourceRead, RESTDomainFailed, RESTMissing, CommandError]
    output:
      description: One payment readiness sample.
      schema:
        type: object
        properties:
          operation: {type: string}
          status: {type: integer}
    side_effects:
      - kind: external_api
        target: payments.payment
        state: read_only
    reversibility:
      classification: reversible
    undo:
      strategy: noop
      description: A readiness probe does not mutate remote state.
    errors:
      - signal: CommandError
        condition: REST config, schema, network, timeout, or response mapping failure.
        state_after_failure: The submitted payment remains available for another declared probe.
    config:
      rest_ref: payments
      operation: probe_payment

  - name: wait_payment_retry
    type: builtin
    init: delay
    category: boundary
    description: Wait once between declared payment readiness probes.
    parameters: {type: object, properties: {}}
    signature:
      emits: [PaymentRetryReady, CommandError]
    output:
      description: One bounded retry delay.
      schema: {type: object}
    side_effects:
      - kind: state_read
        target: local_clock
        state: read_only
    reversibility: {classification: reversible}
    undo: {strategy: noop, description: Waiting changes no state.}
    errors:
      - signal: CommandError
        condition: The wait is cancelled.
        state_after_failure: The submitted payment remains unchanged.
    config:
      duration: 100ms
      elapsed_signal: PaymentRetryReady

  - name: launch_payment_webhooks
    type: builtin
    init: rest_server_launch
    category: boundary
    description: Launch configured payment webhook routes.
    parameters:
      type: object
      properties: {}
    signature:
      emits: [ServerLaunched, CommandError]
    output:
      description: REST server launch result.
      schema:
        type: object
        properties:
          server: {type: string}
          address: {type: string}
          route_count: {type: integer}
    side_effects:
      - kind: external_api
        target: payments_webhooks
        state: listener_started
      - kind: state_mutation
        target: rest_server_state
        state: server_registered
    reversibility:
      classification: compensatable
    undo:
      strategy: compensating_action
      description: Stop the owned listener through stop_payment_webhooks.
    errors:
      - signal: CommandError
        condition: Config decode, bind, route conflict, or schema failure.
        state_after_failure: Partial launch cleans up owned listener state.
    config:
      rest_ref: payments_webhooks

  - name: await_payment_webhook
    type: builtin
    init: rest_server_await
    category: boundary
    description: Await a queued payment webhook event.
    parameters:
      type: object
      properties: {}
    signature:
      emits: [PaymentWebhookReceived, AwaitTimedOut, ServerStopped, CommandError]
    output:
      description: REST inbound event result.
      schema:
        type: object
        properties:
          route: {type: string}
          signal: {type: string}
          payload: {type: object}
    side_effects:
      - kind: state_mutation
        target: rest_server_queue
        state: event_consumed
    reversibility:
      classification: reversible
    undo:
      strategy: queue_event_restore
      description: Restore the receipt-recorded event to the front of its server queue.
      payload: rest_await_event
      captures: [source, event]
    errors:
      - signal: CommandError
        condition: Missing server, queue closed, timeout, or payload decode failure.
        state_after_failure: Queue state follows server policy.
    config:
      rest_ref: payments_webhooks

  - name: stop_payment_webhooks
    type: builtin
    init: rest_server_stop
    category: boundary
    description: Stop configured payment webhook routes.
    parameters:
      type: object
      properties: {}
    signature:
      emits: [ServerStopped, CommandError]
    output:
      description: REST server stop result.
      schema:
        type: object
        properties:
          server: {type: string}
          address: {type: string}
          status: {type: string}
    side_effects:
      - kind: external_api
        target: payments_webhooks
        state: listener_stopped
      - kind: state_mutation
        target: rest_server_state
        state: server_stopped
    reversibility:
      classification: compensatable
    undo:
      strategy: server_shutdown_or_user_action_compensation
      description: The receipt records shutdown loss; MachineSpec must relaunch the trusted payment webhook definition.
      payload: boundary_compensation
      captures: [server, address, drained_events, dropped_events, relaunch_requirement]
    errors:
      - signal: CommandError
        condition: Missing server, shutdown timeout, cleanup failure, or drain failure.
        state_after_failure: Server state reports partial shutdown when cleanup fails.
    config:
      rest_ref: payments_webhooks
