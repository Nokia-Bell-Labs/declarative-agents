    purpose: End-to-end planner, executor, and critic flow.
  - doc: docs/specs/test-suites/test-rel01.0-coding-loop.yaml
    purpose: Inputs and expected outputs for the three integration stages.
  - doc: applications/catalog/docs/specs/software-requirements/srd002-executor.yaml
    purpose: Canonical executor family contract.
  - doc: applications/catalog/docs/specs/software-requirements/srd003-critic.yaml
    purpose: Canonical critic family contract.
  - doc: applications/catalog/docs/specs/software-requirements/srd004-planner.yaml
    purpose: Canonical planner family contract.
