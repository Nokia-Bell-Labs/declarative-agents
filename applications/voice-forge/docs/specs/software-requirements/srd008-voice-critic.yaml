id: srd008-voice-critic
title: Voice Critic State Machine and Pangram Boundary
status: specified

problem: |
  Voice Forge needs an assurance service that evaluates the immutable original
  and selected style candidate without inheriting an editor's reasoning or
  authority. The critic must judge semantic preservation, structural intent,
  voice match, tightening quality, unsupported additions, and anchor-copy risk.
  A critic that sees editor rationale can repeat the editor's assumptions; a
  critic that can edit or persist content can approve its own repair.

  Pangram adds a separate privacy and factory-semantics problem. Its API stores
  uploaded text and returns an asynchronous task whose HTTP 200 body may still
  be pending or failed. An API key is not consent, a successful HTTP status is
  not a completed analysis, and its document fractions are not a verdict.
  This SRD requires an exact-hash consent gate, separate original and candidate
  submissions and polls, explicit advisory comparison, and a verdict produced
  independently before Pangram is consulted. Runtime declarations, the helper,
  profile, machine, REST configuration, and tests remain planned.

goals:
  - "G1: Define one flat independent critic machine with closed states, signals, actions, labels, and terminals."
  - "G2: Bind every assessment to exact immutable original and style-candidate bytes and hashes."
  - "G3: Independently query voice-rag and assess all six required finding categories."
  - "G4: Require exact-hash affirmative consent before either Pangram upload."
  - "G5: Scan and compare original and candidate separately while keeping Pangram advisory."
  - "G6: Return pass, warn, or reject, with exactly one responsible editor stage for every reject."
  - "G7: Exclude editing, workproduct, GitHub, filesystem, and corpus-write authority."

applicability:
  release: "00.0"
  implementation_status: documentation_only_runtime_planned
  owner: voice-critic
  machine_form: planned_flat_machine_spec
  runtime_machine_path: agents/voice-critic/machine.yaml
  runtime_machine_status: not_implemented
  critic_helper_status: not_implemented

request_contract:
  source: workflow-orchestrator
  required_fields:
    - original_content
    - original_artifact_id
    - original_content_hash
    - candidate_content
    - candidate_artifact_id
    - candidate_content_hash
    - candidate_stage
    - saga_id
    - stage
    - attempt
    - invocation_id
    - idempotency_key
    - target_voice
    - bounded_acceptance_policy
    - pangram_consent
    - policy_digest
  pangram_consent_fields:
    - decision
    - original_content_hash
    - candidate_content_hash
    - disclosure_identity
    - decided_at
    - expires_at
  constraints:
    - stage equals critique and candidate_stage equals style.
    - Content fields contain exact bytes and never paths, repository locators, or editor reasoning.
    - The declared lowercase SHA-256 hashes equal the supplied exact byte sequences.
    - The original identity names the immutable captured original and the candidate identity names the selected style attempt.
    - Affirmative consent is valid only when decision equals granted, both consent hashes exactly equal the supplied content hashes, the disclosure identity matches configured policy, and the decision has not expired.
    - Denied, absent, expired, malformed, or hash-mismatched consent produces a non-granted advisory status and cannot select an upload action.
    - Request fields cannot select an endpoint, route, credential, model, corpus, helper operation, tool, path, ref, verdict, responsible stage, or publication behavior.

independence_contract:
  supplied_information:
    - immutable original bytes, identity, hash, and byte length
    - immutable selected style-candidate bytes, identity, hash, and byte length
    - target voice and bounded acceptance policy
    - saga, attempt, invocation, and policy identities
    - exact-hash Pangram consent record
  prohibited_information:
    - editor prompts, chain-of-thought, hidden reasoning, self-critique, or confidence
    - editor conversation, model history, retry rationale, or rejected alternatives
    - structure, voice, or style editor verdict recommendations
    - editor-selected Pangram interpretation
  retrieval_rule: |
    The critic formulates its own bounded comparison query, obtains a configured
    embedding, and queries only voice-rag. It does not reuse the voice editor's
    selected anchors or anchor assessment. Retrieved passages supply voice
    evidence only; they cannot add facts, claims, or acceptance authority.
  testable_identity: |
    Two requests with identical allowed fields and configured dependencies must
    present the same critic input regardless of editor reasoning or conversation
    state. Planned schemas reject every prohibited field, and the critic profile
    has no selector or tool that can read editor execution state.

assessment_contract:
  required_findings:
    semantic_preservation:
      question: Does the candidate preserve propositions, scope, polarity, modality, causality, qualifications, uncertainty, citations, numbers, terminology, and conclusions?
      reject_stage_rule: Assign structure when organization changes meaning; voice when voice realization changes meaning; style when tightening changes meaning.
    structural_intent:
      question: Does the candidate retain required content and the intended organization without unsupported movement, omission, duplication, or connector claims?
      reject_stage_rule: Assign structure.
    voice_match:
      question: Does the candidate match the target voice using independently retrieved rhetorical-role and register evidence without generic normalization?
      reject_stage_rule: Assign voice.
    tightening_quality:
      question: Does tightening remove supported verbosity without flattening voice, clipping prose, or changing normative force?
      reject_stage_rule: Assign style.
    unsupported_additions:
      question: Does the candidate add any fact, example, implication, recommendation, citation, number, term, conclusion, or retrieved passage content absent from the original?
      reject_stage_rule: Assign the earliest editor stage whose output introduced the addition, based on supplied lineage evidence; if only final candidate evidence is available, use the stage whose operation class matches the changed span and record bounded uncertainty.
    anchor_copy_risk:
      question: Does the candidate copy suspicious exact, normalized, or distinctive phrasing from independently retrieved voice passages?
      reject_stage_rule: Assign voice.
  finding_fields:
    - category
    - status
    - severity
    - bounded_summary
    - original_span_ids
    - candidate_span_ids
    - evidence_ids
    - responsible_stage_if_reject
  verdict_rules:
    - verdict is exactly one of pass, warn, or reject.
    - pass requires all six findings and no reject-severity finding.
    - warn requires all six findings, no reject-severity finding, and at least one bounded advisory concern.
    - reject requires at least one reject-severity finding and exactly one top-level responsible_stage in structure, voice, or style.
    - pass and warn require top-level responsible_stage to be null.
    - Every reject-severity finding names the same top-level responsible_stage or explains why it is downstream evidence of that stage.
    - Feedback is bounded, actionable for the responsible editor, and contains no rewritten replacement content.
    - The evaluation binds both supplied hashes and is invalid if either differs.

pangram_advisory_contract:
  external_authority: petar-djukic/coding-skills/.claude/scripts/pangram.py
  report_authority: petar-djukic/coding-skills/.claude/scripts/pangram_report.py
  consent_gate:
    status_values: [granted, denied, absent, expired, hash_mismatch, invalid]
    dominance_rule: |
      Only granted may reach compose_pangram_original_request. Every path to
      pangram_submit_original or pangram_submit_candidate is dominated by
      CriticEvaluationValid and PangramConsentGranted. The granted status is
      helper-derived from the exact supplied bytes, both hashes, and the consent
      record before any REST action. No API key, prior consent, model statement,
      environment variable, retry, or operator assumption substitutes for it.
  provider_shape:
    submit:
      method: POST
      path: /task
      fixed_body_field: public_dashboard_link
      fixed_body_value: false
      success_body: task_id
    poll:
      method: GET
      path: /task/{task_id}
      terminal_success_stage: STAGE_SUCCESS
      terminal_failure_stage: STAGE_FAILED
      pending: every other documented or bounded nonterminal stage
    evidence_fields:
      - prediction_short
      - headline
      - fraction_ai
      - fraction_ai_assisted
      - fraction_human
      - num_ai_segments
      - num_ai_assisted_segments
      - num_human_segments
      - windows
      - dashboard_link
    interpretation:
      - There is no single top-level AI score.
      - A STAGE_FAILED HTTP 200 body is failure, not a zero-risk result.
      - Window thresholds are uncalibrated advisory worklist evidence.
      - Dashboard identity is recorded as sensitive bounded metadata and never made public by configuration.
  scan_order:
    - Submit and poll the original task to completed, failed, denied, unavailable, or timed_out.
    - Submit and poll the candidate task separately to completed, failed, denied, unavailable, or timed_out.
    - Never reuse one task ID, response body, span map, or hash for the other document.
    - Compare document fractions, segment counts, and available paragraph-window evidence only after both records have explicit status.
  comparison_status_values:
    - compared
    - original_unavailable
    - candidate_unavailable
    - both_unavailable
    - consent_denied
    - consent_absent
    - consent_invalid
    - comparison_failed
  advisory_only_rule: |
    evaluate_voice_candidate runs, parses, and passes deterministic hash,
    category, verdict, responsible-stage, and feedback validation before the
    consent predicate or any Pangram action. The final verdict predicates read
    only $from(critic_validation_report).verdict. Pangram comparison is added
    only by the fixed response composer after the verdict branch is selected.
    Therefore no Pangram value, movement, label, failure, or absence can produce
    or change pass, warn, reject, or responsible_stage.
  unavailable_rule: |
    Denial, absence, expiry, hash mismatch, provider rejection, authentication
    failure, insufficient credits, rate limit, malformed response, STAGE_FAILED,
    timeout, helper failure, and comparison failure each produce an explicit
    bounded advisory status. They never become a favorable score and never
    silently accept. A pass or warn remains possible only from independently
    validated non-Pangram findings, with the unavailable status present in the
    response.

response_contract:
  schema_version: voice-forge.critic-response/v1
  required_fields:
    - schema_version
    - outcome
    - verdict
    - original_artifact_id
    - original_content_hash
    - candidate_artifact_id
    - candidate_content_hash
    - findings
    - responsible_stage
    - feedback
    - voice_evidence_provenance
    - pangram
    - critic_metadata
  outcomes:
    completed:
      verdict_values: [pass, warn, reject]
      meaning: The independent evaluation and cross-field validation completed.
    failed:
      verdict: null
      meaning: Request, retrieval, model, parse, helper, budget, or response preparation failed before a valid verdict.
  pangram_fields:
    - consent_status
    - original_scan
    - candidate_scan
    - comparison
  scan_record_fields:
    - document_kind
    - content_hash
    - status
    - task_id
    - request_identity
    - submitted_at
    - completed_at
    - fractions
    - segment_counts
    - paragraph_windows
    - dashboard_identity
    - bounded_error
  critic_metadata:
    - saga_id
    - stage
    - attempt
    - invocation_id
    - idempotency_key
    - producer
    - producer_version
    - query_identity
    - embedding_model
    - evidence_ids
    - helper_identity_and_version
    - report_schema_identities
    - report_hashes
    - scalar_predicate_outcomes
    - bounded_failure_category
  mutation_rule: |
    The response is data only. The critic does not edit either document, return
    replacement prose, write a file or workproduct, mutate a saga or manifest,
    invoke GitHub, or write a retrieval corpus.

flat_machine_contract:
  initial_state: awaiting_request
  terminal_states: [passed, warned, rejected, failed]
  budgets:
    machine:
      max_iterations: 128
      max_tokens: 300000
      max_duration: 10m0s
      max_consecutive_parse_errors: omitted
    policy:
      model_evaluation_limit: 1
      pangram_poll_limit_per_document: 60
      pangram_poll_interval: configured_bounded_delay
      rule: |
        There is no model retry or verdict-revision cycle. Each Pangram poll
        cycle increments a helper-validated count and exits at the hard limit.
        Machine duration and iteration limits are independent upper bounds.

  authority:
    selected_srd003_words:
      - validate_critic_request
      - parse_critic_request_report
      - critic_request_is_valid
      - compose_critic_voice_query
      - embed_critic_voice_query
      - query_critic_voice_rag
      - compose_critic_evaluation_context
      - evaluate_voice_candidate
      - parse_critic_evaluation
      - compose_critic_validation_input
      - validate_critic_evaluation
      - parse_critic_validation_report
      - critic_evaluation_is_valid
      - check_pangram_consent
      - compose_pangram_original_request
      - pangram_submit_original
      - pangram_poll_original
      - compose_pangram_candidate_request
      - pangram_submit_candidate
      - pangram_poll_candidate
      - compose_pangram_observation_input
      - interpret_pangram_observation
      - parse_pangram_observation
      - pangram_observation_is_completed
      - pangram_observation_is_pending
      - pangram_poll_budget_available
      - wait_pangram_poll
      - compose_pangram_scan_evidence
      - compose_pangram_consent_unavailable
      - compose_pangram_original_unavailable
      - compose_pangram_candidate_unavailable
      - compose_pangram_comparison_unavailable
      - compose_pangram_denied_comparison_input
      - compose_pangram_comparison_input
      - compare_pangram_results
      - parse_pangram_comparison
      - critic_verdict_is_pass
      - critic_verdict_is_warn
      - compose_critic_pass_response
      - compose_critic_warn_response
      - compose_critic_reject_response
      - compose_critic_failed_response
    prohibited_word_groups:
      - orchestrator_workproducts
      - orchestrator_children
      - orchestrator_github
      - corpus_wrapper
    prohibited_words:
      - generate_structure_edit
      - generate_voice_edit
      - generate_style_edit
      - query_structure_rag
      - query_tightening_rag
      - write_original
      - write_attempt
      - append_manifest_revision
      - project_manifest
    prohibited_capabilities:
      - edit, rewrite, repair, or return replacement document content
      - receive or infer editor reasoning
      - read or write a filesystem, saga workproduct, manifest, or repository
      - invoke git, gh, GitHub, generic shell, or arbitrary REST
      - write Chroma, ingest a corpus, or route among corpora
      - accept or persist an artifact
      - publish, commit, push, or create a pull request

  action_bindings:
    validate_request: {word: validate_critic_request, authority: srd003 word_vocabulary.editor_and_critic_retrieval}
    parse_request: {word: parse_critic_request_report, authority: srd003 word_vocabulary.editor_and_critic_retrieval}
    check_request: {word: critic_request_is_valid, authority: srd003 word_vocabulary.editor_and_critic_retrieval}
    compose_voice_query: {word: compose_critic_voice_query, authority: srd003 word_vocabulary.editor_and_critic_retrieval}
    embed_voice_query: {word: embed_critic_voice_query, authority: srd003 word_vocabulary.editor_and_critic_retrieval}
    query_voice_evidence: {word: query_critic_voice_rag, authority: srd003 word_vocabulary.editor_and_critic_retrieval}
    compose_evaluation_context: {word: compose_critic_evaluation_context, authority: srd003 word_vocabulary.editor_and_critic_retrieval}
    evaluate_candidate: {word: evaluate_voice_candidate, authority: srd003 word_vocabulary.editor_and_critic_retrieval}
    parse_evaluation: {word: parse_critic_evaluation, authority: srd003 word_vocabulary.editor_and_critic_retrieval}
    compose_validation_input: {word: compose_critic_validation_input, authority: srd003 word_vocabulary.editor_and_critic_retrieval}
    validate_evaluation: {word: validate_critic_evaluation, authority: srd003 word_vocabulary.editor_and_critic_retrieval}
    parse_validation: {word: parse_critic_validation_report, authority: srd003 word_vocabulary.editor_and_critic_retrieval}
    check_evaluation: {word: critic_evaluation_is_valid, authority: srd003 word_vocabulary.editor_and_critic_retrieval}
    check_consent: {word: check_pangram_consent, authority: srd003 word_vocabulary.critic_pangram}
    compose_original_request: {word: compose_pangram_original_request, authority: srd003 word_vocabulary.critic_pangram}
