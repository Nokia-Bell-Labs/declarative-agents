# Reserved for the live tier (mage integration:applierLive): a schema-conforming
# values patch that repoints the collector image at a name never loaded into the
# kind node. The dry-run validate step accepts it (the image reference is
# schema-valid, only unpullable), the apply re-renders the collector Deployment with
# it, and -- because the installed collector image pullPolicy is Never -- the new
# ReplicaSet's pod is ErrImageNeverPull and never becomes ready. The applier's
# kubectl rollout status of the collector times out, the apply machine reaches
# RolledBack, and the applier runs a real helm rollback that restores the prior
# collector image. The fake-based integration:applier tracer does not read this
# file; it is the on-cluster rollback trigger the live target feeds.
collector:
  image:
    repository: invalid.local/agent-architecture-rollback-trigger
    tag: missing
