tools:
  - name: query_list_traces
    type: builtin
    init: spool_list_traces
    category: boundary
    visibility: internal
    emits: [TracesListed, CommandError]
    description: Read paginated trace summaries from the collector spool.
    problem: A trace list view needs bounded summary reads without a separate query backend.
    goals: [Return paginated summaries sorted by recency, Cap page size in config]
    requirements:
      input: [Path and page defaults come from trusted config; page_size and offset may come from the request seed]
      output: [Output includes traces, total, offset, page_size, skipped_lines]
      errors: [An unreadable spool emits CommandError]
    non_goals: [Does not expose raw span payloads]
    parameters: {type: object, properties: {}}
    output:
      description: Paginated trace summaries.
      schema:
        type: object
        properties:
          traces: {type: array}
          total: {type: integer}
          offset: {type: integer}
          page_size: {type: integer}
          skipped_lines: {type: integer}
    side_effects:
      - {kind: filesystem_read, target: collector trace spool, state: read_only}
    reversibility: {classification: reversible}
    undo: {strategy: noop, description: Reading a spool changes nothing.}
    errors:
      - {signal: CommandError, condition: spool path cannot be read, state_after_failure: no output is returned}
    config:
      path: ${COLLECTOR_SPOOL_PATH:-traces/collector.ndjson}
      page_size: 20
      max_page_size: 100
      offset: 0

  - name: query_get_trace
    type: builtin
    init: spool_get_trace
    category: boundary
    visibility: internal
    emits: [TraceRetrieved, CommandError]
    description: Read all spans for one trace from the collector spool.
    problem: A trace waterfall view needs per-span records with timing and parent linkage.
    goals: [Return all spans for one trace id, Read across active and rotated spool files]
    requirements:
      input: [Path comes from trusted config; trace_id comes from the request seed]
      output: [Output includes trace_id, spans, span_count, skipped_lines]
      errors: [An unreadable spool or missing trace_id emits CommandError]
    non_goals: [Does not filter or mutate spans]
    parameters: {type: object, properties: {}}
    output:
      description: All spans for one trace.
      schema:
        type: object
        properties:
          trace_id: {type: string}
          spans: {type: array}
          span_count: {type: integer}
          skipped_lines: {type: integer}
    side_effects:
      - {kind: filesystem_read, target: collector trace spool, state: read_only}
    reversibility: {classification: reversible}
    undo: {strategy: noop, description: Reading a spool changes nothing.}
    errors:
      - {signal: CommandError, condition: spool path cannot be read or trace_id is empty, state_after_failure: no output is returned}
    config:
      path: ${COLLECTOR_SPOOL_PATH:-traces/collector.ndjson}
      trace_id: ""

  - name: query_list_metrics
    type: builtin
    init: spool_list_metrics
    category: boundary
    visibility: internal
    emits: [MetricsListed, CommandError]
    description: Read paginated metric summaries from the collector metric spool.
    problem: A metric list view needs bounded per-name summary reads without a separate query backend.
    goals: [Return paginated summaries by metric name, Cap page size in config]
    requirements:
      input: [Path and page defaults come from trusted config; page_size and offset may come from the request seed]
      output: [Output includes metrics, total, offset, page_size, skipped_lines]
      errors: [An unreadable spool emits CommandError]
    non_goals: [Does not expose raw data-point payloads on the monitor surface]
    parameters: {type: object, properties: {}}
    output:
      description: Paginated metric summaries.
      schema:
        type: object
        properties:
          metrics: {type: array}
          total: {type: integer}
          offset: {type: integer}
          page_size: {type: integer}
          skipped_lines: {type: integer}
    side_effects:
      - {kind: filesystem_read, target: collector metric spool, state: read_only}
    reversibility: {classification: reversible}
    undo: {strategy: noop, description: Reading a spool changes nothing.}
    errors:
      - {signal: CommandError, condition: spool path cannot be read, state_after_failure: no output is returned}
    config:
      path: ${COLLECTOR_METRICS_SPOOL_PATH:-metrics/collector.ndjson}
      page_size: 20
      max_page_size: 100
      offset: 0

  - name: query_get_metric
    type: builtin
    init: spool_get_metric
    category: boundary
    visibility: internal
    emits: [MetricRetrieved, CommandError]
    description: Read one bounded page of spooled records for a metric name.
    problem: A long-lived metric spool grows without bound, so an unpaginated detail response eventually exceeds the REST response-size limit.
    goals: [Return paginated records for one metric name, Cap page size in config, Read across active and rotated spool files]
    requirements:
      input: [Path and page defaults come from trusted config; metric_name, page_size, and offset may come from the request seed]
      output: [Output includes metric_name, records, total, record_count, page_record_count, data_point_count, offset, page_size, skipped_lines; each record includes unchanged decoded resource attributes such as service.name and test.run.id]
      errors: [An unreadable spool or missing metric_name emits CommandError]
    non_goals: [Does not aggregate across metric names or mutate records]
    parameters: {type: object, properties: {}}
    output:
      description: One bounded page plus total counts for one metric name.
      schema:
        type: object
        properties:
          metric_name: {type: string}
          records:
            type: array
            items:
              type: object
              properties:
                name: {type: string}
                type: {type: string}
                unit: {type: string}
                data_point_count: {type: integer}
                service: {type: string}
                resource:
                  type: array
                  description: Decoded OTLP resource attributes preserved unchanged from the spool record, including service.name and test.run.id when present.
                  items:
                    type: object
                    properties:
                      Key: {type: string}
                      Value: {type: object}
                    required: [Key, Value]
                metric: {type: object}
              required: [name, type, unit, data_point_count, service, resource, metric]
          record_count: {type: integer}
          page_record_count: {type: integer}
          total: {type: integer}
          data_point_count: {type: integer}
          offset: {type: integer}
          page_size: {type: integer}
          skipped_lines: {type: integer}
    side_effects:
      - {kind: filesystem_read, target: collector metric spool, state: read_only}
    reversibility: {classification: reversible}
    undo: {strategy: noop, description: Reading a spool changes nothing.}
    errors:
      - {signal: CommandError, condition: spool path cannot be read or metric_name is empty, state_after_failure: no output is returned}
    config:
      path: ${COLLECTOR_METRICS_SPOOL_PATH:-metrics/collector.ndjson}
      metric_name: ""
      page_size: 20
      max_page_size: 100
      offset: 0

  - name: query_span_heatmap
    type: builtin
    init: spool_span_heatmap
    category: boundary
    visibility: internal
    emits: [SpanHeatmapReady, CommandError]
    description: Filter spooled spans and return a duration heatmap.
    problem: An Explore panel needs an aggregate latency view over the trace spool without coupling it to categorical aggregation.
    goals: [Bucket filtered spans into a duration-over-time heatmap]
    requirements:
      input: [Path and bucket shape come from trusted config; the filter and time_buckets come from the request seed]
      output: [Output includes heatmap, matched, exemplar_trace_ids, and skipped_lines]
      errors: [An unreadable spool emits CommandError]
    non_goals: [Does not mutate spans, Does not depend on an environment variable it introduces]
    parameters: {type: object, properties: {}}
    output:
      description: A duration heatmap over filtered spans.
      schema:
        type: object
        properties:
          heatmap: {type: object}
          matched: {type: integer}
          exemplar_trace_ids: {type: array}
          skipped_lines: {type: integer}
    side_effects:
      - {kind: filesystem_read, target: collector trace spool, state: read_only}
    reversibility: {classification: reversible}
    undo: {strategy: noop, description: Reading a spool changes nothing.}
    errors:
      - {signal: CommandError, condition: spool path cannot be read, state_after_failure: no output is returned}
    config:
      path: ${COLLECTOR_SPOOL_PATH:-traces/collector.ndjson}
      time_buckets: 24
      duration_edges_ms: [0, 1, 10, 50, 100, 500, 1000, 5000]
      exemplar_cap: 20

  - name: query_span_group_by
    type: builtin
    init: spool_span_group_by
    category: boundary
    visibility: internal
    emits: [SpanGroupByReady, CommandError]
    description: Filter spooled spans and count them by one requested key.
    problem: An Explore panel needs a bounded categorical breakdown independent of its heatmap.
    goals: [Count filtered spans grouped by an attribute with a reported dropped remainder]
    requirements:
      input: [Path and caps come from trusted config; the filter, group_by, and top_n come from the request seed]
      output: [Output includes matched, exemplar_trace_ids, groups, dropped_groups, dropped_span_total, and skipped_lines]
      errors: [A missing group_by or unreadable spool emits CommandError]
    non_goals: [Does not compute a heatmap, Does not mutate spans]
    parameters: {type: object, properties: {}}
    output:
      description: Bounded group-by counts over filtered spans.
      schema:
        type: object
        properties:
          matched: {type: integer}
          exemplar_trace_ids: {type: array}
          skipped_lines: {type: integer}
          group_by: {type: string}
          groups: {type: array}
          dropped_groups: {type: integer}
          dropped_span_total: {type: integer}
    side_effects:
      - {kind: filesystem_read, target: collector trace spool, state: read_only}
    reversibility: {classification: reversible}
    undo: {strategy: noop, description: Reading a spool changes nothing.}
    errors:
      - {signal: CommandError, condition: group_by is missing or spool path cannot be read, state_after_failure: no output is returned}
    config:
      path: ${COLLECTOR_SPOOL_PATH:-traces/collector.ndjson}
      group_by: ""
      top_n: 20
      max_top_n: 100
      exemplar_cap: 20

  - name: span_group_by_requested
    type: builtin
    init: value_predicate
    category: word
    visibility: internal
    emits: [SpanGroupByRequested, SpanHeatmapOnly, CommandError]
    description: Branch on whether the stats request selected a group-by key.
    problem: The query machine must declare whether it dispatches one analysis or both.
    goals: [Keep optional group-by execution as a visible machine branch.]
    requirements:
      input: [Read group_by from the labeled request seed.]
      output: [Emit distinct signals for requested and omitted grouping.]
      errors: [A broken selector emits CommandError.]
    non_goals: [Does not compute or mutate analytics.]
    parameters: {type: object, properties: {}, additionalProperties: false}
    output: {description: Group-by selection predicate, schema: {type: object}}
    side_effects: []
    reversibility: {classification: reversible}
    undo: {strategy: noop, description: Comparison changes nothing.}
    errors: [{signal: CommandError, condition: selector cannot resolve, state_after_failure: No analytics are dispatched.}]
    config:
      left: $from(seed).parameters.group_by
      op: non_empty
      operand_type: string
      satisfied: SpanGroupByRequested
      unsatisfied: SpanHeatmapOnly

  - name: compose_span_stats
    type: builtin
    init: compose
    category: response
    visibility: internal
    emits: [SpanStatsReady]
    description: Compose independent heatmap and group-by results into the stable HTTP response.
    problem: The existing Explore endpoint returns both declared analyses in one response.
    goals: [Preserve the response schema while keeping each analysis independently dispatchable.]
    requirements:
      input: [Heatmap and group-by steps are available by authored labels.]
      output: [Output contains both analysis payloads without recomputation.]
      errors: [Missing selectors are reported as diagnostics.]
    non_goals: [Does not read the spool or compute analytics.]
    parameters: {type: object, properties: {}, additionalProperties: false}
    output: {description: Combined Explore statistics response, schema: {type: object}}
    side_effects: []
    reversibility: {classification: reversible}
    undo: {strategy: noop, description: Composition changes nothing.}
    errors: [{signal: CommandError, condition: Composition fails, state_after_failure: No state changes.}]
    config:
      signal: SpanStatsReady
      inputs:
        heatmap: $from(span_heatmap).heatmap
        matched: $from(span_heatmap).matched
        exemplar_trace_ids: $from(span_heatmap).exemplar_trace_ids
        skipped_lines: $from(span_heatmap).skipped_lines
        group_by: $from(span_group_by).group_by
        groups: $from(span_group_by).groups
        dropped_groups: $from(span_group_by).dropped_groups
        dropped_span_total: $from(span_group_by).dropped_span_total
      template: '{"heatmap":{{ json heatmap }},"matched":{{ matched }},"exemplar_trace_ids":{{ json exemplar_trace_ids }},"skipped_lines":{{ skipped_lines }},"group_by":{{ json group_by }},"groups":{{ json groups }},"dropped_groups":{{ dropped_groups }},"dropped_span_total":{{ dropped_span_total }}}'

  - name: compose_span_heatmap
    type: builtin
    init: compose
    category: response
    visibility: internal
    emits: [SpanStatsReady]
    description: Compose a heatmap-only analysis into the stable HTTP response.
    problem: Requests without group_by must not dispatch categorical aggregation.
    goals: [Preserve the response schema with an explicit empty group result.]
    requirements:
      input: [The heatmap step is available by its authored label.]
      output: [Group fields are explicit empty values.]
      errors: [Missing selectors are reported as diagnostics.]
    non_goals: [Does not read the spool or compute group counts.]
    parameters: {type: object, properties: {}, additionalProperties: false}
    output: {description: Heatmap-only Explore statistics response, schema: {type: object}}
    side_effects: []
    reversibility: {classification: reversible}
    undo: {strategy: noop, description: Composition changes nothing.}
    errors: [{signal: CommandError, condition: Composition fails, state_after_failure: No state changes.}]
    config:
      signal: SpanStatsReady
      inputs:
        heatmap: $from(span_heatmap).heatmap
        matched: $from(span_heatmap).matched
        exemplar_trace_ids: $from(span_heatmap).exemplar_trace_ids
        skipped_lines: $from(span_heatmap).skipped_lines
      template: '{"heatmap":{{ json heatmap }},"matched":{{ matched }},"exemplar_trace_ids":{{ json exemplar_trace_ids }},"skipped_lines":{{ skipped_lines }},"group_by":"","groups":[],"dropped_groups":0,"dropped_span_total":0}'

  - name: query_span_breakdown
    type: builtin
    init: spool_span_breakdown
    category: boundary
    visibility: internal
    emits: [SpanBreakdownReady, CommandError]
    description: Rank the attributes that distinguish a selected span region from its complement.
    problem: After spotting a slow region an operator needs to know which attribute values explain it.
    goals: [Partition a baseline into a selection and its complement, Rank attribute values by concentration inside the selection]
    requirements:
      input: [Path and caps come from trusted config; the baseline and selection filters and top_n come from the request seed]
      output: [Output includes inside_total, outside_total, exemplar_trace_ids, ranked, dropped, skipped_lines]
      errors: [An unreadable spool emits CommandError]
    non_goals: [Does not mutate spans, Does not depend on an environment variable it introduces]
    parameters: {type: object, properties: {}}
    output:
      description: The ranked attribute divergence between the selection and its complement.
      schema:
        type: object
        properties:
          inside_total: {type: integer}
          outside_total: {type: integer}
          exemplar_trace_ids: {type: array}
          ranked: {type: array}
          dropped: {type: integer}
          skipped_lines: {type: integer}
    side_effects:
      - {kind: filesystem_read, target: collector trace spool, state: read_only}
    reversibility: {classification: reversible}
    undo: {strategy: noop, description: Reading a spool changes nothing.}
    errors:
      - {signal: CommandError, condition: spool path cannot be read, state_after_failure: no output is returned}
    config:
      path: ${COLLECTOR_SPOOL_PATH:-traces/collector.ndjson}
      top_n: 20
      max_top_n: 100
      exemplar_cap: 20
