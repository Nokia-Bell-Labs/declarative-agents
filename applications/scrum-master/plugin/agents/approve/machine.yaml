name: approve
purpose: |-
  Approve an issue's branch for merge as a reviewer other than its
  assignee (srd041): the approval is a comment on the issue, naming the
  branch's tip. Use when a person asks to approve or review-approve an
  issue's branch.

  This machine has no model state: scrum-master issue approve (design.md
  D10, D14; GH-37). SCRUM_MASTER_PROJECT and SCRUM_MASTER_ISSUE name the issue.
configuration:
  machine: plugin/agents/approve/machine.yaml
  tools: plugin/agents/approve/tools.yaml
invariants:
- Every step is a word; no model acts anywhere in this machine
- A refusal ends the run in the state that names it, with the word's reason
lifecycle: |-
  1. Idle → Approve (Seed): scrum-master issue approve
  2. Approve → Done (ToolDone)
initial_state: Idle
budget:
  command_timeout: 16m
  max_iterations: 10
states:
- name: Idle
  meaning: Initial state before the first word.
- name: Approve
  meaning: |
    The approve word: scrum-master issue approve records the reviewer's
    approval of the branch's tip; the assignee cannot approve their own
    branch.
- name: Done
  run_status: succeeded
  meaning: |
    Terminal. Every word ran, and the last one reported what it did.
- name: Refused
  run_status: failed
  meaning: |
    Terminal. The approval was refused — the reviewer is the assignee, or
    the branch has no tip to approve — and the word's reason is the run's
    last output.
- name: Failed
  run_status: failed
  meaning: Terminal. An infrastructure error outside the words' refusals.
terminal_states:
- Done
- Refused
- Failed
signals:
- name: Seed
  trigger: Loop initialization.
- name: ToolDone
  trigger: A word executed successfully.
- name: ToolFailed
  trigger: A word reported failure — a refusal with its reason.
- name: CommandError
  trigger: Infrastructure-level error (not a tool failure).
transitions:
- state: Idle
  signal: Seed
  next: Approve
  action: approve
  summary: true
- state: Approve
  signal: ToolFailed
  next: Refused
- state: Approve
  signal: ToolDone
  next: Done
- state: Idle
  signal: CommandError
  next: Failed
- state: Approve
  signal: CommandError
  next: Failed
