image:
  repository: declarative-agents/coding-agent-smoke
  # mage integration:helmSmoke always overrides this fail-closed sentinel with
  # the tested checkout's 12-character commit revision.
  tag: must-be-overridden-with-git-revision
  pullPolicy: Never

workspace:
  existingClaim: coding-agent-kind-workspace

ollama:
  enabled: false

llm:
  externalURL: http://coding-model:11434

# kind loads images from the local daemon and pulls nothing (chartconf R3). The
# executor tool donor's loaded tag is wired by the one-image smoke (GH-2496);
# here we only fix its pull policy to Never so the kind overlay conforms.
executorTools:
  image:
    pullPolicy: Never

collector:
  image:
    pullPolicy: Never
  resources:
    requests: {cpu: 25m, memory: 64Mi}
    limits: {cpu: 250m, memory: 256Mi}

roles:
  planner:
    resources:
      requests: {cpu: 25m, memory: 64Mi}
      limits: {cpu: "1", memory: 1Gi}
  executor:
    resources:
      requests: {cpu: 50m, memory: 128Mi}
      limits: {cpu: "2", memory: 2Gi}
  critic:
    resources:
      requests: {cpu: 25m, memory: 64Mi}
      limits: {cpu: "1", memory: 1Gi}
