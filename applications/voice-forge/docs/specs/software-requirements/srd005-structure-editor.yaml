id: srd005-structure-editor
title: Structure Editor State Machine
status: specified

problem: |
  Voice Forge needs a flat request machine that improves section and outline
  structure without acquiring voice, style, criticism, publication, or
  workproduct authority. A structure editor that edits before retrieval can
  substitute generic model preferences for corpus evidence. An editor that
  rewrites freely can change claims, citations, numbers, qualifications, or
  required content while appearing to make only a structural change.

  Agent-core MachineSpec branches on signals, not result payload fields.
  Therefore grounding, the one permitted refinement, semantic-constraint
  validation, and terminal response outcomes need bounded deterministic signals
  in the srd003 word contracts. This SRD defines that signal-complete machine
  while leaving all runtime declarations and evidence planned.

goals:
  - "G1: Define one flat declarative request machine from supplied parent content to a structured response."
  - "G2: Make section or outline retrieval a structural prerequisite for every successful edit."
  - "G3: Permit at most one deterministic query refinement when grounding is insufficient."
  - "G4: Restrict edits to structure while preserving semantic and required-content constraints."
  - "G5: Return content, retrieval provenance, and stage metadata without filesystem mutation."
  - "G6: Exclude voice, style, critic, Pangram, GitHub, workproduct, and acceptance authority."

applicability:
  release: "00.0"
  implementation_status: documentation_only_runtime_planned
  owner: structure-editor
  machine_form: planned_flat_machine_spec
  runtime_machine_path: agents/structure-editor/machine.yaml
  runtime_machine_status: not_implemented

request_contract:
  source: workflow-orchestrator
  accepted_parent_kinds: [original, retry_parent]
  required_fields:
    - parent_content
    - parent_artifact_id
    - parent_content_hash
    - saga_id
    - stage
    - attempt
    - invocation_id
    - idempotency_key
    - bounded_structure_intent
    - required_content_inventory
    - policy_digest
  constraints:
    - stage equals structure.
    - parent_content contains bytes, never a filesystem path or repository locator.
    - A fresh structure attempt uses the immutable original as parent.
    - A retry uses the orchestrator-selected retry parent recorded by the saga contract.
    - Request fields cannot select endpoints, models, collections, tools, paths, refs, credentials, or publication behavior.

flat_machine_contract:
  initial_state: awaiting_request
  terminal_states: [succeeded, no_op, insufficient_grounding, failed]

  budgets:
    machine:
      max_iterations: 32
      max_tokens: 200000
      max_duration: 5m0s
      max_consecutive_parse_errors: omitted
    policy:
      query_refinement_limit: 1
      generation_limit: 1
      rule: |
        Refinement count starts at zero. StructureGroundingRefinementAllowed is
        valid only at count zero. The refined query sets count one, after which
        insufficient evidence emits StructureGroundingInsufficient. No transition
        returns from editing or validation to retrieval or generation.

  authority:
    selected_srd003_words:
      - validate_structure_request
      - formulate_structure_query
      - embed_structure_query
      - query_structure_rag
      - assess_structure_grounding
      - generate_structure_edit
      - validate_structure_constraints
      - compose_structure_response
    prohibited_word_groups:
      - orchestrator_workproducts
      - orchestrator_children
      - orchestrator_github
      - critic_pangram
      - corpus_wrapper
      - lifecycle
    prohibited_words:
      - embed_voice_query
      - query_voice_rag
      - generate_voice_edit
      - embed_tightening_query
      - query_tightening_rag
      - generate_style_edit
      - embed_critic_voice_query
      - query_critic_voice_rag
      - evaluate_voice_candidate
    prohibited_capabilities:
      - read or write a filesystem or saga workproduct
      - select a voice, imitate an exemplar, or perform style tightening
      - issue a critic verdict or accept an artifact
      - invoke Pangram
      - invoke git, gh, GitHub, generic shell, or arbitrary REST
      - write Chroma or select another retrieval corpus
      - publish, commit, persist, or return a workspace path

  action_bindings:
    validate_request: {word: validate_structure_request, authority: srd003 word_vocabulary.editor_and_critic_retrieval}
    formulate_query: {word: formulate_structure_query, authority: srd003 word_vocabulary.editor_and_critic_retrieval}
    embed_query: {word: embed_structure_query, authority: srd003 word_vocabulary.editor_and_critic_retrieval}
    retrieve_structure: {word: query_structure_rag, authority: srd003 word_vocabulary.editor_and_critic_retrieval}
    assess_grounding: {word: assess_structure_grounding, authority: srd003 word_vocabulary.editor_and_critic_retrieval}
    edit_structure: {word: generate_structure_edit, authority: srd003 word_vocabulary.editor_and_critic_retrieval}
    validate_constraints: {word: validate_structure_constraints, authority: srd003 word_vocabulary.editor_and_critic_retrieval}
    return_response: {word: compose_structure_response, authority: srd003 word_vocabulary.editor_and_critic_retrieval}

  states:
    - {name: awaiting_request, meaning: Initial state; accepts one orchestrator-supplied request seed.}
    - {name: validating_request, meaning: Validate parent bytes, identities, intent, inventory, and forbidden fields.}
    - {name: formulating_query, meaning: Compose an initial or once-refined section-and-outline query deterministically.}
    - {name: embedding_query, meaning: Embed the formulated query through the configured structure embedding word.}
    - {name: querying_structure_rag, meaning: Query only structure-rag with the provider-produced vector.}
    - {name: assessing_grounding, meaning: Apply deterministic evidence sufficiency and refinement-count predicates.}
    - {name: editing_structure, meaning: Generate one evidence-grounded structure-only candidate.}
    - {name: validating_constraints, meaning: Compare candidate, source-span ledger, and protected content against the parent.}
    - {name: composing_response, meaning: Compose the bounded content, provenance, outcome, and stage envelope.}
    - {name: succeeded, meaning: Terminal; a validated structural edit is returned for orchestrator review.}
    - {name: no_op, meaning: Terminal; unchanged parent content is returned because no valid structural change was needed.}
    - {name: insufficient_grounding, meaning: Terminal; unchanged parent content is returned after two insufficient retrieval attempts.}
    - {name: failed, meaning: Terminal; no candidate is returned as a successful edit.}

  signal_classes:
    seed: [SeedRequest]
    domain:
      - StructureRequestRejected
      - StructureQueryFormulationRejected
      - StructureQueryRejected
      - QueryRejected
      - StructureEvidenceInsufficient
      - StructureGroundingRefinementAllowed
      - StructureGroundingInsufficient
      - StructureEditNoOp
      - StructureEditDeclined
      - StructureSemanticConstraintsFailed
    success:
      - StructureRequestValid
      - StructureQueryFormulated
      - StructureQueryEmbedded
      - StructureEvidenceReady
      - StructureGroundingSufficient
      - StructureEditGenerated
      - StructureEditValid
      - StructureResponseSucceeded
      - StructureResponseNoOp
      - StructureResponseInsufficientGrounding
      - StructureResponseFailed
    infrastructure: [CommandError, BudgetExhausted]
    deterministic_refinements:
      authority: srd003-writing-agent-tools R4.5
      signals:
        - StructureGroundingSufficient
        - StructureGroundingRefinementAllowed
        - StructureGroundingInsufficient
        - StructureEditValid
        - StructureEditNoOp
        - StructureSemanticConstraintsFailed
        - StructureResponseSucceeded
        - StructureResponseNoOp
        - StructureResponseInsufficientGrounding
        - StructureResponseFailed
      constraints:
        - Routing reads configured predicates, validated identities, evidence metadata, protected-content comparison, and bounded counters only.
        - Routing cannot inspect prose to choose a tool, corpus, model, authority, or acceptance outcome.

  transition_contract:
    notation: |
      Each row is one required MachineSpec transition. A slash-separated signal
      expands to one transition per signal with the same next state and action.
      return_response selects an outcome enum from the fixed transition family;
      compose_structure_response emits the corresponding terminal signal.
    request_query_and_retrieval:
      - {from: awaiting_request, on: SeedRequest, to: validating_request, action: validate_request}
      - {from: validating_request, on: StructureRequestValid, to: formulating_query, action: formulate_query}
      - {from: formulating_query, on: StructureQueryFormulated, to: embedding_query, action: embed_query}
      - {from: embedding_query, on: StructureQueryEmbedded, to: querying_structure_rag, action: retrieve_structure}
      - {from: querying_structure_rag, on: StructureEvidenceReady/StructureEvidenceInsufficient, to: assessing_grounding, action: assess_grounding}
      - {from: assessing_grounding, on: StructureGroundingRefinementAllowed, to: formulating_query, action: formulate_query}
      - {from: assessing_grounding, on: StructureGroundingSufficient, to: editing_structure, action: edit_structure}
      - {from: assessing_grounding, on: StructureGroundingInsufficient, to: composing_response, action: return_response, outcome: insufficient_grounding}
    edit_validation_and_response:
      - {from: editing_structure, on: StructureEditGenerated, to: validating_constraints, action: validate_constraints}
      - {from: editing_structure, on: StructureEditNoOp, to: composing_response, action: return_response, outcome: no_op}
      - {from: editing_structure, on: StructureEditDeclined, to: composing_response, action: return_response, outcome: failed}
      - {from: validating_constraints, on: StructureEditValid, to: composing_response, action: return_response, outcome: succeeded}
      - {from: validating_constraints, on: StructureEditNoOp, to: composing_response, action: return_response, outcome: no_op}
      - {from: validating_constraints, on: StructureSemanticConstraintsFailed, to: composing_response, action: return_response, outcome: failed}
      - {from: composing_response, on: StructureResponseSucceeded, to: succeeded, action: none}
      - {from: composing_response, on: StructureResponseNoOp, to: no_op, action: none}
      - {from: composing_response, on: StructureResponseInsufficientGrounding, to: insufficient_grounding, action: none}
      - {from: composing_response, on: StructureResponseFailed, to: failed, action: none}
    failure:
      domain_to_failed_response:
        - {from: validating_request, on: StructureRequestRejected}
        - {from: formulating_query, on: StructureQueryFormulationRejected}
        - {from: embedding_query, on: StructureQueryRejected}
        - {from: querying_structure_rag, on: QueryRejected}
      rule: Every listed domain signal routes to composing_response with return_response and outcome failed.
      infrastructure_rule: |
        CommandError or BudgetExhausted from validating_request,
        formulating_query, embedding_query, querying_structure_rag,
        assessing_grounding, editing_structure, or validating_constraints routes
        to composing_response with return_response and outcome failed.
        CommandError or BudgetExhausted in composing_response routes directly to
        failed with no action.

structural_edit_contract:
  retrieval_units: [section_record, outline_record]
  allowed_operations:
    - Reorder complete supplied sections or bounded source spans.
    - Combine adjacent supplied material while retaining every source span.
    - Separate supplied material at declared span boundaries.
    - Add only configured bounded structural connector text when exact movement requires it.
  preservation_invariants:
    - Every source claim remains present with the same meaning and qualification.
    - Every citation marker and citation-to-claim association remains present.
    - Every number, unit, equation, date, threshold, and quantitative comparator remains unchanged.
    - Every hedge, limitation, exception, condition, and uncertainty remains attached to its claim.
    - Every required-content inventory item remains present exactly once or at its declared multiplicity.
    - Diction outside bounded structural connectors remains byte-identical; connector changes are minimized and recorded.
    - No retrieved chunk text becomes document content unless it was already present in the parent.
  validation_method: |
    generate_structure_edit returns candidate bytes plus a source-span and
    structure-operation ledger. validate_structure_constraints deterministically
    compares parent identity, span coverage and multiplicity, protected tokens,
    claim and qualification bindings, required-content inventory, and connector
    changes. A failed predicate rejects the candidate; it never repairs or
    accepts it.

grounding_contract:
  sufficiency_inputs:
    - configured distance and result-count predicates
    - embedding-model identity equality
    - section or outline record type
    - repository, path, commit, and chunk metadata completeness
    - query identity and refinement count
  provenance_per_chunk:
    - source_repository
    - source_path
    - source_commit
    - chunk_id
    - record_type
    - distance
    - embedding_model
    - query_identity
    - retrieval_attempt
  refinement: |
    The first insufficient assessment may emit
    StructureGroundingRefinementAllowed. formulate_structure_query then uses only
    the validated intent and bounded prior evidence metadata to form query one.
    The next insufficient assessment emits StructureGroundingInsufficient.
    Retrieval failure, rejection, or insufficient grounding never reaches
    editing_structure.

response_contract:
  required_fields:
    - outcome
    - content
    - parent_artifact_id
    - parent_content_hash
    - retrieval_provenance
    - stage_metadata
  outcomes:
    succeeded:
      content: validated candidate bytes
      meaning: A grounded structure-only candidate passed all constraints; the orchestrator still owns artifact acceptance.
    no_op:
      content: unchanged parent bytes
      meaning: No supported improvement was needed or candidate bytes equal the parent.
    insufficient_grounding:
      content: unchanged parent bytes
      meaning: Initial and refined retrieval both failed configured grounding sufficiency.
    failed:
      content: unchanged parent bytes when the request was valid, otherwise explicit null
      meaning: Validation, provider, retrieval, generation, constraint, budget, or response preparation failed.
  stage_metadata:
    - saga_id
    - stage
    - attempt
    - invocation_id
    - idempotency_key
    - producer
    - producer_version
    - refinement_count
    - query_identities
    - evidence_ids
    - constraint_report
    - bounded_failure_category
  mutation_rule: |
    The response is data only. structure-editor does not write the response,
    parent, candidate, provenance, stage metadata, or any workproduct to a
    filesystem, repository, retrieval corpus, or external publication system.

structural_proofs:
  retrieval_precedes_every_successful_edit:
    edit_cut_state: editing_structure
    only_incoming_signal: StructureGroundingSufficient
    predecessor_chain:
      - assessing_grounding receives only query_structure_rag evidence.
      - querying_structure_rag is reached only after embed_structure_query.
      - embedding_query is reached only after formulate_structure_query.
      - formulating_query is first reached only after validate_structure_request.
    success_chain:
      - editing_structure must emit StructureEditGenerated.
      - validating_constraints must emit StructureEditValid.
      - compose_structure_response must emit StructureResponseSucceeded.
    argument: |
      succeeded has one incoming edge, StructureResponseSucceeded from
      composing_response. That response can select succeeded only after
      StructureEditValid. The validator is reachable with a candidate only from
      editing_structure. editing_structure has one incoming edge,
      StructureGroundingSufficient from assessing_grounding, which is reachable
      only after a structure-rag query. Rejection, insufficient grounding,
      no-op, constraint failure, infrastructure failure, and budget exhaustion
      have no edge to succeeded.
  one_refinement_bound:
    cycle: assessing_grounding -> formulating_query -> embedding_query -> querying_structure_rag -> assessing_grounding
    guard_signal: StructureGroundingRefinementAllowed
    argument: |
      assess_structure_grounding may emit the cycle signal only when refinement
      count is zero. formulate_structure_query increments the count to one.
      Subsequent insufficiency emits StructureGroundingInsufficient, whose only
      edge leaves the cycle for response composition.
  authority_closure:
    argument: |
      Every action alias resolves to one structure-editor-owned srd003 word.
      The profile selects no voice, style, critic, Pangram, GitHub, workproduct,
      lifecycle, corpus-write, shell, generic REST, or filesystem word. Terminal
      success returns data for orchestrator validation and grants no acceptance
      or persistence authority.

requirements:
  R1:
    title: Flat machine and closed actions
    items:
      - id: R1.1
        text: |
          The planned structure-editor MachineSpec SHALL use exactly the states,
          terminal states, signals, and expanded transitions in
          flat_machine_contract. It SHALL contain no nested machine, payload
          guard, script, dynamic $tool dispatch, or hidden imperative router.
        evidence: Planned structural validation expands transition families and reports no duplicate, missing, unreachable, or terminal-origin transition.
      - id: R1.2
        text: |
          Every named action SHALL resolve through action_bindings to exactly one
          structure-editor-owned srd003 word. The runtime profile SHALL select
          exactly those eight words and no prohibited word.
        evidence: Planned action, ToolDef emission, profile selection, and owner closure compare srd005 with srd003.
  R2:
    title: Request and query formulation
    items:
      - id: R2.1
        text: |
          The machine SHALL validate one original or retry-parent content
          envelope supplied by workflow-orchestrator. It SHALL reject absent or
          malformed content, identity, intent, inventory, or policy and every
          path-bearing or authority-bearing field.
        evidence: Planned schema fixtures cover original, retry, wrong-stage, missing-content, identity, inventory, path, endpoint, model, collection, ref, credential, and tool fields.
      - id: R2.2
        text: |
          formulate_structure_query SHALL deterministically compose a bounded
          section-or-outline retrieval question from validated intent and, only
          on refinement, bounded prior evidence metadata. Model output SHALL NOT
          formulate a query or select retrieval authority.
        evidence: Planned composition fixtures prove stable query identities and reject free-form authority or refinement count greater than one.
  R3:
    title: Retrieval, grounding, and refinement
    items:
      - id: R3.1
        text: |
          Every retrieval SHALL call embed_structure_query and then
          query_structure_rag. The query SHALL consume only the embedding
          response vector and SHALL return ranked section or outline records
          with complete repository, path, commit, chunk, distance, record-type,
          embedding-model, query, and attempt provenance.
        evidence: Planned wiring and response-schema tests prove vector origin, structure-rag binding, metadata completeness, and read-only behavior.
      - id: R3.2
        text: |
          assess_structure_grounding SHALL use configured deterministic
          predicates. Insufficient initial evidence MAY cause exactly one query
          refinement; insufficient refined evidence SHALL return
          insufficient_grounding with unchanged parent content.
        evidence: Planned zero-, one-, and two-attempt traces prove the one_refinement_bound and terminal outcome.
      - id: R3.3
        text: |
          StructureGroundingSufficient SHALL be the only signal entering
          editing_structure. Retrieval rejection, insufficiency,
          infrastructure failure, or budget exhaustion SHALL NOT generate or
          validate a candidate.
        evidence: Planned graph reachability proves retrieval_precedes_every_successful_edit and negative paths have no success edge.
  R4:
    title: Structure-only editing and semantic constraints
    items:
      - id: R4.1
        text: |
          generate_structure_edit SHALL use supplied parent content and accepted
          section or outline evidence only to reorder, combine, or separate
          material and to add bounded structural connectors. It SHALL minimize
          diction changes and SHALL NOT import retrieved source prose.
        evidence: Planned prompt, schema, ledger, and adversarial evidence fixtures reject unsupported prose, voice imitation, and style-only changes.
      - id: R4.2
        text: |
          The candidate SHALL preserve every claim, citation and association,
          number and quantitative relation, qualification, and required-content
          item. Diction outside declared structural connectors SHALL remain
          byte-identical.
        evidence: Planned protected-content fixtures cover deletion, duplication, mutation, reassociation, changed units, weakened hedges, omitted exceptions, and connector overreach.
      - id: R4.3
        text: |
          validate_structure_constraints SHALL deterministically validate parent
          identity, source-span coverage and multiplicity, structure-operation
          ledger, protected content, required content, and bounded diction. It
          SHALL emit valid, no-op, or semantic-constraint-failed and SHALL never
          repair, accept, or persist a candidate.
        evidence: Planned validator and signal fixtures distinguish valid, byte-identical, and every failed invariant.
  R5:
    title: Responses and outcomes
    items:
      - id: R5.1
        text: |
          compose_structure_response SHALL return the response_contract fields
          and one of succeeded, no_op, insufficient_grounding, or failed. A
          successful response SHALL identify every used source repository, path,
          commit, and chunk.
        evidence: Planned response-schema tests validate each outcome, provenance cardinality, identities, and stage metadata.
      - id: R5.2
        text: |
          no_op and insufficient_grounding SHALL return unchanged parent
          content. failed SHALL return unchanged parent content when the request
          was valid and explicit null otherwise. None of these outcomes SHALL be
          represented as succeeded.
        evidence: Planned terminal traces compare response bytes and outcome signals for every domain and infrastructure path.
      - id: R5.3
        text: |
          A structure-editor response SHALL remain a non-authoritative child
          result. Only workflow-orchestrator MAY validate it for immutable
          workproduct persistence or saga progression.
        evidence: Planned integration schemas expose no accepted-artifact, path, write, commit, publication, or verdict field.
  R6:
    title: Authority and mutation exclusion
    items:
      - id: R6.1
        text: |
          structure-editor SHALL expose no voice, style, critic, Pangram,
          GitHub, workproduct, lifecycle, corpus-write, generic shell,
          filesystem, or arbitrary REST authority. It SHALL issue no acceptance
          verdict and SHALL NOT select another corpus, endpoint, model, or tool.
        evidence: Planned profile and declaration closure compares selected words with authority.prohibited groups, words, and capabilities.
      - id: R6.2
        text: |
          structure-editor SHALL be request-scoped and stateless. It SHALL return
          content, provenance, and metadata as data and SHALL NOT mutate a
          filesystem, saga, repository, Chroma collection, or publication.
        evidence: Planned side-effect inspection permits only configured embedding, retrieval, and model observations.
  R7:
    title: Planned status and validation
    items:
      - id: R7.1
        text: |
          This SRD SHALL specify behavior only. The profile, MachineSpec,
          ToolDefs, REST declarations, model declarations, service, tests, and
          executable evidence SHALL remain planned.
        evidence: Architecture, specification index, roadmap, and implementation_status agree on specified documentation and planned runtime.
      - id: R7.2
        text: |
          Planned validation SHALL parse YAML; prove requirement-to-AC coverage,
          state, transition, signal, terminal, action, word, emission, tool, and
          authority closure; prove retrieval-before-edit and one-refinement
          reachability; inspect the diff; and run mage audit.
        evidence: The future test suite names every check and reports no new warning.

non_goals:
  - Implement agents/structure-editor/machine.yaml, a profile, ToolDefs, REST or model declarations, a service, or tests.
  - Read or write a saga filesystem, persist a workproduct, accept an artifact, or publish.
  - Match or evaluate voice, tighten style, criticize content, route critic findings, or invoke Pangram.
  - Query voice-rag or tightening-rag, write Chroma, ingest a corpus, or alter canonical RAG behavior.
  - Add arbitrary shell, filesystem, REST, GitHub, model, endpoint, collection, path, ref, or credential selection.
  - Treat retrieved text as source material for new claims or diction.
  - Retry generation, repair a constraint-failed candidate, or refine retrieval more than once.

acceptance_criteria:
  - id: AC1
    criterion: |
      One flat signal-complete machine maps every action to exactly one
      structure-editor srd003 word and has four closed terminal outcomes.
    traces: [R1.1, R1.2]
  - id: AC2
    criterion: |
      Original and retry-parent requests are validated without paths or widened
      authority, and initial or refined queries are composed deterministically.
    traces: [R2.1, R2.2]
  - id: AC3
    criterion: |
      Provider embeddings feed read-only structure-rag queries with complete
      provenance; grounding is deterministic; refinement occurs at most once;
      and graph reachability proves retrieval precedes every successful edit.
    traces: [R3.1, R3.2, R3.3]
  - id: AC4
    criterion: |
      Editing is limited to evidence-grounded reordering, combining, separating,
      and bounded connectors; claims, citations, numbers, qualifications, and
      required content are preserved; deterministic validation rejects or marks
      no-op without repair or acceptance.
    traces: [R4.1, R4.2, R4.3]
  - id: AC5
    criterion: |
      succeeded, no_op, insufficient_grounding, and failed return the declared
      content, repository/path/commit/chunk provenance, parent identity, and
      stage metadata while leaving acceptance to workflow-orchestrator.
    traces: [R5.1, R5.2, R5.3]
  - id: AC6
    criterion: |
      The request-scoped editor returns data without filesystem mutation and
      exposes no voice, style, critic, Pangram, GitHub, workproduct, corpus-write,
      generic shell, arbitrary REST, or acceptance authority.
    traces: [R6.1, R6.2]
  - id: AC7
    criterion: |
      Documentation reports runtime as planned, and YAML, complete AC traces,
      machine closure, retrieval and refinement proofs, authority, diff, and
      mage audit remain explicit validation gates.
    traces: [R7.1, R7.2]

