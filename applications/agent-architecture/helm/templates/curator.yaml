{{- include "agent-architecture.validateValues" . -}}
{{- $fullname := include "agent-architecture.fullname" . -}}
{{- $curatorAssets := .Files.Glob "curator-assets/part-*" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-curator
  labels:
    {{- include "agent-architecture.labels" . | nindent 4 }}
    app.kubernetes.io/component: curator
spec:
  replicas: {{ .Values.curator.replicas }}
  selector:
    matchLabels:
      {{- include "agent-architecture.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: curator
  template:
    metadata:
      labels:
        {{- include "agent-architecture.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: curator
      annotations:
        checksum/config: {{ toYaml .Values.curator | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if $curatorAssets }}
      initContainers:
        # The curator's browser UI dist trees and the catalog docs tree are
        # delivered as gzipped, sharded ConfigMaps (curator-ui.yaml) rather than
        # baked into a per-app image (GH-1368). Concatenate the shards in key
        # order back into one tar.gz and unpack it into the writable workspace so
        # the profile's ui/*/dist static_assets roots and its docs/ document root
        # resolve under --directory /work (GH-1261, GH-1293).
        - name: stage-curator-ui
          image: {{ include "agent-architecture.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["sh", "-c", "cat /curator-ui/part-* | tar -xzf - -C /work"]
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.curator.resources | nindent 12 }}
          volumeMounts:
            - {name: workspace, mountPath: /work}
            - {name: curator-ui, mountPath: /curator-ui, readOnly: true}
      {{- end }}
      containers:
        - name: curator
          image: {{ include "agent-architecture.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # The catalog documentation-curator profile is mounted, never baked in.
          # It binds documentation/control/monitor on loopback, so the readiness
          # and liveness probes call its real lifecycle health endpoint over the
          # pod's own localhost (srd001 R1.4); OTLP export to the collector is a
          # runtime flag, not a profile edit (R1.5).
          args:
            - "--profile"
            - "/profiles/agents/knowledge-manager/documentation-curator/profile.yaml"
            # The curator serves and curates documents from a writable workspace;
            # the profile mount at /profiles is read-only, so --directory points
            # at a writable emptyDir. Read-only /profiles as the workspace makes
            # the document endpoints return HTTP 500.
            - "--directory"
            - "/work"
            {{- $endpoint := include "agent-architecture.otlpEndpoint" . }}
            {{- if $endpoint }}
            - "--otel-otlp-endpoint"
            - {{ $endpoint | quote }}
            - "--otel-service-name"
            - {{ .Values.curator.serviceName | quote }}
            {{- end }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - {name: documentation, containerPort: {{ .Values.curator.documentationPort }}}
            - {name: control, containerPort: {{ .Values.curator.controlPort }}}
            - {name: monitor, containerPort: {{ .Values.curator.monitorPort }}}
          readinessProbe:
            exec:
              command:
                - "wget"
                - "-q"
                - "-O"
                - "/dev/null"
                - "http://127.0.0.1:{{ .Values.curator.controlPort }}/api/lifecycle/health"
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command:
                - "wget"
                - "-q"
                - "-O"
                - "/dev/null"
                - "http://127.0.0.1:{{ .Values.curator.controlPort }}/api/lifecycle/health"
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.curator.resources | nindent 12 }}
          volumeMounts:
            - {name: profiles, mountPath: /profiles, readOnly: true}
            - {name: workspace, mountPath: /work}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: profiles
          projected:
            defaultMode: 0444
            sources:
              - configMap:
                  name: {{ $fullname }}-curator-profiles
                  items:
                    {{- range $path, $_ := .Files.Glob "profiles/curator/**" }}
                    - key: {{ $path | trimPrefix "profiles/curator/" | replace "/" "__" }}
                      path: {{ $path | trimPrefix "profiles/curator/" }}
                    {{- end }}
        {{- if $curatorAssets }}
        # One projected source per curator-ui shard ConfigMap; the init container
        # concatenates them (part-000, part-001, ...) into the original tar.gz.
        - name: curator-ui
          projected:
            defaultMode: 0444
            sources:
              {{- range $path, $_ := $curatorAssets }}
              - configMap:
                  name: {{ $fullname }}-curator-ui-{{ base $path }}
                  items:
                    - key: {{ base $path }}
                      path: {{ base $path }}
              {{- end }}
        {{- end }}
        - name: workspace
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-curator
  labels:
    {{- include "agent-architecture.labels" . | nindent 4 }}
    app.kubernetes.io/component: curator
spec:
  selector:
    {{- include "agent-architecture.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: curator
  ports:
    - {name: documentation, port: {{ .Values.curator.documentationPort }}, targetPort: documentation}
    - {name: control, port: {{ .Values.curator.controlPort }}, targetPort: control}
    - {name: monitor, port: {{ .Values.curator.monitorPort }}, targetPort: monitor}
