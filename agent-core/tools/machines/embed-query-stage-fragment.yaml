# The query-embedding stage (srd058 R4.1): embed the text at the bound
# provider, then normalize the result to one flat vector, whether the provider
# answered with a flat vector (Ollama) or a single row (Cohere). A provider
# failure in the shared taxonomy and any word failure lead to the failed state.
#
# The stage runs the words the embed-words fragment produces for query:
# embed_query over the library's embed-query REST fragment, and
# normalize_query_embedding. The importer instantiates those two fragments
# beside this one, since a fragment does not instantiate another (srd052
# R1.2), and declares the signals the stage routes: QueryEmbedded,
# QueryEmbeddingNormalized, the three provider failures, and CommandError.
unit: builtin-embed-query-stage
params:
  - name: prefix
    type: string
    default: ""
    description: Prefix on the states this stage declares, to keep two instantiations apart.
  - name: from
    type: string
    description: The importer's state the stage is entered from.
  - name: enter
    type: string
    description: The signal, seen in the from state, that enters the stage.
  - name: next
    type: string
    description: The importer's state the stage leaves to once its result is ready.
  - name: next_action
    type: string
    default: ""
    description: The word the importer runs on leaving to next; empty runs none.
  - name: failed
    type: string
    default: Failed
    description: The state every provider or word failure leads to.
stage:
  states:
    - {name: $param(prefix)EmbeddingQuery, meaning: The query text is being embedded at the bound provider.}
    - {name: $param(prefix)NormalizingQueryEmbedding, meaning: The provider's embedding is being normalized to one flat vector.}
  transitions:
    - {state: $param(from), signal: $param(enter), next: $param(prefix)EmbeddingQuery, action: embed_query}
    - {state: $param(prefix)EmbeddingQuery, signal: QueryEmbedded, next: $param(prefix)NormalizingQueryEmbedding, action: normalize_query_embedding}
    - {state: $param(prefix)EmbeddingQuery, signal: ProviderUnauthorized, next: $param(failed)}
    - {state: $param(prefix)EmbeddingQuery, signal: ProviderThrottled, next: $param(failed)}
    - {state: $param(prefix)EmbeddingQuery, signal: ProviderUnavailable, next: $param(failed)}
    - {state: $param(prefix)EmbeddingQuery, signal: CommandError, next: $param(failed)}
    - {state: $param(prefix)NormalizingQueryEmbedding, signal: QueryEmbeddingNormalized, next: $param(next), action: $param(next_action)}
    - {state: $param(prefix)NormalizingQueryEmbedding, signal: CommandError, next: $param(failed)}
