name: epic-issues
purpose: |-
  Give each open epic one issue mirroring it in the tracker, and close it when the
  epic is done or retired (srd045). Use when a person asks to reconcile the epics'
  issues, or on a schedule. A second run changes nothing.

  This machine has no model state: scrum-master backlog epic-issues (design.md
  D10, D14; GH-2865). The run starts in a checkout of the repository holding the
  epics.
configuration:
  machine: plugin/agents/epic-issues/machine.yaml
  tools: plugin/agents/epic-issues/tools.yaml
invariants:
- Every step is a word; no model acts anywhere in this machine
- A refusal ends the run in the state that names it, with the word's reason
lifecycle: |-
  1. Idle → Name (Seed): scrum-master backlog epic-issues
  2. Name → Done (ToolDone)
initial_state: Idle
budget:
  command_timeout: 16m
  max_iterations: 10
states:
- name: Idle
  meaning: Initial state before the first word.
- name: Name
  meaning: |
    The reconcile word: scrum-master backlog epic-issues files, updates, and
    closes each epic's mirror; a second run changes nothing.
- name: Done
  run_status: succeeded
  meaning: |
    Terminal. Every word ran, and the last one reported what it did.
- name: Refused
  run_status: failed
  meaning: |
    Terminal. The word refused — the checkout's origin names no project, or an
    epic's issue item is malformed — and its reason is the run's last output.
- name: Failed
  run_status: failed
  meaning: Terminal. An infrastructure error outside the words' refusals.
terminal_states:
- Done
- Refused
- Failed
signals:
- name: Seed
  trigger: Loop initialization.
- name: ToolDone
  trigger: A word executed successfully.
- name: ToolFailed
  trigger: A word reported failure — a refusal with its reason.
- name: CommandError
  trigger: Infrastructure-level error (not a tool failure).
transitions:
- state: Idle
  signal: Seed
  next: Name
  action: backlog_epic_issues
  summary: true
- state: Name
  signal: ToolFailed
  next: Refused
- state: Name
  signal: ToolDone
  next: Done
- state: Idle
  signal: CommandError
  next: Failed
- state: Name
  signal: CommandError
  next: Failed
