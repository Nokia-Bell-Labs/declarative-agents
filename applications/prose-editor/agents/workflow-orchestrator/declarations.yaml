tools:
  - name: capture_source
    type: exec
    visibility: internal
    category: boundary
    description: Capture the allowlisted source revision through one fixed tracer helper operation.
    parameters: {type: object, properties: {}, additionalProperties: false}
    emits: [ToolDone, ToolFailed, CommandError]
    binary: prose-editor-tracer-boundary
    args: [capture-source]
    output_cap: 256
    output:
      mode: structured
      schema: {type: object}
    side_effects:
      - {kind: filesystem_read, target: PROSE_TRACER_FIXTURES source fixture, state: read_only}
      - {kind: filesystem_write, target: .tracer/captured-source.md, state: immutable}
      - {kind: filesystem_write, target: manifest.yaml, state: projected}
      - {kind: filesystem_write, target: boundary-receipts.jsonl, state: append_only}
    reversibility: {classification: irreversible, undo: preserve_captured_source}
    undo: {strategy: irreversible, description: Preserve the immutable capture, manifest projection, and boundary receipt.}

  - name: write_original
    type: exec
    visibility: internal
    category: boundary
    description: Write or verify the fixed immutable original through one fixed helper operation.
    parameters: {type: object, properties: {}, additionalProperties: false}
    emits: [ToolDone, ToolFailed, CommandError]
    binary: prose-editor-tracer-boundary
    args: [write-original]
    output_cap: 256
    output: {mode: structured, schema: {type: object}}
    side_effects:
      - {kind: filesystem_write, target: 00-original.md, state: immutable}
      - {kind: filesystem_write, target: manifest.yaml, state: projected}
      - {kind: filesystem_write, target: boundary-receipts.jsonl, state: append_only}
    reversibility: {classification: irreversible, undo: preserve_original}
    undo: {strategy: noop, description: The immutable original is preserved on compensation.}

  - &append_manifest_revision
    name: append_capture_manifest
    type: exec
    visibility: internal
    category: boundary
    description: Append the declared capture_manifested revision and project manifest.yaml.
    parameters: {type: object, properties: {}, additionalProperties: false}
    emits: [ToolDone, ToolFailed, CommandError]
    binary: prose-editor-tracer-boundary
    args: [append-manifest-revision, capture_manifested, none, "1", "0"]
    output_cap: 256
    output:
      description: Manifest context containing original and optional structure content identities.
      schema: {type: object}
    side_effects:
      - {kind: filesystem_write, target: manifest-history, state: append_only}
      - {kind: filesystem_write, target: manifest.yaml, state: projected}
      - {kind: state_mutation, target: manifest artifact selection, state: superseded_and_cleared}
      - {kind: filesystem_write, target: boundary-receipts.jsonl, state: append_only}
    reversibility: {classification: compensatable, undo: append_corrective_revision}
    undo: {strategy: compensating_action, description: Append a corrective revision; never rewrite history.}

  - <<: *append_manifest_revision
    name: append_structure_manifest
    description: Append the declared structure_manifested revision.
    args: [append-manifest-revision, structure_manifested, none, "2", "1"]

  - <<: *append_manifest_revision
    name: append_critique_manifest
    description: Append the declared critique_manifested revision.
    args: [append-manifest-revision, critique_manifested, none, "3", "0"]

  - <<: *append_manifest_revision
    name: append_retry_manifest
    description: Append the declared retry_recorded revision.
    args: [append-manifest-revision, retry_recorded, none, "4", "0"]

  - <<: *append_manifest_revision
    name: append_structure_retry_manifest
    description: Append the declared structure_retry_manifested revision.
    args: [append-manifest-revision, structure_retry_manifested, none, "5", "2"]

  - <<: *append_manifest_revision
    name: append_critique_retry_manifest
    description: Append the declared critique_retry_manifested revision.
    args: [append-manifest-revision, critique_retry_manifested, none, "6", "0"]

  - <<: *append_manifest_revision
    name: append_kept_original_manifest
    description: Append kept_original and project the declared KeptOriginal terminal state.
    args: [append-manifest-revision, kept_original, KeptOriginal, "7", "0"]

  - <<: *append_manifest_revision
    name: append_final_manifest
    description: Append first-pass locally_finalized and project the declared LocallyFinalized terminal state.
    args: [append-manifest-revision, locally_finalized, LocallyFinalized, "4", "0"]

  - <<: *append_manifest_revision
    name: append_final_retry_manifest
    description: Append retry-pass locally_finalized and project the declared LocallyFinalized terminal state.
    args: [append-manifest-revision, locally_finalized, LocallyFinalized, "7", "0"]

  - &compose_structure_request
    name: compose_structure_request
    type: builtin
    init: compose
    visibility: internal
    category: word
    description: Compose the first structure-child request from declared manifest context.
    parameters: {type: object, properties: {}, additionalProperties: false}
    emits: [StructureRequestComposed, CommandError]
    config:
      signal: StructureRequestComposed
      inputs:
        parent_content: $.original_content
        parent_artifact_id: $.original_artifact_id
        parent_content_hash: $.original_content_hash
        saga_id: $.saga_id
      template: '{"attempt":1,"bounded_structure_intent":"Improve structure without changing claims.","parent_artifact_id":{{ json parent_artifact_id }},"parent_content":{{ json parent_content }},"parent_content_hash":{{ json parent_content_hash }},"saga_id":{{ json saga_id }},"stage":"structure"}'
    side_effects: []
    reversibility: {classification: reversible, undo: noop}
    undo: {strategy: noop, description: Composition changes no state.}
    errors: [{signal: CommandError, condition: A manifest selector cannot resolve, state_after_failure: No request is persisted.}]

  - <<: *compose_structure_request
    name: compose_structure_retry_request
    description: Compose the retry structure-child request from declared manifest context and profile-owned intent.
    config:
      signal: StructureRequestComposed
      inputs:
        parent_content: $.original_content
        parent_artifact_id: $.original_artifact_id
        parent_content_hash: $.original_content_hash
        saga_id: $.saga_id
      template: '{"attempt":2,"bounded_structure_intent":"Apply critic feedback while preserving immutable claims.","parent_artifact_id":{{ json parent_artifact_id }},"parent_content":{{ json parent_content }},"parent_content_hash":{{ json parent_content_hash }},"saga_id":{{ json saga_id }},"stage":"structure"}'

  - &compose_critic_request
    name: compose_critic_request
    type: builtin
    init: compose
    visibility: internal
    category: word
    description: Compose a critic request from the latest declared structure manifest context.
    parameters: {type: object, properties: {}, additionalProperties: false}
    emits: [CriticRequestComposed, CommandError]
    config:
      signal: CriticRequestComposed
      inputs:
        attempt: $.attempt
        candidate_artifact_id: $.candidate_artifact_id
        candidate_content: $.candidate_content
        candidate_content_hash: $.candidate_content_hash
        candidate_stage: $.candidate_stage
        original_artifact_id: $.original_artifact_id
        original_content: $.original_content
        original_content_hash: $.original_content_hash
        saga_id: $.saga_id
      template: '{"attempt":{{ attempt }},"candidate_artifact_id":{{ json candidate_artifact_id }},"candidate_content":{{ json candidate_content }},"candidate_content_hash":{{ json candidate_content_hash }},"candidate_stage":{{ json candidate_stage }},"original_artifact_id":{{ json original_artifact_id }},"original_content":{{ json original_content }},"original_content_hash":{{ json original_content_hash }},"saga_id":{{ json saga_id }}}'
    side_effects: []
    reversibility: {classification: reversible, undo: noop}
    undo: {strategy: noop, description: Composition changes no state.}
    errors: [{signal: CommandError, condition: A manifest selector cannot resolve, state_after_failure: No request is persisted.}]

  - <<: *compose_critic_request
    name: compose_critic_retry_request
    description: Compose the retry critic request from the declared retry structure manifest context.
    config:
      signal: CriticRequestComposed
      inputs:
        attempt: $.attempt
        candidate_artifact_id: $.candidate_artifact_id
        candidate_content: $.candidate_content
        candidate_content_hash: $.candidate_content_hash
        candidate_stage: $.candidate_stage
        original_artifact_id: $.original_artifact_id
        original_content: $.original_content
        original_content_hash: $.original_content_hash
        saga_id: $.saga_id
      template: '{"attempt":{{ attempt }},"candidate_artifact_id":{{ json candidate_artifact_id }},"candidate_content":{{ json candidate_content }},"candidate_content_hash":{{ json candidate_content_hash }},"candidate_stage":{{ json candidate_stage }},"original_artifact_id":{{ json original_artifact_id }},"original_content":{{ json original_content }},"original_content_hash":{{ json original_content_hash }},"saga_id":{{ json saga_id }}}'

  - &persist_child_request
    name: persist_structure_request
    type: exec
    visibility: internal
    category: boundary
    description: Persist the first declared structure request at its immutable address.
    parameters: {type: object, properties: {}, additionalProperties: false}
    emits: [ToolDone, ToolFailed, CommandError]
    binary: prose-editor-tracer-boundary
    args: [persist-child-request, .tracer/requests/structure-1.json, "1"]
    stdin_source: $from(structure_request).$
    stdin_max_bytes: 1048576
    output_cap: 64
    output: {description: Addressed child request path, schema: {type: string}}
    side_effects:
      - {kind: filesystem_write, target: .tracer/requests/structure-1.json, state: projected}
      - {kind: filesystem_write, target: boundary-receipts.jsonl, state: append_only}
    reversibility: {classification: compensatable, undo: append_corrective_revision}
    undo: {strategy: compensating_action, description: Preserve the addressed request and append correction metadata.}

  - <<: *persist_child_request
    name: persist_critic_request
    description: Persist the first declared critic request at its immutable address.
    args: [persist-child-request, .tracer/requests/critic-1.json, "2"]
    stdin_source: $from(critic_request).$
    side_effects:
      - {kind: filesystem_write, target: .tracer/requests/critic-1.json, state: projected}
      - {kind: filesystem_write, target: boundary-receipts.jsonl, state: append_only}

  - <<: *persist_child_request
    name: persist_structure_retry_request
    description: Persist the retry structure request at its immutable address.
    args: [persist-child-request, .tracer/requests/structure-2.json, "3"]
    stdin_source: $from(structure_retry_request).$
    side_effects:
      - {kind: filesystem_write, target: .tracer/requests/structure-2.json, state: projected}
      - {kind: filesystem_write, target: boundary-receipts.jsonl, state: append_only}

  - <<: *persist_child_request
    name: persist_critic_retry_request
    description: Persist the retry critic request at its immutable address.
    args: [persist-child-request, .tracer/requests/critic-2.json, "4"]
    stdin_source: $from(critic_retry_request).$
    side_effects:
      - {kind: filesystem_write, target: .tracer/requests/critic-2.json, state: projected}
      - {kind: filesystem_write, target: boundary-receipts.jsonl, state: append_only}

  - name: invoke_structure_editor
    type: builtin
    init: self_invoke
    visibility: internal
    category: boundary
    description: Invoke only the application-owned structure-stage profile.
    parameters: {type: object, properties: {}, additionalProperties: false}
    emits: [ToolDone, ToolFailed, CommandError]
    config:
      profile: ../specialist-editor/profile.yaml
      request_from: $from(structure_request_file).$
    side_effects:
      - {kind: child_agent_execution, target: specialist-editor-structure, state: candidate_observed}
    reversibility: {classification: compensatable, undo: child_agent_workspace_restore}
    undo:
      strategy: child_agent_workspace_restore
      description: Restore child workspace artifacts or retain explicit compensation work.
      payload: boundary_compensation
      captures: [child_profile, child_run_id, artifact_paths]
      requires: [child_workspace_ref, child_trace]

  - name: write_structure_attempt
    type: exec
    visibility: internal
    category: boundary
    description: Write or verify one immutable content-addressed structure attempt.
    parameters: {type: object, properties: {}, additionalProperties: false}
    emits: [ToolDone, ToolFailed, CommandError]
    binary: prose-editor-tracer-boundary
    args: [write-structure-attempt]
    stdin_source: $from(structure_child).content
    stdin_max_bytes: 196608
    output_cap: 256
    output: {mode: structured, schema: {type: object}}
    side_effects:
      - {kind: filesystem_write, target: attempts/structure, state: immutable}
      - {kind: filesystem_write, target: manifest.yaml, state: projected}
      - {kind: filesystem_write, target: boundary-receipts.jsonl, state: append_only}
    reversibility: {classification: irreversible, undo: append_supersession}
    undo: {strategy: compensating_action, description: Supersede by manifest revision without deleting bytes.}

  - name: invoke_voice_critic
    type: builtin
    init: self_invoke
    visibility: internal
    category: boundary
    description: Invoke the isolated Release 00.1 critic with immutable bytes and hashes only.
    parameters: {type: object, properties: {}, additionalProperties: false}
    emits: [ToolDone, ToolFailed, CommandError]
    config:
      profile: ../voice-critic/profile.yaml
      request_from: $from(critic_request_file).$
    side_effects:
      - {kind: child_agent_execution, target: voice-critic, state: verdict_observed}
    reversibility: {classification: compensatable, undo: child_agent_workspace_restore}
    undo:
      strategy: child_agent_workspace_restore
      description: Restore child workspace artifacts or retain explicit compensation work.
      payload: boundary_compensation
      captures: [child_profile, child_run_id, artifact_paths]
      requires: [child_workspace_ref, child_trace]

  - name: invoke_structure_editor_retry
    type: builtin
    init: self_invoke
    visibility: internal
    category: boundary
    description: Invoke the structure-stage profile with the addressed retry request.
    parameters: {type: object, properties: {}, additionalProperties: false}
    emits: [ToolDone, ToolFailed, CommandError]
    config:
      profile: ../specialist-editor/profile.yaml
      request_from: $from(structure_retry_request_file).$
    side_effects:
      - {kind: child_agent_execution, target: specialist-editor-structure, state: candidate_observed}
    reversibility: {classification: compensatable, undo: child_agent_workspace_restore}
    undo:
      strategy: child_agent_workspace_restore
      description: Restore child workspace artifacts or retain explicit compensation work.
      payload: boundary_compensation
      captures: [child_profile, child_run_id, artifact_paths]
      requires: [child_workspace_ref, child_trace]

  - name: invoke_voice_critic_retry
    type: builtin
    init: self_invoke
    visibility: internal
    category: boundary
    description: Invoke the voice critic with the addressed retry request.
    parameters: {type: object, properties: {}, additionalProperties: false}
    emits: [ToolDone, ToolFailed, CommandError]
    config:
      profile: ../voice-critic/profile.yaml
      request_from: $from(critic_retry_request_file).$
    side_effects:
      - {kind: child_agent_execution, target: voice-critic, state: verdict_observed}
    reversibility: {classification: compensatable, undo: child_agent_workspace_restore}
    undo:
      strategy: child_agent_workspace_restore
      description: Restore child workspace artifacts or retain explicit compensation work.
      payload: boundary_compensation
      captures: [child_profile, child_run_id, artifact_paths]
      requires: [child_workspace_ref, child_trace]

  - name: capture_critic_output
    type: builtin
    init: compose
    visibility: internal
    category: word
    description: JSON-escape the adjacent critic child stdout for schema validation.
    parameters: {type: object, properties: {}, additionalProperties: false}
    emits: [CriticOutputCaptured, CommandError]
    config:
      signal: CriticOutputCaptured
      inputs:
        response: $.
      template: '{"response": {{ json response }}}'
    side_effects: []
    reversibility: {classification: reversible, undo: noop}
    undo: {strategy: noop, description: Capturing output changes no state.}

  - name: parse_critic_response
    type: builtin
    init: parse_structured
    visibility: internal
    category: word
    description: Validate the exact bounded critic evaluation returned by the isolated child.
    parameters: {type: object, properties: {}, additionalProperties: false}
    emits: [CriticResponseParsed, CriticResponseInvalid, CommandError]
    config:
      source: $from(critic_transport).response
      schema:
        type: object
        required:
          - verdict
          - responsible_stage
          - original_content_hash
          - candidate_content_hash
          - findings
          - feedback
        properties:
          verdict: {type: string, enum: [pass, reject]}
          responsible_stage: {type: string, enum: ["", structure]}
          original_content_hash: {type: string, pattern: "^[0-9a-f]{64}$"}
          candidate_content_hash: {type: string, pattern: "^[0-9a-f]{64}$"}
          findings:
            type: array
            minItems: 6
            maxItems: 6
            items:
              type: object
              required: [category, status, summary]
              properties:
                category:
                  type: string
                  enum:
                    - semantic_preservation
                    - structural_intent
                    - voice_match
                    - tightening_quality
                    - unsupported_additions
                    - anchor_copy_risk
                status: {type: string, enum: [pass, warn, reject]}
                summary: {type: string, maxLength: 2048}
              additionalProperties: false
          feedback: {type: string, maxLength: 4096}
        additionalProperties: false
        allOf:
          - properties:
              findings:
                allOf:
                  - contains: {type: object, required: [category], properties: {category: {const: semantic_preservation}}}
                  - contains: {type: object, required: [category], properties: {category: {const: structural_intent}}}
                  - contains: {type: object, required: [category], properties: {category: {const: voice_match}}}
                  - contains: {type: object, required: [category], properties: {category: {const: tightening_quality}}}
                  - contains: {type: object, required: [category], properties: {category: {const: unsupported_additions}}}
                  - contains: {type: object, required: [category], properties: {category: {const: anchor_copy_risk}}}
          - if: {properties: {verdict: {const: pass}}, required: [verdict]}
            then:
              properties:
                responsible_stage: {const: ""}
                findings:
                  items:
                    properties: {status: {const: pass}}
          - if: {properties: {verdict: {const: reject}}, required: [verdict]}
            then:
              properties:
                responsible_stage: {const: structure}
                findings:
                  contains:
                    type: object
                    required: [status]
                    properties: {status: {const: reject}}
      parsed: CriticResponseParsed
      unparsed: CriticResponseInvalid
    side_effects: []
    reversibility: {classification: reversible, undo: noop}
    undo: {strategy: noop, description: Parsing changes no state.}

  - name: critic_verdict_is_pass
    type: builtin
    init: value_predicate
    visibility: internal
    category: word
    description: Route only the persisted critic verdict scalar.
    parameters: {type: object, properties: {}, additionalProperties: false}
    emits: [CriticAccepted, CriticRejected, CommandError]
    config:
      left: $from(critic_response).verdict
      op: eq
      right: pass
      operand_type: string
      satisfied: CriticAccepted
      unsatisfied: CriticRejected
    side_effects: []
    reversibility: {classification: reversible, undo: noop}
    undo: {strategy: noop, description: Comparing a verdict changes no state.}

  - name: write_critique_attempt
    type: exec
    visibility: internal
    category: boundary
    description: Write or verify one immutable critique attempt before verdict routing.
    parameters: {type: object, properties: {}, additionalProperties: false}
    emits: [ToolDone, ToolFailed, CommandError]
    binary: prose-editor-tracer-boundary
    args: [write-critique-attempt]
    stdin_source: $from(critic_transport).response
    stdin_max_bytes: 262144
    output_cap: 256
    output: {mode: structured, schema: {type: object}}
    side_effects:
      - {kind: filesystem_write, target: attempts/critique, state: immutable}
      - {kind: state_mutation, target: manifest.last_critic, state: recorded}
      - {kind: filesystem_write, target: manifest.yaml, state: projected}
      - {kind: filesystem_write, target: boundary-receipts.jsonl, state: append_only}
    reversibility: {classification: irreversible, undo: append_supersession}
    undo: {strategy: compensating_action, description: Supersede by manifest revision without deleting bytes.}

  - name: materialize_final_chain
    type: exec
    visibility: internal
    category: boundary
    description: Materialize only the Release 00.1 accepted local final chain.
    parameters: {type: object, properties: {}, additionalProperties: false}
    emits: [ToolDone, ToolFailed, CommandError]
    binary: prose-editor-tracer-boundary
    args: [materialize-final-chain]
    output_cap: 256
    output: {mode: structured, schema: {type: object}}
    side_effects:
      - {kind: filesystem_write, target: 10-structure.md, state: immutable}
      - {kind: filesystem_write, target: 40-critique.yaml, state: immutable}
      - {kind: filesystem_write, target: final.md, state: immutable}
      - {kind: filesystem_write, target: manifest.yaml, state: projected}
      - {kind: filesystem_write, target: boundary-receipts.jsonl, state: append_only}
    reversibility: {classification: irreversible, undo: preserve_and_block}
    undo: {strategy: noop, description: Reuse matching files and block on any mismatch.}
