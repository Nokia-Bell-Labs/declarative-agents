name: bench
purpose: |-
  Host the profile-owned bench REST application until an operator shuts it
  down. Critic runs start as detached children through the experiments
  capability behind POST /api/v1/experiments, so the host never leaves
  Serving while they run.
configuration:
  machine: agents/bench/machine.yaml
  tools: agents/bench/tools.yaml
invariants:
- The bench never calls an LLM directly
- REST routes and UI assets are owned by the bench profile
- The shutdown action enters through the generic REST event queue
- Critic runs start through the experiments capability, never in this machine
lifecycle: |-
  1. Launch the generic REST server.
  2. Await the operator shutdown action while request machines serve reads and launches.
  3. Stop and drain the REST server on shutdown.
pipeline_diagram: |-
  ```mermaid
  flowchart TD
    A[Idle] -->|Seed| B[Launching HTTP]
    B -->|ServerLaunched| C[Serving]
    C -->|AwaitTimedOut| C
    C -->|Shutdown| F[Stopping HTTP]
    F -->|ServerStopped| G[Done]
  ```
initial_state: Idle
budget:
  command_timeout: 25h
  max_iterations: 10000
metric_labels:
  workflow: bench
states:
- name: Idle
  meaning: Initial state before the web server starts.
- name: LaunchingHTTP
  meaning: The generic profile-configured REST listener is starting.
- name: Serving
  meaning: The UI and experiments routes are available while the host awaits shutdown.
- name: StoppingHTTP
  meaning: The generic REST listener is draining and stopping.
- name: Done
  run_status: succeeded
  meaning: Terminal. The user requested shutdown.
- name: Failed
  run_status: failed
  meaning: Terminal. An infrastructure error stopped the host.
terminal_states:
- Done
- Failed
signals:
- name: Seed
  trigger: Agent startup.
- name: ServerLaunched
  trigger: Generic REST listener started.
- name: Shutdown
  trigger: User requested shutdown or Ctrl+C.
- name: ServerStopped
  trigger: Generic REST listener stopped.
- name: AwaitTimedOut
  trigger: No operator action arrived before the configured bound.
- name: CommandError
  trigger: Infrastructure-level error.
transitions:
- state: Idle
  signal: Seed
  next: LaunchingHTTP
  action: launch_bench_http
- state: LaunchingHTTP
  signal: ServerLaunched
  next: Serving
  action: await_bench_action
  label: operator_action
- state: LaunchingHTTP
  signal: CommandError
  next: Failed
- state: Serving
  signal: Shutdown
  next: StoppingHTTP
  action: stop_bench_http
- state: Serving
  signal: CommandError
  next: Failed
- state: Serving
  signal: AwaitTimedOut
  next: Serving
  action: await_bench_action
  label: operator_action
- state: Serving
  signal: ServerStopped
  next: Failed
- state: StoppingHTTP
  signal: ServerStopped
  next: Done
- state: StoppingHTTP
  signal: CommandError
  next: Failed
