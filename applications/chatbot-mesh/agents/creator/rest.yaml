rest:
  version: v1
  auth:
    none:
      type: none
  limits:
    local_deployment_client:
      # The rollout leg waits on helm upgrade --atomic --wait against the whole
      # mesh, which outlasts the 130s every hop on this path used to allow: the
      # applier's helm_upgrade was cancelled mid-flight at ~127s and the intent
      # answered machine_timeout (GH-196). Every hop that waits on the apply
      # carries the same budget, because the shortest one decides.
      timeout: 600s
      read_timeout: 600s
      max_request_bytes: 1048576
      max_response_bytes: 1048576
      redirect:
        mode: none
      network:
        schemes: [http]
        # The deployment-API host is the egress allowlist entry; a values-driven deploy
        # sets PROVISIONER_HOST to the provisioner Service DNS name, defaulting to
        # loopback locally.
        hosts:
          - ${PROVISIONER_HOST:-127.0.0.1}
        # The production chart leaves this at 18090. Integrations may allocate an
        # isolated fake API port through the same declared child contract.
        ports:
          - ${DEPLOYMENT_API_PORT:-18090}
    local_chroma_client:
      # The creator reads the collection count before and after the child to report
      # that run's contribution (srd005 R3.1). Read-only: the corpus-ingest child
      # does the writing, and the creator declares no add or delete operation.
      timeout: 30s
      read_timeout: 30s
      max_request_bytes: 16384
      max_response_bytes: 65536
      redirect:
        mode: none
      network:
        schemes: [http]
        hosts:
          - ${CHROMA_HOST:-127.0.0.1}
        ports: [8000]
    local_creator_instance:
      # The rollout leg waits on helm upgrade --atomic --wait against the whole
      # mesh, which outlasts the 130s every hop on this path used to allow: the
      # applier's helm_upgrade was cancelled mid-flight at ~127s and the intent
      # answered machine_timeout (GH-196). Every hop that waits on the apply
      # carries the same budget, because the shortest one decides.
      timeout: 600s
      read_timeout: 600s
      max_request_bytes: 1048576
      max_response_bytes: 1048576
      redirect:
        mode: none
      network:
        schemes: [http]
        hosts: [127.0.0.1, localhost]
        ports: [18110]
        allow_public_listener: true
    local_creator_control:
      timeout: 30s
      read_timeout: 5s
      max_request_bytes: 16384
      max_response_bytes: 65536
      redirect:
        mode: none
      network:
        schemes: [http]
        hosts: [127.0.0.1, localhost]
        ports: [18111]
        allow_public_listener: true
    local_creator_monitor:
      timeout: 5s
      read_timeout: 5s
      max_request_bytes: 4096
      max_response_bytes: 1048576
      redirect:
        mode: none
      network:
        schemes: [http]
        hosts: [127.0.0.1, localhost]
        ports: [18112]
        allow_public_listener: true

  clients:
    deployment_api:
      # The creator alone holds the deployment-API authority (srd005 R5.1): it is the
      # only agent in the mesh that declares a deployment-API client (the chatbot and
      # provisioning-workflow-orchestrator declare none). The bearer credential is deployment-realized -- the
      # creator's pod mounts the deployment-API Secret and the provisioner enforces the
      # token -- rather than resolved in the declarative runtime, which carries no
      # credential resolver. No runtime input supplies the endpoint or the credential.
      base_url: ${DEPLOYMENT_API_URL:-http://127.0.0.1:18090}
      auth_ref: none
      limits_ref: local_deployment_client
      operations:
        apply_instance:
          # Realize the decided operation by driving the deployment API's apply path
          # (srd005 R3). The creator forwards the provisioning-workflow-orchestrator's decided values-plane
          # document as the versioned apply request content (srd006 R1.4); it authors
          # no values decision (srd005 R2.2). No endpoint or credential for a running
          # agent is sent; the applier validates the content against the chart schema.
          method: POST
          path: /provisioning/api/apply
          params:
            body_schema:
              type: object
              properties:
                content: {type: string}
                operation: {type: string}
            body_source: previous_result
            input_mapping:
              content: $.content
              # Read but not sent: the applier decides nothing from the caller's
              # operation name, and carrying it is what puts it in this word's
              # own output, where the rejection body below can reach it with a
              # plain $. selector (the idiom the ingest leg uses for the count).
              operation: $.operation
            carry_forward: [operation]
          body:
            schema_version: "1"
            content: "{{ params.content }}"
          success: {status: [200], signal: InstanceApplied}
          failures:
            # The applier answers 400 when its dry-run rejected the document
            # against the chart's values.schema.json (srd006 R2.1). Unmapped, that
            # status died as "status 400 is not mapped" and the intent answered
            # command_error, which reads as a broken boundary rather than as the
            # caller having decided values the chart refuses.
            - {status: [400], signal: InstanceRejected}
            # 500 is an apply that ran and failed or rolled itself back; 502 is an
            # applier whose machine could not run at all. Both are boundary
            # failures rather than faults in the document, so both take
            # CommandError -- but declared, because an unmapped status fails the
            # dispatch with "status 502 is not mapped" and buries the applier's own
            # reason under a message about the mapping.
            - {status: [500, 502], signal: CommandError}
          response:
            output: {}
          side_effects:
            - kind: external_api
              target: deployment_api.apply
              state: instance_applied
          reversibility:
            classification: irreversible
            undo: irreversible
            requires_confirmation: true
        read_rollout:
          # Verify the instance's health through the deployment API's rollout read
          # (srd005 R4.1) before reporting the operation complete. The rollout
          # response carries the phase and the Deployment's counts (srd006 R1.4,
          # R3.3); all four travel on so the panel renders what it declares. A
          # read the applier could not serve answers 502, which is outside the
          # declared success status and so emits CommandError rather than a
          # phase.
          method: GET
          path: /provisioning/api/rollout
          params:
            body_source: none
          success: {status: [200], signal: HealthReported}
          response:
            output:
              health: $.phase
              ready: $.ready
              desired: $.desired
              revision: $.revision
          side_effects:
            - kind: external_api
              target: deployment_api.rollout
              state: read_only
          reversibility:
            classification: reversible
            undo: noop
        read_state:
          # Read the deployed mesh view through the deployment API's state read
          # (srd006 R1.5), so the provisioning panel's initial load is served by
          # the creator rather than 404ing. The state_response contract is flat
          # (srd006 deployment_api_contract): machine_request response bodies map
          # one selector per named field, so these fields travel through
          # unchanged rather than being regrouped into a nested object at this
          # hop. A read the applier could not serve answers 502, which is
          # outside the declared success status and so emits CommandError rather
          # than a mapped-empty view.
          method: GET
          path: /provisioning/api/state
          params:
            body_source: none
          success: {status: [200], signal: StateReported}
          response:
            output:
              rags: $.rags
              llmInCluster: $.llmInCluster
              llmExternalURL: $.llmExternalURL
              llmChatModel: $.llmChatModel
              llmEmbedModel: $.llmEmbedModel
              llmChatModels: $.llmChatModels
              llmTierModel: $.llmTierModel
              llmTopology: $.llmTopology
              paramsNResults: $.paramsNResults
              paramsChunkCap: $.paramsChunkCap
              paramsTierDefault: $.paramsTierDefault
          side_effects:
            - kind: external_api
              target: deployment_api.state
              state: read_only
          reversibility:
            classification: reversible
            undo: noop

    chroma:
      # The vector store the corpus-ingest child writes into. The creator reads it
      # before and after the child to report the run's contribution (srd005 R3.1)
      # rather than trusting the child's exit code or the accumulated collection
      # total: a run can exit zero having written nothing.
      base_url: ${CHROMA_URL:-http://127.0.0.1:8000}
      auth_ref: none
      limits_ref: local_chroma_client
      operations:
        resolve_ingest_collection:
          # Resolve the collection the child will ingest into, to its id.
          # get_or_create keeps the read total: a collection the child never
          # created resolves to an empty one and counts zero rather than failing
          # as a missing resource, and it is also what lets a caller's first
          # ingest into a new collection succeed.
          #
          # The name is one value shared with the corpus-ingest child, which reads
          # the same reference (agents/corpus-ingest/corpus-rest.yaml). Both were
          # the literal `corpus` and agreed only by coincidence, which is what let
          # a count delta be measured over a collection the child never wrote.
          #
          # The request chooses it. run_corpus_ingest overlays the requested name
          # on the child's environment (agent-core GH-1884), so the collection
          # resolved here, counted on either side of the child, and written by the
          # child is one value. It was deployment configuration until
          # v0.20260828.0, when an exec declaration could carry no environment and
          # the agent binary takes no collection flag; an intent naming another
          # collection was refused rather than honoured (GH-192, GH-195).
          method: POST
          path: /api/v2/tenants/default_tenant/databases/default_database/collections
          params:
            body_schema:
              type: object
              properties:
                collection: {type: string}
                directory: {type: string}
                embedding_model: {type: string}
            body_source: previous_result
            # This is the leg's first word, so the previous result is the seeded
            # request and $.collection is what the caller asked for. It is both
            # sent -- the body below resolves the collection the caller named --
            # and carried, so the child run downstream is given the same one.
            input_mapping:
              collection: $.collection
              directory: $.directory
              embedding_model: $.embedding_model
            # All three ride through. The collection and directory are for the
            # child, whose exec word is three words downstream by the time it is
            # dispatched -- an exec parameter without a declared source is read
            # from the adjacent previous result, which by then is a document
            # count. The embedding family is for the judge immediately after
            # this word: a predicate reads only the previous result, so the
            # seeded request is already out of reach there.
            carry_forward: [collection, directory, embedding_model]
          body:
            name: "{{ params.collection }}"
            get_or_create: true
          success: {status: [200, 201], signal: CollectionResolved}
          response:
            output:
              collection_id: $.id
              # Chroma echoes the name it resolved. The success response reports
              # this rather than the requested name, so the caller reads where its
              # documents actually went rather than what it asked for.
              collection_name: $.name
          side_effects:
            - kind: external_api
              target: chroma.collection
              state: read_only
          reversibility:
            classification: reversible
            undo: noop
        count_ingested_documents:
          # Chroma answers this with a bare integer, which agent-core cannot decode
          # into an object, so it lands under `raw` as a string (client_response.go
          # decodeResponsePayload). The count therefore travels as a string and the
          # value predicate coerces both reads to numbers.
          #
          # Both the pre-run and post-run words invoke this operation. Their
          # immediately preceding results differ, so the collection id is selected
          # from the earlier resolve through command state rather than from the
          # previous result (agent-core srd038).
          method: GET
          path: /api/v2/tenants/default_tenant/databases/default_database/collections/{collection}/count
          params:
            path:
              collection: {type: string}
            body_source: command_state
            input_mapping:
              collection: $from(resolve_ingest_collection).mapped.collection_id
          success: {status: [200], signal: DocumentsCounted}
          response:
            output:
              count: $.raw
          side_effects:
            - kind: external_api
              target: chroma.count
              state: read_only
          reversibility:
            classification: reversible
            undo: noop

  servers:
    creator_instance:
      # The instance endpoint is served on its own service and port, reached only by
      # the provisioning-workflow-orchestrator (srd005 R1). It accepts a declared operation and SHALL NOT
      # accept an already-resolved endpoint or credential from the provisioning-workflow-orchestrator; no
      # runtime input supplies transport authority.
      address: ${CREATOR_BIND_HOST:-127.0.0.1}:18110
      limits_ref: local_creator_instance
      endpoints:
        instance:
          method: POST
          path: /api/v1/instance
          binding: machine_request
          request:
            # The provisioning-workflow-orchestrator's rollout operation carries the decided values-plane
            # document as content (srd006 R1.4); the creator forwards it to the
            # applier apply.
            #
            # content is required, because every operation this endpoint realizes
            # goes through apply_instance, whose body is {schema_version, content}.
            # It was optional until GH-755, on the premise that a non-rollout
            # operation (an ingest) would omit it -- but no leg realizes such an
            # operation: the creator declares one client (deployment_api) and the
            # machine drives apply_instance on Seed whatever the operation says.
            # A request without content therefore died inside request rendering
            # ("body field \"content\" must be string") and surfaced as an opaque
            # 500, which is what broke mage integration:controlPlane. Declaring it
            # required turns that into a 400 the caller can read. The corpus-ingest
            # child run in srd005 R3.1 now has its own /api/v1/ingest endpoint and
            # SeedIngest leg below; it does not pass through this values-apply
            # endpoint.
            body_schema:
              type: object
              required: [operation, content]
              properties:
                operation: {type: string}
                # Accepted and not read: the applier decides nothing from the
                # role, and its only caller sends a fixed one. operation above is
                # read -- apply_instance carries it so a rejection can name what
                # was rejected.
                role: {type: string}
                content: {type: string}
          machine_request:
            profile: profile.yaml
            machine: request-machine.yaml
            # The apply leg waits on the applier\'s full rollout, so this tracks the
            # applier\'s own apply budget rather than a request-response round trip.
            timeout: 600s
            request:
              body:
                operation: $.operation
                role: $.role
                content: $.content
            response:
              terminal_signals:
                HealthReported:
                  status: 200
                  content_type: application/json
                  body:
                    status: healthy
                    health: $.mapped.health
                # A rejected values document is the caller's fault and retrying it
                # unchanged will not help, so it answers 422 rather than the 500
                # a failed boundary answers. The provisioning-workflow-orchestrator
                # maps this to its own Rejected terminal, the same shape the ingest
                # leg uses for a run that wrote no documents.
                InstanceRejected:
                  status: 422
                  content_type: application/json
                  body:
                    schema_version: "1"
                    status: rejected
                    error: values_rejected
                    # The operation the caller asked for, carried by
                    # apply_instance. A plain $.operation resolves here -- a
                    # REST client word's output always carries one -- but to
                    # agent-core's own operation name, "apply_instance", so
                    # this field answered with an internal word name where the
                    # caller's operation belonged. Not the GH-198 shape, which
                    # ships selector text: this resolved, to the wrong thing.
                    operation: $.carried.operation
                CommandError:
                  status: 500
                  content_type: application/json
                  body:
                    error: command_error
                    # All three come from the failure result agent-core builds
                    # for a client CommandError, which carries failure_stage,
                    # message, signal, rest_ref, resource, and operation. Here
                    # operation is the client operation that broke, which is
                    # what an operator reading a 500 needs -- unlike the 422
                    # above, where the caller's own operation is the answer.
                    stage: $.failure_stage
                    message: $.message
                    operation: $.operation
        rollout:
          # The rollout status the provisioning-workflow-orchestrator polls while a reconfiguration runs,
          # so it can aggregate progress for the provisioning panel (srd004 R1.3).
          # Reached by the provisioning-workflow-orchestrator, not a browser: the creator exposes no
          # browser-facing surface (srd005 R5.4). GH-684.
          method: GET
          path: /api/v1/rollout
          binding: machine_request
          machine_request:
            profile: profile.yaml
            machine: request-machine.yaml
            # Contains the applier rollout endpoint this hop calls, which allows
            # 30s because two real kubectl reads can exceed ten seconds on a
            # healthy cluster. At 15s that allowance was unusable: a healthy
            # 16-29s read died here, one hop above the budget written for it.
            timeout: 35s
            # SeedHealth runs the verify leg alone. A poll is a read: it applies
            # nothing and mutates no instance state.
            initial_signal: SeedHealth
            request:
              body: {}
            response:
              # Keyed by terminal state. A read that fails must not arrive as a
              # successful unknown phase, so Failed is its own response rather than
              # collapsing into the 200 (agent-core srd030 R4.6, GH-615).
              terminal_states:
                HealthReported:
                  status: 200
                  content_type: application/json
                  body:
                    schema_version: "1"
                    phase: $.mapped.health
                    ready: $.mapped.ready
                    desired: $.mapped.desired
                    revision: $.mapped.revision
                Failed:
                  status: 502
                  content_type: application/json
                  body:
                    error: rollout_read_failed
                    stage: $.failure_stage
                    message: $.message
        ingest:
          # The corpus-ingest child run the provisioning-workflow-orchestrator delegates (srd004 R2.1,
          # srd005 R3.1). Its own endpoint rather than an operation on /instance,
          # because initial_signal is per-endpoint: the machine cannot branch on a
          # body field, which is why an ingest posted at /instance could only ever
          # take the values-apply leg (GH-755).
          method: POST
          path: /api/v1/ingest
          binding: machine_request
          request:
            body_schema:
              type: object
              # collection is required because it is the collection the run
              # resolves, counts, and writes into. The env overlay that carries it
              # to the child fails dispatch on an empty value rather than falling
              # back to the creator's own, so an omitted collection must be a 400
              # here rather than a boundary failure three words later.
              #
              # embedding_model is required for the same shape of reason, arrived
              # at differently: it is compared against the family this deployment
              # ingests at, and a predicate operand that does not resolve is a
              # CommandError rather than a false comparison (agent-core srd041
              # R4.2). An omitted family could therefore only 500 or read as a
              # mismatch, so intake is where it has to be caught. It was accepted
              # and read by nothing until GH-205.
              #
              # The provisioning-workflow-orchestrator, this endpoint's only
              # caller, requires both on the intent too, so nothing that reaches
              # here omits either.
              required: [directory, collection, embedding_model]
              properties:
                directory: {type: string}
                collection: {type: string}
                embedding_model: {type: string}
          machine_request:
            profile: profile.yaml
            machine: request-machine.yaml
            timeout: 600s
            initial_signal: SeedIngest
            request:
              body:
                # The directory becomes the child's workspace; the corpus-ingest
                # profile roots its document resource there.
                #
                # collection reaches the child as a per-request value, overlaid on
                # its environment by run_corpus_ingest (agent-core GH-1884).
                #
                # embedding_model does not, and stays deployment configuration: an
                # ingest embedded at a family the serving RAG unit does not report
                # leaves every document it wrote unreachable to every turn
                # (srd002 R3.3), so the family is a property of the deployment the
                # collection is served by rather than of the request. It is
                # threaded here to be checked against that deployment value rather
                # than to be applied -- the caller declares the family it expects,
                # and a request expecting another one is refused before the child
                # runs instead of writing documents no turn can retrieve.
                directory: $.directory
                collection: $.collection
                embedding_model: $.embedding_model
            response:
              # Keyed by terminal state. The child-run and Chroma words emit a fixed
              # signal vocabulary, so signal keying could not separate a failed child
              # from an unreadable collection (agent-core srd030 R4.6, GH-615).
              #
              # IngestRejected is a 422 and IngestFailed a 500, which is the
              # distinction the provisioning-workflow-orchestrator's declared failure mapping needs: a run
              # that wrote nothing is the caller's source falling short, while a
              # child that could not run, or a collection that could not be read,
              # is ours. A count that will not resolve reaches IngestFailed, not
              # IngestRejected -- a broken read is not an empty corpus.
              terminal_states:
                Ingested:
                  status: 200
                  content_type: application/json
                  body:
                    schema_version: "1"
                    status: ingested
                    # Both come from report_ingest_outcome, the terminal word on
                    # this branch, which is what makes them plain $. selectors.
                    # They were the judge's own output until GH-198: a predicate
                    # emits only left/op/operand_type/held/right, so the collection
                    # had to be reached with $from(...) -- which a terminal body
                    # does not resolve and returns verbatim, so the response
                    # carried the selector text where the collection name belonged.
                    count: $.count
                    # The collection the run actually ingested into, echoed so the
                    # caller reads where its documents went rather than assuming
                    # the collection it named was honoured.
                    collection: $.collection
                    status_detail: documents were written
                FamilyRefused:
                  status: 422
                  content_type: application/json
                  body:
                    schema_version: "1"
                    status: rejected
                    # Distinct from ingest_shortfall: a run that wrote nothing and
                    # a request expecting an embedding family this deployment does
                    # not ingest at are different faults, and one error code for
                    # both would tell an operator reading a trace nothing -- the
                    # argument srd009 R1.6 already makes for provider failures.
                    error: embedding_family_mismatch
                    # requested_family_matches is the terminal word here, and its
                    # operands are the two families: left is what the caller
                    # expected, right is the family this deployment ingests at.
                    # The deployment's is the answer to "what would this ingest
                    # have embedded at", and it is already in the word's output.
                    embedding_model: $.right
                    count: "0"
                IngestRejected:
                  status: 422
                  content_type: application/json
                  body:
                    schema_version: "1"
                    status: rejected
                    error: ingest_shortfall
                    count: "0"
                IngestFailed:
                  status: 500
                  content_type: application/json
                  body:
                    schema_version: "1"
                    status: ingest_failed
                    error: ingest_failed
              # Every CommandError raised by a word on this branch reaches
              # IngestFailed above. A CommandError arriving in AwaitingRequest --
              # before any ingest word ran -- reaches Failed instead, which the
              # state map deliberately does not name: the four states above are
              # this leg's outcomes and nothing else belongs among them.
              #
              # Left unmapped, that run answered "response_missing: neither
              # terminal state nor terminal signal is mapped" rather than this
              # endpoint's contract, because an unmapped terminal is a
              # diagnostic, not a default. agent-core consults the state map
              # first and the signal map second, so declaring the signal covers
              # the pre-dispatch failure without widening the states.
              terminal_signals:
                CommandError:
                  status: 500
                  content_type: application/json
                  body:
                    schema_version: "1"
                    status: ingest_failed
                    error: ingest_failed
        state:
          # The deployed mesh view the provisioning-workflow-orchestrator carries to the provisioning
          # panel's initial load (srd006 R1.5). Reached by the provisioning-workflow-orchestrator, not a
          # browser: the creator exposes no browser-facing surface (srd005 R5.4).
          method: GET
          path: /api/v1/state
          binding: machine_request
          machine_request:
            profile: profile.yaml
            machine: request-machine.yaml
            # Contains the applier state endpoint this hop calls, which allows
            # 15s. Equal budgets left no margin for the hop itself, so a read
            # finishing at the far side's limit still failed here.
            timeout: 20s
            # SeedState runs the read_state leg alone. A read: it applies nothing
            # and mutates no instance state.
            initial_signal: SeedState
            request:
              body: {}
            response:
              # Keyed by terminal state. A read that fails must not arrive as a
              # successful mapped-empty view (agent-core srd030 R4.6, GH-615).
              # The fields are flat, matching the applier's state_response
              # contract: machine_request response bodies map one selector per
              # named field, so they travel through unchanged rather than being
              # regrouped into a nested object at this hop (GH-753).
              terminal_states:
                StateReported:
                  status: 200
                  content_type: application/json
                  body:
                    schema_version: "1"
                    rags: $.mapped.rags
                    llmInCluster: $.mapped.llmInCluster
                    llmExternalURL: $.mapped.llmExternalURL
                    llmChatModel: $.mapped.llmChatModel
                    llmEmbedModel: $.mapped.llmEmbedModel
                    llmChatModels: $.mapped.llmChatModels
                    llmTierModel: $.mapped.llmTierModel
                    llmTopology: $.mapped.llmTopology
                    paramsNResults: $.mapped.paramsNResults
                    paramsChunkCap: $.mapped.paramsChunkCap
                    paramsTierDefault: $.mapped.paramsTierDefault
                Failed:
                  status: 502
                  content_type: application/json
                  body:
                    error: state_read_failed
                    stage: $.failure_stage
                    message: $.message

    creator_control:
      address: ${CREATOR_BIND_HOST:-127.0.0.1}:18111
      limits_ref: local_creator_control
      queue:
        name: creator_control
        capacity: 8
        timeout: 30s
      shutdown:
        timeout: 5s
        drain_policy: drain_then_stop
      endpoints:
        health:
          method: GET
          path: /api/lifecycle/health
          binding: health

    monitor:
      address: ${CREATOR_BIND_HOST:-127.0.0.1}:18112
      limits_ref: local_creator_monitor
      lifecycle_exit: {disabled: true}
      queue:
        name: creator_monitor
        capacity: 8
        overflow: reject
        timeout: 100ms
      shutdown:
        timeout: 2s
        drain_policy: drain_then_stop
        stop_listeners: true
        unblock_await_signal: ServerStopped
      endpoints:
        machine_spec:  {method: GET, path: /monitor/machine,       binding: read_state,    monitor_view: machine_spec}
        declared_machines: {method: GET, path: /monitor/machines, binding: read_state, monitor_view: declared_machines}
        current_state: {method: GET, path: /monitor/state,         binding: read_state,    monitor_view: current_state}
        tools:         {method: GET, path: /monitor/tools,         binding: read_state,    monitor_view: tools}
        metrics:       {method: GET, path: /monitor/metrics,       binding: read_state,    monitor_view: metrics}
        recent_events: {method: GET, path: /monitor/events,        binding: read_state,    monitor_view: events}
        event_stream:  {method: GET, path: /monitor/events/stream, binding: stream_events, monitor_view: events}
