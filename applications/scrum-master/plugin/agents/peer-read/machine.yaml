name: peer-read
purpose: |-
  Record a reviewer's peer read of a release (srd015): the gate's peer-
  read check passes once a person other than the releaser has read the
  release issue. Use when a reviewer asks to approve a release.

  This machine has no model state: scrum-master release approve (design.md
  D10, D14; GH-37). SCRUM_MASTER_PROJECT and SCRUM_MASTER_ISSUE name the release issue.
configuration:
  machine: plugin/agents/peer-read/machine.yaml
  tools: plugin/agents/peer-read/tools.yaml
invariants:
- Every step is a word; no model acts anywhere in this machine
- A refusal ends the run in the state that names it, with the word's reason
lifecycle: |-
  1. Idle → Read (Seed): scrum-master release approve
  2. Read → Done (ToolDone)
initial_state: Idle
budget:
  command_timeout: 16m
  max_iterations: 10
states:
- name: Idle
  meaning: Initial state before the first word.
- name: Read
  meaning: |
    The peer-read word: scrum-master release approve records the
    reviewer's read of the release issue, which the gate's peer-read check
    requires.
- name: Done
  run_status: succeeded
  meaning: |
    Terminal. Every word ran, and the last one reported what it did.
- name: Refused
  run_status: failed
  meaning: |
    Terminal. The peer read was refused — the reviewer is the releaser —
    and the word's reason is the run's last output.
- name: Failed
  run_status: failed
  meaning: Terminal. An infrastructure error outside the words' refusals.
terminal_states:
- Done
- Refused
- Failed
signals:
- name: Seed
  trigger: Loop initialization.
- name: ToolDone
  trigger: A word executed successfully.
- name: ToolFailed
  trigger: A word reported failure — a refusal with its reason.
- name: CommandError
  trigger: Infrastructure-level error (not a tool failure).
transitions:
- state: Idle
  signal: Seed
  next: Read
  action: release_approve
  summary: true
- state: Read
  signal: ToolFailed
  next: Refused
- state: Read
  signal: ToolDone
  next: Done
- state: Idle
  signal: CommandError
  next: Failed
- state: Read
  signal: CommandError
  next: Failed
