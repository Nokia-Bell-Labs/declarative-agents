# Fixture for R-MACH-025: the machine requires its loop-signal routes, but
# its side-effecting step runs on the transition into a final state, so
# nothing reads that step's outcome.
kind: machine
schema_version: 1
name: applier
initial_state: Idle
budget: {command_timeout: 1m, max_iterations: 10}
on_failure: {require_routes: true}
terminal_states: [Done, Failed]
states:
  - {name: Idle, meaning: Waiting for work.}
  - {name: Done, meaning: The change is in place., run_status: succeeded}
  - {name: Failed, meaning: The change failed., run_status: failed}
signals:
  - {name: Seed, trigger: A caller hands work over.}
  - {name: CommandError, trigger: A word failed.}
  - {name: BudgetExhausted, trigger: The budget is spent.}
transitions:
  - {state: Idle, signal: Seed, next: Done, action: apply, label: change}
  - {state: Idle, signal: CommandError, next: Failed}
  - {state: Idle, signal: BudgetExhausted, next: Failed}
