# Compatibility alias for the pre-#1075 profile path.
#
# New consumers must use agents/runtime-state-reader/profile.yaml. This wrapper
# is supported through applications/catalog/v0.* and removed at v1. It selects
# the canonical implementation directly; no machine, declarations, or REST
# assets are forked.
name: monitor
machine: ../runtime-state-reader/machine.yaml
tools:
  - ../runtime-state-reader/tools.yaml
tool_declarations:
  - ../runtime-state-reader/declarations.yaml
rest_definitions:
  - ../runtime-state-reader/rest.yaml
