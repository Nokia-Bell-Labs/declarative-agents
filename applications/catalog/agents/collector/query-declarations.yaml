unit: catalog-collector-query-declarations
imports:
- /opt/agent-core/tools/units/types-collections.yaml
- ../units/types-collector.yaml
tools:
  - name: query_list_traces
    type: builtin
    init: spool_list_traces
    category: boundary
    visibility: internal
    signature:
      emits: [TracesListed, CommandError]
    description: Read paginated trace summaries from the collector spool.
    parameters: {type: object, properties: {}}
    output:
      description: Paginated trace summaries.
      schema:
        type: object
        properties:
          traces: {type: array}
          total: {type: integer}
          offset: {type: integer}
          page_size: {type: integer}
          skipped_lines: {type: integer}
          # complete, partial, or unavailable: an object-store outage never labels
          # WAL-only history complete, so the collector does not lie about
          # persisted history while readiness stays intake-only (srd042 R6; #2484 R6).
          storage_status: {type: string}
    side_effects:
      - {kind: filesystem_read, target: collector trace spool, state: read_only}
    reversibility: {classification: reversible}
    undo: {strategy: noop, description: Reading a spool changes nothing.}
    errors:
      - {signal: CommandError, condition: spool path cannot be read, state_after_failure: no output is returned}
    config:
      path: ${COLLECTOR_SPOOL_PATH:-traces/collector.ndjson}
      page_size: 20
      max_page_size: 100
      offset: 0
      # Reads the same object backend the spool writes when the chart selects it; filesystem NDJSON otherwise (srd042 R11; #2490 R8, R9). The per-read deadline defaults in Go; a timeout-named field here would trip the finite-authority audit.
      storage: {backend: "${COLLECTOR_STORAGE_BACKEND:-filesystem}", bucket_url: "${COLLECTOR_OBJECT_BUCKET_URL:-}", endpoint: "${COLLECTOR_OBJECT_ENDPOINT:-}", prefix: "${COLLECTOR_OBJECT_PREFIX:-traces}", wal_path: "${COLLECTOR_TRACE_WAL_PATH:-traces/collector.wal}", max_objects: 500, max_bytes: 67108864}

  - name: query_get_trace
    type: builtin
    init: spool_get_trace
    category: boundary
    visibility: internal
    signature:
      emits: [TraceRetrieved, CommandError]
    description: Read all spans for one trace from the collector spool.
    parameters: {type: object, properties: {}}
    output:
      description: All spans for one trace.
      schema:
        type: object
        properties:
          trace_id: {type: string}
          spans: {type: array}
          span_count: {type: integer}
          skipped_lines: {type: integer}
          storage_status: {type: string}
    side_effects:
      - {kind: filesystem_read, target: collector trace spool, state: read_only}
    reversibility: {classification: reversible}
    undo: {strategy: noop, description: Reading a spool changes nothing.}
    errors:
      - {signal: CommandError, condition: spool path cannot be read or trace_id is empty, state_after_failure: no output is returned}
    config:
      path: ${COLLECTOR_SPOOL_PATH:-traces/collector.ndjson}
      trace_id: ""
      storage: {backend: "${COLLECTOR_STORAGE_BACKEND:-filesystem}", bucket_url: "${COLLECTOR_OBJECT_BUCKET_URL:-}", endpoint: "${COLLECTOR_OBJECT_ENDPOINT:-}", prefix: "${COLLECTOR_OBJECT_PREFIX:-traces}", wal_path: "${COLLECTOR_TRACE_WAL_PATH:-traces/collector.wal}", max_objects: 500, max_bytes: 67108864}

  - name: query_list_metrics
    type: builtin
    init: spool_list_metrics
    category: boundary
    visibility: internal
    signature:
      emits: [MetricsListed, CommandError]
    description: Read paginated metric summaries from the collector metric spool.
    parameters: {type: object, properties: {}}
    output:
      description: Paginated metric summaries.
      schema:
        type: object
        properties:
          metrics: {type: array}
          total: {type: integer}
          offset: {type: integer}
          page_size: {type: integer}
          skipped_lines: {type: integer}
          storage_status: {type: string}
    side_effects:
      - {kind: filesystem_read, target: collector metric spool, state: read_only}
    reversibility: {classification: reversible}
    undo: {strategy: noop, description: Reading a spool changes nothing.}
    errors:
      - {signal: CommandError, condition: spool path cannot be read, state_after_failure: no output is returned}
    config:
      path: ${COLLECTOR_METRICS_SPOOL_PATH:-metrics/collector.ndjson}
      page_size: 20
      max_page_size: 100
      offset: 0
      storage: {backend: "${COLLECTOR_STORAGE_BACKEND:-filesystem}", bucket_url: "${COLLECTOR_OBJECT_BUCKET_URL:-}", endpoint: "${COLLECTOR_OBJECT_ENDPOINT:-}", prefix: "${COLLECTOR_OBJECT_PREFIX:-metrics}", wal_path: "${COLLECTOR_METRICS_WAL_PATH:-metrics/collector.wal}", max_objects: 500, max_bytes: 67108864}

  - name: query_get_metric
    type: builtin
    init: spool_get_metric
    category: boundary
    visibility: internal
    signature:
      emits: [MetricRetrieved, CommandError]
    description: Read one bounded page of spooled records for a metric name.
    parameters: {type: object, properties: {}}
    output:
      description: One bounded page plus total counts for one metric name.
      schema:
        type: object
        properties:
          metric_name: {type: string}
          records:
            type: array
            items:
              type: object
              properties:
                name: {type: string}
                type: {type: string}
                unit: {type: string}
                data_point_count: {type: integer}
                service: {type: string}
                resource:
                  type: array
                  description: Decoded OTLP resource attributes preserved unchanged from the spool record, including service.name and test.run.id when present.
                  items:
                    type: object
                    properties:
                      Key: {type: string}
                      Value: {type: object}
                    required: [Key, Value]
                metric: {type: object}
              required: [name, type, unit, data_point_count, service, resource, metric]
          record_count: {type: integer}
          page_record_count: {type: integer}
          total: {type: integer}
          data_point_count: {type: integer}
          offset: {type: integer}
          page_size: {type: integer}
          skipped_lines: {type: integer}
          storage_status: {type: string}
    side_effects:
      - {kind: filesystem_read, target: collector metric spool, state: read_only}
    reversibility: {classification: reversible}
    undo: {strategy: noop, description: Reading a spool changes nothing.}
    errors:
      - {signal: CommandError, condition: spool path cannot be read or metric_name is empty, state_after_failure: no output is returned}
    config:
      path: ${COLLECTOR_METRICS_SPOOL_PATH:-metrics/collector.ndjson}
      metric_name: ""
      page_size: 20
      max_page_size: 100
      offset: 0
      storage: {backend: "${COLLECTOR_STORAGE_BACKEND:-filesystem}", bucket_url: "${COLLECTOR_OBJECT_BUCKET_URL:-}", endpoint: "${COLLECTOR_OBJECT_ENDPOINT:-}", prefix: "${COLLECTOR_OBJECT_PREFIX:-metrics}", wal_path: "${COLLECTOR_METRICS_WAL_PATH:-metrics/collector.wal}", max_objects: 500, max_bytes: 67108864}

  - name: query_span_heatmap
    type: builtin
    init: spool_span_heatmap
    category: boundary
    visibility: internal
    signature:
      emits: [SpanHeatmapReady, CommandError]
    description: Filter spooled spans and return a duration heatmap.
    parameters: {type: object, properties: {}}
    output:
      description: A duration heatmap over filtered spans.
      schema:
        type: object
        properties:
          heatmap: {type: object}
          matched: {type: integer}
          exemplar_trace_ids: {type: array}
          skipped_lines: {type: integer}
    side_effects:
      - {kind: filesystem_read, target: collector trace spool, state: read_only}
    reversibility: {classification: reversible}
    undo: {strategy: noop, description: Reading a spool changes nothing.}
    errors:
      - {signal: CommandError, condition: spool path cannot be read, state_after_failure: no output is returned}
    config:
      path: ${COLLECTOR_SPOOL_PATH:-traces/collector.ndjson}
      time_buckets: 24
      duration_edges_ms: [0, 1, 10, 50, 100, 500, 1000, 5000]
      exemplar_cap: 20

  - name: query_span_group_by
    type: builtin
    init: spool_span_group_by
    category: boundary
    visibility: internal
    signature:
      emits: [SpanGroupByReady, CommandError]
    description: Filter spooled spans and count them by one requested key.
    parameters: {type: object, properties: {}}
    output:
      description: Bounded group-by counts over filtered spans.
      schema:
        type: object
        properties:
          matched: {type: integer}
          exemplar_trace_ids: {type: array}
          skipped_lines: {type: integer}
          group_by: {type: string}
          groups: {type: array}
          dropped_groups: {type: integer}
          dropped_span_total: {type: integer}
    side_effects:
      - {kind: filesystem_read, target: collector trace spool, state: read_only}
    reversibility: {classification: reversible}
    undo: {strategy: noop, description: Reading a spool changes nothing.}
    errors:
      - {signal: CommandError, condition: group_by is missing or spool path cannot be read, state_after_failure: no output is returned}
    config:
      path: ${COLLECTOR_SPOOL_PATH:-traces/collector.ndjson}
      group_by: ""
      top_n: 20
      max_top_n: 100
      exemplar_cap: 20

  - name: span_group_by_requested
    type: builtin
    init: value_predicate
    category: word
    visibility: internal
    signature:
      output: builtin-types-collections.Comparison
      emits: [SpanGroupByRequested, SpanHeatmapOnly, CommandError]
    description: Branch on whether the stats request selected a group-by key.
    parameters: {type: object, properties: {}, additionalProperties: false}
    output: {description: Group-by selection predicate}
    errors: [{signal: CommandError, condition: selector cannot resolve, state_after_failure: No analytics are dispatched.}]
    config:
      left: $from(seed).parameters.group_by
      op: non_empty
      operand_type: string
      satisfied: SpanGroupByRequested
      unsatisfied: SpanHeatmapOnly

  - name: compose_span_stats
    type: builtin
    init: compose
    category: response
    visibility: internal
    signature:
      output: catalog-types-collector.SpanStatsResponse
      emits: [SpanStatsReady]
    description: Compose independent heatmap and group-by results into the stable HTTP response.
    parameters: {type: object, properties: {}, additionalProperties: false}
    output: {description: Combined Explore statistics response}
    errors: [{signal: CommandError, condition: Composition fails, state_after_failure: No state changes.}]
    config:
      signal: SpanStatsReady
      inputs:
        heatmap: $from(span_heatmap).heatmap
        matched: $from(span_heatmap).matched
        exemplar_trace_ids: $from(span_heatmap).exemplar_trace_ids
        skipped_lines: $from(span_heatmap).skipped_lines
        group_by: $from(span_group_by).group_by
        groups: $from(span_group_by).groups
        dropped_groups: $from(span_group_by).dropped_groups
        dropped_span_total: $from(span_group_by).dropped_span_total
      template: '{"heatmap":{{ json heatmap }},"matched":{{ matched }},"exemplar_trace_ids":{{ json exemplar_trace_ids }},"skipped_lines":{{ skipped_lines }},"group_by":{{ json group_by }},"groups":{{ json groups }},"dropped_groups":{{ dropped_groups }},"dropped_span_total":{{ dropped_span_total }}}'

  - name: compose_span_heatmap
    type: builtin
    init: compose
    category: response
    visibility: internal
    signature:
      output: catalog-types-collector.SpanStatsResponse
      emits: [SpanStatsReady]
    description: Compose a heatmap-only analysis into the stable HTTP response.
    parameters: {type: object, properties: {}, additionalProperties: false}
    output: {description: Heatmap-only Explore statistics response}
    errors: [{signal: CommandError, condition: Composition fails, state_after_failure: No state changes.}]
    config:
      signal: SpanStatsReady
      inputs:
        heatmap: $from(span_heatmap).heatmap
        matched: $from(span_heatmap).matched
        exemplar_trace_ids: $from(span_heatmap).exemplar_trace_ids
        skipped_lines: $from(span_heatmap).skipped_lines
      template: '{"heatmap":{{ json heatmap }},"matched":{{ matched }},"exemplar_trace_ids":{{ json exemplar_trace_ids }},"skipped_lines":{{ skipped_lines }},"group_by":"","groups":[],"dropped_groups":0,"dropped_span_total":0}'

  - name: query_span_breakdown
    type: builtin
    init: spool_span_breakdown
    category: boundary
    visibility: internal
    signature:
      emits: [SpanBreakdownReady, CommandError]
    description: Rank the attributes that distinguish a selected span region from its complement.
    parameters: {type: object, properties: {}}
    output:
      description: The ranked attribute divergence between the selection and its complement.
      schema:
        type: object
        properties:
          inside_total: {type: integer}
          outside_total: {type: integer}
          exemplar_trace_ids: {type: array}
          ranked: {type: array}
          dropped: {type: integer}
          skipped_lines: {type: integer}
    side_effects:
      - {kind: filesystem_read, target: collector trace spool, state: read_only}
    reversibility: {classification: reversible}
    undo: {strategy: noop, description: Reading a spool changes nothing.}
    errors:
      - {signal: CommandError, condition: spool path cannot be read, state_after_failure: no output is returned}
    config:
      path: ${COLLECTOR_SPOOL_PATH:-traces/collector.ndjson}
      top_n: 20
      max_top_n: 100
      exemplar_cap: 20
