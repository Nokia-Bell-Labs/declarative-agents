# The provisioning-workflow-orchestrator serving lifecycle and its monitor pair, each one instantiation.
# The four lifecycle words arrive from the agent-core fragment under this
# agent's own names; nothing about them is written out here.
unit: mesh-provisioning-workflow-orchestrator-declarations
instantiate:
  - fragment: /opt/agent-core/tools/units/serve-lifecycle-declarations-fragment.yaml
    args:
      agent: "provisioning-workflow-orchestrator"
      launch_requests: launch_provisioning_workflow_orchestrator_requests
      launch_control: launch_provisioning_workflow_orchestrator_control
      await_control: await_provisioning_workflow_orchestrator_control
      stop_requests: stop_provisioning_workflow_orchestrator_requests
      requests_rest_ref: provisioning_workflow_orchestrator_intent
      control_rest_ref: provisioning_workflow_orchestrator_control
      requests_noun: intent
      requests_purpose: for provisioning intents
  - fragment: ../units/mesh-monitor-fragment.yaml
    args: {agent: "provisioning-workflow-orchestrator", control_await: await_provisioning_workflow_orchestrator_control, requests_stop: stop_provisioning_workflow_orchestrator_requests}
tools:
