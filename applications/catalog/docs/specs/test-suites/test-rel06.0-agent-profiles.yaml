id: test-rel06.0-agent-profiles
title: Test Suite for Release 06.0 Agent Profiles
release: "06.0"

overview: |
  This suite records executable proof for the applications/catalog side of the
  Release 06.0 migration. The proofs stay split by ownership boundary.
  applications/catalog validates profile references, mounted container usage, and
  release bundle tagging. agent-core integration targets consume these profiles,
  profile-local UI assets, and fixtures through the demo.yaml catalog_root. Application
  presentations, including applications/agent-architecture, own their
  composition and end-to-end evidence.

  Implemented cases name commands, Go tests, or Mage targets. No case depends
  on copied profile directories inside an agent-core runtime image.

  The suite does not make container availability universal. mage containerSmoke
  requires an agent-core image and a container engine. When that environment is
  present, the target proves mounted execution from /profiles; local validation
  and Go tests cover the same command construction without a live image.

traces:
  - rel06.0-uc001-mounted-profile-execution
  - rel06.0-uc002-profile-validation

preconditions:
  - agent-core is available as a sibling ../../agent-core checkout or through demo.yaml core_root.
  - An agent-core runtime image is available before running mage containerSmoke.
  - agent-core integration targets are run from the agent-core repository with the demo.yaml catalog_root pointing at this repository.
  - mage tag is run from main and creates only a local tag unless the maintainer pushes it later.

test_cases:
  - use_case: rel06.0-uc002-profile-validation
    name: Profile validation resolves migrated profile references
    go_test: go test ./magefiles -run 'Test(ValidatePortableProfileRefsResolvesExternalCoreToolRefs|DiscoverProfilesIncludesVariants|ValidatePortableProfileRefsValidatesProfileVariants|ValidatePortableProfileRefsRejectsCopiedCoreAgentRefs|ValidatePortableProfileRefsReportsMissingReference)$'
    integration_target: mage validate
    status: implemented
    description: |
      Validate every profile-shaped YAML file under agents/. The proof covers
      profile.yaml, profile-*.yaml, and *-profile.yaml discovery. It also checks
      that /opt/agent-core/tools maps to the selected agent-core checkout while references to
      /opt/agent-core/agents fail.
    inputs:
      profile_root: agents/
      core_root: demo.yaml core_root or sibling checkout
      supported_profile_names:
        - profile.yaml
        - profile-*.yaml
        - "*-profile.yaml"
    expected:
      profile_variants_discovered: true
      profile_local_paths_resolved: true
      core_tool_root_resolved: true
      copied_core_agent_refs_rejected: true
      missing_refs_reported: true
    traces:
      - rel06.0-uc002-profile-validation S1
      - rel06.0-uc002-profile-validation S2
      - rel06.0-uc002-profile-validation S3
      - srd001-agent-functional-blocks R1.1
      - srd001-agent-functional-blocks R1.2
      - srd001-agent-functional-blocks R1.3

  - use_case: rel06.0-uc001-mounted-profile-execution
    name: Mounted container smoke runs a profile from /profiles
    go_test: go test ./magefiles -run TestRunContainerSmokeCommands
    integration_target: mage containerSmoke
    status: implemented
    description: |
      Verify the mounted-profile container command. The smoke target first
      checks that /opt/agent-core/agents is absent, then mounts this repository
      at /profiles, mounts core-owned tools at /opt/agent-core/tools, mounts the
      clean specification-critic fixture at /work, and runs the profile with
      --directory /work.
    inputs:
      image: ${AGENT_CORE_IMAGE}
      profile_mount: /profiles
      workspace_source: testdata/integration/specification-critic-charter-demo
      workspace_mount: /work
      profile: /profiles/agents/specification-critic/profile.yaml
    expected:
      runtime_image_agent_dir_absent: true
      profiles_mounted_read_only: true
      core_tools_mounted_read_only: true
      profile_flag_uses_profiles_mount: true
      workspace_flag_uses_work_mount: true
    traces:
      - rel06.0-uc001-mounted-profile-execution S1
      - rel06.0-uc001-mounted-profile-execution S3
      - rel06.0-uc001-mounted-profile-execution S4
      - sm-multi-agent-profile-system validation_views

  - use_case: rel06.0-uc002-profile-validation
    name: Specification-critic profile demo charter validates YAML-only findings
    go_test: go test ./magefiles -run 'Test(WriteSpecificationCriticCharterDemoProfileFiles|AssertSpecificationCriticCharterDemoFindings)'
    integration_target: mage validate
    status: implemented
    description: |
      Validate that the specification-critic profile can run a profile-owned charter suite
      against a fixture without adding states or LLM behavior. The demo suite
      is YAML-only and intentionally emits one or more findings from grep_check,
      ref_check, and consistency_check.
    inputs:
      suite: agents/specification-critic/suites/demo-charter.yaml
      fixture: testdata/integration/specification-critic-charter-demo
      core_root: demo.yaml core_root or sibling checkout
    expected:
      profile_loads_default_core_suite_config: true
      demo_suite_selected_by_temp_profile_override: true
      grep_check_finding: specification-critic-demo-charter/no-internal-vocabulary
      ref_check_finding: specification-critic-demo-charter/citations-resolve
      consistency_check_finding: specification-critic-demo-charter/artifacts-exist
    traces:
      - rel06.0-uc002-profile-validation S1
      - srd005-specification-critic R2.1
      - srd005-specification-critic R3.1
      - srd005-specification-critic R1.2
      - srd005-specification-critic R3.2
      - gh-123 AC1
      - gh-123 AC3

  - use_case: rel06.0-uc002-profile-validation
    name: Profile bundle tags use local daily revisions
    go_test: cd ../magefiles && go test ./... -run 'Test(CreateReleaseTag|NextRevisionFromTags|ValidateReleaseBranch)'
    integration_target: mage tag
    status: implemented
    description: |
      Create the next v0.YYYYMMDD.N tag from existing local tags when the
      current branch is main. The target versions profile-owned YAML programs,
      profile-local UI assets, documentation, and fixtures. It excludes
      application-owned presentations and does not create or inspect agent-core
      runtime image tags.
    inputs:
      branch: main
      tag_shape: v0.YYYYMMDD.N
    expected:
      main_branch_required: true
      next_daily_revision_created: true
      local_tags_used: true
      agent_core_image_tags_untouched: true
    traces:
      - rel06.0-uc002-profile-validation S5
      - srd001-agent-functional-blocks R1.3

  - use_case: rel06.0-uc001-mounted-profile-execution
    name: Coding application consumes canonical profile closures
    go_test: applications/coding-agent package and integration targets
    integration_target: mage integration:codingLoop with catalog_root set to /path/to/applications/catalog in demo.yaml
    status: implemented
    description: |
      Run the coding-agent application integration while the demo.yaml catalog_root
      points at applications/catalog. The application packages and runs the canonical
      planner, executor, and critic profile closures.
    inputs:
      profile_root: demo.yaml catalog_root
      generator_fixture: testdata/integration/uc001-generator-coding
      evaluator_suite: testdata/integration/uc002-evaluator-benchmark/suite.yaml
    expected:
      generator_fixture_external: true
      evaluator_suite_external: true
      generator_profile_variants_external: true
      developer_absolute_paths_absent: true
    traces:
      - rel06.0-uc001-mounted-profile-execution S5
      - srd002-executor R1.1
      - srd002-executor R3.1
      - srd003-critic R1.1
      - srd003-critic R2.3
      - sm-agent-role-taxonomy generator
      - sm-agent-role-taxonomy evaluator

  - use_case: rel06.0-uc001-mounted-profile-execution
    name: Agent Core monitor integration consumes runtime-state-reader assets
    go_test: agent-core integration targets
    integration_target: mage integration:monitor with catalog_root set to /path/to/applications/catalog in demo.yaml
    status: implemented
    description: |
      Run agent-core integration targets from the agent-core repository with
      the demo.yaml catalog_root pointing at applications/catalog. monitor consumes the
      shipped runtime-state-reader profile. The rel04-monitor YAML record is
      documentation-only
      metadata, not an executable input. Concrete Knowledge Manager/
      documentation-curator profile and UI proof lives in the catalog-owned
      Rel07 suite; presentation composition lives in
      applications/agent-architecture.
    inputs:
      runtime_state_reader_profile: agents/runtime-state-reader/profile.yaml
      knowledge_manager_profile_proof: test-rel07.0-profile-integrations
    expected:
      runtime_state_reader_profile_external: true
      knowledge_manager_profile_evidence: rel07_catalog_owned
    traces:
      - rel06.0-uc001-mounted-profile-execution S2
      - rel06.0-uc001-mounted-profile-execution S5
      - srd008-runtime-state-reader R1.1
      - srd008-runtime-state-reader R2.1
      - sm-agent-role-taxonomy runtime-state-reader
