# Fixture for R-TOOL-002: a union variant is not an object type.
kind: tool-declaration
schema_version: 1
unit: union-example-types
types:
  - name: Implement
    schema:
      type: object
      properties:
        kind: {type: string, enum: [implement]}
        path: {type: string}
      required: [kind, path]
  - name: Review
    schema:
      type: object
      properties:
        kind: {type: string, enum: [review]}
        verdict: {type: string}
      required: [kind, verdict]
  - name: Work
    schema:
      type: array
      items:
        oneOf: [{$type: union-example-types.Implement}, {type: string}]
        discriminator: kind
