id: srd040-service-child-tools
title: Service-Child and Scenario Tools

problem: |
  A test-rig machine composes other machines: it starts a subject agent and its
  mocks as serve-mode children, runs validator machines against
  the subject, and reduces their terminal states to a verdict. The existing
  child-agent path (execute.RunAgent, used by the critic) spawns children that
  run to completion. Serve-mode children are different: they must start in the
  background, report an address, stay up while validators run, and stop
  cleanly without leaking processes.

  The rig also needs to find its work. Scenarios live as data beside the agent
  they test, in tests/<scenario>/ directories under configurable roots, so a
  discovery word must enumerate them deterministically.

goals:
  - G1: Define start_scenario_mock, start_scenario_subject, and stop_service for background serve-mode scenario children, with readiness composed from ordinary REST and delay words.
  - G2: Define one-validator child execution for MachineSpec iteration and join.
  - G3: Define init_scenario_session and next_scenario for deterministic scenario discovery and iteration under configured roots.
  - G4: Keep every word deterministic, LLM-free, and bounded in time.
  - G5: Declare honest reversibility and undo behavior for each word.

requirements:
  R1:
    title: Scenario child start words
    items:
      - R1.1: start_scenario_mock SHALL spawn the declared mock profile for one current-scenario fixture, and start_scenario_subject SHALL spawn the current scenario's subject profile, as background children serving until stopped.
      - R1.2: start_scenario_mock and start_scenario_subject SHALL inject declared and scenario-derived environment additions into each child, so fixture data and dependency URLs reach the intended scenario processes.
      - R1.3: Each scenario child start SHALL allocate or accept a listen address, and its output SHALL include the child identity and trusted runtime base URL.
      - R1.4: Children SHALL use the shared subprocess start transport for process-group management; cancellation of the owning agent context SHALL kill each child's whole process group, and orderly parent shutdown SHALL reap every tracked child rather than orphan it. SIGKILL cannot run process cleanup and is outside this guarantee.
      - R1.5: start_scenario_mock and start_scenario_subject SHALL declare compensating undo that stops only the child named by that dispatch's receipt.

  R2:
    title: Declarative readiness
    items:
      - R2.1: start_scenario_subject SHALL expose the trusted runtime base URL and start timestamp needed by later profile-owned readiness words.
      - R2.2: One REST readiness dispatch SHALL perform at most one HTTP request; MachineSpec SHALL own the visible probe, delay, retry, and timeout branches.
      - R2.3: The readiness machine SHALL emit distinct Healthy, HealthTimeout, and CommandError signals and route timeout, budget exhaustion, and teardown infrastructure errors through a declared cleanup action.
      - R2.4: Service-child tools SHALL NOT implement HTTP transport or polling and SHALL NOT import net/http.

  R3:
    title: stop_service
    items:
      - R3.1: stop_service SHALL stop a child by handle with a graceful signal, a bounded wait, then a kill.
      - R3.2: stop_service SHALL be idempotent; stopping an already-stopped handle SHALL succeed.
      - R3.3: stop_service undo SHALL be noop and the word SHALL be declared accordingly.
      - R3.4: stop_all_services SHALL be an atomic, idempotent recovery word over the bounded child set owned by the shared service state; it SHALL NOT replace ordinary per-child teardown.

  R4:
    title: Validator child execution
    items:
      - R4.1: One validator dispatch SHALL accept one profile path and its environment additions from the current MachineSpec iterator item.
      - R4.2: Each dispatch SHALL run one validator to completion through the shared child-agent execution path.
      - R4.3: Each output SHALL include that validator's terminal state and exit code.
      - R4.4: Each dispatch SHALL enforce a declared timeout; a validator still running at timeout SHALL be stopped and reported as timed out.
      - R4.5: MachineSpec bounded parallel for_each SHALL expose every validator dispatch and its deterministic input-order join; a thin record word may retain joined outcomes for reporting.

  R5:
    title: Scenario session initialization and iteration
    items:
      - R5.1: init_scenario_session SHALL enumerate scenario directories matching tests/<scenario>/machine.yaml under declared roots and seed the scenario work list.
      - R5.2: Each seeded scenario SHALL retain the subject directory, scenario name, validator profile paths, and fixture files present; next_scenario SHALL expose the current scenario's subject, name, validators, and fixtures.
      - R5.3: The seeded work list SHALL be sorted and deterministic for a given tree, and next_scenario SHALL visit each entry once in that order.
      - R5.4: Roots SHALL come from declared configuration or run input, not from hardcoded repository paths.

  R6:
    title: Determinism and boundaries
    items:
      - R6.1: The words in this SRD SHALL NOT invoke a model.
      - R6.2: The words SHALL be declared as boundary tools crossing a child process, per the tool language boundary rules.
      - R6.3: Failure of a child to spawn SHALL surface as a tool error signal, not a panic.

non_goals:
  - A Kubernetes or container backend for scenario child starts; children are local processes in this SRD.
  - Span-based assertion words; validators assert over HTTP responses and the srd039 request log.
  - Scenario scheduling policy beyond one rig machine's sequential scenario loop; cross-scenario parallelism belongs to the caller.
  - Bounded parallel validator iteration; until MachineSpec supports it, validators run sequentially rather than through hidden goroutines.

tool_words:
  - name: init_scenario_session
    input: configured scenario roots.
    output: discovered scenario count and searched roots.
    signals: [SessionSeeded, NoScenarios, CommandError]
    side_effects: [scenario_session_seed]
    errors: [scenario_discovery]
    undo: irreversible; a new initialization replaces the session.
  - name: next_scenario
    input: the seeded scenario session.
    output: current subject, scenario, validators, fixtures, or exhaustion.
    signals: [ScenarioReady, AllScenariosDone, CommandError]
    side_effects: [scenario_cursor_advance]
    errors: [scenario_manifest]
    undo: irreversible; a consumed cursor position is not restored.
  - name: start_scenario_mock
    input: current scenario and one fixture iterator binding.
    output: mock identity, fixture, environment binding, base URL, and receipt.
    signals: [MockStarted, CommandError]
    side_effects: [child_process_start, scenario_session_update]
    errors: [selector_resolution, address_allocation, spawn_failed]
    undo: stop only the child identified by the dispatch receipt.
  - name: start_scenario_subject
    input: current scenario, subject profile, and recorded mock addresses.
    output: subject identity, profile, trusted base URL, health target, start time, and receipt.
    signals: [SubjectStarted, CommandError]
    side_effects: [child_process_start, scenario_session_update]
    errors: [subject_profile, health_target, address_allocation, spawn_failed]
    undo: stop only the child identified by the dispatch receipt.
  - name: run_scenario_validator
    input: one validator iterator binding and the current subject URL.
    output: validator terminal state, exit code, timeout state, and diagnostics.
    signals: [ValidatorCompleted, ValidatorIncomplete, CommandError]
    side_effects: [child_agent_execution]
    errors: [selector_resolution, missing_subject, execution_failed]
    undo: noop; a completed validator run cannot be unrun.
  - name: record_scenario_validators
    input: the validator iterator's ordered join.
    output: ordered validator outcomes and aggregate pass state.
    signals: [ValidatorsRecorded, CommandError]
    side_effects: [scenario_session_update]
    errors: [selector_resolution, outcome_decode]
    undo: irreversible; recorded outcomes remain in the scenario report.
  - name: collect_scenario_verdict
    input: recorded validator outcomes or a declared forced-failure reason.
    output: scenario identity, pass state, reason, and outcomes.
    signals: [ScenarioPassed, ScenarioFailed]
    side_effects: [scenario_session_update]
    errors: [scenario_failed]
    undo: irreversible; the verdict remains in the run report.
  - name: list_scenario_children
    input: the current scenario session.
    output: subject-first ordered child identities.
    signals: [ScenarioChildrenListed, CommandError]
    side_effects: [scenario_session_read]
    errors: [missing_current_scenario]
    undo: noop.
  - name: stop_service
    input: one literal or selector-resolved tracked child identity.
    output: child identity and stop result.
    signals: [ServiceStopped, CommandError]
    side_effects: [child_process_stop]
    errors: [selector_resolution]
    undo: noop; a stopped child is restarted only by a later scenario start.
  - name: stop_all_services
    input: the shared bounded service state.
    output: count and results for all children reaped.
    signals: [AllServicesStopped]
    side_effects: [child_process_stop]
    errors: []
    undo: irreversible; recovery does not restart children.
  - name: report_scenario_session
    input: all scenario verdicts retained in the session.
    output: aggregate pass state, verdicts, and first failure.
    signals: [SessionPassed, SessionFailed]
    side_effects: [scenario_session_read]
    errors: [session_failed]
    undo: noop.

acceptance_criteria:
  - id: AC1
    criterion: A machine starts scenario mock and subject children with injected environment, probes the subject's labeled runtime URL through the REST client, stops each child, and no process from either group survives an ordinary teardown, an emergency cleanup edge, or orderly parent shutdown.
    traces: [R1.1, R1.2, R1.3, R1.4, R2.1, R3.1, R3.2, R3.4]
  - id: AC2
    criterion: A never-healthy child follows machine-visible ProbingHealth and WaitingToRetry states, performs one request per REST dispatch, and returns HealthTimeout within the declared deadline.
    traces: [R2.2, R2.3, R2.4]
  - id: AC3
    criterion: MachineSpec dispatches one child execution per validator, joins outcomes in input order, and a hung validator is stopped and reported as timed out within its declared bound.
    traces: [R4.1, R4.2, R4.3, R4.4, R4.5]
  - id: AC4
    criterion: init_scenario_session over a fixture tree seeds the expected entries in sorted order, next_scenario exposes each subject, scenario, validator set, and fixture set exactly once, and repeated runs return identical order.
    traces: [R5.1, R5.2, R5.3, R5.4]
  - id: AC5
    criterion: Each word declares its reversibility and undo consistently, invokes no model, and surfaces a spawn failure as a tool error signal, adding no tool-undo-mismatch audit warnings.
    traces: [R1.5, R3.3, R6.1, R6.2, R6.3]
