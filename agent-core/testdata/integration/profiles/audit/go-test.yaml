tools:
  - name: go_module
    type: exec
    binary: go
    args: [list, -m]
    visibility: internal
    emits: [ToolDone, ToolFailed, CommandError]
    output: &structured
      mode: structured
      schema:
        type: object
        properties:
          output: {type: string}
          exit_code: {type: integer}
        required: [output, exit_code]
    output_cap: 1048576
  - name: go_packages_raw
    type: exec
    binary: go
    args: [list, ./...]
    visibility: internal
    emits: [ToolDone, ToolFailed, CommandError]
    output: *structured
    output_cap: 1048576
  - name: go_packages
    type: exec
    binary: sort
    args: []
    stdin_source: $from(go_packages_raw).output
    stdin_max_bytes: 4194304
    visibility: internal
    emits: [ToolDone, ToolFailed, CommandError]
    output: *structured
    output_cap: 1048576
  - name: go_test_inventory
    type: exec
    binary: go
    args: [test, -json, -list, ^Test, ./...]
    visibility: internal
    emits: [ToolDone, ToolFailed, CommandError]
    output: *structured
    output_cap: 1048576
  - name: go_test_run
    type: exec
    binary: go
    args: [test, -json, -count=1, ./...]
    visibility: internal
    emits: [ToolDone, ToolFailed, CommandError]
    output: *structured
    output_cap: 1048576
