# The types unit the tool-signature fixtures import: a plain type and one
# generic over a parameter.
kind: tool-declaration
schema_version: 1
unit: typed-example-types
types:
  - name: Item
    schema:
      type: object
      properties:
        id: {type: string}
        count: {type: integer}
        tags: {type: array, items: {type: string}}
        state: {type: string, enum: [open, closed]}
      required: [id]
  - name: Batch
    params: [T]
    schema:
      type: object
      properties:
        entries: {type: array, items: {$type: $T}}
  - name: Order
    schema:
      type: object
      properties:
        lines: {$type: typed-example-types.Batch<typed-example-types.Item>}
