unit: catalog-collector-declarations
imports:
- /opt/agent-core/tools/units/types-collections.yaml
tools:
  - name: launch_collector_control
    type: builtin
    init: rest_server_launch
    category: boundary
    visibility: internal
    signature:
      emits: [ServerLaunched, CommandError]
    description: Launch collector lifecycle control routes.
    parameters: {type: object, properties: {}}
    output:
      description: REST launch result.
      schema: {type: object}
    side_effects:
      - {kind: network_listen, target: collector_control, state: listener_started}
    reversibility: {classification: compensatable}
    undo: {strategy: compensating_action, description: Stop the owned control listener.}
    errors:
      - {signal: CommandError, condition: config or bind failure, state_after_failure: no new control listener remains}
    config: {rest_ref: collector_control}

  - name: launch_collector_monitor
    type: builtin
    init: rest_server_launch
    category: boundary
    visibility: internal
    signature:
      emits: [ServerLaunched, CommandError]
    description: Launch collector monitor snapshot and stream routes.
    parameters: {type: object, properties: {}}
    output: {description: REST launch result, schema: {type: object}}
    side_effects:
      - {kind: network_listen, target: collector_monitor, state: listener_started}
    reversibility: {classification: compensatable}
    undo: {strategy: compensating_action, description: Stop the owned monitor listener.}
    errors:
      - {signal: CommandError, condition: config or bind failure, state_after_failure: no new monitor listener remains}
    config: {rest_ref: collector_monitor}

  - name: launch_collector_query
    type: builtin
    init: rest_server_launch
    category: boundary
    visibility: internal
    signature:
      emits: [ServerLaunched, CommandError]
    description: Launch collector query routes for bounded spool reads.
    parameters: {type: object, properties: {}}
    output: {description: REST launch result, schema: {type: object}}
    side_effects:
      - {kind: network_listen, target: collector_query, state: listener_started}
    reversibility: {classification: compensatable}
    undo: {strategy: compensating_action, description: Stop the owned query listener.}
    errors:
      - {signal: CommandError, condition: config or bind failure, state_after_failure: no new query listener remains}
    config: {rest_ref: collector_query}

  - name: stop_collector_query
    type: builtin
    init: rest_server_stop
    category: boundary
    visibility: internal
    signature:
      emits: [ServerStopped, CommandError]
    description: Stop the collector query listener.
    parameters: {type: object, properties: {}}
    output: {description: REST stop result, schema: {type: object}}
    side_effects:
      - {kind: network_listener_shutdown, target: collector_query, state: listener_stopped}
    reversibility: {classification: compensatable}
    undo:
      strategy: server_shutdown_or_user_action_compensation
      description: The receipt records shutdown loss; MachineSpec must relaunch the trusted query definition.
      payload: boundary_compensation
      captures: [server, address, drained_events, dropped_events, relaunch_requirement]
    errors:
      - {signal: CommandError, condition: stop fails, state_after_failure: listener may be partially stopped}
    config: {rest_ref: collector_query}

  - name: await_collector_control
    type: builtin
    init: rest_await_event
    category: boundary
    visibility: internal
    signature:
      emits: [ExitRequested, AwaitTimedOut, ServerStopped, CommandError]
    description: Check control and monitor queues for lifecycle exit between intake waits.
    parameters: {type: object, properties: {}}
    output: {description: Selected lifecycle event, schema: {type: object}}
    side_effects:
      - {kind: state_mutation, target: rest_server_queue, state: selected_event_consumed}
    reversibility: {classification: reversible}
    undo:
      strategy: queue_event_restore
      description: Restore the receipt-recorded event to the front of its source queue.
      payload: rest_await_event
      captures: [source, event]
    errors:
      - {signal: CommandError, condition: source lookup or queue read fails, state_after_failure: listeners remain unchanged}
    config:
      sources:
        - {server: collector_control, routes: [exit], signals: [ExitRequested]}
      timeout: 100ms
      stopped_behavior: emit_server_stopped

  - name: filter_collector_batch
    type: builtin
    init: value_predicate
    category: word
    visibility: internal
    signature:
      output: builtin-types-collections.Comparison
      emits: [Satisfied, Unsatisfied, CommandError]
    description: Accept only a received batch whose span count is positive.
    parameters: {type: object, properties: {}}
    output: {description: Predicate result}
    errors:
      - {signal: CommandError, condition: selector or coercion failure, state_after_failure: no branch outcome is emitted}
    relationships: {after: [await_spans], before: [spool_collector_spans]}
    config:
      left: $.span_count
      op: gt
      right: "0"
      operand_type: number
      satisfied: Satisfied
      unsatisfied: Unsatisfied

  - name: spool_collector_spans
    type: builtin
    init: spool_spans
    category: boundary
    visibility: internal
    signature:
      emits: [SpansSpooled, CommandError]
    description: Spool the last accepted batch before any relay.
    parameters: {type: object, properties: {}}
    output: {description: Spool result and batch, schema: {type: object}}
    side_effects:
      - {kind: filesystem_write, target: collector trace spool, state: durable_lines_appended}
      - {kind: external_api, target: application object bucket, state: immutable trace object persisted when the object backend is selected}
    reversibility: {classification: irreversible, requires_confirmation: true}
    undo: {strategy: irreversible, description: Audit evidence remains retained and cannot be removed safely after rotation or upload.}
    errors:
      - {signal: CommandError, condition: selection or filesystem failure, state_after_failure: command-state source remains}
    config:
      path: ${COLLECTOR_SPOOL_PATH:-traces/collector.ndjson}
      batch_source: $from(received_batch).batch
      max_bytes: 10485760
      max_files: 3
      # Filesystem NDJSON by default; the chart selects the object backend and bucket, so declarations are identical across local and cloud (srd042 R10; srd008 R8, R9; #2484 wires the values).
      storage: {backend: "${COLLECTOR_STORAGE_BACKEND:-filesystem}", bucket_url: "${COLLECTOR_OBJECT_BUCKET_URL:-}", endpoint: "${COLLECTOR_OBJECT_ENDPOINT:-}", prefix: "${COLLECTOR_OBJECT_PREFIX:-traces}", wal_path: "${COLLECTOR_TRACE_WAL_PATH:-traces/collector.wal}", application: "${COLLECTOR_APPLICATION:-}", namespace: "${COLLECTOR_NAMESPACE:-}", run: "${COLLECTOR_RUN:-}", collector_instance: "${COLLECTOR_INSTANCE:-}", wal_max_bytes: 67108864, wal_max_pending: 1024}

  - name: await_collector_metrics
    type: builtin
    init: await_metrics
    category: boundary
    visibility: internal
    signature:
      emits: [MetricsReceived, AwaitTimedOut, ReceiverStopped, CommandError]
    description: Wait a short bounded interval for one metric batch between trace intake cycles.
    parameters: {type: object, properties: {}}
    output: {description: Metric batch and bounded metadata, schema: {type: object}}
    side_effects:
      - {kind: state_mutation, target: receiver metric queue, state: consumes one FIFO metric batch}
    reversibility: {classification: irreversible, requires_confirmation: true}
    undo: {strategy: irreversible, description: A consumed concurrent queue item cannot be restored in original order.}
    errors:
      - {signal: CommandError, condition: receiver is absent or the wait is canceled, state_after_failure: no metric batch is returned}
    config:
      receiver: ingress
      timeout: 500ms

  - name: spool_collector_metrics
    type: builtin
    init: spool_metrics
    category: boundary
    visibility: internal
    signature:
      emits: [MetricsSpooled, CommandError]
    description: Spool the last accepted metric batch as NDJSON metric records to a separate file.
    parameters: {type: object, properties: {}}
    output: {description: Metric spool result and batch, schema: {type: object}}
    side_effects:
      - {kind: filesystem_write, target: collector metric spool, state: durable_lines_appended}
      - {kind: external_api, target: application object bucket, state: immutable metric object persisted when the object backend is selected}
    reversibility: {classification: irreversible, requires_confirmation: true}
    undo: {strategy: irreversible, description: Audit evidence remains retained and cannot be removed safely after rotation or upload.}
    errors:
      - {signal: CommandError, condition: selection or filesystem failure, state_after_failure: command-state source remains}
    config:
      path: ${COLLECTOR_METRICS_SPOOL_PATH:-metrics/collector.ndjson}
      batch_source: $from(received_metrics).batch
      max_bytes: 10485760
      max_files: 3
      # Traces and metrics share the storage port; the object backend keeps them in separate object families (srd042 R10.2; srd008 R5).
      storage: {backend: "${COLLECTOR_STORAGE_BACKEND:-filesystem}", bucket_url: "${COLLECTOR_OBJECT_BUCKET_URL:-}", endpoint: "${COLLECTOR_OBJECT_ENDPOINT:-}", prefix: "${COLLECTOR_OBJECT_PREFIX:-metrics}", wal_path: "${COLLECTOR_METRICS_WAL_PATH:-metrics/collector.wal}", application: "${COLLECTOR_APPLICATION:-}", namespace: "${COLLECTOR_NAMESPACE:-}", run: "${COLLECTOR_RUN:-}", collector_instance: "${COLLECTOR_INSTANCE:-}", wal_max_bytes: 67108864, wal_max_pending: 1024}

  - name: decide_collector_relay
    type: builtin
    init: value_predicate
    category: word
    visibility: internal
    signature:
      output: builtin-types-collections.Comparison
      emits: [Satisfied, Unsatisfied, CommandError]
    description: Branch to relay only when the declared collector mode is relay.
    parameters: {type: object, properties: {}}
    output: {description: Mode predicate result}
    errors:
      - {signal: CommandError, condition: malformed mode predicate, state_after_failure: relay is not invoked}
    relationships: {after: [spool_collector_spans], before: [relay_collector_spans]}
    config:
      left: ${COLLECTOR_MODE:-spool}
      op: eq
      right: relay
      operand_type: string
      satisfied: Satisfied
      unsatisfied: Unsatisfied

  - name: relay_collector_spans
    type: builtin
    init: relay_spans
    category: boundary
    visibility: internal
    signature:
      emits: [SpansRelayed, CommandError]
    description: Relay the labeled spooled batch unchanged to a configured OTLP endpoint.
    parameters: {type: object, properties: {}}
    output:
      description: Completely accepted relay endpoint and span count.
      schema:
        type: object
        properties: {endpoint: {type: string}, span_count: {type: integer}}
        required: [endpoint, span_count]
    side_effects:
      - {kind: external_api, target: OTLP collector endpoint, state: spans_may_be_retained}
    reversibility: {classification: irreversible, requires_confirmation: true}
    undo: {strategy: irreversible, description: OTLP cannot retract accepted spans.}
    errors:
      - {signal: CommandError, condition: selection transport or rejection failure, state_after_failure: spool evidence remains}
    config:
      endpoint: ${COLLECTOR_RELAY_ENDPOINT:-}
      receiver_address: ${COLLECTOR_RECEIVER_ADDRESS:-0.0.0.0:4317}
      batch_source: $from(spooled_batch).batch
      timeout: 10s

  - name: stop_collector_monitor
    type: builtin
    init: rest_server_stop
    category: boundary
    visibility: internal
    signature:
      emits: [ServerStopped, CommandError]
    description: Stop the collector monitor listener.
    parameters: {type: object, properties: {}}
    output: {description: REST stop result, schema: {type: object}}
    side_effects:
      - {kind: network_listener_shutdown, target: collector_monitor, state: listener_stopped}
    reversibility: {classification: compensatable}
    undo:
      strategy: server_shutdown_or_user_action_compensation
      description: The receipt records shutdown loss; MachineSpec must relaunch the trusted monitor definition.
      payload: boundary_compensation
      captures: [server, address, drained_events, dropped_events, relaunch_requirement]
    errors:
      - {signal: CommandError, condition: stop fails, state_after_failure: listener may be partially stopped}
    config: {rest_ref: collector_monitor}

  - name: stop_collector_control
    type: builtin
    init: rest_server_stop
    category: boundary
    visibility: internal
    signature:
      emits: [ServerStopped, CommandError]
    description: Stop the collector control listener.
    parameters: {type: object, properties: {}}
    output: {description: REST stop result, schema: {type: object}}
    side_effects:
      - {kind: network_listener_shutdown, target: collector_control, state: listener_stopped}
    reversibility: {classification: compensatable}
    undo:
      strategy: server_shutdown_or_user_action_compensation
      description: The receipt records shutdown loss; MachineSpec must relaunch the trusted control definition.
      payload: boundary_compensation
      captures: [server, address, drained_events, dropped_events, relaunch_requirement]
    errors:
      - {signal: CommandError, condition: stop fails, state_after_failure: listener may be partially stopped}
    config: {rest_ref: collector_control}
