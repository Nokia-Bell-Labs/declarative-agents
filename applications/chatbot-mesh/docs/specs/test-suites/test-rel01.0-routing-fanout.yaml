id: test-rel01.0-routing-fanout
title: Test Suite for Release 01.0 Source Routing, Tier Selection, and Multi-RAG Fan-Out
release: "01.0"

overview: |
  This suite validates source routing, tier selection, and fan-out (srd002 R2,
  R3, R6): separate source and tier classifiers, trusted subset selection, and the
  single sequential for_each over selected topology entries that cites the needed
  disjoint corpora, collects per-source QueryRejected and CommandError outcomes,
  partitions reported embedding-model mismatches, and renders compatible chunks.

traces:
  - rel01.0-uc001-routed-fanout

preconditions:
  - agent-core is available as core_root in demo.yaml or a sibling ../agent-core checkout.
  - A Chroma server and an Ollama are reachable with the configured embedding, tier-selector, and two chat-LLM models.
  - This application owns the chatbot profile, inline source-router and tier-selector prompts, and fan-out declarations, under applications/chatbot-mesh/agents/.

test_cases:
  - use_case: rel01.0-uc001-routed-fanout
    name: Source-routed and tier-selected fan-out over disjoint corpora
    integration_target: mage integration:chatbot
    # Module-local unit evidence for the co-generated fan-out chain. The named
    # behaviors under expected are live outcomes proven by the integration target
    # above, not by this command. The previous command also named
    # TestChatbotComposeReadsEachRagSource, which lives in applications/catalog and not
    # in this module; the surviving TestChatbotFanOut branch matched an unrelated
    # co-generation test, so the missing proof went unreported (GH-592).
    go_test: go test ./magefiles -run '^(TestChatbotFanOutCoGeneratedForNRags|TestTierDispatch.*|TestAssertChatbotTierSelectionTrace.*)$'
    status: implemented
    description: |
      Integration.Chatbot starts one Chroma container with two disjoint collections
      (the ingest fixture for rag0 and a seeded disjoint Solar Ridge corpus for
      rag1), launches two rag-server agents and the tier-selector-enabled chatbot, and
      drives the chat endpoint. A factual turn and an analytical turn exercise the
      $tool tier selector; because live semantic classification is model-dependent,
      each turn's chatbot span log is asserted to show exactly one declared answer-word
      dispatch carrying the configured model, rather than requiring this
      fixed prompt pair to select both tiers. That alone does not prove the
      dispatch happened: the fallback word is itself a declared answer word with
      a configured model, so the assertion held throughout the period the
      selector never dispatched (GH-84). Each turn's parse_tier span must
      therefore carry command.signal ToolDone, which agent-core stamps when the
      selection resolved to a registered word; ParseFailed or TaskCompleted
      means the turn answered on the fallback and fails the target. The hermetic single-turn and degraded-RAG
      fixtures select the fast and deep words respectively, providing deterministic
      both-branch evidence through integration:rig. A spanning turn draws the disjoint
      rag1 corpus into the answer (one sequential for_each;
      render_each formats compatible sources, and partition is a generic filter,
      not a merge word). Stopping rag1 degrades the next turn to a 200 with its
      CommandError join entry retained in query_failed metadata. Verified against
      the source-count-independent Helm topology render and end to end against live Docker and
      Ollama; skips cleanly without them, naming a missing model. The named Go test
      locks one fixed machine and declaration set plus N-RAG topology data; the Mage target owns tier selection, cross-corpus
      composition, and degradation behavior.
    inputs:
      chatbot_profile: agents/chatbot/profile.yaml
      rag_clients: [rag0, rag1]
      turns: factual, analytical, cross-corpus, then a degraded follow-up
      fault: rag1 stopped before the degraded turn
    expected:
      each_live_turn_dispatches_one_declared_answer_word: true
      each_live_turn_parse_tier_signal: ToolDone
      answer_word_command_error_route: fast_fallback_then_failed
      fallback_answered_turn_fails_the_target: true
      live_prompt_pair_selects_both_tiers: model-dependent
      deterministic_fixtures_dispatch_both_answer_words: true
      selector_model_spans_count_as_answer_dispatch: false
      scoped_question_queries_only_selected_source: true
      spanning_question_may_query_all_sources: true
      fanout_draws_both_corpora: true
      degraded_turn_omits_stopped_corpus: true
      excluded_source_routes_on_queryrejected: true
      machine_for_each_count: 1
      adding_third_source_changes_word_or_state_count: false
      adding_third_source_is_selectable_from_rendered_catalog: true
    traces:
      - rel01.0-uc001-routed-fanout S1
      - rel01.0-uc001-routed-fanout S2
      - rel01.0-uc001-routed-fanout S3
      - rel01.0-uc001-routed-fanout S4
      - srd002-chatbot-agent AC2
      - srd002-chatbot-agent AC3
      - srd002-chatbot-agent AC6

  - use_case: rel01.0-uc001-routed-fanout
    name: Source-selection trust boundary and full-set fallback matrix
    go_test: cd ../catalog && go test ./magefiles -run '^TestChatbot(SourceSelectionUsesTrustedTopologyAndFallback|SourceRouterPromptIsInlineAndNamesOnly)$'
    status: implemented
    description: |
      Profile wiring proves generic compose captures and JSON-escapes the adjacent
      raw classifier reply, parse_structured validates names-only output,
      select_subset resolves names against trusted topology entries, and for_each
      reads only selected trusted entries. Mocked source-selector responses cover
      scoped, spanning, mixed undeclared, malformed, empty, only-undeclared, and
      classifier-error outcomes. Every fallback queries the complete declared set;
      mixed picks discard undeclared names. Response metadata reports not_selected
      separately and the classifier catalog contains no target/configuration data.
    inputs:
      source_responses:
        scoped: '{"names":["rag0"]}'
        spanning: '{"names":["rag0","rag1"]}'
        mixed_undeclared: '{"names":["rag0","https://attacker.invalid"]}'
        malformed: not-json
        empty: '{"names":[]}'
        only_undeclared: '{"names":["evil"]}'
        classifier_error: connection failure
    expected:
      undeclared_names_reach_query_target: false
      classifier_error_queries_all_declared: true
      malformed_queries_all_declared: true
      empty_queries_all_declared: true
      only_undeclared_queries_all_declared: true
      not_selected_distinct_from_queried_outcomes: true
      prompt_is_inline_and_names_only: true
    traces:
      - rel01.0-uc001-routed-fanout S1
      - rel01.0-uc001-routed-fanout S2
      - srd002-chatbot-agent AC2
      - srd002-chatbot-agent AC3
      - srd002-chatbot-agent AC6

  - use_case: rel01.0-uc001-routed-fanout
    name: Embedding-model exclusion where dimensions match but identities differ
    integration_target: mage integration:embeddingExclusion
    go_test: go test ./magefiles -run '^TestChatbotFanOutCoGeneratedForNRags$'
    status: implemented
    description: |
      The case srd002 R3.3 exists for, and the one the mapped 400 cannot reach. That
      400 originates in Chroma rejecting the query vector, so it fires on a dimension
      mismatch; two models of the same width both answer 200. This target stands two
      RAG mocks returning the same vector shape that differ only in the embedding model
      they report, and reads the composed prompt out of the LLM mock's request log
      rather than the answer, which is canned fixture text and therefore identical
      whichever chunks were composed. The mismatched source's chunk must be absent and
      the matching source's chunk present in the same prompt: asserting only the
      absence would also pass for a turn that simply lost both sources. The turn must
      still answer 200, since an exclusion degrades the grounding rather than failing
      the turn (R3.2). The chatbot runs from a port-shifted profile copy so the proof
      does not contend with a real Ollama on the shipped embedding port, moving the
      declared topology authorities and the network limits that pin them together
      (R6.1). Metadata places the mismatched 200 in embedding_model_excluded, while
      vector rejection and transport failure remain distinct query_failed signals. Verified
      in both directions: with the comparison neutralized so a differing identity
      reports as matched, the target fails naming the mismatched chunk in the prompt.
    inputs:
      chatbot_profile: agents/chatbot/profile.yaml
      query_embedding_model: qwen3-embedding:8b
      rag0_reported_model: nomic-embed-text:v1.5
      rag1_reported_model: qwen3-embedding:8b
      rag_status: both answer 200 with the same vector shape
    expected:
      mismatched_source_excluded_from_prompt: true
      matching_source_composed_in_same_turn: true
      turn_degrades_rather_than_fails: true
    traces:
      - rel01.0-uc001-routed-fanout S3
      - srd002-chatbot-agent AC3
