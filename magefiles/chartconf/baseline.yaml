#
# Accepted chart conformance violations (srd005 R7, ENG01 chart conformance
# rules). Shrink-only: every entry names the issue that removes it, the gate
# fails on a violation this file does not list, and it fails again once a
# listed violation stops reproducing. The gate reads this file and never
# writes it.
#
# The R9.1 entries record the one-agent-image divergences that exist while the
# GH-2494 migration is in flight: a serving role runs the smoke image while the
# collector still inherits the base agent-core image. Each is removed by the
# child that makes every agent role inherit the one application image, at which
# point R7.3 fails until the entry is deleted.
#
# GH-2504 moved every coding-agent role — planner, executor, critic, collector,
# and applier — onto the one application image (the executor's Go and linter now
# arrive from a tool donor), so the coding-agent divergences no longer reproduce
# and their entries are gone.
exceptions:
  - chart: agent-architecture
    overlay: kind-values.yaml
    rule: R9.1
    resource: Deployment/conformance-agent-architecture-collector container/collector
    value: ghcr.io/nokia-bell-labs/declarative-agents/agent-core:0.1.0
    issue: GH-2503
    reason: >
      Under the kind overlay the curator runs the agent-architecture-smoke
      image while the collector inherits the pinned base agent-core image.
      GH-2503 makes the collector inherit the one application image, after
      which it matches the curator.
