#
# Accepted chart conformance violations (srd005 R7, ENG01 chart conformance
# rules). Shrink-only: every entry names the issue that removes it, the gate
# fails on a violation this file does not list, and it fails again once a
# listed violation stops reproducing. The gate reads this file and never
# writes it.
#
# GH-2512 introduced the image-reference grammar (C7 / R10). The entries
# below are the in-flight migrations that grammar now names:
#
#   - GH-2517 fully qualifies Docker Hub short names already carrying a
#     digest (busybox, chromadb/chroma, dolthub/dolt-sql-server,
#     ollama/ollama, rancher/kubectl).
#   - GH-2519 restores fully qualified upstream names for kindrig retags of
#     application dependencies and moves the kind-trusted Ollama derivation
#     onto localhost/declarative-agents/derived.
#
# The one-agent-image migration (GH-2494) is complete: every application's
# agent roles inherit the one application image, so no R9.1 divergence
# reproduces.

