id: rel09.0-uc001-canonical-collector
title: The mesh deploys with no Jaeger workload and traces from the collector query surface

summary: |
  An operator installs the mesh chart with default values. No Jaeger
  Deployment or Service renders. The collector agent spools traces and serves
  a REST query surface on port 18193. The UX waterfall reads traces from the
  collector query surface through the chatbot monitor proxy instead of from
  Jaeger. Collector mode derives from externalOTLPEndpoint presence: relay
  when set, spool otherwise. The collector program is consumed from the
  catalog rather than carried locally. Integration tests verify spool
  identity and metrics evidence without Jaeger cross-checks.

actor: Mesh integration operator
trigger: A default Helm install renders the collector agent with no Jaeger workload and the UX reads traces from the collector query surface.

flow:
  - F1: Helm renders the collector agent with query port 18193 exposed and no Jaeger template, values, or schema entry.
  - F2: The chatbot rest.yaml monitor proxy routes /monitor-proxy/collector/ to the collector query surface.
  - F3: The UX trace backend reads traces from /monitor-proxy/collector/query/traces/{trace_id} and transforms collector format to the waterfall model.
  - F4: Integration tests assert spool identity by reading the collector spool directly rather than cross-checking Jaeger.
  - F5: Integration tests assert metrics evidence through Prometheus without Jaeger trace evidence.
  - F6: The collector program is sourced from the catalog root, not from a local agents/collector directory.

touchpoints:
  - "srd007-collector-agent R1 -- persistent bounded intake with query surface"
  - "srd007-collector-agent R2 -- complete integration identity in spool"
  - "srd003-chatbot-deployment R5 -- trace evidence through collector query surface"

success_criteria:
  - id: S1
    criterion: Helm render contains no Jaeger template, values reference, or schema entry.
    traces: [srd003-chatbot-deployment AC5]
  - id: S2
    criterion: The collector query port 18193 is exposed in the collector Service.
    traces: [srd007-collector-agent AC1]
  - id: S3
    criterion: The UX waterfall transforms collector query format (ISO timestamps, flat spans) to the internal trace model.
    traces: [srd003-chatbot-deployment AC5]
  - id: S4
    criterion: Spool identity assertions pass without any Jaeger endpoint.
    traces: [srd007-collector-agent AC2]
  - id: S5
    criterion: Metrics evidence is collected from Prometheus and retained after teardown.
    traces: [srd003-chatbot-deployment AC5]
  - id: S6
    criterion: The collector program is consumed from the catalog, not from a local directory.
    traces: [srd007-collector-agent AC1]

failure_scenarios:
  - id: E1
    scenario: Helm render produces a Jaeger Deployment or Service.
    expected: Rejected; the Jaeger template is deleted and values block removed.
  - id: E2
    scenario: The UX waterfall fails to parse collector query format timestamps.
    expected: Rejected; isoToUs converts ISO 8601 strings to microsecond integers.
  - id: E3
    scenario: Integration tests depend on a Jaeger endpoint for evidence.
    expected: Rejected; all trace evidence reads from the collector spool directly.

out_of_scope:
  - Collector-agent metrics and logs intake.
  - External OTLP relay endpoint configuration.
  - Observer agent fleet discovery.

test_suite_trace: test-rel09.0-canonical-collector
status: implemented
