unit: catalog-knowledge-manager-documentation-curator-builtin
tools:
  - name: launch_curator_http
    type: builtin
    init: rest_server_launch
    visibility: internal
    category: boundary
    signature:
      emits: [ServerLaunched, CommandError]
    description: Launch the generic REST server that owns curator UI and request routes.
    parameters: {type: object, properties: {}, additionalProperties: false}
    output:
      description: Generic REST launch result.
      schema: {type: object}
    side_effects:
      - {kind: network_listen, target: documentation_curator_http, state: listener_started}
    reversibility: {classification: compensatable}
    undo:
      strategy: compensating_action
      description: Stop the configured curator HTTP listener.
    errors:
      - {signal: CommandError, condition: REST configuration or listener launch fails, state_after_failure: No curator route is exposed.}
    config:
      rest_ref: documentation_curator

  - name: stop_curator_http
    type: builtin
    init: rest_server_stop
    visibility: internal
    category: boundary
    signature:
      emits: [ServerStopped, CommandError]
    description: Stop the generic curator HTTP server and drain in-flight requests.
    parameters: {type: object, properties: {}, additionalProperties: false}
    output:
      description: Generic REST stop result.
      schema: {type: object}
    side_effects:
      - {kind: network_listener_shutdown, target: documentation_curator_http, state: listener_stopped}
    reversibility: {classification: compensatable}
    undo:
      strategy: server_shutdown_or_user_action_compensation
      description: The receipt records shutdown loss; MachineSpec must relaunch the trusted curator definition.
      payload: boundary_compensation
      captures: [server, address, drained_events, dropped_events, relaunch_requirement]
    errors:
      - {signal: CommandError, condition: Curator server is absent or cannot stop, state_after_failure: Listener may be partially stopped.}
    config:
      rest_ref: documentation_curator

  - name: launch_curator_control
    type: builtin
    init: rest_server_launch
    visibility: internal
    category: boundary
    signature:
      emits: [ServerLaunched, CommandError]
    description: Launch generic lifecycle control routes for documentation-curator.
    parameters: {type: object, properties: {}, additionalProperties: false}
    output: {description: Control launch result, schema: {type: object}}
    side_effects:
      - {kind: network_listen, target: documentation_curator_control, state: listener_started}
    reversibility: {classification: compensatable}
    undo: {strategy: compensating_action, description: Stop the control listener.}
    errors:
      - {signal: CommandError, condition: Control server launch fails, state_after_failure: No control route is exposed.}
    config:
      rest_ref: documentation_curator_control

  - name: await_curator_control
    type: builtin
    init: rest_await_event
    visibility: internal
    category: boundary
    signature:
      emits: [ExitRequested, AwaitTimedOut, ServerStopped, CommandError]
    description: Await the configured curator lifecycle exit event.
    parameters: {type: object, properties: {}, additionalProperties: false}
    output: {description: Selected control event, schema: {type: object}}
    side_effects:
      - {kind: state_mutation, target: rest_server_queue, state: selected_event_consumed}
    reversibility: {classification: reversible}
    undo:
      strategy: queue_event_restore
      description: Restore the receipt-recorded event to the front of its source queue.
      payload: rest_await_event
      captures: [source, event]
    errors:
      - {signal: CommandError, condition: The configured source is unavailable, state_after_failure: Listener state is unchanged.}
    config:
      sources:
        - server: documentation_curator_control
          routes: [exit]
          signals: [ExitRequested]
      timeout: 30s
      stopped_behavior: emit_server_stopped
