  - id: R-MACH-023
    target: runtime
    level: MUST
    statement: >-
      A conforming runtime MUST hold a transition's result to its `expect`
      when the result arrives, after the output type check and before
      routing; a result carrying an engine signal or `ToolFailed`, and a
      `for_each` join, are not held, and `for_each` elements are held under
      R-MACH-024. A result inside the
      expectation MUST run exactly as without it. A result outside it MUST
      raise `otherwise.signal` in place of the tool's signal. Under
      `quarantine` the step log MUST keep the body with the mismatch report
      through every checkpoint, the next action and a resumed run MUST
      receive the report instead of the body, and a `$from` read whose
      newest matching step is quarantined MUST fail without falling back to
      an older step. A later step recording the same label releases that
      label; resuming a run suspended on `AwaitApproval` MUST release every
      quarantine, and any other resume MUST keep them. Without
      `quarantine` the body stays readable.
    acceptance:
