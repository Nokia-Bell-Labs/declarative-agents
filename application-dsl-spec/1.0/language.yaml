  - id: R-LCM-003
    target: runtime
    level: MUST
    statement: >-
      A conforming runtime that resumes an agent-instance from a checkpoint
      MUST re-enter the same machine-instance at the persisted position with
      the persisted execution log and accumulated cost, MUST deliver the resume
      signal as the first transition's signal in place of any request seed, and
      MUST fail without entering the run loop when no checkpoint is persisted;
      a checkpoint whose run already reached a terminal state MUST be reported
      with its recorded outcome without re-entering the run loop.
    acceptance:
      - assertion: rig
        path: agent-core/internal/runtime/core/resume_port_test.go
        test: TestResumeReentersLoopFromTypedPort
      - assertion: rig
        path: agent-core/internal/runtime/core/resume_port_test.go
        test: TestLoadResumeExposesTypedSnapshotForDomainRestore
      - assertion: rig
        path: agent-core/cmd/agent/main_lifecycle_test.go
        test: TestResumeLoadOverridesRequestSeed
      - assertion: rig
        path: agent-core/cmd/agent/main_lifecycle_test.go
        test: TestResumeWithoutPersistentBackendReportsNoCheckpoint
      - assertion: rig
        path: agent-core/internal/runtime/core/resume_port_test.go
        test: TestResumeFinalizedCheckpointReturnsWithoutReenteringLoop

  - id: R-LCM-004
    target: runtime
    level: MUST
    statement: >-
      When a dispatch yields the `AwaitApproval` signal, a conforming runtime
      MUST save the checkpoint through the configured checkpoint port before it
      reports the run suspended, and MUST report the run failed, never
      suspended, when that save fails.
    acceptance:
      - assertion: rig
        path: agent-core/internal/runtime/core/loop_suspend_persist_test.go
        test: TestLoop_SuspendFailsWhenCheckpointSaveFails
      - assertion: rig
        path: agent-core/internal/runtime/core/loop_suspend_persist_test.go
        test: TestLoop_SuspendSucceedsWhenCheckpointSaveSucceeds
      - assertion: rig
        path: agent-core/cmd/agent/main_lifecycle_test.go
        test: TestApprovalLifecycleProfileSuspendsThroughCheckpointPort

  - id: R-LCM-005
    target: runtime
    level: MUST
    statement: >-
      A conforming runtime MUST perform rollback as a lifecycle tool dispatch
      that first rewinds the persisted state to the target step and then
      reverses the external effect of each rewound entry, from the latest entry
      back to the earliest, by handing that entry's receipt unchanged to the
      undo of the tool that produced it, skipping entries declared
      irreversible; the runtime MUST NOT interpret a receipt's contents. When
      the rewind fails, the runtime MUST leave the persisted state unchanged
      and MUST NOT reverse any effect.
    acceptance:
      - assertion: rig
        path: agent-core/internal/tools/lifecycle/checkpoint_compensation_test.go
        test: TestCheckpointRollbackRestoresFileViaPersistedReceipt
      - assertion: rig
        path: agent-core/internal/tools/lifecycle/receipt_rollback_test.go
        test: TestUndoEntryDeclaredIrreversibleStillSkips
      - assertion: rig
        path: agent-core/internal/tools/lifecycle/checkpoint_rollback_test.go
        test: TestCheckpointRollbackRevertFailurePreservesStateAndSkipsUndo
      - assertion: rig
        path: agent-core/internal/tools/lifecycle/spec_pin_runtime_test.go
        test: TestSpecPinRollbackWalksReceiptsInReverseUnchanged
  - id: R-LCM-006
    target: runtime
    level: MUST NOT
    statement: >-
      A conforming runtime MUST NOT expose history or rollback as mode-specific
      commands or flags of the runtime process; history and rollback run as
      ordinary agent-profile runs that dispatch the `checkpoint_history` and
      `checkpoint_rollback` tools through the same startup sequence as any
      other agent-profile.
    acceptance:
      - assertion: rig
        path: agent-core/cmd/agent/main_bootstrap_test.go
        test: TestRootCommandHasNoLifecycleSubcommands
      - assertion: rig
        path: agent-core/cmd/agent/main_bootstrap_test.go
        test: TestRootCommandHasNoLifecycleOnlyFlags
      - assertion: rig
        path: agent-core/internal/tools/lifecycle/checkpoint_history_test.go
        test: TestCheckpointHistoryExecuteFormatsExecutionLog

  - id: R-RUN-001
    target: runtime
    level: MUST
    statement: >-
      Before the first dispatch, a conforming runtime MUST check the loaded
      machine-instance against the agent-profile's tool selection -- every
      named transition action is a selected tool, every phase a selected tool
      declares is a state the machine-instance declares, every signal a
      selected tool declares it emits is declared and routed from the action's
      target state, every transition can fire, and every operation timeout lies
      strictly below the command timeout -- and MUST refuse to start the run
      when any check fails.
    acceptance:
      - assertion: rig
        path: agent-core/cmd/agent/main_action_validation_test.go
        test: TestValidateConfigRejectsDeclaredButUnselectedMachineAction
      - assertion: rig
        path: agent-core/cmd/agent/main_tool_validation_test.go
        test: TestRuntimeStartupValidatesWiringNotFullContractCompleteness
      - assertion: rig
        path: agent-core/cmd/agent/main_tool_validation_test.go
        test: TestRuntimeStartupRejectsADeadTransition
      - assertion: rig
        path: agent-core/cmd/agent/profileaudit_startup_test.go
