# The observer monitor server, and the limits that bound it. It lives beside
# rest.yaml rather than in it because its monitor_proxy upstreams and the UI's
# monitored agents name the mesh's deployed agents, which the chart co-generates
# from values (helm/templates/_observer-rest.tpl), as it does the chatbot's
# (srd003 R2). This file stays the local integration source; the cluster render
# overrides its ConfigMap key.
unit: mesh-observer-monitor-rest
rest:
  version: v1
  limits:
    monitor:
      timeout: 5s
      read_timeout: 5s
      max_request_bytes: 4096
      max_response_bytes: 1048576
      redirect: {mode: none}
      network:
        schemes: [http]
        hosts: [127.0.0.1, localhost]
        ports:
          - ${OBSERVER_MONITOR_PORT:-18202}
        allow_public_listener: true

  servers:
    observer_monitor:
      address: ${OBSERVER_BIND_HOST:-127.0.0.1}:${OBSERVER_MONITOR_PORT:-18202}
      limits_ref: monitor
      lifecycle_exit: {disabled: true}
      queue: {name: observer_monitor, capacity: 8, overflow: reject, timeout: 100ms}
      shutdown:
        timeout: 2s
        drain_policy: drain_then_stop
        stop_listeners: true
        unblock_await_signal: ServerStopped
      endpoints:
        machine_spec:  {method: GET, path: /monitor/machine, binding: read_state, monitor_view: machine_spec}
        declared_machines: {method: GET, path: /monitor/machines, binding: read_state, monitor_view: declared_machines}
        declared_tools: {method: GET, path: /monitor/tools/declared, binding: read_state, monitor_view: declared_tools}
        current_state: {method: GET, path: /monitor/state, binding: read_state, monitor_view: current_state}
        tools:         {method: GET, path: /monitor/tools, binding: read_state, monitor_view: tools}
        metrics:       {method: GET, path: /monitor/metrics, binding: read_state, monitor_view: metrics}
        recent_events: {method: GET, path: /monitor/events, binding: read_state, monitor_view: events}
        event_stream:  {method: GET, path: /monitor/events/stream, binding: stream_events, monitor_view: events}
        openapi:       {method: GET, path: /monitor/openapi, binding: static_metadata, monitor_view: openapi}
        # The fleet view exposes each aggregation step's latest declared output
        # (pods, Deployments, Services, per-agent fan-in, pod metrics) through the
        # command_state monitor view. The discovery steps carry no authored label,
        # so the allowlist addresses them by command name (srd033 R7, GH-1270).
        # The four fan-in steps are for_each joins, which all execute under the
        # command name for_each.join, so each declares its own join label and the
        # allowlist names those labels instead (GH-1319).
        fleet:
          method: GET
          path: /monitor/fleet
          binding: read_state
          monitor_view: command_state
          labels:
            - discover_mesh_pods
            - list_mesh_deployments
            - list_mesh_services
            - agent_machine_fanin
            - agent_state_fanin
            - agent_tools_fanin
            - agent_events_fanin
            - poll_pod_metrics
        # Same-origin reverse proxy so the fleet UI reads each monitored agent's
        # monitor state and SSE stream, and the trace backend's trace queries,
        # through this server (applications srd004 R2.1, R2.4). No other proxy
        # name is declared (R2.3). Keep the upstreams in sync with the
        # monitored_agents and trace_backend in fleet_ui's config below; an
        # agent the release does not deploy answers 404, which the UI reads as
        # not deployed (R2.2).
        monitor_proxy:
          method: GET
          path: /monitor-proxy/{agent}/{path...}
          binding: monitor_proxy
          monitor_proxy:
            upstreams:
              chatbot: http://127.0.0.1:18082
              rag0: http://127.0.0.1:18087
              rag1: http://127.0.0.1:18097
              collector: http://127.0.0.1:18193
          request:
            path:
              agent: {type: string}
              path: {type: string}
        # The fleet UI is the observer bundle compiled into agent-core; this
        # agent ships no UI files (applications srd004 R9.1, R9.4). The config
        # map is served as ui-config.json beneath the mount (R9.2).
        fleet_ui:
          method: GET
          path: /ui/{path...}
          binding: static_assets
          static_assets:
            bundle: observer
            spa: true
            config:
              title: Chatbot Mesh observer
              monitored_agents:
                - {name: chatbot, label: Chatbot}
                - {name: rag0, label: RAG server 0}
                - {name: rag1, label: RAG server 1}
              trace_backend: collector
          request:
            path:
              path: {type: string}
        root_redirect:
          method: GET
          path: /
          binding: redirect
          redirect: {location: /ui/, status: 302}
