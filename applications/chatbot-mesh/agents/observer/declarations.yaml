tools:
  - name: launch_observer_control
    type: builtin
    init: rest_server_launch
    visibility: internal
    category: boundary
    description: Launch the observer's lifecycle control REST server.
    problem: The observer needs a lifecycle exit endpoint so a supervisor or the demo deck can stop it cleanly.
    goals:
      - Register the lifecycle exit and health routes.
      - Keep control access inside the existing REST server tool path.
    requirements:
      input:
        - Tool config references the trusted observer control REST server definition.
      output:
        - Output reports server name, bound address, route count, and binding kinds.
      errors:
        - Config, bind, route conflict, and schema failures emit CommandError.
    non_goals:
      - Does not serve monitor reads.
    parameters:
      type: object
      properties: {}
    emits: [ServerLaunched, CommandError]
    output:
      description: Control REST server launch result.
      schema:
        type: object
        properties:
          server: {type: string}
          address: {type: string}
          route_count: {type: integer}
          bindings: {type: array}
    side_effects:
      - kind: network_listen
        target: observer_control_server
        state: listener_started
      - kind: state_mutation
        target: rest_server_state
        state: routes_registered
    reversibility:
      classification: compensatable
    undo:
      strategy: compensating_action
      description: Stop the control REST server if the launch command owns the listener.
    errors:
      - signal: CommandError
        condition: Control REST server config, bind, route, or schema failure.
        state_after_failure: No control route is exposed.
    relationships:
      before: [launch_observer_monitor, await_observer_control]
    config:
      rest_ref: observer_control

  - name: launch_observer_monitor
    type: builtin
    init: rest_server_launch
    visibility: internal
    category: boundary
    description: Launch the observer's monitor REST server with read-state and stream endpoints.
    problem: The observer needs its own monitor surface so the demo deck and other tools can observe the observer itself.
    goals:
      - Register monitor snapshot, metadata, stream, and UX routes.
      - Keep monitor access inside the existing REST server tool path.
    requirements:
      input:
        - Tool config references the trusted observer monitor REST server definition.
      output:
        - Output reports server name, bound address, route count, and binding kinds.
      errors:
        - Config, bind, route conflict, and schema failures emit CommandError.
    non_goals:
      - Does not serve lifecycle control.
    parameters:
      type: object
      properties: {}
    emits: [ServerLaunched, CommandError]
    output:
      description: Monitor REST server launch result.
      schema:
        type: object
        properties:
          server: {type: string}
          address: {type: string}
          route_count: {type: integer}
          bindings: {type: array}
    side_effects:
      - kind: network_listen
        target: observer_monitor_server
        state: listener_started
      - kind: state_mutation
        target: rest_server_state
        state: routes_registered
    reversibility:
      classification: compensatable
    undo:
      strategy: compensating_action
      description: Stop the monitor REST server if the launch command owns the listener.
    errors:
      - signal: CommandError
        condition: Monitor REST server config, bind, route, or schema failure.
        state_after_failure: No monitor route is exposed.
    relationships:
      after: [launch_observer_control]
      before: [discover_mesh_pods]
    config:
      rest_ref: observer_monitor

  - name: discover_mesh_pods
    type: builtin
    init: rest_client_get
    category: boundary
    description: Poll the Kubernetes API for mesh agent pods matching the release label selector.
    problem: The observer needs to discover which agents are running so it can poll their monitor surfaces.
    goals:
      - Issue a GET to the kube API pod-list endpoint scoped to the release namespace and label selector.
      - Return pod names and addresses for monitor fan-in.
    requirements:
      input:
        - REST client config supplies the kube API base URL, namespace, and label selector.
      output:
        - Output reports discovered pod names and IP addresses.
      errors:
        - Network, timeout, auth, and mapping failures emit CommandError.
    non_goals:
      - Does not watch for changes; this is a polling discovery.
      - Does not write to the Kubernetes API.
    parameters:
      type: object
      properties: {}
    emits: [PodsDiscovered, CommandError]
    output:
      description: List of discovered mesh agent pods.
      schema:
        type: object
        properties:
          # Whole Kubernetes Pod objects, mapped straight from $.items rather
          # than reshaped: the fan-out addresses $from(pod).status.podIP and
          # $from(pod).metadata.labels.monitorPort, which are paths into the API
          # object. The schema described a {name, ip, labels} projection nothing
          # produces and nothing reads.
          pods:
            type: array
            items:
              type: object
    side_effects:
      - kind: external_api
        target: kubernetes.pods.list
        state: read_only
    reversibility:
      classification: reversible
    undo:
      strategy: noop
      description: Read-only operation; no undo needed.
    errors:
      - signal: CommandError
        condition: Network, timeout, 403 forbidden, or response mapping failure.
        state_after_failure: Discovery result is empty; polling falls back to next cycle.
    relationships:
      after: [launch_observer_monitor]
      before: [read_agent_machine]
    config:
      rest_ref: kube_api
      operation: list_pods

  - name: list_mesh_deployments
    type: builtin
    init: rest_client_get
    category: boundary
    description: List the release Deployments for the topology view.
    problem: The fleet view needs the deployment topology, not only the pod set, to show what the deployment looks like.
    goals:
      - GET the kube API Deployment-list endpoint scoped to the release namespace and label selector.
      - Return Deployment items so the UX can group pods by their owning Deployment.
    requirements:
      input:
        - REST client config supplies the kube API base URL, namespace, and label selector.
      output:
        - Output reports the discovered Deployment items.
      errors:
        - Network, timeout, auth, and mapping failures emit CommandError; the cycle degrades to the next step.
    non_goals:
      - Does not write to the Kubernetes API.
    parameters:
      type: object
      properties: {}
    emits: [DeploymentsListed, CommandError]
    output:
      description: List of release Deployments.
      schema:
        type: object
        properties:
          deployments: {type: array}
    side_effects:
      - kind: external_api
        target: kubernetes.deployments.list
        state: read_only
    reversibility:
      classification: reversible
    undo:
      strategy: noop
      description: Read-only operation; no undo needed.
    errors:
      - signal: CommandError
        condition: Network, timeout, 403 forbidden, or response mapping failure.
        state_after_failure: Topology omits Deployments this cycle; the loop proceeds.
    relationships:
      after: [discover_mesh_pods]
      before: [list_mesh_services]
    config:
      rest_ref: kube_api
      operation: list_deployments

  - name: list_mesh_services
    type: builtin
    init: rest_client_get
    category: boundary
    description: List the release Services for the topology view.
    problem: The topology view groups pods behind the Services that front them.
    goals:
      - GET the kube API Service-list endpoint scoped to the release namespace and label selector.
      - Return Service items so the UX can render the fronting Services.
    requirements:
      input:
        - REST client config supplies the kube API base URL, namespace, and label selector.
      output:
        - Output reports the discovered Service items.
      errors:
        - Network, timeout, auth, and mapping failures emit CommandError; the cycle degrades to the next step.
    non_goals:
      - Does not write to the Kubernetes API.
    parameters:
      type: object
      properties: {}
    emits: [ServicesListed, CommandError]
    output:
      description: List of release Services.
      schema:
        type: object
        properties:
          services: {type: array}
    side_effects:
      - kind: external_api
        target: kubernetes.services.list
        state: read_only
    reversibility:
      classification: reversible
    undo:
      strategy: noop
      description: Read-only operation; no undo needed.
    errors:
      - signal: CommandError
        condition: Network, timeout, 403 forbidden, or response mapping failure.
        state_after_failure: Topology omits Services this cycle; the loop proceeds.
    relationships:
      after: [list_mesh_deployments]
      before: [read_agent_machine]
    config:
      rest_ref: kube_api
      operation: list_services

  - name: poll_pod_metrics
    type: builtin
    init: rest_client_get
    category: boundary
    description: Poll metrics.k8s.io for per-pod CPU and memory usage.
    problem: The fleet view needs each pod's resource usage to show what the deployment consumes.
    goals:
      - GET the namespaced metrics.k8s.io PodMetrics endpoint scoped to the label selector.
      - Return per-pod CPU and memory usage for the fleet cards.
    requirements:
      input:
        - REST client config supplies the kube API base URL, namespace, and label selector.
      output:
        - Output reports pod resource-usage items.
      errors:
        - An absent metrics API (404) or other failure emits CommandError; resource usage is reported unavailable and the loop proceeds.
    non_goals:
      - Does not write to the Kubernetes API.
      - Does not fail discovery or fan-in when metrics are unavailable.
    parameters:
      type: object
      properties: {}
    emits: [MetricsPolled, CommandError]
    output:
      description: Per-pod resource usage from metrics.k8s.io.
      schema:
        type: object
        properties:
          pod_metrics: {type: array}
    side_effects:
      - kind: external_api
        target: kubernetes.podmetrics.list
        state: read_only
    reversibility:
      classification: reversible
    undo:
      strategy: noop
      description: Read-only operation; no undo needed.
    errors:
      - signal: CommandError
        condition: The metrics API is absent (no metrics-server) or the read fails.
        state_after_failure: Resource usage is reported as unavailable; topology and fan-in are unaffected.
    relationships:
      after: [read_agent_events]
      before: [await_observer_control]
    config:
      rest_ref: kube_api
      operation: list_pod_metrics

  # One word per monitor endpoint. Each reads one endpoint on one discovered pod,
  # and the machine's for_each expands it over the pod set, so a REST dispatch
  # stays at one request (srd028 R5.8) and the iteration stays visible in
  # MachineSpec rather than hidden inside a compound word (srd028 R1.5). The
  # for_each join aggregates the per-pod outcomes. Its succeeded and failed
  # counts are not the reachable split: the poll continues past an unreachable
  # pod, so the join counts every dispatched item as succeeded. Reachability is
  # each item's own recorded result signal, which the join keeps per item, and
  # that is what the fleet view reads (machine.yaml says the same).
  - name: read_agent_machine
    type: builtin
    init: rest_client_get
    category: boundary
    description: Read one discovered agent's declared machine from its monitor surface.
    problem: The fleet view needs each running agent's declared machine to show what program it is executing.
    goals:
      - GET /monitor/machine on the pod the iterator selected.
      - Return the machine payload for that agent's fleet entry.
    requirements:
      input:
        - The iterator binds one discovered pod supplying its address and monitor port.
      output:
        - Output reports the agent's declared machine payload.
      errors:
        - An unreachable or slow agent emits CommandError, degrading only that agent.
    non_goals:
      - Does not iterate the pod set; the machine's for_each does.
      - Does not consume SSE streams (srd008 R2.4).
    parameters:
      type: object
      properties: {}
    emits: [AgentMonitorRead, CommandError]
    output:
      description: One agent's declared machine.
      schema:
        type: object
        properties:
          status: {type: integer}
          body: {type: object}
          selected_authority: {type: string}
    side_effects:
      - kind: external_api
        target: agent.monitor
        state: read_only
    reversibility:
      classification: reversible
    undo:
      strategy: noop
      description: Read-only operation; no undo needed.
    errors:
      - signal: CommandError
        condition: Network, timeout, target resolution, or mapping failure for this agent.
        state_after_failure: The fan-in records this agent as unreachable and continues with the others.
    relationships:
      after: [discover_mesh_pods]
      before: [read_agent_state]
    config:
      rest_ref: agent_monitor
      operation: read_agent_machine

  - name: read_agent_state
    type: builtin
    init: rest_client_get
    category: boundary
    description: Read one discovered agent's current run state from its monitor surface.
    problem: The fleet view needs each agent's live run state to show what it is doing right now.
    goals:
      - GET /monitor/state on the pod the iterator selected.
      - Return the run snapshot for that agent's fleet entry.
    requirements:
      input:
        - The iterator binds one discovered pod supplying its address and monitor port.
      output:
        - Output reports the agent's run snapshot, diagnostics, and recent errors.
      errors:
        - An unreachable or slow agent emits CommandError, degrading only that agent.
    non_goals:
      - Does not iterate the pod set; the machine's for_each does.
      - Does not consume SSE streams (srd008 R2.4).
    parameters:
      type: object
      properties: {}
    emits: [AgentMonitorRead, CommandError]
    output:
      description: One agent's run state.
      schema:
        type: object
        properties:
          status: {type: integer}
          body: {type: object}
          selected_authority: {type: string}
    side_effects:
      - kind: external_api
        target: agent.monitor
        state: read_only
    reversibility:
      classification: reversible
    undo:
      strategy: noop
      description: Read-only operation; no undo needed.
    errors:
      - signal: CommandError
        condition: Network, timeout, target resolution, or mapping failure for this agent.
        state_after_failure: The fan-in records this agent as unreachable and continues with the others.
    relationships:
      after: [read_agent_machine]
      before: [read_agent_tools]
    config:
      rest_ref: agent_monitor
      operation: read_agent_state

  - name: read_agent_tools
    type: builtin
    init: rest_client_get
    category: boundary
    description: Read one discovered agent's tool vocabulary from its monitor surface.
    problem: The fleet view needs each agent's declared tools to show the vocabulary it can execute.
    goals:
      - GET /monitor/tools on the pod the iterator selected.
      - Return the tool list for that agent's fleet entry.
    requirements:
      input:
        - The iterator binds one discovered pod supplying its address and monitor port.
      output:
        - Output reports the agent's declared tool list.
      errors:
        - An unreachable or slow agent emits CommandError, degrading only that agent.
    non_goals:
      - Does not iterate the pod set; the machine's for_each does.
      - Does not consume SSE streams (srd008 R2.4).
    parameters:
      type: object
      properties: {}
    emits: [AgentMonitorRead, CommandError]
    output:
      description: One agent's tool vocabulary.
      schema:
        type: object
        properties:
          status: {type: integer}
          body: {type: object}
          selected_authority: {type: string}
    side_effects:
      - kind: external_api
        target: agent.monitor
        state: read_only
    reversibility:
      classification: reversible
    undo:
      strategy: noop
      description: Read-only operation; no undo needed.
    errors:
      - signal: CommandError
        condition: Network, timeout, target resolution, or mapping failure for this agent.
        state_after_failure: The fan-in records this agent as unreachable and continues with the others.
    relationships:
      after: [read_agent_state]
      before: [read_agent_events]
    config:
      rest_ref: agent_monitor
      operation: read_agent_tools

  - name: read_agent_events
    type: builtin
    init: rest_client_get
    category: boundary
    description: Read one discovered agent's recent run events from its monitor surface.
    problem: The fleet view needs each agent's recent events to show the path it has taken.
    goals:
      - GET /monitor/events on the pod the iterator selected.
      - Return the recent event list for that agent's fleet entry.
    requirements:
      input:
        - The iterator binds one discovered pod supplying its address and monitor port.
      output:
        - Output reports the agent's recent run events.
      errors:
        - An unreachable or slow agent emits CommandError, degrading only that agent.
    non_goals:
      - Does not iterate the pod set; the machine's for_each does.
      - Does not consume SSE streams (srd008 R2.4).
    parameters:
      type: object
      properties: {}
    emits: [AgentMonitorRead, CommandError]
    output:
      description: One agent's recent run events.
      schema:
        type: object
        properties:
          status: {type: integer}
          body: {type: object}
          selected_authority: {type: string}
    side_effects:
      - kind: external_api
        target: agent.monitor
        state: read_only
    reversibility:
      classification: reversible
    undo:
      strategy: noop
      description: Read-only operation; no undo needed.
    errors:
      - signal: CommandError
        condition: Network, timeout, target resolution, or mapping failure for this agent.
        state_after_failure: The fan-in records this agent as unreachable and continues with the others.
    relationships:
      after: [read_agent_tools]
    config:
      rest_ref: agent_monitor
      operation: read_agent_events

  - name: await_observer_control
    type: builtin
    init: rest_await_event
    visibility: internal
    category: boundary
    description: Wait a bounded interval for a lifecycle control event between discovery cycles.
    problem: The observer needs a timed wait between polling cycles that also accepts lifecycle exit.
    goals:
      - Wait on the control server queue for the declared polling interval.
      - Accept lifecycle exit events.
      - Time out to trigger the next discovery cycle.
    requirements:
      input:
        - Tool config references the trusted observer control REST server queue.
      output:
        - Output reports source, route, signal, and request ID.
      errors:
        - Missing server, stopped server, and queue failures emit declared signals.
    non_goals:
      - Does not read or mutate monitor snapshots.
    parameters:
      type: object
      properties: {}
    emits: [ExitRequested, AwaitTimedOut, ServerStopped, CommandError]
    output:
      description: Selected control event or timeout.
      schema:
        type: object
        properties:
          source: {type: string}
          route: {type: string}
          signal: {type: string}
          request_id: {type: string}
    side_effects:
      - kind: state_mutation
        target: rest_server_queue
        state: selected_event_consumed
    reversibility:
      classification: reversible
    undo:
      strategy: queue_event_restore
      description: Restore the receipt-recorded event to the front of its source queue.
      payload: rest_await_event
      captures: [source, event]
    errors:
      - signal: CommandError
        condition: Control source is missing or stopped with command_error policy.
        state_after_failure: Control listener state is unchanged.
    relationships:
      after: [launch_observer_control]
      before: [stop_observer_control]
    config:
      sources:
        - server: observer_control
          routes: [exit]
          signals: [ExitRequested]
      timeout: ${OBSERVER_POLL_INTERVAL:-10s}
      stopped_behavior: emit_server_stopped

  - name: stop_observer_monitor
    type: builtin
    init: rest_server_stop
    visibility: internal
    category: boundary
    description: Stop the observer's monitor REST server.
    problem: The observer must release its monitor listener before reaching terminal state.
    goals:
      - Stop the configured monitor REST server.
      - Drain queued events according to server shutdown config.
      - Emit ServerStopped so the machine can route to the next stop.
    requirements:
      input:
        - Tool config references the trusted observer monitor REST server definition.
      output:
        - Output reports server name, bound address, and stopped status.
      errors:
        - Missing server, shutdown timeout, and cleanup failures emit CommandError.
    non_goals:
      - Does not restart the server.
    parameters:
      type: object
      properties: {}
    emits: [ServerStopped, CommandError]
    output:
      description: Monitor REST server stop result.
      schema:
        type: object
        properties:
          server: {type: string}
          address: {type: string}
          status: {type: string}
    side_effects:
      - kind: network_listener_shutdown
        target: observer_monitor_server
        state: listener_stopped
      - kind: state_mutation
        target: rest_server_state
        state: server_stopped
    reversibility:
      classification: compensatable
    undo:
      strategy: server_shutdown_or_user_action_compensation
      description: The receipt records shutdown loss; MachineSpec must relaunch the monitor definition.
      payload: boundary_compensation
      captures: [server, address, relaunch_requirement]
    errors:
      - signal: CommandError
        condition: Monitor REST server is missing, shutdown times out, or cleanup fails.
        state_after_failure: Monitor listener state may be partially stopped.
    relationships:
      after: [launch_observer_monitor]
    config:
      rest_ref: observer_monitor

  - name: stop_observer_control
    type: builtin
    init: rest_server_stop
    visibility: internal
    category: boundary
    description: Stop the observer's lifecycle control REST server.
    problem: The observer must release its control listener as the final stop before terminal state.
    goals:
      - Stop the configured control REST server.
      - Emit ServerStopped so the machine routes to Done.
    requirements:
      input:
        - Tool config references the trusted observer control REST server definition.
      output:
        - Output reports server name, bound address, and stopped status.
      errors:
        - Missing server, shutdown timeout, and cleanup failures emit CommandError.
    non_goals:
      - Does not restart the server.
    parameters:
      type: object
      properties: {}
    emits: [ServerStopped, CommandError]
    output:
      description: Control REST server stop result.
      schema:
        type: object
        properties:
          server: {type: string}
          address: {type: string}
          status: {type: string}
    side_effects:
      - kind: network_listener_shutdown
        target: observer_control_server
        state: listener_stopped
      - kind: state_mutation
        target: rest_server_state
        state: server_stopped
    reversibility:
      classification: compensatable
    undo:
      strategy: server_shutdown_or_user_action_compensation
      description: The receipt records shutdown loss; MachineSpec must relaunch the control definition.
      payload: boundary_compensation
      captures: [server, address, relaunch_requirement]
    errors:
      - signal: CommandError
        condition: Control REST server is missing, shutdown times out, or cleanup fails.
        state_after_failure: Control listener state may be partially stopped.
    relationships:
      after: [await_observer_control]
    config:
      rest_ref: observer_control
