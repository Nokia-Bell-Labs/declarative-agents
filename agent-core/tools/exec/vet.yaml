unit: exec-vet
tools:
- name: vet
  type: exec
  binary: go
  args:
  - vet
  - ./...
  signature:
    emits:
    - ToolDone
    - ToolFailed
  description: Run go vet ./... on the workspace. Reports suspicious constructs.
  category: boundary
  output:
    description: Raw go vet command output.
    schema:
      type: string
  side_effects:
  - kind: child_process
    target: go_toolchain
    state: read_only
    description: Runs `go vet ./...` as a child process. Read-only because the
      command only reports findings and leaves no repository mutation to reverse.
  - kind: filesystem_read
    target: workspace
    description: Reads Go source, module, and test files from the workspace.
  reversibility:
    classification: reversible
    requires_confirmation: false
  errors:
  - signal: CommandError
    condition: the command cannot be started or the workspace is invalid
    message_shape: 'vet: <error>'
    state_after_failure: workspace unchanged by agent-core
  - signal: ToolFailed
    condition: the command exits non-zero
    message_shape: <captured command output>
    state_after_failure: workspace unchanged by agent-core
  undo:
    strategy: noop
    description: Validation command has no direct repository mutations to reverse.
