# A library unit: the tool the library-import fixtures reach.
kind: tool-declaration
schema_version: 1
unit: demo-lib-tools
tools:
  - name: pass_through
    type: builtin
    init: normalize_vector
    category: word
    visibility: internal
    description: Pass the message on, from the library.
    config: {path: vector, signal: Passed}
    signature:
      input: builtin.Message<$T>
      emits:
        - {signal: Passed, message: builtin.Message<$T>}
        - {signal: CommandError, message: builtin.Message<builtin.Text>}
