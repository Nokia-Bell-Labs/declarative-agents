rest:
  version: v1
  auth:
    none:
      type: none
  limits:
    # The Chroma and Ollama authorities are deployment-supplied and move together
    # with their clients' base_url below. A developer host answers both on
    # loopback, which is where the defaults come from; in a pod they are
    # Services, and an allowlist still pinned to 127.0.0.1 would refuse the
    # repointed base URL rather than reach it.
    local_corpus:
      timeout: 30s
      read_timeout: 30s
      max_request_bytes: 1048576
      max_response_bytes: 1048576
      redirect:
        mode: none
      network:
        schemes: [http]
        # Block sequences, unquoted: a ${...} reference inside [ ] is not valid
        # YAML, and this file is read unexpanded by the declaration checks.
        hosts:
          - ${CHROMA_HOST:-127.0.0.1}
          - ${CORPUS_INGEST_OLLAMA_HOST:-127.0.0.1}
        ports:
          - ${CHROMA_PORT:-8000}
          - ${CORPUS_INGEST_OLLAMA_PORT:-11434}
  clients:
    ollama:
      base_url: ${CORPUS_INGEST_OLLAMA_URL:-http://127.0.0.1:11434}
      auth_ref: none
      limits_ref: local_corpus
      operations:
        version:
          method: GET
          path: /api/version
          params:
            body_source: none
          success: {status: [200], signal: OllamaReady}
          response:
            output:
              version: $.version
          side_effects:
            - kind: external_api
              target: ollama.version
              state: read_only
          reversibility:
            classification: reversible
            undo: noop
        embed:
          method: POST
          path: /api/embeddings
          params:
            body_schema:
              type: object
              required: [input]
              properties:
                input: {type: string}
                id: {type: string}
            body_source: previous_result
            input_mapping:
              input: $.raw
              id: $.path
            carry_forward: [input, id]
          body:
            model: ${CORPUS_EMBEDDING_MODEL:-qwen3-embedding:8b}
            prompt: "{{ params.input }}"
          success: {status: [200], signal: DocumentEmbedded}
          response:
            output:
              embedding: $.embedding
          side_effects:
            - kind: external_api
              target: ollama.embeddings
              state: read_only
          reversibility:
            classification: reversible
            undo: noop
    chroma:
      # The same reference the creator's own count words read
      # (agents/creator/rest.yaml), so the collection the child writes and the
      # collection the creator counts are addressed through one value.
      base_url: ${CHROMA_URL:-http://127.0.0.1:8000}
      auth_ref: none
      limits_ref: local_corpus
      operations:
        heartbeat:
          method: GET
          path: /api/v2/heartbeat
          params:
            body_source: none
          success: {status: [200], signal: ChromaReady}
          side_effects:
            - kind: external_api
              target: chroma.heartbeat
              state: read_only
          reversibility:
            classification: reversible
            undo: noop
        create_or_get_collection_carry:
          method: POST
          path: /api/v2/tenants/default_tenant/databases/default_database/collections
          params:
            body_schema:
              type: object
              required: [embeddings, documents, ids]
              properties:
                embeddings: {type: array}
                documents: {type: string}
                ids: {type: string}
            body_source: previous_result
            input_mapping:
              embeddings: $.mapped.embedding
              documents: $.carried.input
              ids: $.carried.id
            carry_forward: [embeddings, documents, ids]
          body:
            # The same reference the creator's resolve_ingest_collection reads,
            # so the collection this child writes and the collection the creator
            # counts before and after it are one value. Two literals that agreed
            # by coincidence let a count delta pass over the wrong collection.
            name: ${CORPUS_INGEST_COLLECTION:-corpus}
            get_or_create: true
          success: {status: [200, 201], signal: CollectionReady}
          response:
            output:
              collection_id: $.id
          side_effects:
            - kind: external_api
              target: chroma.collection
              state: collection_upserted
          reversibility:
            classification: reversible
            undo: noop
        create_or_get_collection:
          method: POST
          path: /api/v2/tenants/default_tenant/databases/default_database/collections
          params:
            body_source: previous_result
            input_mapping: {}
          body:
            # The same reference the creator's resolve_ingest_collection reads,
            # so the collection this child writes and the collection the creator
            # counts before and after it are one value. Two literals that agreed
            # by coincidence let a count delta pass over the wrong collection.
            name: ${CORPUS_INGEST_COLLECTION:-corpus}
            get_or_create: true
          success: {status: [200, 201], signal: CollectionReady}
          response:
            output:
              collection_id: $.id
          side_effects:
            - kind: external_api
              target: chroma.collection
              state: collection_upserted
          reversibility:
            classification: reversible
            undo: noop
        add_records:
          method: POST
          path: /api/v2/tenants/default_tenant/databases/default_database/collections/{collection}/add
          params:
            path:
              collection: {type: string}
            body_schema:
              type: object
              required: [embeddings, documents, ids]
              properties:
                embeddings: {type: array}
                documents: {type: string}
                ids: {type: string}
            body_source: previous_result
            input_mapping:
              collection: $.mapped.collection_id
              embeddings: $.carried.embeddings
              documents: $.carried.documents
              ids: $.carried.ids
          body:
            embeddings: ["{{ params.embeddings }}"]
            documents: ["{{ params.documents }}"]
            ids: ["{{ params.ids }}"]
          success: {status: [200, 201], signal: DocumentAdded}
          side_effects:
            - kind: external_api
              target: chroma.records
              state: records_added
          reversibility:
            classification: compensatable
            undo: delete_records
          compensation:
            operation: delete_records
            reason: Delete the inserted record IDs from the trusted collection.
        delete_records:
          method: POST
          path: /api/v2/tenants/default_tenant/databases/default_database/collections/{collection}/delete
          params:
            path:
              collection: {type: string}
            body_schema:
              type: object
              required: [ids]
              properties:
                ids: {type: string}
          body:
            ids: ["{{ params.ids }}"]
          success: {status: [200], signal: DocumentDeleted}
          side_effects:
            - kind: external_api
              target: chroma.records
              state: records_deleted
          reversibility:
            classification: irreversible
            undo: irreversible
            requires_confirmation: true
        count_records:
          method: GET
          path: /api/v2/tenants/default_tenant/databases/default_database/collections/{collection}/count
          params:
            path:
              collection: {type: string}
            body_source: previous_result
            input_mapping:
              collection: $.mapped.collection_id
          success: {status: [200], signal: CountReady}
          side_effects:
            - kind: external_api
              target: chroma.count
              state: read_only
          reversibility:
            classification: reversible
            undo: noop
