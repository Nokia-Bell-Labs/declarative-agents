id: voice-forge-specifications
title: Voice Forge Specification Index

overview: |
  This documentation-only index plans release 00.0 for one serial Voice Forge
  saga: GitHub source capture, immutable original, structure edit, voice edit,
  style edit, independent critique, bounded retry, finalization, one commit,
  push, and pull request.

  Eight specified SRDs define service authority, the saga workproduct
  lifecycle, the closed tool vocabulary, the flat workflow-orchestrator
  machine, and the flat structure-editor, voice-editor, and style-editor
  machines, and the independent voice-critic machine and Pangram boundary. One
  planned use case and one planned test suite will trace all eight SRDs reciprocally.
  No profile, service, tool, test, or executable evidence is implemented.

  Shared application and agent-core requirements remain external references.
  Local SRDs will cite them and define only Voice Forge behavior and stricter
  authority boundaries.

