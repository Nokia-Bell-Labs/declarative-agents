# Fixture for R-APP-005 (GH-805): the request-reply ping-pong with b's budget on its cycle; the engine
# carries the hop count on the request into b's run and stops the chain at b (R-RUN-005).
kind: application-profile
schema_version: 1
application: pingpong-probe
ownership: composition-only
capabilities:
  runnable_module:
    status: planned
channels:
  - {id: ask, schema: agents/channels/ball.yaml, pattern: request-reply}
  - {id: poke, schema: agents/channels/ball.yaml}
services:
  - {id: a, ownership: local, source: agents/a/profile.yaml, emits: [ask], consumes: [poke]}
  - {id: b, ownership: local, source: agents/b/profile.yaml, listens: [ask], consumes: [ask], emits: [poke], budget: 3}
