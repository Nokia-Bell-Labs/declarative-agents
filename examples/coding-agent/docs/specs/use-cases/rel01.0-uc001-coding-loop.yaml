id: rel01.0-uc001-coding-loop
title: Planner Materializes, Executor Changes, and Critic Gates

summary: |
  An operator supplies an SRD, requirement graph, and isolated workspace to the
  coding application. The canonical planner profile materializes one task and
  delegates it to the canonical executor profile. The executor changes the
  workspace and runs declared validation. The canonical critic profile evaluates
  the produced change with a suite and oracle. Only a successful executor result
  and an accepting critic report produce the application's successful terminal
  outcome.

actor: A developer or delivery system requesting a validated implementation of an SRD requirement.

trigger: |
  The actor submits a coding request containing the SRD and requirement graph,
  an isolated workspace, model configuration, and critic evaluation inputs.

preconditions:
  - The application package pins an agent-profiles library version and contains the resolved planner, executor, and critic profile closure.
  - The workspace contains the baseline source and its validation command.
  - The planner and executor model endpoints are reachable.
  - The canonical changed-workspace critic profile and its declared oracle are available.
  - Planner, executor, and critic run as separate agent-core processes with their selected profiles mounted from the application package.

flow:
  - id: F1
    text: The planner receives the requirement graph, SRD context, planning model config, and workspace reference.
  - id: F2
    text: The planner traverses the requirement graph, assembles and parses a plan, and materializes a task that names the requested workspace change and validation.
  - id: F3
    text: The planner delegates the materialized task, workspace, and execution model config to the real executor profile through child-profile execution.
  - id: F4
    text: The executor invokes its model boundary, dispatches filesystem tools to change the workspace, runs its declared validation tools, and returns terminal status, tool results, validation results, and a task summary.
  - id: F5
    text: The planner records the executor outcome and makes the changed workspace and evidence available to the application evaluation stage.
  - id: F6
    text: The application supplies the produced workspace directly to the canonical changed-workspace critic, which runs its declared oracle in place without launching another coding agent.
  - id: F7
    text: The critic selects its accepted or rejected machine branch from the oracle signal and writes critic-verdict.json with the explicit verdict and oracle evidence.
  - id: F8
    text: The application succeeds only when executor validation succeeds and the critic gate returns an accepting Done report; executor failure, budget exhaustion, or critic rejection produces a failed outcome with evidence.

touchpoints:
  - id: T1
    target: srd004-planner R1, R2, R3, AC1, AC2, AC3
    reason: The planner traverses requirements, materializes the task, delegates through child-profile execution, and records the outcome.
  - id: T2
    target: srd002-executor R1, R2, R3, AC1, AC2, AC3
    reason: The executor receives the task and workspace, edits through declared tools, validates, and returns its explicit outcome.
  - id: T3
    target: srd003-critic R1, R2, R3, AC1, AC2, AC3
    reason: The critic evaluates the produced change through suite points and oracles and returns the gating session report.
  - id: T4
    target: architecture-coding-agent-example components
    reason: The application architecture owns the planner to executor to critic sequence and one-container-per-agent topology.
  - id: T5
    target: architecture-coding-agent-example design_decisions 1, 2, 3
    reason: The flow references canonical library agents, uses package-time profile closure, and keeps the runtime image profile-free.
  - id: T6
    target: test-rel01.0-coding-loop
    reason: The suite proves the loop in live-executor, real-planner-delegation, and critic-gate stages.

success_criteria:
  - id: S1
    criterion: The real executor changes the isolated workspace for the supplied task, its declared validation command succeeds, and it returns a traceable successful result.
    traces:
      - srd002-executor R1.1
      - srd002-executor R3.1
      - srd002-executor R3.2
      - srd002-executor AC1
      - srd002-executor AC3
  - id: S2
    criterion: The real planner materializes the task from SRD context and delegates it to the real executor profile without a shell-script or fake agent binary.
    traces:
      - srd004-planner R1.1
      - srd004-planner R1.2
      - srd004-planner R2.1
      - srd004-planner R3.1
      - srd004-planner AC1
      - srd004-planner AC3
  - id: S3
    criterion: The canonical critic evaluates the produced change in place and emits a machine-readable accepted or rejected verdict whose value gates the application outcome.
    traces:
      - srd003-critic R1.1
      - srd003-critic R1.2
      - srd003-critic R3.1
      - srd003-critic R3.2
      - srd003-critic AC1
      - srd003-critic AC3
  - id: S4
    criterion: All three stages use profiles from one pinned package-time closure while every process runs the unchanged profile-free agent-core image.
    traces:
      - architecture-coding-agent-example design_decisions 1
      - architecture-coding-agent-example design_decisions 2
      - architecture-coding-agent-example design_decisions 3

out_of_scope:
  - Defining or changing planner, executor, or critic family behavior.
  - Copying library profiles or SRDs into the application.
  - Implementing the profile reference resolver, package manifest, or Helm chart.
  - Proving multi-task scheduling, retries across failed critic sessions, or human approval.
  - Replacing library conformance tests with this application integration suite.

test_suite: test-rel01.0-coding-loop
status: implemented
