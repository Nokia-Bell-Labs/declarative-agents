name: unassign
purpose: |-
  Give back an issue assigned to you, so it can be popped or assigned
  again (srd013). Use when a person asks to give back or unassign their
  issue.

  This machine has no model state: scrum-master issue unassign (design.md
  D10, D14; GH-2866). SCRUM_MASTER_PROJECT and SCRUM_MASTER_ISSUE name the
  issue.
configuration:
  machine: plugin/agents/unassign/machine.yaml
  tools: plugin/agents/unassign/tools.yaml
invariants:
- Every step is a word; no model acts anywhere in this machine
- A refusal ends the run in the state that names it, with the word's reason
lifecycle: |-
  1. Idle → Unassign (Seed): scrum-master issue unassign
  2. Unassign → Done (ToolDone)
initial_state: Idle
budget:
  command_timeout: 16m
  max_iterations: 10
states:
- name: Idle
  meaning: Initial state before the first word.
- name: Unassign
  meaning: |
    The unassign word: scrum-master issue unassign clears the caller's
    assignment; a started issue on beads is ready again.
- name: Done
  run_status: succeeded
  meaning: |
    Terminal. Every word ran, and the last one reported what it did.
- name: Refused
  run_status: failed
  meaning: |
    Terminal. Giving it back was refused — the issue is someone else's,
    naming them — and the word's reason is the run's last output.
- name: Failed
  run_status: failed
  meaning: Terminal. An infrastructure error outside the words' refusals.
terminal_states:
- Done
- Refused
- Failed
signals:
- name: Seed
  trigger: Loop initialization.
- name: ToolDone
  trigger: A word executed successfully.
- name: ToolFailed
  trigger: A word reported failure — a refusal with its reason.
- name: CommandError
  trigger: Infrastructure-level error (not a tool failure).
transitions:
- state: Idle
  signal: Seed
  next: Unassign
  action: issue_unassign
  summary: true
- state: Unassign
  signal: ToolFailed
  next: Refused
- state: Unassign
  signal: ToolDone
  next: Done
- state: Idle
  signal: CommandError
  next: Failed
- state: Unassign
  signal: CommandError
  next: Failed
