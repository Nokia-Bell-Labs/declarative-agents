  orchestrator_structured_routing_contract: |
    Every parser selects the nested output string of one labeled structured
    exec result, or the stdout returned by one labeled execute_task result.
    Its schema closes every status enum and bounds all strings, arrays, and
    object sizes. Every predicate compares exactly one parsed scalar with one
    configured scalar, emits exactly two configured outcomes, and emits
    CommandError on selector or coercion failure. The entries below abbreviate
    those schemas and configs but are distinct planned ToolDefs.
    Every producing step has an explicit stable transition label. Its Result
    carries recognized version-1 applied redaction metadata before command
    state exposes it. Selectors are receipt-blind, resolve the newest prior
    matching label, and fail with CommandError on an unavailable label, unsafe
    output, malformed JSON object, or missing path. Child response stdout is
    capped at 262144 bytes by the child response contract before the fixed
    compose capture.
  orchestrator_result_schema_contracts:
    common:
      additional_properties: false
      max_properties: 32
      max_stdout_bytes: 262144
      max_document_bytes: 196608
      max_identity_length: 512
      max_path_length: 1024
      max_url_length: 2048
      max_array_items: 256
      sha256_pattern: "^[0-9a-f]{64}$"
      full_commit_pattern: "^[0-9a-f]{40,64}$"
      rule: |
        Each actual parse_structured ToolDef expresses these bounds as JSON
        Schema maxLength, maxItems, maxProperties, pattern, required, enum, and
        additionalProperties false constraints. These prose keys summarize the
        closed schemas; they are not runtime parser extensions.
    status_enums:
      read_workproduct: [read, missing, integrity_failed]
      hash_workproduct: [hashed]
      write_original: [written, reused, conflict]
      write_attempt: [written, reused, conflict]
      append_manifest_revision: [appended, reused, conflict]
      project_manifest_projection_status: [projected, repaired, conflict]
      materialize_final_chain: [materialized, reused, conflict]
      source_resolution: [resolved, missing]
      source_fetch: [fetched, conflict]
      source_blob: [read, missing]
      publication_check: [absent, matching, conflict]
      publication_branch: [created, reused, conflict]
      publication_stage: [staged, conflict]
      publication_commit: [committed, reused, conflict]
      publication_push: [pushed, reused, conflict]
      pull_request_find: [absent, matching, conflict]
      pull_request_create: [created, reused, conflict]
      publication_verification: [verified, conflict]
      child_outcome: [returned, rejected]
      critic_verdict: [pass, warn, reject]
    manifest_route_enums:
      request_mode: [new, resume]
      stage_result: [accepted, rejected, failed, uncertain]
      verdict: [pass, warn, reject, null]
      warn_allowed: [true, false, null]
      responsible_stage: [structure, voice, style, null]
      retry_disposition: [retry, keep_original, fail, null]
      resume_step: [capture, structure, voice, style, critique, finalization, commit, push, pull_request, verification, terminal, null]
      terminal_status: [published, kept_original, failed, publication_blocked, operator_aborted, null]
